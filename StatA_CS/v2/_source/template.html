<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<script>(function(){try{var t=localStorage.getItem("statA-v2-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
{{CSS}}
</style>
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <div class="top-inner">
    <div class="top-title">
      <p class="kicker">{{KICKER}}</p>
      <h1>{{H1}}</h1>
      {{SUBTITLE}}
    </div>
    <div class="top-tools">
      <button type="button" class="tool-btn" data-action="expand">Tout déplier</button>
      <button type="button" class="tool-btn" data-action="collapse">Tout replier</button>
      <button type="button" class="tool-btn" data-action="theme" aria-label="Changer de thème">Thème</button>
    </div>
  </div>
  <nav class="course-nav" aria-label="Pages du cours">{{NAV}}</nav>
</header>
<div class="layout">
  <nav class="toc" aria-label="Sommaire de la page">
    <details class="toc-box" open>
      <summary>Sur cette page</summary>
      {{TOC}}
    </details>
  </nav>
  <main id="main">
{{CONTENT}}
    <nav class="pager" aria-label="Pages voisines">{{PAGER}}</nav>
  </main>
</div>
<footer class="foot">Statistiques avancées 3A (CentraleSupélec, S. Lemler) — guide d'étude pédagogique, version 2. Les numéros de diapositives renvoient aux fichiers Cours1.pdf … Cours6.pdf du dossier parent.</footer>
<script>
{{JS}}
</script>
</body>
</html>
