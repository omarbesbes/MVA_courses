<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<script>(function(){try{var t=localStorage.getItem("ot-v2-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
{{CSS}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-inner">
    <div class="top-title">
      <p class="kicker">{{KICKER}}</p>
      <h1>{{H1}}</h1>
      {{SUBTITLE}}
    </div>
    <div class="top-tools">
      <button type="button" class="tool-btn" data-action="expand">Open all proofs</button>
      <button type="button" class="tool-btn" data-action="collapse">Close all</button>
      <button type="button" class="tool-btn" data-action="theme" aria-label="Switch light/dark theme">Theme</button>
    </div>
  </div>
  <nav class="course-nav" aria-label="Course pages">{{NAV}}</nav>
</header>
<div class="layout">
  <nav class="toc" aria-label="On this page">
    <details class="toc-box" open>
      <summary>On this page</summary>
      {{TOC}}
    </details>
  </nav>
  <main id="main">
{{CONTENT}}
    <nav class="pager" aria-label="Neighbouring pages">{{PAGER}}</nav>
  </main>
</div>
<footer class="foot">{{FOOTER}}</footer>
<script>
{{JS}}
</script>
</body>
</html>
