<svg viewBox="0 0 630 220" role="img" aria-label="Sorted versus nested pairing of two sources and two targets for three exponents" xmlns="http://www.w3.org/2000/svg"><line x1="35.0" y1="52.0" x2="195.0" y2="52.0" class="gr"/><line x1="35.0" y1="138.0" x2="195.0" y2="138.0" class="gr"/><line x1="48.3" y1="52.0" x2="115.0" y2="138.0" class="ln c3"/><line x1="115.0" y1="52.0" x2="181.7" y2="138.0" class="ln c3"/><line x1="48.3" y1="52.0" x2="181.7" y2="138.0" class="ln cm dash"/><line x1="115.0" y1="52.0" x2="115.0" y2="138.0" class="ln cm dash"/><circle cx="48.3" cy="52.0" r="5" class="f2"/><text x="48.3" y="43.0" class="tx-s" text-anchor="middle">0</text><circle cx="115.0" cy="52.0" r="5" class="f2"/><text x="115.0" y="43.0" class="tx-s" text-anchor="middle">1</text><circle cx="115.0" cy="138.0" r="5" class="f1"/><text x="115.0" y="155.0" class="tx-s" text-anchor="middle">1</text><circle cx="181.7" cy="138.0" r="5" class="f1"/><text x="181.7" y="155.0" class="tx-s" text-anchor="middle">2</text><text x="115.0" y="18.0" class="tx-b" text-anchor="middle">p = 2</text><text x="115.0" y="172.0" class="tx-s t3" text-anchor="middle">sorted (green): 2</text><text x="115.0" y="186.0" class="tx-s" text-anchor="middle">nested (grey): 2² = 4</text><text x="115.0" y="206.0" class="tx-b" text-anchor="middle">sorting wins</text><line x1="240.0" y1="52.0" x2="400.0" y2="52.0" class="gr"/><line x1="240.0" y1="138.0" x2="400.0" y2="138.0" class="gr"/><line x1="253.3" y1="52.0" x2="320.0" y2="138.0" class="ln c3"/><line x1="320.0" y1="52.0" x2="386.7" y2="138.0" class="ln c3"/><line x1="253.3" y1="52.0" x2="386.7" y2="138.0" class="ln cm dash"/><line x1="320.0" y1="52.0" x2="320.0" y2="138.0" class="ln cm dash"/><circle cx="253.3" cy="52.0" r="5" class="f2"/><text x="253.3" y="43.0" class="tx-s" text-anchor="middle">0</text><circle cx="320.0" cy="52.0" r="5" class="f2"/><text x="320.0" y="43.0" class="tx-s" text-anchor="middle">1</text><circle cx="320.0" cy="138.0" r="5" class="f1"/><text x="320.0" y="155.0" class="tx-s" text-anchor="middle">1</text><circle cx="386.7" cy="138.0" r="5" class="f1"/><text x="386.7" y="155.0" class="tx-s" text-anchor="middle">2</text><text x="320.0" y="18.0" class="tx-b" text-anchor="middle">p = 1</text><text x="320.0" y="172.0" class="tx-s t3" text-anchor="middle">sorted (green): 2</text><text x="320.0" y="186.0" class="tx-s" text-anchor="middle">nested (grey): 2¹ = 2</text><text x="320.0" y="206.0" class="tx-b" text-anchor="middle">a tie</text><line x1="445.0" y1="52.0" x2="605.0" y2="52.0" class="gr"/><line x1="445.0" y1="138.0" x2="605.0" y2="138.0" class="gr"/><line x1="458.3" y1="52.0" x2="525.0" y2="138.0" class="ln c3"/><line x1="525.0" y1="52.0" x2="591.7" y2="138.0" class="ln c3"/><line x1="458.3" y1="52.0" x2="591.7" y2="138.0" class="ln cm dash"/><line x1="525.0" y1="52.0" x2="525.0" y2="138.0" class="ln cm dash"/><circle cx="458.3" cy="52.0" r="5" class="f2"/><text x="458.3" y="43.0" class="tx-s" text-anchor="middle">0</text><circle cx="525.0" cy="52.0" r="5" class="f2"/><text x="525.0" y="43.0" class="tx-s" text-anchor="middle">1</text><circle cx="525.0" cy="138.0" r="5" class="f1"/><text x="525.0" y="155.0" class="tx-s" text-anchor="middle">1</text><circle cx="591.7" cy="138.0" r="5" class="f1"/><text x="591.7" y="155.0" class="tx-s" text-anchor="middle">2</text><text x="525.0" y="18.0" class="tx-b" text-anchor="middle">p = ½</text><text x="525.0" y="172.0" class="tx-s t3" text-anchor="middle">sorted (green): 2</text><text x="525.0" y="186.0" class="tx-s" text-anchor="middle">nested (grey): √2 ≈ 1.414</text><text x="525.0" y="206.0" class="tx-b" text-anchor="middle">nesting wins</text></svg>
