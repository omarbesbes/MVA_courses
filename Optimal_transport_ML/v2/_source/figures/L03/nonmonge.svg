 y1="37.2" x2="83.0" y2="37.2" class="ln c3 thin" marker-end="url(#L03-nonmonge-arr-3)"/><line x1="183.0" y1="37.2" x2="275.0" y2="37.2" class="ln c3 thin" marker-end="url(#L03-nonmonge-arr-3)"/><text x="179.0" y="232.0" class="tx-s" text-anchor="middle">optimal plan π⋆: each (0, s) sends ½ left, ½ right</text><text x="179.0" y="250.0" class="tx-s t3" text-anchor="middle">horizontal moves only: cost exactly 1</text><path d="M509.0 210.0L509.0 180.0L409.0 150.0L409.0 210.0Z" class="a3 ln c3 hair"/><path d="M509.0 180.0L509.0 150.0L609.0 150.0L609.0 210.0Z" class="a3 ln c3 hair"/><line x1="504.0" y1="180.0" x2="514.0" y2="180.0" class="ln ck hair"/><path d="M509.0 150.0L509.0 120.0L409.0 90.0L409.0 150.0Z" class="a3 ln c3 hair"/><path d="M509.0 120.0L509.0 90.0L609.0 90.0L609.0 150.0Z" class="a3 ln c3 hair"/><line x1="504.0" y1="120.0" x2="514.0" y2="120.0" class="ln ck hair"/><path d="M509.0 90.0L509.0 60.0L409.0 30.0L409.0 90.0Z" class="a3 ln c3 hair"/><path d="M509.0 60.0L509.0 30.0L609.0 30.0L609.0 90.0Z" class="a3 ln c3 hair"/><line x1="504.0" y1="60.0" x2="514.0" y2="60.0" class="ln ck hair"/><line x1="409.0" y1="210.0" x2="409.0" y2="30.0" class="ln c1"/><line x1="609.0" y1="210.0" x2="609.0" y2="30.0" class="ln c1"/><line x1="509.0" y1="210.0" x2="509.0" y2="30.0" class="ln c2"/><text x="409.0" y="22.0" class="tx-s t1" text-anchor="middle">S₋</text><text x="509.0" y="22.0" class="tx-s t2" text-anchor="middle">S₀</text><text x="609.0" y="22.0" class="tx-s t1" text-anchor="middle">S₊</text><text x="402.0" y="214.0" class="tx-s" text-anchor="end">0</text><text x="402.0" y="34.0" class="tx-s" text-anchor="end">1</text><text x="509.0" y="232.0" class="tx-s" text-anchor="middle">a map with n = 3 strips: half of each strip goes left,</text><text x="509.0" y="250.0" class="tx-s t3" text-anchor="middle">half right, stretched ×2: cost 1 + 1/(12n²) ≈ 1.0093</text></svg>
