<svg viewBox="0 0 660 280" role="img" aria-label="Birkhoff contraction: a positive matrix maps the positive quadrant into a narrower cone" xmlns="http://www.w3.org/2000/svg"><text x="40.0" y="260.0" class="tx-s" text-anchor="middle">0</text><text x="88.1" y="260.0" class="tx-s" text-anchor="middle">1</text><text x="136.2" y="260.0" class="tx-s" text-anchor="middle">2</text><text x="184.2" y="260.0" class="tx-s" text-anchor="middle">3</text><text x="232.3" y="260.0" class="tx-s" text-anchor="middle">4</text><text x="280.4" y="260.0" class="tx-s" text-anchor="middle">5</text><text x="35.0" y="205.8" class="tx-s" text-anchor="end">1</text><text x="35.0" y="161.5" class="tx-s" text-anchor="end">2</text><text x="35.0" y="117.3" class="tx-s" text-anchor="end">3</text><text x="35.0" y="73.1" class="tx-s" text-anchor="end">4</text><text x="35.0" y="28.8" class="tx-s" text-anchor="end">5</text><line x1="40.0" y1="246.0" x2="290.0" y2="246.0" class="ax"/><line x1="40.0" y1="246.0" x2="40.0" y2="16.0" class="ax"/><path d="M40.0 246.0L290.0 214.9L290.0 16.0L73.8 16.0Z" class="a3"/><line x1="40.0" y1="246.0" x2="290.0" y2="214.9" class="ln c3 thin"/><line x1="40.0" y1="246.0" x2="73.8" y2="16.0" class="ln c3 thin"/><line x1="40.0" y1="246.0" x2="88.1" y2="69.1" class="ln c2 thin dash"/><circle cx="88.1" cy="69.1" r="3.5" class="f2"/><text x="94.1" y="73.1" class="tx-i t2" text-anchor="start">v</text><line x1="40.0" y1="246.0" x2="184.2" y2="201.8" class="ln c1 thin dash"/><circle cx="184.2" cy="201.8" r="3.5" class="f1"/><text x="190.2" y="205.8" class="tx-i t1" text-anchor="start">v′</text><line x1="40.0" y1="246.0" x2="114.1" y2="63.1" class="ln c2"/><circle cx="114.1" cy="63.1" r="3.5" class="f2"/><text x="120.1" y="59.1" class="tx-i t2" text-anchor="start">Kv</text><line x1="40.0" y1="246.0" x2="190.7" y2="183.8" class="ln c1"/><circle cx="190.7" cy="183.8" r="3.5" class="f1"/><text x="196.7" y="195.8" class="tx-i t1" text-anchor="start">Kv′</text><text x="275.6" y="188.5" class="tx-b t3" text-anchor="end">K R²₊</text><text x="165.0" y="274.0" class="tx-s" text-anchor="middle">rays = vectors up to a positive factor</text><text x="330.0" y="46.0" class="tx-s" text-anchor="start">K = exp(−C/ε) = [[1, e⁻²], [e⁻², 1]]  (running example, ε = 0.5)</text><text x="330.0" y="70.0" class="tx-s" text-anchor="start">Hilbert distance: d(u, u′) = log max(u/u′) − log min(u/u′)</text><text x="330.0" y="94.0" class="tx-s" text-anchor="start">v = (1, 4), v′ = (3, 1):  d(v, v′) = log 12 = 2.485</text><text x="330.0" y="118.0" class="tx-s" text-anchor="start">Kv = (1.541, 4.135),  Kv′ = (3.135, 1.406)</text><text x="330.0" y="142.0" class="tx-s" text-anchor="start">d(Kv, Kv′) = 1.789</text><text x="330.0" y="166.0" class="tx-s" text-anchor="start">η(K) = e⁴ = 54.60,  λ(K) = (√η − 1)/(√η + 1) = tanh 1 = 0.7616</text><text x="330.0" y="190.0" class="tx-b t3" text-anchor="start">Birkhoff: 1.789 ≤ λ · 2.485 = 1.892  ✓</text><text x="330.0" y="214.0" class="tx-s" text-anchor="start">Every vector is sent inside the green cone, whose</text><text x="330.0" y="238.0" class="tx-s" text-anchor="start">Hilbert diameter is log η(K) = 4: K contracts d.</text></svg>
