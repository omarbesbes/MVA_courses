<svg viewBox="0 0 600 320" role="img" aria-label="One step of the fixed-point algorithm: average the optimal maps, then push the current measure" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fixedpoint-arr-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f1"/></marker><marker id="fixedpoint-arr-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f3"/></marker></defs><ellipse cx="110" cy="75" rx="72" ry="34" transform="rotate(-15 110 75)" class="a1 ln c1 thin"/><text x="32.0" y="47.0" class="tx-b t1" text-anchor="end">β₁</text><ellipse cx="345" cy="40" rx="62" ry="26" transform="rotate(8 345 40)" class="a1 ln c1 thin"/><text x="277.0" y="20.0" class="tx-b t1" text-anchor="end">β₂</text><ellipse cx="530" cy="120" rx="50" ry="40" transform="rotate(25 530 120)" class="a1 ln c1 thin"/><text x="474.0" y="86.0" class="tx-b t1" text-anchor="end">β₃</text><ellipse cx="300" cy="252" rx="95" ry="36" class="a2 ln c2 thin"/><text x="402.0" y="276.0" class="tx-b t2" text-anchor="start">α⁽ˡ⁾ (current guess)</text><line x1="300.0" y1="250.0" x2="135.9" y2="87.9" class="ln c1 thin dash" marker-end="url(#fixedpoint-arr-1)"/><circle cx="130" cy="82" r="4" class="f1"/><line x1="300.0" y1="250.0" x2="350.2" y2="47.4" class="ln c1 thin dash" marker-end="url(#fixedpoint-arr-1)"/><circle cx="352" cy="40" r="4" class="f1"/><line x1="300.0" y1="250.0" x2="507.5" y2="129.4" class="ln c1 thin dash" marker-end="url(#fixedpoint-arr-1)"/><circle cx="515" cy="125" r="4" class="f1"/><text x="130.0" y="100.0" class="tx-s t1" text-anchor="middle">T₁(x)</text><text x="362.0" y="44.0" class="tx-s t1" text-anchor="start">T₂(x)</text><text x="515.0" y="143.0" class="tx-s t1" text-anchor="middle">T₃(x)</text><ellipse cx="332.3" cy="92.3" rx="70" ry="24" class="a3 ln c3 thin dash"/><line x1="300.0" y1="250.0" x2="331.5" y2="88.3" class="ln c3" marker-end="url(#fixedpoint-arr-3)"/><circle cx="332.3" cy="82.3" r="5" class="f3"/><text x="341.3" y="86.3" class="tx-b t3" text-anchor="start">T(x)</text><text x="406.3" y="104.3" class="tx-b t3" text-anchor="start">α⁽ˡ⁺¹⁾</text><circle cx="300" cy="250" r="5" class="f2"/><text x="290.0" y="254.0" class="tx-i" text-anchor="end">x</text><text x="300.0" y="312.0" class="tx-s" text-anchor="middle">dashed blue: the optimal maps Tₖ(x);  green arrow: x ↦ T(x) = Σ λₖ Tₖ(x);  green ellipse: α⁽ˡ⁺¹⁾ = T#α⁽ˡ⁾</text></svg>
