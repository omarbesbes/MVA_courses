<svg viewBox="0 0 640 218" role="img" aria-label="Matching three points to three points on the line: crossing versus sorted" xmlns="http://www.w3.org/2000/svg"><line x1="40.0" y1="48.0" x2="300.0" y2="48.0" class="gr"/><line x1="40.0" y1="168.0" x2="300.0" y2="168.0" class="gr"/><line x1="61.7" y1="48.0" x2="278.3" y2="168.0" class="ln c3"/><line x1="105.0" y1="48.0" x2="148.3" y2="168.0" class="ln c3"/><line x1="191.7" y1="48.0" x2="105.0" y2="168.0" class="ln c3"/><circle cx="61.7" cy="48.0" r="6" class="f2"/><text x="61.7" y="37.0" class="tx-s" text-anchor="middle">0</text><circle cx="105.0" cy="48.0" r="6" class="f2"/><text x="105.0" y="37.0" class="tx-s" text-anchor="middle">1</text><circle cx="191.7" cy="48.0" r="6" class="f2"/><text x="191.7" y="37.0" class="tx-s" text-anchor="middle">3</text><circle cx="105.0" cy="168.0" r="6" class="f1"/><text x="105.0" y="188.0" class="tx-s" text-anchor="middle">1</text><circle cx="148.3" cy="168.0" r="6" class="f1"/><text x="148.3" y="188.0" class="tx-s" text-anchor="middle">2</text><circle cx="278.3" cy="168.0" r="6" class="f1"/><text x="278.3" y="188.0" class="tx-s" text-anchor="middle">5</text><text x="170.0" y="18.0" class="tx-b" text-anchor="middle">reversed: (0−5)² + (1−2)² + (3−1)² = 30</text><text x="28.0" y="53.0" class="tx-i t2" text-anchor="end">x</text><text x="28.0" y="173.0" class="tx-i t1" text-anchor="end">y</text><line x1="360.0" y1="48.0" x2="620.0" y2="48.0" class="gr"/><line x1="360.0" y1="168.0" x2="620.0" y2="168.0" class="gr"/><line x1="381.7" y1="48.0" x2="425.0" y2="168.0" class="ln c3"/><line x1="425.0" y1="48.0" x2="468.3" y2="168.0" class="ln c3"/><line x1="511.7" y1="48.0" x2="598.3" y2="168.0" class="ln c3"/><circle cx="381.7" cy="48.0" r="6" class="f2"/><text x="381.7" y="37.0" class="tx-s" text-anchor="middle">0</text><circle cx="425.0" cy="48.0" r="6" class="f2"/><text x="425.0" y="37.0" class="tx-s" text-anchor="middle">1</text><circle cx="511.7" cy="48.0" r="6" class="f2"/><text x="511.7" y="37.0" class="tx-s" text-anchor="middle">3</text><circle cx="425.0" cy="168.0" r="6" class="f1"/><text x="425.0" y="188.0" class="tx-s" text-anchor="middle">1</text><circle cx="468.3" cy="168.0" r="6" class="f1"/><text x="468.3" y="188.0" class="tx-s" text-anchor="middle">2</text><circle cx="598.3" cy="168.0" r="6" class="f1"/><text x="598.3" y="188.0" class="tx-s" text-anchor="middle">5</text><text x="490.0" y="18.0" class="tx-b" text-anchor="middle">sorted: (0−1)² + (1−2)² + (3−5)² = 6</text><text x="348.0" y="53.0" class="tx-i t2" text-anchor="end">x</text><text x="348.0" y="173.0" class="tx-i t1" text-anchor="end">y</text><text x="320.0" y="210.0" class="tx-s" text-anchor="middle">uncrossing two segments never increases a convex cost h(x − y): the sorted matching is optimal</text></svg>
