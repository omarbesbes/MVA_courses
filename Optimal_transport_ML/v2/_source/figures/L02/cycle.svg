<svg viewBox="0 0 660 236" role="img" aria-label="A support with a cycle can be perturbed both ways; the support of a vertex is a forest" xmlns="http://www.w3.org/2000/svg"><text x="150.0" y="20.0" class="tx-b" text-anchor="middle">product plan: 6 edges, a cycle</text><line x1="40" y1="70" x2="190" y2="50" class="ln c3"/><text x="115.0" y="52.0" class="tx-s t3" text-anchor="middle">+ε</text><line x1="40" y1="70" x2="190" y2="115" class="ln c3"/><text x="160.0" y="93.0" class="tx-s t3" text-anchor="middle">−ε</text><line x1="40" y1="70" x2="190" y2="180" class="ln cm thin"/><line x1="40" y1="160" x2="190" y2="50" class="ln c3"/><text x="70.0" y="131.0" class="tx-s t3" text-anchor="middle">−ε</text><line x1="40" y1="160" x2="190" y2="115" class="ln c3"/><text x="115.0" y="158.0" class="tx-s t3" text-anchor="middle">+ε</text><line x1="40" y1="160" x2="190" y2="180" class="ln cm thin"/><circle cx="40" cy="70" r="7" class="f2"/><text x="28.0" y="74.0" class="tx-s t2" text-anchor="end">x₁</text><circle cx="40" cy="160" r="7" class="f2"/><text x="28.0" y="164.0" class="tx-s t2" text-anchor="end">x₂</text><circle cx="190" cy="50" r="7" class="f1"/><text x="202.0" y="54.0" class="tx-s t1" text-anchor="start">y₁</text><circle cx="190" cy="115" r="7" class="f1"/><text x="202.0" y="119.0" class="tx-s t1" text-anchor="start">y₂</text><circle cx="190" cy="180" r="7" class="f1"/><text x="202.0" y="184.0" class="tx-s t1" text-anchor="start">y₃</text><text x="490.0" y="20.0" class="tx-b" text-anchor="middle">a vertex: 4 = n + m − 1 edges, no cycle</text><line x1="380" y1="70" x2="530" y2="50" class="ln c3"/><text x="461.0" y="55.0" class="tx-s t3" text-anchor="middle">.3</text><line x1="380" y1="70" x2="530" y2="115" class="ln c3"/><text x="461.0" y="87.5" class="tx-s t3" text-anchor="middle">.3</text><line x1="380" y1="160" x2="530" y2="115" class="ln c3"/><text x="461.0" y="132.5" class="tx-s t3" text-anchor="middle">.15</text><line x1="380" y1="160" x2="530" y2="180" class="ln c3"/><text x="461.0" y="165.0" class="tx-s t3" text-anchor="middle">.25</text><circle cx="380" cy="70" r="7" class="f2"/><text x="368.0" y="74.0" class="tx-s t2" text-anchor="end">x₁</text><circle cx="380" cy="160" r="7" class="f2"/><text x="368.0" y="164.0" class="tx-s t2" text-anchor="end">x₂</text><circle cx="530" cy="50" r="7" class="f1"/><text x="542.0" y="54.0" class="tx-s t1" text-anchor="start">y₁</text><circle cx="530" cy="115" r="7" class="f1"/><text x="542.0" y="119.0" class="tx-s t1" text-anchor="start">y₂</text><circle cx="530" cy="180" r="7" class="f1"/><text x="542.0" y="184.0" class="tx-s t1" text-anchor="start">y₃</text><text x="150.0" y="222.0" class="tx-s" text-anchor="middle">green cycle: P ± εE keeps all row and column sums</text><text x="490.0" y="222.0" class="tx-s" text-anchor="middle">P = (.3 .3 0 / 0 .15 .25): a path, i.e. a tree</text></svg>
