de dualité]].", "liens": ["2.6.2", "2.6.4", "2.6.12", "3.4.3", "T9"]}, {"id": "2.6.12", "label": "Corollaire 2.6.12 · Rem. 2.6.13", "nom": "La dualité en optimisation convexe", "surnom": "résoudre le dual, puis minimiser le Lagrangien", "sec": "2.6 · Point-selle, Kuhn–Tucker, dualité", "chap": 2, "prio": 3, "qs": ["dual", "cs"], "cadre": "$\\inf_{F\\le0}J$, $\\Lag=J+q\\cdot F$ sur $V\\times(\\R^+)^M$.", "hyp": [["$J,F_1,\\dots,F_M$ **convexes et dérivables** sur $V$", ""], ["$u$ avec $F(u)\\le0$, contraintes **qualifiées** en $u$", ""], ["$u$ minimum global de $J$ sur $K$ (coquille du livre : « sur $V$ »)", ""]], "concl": "Il existe $p\\in(\\R^+)^M$ tel que : (1) $p$ est un **maximum global de $\\mathcal G$** sur $(\\R^+)^M$ ; (2) $(u,p)$ est un point-selle de $\\Lag$ ; (3) $F(u)\\le0$, $p\\ge0$, $p\\cdot F(u)=0$, $J'(u)+p\\cdot F'(u)=0$ (2.78).", "plus": "**Usage** : résoudre le dual (concave, contraintes $q\\ge0$ triviales) → $p$ ; puis $u$ = minimum **sans contrainte** de $\\Lag(\\cdot,p)$. **Rem. 2.6.13** (quadratique) : $\\min_{Bv\\le c}\\frac12Av\\cdot v-b\\cdot v$ ⇒ $u_q=A^{-1}(b-B^*q)$ et le dual $\\sup_{q\\ge0}\\big(-\\frac12q\\cdot BA^{-1}B^*q+(BA^{-1}b-c)\\cdot q-\\frac12A^{-1}b\\cdot b\\big)$ (2.81), unique si $B$ de rang $M$. Formellement $\\mathcal G'(q)=F(u_q)$ : c'est ce qui fonde Uzawa.", "manque": "Pas d'unicité de $p$ a priori ; l'existence de $u$ demande en plus forte convexité ou « infinie à l'infini ». Sans convexité le dual peut être inutile ($\\mathcal G\\equiv-\\infty$ pour $-x^2$ sur $[-1,1]$).", "diff": [["2.6.4", "= Kuhn–Tucker (⇒) + Théorème de dualité 2.6.9."]], "pourquoi": [], "preuve": "§2.6.4 donne le point-selle, §2.6.9 traduit en $\\mathcal G(p)=\\max\\mathcal G$.", "mnemo": "« Exemple fil rouge : $\\min(v-2)^2$ sous $v-1\\le0$ : $u_q=2-\\frac q2$, $\\mathcal G(q)=q-\\frac{q^2}4$, $p=2$, $\\mathcal G(2)=1=\\min J$, et $\\mathcal G'(q)=1-\\frac q2=F(u_q)$. »", "cloze": "Si $J,F_i$ sont [[convexes]] dérivables, $u$ admissible avec contraintes [[qualifiées]] et $u$ minimum global, il existe $p\\ge0$ tel que $p$ soit un [[maximum global]] de la fonction duale $\\mathcal G$ sur $(\\R^+)^M$ et $(u,p)$ un [[point-selle]]. Usage : résoudre le [[dual]], puis $u$ minimise [[$\\Lag(\\cdot,p)$]] sans contrainte. Formellement $\\mathcal G'(q)=[[F(u_q)]]$.", "liens": ["2.6.4", "2.6.9", "3.4.3"]}, {"id": "3.2.1", "label": "Théorème 3.2.1 · Rem. 3.2.2–3.2.5", "nom": "Gradient à pas optimal", "surnom": "descendre jusqu'au fond, puis tourner à angle droit", "sec": "3.2 · Gradient sans contrainte", "chap": 3, "prio": 2, "qs": ["algo"], "cadre": "$\\inf_{v\\in V}J(v)$ ; $u^{n+1}=u^n-\\mu_nJ'(u^n)$ avec $\\mu_n$ réalisant $\\min_{\\mu\\in\\R}J(u^n-\\mu J'(u^n))$ (3.3)–(3.4).", "hyp": [["$J$ **α-convexe** différentiable", "existence/unicité de $u$ (§2.3.8), décroissance (3.7), bornitude"], ["$J'$ **lipschitzienne sur tout borné** : $\\norm v+\\norm w\\le M\\Rightarrow\\norm{J'(v)-J'(w)}\\le L_M\\norm{v-w}$ (3.5)", "automatique si $J$ est $C^2$ (Rem. 3.2.2)"]], "concl": "L'algorithme converge : pour tout $u^0$, $u^n\\to u$ solution de (3.1). En chemin : **deux gradients successifs sont orthogonaux**, $\\ps{J'(u^{n+1})}{J'(u^n)}=0$ (3.6) — d'où le zigzag.", "manque": "Pas de vitesse explicite dans l'énoncé (en pratique géométrique, dépendant de κ) ; une recherche linéaire par itération (Armijo–Goldstein, Wolfe, Rem. 3.2.5) ; le pas optimal peut tendre vers l'infini sur une fonction très plate (Ex. 3.2.3).", "diff": [["3.2.6", "pas fixe : Lipschitz **global** et condition sur $\\mu$, mais vitesse géométrique explicite et preuve par contraction."]], "pourquoi": [["α-convexe", "sans convexité, on converge au mieux vers un point critique (col, Ex. 3.2.7)."]], "preuve": "(1) $j(\\mu)=J(u^n-\\mu J'(u^n))$ fortement convexe : $\\mu_n$ unique, $j'(\\mu_n)=0$ = (3.6). (2) (2.23) en $u^{n+1}$ + (3.6) : $J(u^n)-J(u^{n+1})\\ge\\frac\\alpha2\\norm{u^n-u^{n+1}}^2$ (3.7) ⇒ $u^{n+1}-u^n\\to0$. (3) bornée (croissance quadratique). (4) Pythagore + (3.5) : $\\norm{J'(u^n)}\\to0$. (5) (2.24) : $\\alpha\\norm{u^n-u}\\le\\norm{J'(u^n)}$.", "mnemo": "« Zigzag : chaque nouvelle direction est perpendiculaire à la précédente. » Préconditionnement (Rem. 3.2.4) : $PJ'(u^n)$ reste une direction de descente = changer de produit scalaire.", "cloze": "Gradient à pas optimal : $u^{n+1}=u^n-\\mu_nJ'(u^n)$ avec $\\mu_n$ minimisant [[$\\mu\\mapsto J(u^n-\\mu J'(u^n))$]]. Si $J$ est [[α-convexe]] différentiable et $J'$ [[lipschitzienne sur tout borné]], l'algorithme converge pour tout $u^0$. Propriété : $\\ps{J'(u^{n+1})}{J'(u^n)}=[[0]]$.", "liens": ["3.2.6", "2.3.8", "2.4.4"]}, {"id": "3.2.6", "label": "Théorème 3.2.6 · Rem. 3.2.7–3.2.8", "nom": "Gradient à pas fixe", "surnom": "le triplet magique : α, L, 2α/L²", "sec": "3.2 · Gradient sans contrainte", "chap": 3, "prio": 3, "qs": ["algo"], "diapos": "Diapos : « $J$ α-convexe différentiable, $J'$ lipschitzien sur $V$ de constante $L$ ; si $0<\\mu<2\\alpha/L^2$ : $u_n\\to u$ et $\\norm{u_n-u}\\le\\gamma^n\\norm{u_0-u}$, $\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}<1$. »", "cadre": "$u^{n+1}=u^n-\\mu J'(u^n)$ (3.8), pas $\\mu>0$ fixe.", "hyp": [["$J$ **α-convexe** différentiable", "forte monotonie (2.24) sur le terme croisé"], ["$J'$ **$L$-lipschitzienne sur $V$** (3.9)", "Lipschitz sur le terme carré"], ["$0<\\mu<\\dfrac{2\\alpha}{L^2}$", "pour que $1-2\\alpha\\mu+\\mu^2L^2<1$"]], "concl": "Pour tout $u^0$, $u^n\\to u$ et $$\\norm{u^n-u}\\le\\gamma^n\\norm{u^0-u},\\qquad\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}<1.$$", "plus": "Rem. 3.2.8 : le meilleur pas **pour cette borne** est $\\mu=\\alpha/L^2$, $\\gamma=\\sqrt{1-\\alpha^2/L^2}$ — pessimiste (dépend de $\\kappa^2$). **Trois niveaux de précision** : Th. 3.2.6 ($\\mu<2\\alpha/L^2$) ; §3.3.1 ($C^2$, dim. finie : $\\mu<2/L$, optimum $\\mu=\\frac2{L+\\alpha}$, $\\gamma=\\frac{\\kappa-1}{\\kappa+1}$) ; Ex. 3.2.5 (quadratique : ces valeurs sont optimales).", "manque": "On connaît rarement α et $L$ (Rem. 3.2.7) ; la borne est prudente. Sans α : §3.2.9 (convergence sans vitesse), §3.3.3 (vitesse $1/n$).", "diff": [["3.4.1", "**mêmes hypothèses, même seuil, même γ** : on compose simplement par $P_K$ (1-lipschitzienne)."], ["3.4.3", "Uzawa recopie le triplet, mais c'est $F$ (pas $J'$) qui doit être $L$-lipschitzienne, et la technique devient Lyapunov."], ["3.3.1", "avec $C^2$ et dimension finie : seuil élargi à $2/L$ et taux exact $\\frac{\\kappa-1}{\\kappa+1}$."]], "pourquoi": [["$\\mu$ assez petit", "$J=\\frac L2x^2$ : $u^{n+1}=(1-\\mu L)u^n$ diverge si $\\mu>2/L$."], ["α-convexe", "sans α pas de contraction : $J=x^4/4$, convergence seulement algébrique."]], "preuve": "§T7 contraction : $v^n=u^n-u$, $J'(u)=0$ : $\\norm{v^{n+1}}^2=\\norm{v^n}^2-2\\mu\\ps{J'(u^n)-J'(u)}{u^n-u}+\\mu^2\\norm{J'(u^n)-J'(u)}^2\\le(1-2\\alpha\\mu+\\mu^2L^2)\\norm{v^n}^2$ (3.10). L'application $v\\mapsto v-\\mu J'(v)$ est strictement contractante de point fixe $u$.", "mnemo": "« **Deux alpha sur L carré** » : le seuil commun du gradient, du gradient projeté et d'Uzawa. « **Deux sur L** » : le vrai seuil. Développer le carré, α sur le double produit, $L$ sur le carré.", "cloze": "Soit $J$ [[α-convexe]] différentiable avec $J'$ [[$L$-lipschitzienne]] sur $V$. Si $0<\\mu<[[2\\alpha/L^2]]$, le gradient à pas fixe $u^{n+1}=u^n-\\mu J'(u^n)$ converge pour tout $u^0$ et $\\norm{u^n-u}\\le\\gamma^n\\norm{u^0-u}$ avec $\\gamma=[[\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}]]$. Technique de preuve : [[contraction]] de $v\\mapsto v-\\mu J'(v)$.", "liens": ["2.4.4", "2.3.8", "3.4.1", "3.4.3", "3.3.1", "3.2.9", "T7"]}, {"id": "3.2.9", "label": "Prop. 3.2.9 · Lemme 3.2.10 · Rem. 3.2.11", "nom": "Sans forte convexité : le lemme de descente", "surnom": "un pas de gradient fait toujours baisser $J$ (si μ < 2/L)", "sec": "3.2 · Gradient sans contrainte", "chap": 3, "prio": 2, "qs": ["algo", "outil"], "cadre": "$u^{n+1}=u^n-\\mu J'(u^n)$.", "hyp": [["**Lemme 3.2.10** : $J'$ $L$-lipschitzienne, $v^*=v-\\mu J'(v)$ — **aucune convexité**", "§2.4.10 avec $v^*-v=-\\mu J'(v)$"], ["**Prop. 3.2.9** : $V=\\R^N$, $J$ **strictement convexe**, différentiable, **infinie à l'infini**, $J'$ $L$-lipschitzienne, $0<\\mu<2/L$", "compacité (dim. finie) + unicité du point critique"]], "concl": "**Lemme** : $J(v)-J(v^*)\\ge\\mu\\big(1-\\tfrac{L\\mu}2\\big)\\norm{J'(v)}^2$ — décroissance stricte pour $0<\\mu<2/L$, maximale pour $\\mu=1/L$ (sommet de la parabole majorante). **Prop.** : $u^n\\to u$.", "manque": "Prop. 3.2.9 : **aucune vitesse** (voir §3.3.3 : $1/n$). Sans convexité, on garde $J(u^n)\\searrow$ et $J'(u^n)\\to0$ (Ex. 3.2.6) mais la limite peut être un **col** (Ex. 3.2.7).", "diff": [["3.2.6", "strict. convexe + dim. finie remplacent α-convexe ; seuil $2/L$ au lieu de $2\\alpha/L^2$ ; convergence sans vitesse ; preuve par compacité + sous-suites au lieu de contraction."]], "pourquoi": [["$\\mu<2/L$", "pour $\\mu\\ge2/L$ le lemme ne garantit plus rien ($J=\\frac L2x^2$ oscille/diverge)."]], "preuve": "Lemme : §T13. Prop. : $J(u^n)$ décroît ⇒ bornée (infinie à l'infini) ⇒ sous-suite convergente ; $\\sum\\norm{J'(u^n)}^2<\\infty$ ⇒ la limite annule $J'$ ⇒ unique point critique ⇒ §T10 toute la suite converge.", "mnemo": "« $\\mu(1-\\frac{L\\mu}2)\\norm{J'}^2$ : le gain garanti d'un pas. Le pas $1/L$ le maximise. »", "cloze": "Lemme de descente : si $J'$ est $L$-lipschitzienne et $v^*=v-\\mu J'(v)$, alors $J(v)-J(v^*)\\ge[[\\mu(1-\\tfrac{L\\mu}2)]]\\norm{J'(v)}^2$, sans aucune hypothèse de [[convexité]] ; la descente garantie est maximale pour $\\mu=[[1/L]]$. Prop. 3.2.9 : si $V=\\R^N$, $J$ [[strictement convexe]], différentiable, [[infinie à l'infini]] et $0<\\mu<[[2/L]]$, le gradient à pas fixe converge.", "liens": ["2.4.10", "3.2.6", "3.3.3", "3.3.7", "T13", "T10"]}, {"id": "3.3.1", "label": "Proposition 3.3.1 · Rem. 3.3.2", "nom": "La vitesse optimale du gradient à pas fixe", "surnom": "κ, pas κ²", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 2, "qs": ["algo"], "cadre": "Hypothèses de §3.2.6 **plus** $V=\\R^N$ et $J$ de classe $C^2$ (donc $\\alpha\\Id\\le J''\\le L\\Id$).", "hyp": [["$J$ α-convexe, $J'$ $L$-lipschitzienne, $C^2$, dimension finie", "linéariser l'erreur : $u^{n+1}-u=B^n(u^n-u)$, $B^n=\\Id-\\mu\\int_0^1J''$"], ["$0<\\mu<2/L$", "rayon spectral $\\max(|1-\\mu\\alpha|,|1-\\mu L|)<1$"]], "concl": "Convergence pour $0<\\mu<2/L$ ; vitesse optimale pour $\\mu_{opt}=\\dfrac2{L+\\alpha}$ : $$\\norm{u^n-u}\\le\\gamma_{opt}^n\\norm{u^0-u},\\qquad\\gamma_{opt}=\\frac{L-\\alpha}{L+\\alpha}=\\frac{\\kappa-1}{\\kappa+1}\\approx1-\\frac2\\kappa.$$", "plus": "Rem. 3.3.2 : optimal (Ex. 3.2.5, quadratique) : on ne peut ni élargir $]0,2/L[$ ni accélérer **à un pas**. Les méthodes accélérées (§3.3.10, §3.3.15, §3.3.17) remplacent κ par $\\sqrt\\kappa$.", "manque": "", "diff": [["3.2.6", "la borne naïve $\\sqrt{1-\\alpha^2/L^2}\\approx1-\\frac1{2\\kappa^2}$ dépend de $\\kappa^2$ ; ici $1-\\frac2\\kappa$."]], "pourquoi": [], "preuve": "§T12 + §T14 : $(1-\\mu L)\\Id\\le B^n\\le(1-\\mu\\alpha)\\Id$, $B^n$ symétrique donc $\\norm{B^n}=\\rho(B^n)$ ; égaliser $|1-\\mu\\alpha|=|1-\\mu L|$ donne $\\mu=\\frac2{L+\\alpha}$.", "mnemo": "« Égaliser les deux facteurs extrêmes : $\\mu=2/(L+\\alpha)$, taux $(\\kappa-1)/(\\kappa+1)$. »", "cloze": "Si de plus $V=\\R^N$ et $J\\in C^2$, le gradient à pas fixe converge pour $0<\\mu<[[2/L]]$, avec un pas optimal $\\mu_{opt}=[[\\dfrac2{L+\\alpha}]]$ et le taux $\\gamma_{opt}=[[\\dfrac{L-\\alpha}{L+\\alpha}]]=\\dfrac{\\kappa-1}{\\kappa+1}$. Preuve : rayon spectral de $\\Id-\\mu J''$, coincé entre $1-\\mu L$ et $1-\\mu\\alpha$.", "liens": ["3.2.6", "3.3.10", "3.3.15", "T14"]}, {"id": "3.3.3", "label": "Prop. 3.3.3 · Lemme 3.3.5 · Rem. 3.3.4, 3.3.6", "nom": "Convexe sans forte convexité : vitesse en 1/n", "surnom": "plat = lent", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 1, "qs": ["algo"], "cadre": "Gradient à pas fixe, $J$ sur $\\R^N$.", "hyp": [["$J$ **strictement convexe**, $C^2$, infinie à l'infini, $J'$ $L$-lipschitzienne", ""], ["$0<\\mu<2/L$", ""]], "concl": "$0\\le J(u^n)-J(u)\\le\\dfrac{\\kappa}{n+1}$ avec $\\kappa=\\dfrac{\\norm{u^0-u}^2}{\\mu(1-L\\mu/2)}$ (vitesse **algébrique**, sur la **valeur**).", "plus": "**Lemme 3.3.5 (co-coercivité)** : $\\norm{J'(v)-J'(w)}^2\\le L\\ps{J'(v)-J'(w)}{v-w}$. Rem. 3.3.6 : vitesses indépendantes de la dimension (mais le coût d'une itération en dépend).", "manque": "**Rien sur $\\norm{u^n-u}$** (Rem. 3.3.4), qui peut converger aussi lentement qu'on veut si $J$ est plate.", "diff": [["3.2.6", "sans α : géométrique → $1/n$, et sur $J(u^n)-J(u)$ seulement."], ["3.3.7", "Nesterov : $1/n^2$ avec les mêmes hypothèses (convexe, $L$-lip.)."]], "pourquoi": [], "preuve": "§T8 : $\\Delta_n=J(u^n)-J(u)\\le\\norm{J'(u^n)}\\norm{u^0-u}$ (convexité) et $\\mu(1-\\frac{L\\mu}2)\\norm{J'(u^n)}^2\\le\\Delta_n-\\Delta_{n+1}$ (descente) ⇒ $\\Delta_{n+1}\\le\\Delta_n-\\Delta_n^2/\\kappa$ ⇒ $\\Delta_n\\le\\kappa/(n+1)$ par récurrence.", "mnemo": "« Convexe : $1/n$ ; Nesterov : $1/n^2$ ; α-convexe : géométrique. »", "cloze": "Pour $J$ [[strictement convexe]], $C^2$, infinie à l'infini, à dérivée $L$-lipschitzienne et $0<\\mu<2/L$, le gradient à pas fixe vérifie $J(u^n)-J(u)\\le[[\\dfrac{\\kappa}{n+1}]]$ : vitesse [[algébrique]] sur la valeur, rien sur [[$\\norm{u^n-u}$]].", "liens": ["3.2.9", "3.3.7", "T8"]}, {"id": "3.3.7", "label": "Prop. 3.3.7 · Prop. 3.3.10 · Rem. 3.3.9, 3.3.11", "nom": "Nesterov (gradient accéléré)", "surnom": "extrapoler avant de dériver", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 1, "qs": ["algo"], "cadre": "(3.14) : $u^n=v^n-\\mu J'(v^n)$, $a_{n+1}=\\frac12(1+\\sqrt{4a_n^2+1})$, $v^{n+1}=u^n+\\frac{a_n-1}{a_{n+1}}(u^n-u^{n-1})$ ; $a_n\\approx1+\\frac n2$.", "hyp": [["**Prop. 3.3.7** : $J$ convexe différentiable, $J'$ $L$-lipschitzienne, un minimum $u$ existe, $0<\\mu\\le1/L$", "potentiel décroissant"], ["**Prop. 3.3.10** : $J$ α-convexe, $J'$ $L$-lip., $0<\\mu\\le1/L$, version (3.19) avec $q=\\alpha/L$", ""]], "concl": "**3.3.7** : $J(u^n)-J(u)\\le\\dfrac{\\kappa}{(n+2)^2}$, $\\kappa=2\\mu^{-1}\\norm{u^0-u}^2+4(J(u^0)-J(u))$. **3.3.10** : pour $\\mu=1/L$, $\\norm{u^n-u}\\le\\frac2\\alpha\\gamma_{Nest}^n\\norm{u^0-u}$ avec $\\gamma_{Nest}=1-\\sqrt{\\alpha/L}$.", "plus": "Rem. 3.3.9 : $1/n^2$ est **optimal** parmi les méthodes du premier ordre (exemple où l'information ne se propage que d'une composante par itération). Rem. 3.3.11 : $1-\\sqrt{1/\\kappa}$ au lieu de $1-2/\\kappa$ ; coefficient d'extrapolation → $\\frac{1-\\sqrt q}{1+\\sqrt q}$. (La constante $\\frac2\\alpha$ du livre n'est pas homogène : retenir le facteur.)", "manque": "La version forte (3.19) exige de connaître α et $L$ ; 3.3.7 ne dit rien sur $u^n$ (Ex. 3.3.1 pour $u^n\\to u$).", "diff": [["3.3.3", "même hypothèses, $1/n^2$ au lieu de $1/n$."], ["3.3.15", "la boule pesante fait encore un peu mieux ($\\frac{\\sqrt\\kappa-1}{\\sqrt\\kappa+1}$) mais seulement localement et avec α, L connus."]], "pourquoi": [], "preuve": "§T8 : le potentiel $E_n=\\norm{u^n-p^n-u}^2+2\\mu a_n^2(J(u^n)-J(u))$, $p^n=(a_n-1)(u^{n-1}-u^n)$, décroît grâce à $a_{n+1}(a_{n+1}-1)=a_n^2$ et $\\mu\\le1/L$ (Lemme 3.3.12, encadrement fin). Donc $2\\mu a_n^2(J(u^n)-J(u))\\le E_0$ et $a_n\\ge1+\\frac n2$.", "mnemo": "« Sur-relaxer : on extrapole au-delà du segment $(u^{n-1},u^n)$ avant de calculer le gradient. $\\sqrt\\kappa$ au lieu de κ. »", "cloze": "Nesterov : si $J$ est [[convexe]] différentiable à dérivée $L$-lipschitzienne et $0<\\mu\\le[[1/L]]$, alors $J(u^n)-J(u)\\le[[\\dfrac{\\kappa}{(n+2)^2}]]$. Si $J$ est α-convexe (version 3.19), le taux est $\\gamma_{Nest}=[[1-\\sqrt{\\alpha/L}]]$.", "liens": ["3.3.3", "3.3.15", "3.3.17", "T8"]}, {"id": "3.3.15", "label": "Théorème 3.3.15 · Rem. 3.3.16", "nom": "La boule pesante", "surnom": "de l'inertie pour ne pas zigzaguer", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 1, "qs": ["algo"], "cadre": "$u^{n+1}=u^n-\\mu J'(u^n)+\\nu(u^n-u^{n-1})$ (3.29) : discrétisation de $m\\ddot u+\\dot u=-J'(u)$ (le gradient à pas fixe est Euler explicite sur $\\dot u=-J'(u)$).", "hyp": [["$J$ convexe $C^2$ sur $\\R^N$, $\\alpha\\Id\\le J''\\le L\\Id$", "linéariser près de $u$"], ["$u^0,u^1$ **assez proches** de $u$ (convergence **locale**)", ""], ["$0\\le\\nu<1$, $0<\\mu<2(1+\\nu)/L$", "rayon spectral < 1"]], "concl": "Convergence ; pour $\\nu=\\Big(\\dfrac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}\\Big)^2$ et $\\mu=\\dfrac4{(\\sqrt L+\\sqrt\\alpha)^2}$ : $\\norm{u^n-u}\\le C\\gamma_{BP}^n\\norm{u^0-u}$, $\\gamma_{BP}=\\dfrac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}=\\dfrac{\\sqrt\\kappa-1}{\\sqrt\\kappa+1}$.", "manque": "Locale seulement ; il faut connaître α et $L$ pour régler $\\mu,\\nu$ (Rem. 3.3.16). (Coquilles dans la preuve du livre : bornes inversées ; l'énoncé est correct.)", "diff": [["3.3.7", "$\\gamma_{BP}<\\gamma_{Nest}=1-\\sqrt{\\alpha/L}$ : un peu plus rapide, mais locale et paramétrée."], ["3.3.17", "le gradient conjugué atteint le même taux sans aucun paramètre."]], "pourquoi": [], "preuve": "§T14 : $z^n=(u^n-u,u^{n-1}-u)$, $z^{n+1}=Az^n+o(z^n)$ ; valeurs propres racines de $\\rho^2-(1+\\nu-\\mu\\lambda)\\rho+\\nu=0$ ; discriminant $\\le0$ ⇒ module $\\sqrt\\nu$ ; égaliser $\\sqrt\\nu\\ge1-\\sqrt{\\mu\\alpha}$ et $\\sqrt\\nu\\ge\\sqrt{\\mu L}-1$.", "mnemo": "« Spirale au lieu de zigzag ; taux $\\frac{\\sqrt\\kappa-1}{\\sqrt\\kappa+1}$ (le même que le gradient conjugué). »", "cloze": "Boule pesante : $u^{n+1}=u^n-\\mu J'(u^n)+[[\\nu(u^n-u^{n-1})]]$. Pour $\\alpha\\Id\\le J''\\le L\\Id$ et des points de départ [[assez proches]] de $u$, avec les paramètres optimaux, $\\norm{u^n-u}\\le C\\gamma_{BP}^n\\norm{u^0-u}$ où $\\gamma_{BP}=[[\\dfrac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}]]$.", "liens": ["3.3.7", "3.3.17", "3.3.1", "T14"]}, {"id": "3.3.17", "label": "(3.31)–(3.35) · Prop. 3.3.17 · Rem. 3.3.18", "nom": "Le gradient conjugué", "surnom": "ne jamais défaire un gain précédent", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 2, "qs": ["algo"], "cadre": "$u^{n+1}=u^n-\\mu^np^n$, $p^{n+1}=J'(u^{n+1})+\\beta^np^n$ (3.31), $\\mu^n$ pas optimal le long de $p^n$. $\\beta^n$ : Polak–Ribière $\\frac{\\ps{J'(u^{n+1})}{J'(u^{n+1})-J'(u^n)}}{\\norm{J'(u^n)}^2}$ ou Fletcher–Reeves $\\frac{\\norm{J'(u^{n+1})}^2}{\\norm{J'(u^n)}^2}$ (égaux pour une quadratique).", "hyp": [["Cas quadratique $J=\\frac12Ax\\cdot x-b\\cdot x$, $A$ symétrique définie positive", "directions **conjuguées** : $Ap^{n+1}\\cdot p^n=0$ (Ex. 3.3.2)"]], "concl": "Convergence **exacte en au plus $N$ itérations** (dimension). **Prop. 3.3.17 (admise)** : $\\norm{x_n-x}\\le2\\sqrt{\\lambda_N/\\lambda_1}\\Big(\\dfrac{1-\\sqrt{\\lambda_1/\\lambda_N}}{1+\\sqrt{\\lambda_1/\\lambda_N}}\\Big)^n\\norm{x_0-x}$.", "plus": "Algorithme (3.35) : $r^n=Ax^n-b$, $\\mu_n=\\frac{\\norm{r^n}^2}{Ap^n\\cdot p^n}$, $\\beta_n=\\frac{\\norm{r^{n+1}}^2}{\\norm{r^n}^2}$. Rem. 3.3.18 : conditionnement $\\lambda_N/\\lambda_1$ ; préconditionner $C^{-1}Ax=C^{-1}b$.", "manque": "En arithmétique flottante la conjugaison se dégrade (plus de $N$ itérations possibles) ; version non linéaire sans garantie équivalente.", "diff": [["3.2.1", "premier pas identique au pas optimal ; ensuite la direction est corrigée par $\\beta^np^n$ au lieu de repartir à angle droit."], ["3.3.15", "même taux $\\frac{\\sqrt\\kappa-1}{\\sqrt\\kappa+1}$, **sans paramètre**."]], "pourquoi": [], "preuve": "Deux conditions fixent les coefficients : pas optimal ($\\ps{r^{n+1}}{p^n}=0$, §T4) et conjugaison ($\\ps{Ap^{n+1}}{p^n}=0$) ; dans le produit scalaire $\\ps{A\\cdot}{\\cdot}$ les $p^n$ forment une base orthogonale : $N$ minimisations exactes suffisent.", "mnemo": "« Dans le produit scalaire de $A$, les directions sont orthogonales : $N$ directions, $N$ itérations. »", "cloze": "Gradient conjugué : $p^{n+1}=J'(u^{n+1})+[[\\beta^np^n]]$ avec un pas [[optimal]] le long de $p^n$ ; les directions sont [[conjuguées]] ($Ap^{n+1}\\cdot p^n=0$). Pour une quadratique en dimension $N$, convergence exacte en au plus [[$N$]] itérations ; taux $\\Big(\\dfrac{1-\\sqrt{\\lambda_1/\\lambda_N}}{1+\\sqrt{\\lambda_1/\\lambda_N}}\\Big)^n$ (×$2\\sqrt{\\kappa}$), [[sans paramètre]] à régler.", "liens": ["3.2.1", "3.3.15", "3.3.7"]}, {"id": "3.3.19", "label": "Déf. 3.3.19 · Lemmes 3.3.20–3.3.21", "nom": "Sous-différentiel d'une fonction convexe", "surnom": "toutes les pentes des droites d'appui", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 3, "qs": ["outil"], "diapos": "Diapos : définition + lemme en 3 points (dérivable ⇒ $\\partial J(x)=\\{J'(x)\\}$ — la diapo écrit $\\{x\\}$, coquille ; $0\\in\\partial J(x)$ ⇒ minimum ; sup de convexes dérivables : $J_\\lambda'(x)$ est un sous-gradient si $J(x)=J_\\lambda(x)$).", "cadre": "$J$ convexe de $\\R^n$ dans $\\R$.", "hyp": [["$\\partial J(x)=\\{p\\in\\R^n : J(y)-J(x)\\ge p\\cdot(y-x)\\ \\forall y\\}$ (3.36)", "les pentes des droites qui passent sous le graphe en $x$ ; convexe fermé"]], "concl": "**Lemme 3.3.20** : $0\\in\\partial J(x)$ ⇒ $x$ minimum (et réciproquement). **Lemme 3.3.21** : si $\\mathcal J=\\sup_{\\lambda\\in\\Lambda}J_\\lambda$ ($\\Lambda$ fini, $J_\\lambda$ convexes dérivables) et $J_\\lambda(x)=\\mathcal J(x)$, alors $J_\\lambda'(x)\\in\\partial\\mathcal J(x)$. Si $J$ dérivable en $x$ : $\\partial J(x)=\\{J'(x)\\}$.", "plus": "$\\partial|x|(0)=[-1,1]$ (Ex. 3.3.3). En un point anguleux 1D : $[J'_g,J'_d]$.", "manque": "Un sous-gradient **n'est pas forcément une direction de descente** (Rem. 3.3.26) et sa norme ne dit rien de l'optimalité (Rem. 3.3.27).", "diff": [], "pourquoi": [], "preuve": "3.3.21 : $\\mathcal J(y)-\\mathcal J(x)\\ge J_\\lambda(y)-J_\\lambda(x)\\ge J_\\lambda'(x)\\cdot(y-x)$.", "mnemo": "« $0\\in\\partial J$ remplace $J'=0$ ; pour un max de fonctions, prendre le gradient d'une fonction active. »", "cloze": "$\\partial J(x)=\\{p : J(y)-J(x)\\ge[[p\\cdot(y-x)]]\\ \\forall y\\}$. Si $J$ est dérivable en $x$, $\\partial J(x)=[[\\{J'(x)\\}]]$ ; si [[$0\\in\\partial J(x)$]], $x$ est un minimum ; si $J=\\sup_\\lambda J_\\lambda$ et $J(x)=J_\\lambda(x)$, alors [[$J_\\lambda'(x)$]] est un sous-gradient. Exemple : $\\partial|x|(0)=[[[-1,1]]]$.", "liens": ["3.3.23", "3.3.32"]}, {"id": "3.3.23", "label": "Proposition 3.3.23 · Rem. 3.3.24–3.3.27", "nom": "L'algorithme du sous-gradient", "surnom": "Σρ = ∞ pour arriver, Σρ² < ∞ pour s'arrêter", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 3, "qs": ["algo"], "diapos": "Diapos : $x_{n+1}=x_n-\\frac{\\rho_n}{\\norm{p_n}}p_n$ ; « si $(\\rho_n)\\in\\ell^1$, $\\notin\\ell^2$ » — **impossible** (coquille) ; le livre (3.39) : $\\rho_k\\to0$, $\\sum\\rho_k=+\\infty$, $\\sum\\rho_k^2<+\\infty$.", "cadre": "$x^{k+1}=x^k-\\rho_k\\dfrac{p^k}{\\norm{p^k}}$ (3.38), $p^k\\in\\partial J(x^k)$ quelconque ; arrêt si $p^k=0$.", "hyp": [["$J$ **convexe**, **infinie à l'infini**", "un minimum existe, les itérés restent bornés"], ["sous-différentiel **non vide** en tout point, $J$ **localement lipschitzienne** ($|J(x)-J(y)|\\le L_M\\norm{x-y}$ sur les bornés)", "borne $\\norm{p^k}\\le L_M$"], ["pas (3.39) : $\\rho_k\\to0$, $\\sum\\rho_k=+\\infty$, $\\sum\\rho_k^2<+\\infty$ ; ex. $\\rho_k=(k+1)^{-1/2-\\eps}$", "assez de carburant pour arriver, oscillations amorties"]], "concl": "L'algorithme converge (vers un minimum). Vitesse (Rem. 3.3.25) : $\\min_{j\\le k}J(x^j)-J^*\\le C/k^{1/2-\\eps}$ — **très lent**.", "plus": "Rem. 3.3.24 : hypothèses vérifiées par $\\sup$ fini de convexes dérivables dont l'une est infinie à l'infini. On **normalise** $p^k$ car sa norme ne dit rien de l'optimalité (Rem. 3.3.27).", "manque": "**Pas de décroissance** de $J(x^k)$ (Rem. 3.3.26) : seul $\\norm{x^k-x^*}$ décroît (à $\\rho_k^2$ près). Pas constant : les itérés tournent à distance $\\sim\\rho$ ; $\\sum\\rho_k<\\infty$ : on s'arrête avant d'arriver.", "diff": [["3.2.6", "non lisse : plus de contraction, plus de descente ; on suit $\\norm{x^k-x^*}^2$ (Lyapunov) et les pas doivent tendre vers 0."]], "pourquoi": [["$\\sum\\rho_k=\\infty$", "$\\rho_k=\\rho_0/(k+1)^2$ : trajet total $\\le\\rho_0\\pi^2/6$, la suite converge vers un point qui n'est pas le minimum."], ["$\\sum\\rho_k^2<\\infty$", "pas constant : $\\norm{x^{k+1}-x^*}^2$ reçoit $+\\rho^2$ à chaque pas, plafonne."]], "preuve": "§T8 : (3.40) $\\norm{x^{k+1}-x^*}^2\\le\\norm{x^k-x^*}^2-\\frac{2\\rho_k}{\\norm{p^k}}(J(x^k)-J^*)+\\rho_k^2$ ; sommer : $\\min_{k\\le i}(J(x^k)-J^*)\\le\\frac{L_M(\\norm{x^0-x^*}^2+\\sum\\rho_k^2)}{2\\sum_{k\\le i}\\rho_k}\\to0$ ; sous-suite vers un minimum, puis toute la suite (queue de $\\sum\\rho^2$).", "mnemo": "« Un sous-gradient ne descend pas forcément, mais il rapproche. »", "cloze": "Sous-gradient : $x^{k+1}=x^k-[[\\rho_k\\dfrac{p^k}{\\norm{p^k}}]]$ (direction normalisée), $p^k\\in\\partial J(x^k)$. Hypothèses : $J$ [[convexe]], [[infinie à l'infini]], sous-différentiel non vide, [[localement lipschitzienne]]. Pas : $\\rho_k\\to0$, $\\sum\\rho_k[[=+\\infty]]$, $\\sum\\rho_k^2[[<+\\infty]]$. Alors l'algorithme converge, lentement ($\\min_{j\\le k}J(x^j)-J^*\\le[[C/k^{1/2-\\eps}]]$), sans [[décroissance]] garantie de $J$.", "liens": ["3.3.19", "3.2.6", "3.3.28", "T8"]}, {"id": "3.3.28", "label": "Proposition 3.3.28 · Rem. 3.3.29–3.3.30", "nom": "Le gradient stochastique", "surnom": "un seul gradient par itération", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 1, "qs": ["algo"], "cadre": "$F(x)=\\frac1n\\sum_{i=1}^nf_i(x)$ (3.42), $n$ grand ; $x^{k+1}=x^k-\\mu^kf_{i_k}'(x^k)$ (3.43), $i_k$ uniforme dans $\\{1,\\dots,n\\}$.", "hyp": [["$F$ **α-convexe**", "contraction en espérance"], ["$\\frac1n\\sum_i\\norm{f_i'(x)}^2\\le C(1+\\norm{x-x^*}^2)$ (3.44)", "contrôle du bruit ; vrai si $f_i'$ bornées ou $f_i$ quadratiques uniformément fortement convexes (Rem. 3.3.29)"], ["$\\mu^k=\\dfrac1{k+1}$", "tendre vers 0 (tuer le bruit) mais pas trop vite"]], "concl": "Convergence **en moyenne** : $\\mathbb E\\norm{x^k-x^*}^2\\to0$ (vitesse algébrique).", "manque": "Lent (algébrique) ; à pas constant, les itérés **tremblent** autour de $x^*$ (erreur $\\sim\\mu\\sigma^2/2$). Mini-batch (Rem. 3.3.30) : moyenne de $m$ gradients.", "diff": [["3.2.6", "chaque itération coûte $n$ fois moins ; on perd la convergence géométrique."], ["3.3.23", "même logique de pas décroissants : $\\sum\\mu^k=\\infty$, $\\sum(\\mu^k)^2<\\infty$."]], "pourquoi": [], "preuve": "Développer $\\norm{x^{k+1}-x^*}^2$, espérance sur $i_k$ ($\\mathbb E f_{i_k}'=F'$), (2.24) et (3.44) : $\\mathbb E\\norm{x^{k+1}-x^*}^2\\le(1-2\\mu^k\\alpha+C(\\mu^k)^2)\\norm{x^k-x^*}^2+C(\\mu^k)^2$.", "mnemo": "« Rapide au début, bruité à la fin : le pas doit décroître. »", "cloze": "Gradient stochastique sur $F=\\frac1n\\sum f_i$ : $x^{k+1}=x^k-\\mu^k[[f_{i_k}'(x^k)]]$ avec $i_k$ tiré au hasard. Si $F$ est [[α-convexe]], sous la borne (3.44) et pour $\\mu^k=[[\\dfrac1{k+1}]]$, l'algorithme converge [[en moyenne]].", "liens": ["3.3.23", "3.2.6"]}, {"id": "3.3.32", "label": "Rem. 3.3.31 · Lemme 3.3.32 · Rem. 3.3.33", "nom": "L'algorithme proximal (et explicite-implicite)", "surnom": "le gradient implicite : aucune condition sur le pas", "sec": "3.3 · Généralisations du gradient", "chap": 3, "prio": 1, "qs": ["algo"], "cadre": "$\\prox_{\\tau J}(x)=\\argmin_y\\big(J(y)+\\frac1{2\\tau}\\norm{y-x}^2\\big)$ (3.51)–(3.52) ; algorithme proximal $x^{k+1}=\\prox_{\\tau J}(x^k)$ ; explicite-implicite pour $J_1+J_2$ : $x^{k+1}=\\prox_{\\tau J_2}\\big(x^k-\\tau J_1'(x^k)\\big)$ (3.53).", "hyp": [["$J$ convexe différentiable sur $\\R^n$, **unique** minimum $x^*$, $\\tau>0$ **quelconque**", "$y\\mapsto J(y)+\\frac1{2\\tau}\\norm{y-x}^2$ est $\\frac1\\tau$-convexe"], ["(+ $J$ α-convexe)", "pour la vitesse"]], "concl": "$x^k\\to x^*$ pour **tout** $\\tau>0$ ; si α-convexe : $\\norm{x^k-x^*}^2\\le\\dfrac{\\norm{x^0-x^*}^2}{(1+2\\tau\\alpha)^k}$.", "plus": "**Seuillage doux** (Rem. 3.3.31) : $\\prox_{\\tau|\\cdot|}(b)=S_\\tau(b)=0$ si $|b|<\\tau$, $b-\\sgn(b)\\tau$ sinon — LASSO (3.48), solutions creuses. Prox de l'indicatrice d'un convexe = **projection** (Ex. 3.3.4) ; explicite-implicite avec $J_2=I_K$ = **gradient projeté** (Ex. 3.3.6).", "manque": "Il faut un prox **explicite** (seuillage, projection, quadratique) ; sinon chaque pas est un problème d'optimisation.", "diff": [["3.2.6", "schéma **implicite** (dérivée au point d'arrivée) : pas de condition de petitesse sur $\\tau$ (Rem. 3.3.33), signature des schémas implicites."], ["3.4.1", "gradient projeté = explicite-implicite avec $J_2=I_K$."]], "pourquoi": [], "preuve": "§T13 : (2.23) pour la fonction $\\frac1\\tau$-convexe en son minimum $x^{k+1}$ : (3.54) ; $x=x^k$ ⇒ $J$ décroît ; $x=x^*$ et sommation ⇒ $k(J(x^k)-J(x^*))\\le\\frac{1}{2\\tau}\\norm{x^0-x^*}^2$ ; §T10 pour toute la suite.", "mnemo": "« Prox = rester près de $x$ tout en rendant $J$ petite. Implicite ⇒ inconditionnellement stable. »", "cloze": "$\\prox_{\\tau J}(x)$ minimise $y\\mapsto J(y)+[[\\tfrac1{2\\tau}\\norm{y-x}^2]]$ (fonction [[$\\frac1\\tau$-convexe]], minimum unique). L'algorithme proximal converge pour [[tout $\\tau>0$]] ; si $J$ est α-convexe, $\\norm{x^k-x^*}^2\\le\\norm{x^0-x^*}^2/[[(1+2\\tau\\alpha)^k]]$. Le prox de $|\\cdot|$ est le [[seuillage doux]], celui de l'indicatrice d'un convexe est la [[projection]].", "liens": ["3.3.19", "3.4.1", "T13"]}, {"id": "3.4.1", "label": "Théorème 3.4.1 · Rem. 3.4.2", "nom": "Gradient à pas fixe avec projection", "surnom": "Euler est un point fixe", "sec": "3.4 · Gradient avec contraintes", "chap": 3, "prio": 3, "qs": ["algo"], "diapos": "Diapos : « $J$ α-convexe différentiable, $J'$ $L$-lipschitzien ; si $0<\\mu<2\\alpha/L^2$, $u_{n+1}=P_K(u_n-\\mu J'(u_n))$ converge. »", "cadre": "$\\inf_{v\\in K}J(v)$, $K$ **convexe fermé** ; $u^{n+1}=P_K\\big(u^n-\\mu J'(u^n)\\big)$ (3.59).", "hyp": [["$K$ convexe fermé non vide", "projection $P_K$ bien définie et **1-lipschitzienne** (8.2)"], ["$J$ **α-convexe** différentiable, $J'$ **$L$-lipschitzienne**", "contraction de $v\\mapsto v-\\mu J'(v)$ (preuve de §3.2.6)"], ["$0<\\mu<2\\alpha/L^2$", "même seuil que 3.2.6"]], "concl": "Pour tout $u^0\\in K$, $u^n\\to u$, solution unique de (3.55) ; même facteur $\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}$.", "plus": "**Point fixe** : l'inéquation d'Euler $\\ps{J'(u)}{v-u}\\ge0$ s'écrit $\\ps{u-(u-\\mu J'(u))}{v-u}\\ge0$, c'est-à-dire (8.1) : $u=P_K(u-\\mu J'(u))$ (3.58), pour tout $\\mu>0$. Algorithme **faisable** (Rem. 3.4.2) : chaque itéré est dans $K$. Projections explicites : pavé $\\prod[a_i,b_i]$ (troncature coordonnée par coordonnée), sous-espace affine $\\{Bx=c\\}$ ($P_K(x)=x+B^*(BB^*)^{-1}(c-Bx)$).", "manque": "« Souvent un leurre » : pour un convexe quelconque on ne sait pas calculer $P_K$. D'où Uzawa et la pénalisation (infaisables, mais calculables).", "diff": [["3.2.6", "identique, composé par $P_K$."], ["3.4.3", "Uzawa projette sur $(\\R^+)^M$ (troncature) dans l'espace **dual**, pas sur $K$."]], "pourquoi": [], "preuve": "§T7 : $\\norm{u^{n+1}-u}=\\norm{P_K(u^n-\\mu J'(u^n))-P_K(u-\\mu J'(u))}\\le\\norm{(u^n-\\mu J'(u^n))-(u-\\mu J'(u))}\\le\\gamma\\norm{u^n-u}$.", "mnemo": "« Un pas de gradient, puis retour dans $K$ par le plus court chemin ; la projection ne dilate pas, la contraction survit. »", "cloze": "$K$ [[convexe fermé]], $J$ [[α-convexe]] différentiable, $J'$ [[$L$-lipschitzienne]]. Si $0<\\mu<[[2\\alpha/L^2]]$, l'algorithme $u^{n+1}=[[P_K]]\\big(u^n-\\mu J'(u^n)\\big)$ converge vers l'unique solution, pour tout $u^0\\in K$. La solution est le point fixe $u=P_K(u-\\mu J'(u))$, traduction de l'[[inéquation d'Euler]]. C'est un algorithme [[faisable]].", "liens": ["3.2.6", "2.5.1", "3.4.3", "3.3.32", "T7"]}, {"id": "3.4.3", "label": "Théorème 3.4.3 · (3.65) · (3.72)–(3.73)", "nom": "L'algorithme d'Uzawa", "surnom": "descente en u, montée en p", "sec": "3.4 · Gradient avec contraintes", "chap": 3, "prio": 3, "qs": ["algo"], "diapos": "Diapos : « $\\Lag(u_n,\\mu_n)=\\inf_V\\Lag(v,\\mu_n)$, $\\mu_{n+1}=P_{\\R^n_+}(\\mu_n+\\eps F(u_n))$ ; $J$ α-convexe différentiable, $F$ convexe et lipschitzienne de $V$ dans $\\R^n$ de constante $L$ ; si $0<\\eps<2\\alpha/L^2$, Uzawa converge. »", "cadre": "$\\inf_{F(v)\\le0}J(v)$ (3.62), $\\Lag(v,q)=J(v)+q\\cdot F(v)$ sur $V\\times(\\R^+)^M$. Algorithme (3.66) : $p^0\\ge0$ ; $u^n=\\argmin_v\\Lag(v,p^n)$ ; $p^{n+1}=P_{\\R^M_+}\\big(p^n+\\mu F(u^n)\\big)$.", "hyp": [["$J$ **α-convexe** différentiable", "existence/unicité de $u$ et des $u^n$ (§2.3.8) ; (2.24) sur le terme croisé"], ["$F$ **convexe** et **$L$-lipschitzienne** de $V$ dans $\\R^M$ (3.67)", "$K$ convexe ; Kuhn–Tucker fournit $p$ ; Lipschitz sur le terme carré"], ["$0<\\mu<2\\alpha/L^2$", "le triplet, encore"]], "concl": "Pour tout $p^0$, **$u^n\\to u$** solution de (3.62).", "plus": "(3.65) : l'inégalité de gauche du point-selle équivaut à $p=P_{\\R^M_+}(p+\\mu F(u))$ pour tout $\\mu>0$. **Uzawa = gradient projeté sur le dual** : $\\mathcal G(q)=\\inf_v\\Lag(v,q)$ (3.73) et formellement $\\mathcal G'(q)=F(u_q)$ (§T15), donc $p^{n+1}=P_{\\R^M_+}(p^n+\\mu\\mathcal G'(p^n))$ : un pas de gradient **montant** projeté (on maximise). Lecture 2 : prédire un multiplicateur puis le corriger (augmenter si la contrainte est violée). Décomposition par les prix (3.7.3).", "manque": "**Rien sur $(p^n)$** : sa convergence n'est pas assurée, ni l'unicité de $p$ (si $B$ de rang $M$ dans le cas quadratique, $p^n\\to p$, Ex. 3.4.2). Algorithme **infaisable** : $u^n\\notin K$ en général. Chaque itération = une minimisation libre.", "diff": [["3.2.6", "même triplet (α, $L$, $2\\alpha/L^2$), mais c'est **$F$** qui est $L$-lipschitzienne, la projection est sur $(\\R^+)^M$, et la preuve est un **Lyapunov** $\\norm{p^n-p}^2$ (§T8), pas une contraction."], ["3.4.4", "Arrow–Hurwicz remplace la minimisation exacte en $v$ par un pas de gradient."]], "pourquoi": [["$F$ convexe", "sinon $K$ n'est pas convexe et Kuhn–Tucker ne fournit pas de point-selle : saut de dualité, Uzawa cherche un point-selle qui n'existe pas."]], "preuve": "§T8 : (1) $u$, $p$ (Kuhn–Tucker §2.6.4), $u^n$ existent. (2) Euler pour $u$ et $u^n$ (Ex. 2.5.6), croiser : $r^n\\cdot(F(u^n)-F(u))\\le-\\alpha\\norm{u^n-u}^2$ avec $r^n=p^n-p$ (3.70). (3) Soustraire (3.65) à (3.66), projection 1-lip. : $\\norm{r^{n+1}}^2\\le\\norm{r^n}^2+(L^2\\mu^2-2\\mu\\alpha)\\norm{u^n-u}^2$. (4) $\\norm{r^n}^2$ décroît ⇒ $u^n\\to u$ (3.71).", "mnemo": "« Uzawa : **descente en $u$, montée en $p$** ; un plus dans la mise à jour car on maximise le dual, dont le gradient est $F(u^n)$ ; projeter sur $\\R^M_+$ = tronquer. »", "cloze": "Uzawa pour $\\inf_{F\\le0}J$ : $u^n$ minimise [[$\\Lag(\\cdot,p^n)$]] sans contrainte, puis $p^{n+1}=P_{\\R^M_+}\\big(p^n[[+]]\\mu F(u^n)\\big)$. Hypothèses : $J$ [[α-convexe]] différentiable, $F$ [[convexe]] et [[$L$-lipschitzienne]]. Si $0<\\mu<[[2\\alpha/L^2]]$, $u^n\\to u$ pour tout $p^0$ — mais rien sur [[$p^n$]]. C'est un gradient projeté [[montant]] sur le problème dual, avec $\\mathcal G'(q)=[[F(u_q)]]$.", "liens": ["2.6.4", "2.6.12", "3.2.6", "3.4.1", "3.4.4", "2.5.12", "T8"]}, {"id": "3.4.4", "label": "Théorème 3.4.4 · Lemme 3.4.5", "nom": "Arrow–Hurwicz : Uzawa en un seul pas de gradient", "surnom": "un pas de descente, un pas de montée", "sec": "3.4 · Gradient avec contraintes", "chap": 3, "prio": 1, "qs": ["algo"], "cadre": "(3.74) : $u^{n+1}=u^n-\\mu_n\\big(J'(u^n)+p^n\\cdot F'(u^n)\\big)$, $p^{n+1}=P_{\\R^M_+}\\big(p^n+\\mu_nF(u^n)\\big)$.", "hyp": [["$J$ α-convexe différentiable ; $F$ convexe différentiable de dérivée bornée par $C_F$ ; $v\\mapsto J'(v)+p\\cdot F'(v)$ $L$-lipschitzienne pour tout $p\\ge0$", ""], ["pas $\\mu_n=\\dfrac{\\alpha\\gamma\\norm{u^n-u}^2}{C^2(\\norm{u^n-u}^2+\\norm{p^n-p}^2)}$, $0<\\gamma<1$, $C^2=\\max(2L^2+C_F^2,2C_F^2)$", "dépend de la solution : résultat théorique"]], "concl": "Il existe un point-selle $(u,p)$, $u$ unique solution, et $u^n\\to u$.", "plus": "**Lemme 3.4.5** : pour $(u,p)$ point-selle et tous $(v,q)$ : $\\frac\\alpha2\\norm{u-v}^2\\le\\ps{\\partial_v\\Lag(v,q)}{v-u}-\\partial_q\\Lag(v,q)\\cdot(q-p)$ — rend négatif le terme croisé, d'où la décroissance de $\\norm{u^n-u}^2+\\norm{p^n-p}^2$.", "manque": "Rien sur $p^n$ ; le pas s'effondre près de la solution.", "diff": [["3.4.3", "un pas de gradient en $v$ au lieu d'une minimisation exacte."]], "pourquoi": [], "preuve": "§T8 avec $E_n=\\norm{u^n-u}^2+\\norm{p^n-p}^2$.", "mnemo": "« Uzawa paresseux. »", "cloze": "Arrow–Hurwicz : $u^{n+1}=u^n-\\mu_n[[\\big(J'(u^n)+p^n\\cdot F'(u^n)\\big)]]$ et $p^{n+1}=P_{\\R^M_+}(p^n+\\mu_nF(u^n))$ : un pas de [[descente]] en $v$, un pas de [[montée]] en $q$ ; la quantité de Lyapunov est [[$\\norm{u^n-u}^2+\\norm{p^n-p}^2$]].", "liens": ["3.4.3", "T8"]}, {"id": "3.4.6", "label": "Proposition 3.4.6 · Rem. 3.4.7", "nom": "Pénalisation des contraintes", "surnom": "le mur devient un ressort", "sec": "3.4 · Gradient avec contraintes", "chap": 3, "prio": 3, "qs": ["algo"], "diapos": "Diapos : « $J$ continue, strictement convexe et coercive, $F_i$ convexes continues, $K=\\{F\\le0\\}\\ne\\emptyset$ ; $u$ l'unique solution, $u_\\eps$ le min de $J_\\eps$ ; alors $\\lim_{\\eps\\to0}u_\\eps=u$. »", "cadre": "$V=\\R^N$. On remplace $\\inf_{F\\le0}J$ (3.78) par $$\\inf_{v\\in\\R^N}J_\\eps(v)=J(v)+\\frac1\\eps\\sum_{i=1}^M\\big[\\max(F_i(v),0)\\big]^2\\qquad(3.79)$$", "hyp": [["$J$ **continue, strictement convexe, infinie à l'infini**", "existence (§2.2.1) et unicité de $u$ et de $u_\\eps$"], ["$F_i$ **convexes continues**", "$K$ convexe fermé ; $G=\\sum\\max(F_i,0)^2$ convexe continue"], ["$K\\ne\\emptyset$", ""]], "concl": "$\\lim_{\\eps\\to0}u_\\eps=u$.", "plus": "**Le multiplicateur caché** (Ex. 3.4.3) : sous qualification (gradients actifs libres), $\\frac2\\eps\\max(F_i(u_\\eps),0)\\to\\lambda_i$. Méthode **extérieure** : $u_\\eps$ viole les contraintes. Rem. 3.4.7, pénalisation **intérieure** (barrière) : minimiser $J(v)-\\eps\\sum_i\\frac1{F_i(v)}$ sur $\\{F<0\\}$.", "manque": "**Pas de vitesse**. Mauvais conditionnement quand $\\eps\\to0$ (termes d'ordre $1/\\eps$) : on diminue $\\eps$ progressivement (continuation). $J_\\eps(u_\\eps)\\le J(u)$ : la pénalisation sous-estime l'optimum.", "diff": [["3.4.8", "le Lagrangien augmenté ajoute le multiplicateur : une raideur **finie** suffit, plus de $\\eps\\to0$."], ["3.4.3", "Uzawa ajuste λ, la pénalisation ajuste ε ; les deux sont infaisables."]], "pourquoi": [["$J$ strictement convexe", "sans unicité, $u_\\eps$ pourrait osciller entre plusieurs minima (on garde seulement des sous-suites)."]], "preuve": "§T1 + §T10 : $J(u_\\eps)\\le J_\\eps(u_\\eps)\\le J_\\eps(u)=J(u)$ (3.80)–(3.81) ⇒ $(u_\\eps)$ bornée ; sous-suite $\\to u^*$ ; $G(u_\\eps)\\le\\eps(J(u)-J(u_\\eps))\\to0$ ⇒ $u^*\\in K$ ; $J(u^*)\\le J(u)$ ⇒ $u^*=u$ ; unicité ⇒ toute la famille converge.", "mnemo": "« Ressort de raideur $1/\\eps$ : les violations coûtent cher ; la tension du ressort, c'est λ. »", "cloze": "Pénalisation : $J_\\eps(v)=J(v)+\\dfrac1\\eps\\sum_i[[\\max(F_i(v),0)^2]]$. Si $J$ est [[continue]], [[strictement convexe]], [[infinie à l'infini]], les $F_i$ [[convexes continues]] et $K\\ne\\emptyset$, alors $u_\\eps\\to u$ quand $\\eps\\to[[0]]$. Méthode [[extérieure]] ; $\\dfrac2\\eps\\max(F_i(u_\\eps),0)\\to[[\\lambda_i]]$ ; défaut : [[mauvais conditionnement]].", "liens": ["2.2.1", "3.4.8", "3.4.3", "T1", "T10"]}, {"id": "3.4.8", "label": "(3.84) · Lemme 3.4.8 · Rem. 3.4.9", "nom": "Le Lagrangien augmenté", "surnom": "ressort + bon multiplicateur = raideur finie", "sec": "3.4 · Gradient avec contraintes", "chap": 3, "prio": 1, "qs": ["algo"], "cadre": "$\\inf_{F(v)=0}J(v)$ (3.83) en dimension finie. $\\Lag_{aug}(v,\\lambda,\\mu)=J(v)+\\lambda\\cdot F(v)+\\frac\\mu2\\norm{F(v)}^2$ (3.84). Algorithme : $v^n=\\argmin_v\\Lag_{aug}(v,\\lambda^n,\\mu)$, $\\lambda^{n+1}=\\lambda^n+\\mu F(v^n)$ (3.87).", "hyp": [["$J,F$ de classe $C^2$, $v^*$ minimum local avec $F'(v^*)$ de rang $M$, $\\lambda^*$ son multiplicateur", ""], ["**condition suffisante d'ordre 2** : $\\big(J''(v^*)+\\lambda^*\\cdot F''(v^*)\\big)(w,w)>0$ pour $w\\in\\Ker F'(v^*)\\setminus\\{0\\}$ (3.88)", "Hessienne du Lagrangien définie positive sur le plan tangent"]], "concl": "Il existe $\\mu_0$ tel que pour tout $\\mu\\ge\\mu_0$, $v^*$ est un minimum local **sans contrainte** de $v\\mapsto\\Lag_{aug}(v,\\lambda^*,\\mu)$.", "plus": "Rem. 3.4.9 : avec une bonne estimation du multiplicateur, une pénalisation **finie** suffit — pas de mauvais conditionnement. Mise à jour « à la Uzawa » mais avec un $\\mu$ qui n'est pas petit.", "manque": "Réservé aux égalités dans le livre ; il faut quand même minimiser à chaque étape.", "diff": [["3.4.6", "pénalisation seule : $\\mu\\to\\infty$ obligatoire ; ici $\\lambda$ absorbe l'erreur."], ["3.4.3", "même mise à jour $\\lambda+\\mu F(v)$, mais appliquée à un Lagrangien pénalisé."]], "pourquoi": [], "preuve": "§T5 : Hessienne $=\\Lag''(v^*,\\lambda^*)(w,w)+\\mu\\norm{F'(v^*)w}^2$ (3.89) : définie positive sur $\\Ker F'$ par (3.88), sur l'orthogonal grâce à $\\mu$ grand.", "mnemo": "« Le terme $\\frac\\mu2\\norm F^2$ n'agit que dans les directions normales ; (3.88) s'occupe des tangentes. »", "cloze": "Lagrangien augmenté : $\\Lag_{aug}(v,\\lambda,\\mu)=J(v)+\\lambda\\cdot F(v)+[[\\tfrac\\mu2\\norm{F(v)}^2]]$ ; mise à jour $\\lambda^{n+1}=[[\\lambda^n+\\mu F(v^n)]]$. Lemme 3.4.8 : sous la condition suffisante d'ordre 2 (Hessienne du [[Lagrangien]] définie positive sur [[$\\Ker F'(v^*)$]]), $v^*$ est un minimum local libre de $\\Lag_{aug}(\\cdot,\\lambda^*,\\mu)$ dès que $\\mu\\ge[[\\mu_0]]$ (raideur finie).", "liens": ["3.4.6", "2.5.13", "NL", "T5"]}, {"id": "3.5.1", "label": "Proposition 3.5.1 · Rem. 3.5.2–3.5.3", "nom": "Méthode de Newton", "surnom": "quadratique, mais locale", "sec": "3.5 · Newton", "chap": 3, "prio": 3, "qs": ["algo"], "diapos": "Diapos : $u_{n+1}-u_n=-(F'(u_n))^{-1}F(u_n)$ ; pour minimiser $J$ de classe $C^2$ : $F=J'$, $F'=J''$. « $u_0$ tel que $F'(u_0)\\ne0$ » — il faut une matrice **inversible**, et surtout $u_0$ **proche** de $u$. Remarque : $C\\approx(F'(u))^{-1}$.", "cadre": "Zéro de $F:\\R^N\\to\\R^N$ ; $u^{n+1}=u^n-\\big(F'(u^n)\\big)^{-1}F(u^n)$ (3.90) — on résout un système linéaire, on n'inverse pas. Lecture optimisation : minimiser le modèle quadratique (3.91) $J(v)+J'(v)\\cdot(w-v)+\\frac12J''(v)(w-v)\\cdot(w-v)$.", "hyp": [["$F$ de classe $C^2$", "bornes $\\norm{(F')^{-1}}\\le C_1$, $\\norm{F''}\\le C_2$ près de $u$"], ["$u$ **zéro régulier** : $F(u)=0$, $F'(u)$ **inversible**", "sinon convergence seulement géométrique ($F=\\norm x^2$)"], ["$\\norm{u^0-u}\\le\\eps$ (**local**)", "$C\\eps<1$"]], "concl": "$$\\norm{u^{n+1}-u}\\le C\\norm{u^n-u}^2,\\qquad\\norm{u^n-u}\\le C^{-1}(C\\eps)^{2^n}\\qquad(3.92)$$ convergence **quadratique** : le nombre de chiffres exacts double à chaque itération.", "plus": "Rem. 3.5.3, quasi-Newton : $u^{n+1}=u^n-S^nF(u^n)$ avec $S^n\\approx(F')^{-1}$ mis à jour par corrections de rang 1 (BFGS…). Gauss–Newton (3.5.2) pour $\\min\\norm{F(u)}^2$ : $u^{n+1}=u^n-((\\nabla F)^*\\nabla F)^{-1}(\\nabla F)^*F$, sans dérivée seconde. En dimension infinie : formulation variationnelle $J''(u^n)(u^{n+1}-u^n,w)=-J'(u^n)(w)$ (Lax–Milgram).", "manque": "**Local** (peut diverger même dans $\\R$ : $\\arctan$) ; coût d'une Hessienne et d'un système linéaire par itération ; cherche un zéro de $J'$ : peut converger vers un **maximum ou un col** (Rem. 3.5.2) — sauf $J$ convexe.", "diff": [["3.2.6", "ordre 2 : quadratique au lieu de géométrique ; mais local, et une Hessienne par itération. « κ pour le gradient, √κ pour les accélérés, rien pour Newton (mais seulement près du but). »"]], "pourquoi": [["zéro régulier", "$F(x)=x^2$ : Newton converge vers $0$ seulement géométriquement (facteur $\\frac12$)."], ["$u^0$ proche", "$F=\\arctan$ : divergence si $|u^0|>1{,}39$ ; $x^3-2x+2$ : cycle $0\\leftrightarrow1$."]], "preuve": "§T12 + §T7 (variante quadratique) : $u^{n+1}-u=(F'(u^n))^{-1}\\int_0^1(1-s)F''(u^n+s(u-u^n))ds\\,(u^n-u)\\cdot(u^n-u)$ ⇒ $\\norm{u^{n+1}-u}\\le\\frac{C_1C_2}2\\norm{u^n-u}^2$ ; récurrence pour rester dans la boule, logarithme pour $(C\\eps)^{2^n}$.", "mnemo": "« Remplacer $F$ par sa tangente et résoudre exactement. Les chiffres exacts doublent — si l'on part près. »", "cloze": "Newton : $u^{n+1}=u^n-[[\\big(F'(u^n)\\big)^{-1}F(u^n)]]$. Si $F\\in[[C^2]]$ et $u$ est un zéro [[régulier]] ($F'(u)$ [[inversible]]), il existe $\\eps>0$ et $C<1/\\eps$ tels que si $\\norm{u^0-u}\\le\\eps$ : $\\norm{u^{n+1}-u}\\le[[C\\norm{u^n-u}^2]]$ (convergence [[quadratique]]). Pour minimiser $J$ : $F=[[J']]$. Défauts : [[local]], Hessienne coûteuse, ne distingue pas min et max.", "liens": ["2.4.7", "NL", "3.2.6", "T12", "T7"]}, {"id": "NL", "label": "(3.93)–(3.96) · Rem. 3.5.4", "nom": "Newton avec contraintes d'égalité (Newton–Lagrange, SQP)", "surnom": "Newton sur le système de Lagrange", "sec": "3.5 · Newton", "chap": 3, "prio": 3, "qs": ["algo"], "diapos": "Diapos : pour $\\min_{G=0}J$, un minimum est un point critique du Lagrangien ; $\\nabla\\Lag(u,\\lambda)=(J'(u)+\\lambda G'(u),\\ G(u))$ ; $\\Lag''(u,\\lambda)(v,w)=J''(u)(v_u,w_u)+\\lambda G''(u)(v_u,w_u)+\\ps{G'(u)}{v_u}w_\\lambda+\\ps{G'(u)}{w_u}v_\\lambda$ ; itération variationnelle $\\Lag''(u_n,\\lambda_n)(u_{n+1}-u_n,\\lambda_{n+1}-\\lambda_n;w)=-\\nabla\\Lag(u_n,\\lambda_n)\\cdot w$.", "cadre": "$\\min_{G(v)=0}J(v)$ (3.93), $G_i'(u)$ libres. Newton appliqué au système de Lagrange (3.94) : $\\mathcal F(u,\\lambda)=\\begin{pmatrix}J'(u)+\\lambda\\cdot G'(u)\\\\ G(u)\\end{pmatrix}$, $\\mathcal F'(u,\\lambda)=\\begin{pmatrix}J''(u)+\\lambda\\cdot G''(u)&G'(u)^*\\\\ G'(u)&0\\end{pmatrix}$ (matrice KKT).", "hyp": [["$J,G$ de classe $C^2$, $G_i'(u)$ libres", ""], ["**(3.95)** : $\\big(J''(u)+\\lambda\\cdot G''(u)\\big)(w,w)>0$ pour tout $w\\in\\Ker G'(u)\\setminus\\{0\\}$", "= condition d'ordre 2 de §2.5.13 en version stricte ⇒ $\\mathcal F'$ **inversible**"], ["$(u^0,\\lambda^0)$ proche de $(u,\\lambda)$", "convergence locale de Newton"]], "concl": "Convergence **quadratique** de $(u^n,\\lambda^n)$ (Prop. 3.5.1 appliquée à $\\mathcal F$).", "plus": "**Interprétation (3.96)** : une itération = résoudre le problème quadratique à contraintes affines $\\min Q^n(w)$ sous $G(u^n)+G'(u^n)\\cdot(w-u^n)=0$, où $Q^n$ est le développement d'ordre 2 du **Lagrangien** : c'est la programmation quadratique successive (**SQP**, 3.6.2). SLP (3.6.1) : approximations affines + région de confiance.", "manque": "**Rem. 3.5.4** : approcher $J$ au lieu du Lagrangien (3.97) peut ne pas converger — c'est la Hessienne du Lagrangien qui est positive sur l'espace tangent, pas celle de $J$.", "diff": [["3.5.1", "Newton sur $N+M$ inconnues ; régularité = inversibilité de la matrice KKT, garantie par (3.95)."], ["3.4.8", "même condition (3.88)=(3.95) ; le Lagrangien augmenté l'utilise pour pénaliser, Newton pour inverser."]], "pourquoi": [["Hessienne du Lagrangien", "$J=\\sqrt{1+\\norm{v-c}^2}$ sur le cercle : avec $J''$ seule, plus rien ne converge (facteur linéarisé $-2$)."]], "preuve": "Inversibilité : $(w,\\mu)$ dans le noyau ⇒ $w\\in\\Ker G'(u)$ et $(J''+\\lambda G'')w\\in\\mathrm{Im}\\,G'(u)^*=[\\Ker G'(u)]^\\perp$ ⇒ $\\Lag''(w,w)=0$ ⇒ $w=0$ par (3.95) ⇒ $\\mu=0$.", "mnemo": "« La matrice KKT est inversible exactement quand la Hessienne du Lagrangien ne s'annule pas sur le plan tangent. »", "cloze": "Newton–Lagrange applique Newton à $\\mathcal F(u,\\lambda)=\\big(J'(u)+\\lambda\\cdot G'(u),\\ [[G(u)]]\\big)$. La matrice KKT $\\begin{pmatrix}H&G'^*\\\\ G'&0\\end{pmatrix}$ avec $H=[[J''(u)+\\lambda\\cdot G''(u)]]$ (Hessienne du [[Lagrangien]], pas de $J$) est inversible si $\\Lag''(u,\\lambda)(w,w)>0$ pour tout $w\\ne0$ dans [[$\\Ker G'(u)$]] (3.95). Chaque itération résout un problème [[quadratique]] à contraintes [[affines]] : c'est la méthode [[SQP]].", "liens": ["3.5.1", "2.5.6", "2.5.13", "3.4.8"]}, {"id": "3.6.1", "label": "Lemme 3.6.1 · 3.6.1 SLP · 3.6.2 SQP", "nom": "Approximations successives : le gradient est un modèle quadratique", "surnom": "minimiser un modèle local, puis \partial_y\\Lag$ pour $\\Lag=J+\\ps{p}{F}$"]], "concl": "**Prop. 3.7.6** : $\\tilde J'(v)=\\partial_vJ(v,y(v))+\\big\\langle p(v),\\partial_vF(v,y(v))\\big\\rangle$ (3.116) : le gradient complet pour **une** résolution adjointe au lieu de $N$ (Rem. 3.7.7).", "manque": "", "diff": [["2.5.12", "même geste §T15 : $\\tilde J(v)=\\Lag(v,y(v),p)$ pour tout $p$ ; le bon $p$ tue le terme en $y'(v)$."]], "pourquoi": [], "preuve": "§T15.", "mnemo": "« Commencer par la fin, là où la dimension vaut 1. »", "cloze": "État adjoint : $p$ résout $(\\partial_yF)^*p=[[-\\partial_yJ]]$, et alors $\\tilde J'(v)=\\partial_vJ+[[\\ps{p}{\\partial_vF}]]$ : le gradient complet pour [[une seule]] résolution supplémentaire. Rétropropagation : produit des [[transposées]] à rebours.", "liens": ["2.5.12", "T15"]}], "tech": [{"id": "T1", "nom": "La méthode directe", "quand": "prouver qu'un minimum existe", "geste": "suite minimisante (§2.1.3) → **borner** (infinie à l'infini / $K$ borné) → **extraire** (Bolzano–Weierstrass ; en Hilbert : extraction faible) → limite dans $K$ (**fermé** ; faiblement fermé si convexe) → $J(u)\\le\\liminf J(u^{n_k})$ (**continue/sci** ; faiblement sci si convexe).", "ou": "2.2.1 · 2.3.9 · 3.4.6 · 3.2.9", "phrase": "La compacité fabrique un candidat, la semi-continuité le certifie."}, {"id": "T2", "nom": "L'argument du segment", "quand": "exploiter la convexité : local ⇒ global, tester une direction en restant dans $K$", "geste": "si $J(v)<J(u)$ : $J(u+\\theta(v-u))\\le(1-\\theta)J(u)+\\theta J(v)<J(u)$ pour $\\theta$ aussi petit qu'on veut ; $K$ convexe garantit $u+\\theta(v-u)\\in K$.", "ou": "2.3.4 · 2.5.1 · 2.3.5", "phrase": "Si $v$ fait mieux, tout le segment fait mieux, même tout près de $u$."}, {"id": "T3", "nom": "L'argument du milieu", "quand": "unicité, suites de Cauchy, estimations (forte convexité)", "geste": "$\\theta=\\frac12$ dans (2.9) : $J(\\frac{u+v}2)\\le\\frac{J(u)+J(v)}2-\\frac\\alpha8\\norm{u-v}^2$. Deux minima distincts : le milieu ferait mieux. Suite minimisante : $\\frac\\alpha8\\norm{u^n-u^m}^2\\le\\frac{J(u^n)+J(u^m)}2-m\\to0$.", "ou": "2.3.4 · 2.3.7 · 2.3.8", "phrase": "Le $\\frac18$ du milieu devient le $\\frac4\\alpha$ de (2.14)."}, {"id": "T4", "nom": "Dériver le long d'une direction admissible", "quand": "toute condition nécessaire du premier ordre", "geste": "chemin admissible $u+hw\\in K$ ($h>0$ petit) → minimalité $J(u+hw)-J(u)\\ge0$ → développer $h\\ps{J'(u)}{w}+o(h)\\ge0$ → diviser par $h>0$, $h\\to0^+$.", "ou": "2.5.1 · 2.5.5 · 2.5.6 · 2.5.17 · 2.4.4", "phrase": "On ne peut tester que dans les directions qui restent dans $K$ : d'où une inéquation, pas une équation."}, {"id": "T5", "nom": "Taylor à l'ordre 2 sur un chemin admissible", "quand": "conditions du second ordre, vitesse de Newton", "geste": "quand l'ordre 1 s'annule : $J(u+tw)-J(u)=\\frac{t^2}2J''(u)(w,w)+o(t^2)\\ge0$, diviser par $t^2$. Sous contraintes : dériver deux fois $j(t)=J(u(t))$ et $f_i(t)=F_i(u(t))=0$, combiner avec les λ pour éliminer $u''(0)$.", "ou": "2.4.8 · 2.5.3 · 2.5.13 · 3.5.1", "phrase": "Pente nulle : la courbure décide."}, {"id": "T6", "nom": "Des directions aux multiplicateurs", "quand": "transformer « $\\ps{J'(u)}{w}\\ge0$ sur un cône » en multiplicateurs", "geste": "**sous-espace** : $\\ps{p}{w}=0$ sur $\\bigcap[a_i]^\\perp$ ⇒ $p\\in\\Vect(a_i)$ (coefficients libres). **Cône** (Farkas) : $\\ps{p}{w}\\ge0$ sur $\\{\\ps{a_i}{w}\\le0\\}$ ⇒ $p=-\\sum\\lambda_ia_i$, $\\lambda_i\\ge0$.", "ou": "2.5.6 · 2.5.17 · 2.5.24", "phrase": "Orthogonal pour les égalités, Farkas pour les inégalités."}, {"id": "T7", "nom": "La contraction", "quand": "convergence d'une itération $u^{n+1}=T(u^n)$ avec vitesse géométrique", "geste": "$u=T(u)$ ; $u^{n+1}-u=T(u^n)-T(u)$ ; montrer $\\norm{T(v)-T(w)}\\le\\gamma\\norm{v-w}$, $\\gamma<1$ ; itérer. Pour $T=\\Id-\\mu J'$ : développer le carré, (2.24) sur le double produit, Lipschitz sur le carré. Variante quadratique : Newton.", "ou": "3.2.6 · 3.4.1 · 3.5.1", "phrase": "Le point fixe attire tout."}, {"id": "T8", "nom": "Lyapunov, télescopage, potentiel", "quand": "l'itération n'est pas une contraction mais une quantité positive décroît", "geste": "trouver $E_n\\ge0$ avec $E_{n+1}\\le E_n-c\\,e_n$ ; sommer : $c\\sum e_n\\le E_0$, donc $e_n\\to0$. Uzawa : $E_n=\\norm{p^n-p}^2$ ; sous-gradient : $\\norm{x^k-x^*}^2$ ; Nesterov : potentiel mixte.", "ou": "3.4.3 · 3.4.4 · 3.3.23 · 3.3.7 · 3.3.3", "phrase": "Ce qui décroît n'est pas forcément ce qui converge."}, {"id": "T9", "nom": "inf sup ≥ sup inf", "quand": "dualité faible, bornes inférieures", "geste": "$\\inf_{v'}\\Lag(v',q)\\le\\Lag(v,q)\\le\\sup_{q'}\\Lag(v,q')$ ; sup en $q$ à gauche, inf en $v$ à droite.", "ou": "2.5.21 · 2.6.9 · 2.6.11", "phrase": "Le dual est dessous."}, {"id": "T10", "nom": "Sous-suites et unicité de la limite", "quand": "faire converger toute la suite", "geste": "suite bornée ; toute sous-suite convergente a pour limite une solution ; la solution est unique ⇒ toute la suite converge.", "ou": "3.4.6 · 3.2.9 · 3.3.32", "phrase": "« Toutes les suites extraites convergent vers la même limite. »"}, {"id": "T11", "nom": "Séparer un point d'un convexe", "quand": "montrer l'appartenance à un convexe fermé, construire une minorante affine", "geste": "$C$ convexe fermé, $x_0\\notin C$ ⇒ $L(x_0)<\\alpha<L(y)$ sur $C$ ; en Hilbert, $p=P_C(x_0)$, $L=\\ps{p-x_0}{\\cdot}$. Raisonner par l'absurde, séparer, faire tendre un paramètre vers l'infini pour lire un signe.", "ou": "2.3.7 · 2.3.14 · 2.5.19", "phrase": "Projection ⇒ Farkas ⇒ KKT."}, {"id": "T12", "nom": "Intégrer le long d'un segment", "quand": "passer d'une propriété de $J'$ (ou $J''$) à une propriété de $J$", "geste": "$\\varphi(t)=J(u+t(v-u))$, $J(v)-J(u)=\\int_0^1\\ps{J'(u+t(v-u))}{v-u}dt$ ; insérer l'hypothèse (monotonie, Lipschitz, borne sur $J''$) et intégrer.", "ou": "2.4.5 · 2.4.8 · 2.4.10 · 3.3.1 · 3.5.1", "phrase": "Le reste intégral porte l'hypothèse."}, {"id": "T13", "nom": "L'encadrement quadratique", "quand": "toute preuve de convergence d'un algorithme de gradient", "geste": "$\\frac\\alpha2\\norm{v-u}^2\\le J(v)-J(u)-\\ps{J'(u)}{v-u}\\le\\frac L2\\norm{v-u}^2$. À droite avec $v=u-\\mu J'(u)$ : lemme de descente. À gauche : estimations d'erreur.", "ou": "2.4.11 · 3.2.10 · 3.3.12 · 3.3.32", "phrase": "α en dessous, L au-dessus."}, {"id": "T14", "nom": "Linéariser et lire le rayon spectral", "quand": "vitesse précise, convergence locale", "geste": "$e^{n+1}=Be^n(+o(e^n))$ ; convergence pour toute initialisation ⟺ $\\rho(B)<1$ ; optimiser un paramètre en égalisant les facteurs extrêmes ($|1-\\mu\\alpha|=|1-\\mu L|$ ⇒ $\\mu=\\frac2{\\alpha+L}$).", "ou": "3.3.1 · 3.3.15 · 3.5.1", "phrase": "Égaliser les extrêmes."}, {"id": "T15", "nom": "Dériver une valeur optimale", "quand": "sensibilité, gradient du dual, état adjoint", "geste": "si $m(\\eps)=\\Lag(u_\\eps,\\eps)$ avec $u_\\eps$ optimal, $m'(\\eps)=\\partial_\\eps\\Lag(u_\\eps,\\eps)$ : le terme $\\partial_v\\Lag\\cdot u_\\eps'$ disparaît par optimalité.", "ou": "2.5.12 · 2.6.6 · $\\mathcal G'=F(u_q)$ · 3.7.6", "phrase": "On ne dérive jamais la solution."}], "tableaux": [{"id": "existence", "titre": "Les trois théorèmes d'existence", "groupe": "Chapitre 2", "intro": "Même squelette (§T1), trois façons de fabriquer la compacité : la dimension finie, la convexité, la courbure α. Lire colonne par colonne ce qui change.", "cols": [{"id": "2.2.1", "t": "Th. 2.2.1<br><small>dimension finie<\/small>"}, {"id": "2.3.9", "t": "Th. 2.3.9<br><small>convexe<\/small>"}, {"id": "2.3.8", "t": "Th. 2.3.8<br><small>α-convexe<\/small>"}], "rows": [{"l": "Espace $V$", "c": ["$\\R^N$", "!Hilbert (ou Banach réflexif)", "Hilbert (complet)"]}, {"l": "Ensemble $K$", "c": ["fermé, non vide", "!**convexe** fermé, non vide", "**convexe** fermé, non vide"]}, {"l": "Régularité de $J$", "c": ["continue (sci suffit)", "continue (sci suffit)", "continue"]}, {"l": "Convexité de $J$", "c": ["~aucune", "!**convexe**", "!**α-convexe**"]}, {"l": "Croissance", "c": ["infinie à l'infini (ou $K$ borné)", "infinie à l'infini", "+automatique (Prop. 2.3.7)"]}, {"l": "Existence", "c": ["au moins un minimum", "au moins un minimum", "un minimum"]}, {"l": "Unicité", "c": ["~non", "~non", "+**oui**"]}, {"l": "Estimation", "c": ["~aucune", "~aucune", "+$\\norm{v-u}^2\\le\\frac4\\alpha(J(v)-J(u))$"]}, {"l": "Suites minimisantes", "c": ["une sous-suite converge vers un minimum", "~rien (seulement dans la preuve, faiblement)", "+**toute** suite minimisante converge vers $u$"]}, {"l": "Technique", "c": ["T1 : Bolzano–Weierstrass", "!T1 faible : extraction faible (2.3.13) + convexe ⇒ faiblement fermé / faiblement sci (2.3.15)", "!T3 milieu : suite minimisante de Cauchy"]}, {"l": "Ce qui casse sans l'hypothèse", "c": ["$]0,2]$ ; saut en 0 ; $e^x$", "Ex. 2.3.1 ($\\ell^2$) : non convexe, pas de minimum", "$e^x$ : strictement convexe, pas de minimum"]}], "note": "**Mnémo : les trois C.** Compacité (dim. finie) · Convexité (Hilbert) · Courbure α (en plus : unicité, estimation, convergence). Et toujours « F·C·I » : Fermé, Continue, Infinie à l'infini."}, {"id": "convexite", "titre": "Les trois étages de convexité", "groupe": "Chapitre 2", "intro": "Chaque renforcement achète une conclusion de plus. Les caractérisations par la dérivée sont celles des Prop. 2.4.4–2.4.5 et de l'Ex. 2.4.7.", "cols": [{"id": "2.3.4", "t": "convexe"}, {"id": "2.3.4", "t": "strictement convexe"}, {"id": "2.3.6", "t": "α-convexe"}], "rows": [{"l": "Définition (cordes)", "c": ["$J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)$", "!inégalité **stricte** pour $u\\ne v$, $\\theta\\in]0,1[$", "!$\\dots-\\frac{\\alpha\\theta(1-\\theta)}2\\norm{u-v}^2$"]}, {"l": "Tangentes ($J$ dérivable)", "c": ["$J(v)\\ge J(u)+\\ps{J'(u)}{v-u}$ (2.20)", "strict pour $u\\ne v$", "!$+\\frac\\alpha2\\norm{v-u}^2$ (2.23)"]}, {"l": "Monotonie de $J'$", "c": ["$\\ps{J'(u)-J'(v)}{u-v}\\ge0$ (2.21)", "strict pour $u\\ne v$", "!$\\ge\\alpha\\norm{u-v}^2$ (2.24)"]}, {"l": "Hessienne ($J\\in C^2$)",
