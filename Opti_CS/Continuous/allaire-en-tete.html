) ; local = global", "id": "2.3.4", "k": "th"}]}}, {"id": "a-cn", "titre": "Arbre 2 · Reconnaître un minimum (conditions d'optimalité)", "c": "cn", "racine": {"t": "$u$ minimum local de $J$ sur $K$, $J$ dérivable en $u$ ⟹ $\\ps{J'(u)}{w}\\ge0$ pour tout $w\\in K(u)$ — **le principe unique** (Prop. 2.5.5)", "id": "2.5.5", "k": "th", "ch": [{"t": "Quelle est la forme de $K$ ?", "k": "q", "ch": [{"t": "$K=V$ ou $u$ intérieur : $K(u)=V$", "k": "q", "ch": [{"t": "→ $J'(u)=0$ (Rem. 2.5.2) ; ordre 2 : $J''(u)\\ge0$ ; CS : $J'(u)=0$ et $J''\\ge0$ **au voisinage** (Prop. 2.5.3)", "id": "2.5.3", "k": "th"}]}, {"t": "$K$ **convexe** : $v-u\\in K(u)$", "k": "q", "ch": [{"t": "→ **inéquation d'Euler** $\\ps{J'(u)}{v-u}\\ge0\\ \\forall v\\in K$ (Th. 2.5.1) ; **suffisante si $J$ convexe**", "id": "2.5.1", "k": "th"}]}, {"t": "$K=\\{F=0\\}$ avec $F_i'(u)$ **libres** : $K(u)=\\Ker F'(u)$", "k": "q", "ch": [{"t": "→ **Lagrange** : $J'(u)+\\sum\\lambda_iF_i'(u)=0$, $\\lambda_i\\in\\R$ (Th. 2.5.6) ; ordre 2 : $(J''+\\sum\\lambda_iF_i'')\\ge0$ sur $\\Ker F'(u)$ (Prop. 2.5.13)", "id": "2.5.6", "k": "th"}]}, {"t": "$K=\\{F\\le0\\}$ avec contraintes **qualifiées** (A·L·S) : $K(u)=\\{\\ps{F_i'(u)}{w}\\le0,\\ i\\in I(u)\\}$", "k": "q", "ch": [{"t": "→ **KKT** : $J'(u)+\\sum\\lambda_iF_i'(u)=0$, $\\lambda_i\\ge0$, $\\lambda_iF_i(u)=0$ (Th. 2.5.17) — via Farkas", "id": "2.5.17", "k": "th"}]}, {"t": "$K=\\{G=0,\\ F\\le0\\}$ qualifiées (2.5.23)", "k": "q", "ch": [{"t": "→ $\\mu\\in\\R^N$ pour $G$, $\\lambda\\ge0$ pour $F$ (Th. 2.5.24)", "id": "2.5.24", "k": "th"}]}]}, {"t": "Et la **réciproque** (condition suffisante) ?", "k": "q", "ch": [{"t": "$J$ convexe, $K$ convexe → Euler suffit (Th. 2.5.1)", "id": "2.5.1", "k": "th"}, {"t": "$J,F_i$ convexes → KKT ⟺ minimum global ⟺ point-selle (**Kuhn–Tucker**, Th. 2.6.4) ; dual : $\\max\\mathcal G=\\min J$ (Cor. 2.6.12)", "id": "2.6.4", "k": "th"}, {"t": "sans convexité → comparer les valeurs des candidats (existence par 2.2.1) ou ordre 2 (2.5.3, 2.5.13)", "id": "2.5.13", "k": "th"}]}]}}, {"id": "a-algo", "titre": "Arbre 3 · Choisir un algorithme (et son théorème)", "c": "algo", "racine": {"t": "Je veux calculer $u$", "k": "q", "ch": [{"t": "**Sans contrainte** ($K=V$)", "k": "q", "ch": [{"t": "$J$ dérivable, α-convexe, $J'$ $L$-lipschitzienne", "k": "q", "ch": [{"t": "→ gradient à pas fixe, $\\mu<2\\alpha/L^2$, taux $\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}$ (Th. 3.2.6) ; vrai seuil $2/L$, optimum $\\mu=\\frac2{L+\\alpha}$, taux $\\frac{\\kappa-1}{\\kappa+1}$ (Prop. 3.3.1)", "id": "3.2.6", "k": "th"}, {"t": "→ gradient à pas optimal (Th. 3.2.1) : gradients successifs orthogonaux", "id": "3.2.1", "k": "th"}, {"t": "→ accélérés : Nesterov $1-\\sqrt{\\alpha/L}$ (3.3.10), boule pesante $\\frac{\\sqrt\\kappa-1}{\\sqrt\\kappa+1}$ (3.3.15, local), gradient conjugué (quadratique : $N$ pas, 3.3.17)", "id": "3.3.7", "k": "th"}, {"t": "→ $C^2$, $u^0$ proche : **Newton**, quadratique mais local (Prop. 3.5.1)", "id": "3.5.1", "k": "th"}]}, {"t": "$J$ seulement convexe (strictement), $J'$ $L$-lip.", "k": "q", "ch": [{"t": "→ gradient à pas fixe $\\mu<2/L$ : converge (Prop. 3.2.9), $J(u^n)-J(u)\\le\\kappa/(n+1)$ (3.3.3) ; Nesterov $1/n^2$ (3.3.7)", "id": "3.2.9", "k": "th"}]}, {"t": "$J=\\frac1n\\sum f_i$, $n$ énorme", "k": "q", "ch": [{"t": "→ gradient stochastique, $\\mu^k=\\frac1{k+1}$ (Prop. 3.3.28)", "id": "3.3.28", "k": "th"}]}, {"t": "$J$ convexe **non dérivable**", "k": "q", "ch": [{"t": "→ sous-gradient, $\\sum\\rho=\\infty$, $\\sum\\rho^2<\\infty$ (Prop. 3.3.23) — lent", "id": "3.3.23", "k": "th"}, {"t": "→ $J_1+J_2$ avec prox de $J_2$ explicite : explicite-implicite / proximal, tout $\\tau$ (Lemme 3.3.32)", "id": "3.3.32", "k": "th"}]}]}, {"t": "**Avec contraintes**", "k": "q", "ch": [{"t": "$K$ convexe fermé et $P_K$ **calculable** (pavé, sous-espace affine)", "k": "q", "ch": [{"t": "→ gradient projeté $u^{n+1}=P_K(u^n-\\mu J'(u^n))$, $\\mu<2\\alpha/L^2$ (Th. 3.4.1) — faisable", "id": "3.4.1", "k": "th"}]}, {"t": "$F\\le0$ convexes, $J$ α-convexe, $F$ $L$-lipschitzienne", "k": "q", "ch": [{"t": "→ **Uzawa** : minimiser $\\Lag(\\cdot,p^n)$, $p^{n+1}=P_{\\R^M_+}(p^n+\\mu F(u^n))$, $\\mu<2\\alpha/L^2$ (Th. 3.4.3) — $u^n\\to u$, rien sur $p^n$", "id": "3.4.3", "k": "th"}, {"t": "→ Arrow–Hurwicz : un seul pas de gradient en $v$ (Th. 3.4.4)", "id": "3.4.4", "k": "th"}]}, {"t": "contraintes quelconques, on accepte de les violer", "k": "q", "ch": [{"t": "→ pénalisation $J+\\frac1\\eps\\sum\\max(F_i,0)^2$, $\\eps\\to0$ (Prop. 3.4.6) — mal conditionné", "id": "3.4.6", "k": "th"}, {"t": "→ égalités : Lagrangien augmenté, raideur finie + mise à jour de λ (Lemme 3.4.8)", "id": "3.4.8", "k": "th"}]}, {"t": "$G=0$, tout $C^2$, bon point de départ", "k": "q", "ch": [{"t": "→ Newton–Lagrange / SQP : Newton sur le système de Lagrange, inversible sous (3.95)", "id": "NL", "k": "th"}]}]}, {"t": "Toujours vérifier : existence/unicité (2.3.8), constantes α et $L$, condition sur le pas.", "k": "note"}]}}], "chaines": [{"t": "Existence, dim. finie", "s": [["2.1.3", "suite minimisante"], ["2.2.1", "extraire"], ["3.4.6", "même schéma"], ["3.2.9", ""]]}, {"t": "Existence, α-convexe", "s": [["T11", "séparation"], ["2.3.7", "épigraphe → minorée"], ["2.3.8", "existence"], ["3.2.6", "+ contraction"], ["3.4.1", "+ projection"]]}, {"t": "Existence, convexe", "s": [["T11", "séparation"], ["2.3.12", "demi-espaces, fermé faible, sci faible"], ["2.3.9", ""]]}, {"t": "Convexité différentielle", "s": [["T12", "intégrer"], ["2.4.4", "tangentes, monotonie"], ["2.5.1", "suffisance d'Euler"], ["3.2.6", "monotonie forte"]]}, {"t": "Euler et projection", "s": [["2.5.1", "Euler"], ["3.4.1", "point fixe $u=P_K(u-\\mu J'(u))$"], ["3.4.3", "sur $\\R^M_+$"]]}, {"t": "Lagrange", "s": [["2.5.5", "cône"], ["2.5.6", "$K(u)=\\Ker F'(u)$"], ["2.5.13", "chemins, ordre 2"], ["NL", "inversibilité"], ["3.4.8", ""]]}, {"t": "KKT et dualité", "s": [["2.5.19", "Farkas"], ["2.5.17", "qualification"], ["2.6.2", "+ point-selle"], ["2.6.4", "Kuhn–Tucker"], ["2.6.9", "dualité"], ["2.6.12", "$\\mathcal G'(q)=F(u_q)$"], ["3.4.3", "Uzawa"]]}, {"t": "Descente", "s": [["2.4.10", "majoration quadratique"], ["3.2.9", "lemme de descente"], ["3.3.3", "récurrence 1/n"], ["3.3.7", "potentiel 1/n²"]]}, {"t": "Sensibilité", "s": [["2.5.12", "égalités, inégalités"], ["2.6.12", "$\\mathcal G'$"], ["3.7.6", "adjoint"]]}], "echelles": [{"titre": "Échelle de convexité", "c": "unicite", "pas": [{"t": "convexe", "g": "local = global ; Euler/KKT suffisantes ; existence en Hilbert si infinie à l'infini ; gradient en $1/n$"}, {"t": "strictement convexe", "g": "+ au plus un minimum"}, {"t": "α-convexe", "g": "+ existence et unicité ; estimation $\\frac4\\alpha$ ; convergence géométrique des algorithmes"}]}, {"titre": "Échelle de régularité", "c": "outil", "pas": [{"t": "continue (sci)", "g": "existence (T1)"}, {"t": "dérivable (Fréchet)", "g": "conditions d'ordre 1 : Euler, Lagrange, KKT"}, {"t": "$J'$ $L$-lipschitzienne", "g": "majoration quadratique ; lemme de descente ; vitesse du gradient"}, {"t": "$C^2$", "g": "conditions d'ordre 2 ; Newton ; taux optimal du gradient"}]}, {"titre": "Échelle des conclusions d'existence", "c": "existence", "pas": [{"t": "suite minimisante (2.1.3)", "g": "toujours"}, {"t": "∃ minimum (2.2.1, 2.3.9)", "g": "compacité ou convexité"}, {"t": "∃! + estimation + suites minimisantes convergent (2.3.8)", "g": "α-convexité"}]}, {"titre": "Échelle des vitesses", "c": "algo", "pas": [{"t": "$1/\\sqrt k$ — sous-gradient", "g": "convexe non lisse"}, {"t": "$1/n$ — gradient ; $1/n^2$ — Nesterov", "g": "convexe, $J'$ Lipschitz"}, {"t": "géométrique en κ — gradient", "g": "α-convexe"}, {"t": "géométrique en √κ — Nesterov, boule pesante, GC", "g": "α-convexe, méthodes à deux pas"}, {"t": "quadratique — Newton", "g": "$C^2$, zéro régulier, départ proche"}]}], "quiz": [{"q": "$J(x)=\\frac12Ax\\cdot x-b\\cdot x$ avec $A$ symétrique définie positive, $K=\\R^N$. Quel résultat donne existence **et** unicité en une ligne ?", "opts": ["Th. 2.2.1 (continue, infinie à l'infini)", "Th. 2.3.8 ($J$ est α-convexe avec $\\alpha=\\lambda_{\\min}(A)$)", "Th. 2.3.9 (convexe, infinie à l'infini)", "Prop. 2.3.4 seule"], "ok": 1, "exp": "2.2.1 et 2.3.9 donnent l'existence ; 2.3.4 l'unicité ; seul 2.3.8 donne les deux d'un coup, plus l'estimation (2.14). C'est l'hypothèse vedette du chapitre 3.", "id": "2.3.8"}, {"q": "$J(v)=\\frac12\\int_\\Omega|\\nabla v|^2-\\int_\\Omega fv$ sur $H^1_0(\\Omega)$ (dimension infinie). Quel théorème d'existence s'applique directement, et pourquoi pas 2.2.1 ?", "opts": ["2.2.1, car $J$ est continue et infinie à l'infini", "2.3.9 ou 2.3.8 : il faut la convexité, car en dimension infinie les bornés ne sont pas compacts", "Aucun : il manque la compacité", "2.3.4"], "ok": 1, "exp": "2.2.1 exige $\\R^N$ (Bolzano–Weierstrass). En Hilbert on remplace la compacité par la convexité (2.3.9), et ici $J$ est même α-convexe (Poincaré) : 2.3.8.", "id": "2.3.9"}, {"q": "$J(x)=e^x$ sur $\\R$. Que dit la théorie ?", "opts": ["Existence par 2.2.1", "Existence par 2.3.9", "Au plus un minimum (strictement convexe), mais aucune existence : $J$ n'est pas infinie à l'infini", "Existence et unicité par 2.3.8"], "ok": 2, "exp": "$e^x$ est strictement convexe (unicité par 2.3.4) mais ni infinie à l'infini ni α-convexe : aucun théorème d'existence, et de fait l'inf $0$ n'est pas atteint.", "id": "2.3.4"}, {"q": "$K=\\{v : x^2+y^2=1\\}$ et $J$ dérivable. Quelle condition nécessaire écrire en un minimum ?", "opts": ["$J'(u)=0$", "$\\ps{J'(u)}{v-u}\\ge0$ pour tout $v\\in K$", "$J'(u)+\\lambda F'(u)=0$ avec $\\lambda\\in\\R$ (Lagrange, $F'(u)=2u\\ne0$)", "$J'(u)+\\lambda F'(u)=0$ avec $\\lambda\\ge0$"], "ok": 2, "exp": "$K$ n'est pas convexe (Euler 2.5.1 inapplicable) ; contrainte d'égalité régulière ($F'(u)=2u\\ne0$ sur le cercle) : Lagrange 2.5.6, multiplicateur de signe libre.", "id": "2.5.6"}, {"q": "$K=\\{v : F_i(v)\\le0\\}$ avec des $F_i$ **affines**. La qualification est-elle à vérifier ?", "opts": ["Oui, il faut trouver $\\bar w$", "Non : des contraintes affines sont toujours qualifiées ($\\bar w=0$ convient)", "Non, car KKT n'a pas besoin de qualification", "Oui, il faut que les gradients soient libres"], "ok": 1, "exp": "Rem. 2.5.16 : si toutes les $F_i$ sont affines, $\\bar w=0$ vérifie (2.45). KKT s'applique sans autre vérification.", "id": "2.5.15"}, {"q": "$K=\\{x\\in\\R : x^2\\le0\\}$, $J(x)=x$. Le minimum est $0$. Pourquoi KKT échoue-t-il ?", "opts": ["$J$ n'est pas convexe", "Les contraintes ne sont pas qualifiées en $0$ : $F'(0)=0$ et $F$ n'est pas affine", "$K$ n'est pas fermé", "Il manque la dérivabilité"], "ok": 1, "exp": "Aucune direction $\\bar w$ ne vérifie $\\ps{F'(0)}{\\bar w}<0$ ; KKT demanderait $1+\\lambda\\cdot0=0$ : impossible. La qualification dépend de la description : $x\\le0$ décrit le même ensemble et est qualifiée.", "id": "2.5.15"}, {"q": "Vous avez trouvé $u$ et $\\lambda\\ge0$ vérifiant KKT, avec $J$ et les $F_i$ convexes. Que pouvez-vous conclure ?", "opts": ["$u$ est un candidat, il faut encore vérifier l'ordre 2", "$u$ est un minimum **global** (Kuhn–Tucker 2.6.4, sens suffisant, qui ne demande même pas la qualification)", "$u$ est un minimum local seulement", "Rien sans l'existence"], "ok": 1, "exp": "Sens suffisant de Kuhn–Tucker : $J(v)\\ge J(v)+p\\cdot F(v)\\ge J(u)+p\\cdot F(u)+\\ps{J'(u)+p\\cdot F'(u)}{v-u}=J(u)$ pour $v\\in K$.", "id": "2.6.4"}, {"q": "Quelle inégalité est **toujours** vraie, sans aucune hypothèse ?", "opts": ["$\\inf_v\\sup_q\\Lag\\le\\sup_q\\inf_v\\Lag$", "$\\sup_q\\inf_v\\Lag\\le\\inf_v\\sup_q\\Lag$", "$\\min\\mathcal J=\\max\\mathcal G$", "Aucune"], "ok": 1, "exp": "Dualité faible (Rem. 2.6.11, T9) : le dual est dessous. L'égalité équivaut à l'existence d'un point-selle (Th. 2.6.9). Les diapos ont l'inégalité inversée (coquille).", "id": "2.6.9"}, {"q": "Un couple $(u,p)$ est un point-selle du Lagrangien, mais $J$ et $F$ ne sont **pas** convexes. Que sait-on de $u$ ?", "opts": ["Rien, la convexité manque", "$u\\in K$ et $u$ est un minimum global de $J$ sur $K$ (Prop. 2.6.2, sans convexité)", "$u$ est seulement un point critique", "$u$ est un minimum local"], "ok": 1, "exp": "Le sens « point-selle ⇒ minimum » (Prop. 2.6.2) n'utilise aucune convexité. C'est la réciproque qui en a besoin.", "id": "2.6.2"}, {"q": "Gradient à pas fixe, $J$ α-convexe avec $J'$ $L$-lipschitzienne. Quel pas le Théorème 3.2.6 autorise-t-il, et quel est le vrai seuil ?", "opts": ["$\\mu<2/L$ ; vrai seuil $2\\alpha/L^2$", "$\\mu<2\\alpha/L^2$ ; vrai seuil $2/L$ (Prop. 3.3.1, $C^2$, dim. finie)", "$\\mu<1/L$ ; vrai seuil $2/L$", "$\\mu<\\alpha/L$"], "ok": 1, "exp": "« Deux alpha sur L carré » pour le théorème (preuve par contraction, prudente), « deux sur L » pour la vérité (rayon spectral). Le pas optimal est $2/(L+\\alpha)$.", "id": "3.2.6"}, {"q": "Quel théorème demande que ce soit **$F$** (et non $J'$) qui soit $L$-lipschitzienne ?", "opts": ["Th. 3.2.6", "Th. 3.4.1", "Th. 3.4.3 (Uzawa)", "Prop. 3.4.6"], "ok": 2, "exp": "Dans Uzawa, le terme carré de la preuve est $\\norm{F(u^n)-F(u)}^2$ : c'est $F$ qui doit être lipschitzienne. Le gradient et le gradient projeté demandent $J'$ lipschitzienne.", "id": "3.4.3"}, {"q": "$J$ convexe mais **pas différentiable** (un max de fonctions affines). Quel algorithme et quelle règle de pas ?", "opts": ["Gradient à pas fixe, $\\mu<2/L$", "Sous-gradient avec $\\rho_k\\to0$, $\\sum\\rho_k=\\infty$, $\\sum\\rho_k^2<\\infty$", "Newton", "Sous-gradient à pas constant"], "ok": 1, "exp": "Prop. 3.3.23. À pas constant les itérés tournent autour du minimum ; avec $\\sum\\rho_k<\\infty$ ils s'arrêtent avant d'arriver.", "id": "3.3.23"}, {"q": "$K$ est un pavé $\\prod[a_i,b_i]$ et $J$ est α-convexe à dérivée $L$-lipschitzienne. L'algorithme naturel ?", "opts": ["Uzawa", "Pénalisation", "Gradient projeté : $P_K$ est une troncature coordonnée par coordonnée (Th. 3.4.1)", "Newton"], "ok": 2, "exp": "Quand la projection est explicite (pavé, sous-espace affine), le gradient projeté est faisable et converge au même taux que le gradient libre.", "id": "3.4.1"}, {"q": "Après Uzawa, que garantit le Théorème 3.4.3 sur la suite des multiplicateurs $(p^n)$ ?", "opts": ["$p^n\\to p$ géométriquement", "Rien : seule $u^n\\to u$ est garantie", "$p^n$ converge vers l'unique multiplicateur", "$p^n$ est bornée et converge"], "ok": 1, "exp": "La preuve fait décroître $\\norm{p^n-p}^2$ mais n'en tire que $u^n\\to u$. Dans le cas quadratique avec $B$ de rang $M$, $p^n\\to p$ (Ex. 3.4.2).", "id": "3.4.3"}, {"q": "Newton depuis un $u^0$ quelconque sur $F(x)=\\arctan x$. Que dit la Prop. 3.5.1 ?", "opts": ["Convergence quadratique pour tout $u^0$", "Convergence quadratique seulement si $\\norm{u^0-u}\\le\\eps$ : locale (ici divergence si $|u^0|>1{,}39$)", "Convergence géométrique", "Rien, $F$ n'est pas $C^2$"], "ok": 1, "exp": "Newton est local : « quadratique, mais seulement près du but ». Et il cherche un zéro de $F$, qui peut être un maximum ou un col de $J$.", "id": "3.5.1"}, {"q": "Dans la condition d'ordre 2 sous contraintes d'égalité, quelle courbure teste-t-on et où ?", "opts": ["$J''(u)$ sur tout $V$", "$J''(u)$ sur $\\Ker F'(u)$", "$J''(u)+\\sum\\lambda_iF_i''(u)$ sur $\\Ker F'(u)$", "$\\sum\\lambda_iF_i''(u)$ sur $V$"], "ok": 2, "exp": "Prop. 2.5.13 : Hessienne du Lagrangien sur le plan tangent. Exemple : $J=y$ sur le cercle, $J''=0$ ne dit rien ; $\\lambda F''$ décide.", "id": "2.5.13"}, {"q": "Pénalisation $J_\\eps=J+\\frac1\\eps\\sum\\max(F_i,0)^2$ : comment lire le multiplicateur de KKT dans la solution pénalisée ?", "opts": ["$\\lambda_i=\\lim\\frac1\\eps F_i(u_\\eps)$", "$\\lambda_i=\\lim\\frac2\\eps\\max(F_i(u_\\eps),0)$", "$\\lambda_i=\\lim\\eps F_i(u_\\eps)$", "On ne peut pas"], "ok": 1, "exp": "Ex. 3.4.3 : dériver $J_\\eps$ donne $J'+\\sum\\frac2\\eps\\max(F_i,0)F_i'=0$, à comparer avec KKT. La tension du ressort, c'est λ.", "id": "3.4.6"}, {"q": "Quelle hypothèse rend « infinie à l'infini » inutile dans le Théorème 2.3.8 ?", "opts": ["$K$ borné", "La forte convexité : $J\\ge\\gamma\\norm v^2+\\eta$ (Prop. 2.3.7)", "La continuité", "Le caractère hilbertien"], "ok": 1, "exp": "Une fonction α-convexe continue est au-dessus d'une parabole (2.12), donc automatiquement minorée et infinie à l'infini.", "id": "2.3.7"}], "cartes": [["Existence", "2.2.1", "Les trois hypothèses du Théorème 2.2.1, et sa seconde phrase ?", "$K\\subset\\R^N$ fermé non vide ; $J$ continue (sci suffit) ; infinie à l'infini (inutile si $K$ borné). Seconde phrase : toute suite minimisante a une sous-suite qui converge vers un minimum."], ["Existence", "2.1.3", "Pourquoi une suite minimisante existe-t-elle toujours ?", "Si aucune suite ne faisait tendre $J$ vers $m=\\inf$, un $m+\\eps$ serait un minorant plus grand que le plus grand minorant."], ["Existence", "2.3.1", "Pourquoi $J(x)=(\\norm x^2-1)^2+\\sum x_i^2/i$ n'a-t-elle pas de minimum dans $\\ell^2$ ?", "$J(e_n)=1/n\\to0=\\inf J$ mais $J=0$ exigerait $x=0$ et $\\norm x=1$ ; $(e_n)$ est bornée sans sous-suite convergente : fermé borné ≠ compact."], ["Existence", "2.3.9", "Ce que 2.3.9 ajoute à 2.2.1, et ce qu'il ne donne pas ?", "Ajoute : $V$ Hilbert, $K$ **convexe**, $J$ **convexe** (extraction faible). Ne donne pas : unicité, estimation, convergence des suites minimisantes."], ["Existence", "2.3.8", "Énoncé complet du Théorème 2.3.8 ?", "$K$ convexe fermé non vide d'un Hilbert, $J$ α-convexe continue : unique minimum $u$, $\\norm{v-u}^2\\le\\frac4\\alpha(J(v)-J(u))$, toute suite minimisante converge vers $u$."], ["Existence", "2.3.8", "D'où vient le $4/\\alpha$ ?", "De $\\theta=\\frac12$ : facteur $\\frac{\\theta(1-\\theta)}2=\\frac18$, et $J(\\frac{u+v}2)\\ge J(u)$. Si $J$ dérivable : $2/\\alpha$ via (2.23) et Euler."], ["Unicité", "2.3.4", "La stricte convexité garantit-elle l'existence ?", "Non, seulement l'unicité (« au plus un ») : $e^x$ sur $\\R$."], ["Convexité", "2.3.5", "Sous quelle hypothèse précise une fonction convexe est-elle continue ?", "Majorée sur une boule (Lemme 2.3.5) ; automatique en dimension finie, pas en dimension infinie."], ["Convexité", "2.4.4", "Les trois caractérisations équivalentes de l'α-convexité ($J$ dérivable) ?", "(2.22) cordes ; (2.23) $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}+\\frac\\alpha2\\norm{v-u}^2$ ; (2.24) $\\ps{J'(u)-J'(v)}{u-v}\\ge\\alpha\\norm{u-v}^2$. ($C^2$ : $J''\\ge\\alpha\\Id$.)"], ["Convexité", "2.4.4", "Comment prouve-t-on (2.24) ⇒ α-convexe ?", "$\\varphi(t)=J(u+t(v-u))$, $\\varphi'(t)-\\varphi'(s)\\ge\\alpha(t-s)\\norm{v-u}^2$, double intégration sur $[\\theta,1]\\times[0,\\theta]$ (T12)."], ["Convexité", "2.4.10", "Que dit le Lemme 2.4.10 et à quoi sert-il ?", "$J'$ $L$-lip. ⇒ $J(v)\\le J(u)+\\ps{J'(u)}{v-u}+\\frac L2\\norm{v-u}^2$. Avec $v=u-\\mu J'(u)$ : lemme de descente 3.2.10 ; avec (2.23) : l'encadrement quadratique."], ["Dérivée", "2.4.1", "Une fonction Gâteaux-dérivable mais pas Fréchet-dérivable ?", "$J(x,y)=\\frac{x^6}{(y-x^2)^2+x^8}$, $J(0)=0$ : dérivées directionnelles nulles, mais $J=1/x^2$ sur $y=x^2$ (pas même continue)."], ["Euler", "2.5.1", "Inéquation d'Euler : énoncé et quand est-elle suffisante ?", "$K$ convexe, $J$ dérivable en $u$ min local ⇒ $\\ps{J'(u)}{v-u}\\ge0\\ \\forall v\\in K$. Suffisante si $J$ convexe. Intérieur : $J'(u)=0$."], ["Euler", "2.5.1", "Euler pour $J=\\frac12\\norm{v-x}^2$ sur un convexe fermé ?", "$\\ps{x-P_Kx}{y-P_Kx}\\le0$ pour tout $y\\in K$ : caractérisation (8.1) de la projection. D'où $P_K$ 1-lipschitzienne (8.2)."], ["Ordre 2", "2.5.3", "Pourquoi la CS de 2.5.3 demande-t-elle $J''\\ge0$ **au voisinage** ?", "$J''(u)\\ge0$ au seul point ne suffit pas ($x^3$ en 0). Avec $J''\\ge0$ autour, Taylor avec reste exact donne $J(u+w)\\ge J(u)$."], ["Cône", "2.5.5", "Le principe unique derrière Euler, Lagrange, KKT ?", "$\\ps{J'(u)}{w}\\ge0$ pour tout $w\\in K(u)$ (Prop. 2.5.5) : aucune direction admissible n'est une direction de descente. Les théorèmes ne diffèrent que par le calcul de $K(u)$ et l'outil cône → multiplicateurs."], ["Lagrange", "2.5.6", "Hypothèses exactes du Théorème 2.5.6 ?", "$J$ dérivable en $u$ ; $F_i$ $C^1$ au voisinage de $u$ ; $F_i'(u)$ linéairement indépendants (régulier) ; $u$ min local. Conclusion : $\\lambda\\in\\R^M$, $J'(u)+\\sum\\lambda_iF_i'(u)=0$."], ["Lagrange", "2.5.6", "Les deux étapes de la preuve de Lagrange ?", "1. $K(u)=\\Ker F'(u)$ (⊂ par Taylor ; ⊃ par le Lemme 2.5.7 / fonctions implicites). 2. Sous-espace : tester $\\pm w$, $J'(u)\\perp\\Ker F'(u)$ donc $J'(u)\\in\\Vect(F_i'(u))$."], ["Lagrange", "2.5.6", "Contre-exemple au cas non régulier ?", "$V=\\R$, $F(v)=v^2$, $J(v)=v$ : $K=\\{0\\}$, $F'(0)=0$, $J'(0)=1$ : aucun λ."], ["Lagrange", "2.5.12", "Que mesure un multiplicateur ?", "$\\lambda_i=-\\partial_{\\ell_i}J_{\\min}(0)$ : sensibilité de la valeur optimale au niveau de la contrainte (prix marginal). Preuve T15 : on ne dérive jamais la solution."], ["Ordre 2", "2.5.13", "Pourquoi la Hessienne du Lagrangien dans la condition d'ordre 2 ?", "Le long d'un chemin admissible, les termes $\\ps{J'(u)}{u''(0)}$ (courbure du chemin) s'éliminent grâce aux multiplicateurs ; reste $(J''+\\sum\\lambda_iF_i'')(u'(0),u'(0))\\ge0$ sur $\\Ker F'(u)$."], ["KKT", "2.5.15", "Définition de la qualification (inégalités) ?", "Il existe $\\bar w$ : pour tout $i\\in I(u)$, $\\ps{F_i'(u)}{\\bar w}<0$, ou $\\ps{F_i'(u)}{\\bar w}=0$ et $F_i$ affine (2.45)."], ["KKT", "2.5.15", "Trois conditions simples qui impliquent la qualification ?", "Affines (Rem. 2.5.16) ; gradients actifs libres (2.56) ; Slater : $F_i$ convexes et un point $v$ avec $F_i(v)<0$ (ou $=0$ et affine) (2.58), qualifiées partout avec $\\bar w=v-u$."], ["KKT", "2.5.17", "Écrivez les conditions KKT (et le mnémo).", "$J'(u)+\\sum\\lambda_iF_i'(u)=0$ ; $F(u)\\le0$ ; $\\lambda\\ge0$ ; $\\lambda\\cdot F(u)=0$. **S·A·P·C** : Stationnarité, Admissibilité, Positivité, Complémentarité."], ["KKT", "2.5.17", "Rôle de $u+\\eps(w+\\delta\\bar w)$ dans la preuve de KKT ?", "Transformer une direction $w$ du cône linéarisé en chemin vraiment admissible (trois cas) ; T4 donne $\\ps{J'(u)}{w+\\delta\\bar w}\\ge0$ ; $\\delta\\to0$ ; puis Farkas."], ["KKT", "2.5.19", "Comment le livre démontre-t-il Farkas ?", "1. Le cône $\\hat{\\mathsf K}=\\{-\\sum\\lambda_ia_i,\\lambda\\ge0\\}$ est fermé (libres, puis récurrence). 2. Si $p\\notin\\hat{\\mathsf K}$, séparer : la normale $w$ vérifie $\\ps{a_i}{w}\\le0$ et $\\ps{p}{w}<0$, contradiction."], ["KKT", "2.5.17", "Relire « $\\lambda\\ge0$, $F(u)\\le0$, $\\lambda\\cdot F(u)=0$ » avec le Lagrangien ?", "C'est l'inéquation d'Euler pour la **maximisation** de $\\mu\\mapsto\\Lag(u,\\mu)$ sur le convexe $(\\R^+)^M$ : $F(u)\\cdot(\\mu-\\lambda)\\le0$ pour tout $\\mu\\ge0$."], ["Dualité", "2.6.2", "Un point-selle donne-t-il un minimum sans convexité ?", "Oui (Prop. 2.6.2) : $u\\in K$ minimum global, et stationnarité si dérivable. La convexité ne sert qu'à la réciproque (Kuhn–Tucker)."], ["Dualité", "2.6.4", "Que dit Kuhn–Tucker ?", "$J,F_i$ convexes, contraintes qualifiées en $u$ : $u$ minimum global ⟺ ∃ $p\\ge0$ point-selle ⟺ KKT (2.63). Sens ⇐ sans qualification."], ["Dualité", "2.6.9", "Dualité faible : énoncé et preuve en une ligne.", "$\\sup_q\\inf_v\\Lag\\le\\inf_v\\sup_q\\Lag$, car $\\inf_{v'}\\Lag(v',q)\\le\\Lag(v,q)$ pour tous $v,q$ ; sup en $q$, inf en $v$. (Diapos : inégalité inversée.)"], ["Dualité", "2.6.12", "Pourquoi le dual est-il souvent plus facile ?", "$\\mathcal G$ est concave (inf de fonctions affines de $q$), contraintes $q\\ge0$ triviales ; on calcule $p$ puis $u=\\argmin\\Lag(\\cdot,p)$ sans contrainte. $\\mathcal G'(q)=F(u_q)$."], ["Gradient", "3.2.1", "Propriété géométrique du gradient à pas optimal ?", "Deux gradients successifs sont orthogonaux (3.6) : zigzag. Hypothèses : α-convexe, $J'$ lipschitzienne sur les bornés."], ["Gradient", "3.2.6", "Condition sur le pas et facteur de contraction du Théorème 3.2.6 ?", "$0<\\mu<2\\alpha/L^2$, $\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}$. Preuve : contraction de $v\\mapsto v-\\mu J'(v)$, (2.24) sur le double produit, Lipschitz sur le carré."], ["Gradient", "3.3.1", "Pas optimal du gradient à pas fixe et vitesse associée ?", "$\\mu=\\frac2{L+\\alpha}$, $\\gamma=\\frac{L-\\alpha}{L+\\alpha}=\\frac{\\kappa-1}{\\kappa+1}$, pour $0<\\mu<2/L$ (Prop. 3.3.1 : $C^2$, dim. finie)."], ["Gradient", "3.2.9", "Lemme de descente : énoncé ?", "$J'$ $L$-lip., $v^*=v-\\mu J'(v)$ : $J(v)-J(v^*)\\ge\\mu(1-\\frac{L\\mu}2)\\norm{J'(v)}^2$, sans convexité ; maximal pour $\\mu=1/L$."], ["Accélérés", "3.3.7", "Facteurs : gradient, Nesterov, boule pesante ?", "Gradient $\\frac{\\kappa-1}{\\kappa+1}\\approx1-\\frac2\\kappa$ ; Nesterov $1-\\frac1{\\sqrt\\kappa}$ ; boule pesante et GC $\\frac{\\sqrt\\kappa-1}{\\sqrt\\kappa+1}\\approx1-\\frac2{\\sqrt\\kappa}$."], ["Accélérés", "3.3.17", "Pourquoi le gradient conjugué termine-t-il en au plus $N$ itérations ?", "Directions conjuguées $Ap^{n+1}\\cdot p^n=0$ : chaque pas minimise exactement dans une nouvelle direction sans défaire les précédentes ; $N$ directions indépendantes."], ["Non lisse", "3.3.19", "Sous-différentiel : définition et trois propriétés ?", "$\\partial J(x)=\\{p : J(y)-J(x)\\ge p\\cdot(y-x)\\ \\forall y\\}$. Dérivable ⇒ $\\{J'(x)\\}$ ; $0\\in\\partial J(x)$ ⇒ minimum ; sup de convexes dérivables ⇒ $J_\\lambda'(x)$ sous-gradient si active."], ["Non lisse", "3.3.23", "Conditions (3.39) sur les pas du sous-gradient et rôle de chacune ?", "$\\rho_k\\to0$ ; $\\sum\\rho_k=\\infty$ (pouvoir atteindre le minimum) ; $\\sum\\rho_k^2<\\infty$ (amortir les oscillations). Exemple $\\rho_k=(k+1)^{-1/2-\\eps}$."], ["Non lisse", "3.3.32", "Pourquoi l'algorithme proximal converge-t-il sans condition sur le pas ?", "Schéma implicite : $x^{k+1}$ minimise la fonction $\\frac1\\tau$-convexe $J+\\frac1{2\\tau}\\norm{\\cdot-x^k}^2$ ; l'inégalité de forte convexité en ce point donne la décroissance pour tout $\\tau>0$."], ["Contraintes", "3.4.1", "Pourquoi $u=P_K(u-\\mu J'(u))$ ?", "Euler $\\ps{J'(u)}{v-u}\\ge0$ ⟺ $\\ps{u-(u-\\mu J'(u))}{v-u}\\ge0$ ⟺ (8.1) : $u$ est la projection de $u-\\mu J'(u)$. Point fixe d'une contraction ($P_K$ 1-lip.)."], ["Contraintes", "3.4.3", "Pourquoi un « + » dans $p^{n+1}=P_{\\R^M_+}(p^n+\\mu F(u^n))$ ?", "Pas de gradient projeté **montant** sur le dual concave, dont le gradient est $\\mathcal G'(p^n)=F(u^n)$ ; projeter sur $\\R^M_+$ = tronquer."], ["Contraintes", "3.4.3", "Hypothèses et conclusion exactes du Théorème 3.4.3 ?", "$J$ α-convexe différentiable ; $F$ convexe et $L$-lipschitzienne ; $0<\\mu<2\\alpha/L^2$ ⇒ $u^n\\to u$ pour tout $p^0$. Rien sur $p^n$."], ["Contraintes", "3.4.6", "Pénalisation : admissible ? multiplicateur ? défaut ?", "$u_\\eps$ non admissible en général (extérieure) ; $\\frac2\\eps\\max(F_i(u_\\eps),0)\\to\\lambda_i$ ; mauvais conditionnement quand $\\eps\\to0$."], ["Contraintes", "3.4.8", "Avantage du Lagrangien augmenté sur la pénalisation ?", "Avec le bon multiplicateur, une raideur **finie** $\\mu\\ge\\mu_0$ suffit (Lemme 3.4.8, sous (3.88)) ; $\\lambda^{n+1}=\\lambda^n+\\mu F(v^n)$ corrige λ ; pas de mauvais conditionnement."], ["Newton", "3.5.1", "Newton : vitesse, hypothèses, défauts ?", "Quadratique $\\norm{u^{n+1}-u}\\le C\\norm{u^n-u}^2$ près d'un zéro régulier ($F\\in C^2$, $F'(u)$ inversible, $u^0$ proche). Défauts : local, Hessienne + système linéaire, peut viser un max ou un col."], ["Newton", "NL", "Quand la matrice de Newton–Lagrange est-elle inversible ?", "Si $(J''(u)+\\lambda\\cdot G''(u))(w,w)>0$ pour tout $w\\ne0$ de $\\Ker G'(u)$ (3.95) : version stricte de l'ordre 2 (2.5.13). Avec $J''$ seule, ça peut diverger (Rem. 3.5.4)."], ["Adjoint", "3.7.6", "Pourquoi l'état adjoint donne-t-il le gradient pour un seul calcul ?", "$\\tilde J(v)=\\Lag(v,y(v),p)$ pour tout $p$ ; le $p$ qui annule $\\partial_y\\Lag$ tue le terme en $y'(v)$ ; reste $\\partial_v\\Lag$ : une résolution adjointe au lieu de $N$."], ["Techniques", "T1", "Les cinq temps de la méthode directe ?", "Suite minimisante → bornée → extraire (fort / faible) → limite dans $K$ (fermé / faiblement fermé) → passer à la limite (continue, sci / faiblement sci)."], ["Techniques", "T7", "Le gabarit « contraction » ?", "$u=T(u)$ ; $u^{n+1}-u=T(u^n)-T(u)$ ; $\\norm{T(v)-T(w)}\\le\\gamma\\norm{v-w}$, $\\gamma<1$ ; itérer : $\\gamma^n\\norm{u^0-u}$."], ["Techniques", "T8", "Le gabarit « Lyapunov » ?", "$E_n\\ge0$ et $E_{n+1}\\le E_n-c\\,e_n$ ; sommer : $c\\sum e_n\\le E_0$, donc $e_n\\to0$. Uzawa : $E_n=\\norm{p^n-p}^2$, $e_n=\\norm{u^n-u}^2$."]], "mnemos": [{"t": "**F·C·I** — Fermé, Continue, Infinie à l'infini : les trois clés de l'existence en dimension finie (2.2.1). En dimension infinie : **F·C·I + C** (convexe).", "ids": ["2.2.1", "2.3.9"]}, {"t": "**Les trois C de l'existence** — Compacité (dim. finie, 2.2.1) · Convexité (Hilbert, 2.3.9) · Courbure α (2.3.8 : en plus unicité, estimation, suites minimisantes).", "ids": ["2.2.1", "2.3.9", "2.3.8"]}, {"t": "« **Convexe : local = global. Strict : au plus un. Fort : un seul, stable, et les algorithmes convergent.** »", "ids": ["2.3.4", "2.3.8"]}, {"t": "« **4/α vient du 1/8 du milieu.** » ($\\theta=\\frac12$ dans (2.9) ; avec la dérivée : $2/\\alpha$.)", "ids": ["2.3.8"]}, {"t": "« **Sous les cordes, au-dessus des tangentes, gradient monotone** » : les trois visages de la convexité (2.4.4–2.4.5).", "ids": ["2.4.4"]}, {"t": "« **α en dessous, L au-dessus** » : l'encadrement quadratique (2.23) + (2.4.10), tout le secret du chapitre 3.", "ids": ["2.4.10"]}, {"t": "« **Aucune direction admissible ne descend** » (2.5.5) : le principe unique ; les théorèmes ne diffèrent que par le cône et l'outil (orthogonal / Farkas).", "ids": ["2.5.5"]}, {"t": "« **Égalité = signe libre ; inégalité = signe positif et complémentaire.** » (2.5.6 vs 2.5.17)", "ids": ["2.5.6", "2.5.17"]}, {"t": "**S·A·P·C** — Stationnarité, Admissibilité, Positivité, Complémentarité : les quatre lignes de KKT. Image : « un mur ne fait que pousser (λ ≥ 0), et seulement si on le touche (λ·F = 0) ».", "ids": ["2.5.17"]}, {"t": "**A·L·S** — Affines ? Libres ? Slater ? : le réflexe de qualification (2.5.16, 2.5.25, 2.5.27).", "ids": ["2.5.15"]}, {"t": "« **Minimiser, écrire $F\\le0$, additionner $\\lambda F$ avec $\\lambda\\ge0$** » : la convention de signe du Lagrangien.", "ids": ["2.5.17"]}, {"t": "« **Projection ⇒ Farkas ⇒ KKT** » : le cœur du chapitre 2 tient en une chaîne.", "ids": ["2.5.19"]}, {"t": "« **La courbure qui compte est celle du Lagrangien, sur le plan tangent.** » (2.5.13, (3.95))", "ids": ["2.5.13"]}, {"t": "« **Le dual est dessous** » : $\\sup\\inf\\le\\inf\\sup$ toujours ; la convexité et la qualification referment l'écart (2.6.11, 2.6.4, 2.6.12).", "ids": ["2.6.9"]}, {"t": "« **Un col : min en $v$, max en $q$.** Point-selle ⇒ minimum sans convexité ; la réciproque, c'est Kuhn–Tucker. » (2.6.2, 2.6.4)", "ids": ["2.6.2"]}, {"t": "« **Deux alpha sur L carré** » : le seuil commun du gradient, du gradient projeté et d'Uzawa (3.2.6, 3.4.1, 3.4.3) ; « **deux sur L** » : le vrai seuil (3.3.1).", "ids": ["3.2.6"]}, {"t": "« **Développer le carré : α sur le double produit, L sur le carré.** » (preuve T7 de 3.2.6)", "ids": ["3.2.6"]}, {"t": "« **κ pour le gradient, √κ pour les accélérés, rien pour Newton (mais seulement près du but).** »", "ids": ["3.3.1", "3.3.7", "3.5.1"]}, {"t": "« **Uzawa : descente en $u$, montée en $p$** » — un gradient projeté sur le dual, dont le gradient est $F(u^n)$ ; c'est $F$ qui doit être lipschitzienne.", "ids": ["3.4.3"]}, {"t": "« **Sous-gradient : $\\sum\\rho=\\infty$ pour arriver, $\\sum\\rho^2<\\infty$ pour s'arrêter.** »", "ids": ["3.3.23"]}, {"t": "« **Pénalisation : le mur devient ressort ; la tension du ressort, c'est λ** » ($\\frac2\\eps\\max(F_i,0)\\to\\lambda_i$). Lagrangien augmenté : ressort + bon λ = raideur finie.", "ids": ["3.4.6", "3.4.8"]}, {"t": "« **Newton : remplacer $F$ par sa tangente ; les chiffres exacts doublent — si l'on part près.** »", "ids": ["3.5.1"]}, {"t": "« **Dériver une valeur optimale, c'est ne jamais dériver la solution** » (2.5.12, $\\mathcal G'=F(u_q)$, adjoint).", "ids": ["2.5.12", "3.7.6"]}, {"t": "« **Faisable ou pas ?** Gradient projeté : oui ($u^n\\in K$). Uzawa, pénalisation, Lagrangien augmenté : non, seule la limite est admissible. »", "ids": ["3.4.1", "3.4.3"]}], "nombres": [["$\\frac4\\alpha$", "estimation (2.14) de 2.3.8 ; $\\frac2\\alpha$ si $J$ dérivable (Euler + (2.23))", "2.3.8"], ["$\\frac\\alpha8$", "inégalité du milieu (2.10), $\\theta=\\frac12$", "2.3.6"], ["$\\frac\\alpha2$, $\\frac L2$", "les deux paraboles du sandwich (2.23), (2.4.10)", "2.4.10"], ["$\\frac{2\\alpha}{L^2}$", "seuil du pas : gradient 3.2.6, gradient projeté 3.4.1, Uzawa 3.4.3", "3.2.6"], ["$\\frac{\\alpha}{L^2}$, $\\sqrt{1-\\alpha^2/L^2}$", "meilleur pas et taux **pour la borne** de 3.2.6 (Rem. 3.2.8) — pessimiste", "3.2.6"], ["$\\frac2L$", "vrai seuil du pas fixe (3.3.1, 3.2.9, 3.3.3)", "3.3.1"], ["$\\frac2{L+\\alpha}$, $\\frac{\\kappa-1}{\\kappa+1}$", "pas optimal et taux optimal du gradient (3.3.1)", "3.3.1"], ["$\\frac1L$", "pas qui maximise la descente garantie (3.2.10) ; pas de Nesterov (3.3.7, 3.3.10)", "3.2.9"], ["$\\mu\\big(1-\\frac{L\\mu}2\\big)\\norm{J'(v)}^2$", "gain garanti d'un pas de gradient (lemme de descente)", "3.2.9"], ["$\\frac{\\kappa}{n+1}$", "gradient, convexe seulement (3.3.3), avec $\\kappa=\\norm{u^0-u}^2/(\\mu(1-L\\mu/2))$", "3.3.3"], ["$\\frac{\\kappa}{(n+2)^2}$", "Nesterov, convexe (3.3.7)", "3.3.7"], ["$1-\\sqrt{\\alpha/L}$", "Nesterov, α-convexe (3.3.10)", "3.3.7"], ["$\\frac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}$", "boule pesante (3.3.15) et gradient conjugué (3.3.17, ×$2\\sqrt\\kappa$) ; BP : $\\nu=\\gamma_{BP}^2$, $\\mu=\\frac4{(\\sqrt L+\\sqrt\\alpha)^2}$", "3.3.15"], ["$N$", "nombre maximal d'itérations du gradient conjugué (quadratique en dimension $N$)", "3.3.17"], ["$\\rho_k=(k+1)^{-1/2-\\eps}$, $C/k^{1/2-\\eps}$", "pas type et vitesse du sous-gradient (3.3.23, Rem. 3.3.25)", "3.3.23"], ["$\\mu^k=\\frac1{k+1}$", "pas du gradient stochastique (3.3.28)", "3.3.28"], ["$(1+2\\tau\\alpha)^{-k}$", "algorithme proximal, α-convexe (3.3.32)", "3.3.32"], ["$\\frac2\\eps\\max(F_i(u_\\eps),0)\\to\\lambda_i$", "le multiplicateur caché de la pénalisation (Ex. 3.4.3)", "3.4.6"], ["$C\\norm{u^n-u}^2$, $C^{-1}(C\\eps)^{2^n}$", "Newton (3.92), $C=C_1C_2/2$", "3.5.1"], ["$\\mathcal G'(q)=F(u_q)$", "gradient de la fonction duale (fonde Uzawa)", "2.6.12"], ["$\\lambda_i=-\\partial_{\\ell_i}J_{\\min}(0)$", "sensibilité (2.5.12, 2.6.6)", "2.5.12"]], "musee": [["$K$ fermé", "2.2.1 / 2.3.8", "$J(x)=x$ sur $]0,2]$", "la limite $0$ de la suite minimisante sort de $K$"], ["$J$ continue (sci)", "2.2.1", "$J(x)=x^2$ ($x\\ne0$), $J(0)=1$ sur $[-2,2]$", "$J$ saute vers le haut à la limite ; $\\inf=0$ non atteint. (Un saut vers le bas, sci, convient.)"], ["infinie à l'infini", "2.2.1 / 2.3.9", "$J(x)=e^x$ sur $\\R$", "la suite minimisante $-n$ s'échappe"], ["dimension finie", "2.2.1", "$\\ell^2$, $J=(\\norm x^2-1)^2+\\sum x_i^2/i$", "$(e_n)$ bornée sans sous-suite convergente"], ["$J$ convexe", "2.3.9", "le même exemple dans $\\ell^2$", "la limite faible $0$ fait moins bien que la suite ($J(0)=1>0$)"], ["$K$ convexe", "2.3.4", "$x^2$ sur $[-2,-1]\\cup[\\frac12,3]$", "minimum local en $-1$ non global"], ["strictement convexe ⇒ existence ?", "2.3.4", "$e^x$", "au plus un, jamais au moins un"], ["α-convexe (pas seulement strict)", "2.3.8", "$e^x$ ; $x^4$", "pas de minimum / pas de contraction"], ["$K$ convexe", "2.3.8", "$x^2$ sur $\\{-1,1\\}$", "deux minima ; le milieu sort de $K$"], ["majorée sur une boule", "2.3.5", "forme linéaire non continue (dim. infinie)", "convexe mais discontinue"], ["Fréchet (pas seulement Gâteaux)", "2.4.1", "$\\frac{x^6}{(y-x^2)^2+x^8}$", "dérivées directionnelles nulles, mais discontinue"], ["$J'$ lipschitzienne", "2.4.10", "$x^4$", "aucune parabole ne majore globalement"], ["$J$ convexe (pour la suffisance d'Euler)", "2.5.1", "$-x^2$ sur $[-1,1]$", "Euler en $0$, qui est un maximum"], function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function refChip(id){

}
function md(s, opt){
  opt = opt || {};
  if(!s) return '';
  let t = esc(s);
  if(opt.cloze) t = clozeTransform(t);
  else t = t.replace(/\[\[([\s\S]+?)\]\]/g, '$1');
  t = t.replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>');
  t = t.replace(/§([0-9]+\.[0-9]+(?:\.[0-9]+)?|T[0-9]+|NL)/g, (m, id) => refChip(id));

function clozeTransform(t){
  // Transforme [[...]] en trous, y compris à l'intérieur d'une formule $...$ (on ferme et rouvre les délimiteurs).
  let out = '', inMath = false, i = 0;
  const open = '<span class="cz" tabindex="0"><span class="cz-in">', close = '</span></span>';
  while(i < t.length){
    if(t.startsWith('[[', i)){
      const j = t.indexOf(']]', i + 2);
      if(j < 0){ out += t.slice(i); break; }
      const b = t.slice(i + 2, j);
      if(inMath){
        if(out.endsWith('$')) out = out.slice(0, -1); else out += '$';
        out += open + '$' + b + '$' + close;
        i = j + 2;
        if(t[i] === '$'){ i++; inMath = false; } else out += '$';
      } else {
        out += open + b + close;

/* ---------------- fiche card ---------------- */
function ficheHTML(f, opts){

function treeNode(n, depth){
  const has = n.ch && n.ch.length;
  let h = '<li class="'+(depth>=2&&has?'closed':'')+'"><div class="node k-'+(n.k||'q')+'"><button class="tg'+(has?'':' empty')+'" aria-label="déplier"></button><div class="txt">'+md(n.t)+(n.id?' '+refChip(n.id):'')+'</div></div>';
  if(has) h += '<ul>'+n.ch.map(c=>treeNode(c,depth+1)).join('')+'</ul>';
  return h+'</li>';
}
function vFiches(){
  const list = D.fiches.filter(visible);

  h += '<div class="bar"><button data-fall="hideH">masquer toutes les hypothèses</button><button data-fall="hideC">masquer toutes les conclusions</button><button data-fall="show">tout afficher</button><span class="sp"></span><button data-fall="ko">ne garder que « à revoir »</button><span>'+list.length+' fiche'+(list.length>1?'s':'')+'</span></div>';

  list.forEach(f => {
    if(f.sec !== sec){ sec = f.sec; h += '<div class="sec-h fsec">'+esc(sec)+'</div>'; }
    h += ficheHTML(f);

}
function cellHTML(c){
  let cls = '', t = c || '';
  if(t.startsWith('!')){ cls = 'chg'; t = t.slice(1); }
  else if(t.startsWith('+')){ cls = 'gain'; t = t.slice(1); }
  else if(t.startsWith('~')){ cls = 'miss'; t = t.slice(1); }
  return '<td class="'+cls+'">'+md(t)+'</td>';
}

function vPourquoi(){
  let h = '<p class="lead">Le <b>musée des contre-exemples</b> : pour chaque hypothèse, la fonction la plus simple qui la viole et pour laquelle la conclusion tombe. Comprendre pourquoi une hypothèse est là, c\'est la retenir sans effort — et c\'est ce qu\'on demande à l\'oral comme à l\'écrit.</p>';
  h += '<div class="tscroll"><table class="musee"><thead><tr><th>Hypothèse</th><th>Résultat</th><th>Contre-exemple minimal</th><th>Ce qui casse</th></tr></thead><tbody>';

  h += '<div class="note">La méta-technique : devant une hypothèse, chercher d\'abord <b>quelle étape de la preuve</b> l\'utilise (fermé → la limite reste dans $K$ ; continue → passer à la limite ; infinie à l\'infini → borner ; convexe → direction admissible / extraction faible ; α → Cauchy, contraction ; Lipschitz → majoration quadratique ; qualification → la linéarisation ne ment pas). Les fiches donnent ce rôle à côté de chaque hypothèse.</div>';

function vEntrainer(){
  let h = '<p class="lead">Trois exercices de rappel actif. <b>À trous</b> : clique chaque trou pour vérifier ta réponse. <b>Cartes</b> : réponds à voix haute, retourne, marque. <b>Quel théorème ?</b> : des situations concrètes à relier au bon résultat.</p>';
  h += '<div class="bar"><button data-sub="cloze"'+(state.sub==='cloze'?' class="on"':'')+'>Énoncés à trous</button><button data-sub="cartes"'+(state.sub==='cartes'?' class="on"':'')+'>Cartes</button><button data-sub="quiz"'+(state.sub==='quiz'?' class="on"':'')+'>Quel théorème ?</button><span class="sp"></span><span id="score"></span></div><div id="sub"></div>';

function subCloze(){
  let list = D.fiches.filter(f => f.cloze && visible(f));
  if(state.onlyKo) list = list.filter(f => state.marks[f.id]==='ko');
  let h = '<div class="bar"><button data-call="reveal">tout révéler</button><button data-call="hide">tout masquer</button><button data-call="shuffle">mélanger</button><button data-call="ko"'+(state.onlyKo?' class="on"':'')+'>seulement « à revoir »</button><span class="sp"></span><span>'+list.length+' énoncé'+(list.length>1?'s':'')+'</span></div>';
  if(!list.length) return h+'<div class="empty">Rien à afficher avec ce filtre.</div>';
  if(state.shuffled) list = shuffle(list.slice());
  return h + list.map(clozeHTML).join('');
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDeck(){
  let cards = D.cartes.map((c,i)=>({i, cat:c[0], id:c[1], r:c[2], v:c[3]}));
  cards = cards.filter(c => { const f = byId[c.id]; return !f || !f.prio || visible(f); });
  if(state.onlyKo) cards = cards.filter(c => state.marks['card:'+c.i]==='ko');
  state.deck = {cards: shuffle(cards), idx:0, flipped:false};
}
function subCartes(){
  if(!state.deck) buildDeck();
  const d = state.deck;
  let h = '<div class="bar"><button data-cact="restart">recommencer / mélanger</button><button data-cact="ko"'+(state.onlyKo?' class="on"':'')+'>seulement « à revoir »</button><span class="sp"></span><span style="color:var(--ink3)">espace : retourner · 1 : su · 2 : à revoir</span></div>';
  const nOk = Object.keys(state.marks).filter(k=>k.startsWith('card:')&&state.marks[k]==='ok').length;
  const nKo = Object.keys(state.marks).filter(k=>k.startsWith('card:')&&state.marks[k]==='ko').length;
  h += '<div class="prog"><span>carte '+Math.min(d.idx+1,d.cards.length)+' / '+d.cards.length+'</span><div class="pb"><i style="width:'+(d.cards.length?100*d.idx/d.cards.length:0)+'%"></i></div><span style="color:var(--ok)">'+nOk+' sues</span><span style="color:var(--ko)">'+nKo+' à revoir</span></div>';
  if(!d.cards.length) return h+'<div class="empty">Aucune carte avec ce filtre.</div>';
  if(d.idx >= d.cards.length) return h+'<div class="deck"><div class="fc" style="--c:var(--acc)"><div class="front">Paquet terminé.</div><div class="back">'+nKo+' carte'+(nKo>1?'s':'')+' marquée'+(nKo>1?'s':'')+' « à revoir ». Recommence avec le filtre « seulement à revoir » pour les retravailler.</div><div class="act"><button class="bigbtn pri" data-cact="restart">Recommencer</button></div></div></div>';
  const c = d.cards[d.idx]; const f = byId[c.id]; const col = f ? colorOf(f) : 'var(--outil)';
  h += '<div class="deck"><div class="fc" style="--c:'+col+'"><div class="cat">'+esc(c.cat)+' '+refChip(c.id)+'</div><div class="front">'+md(c.r)+'</div><div class="back'+(d.flipped?'':' hidden')+'">'+md(c.v)+'</div><div class="act">';
  if(!d.flipped) h += '<button class="bigbtn pri" data-cact="flip">Retourner</button>';
  else h += '<button class="bigbtn ok" data-cact="ok">✓ Je savais</button><button class="bigbtn ko" data-cact="ko2">✗ À revoir</button>';
  h += '<button class="bigbtn" data-cact="skip" style="margin-left:auto">passer</button></div></div></div>';
  return h;
}

/* ---------------- render ---------------- */
const VIEWS = {squelette:vSquelette, fiches:vFiches, comparer:vComparer, pourquoi:vPourquoi, entrainer:vEntrainer, memo:vMemo};
const rendered = {};
function show(view){
  state.view = view;
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view===view));
  $$('.view').forEach(v => v.classList.toggle('on', v.id==='v-'+view));
  if(!rendered[view] || view==='squelette') render(view);
  if(view==='entrainer') renderSub();
  if(location.hash !== '#'+view) history.replaceState(null,'','#'+view);
  window.scrollTo({top:0});
}
function render(view){
  const el = $('#v-'+view); el.innerHTML = VIEWS[view](); renderMath(el); rendered[view] = true;
}
function invalidate(){ ['fiches','entrainer'].forEach(v => rendered[v] = false); if(state.view==='fiches'||state.view==='entrainer'){ render(state.view); if(state.view==='entrainer') renderSub(); } }
function renderSub(){
  const el = $('#sub'); if(!el) return;
  $$('[data-sub]').forEach(b => b.classList.toggle('on', b.dataset.sub===state.sub));
  el.innerHTML = state.sub==='cloze' ? subCloze() : state.sub==='cartes' ? subCartes() : subQuiz();
  renderMath(el);
}
function openFiche(id){
  const o = byId[id]; if(!o) return;
  const m = $('#modal'); const inner = $('#modal .inner');
  inner.innerHTML = '<button class="close" aria-label="fermer">×</button>' + (/^T\d+$/.test(id) ? techHTML(o) : ficheHTML(o,{modal:true}));
  renderMath(inner); m.showModal(); inner.scrollTop = 0;
}
function openCloze(id){
  const f = byId[id]; if(!f || !f.cloze) return;
  const m = $('#modal'); const inner = $('#modal .inner');
  inner.innerHTML = '<button class="close" aria-label="fermer">×</button>' + clozeHTML(f);
  renderMath(inner); m.showModal();
}
function setMark(key, val){
  if(state.marks[key]===val) delete state.marks[key]; else state.marks[key]=val;
  save();
  $$('[data-key="'+key+'"]').forEach(b => b.classList.toggle('on', state.marks[key]===b.dataset.mark));
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target;
  const ref = t.closest('.ref'); if(ref){ e.preventDefault(); openFiche(ref.dataset.id); return; }
  if(t.closest('#modal .close')){ $('#modal').close(); return; }
  const tab = t.closest('.tabs button'); if(tab){ show(tab.dataset.view); return; }
  const seg = t.closest('.seg button'); if(seg){
    if(seg.dataset.prio){ state.prio = +seg.dataset.prio; } else if(seg.dataset.chap){ state.chap = seg.dataset.chap; }
    $$('.seg button').forEach(b => { if(b.dataset.prio) b.classList.toggle('on', +b.dataset.prio===state.prio); if(b.dataset.chap) b.classList.toggle('on', b.dataset.chap===state.chap); });
    save(); state.deck = null; invalidate(); return;
  }
  if(t.closest('#theme')){ const cur = document.documentElement.dataset.theme||''; const next = cur==='' ? 'dark' : cur==='dark' ? 'light' : ''; if(next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme; state.theme = next; save(); toast(next==='' ? 'thème : automatique' : 'thème : '+(next==='dark'?'sombre':'clair')); return; }
  const tg = t.closest('.tree .tg'); if(tg){ tg.closest('li').classList.toggle('closed'); return; }
  const tb = t.closest('[data-tree]'); if(tb){ const ul = tb.parentElement.nextElementSibling; $$('li', ul).forEach(li => { if(li.querySelector(':scope > ul')) li.classList.toggle('closed', tb.dataset.tree==='close'); }); return; }
  const cz = t.closest('.cz'); if(cz){ cz.classList.toggle('on'); updCzStat(cz.closest('.clz')); return; }
  const mk = t.closest('[data-mark]'); if(mk){ setMark(mk.dataset.key, mk.dataset.mark); return; }
  const act = t.closest('[data-act]'); if(act){
    const a = act.dataset.act;
    if(a==='hideH'||a==='hideC'){ const card = act.closest('.fiche'); const row = card.querySelector(a==='hideH'?'.row.hyp':'.row.concl'); if(row){ row.classList.toggle('hide'); act.classList.toggle('on', row.classList.contains('hide')); } return; }
    if(a==='cloze'){ openCloze(act.closest('.fiche').id.replace(/^(f|m)-/,'')); return; }
    if(a==='revealAll'||a==='hideAll'){ const s = act.closest('.clz'); $$('.cz', s).forEach(c => c.classList.toggle('on', a==='revealAll')); updCzStat(s); return; }
    if(a==='open'){ openFiche(act.dataset.id); return; }
  }
  const hv = t.closest('.fiche .row.hide .v'); if(hv){ const row = hv.closest('.row'); row.classList.remove('hide'); const b = row.closest('.fiche').querySelector(row.classList.contains('hyp')?'[data-act="hideH"]':'[data-act="hideC"]'); if(b) b.classList.remove('on'); return; }
  const fall = t.closest('[data-fall]'); if(fall){
    const a = fall.dataset.fall;
    if(a==='ko'){ state.onlyKo = !state.onlyKo; fall.classList.toggle('on', state.onlyKo); $$('#v-fiches .fiche').forEach(c => { c.style.display = (!state.onlyKo || state.marks[c.id.slice(2)]==='ko') ? '' : 'none'; }); return; }
    $$('#v-fiches .fiche').forEach(c => {
      const rh = c.querySelector('.row.hyp'), rc = c.querySelector('.row.concl');
      if(a==='show'){ if(rh) rh.classList.remove('hide'); if(rc) rc.classList.remove('hide'); }
      if(a==='hideH' && rh) rh.classList.add('hide');
      if(a==='hideC' && rc) rc.classList.add('hide');
      $$('[data-act="hideH"],[data-act="hideC"]', c).forEach(b => { const r = c.querySelector(b.dataset.act==='hideH'?'.row.hyp':'.row.concl'); b.classList.toggle('on', !!(r && r.classList.contains('hide'))); });
    });
    return;
  }
  const sub = t.closest('[data-sub]'); if(sub){ state.sub = sub.dataset.sub; renderSub(); return; }
  const call = t.closest('[data-call]'); if(call){
    const a = call.dataset.call;
    if(a==='reveal'||a==='hide'){ $$('#sub .cz').forEach(c => c.classList.toggle('on', a==='reveal')); $$('#sub .clz').forEach(updCzStat); return; }
    if(a==='shuffle'){ state.shuffled = !state.shuffled; renderSub(); return; }
    if(a==='ko'){ state.onlyKo = !state.onlyKo; renderSub(); return; }
  }
  const cact = t.closest('[data-cact]'); if(cact){
    const a = cact.dataset.cact; const d = state.deck;
    if(a==='restart'){ buildDeck(); renderSub(); return; }
    if(a==='ko'){ state.onlyKo = !state.onlyKo; buildDeck(); renderSub(); return; }
    if(a==='flip'){ d.flipped = true; renderSub(); return; }
    if(a==='skip'){ d.idx++; d.flipped=false; renderSub(); return; }
    if(a==='ok'||a==='ko2'){ const c = d.cards[d.idx]; state.marks['card:'+c.i] = (a==='ok'?'ok':'ko'); save(); d.idx++; d.flipped=false; renderSub(); return; }
  }
  const qact = t.closest('[data-qact]'); if(qact){ if(qact.dataset.qact==='reset'){ renderSub(); } return; }
  const opt = t.closest('.qz .opt'); if(opt){
    const qz = opt.closest('.qz'); const q = D.quiz[+qz.dataset.qi]; const k = +opt.dataset.k;
    $$('.opt', qz).forEach(o => { o.disabled = true; if(+o.dataset.k===q.ok) o.classList.add('right'); });
    if(k!==q.ok) opt.classList.add('wrong');
    qz.querySelector('.exp').classList.add('on'); qz.dataset.res = (k===q.ok?'1':'0');
    const done = $$('#sub .qz[data-res]'); const good = done.filter(z=>z.dataset.res==='1').length;
    $('#qscore').textContent = good+' / '+done.length+' bonnes réponses'; return;
  }
});
function updCzStat(s){ if(!s) return; const all = $$('.cz', s), on = all.filter(c=>c.classList.contains('on')); const st = s.querySelector('.st'); if(st) st.textContent = on.length+' / '+all.length+' révélés'; }
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ const m = $('#modal'); if(m.open) m.close(); return; }
  if(state.view!=='entrainer' || state.sub!=='cartes' || !state.deck) return;
  if(e.target.tagName==='INPUT') return;
  const d = state.deck; if(d.idx>=d.cards.length) return;
  if(e.key===' '){ e.preventDefault(); if(!d.flipped){ d.flipped=true; renderSub(); } }
  else if(d.flipped && (e.key==='1'||e.key==='2')){ const c = d.cards[d.idx]; state.marks['card:'+c.i] = (e.key==='1'?'ok':'ko'); save(); d.idx++; d.flipped=false; renderSub(); }
});
$('#modal').addEventListener('click', e => { if(e.target === e.currentTarget) e.currentTarget.close(); });
let qt;
$('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(()=>{ state.q = plain(e.target.value).trim(); invalidate(); if(state.view!=='fiches' && state.view!=='entrainer' && state.q) show('fiches'); }, 220); });

/* ---------------- init ---------------- */
$$('.seg button').forEach(b => { if(b.dataset.prio) b.classList.toggle('on', +b.dataset.prio===state.prio); if(b.dataset.chap) b.classList.toggle('on', b.dataset.chap===state.chap); });
function route(){
  const h = (location.hash||'').slice(1);
  let m;
  if((m = /^fiche-(.+)$/.exec(h))){
    if(state.view!=='fiches' || !rendered.fiches) show('fiches');
    const el = document.getElementById('f-'+m[1]);
    if(el){ el.scrollIntoView({block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } else openFiche(m[1]);
    history.replaceState(null,'','#fiches');
  }
  else if(VIEWS[h]){ if(h!==state.view || !rendered[h]) show(h); }
  else show('squelette');
}
route();
window.addEventListener('hashchange', route);
})();
</script>
