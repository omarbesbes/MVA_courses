<style>:root{
  --bg:#f6f5f1; --card:#ffffff; --card2:#fbfaf7; --ink:#1b1f27; --ink2:#454c5a; --ink3:#7a8190;
  --line:#e2e3e8; --line2:#c8ccd5;
  --acc:#1d4e89; --acc-bg:#e9f0fa; --acc-ink:#163d6d;
  --existence:#1d4e89; --unicite:#0f766e; --cn:#b45309; --cs:#15803d; --dual:#6d28d9; --algo:#b4123c; --outil:#475569; --contre:#9f1239;
  --chg-bg:#fff1dc; --chg-ink:#8a4b00; --gain-bg:#e3f5e9; --gain-ink:#166534; --miss-bg:#eef0f3; --miss-ink:#6b7280;
  --cz:#b45309; --cz-bg:#fff4e5; --ok:#15803d; --ko:#b4123c;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 20px -12px rgba(20,24,40,.18);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-text:"STIX Two Text","Source Serif Pro",Georgia,"Times New Roman",serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121419; --card:#1b1e26; --card2:#20242d; --ink:#e8e9ee; --ink2:#b8bcc8; --ink3:#848a99;
    --line:#2b303b; --line2:#3b4150;

    --cz:#f5b35b; --cz-bg:#33260f; --ok:#6ad38a; --ko:#f08aa2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:16.5px;line-height:1.5}
a{color:var(--acc)}
button{font:inherit;color:inherit}
.katex{font-size:1.02em}
.katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden;padding:.1em 0}
b,strong{font-weight:650}
small{font-size:.85em}
h1,h2,h3,h4{font-family:var(--f-ui);line-height:1.2;margin:0}
p{margin:.35em 0}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{font-family:var(--f-ui);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--ink3);font-size:.72rem;letter-spacing:0;margin-top:-2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;font-family:var(--f-ui)}
.tabs button{border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink2);font-size:.92rem;font-weight:500}
.tabs button:hover{background:var(--card2);border-color:var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto;font-family:var(--f-ui);font-size:.85rem}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--acc-bg);color:var(--acc-ink);font-weight:600}
.tools input[type=search]{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;background:var(--card);color:var(--ink);font:inherit;width:170px}
.iconbtn{border:1px solid var(--line2);background:transparent;border-radius:999px;width:32px;height:30px;cursor:pointer;color:var(--ink2);display:inline-grid;place-items:center;font-size:1.05rem;line-height:1;padding:0}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.view{display:none}.view.on{display:block}
.lead{color:var(--ink2);font-size:1.02rem;max-width:72ch}
.sec-h{font-family:var(--f-ui);font-size:1.35rem;font-weight:700;margin:26px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h small{font-weight:400;color:var(--ink3);font-size:.85rem}
.sub-h{font-family:var(--f-ui);font-size:1.05rem;font-weight:650;margin:18px 0 6px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.note{font-size:.95rem;color:var(--ink2);border-left:3px solid var(--line2);padding:6px 12px;margin:10px 0;background:var(--card2);border-radius:0 8px 8px 0}

/* ---------- chips / refs ---------- */
.ref{display:inline-block;font-family:var(--f-ui);font-size:.78rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--acc-bg);color:var(--acc-ink);text-decoration:none;cursor:pointer;border:1px solid transparent;vertical-align:baseline;line-height:1.4;white-space:nowrap}
.ref:hover{border-color:var(--acc)}
.ref.t{background:var(--miss-bg);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{display:inline-block;font-family:var(--f-ui);font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);text-transform:uppercase}
.tag.q-existence{color:var(--existence);border-color:var(--existence)}
.tag.q-unicite{color:var(--unicite);border-color:var(--unicite)}
.tag.q-cn{color:var(--cn);border-color:var(--cn)}
.tag.q-cs{color:var(--cs);border-color:var(--cs)}
.tag.q-dual{color:var(--dual);border-color:var(--dual)}
.tag.q-algo{color:var(--algo);border-color:var(--algo)}
.tag.q-outil{color:var(--outil);border-color:var(--outil)}
.tag.q-contre{color:var(--contre);border-color:var(--contre)}
.stars{font-family:var(--f-ui);font-size:.8rem;color:var(--cn);letter-spacing:.05em}
.stars small{color:var(--ink3);letter-spacing:0;margin-left:4px}

/* ---------- four questions ---------- */
.q4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.q4 .card{border-top:4px solid var(--c)}
.q4 h3{font-size:1.02rem;margin-bottom:6px;color:var(--c)}
.q4 p{font-size:.95rem;color:var(--ink2)}

/* ---------- ladders ---------- */
.ladder{display:flex;flex-direction:column;gap:0;margin:6px 0}
.ladder .step{display:grid;grid-template-columns:minmax(150px,.9fr) 2fr;gap:12px;padding:8px 12px;border-left:3px solid var(--c);background:linear-gradient(90deg,var(--card2),transparent);margin-left:calc(var(--i) * 14px);border-radius:0 8px 8px 0}
.ladder .step .n{font-family:var(--f-ui);font-weight:650;color:var(--c)}
.ladder .step .g{color:var(--ink2);font-size:.95rem}

/* ---------- trees ---------- */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:16px;border-left:1.5px solid var(--line2)}
.tree li{margin:5px 0;position:relative}
.tree li>.node{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.tree li>.node.k-q{background:transparent;border-style:dashed}
.tree li>.node.k-th{background:var(--card);border-color:var(--line2);border-left:4px solid var(--c)}
.tree li>.node.k-no{background:var(--miss-bg);color:var(--miss-ink);border-color:transparent}
.tree li>.node.k-note{background:transparent;border:0;color:var(--ink3);font-size:.92rem;font-style:italic}
.tree .tg{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-items:center;font-family:var(--f-ui);font-size:.9rem;color:var(--ink2);margin-top:2px}
.tree .tg.empty{display:none}
.tree li.closed>ul{display:none}
.tree li.closed>.node .tg::before{content:"+"}
.tree li:not(.closed)>.node .tg::before{content:"–"}
.tree .node .txt{flex:1;min-width:0}
.tree .node .ref{margin-left:6px}
.treebar{display:flex;gap:6px;margin:4px 0 8px;font-family:var(--f-ui);font-size:.85rem}
.treebar button,.bar button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;cursor:pointer;color:var(--ink2);font-family:var(--f-ui);font-size:.85rem}
.treebar button:hover,.bar button:hover{border-color:var(--acc);color:var(--acc)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center;font-family:var(--f-ui);font-size:.88rem}
.bar .sp{flex:1}
.bar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* ---------- chains ---------- */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0}
.chain .ct{font-family:var(--f-ui);font-weight:650;font-size:.88rem;color:var(--ink2);margin-right:8px;min-width:160px}
.chain .arrow{color:var(--ink3);font-family:var(--f-ui);font-size:.75rem;margin:0 2px;max-width:150px;text-align:center;line-height:1.2}
.chain .arrow::after{content:" →";color:var(--line2)}

/* ---------- fiches ---------- */
.fsec{margin-top:26px}
.fiche{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:12px 0;overflow:hidden;border-left:5px solid var(--c)}
.fiche.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--acc)}100%{box-shadow:var(--shadow)}}
.fiche .fh{padding:12px 16px 8px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:1px solid var(--line)}
.fiche .fh .lab{font-family:var(--f-ui);font-weight:700;color:var(--c);font-size:.95rem}
.fiche .fh .nom{font-family:var(--f-ui);font-weight:650;font-size:1.12rem}
.fiche .fh .sur{color:var(--ink3);font-style:italic;font-size:.95rem;flex-basis:100%}
.fiche .fh .meta{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fiche .fb{padding:6px 16px 12px}
.fiche .row{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.fiche .row:first-child{border-top:0}
.fiche .row .k{font-family:var(--f-ui);font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding-top:3px}
.fiche .row .v{min-width:0}
.fiche .row.hyp .v ul{margin:0;padding-left:1.1em}
.fiche .row.hyp .v li{margin:3px 0}
.fiche .role{display:block;color:var(--ink3);font-size:.88rem;font-family:var(--f-ui)}
.fiche .row.concl .v{font-size:1.02rem}
.fiche .row.manque .k{color:var(--contre)}
.fiche .row.diff .v>div{margin:3px 0}
.fiche .row.pourquoi .v table{border-collapse:collapse;width:100%;font-size:.93rem}
.fiche .row.pourquoi .v td{padding:3px 8px 3px 0;vertical-align:top;border-top:1px solid var(--line)}
.fiche .row.pourquoi .v td:first-child{font-family:var(--f-ui);font-weight:600;color:var(--ink2);white-space:nowrap}
.fiche .row.mnemo .v{background:var(--chg-bg);color:var(--chg-ink);border-radius:8px;padding:6px 10px}
.fiche .row.diapos .v{font-size:.93rem;color:var(--ink2)}
.fiche .hide .v{position:relative}
.fiche .hide .v>*{filter:blur(6px);user-select:none;pointer-events:none}
.fiche .hide .v::after{content:"masqué — cliquer pour révéler";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-ui);font-size:.82rem;color:var(--ink2);cursor:pointer;background:transparent}
.fbtn{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:2px 9px;cursor:pointer;font-family:var(--f-ui);font-size:.76rem;color:var(--ink2)}
.fbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fbtn.ok{border-color:var(--ok);color:var(--ok)}.fbtn.ok.on{background:var(--ok);color:#fff}
.fbtn.ko{border-color:var(--ko);color:var(--ko)}.fbtn.ko.on{background:var(--ko);color:#fff}
.empty{padding:20px;color:var(--ink3);text-align:center;font-family:var(--f-ui)}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:.93rem;min-width:620px}
table.cmp th,table.cmp td{padding:7px 10px;vertical-align:top;border-bottom:1px solid var(--line);text-align:left}
table.cmp th{font-family:var(--f-ui);font-size:.85rem;background:var(--card2);position:sticky;top:0;z-index:2}
table.cmp th small{display:block;font-weight:400;color:var(--ink3)}
table.cmp td:first-child,table.cmp th:first-child{position:sticky;left:0;background:var(--card2);z-index:3;font-family:var(--f-ui);font-size:.82rem;font-weight:650;color:var(--ink2);min-width:130px;max-width:170px;border-right:1px solid var(--line)}
table.cmp th:first-child{z-index:4}
table.cmp td.chg{background:var(--chg-bg);color:var(--chg-ink)}
table.cmp td.gain{background:var(--gain-bg);color:var(--gain-ink)}
table.cmp td.miss{background:var(--miss-bg);color:var(--miss-ink)}
table.cmp td.chg::before{content:"≠ ";font-family:var(--f-ui);font-weight:700;opacity:.6}
table.cmp td.gain::before{content:"+ ";font-family:var(--f-ui);font-weight:700;opacity:.6}
table.cmp td.miss::before{content:"– ";font-family:var(--f-ui);font-weight:700;opacity:.6}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-ui);font-size:.8rem;color:var(--ink2);margin:4px 0}
.legend span{padding:1px 8px;border-radius:6px}
.legend .chg{background:var(--chg-bg);color:var(--chg-ink)}.legend .gain{background:var(--gain-bg);color:var(--gain-ink)}.legend .miss{background:var(--miss-bg);color:var(--miss-ink)}

table.grille{border-collapse:separate;border-spacing:0;font-size:.82rem;min-width:900px}
table.grille th,table.grille td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
table.grille th{font-family:var(--f-ui);font-size:.75rem;font-weight:600;color:var(--ink2);background:var(--card2);position:sticky;top:0;z-index:2}
table.grille td:first-child,table.grille th:first-child{position:sticky;left:0;background:var(--card2);z-index:3;text-align:left;border-right:1px solid var(--line)}
table.grille td.dot{color:var(--cs);font-size:1.2rem;line-height:1}
table.grille td.txt{color:var(--ink2);font-size:.78rem}
table.grille td.last{text-align:left;font-size:.8rem;min-width:140px}
table.grille tr:hover td{background:var(--acc-bg)}

/* ---------- musée ---------- */
table.musee{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--card)}
table.musee th,table.musee td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.musee th{font-family:var(--f-ui);font-size:.82rem;background:var(--card2)}
table.musee td:first-child{font-family:var(--f-ui);font-weight:600;color:var(--ink2)}
table.musee td:last-child{color:var(--contre)}

/* ---------- cloze ---------- */
.cz{display:inline-block;border-bottom:2px dashed var(--cz);background:var(--cz-bg);border-radius:4px 4px 0 0;padding:0 .35em;cursor:pointer;min-width:2.2em;text-align:center;position:relative;line-height:1.35}
.cz .cz-in{visibility:hidden}
.cz.on{background:transparent;border-bottom-color:var(--ok)}
.cz.on .cz-in{visibility:visible;color:var(--ok);font-weight:600}
.cz:not(.on)::after{content:"?";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--cz);font-family:var(--f-ui);font-size:.8rem;font-weight:700}
.clz{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:10px 0;border-left:5px solid var(--c)}
.clz .ch{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.clz .ch .lab{font-family:var(--f-ui);font-weight:700;color:var(--c);font-size:.92rem}
.clz .ch .nom{font-family:var(--f-ui);font-weight:600}
.clz .body{font-size:1.04rem;line-height:1.75}
.clz .ft{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.clz .ft .st{margin-left:auto;font-family:var(--f-ui);font-size:.8rem;color:var(--ink3)}

/* ---------- flashcards ---------- */
.deck{max-width:760px;margin:0 auto}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:220px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--c)}
.fc .cat{font-family:var(--f-ui);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);display:flex;gap:8px;align-items:center}
.fc .front{font-size:1.15rem;font-family:var(--f-ui);font-weight:600}
.fc .back{border-top:1px dashed var(--line);padding-top:10px;font-size:1.04rem}
.fc .back.hidden{display:none}
.fc .act{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.bigbtn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 16px;cursor:pointer;font-family:var(--f-ui);font-weight:600}
.bigbtn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.bigbtn.ok{border-color:var(--ok);color:var(--ok)}.bigbtn.ko{border-color:var(--ko);color:var(--ko)}
.prog{font-family:var(--f-ui);font-size:.85rem;color:var(--ink3);display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.prog .pb{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;align-self:center;min-width:120px}
.prog .pb i{display:block;height:100%;background:var(--acc)}

/* ---------- quiz ---------- */
.qz{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.qz .qn{font-family:var(--f-ui);font-size:.78rem;color:var(--ink3);font-weight:700}
.qz .qq{margin:4px 0 8px;font-size:1.02rem}
.qz .opt{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--card2);border-radius:8px;padding:7px 12px;margin:5px 0;cursor:pointer}
.qz .opt:hover{border-color:var(--acc)}
.qz .opt.right{border-color:var(--ok);background:var(--gain-bg)}
.qz .opt.wrong{border-color:var(--ko);background:var(--chg-bg)}
.qz .opt:disabled{cursor:default}
.qz .exp{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--acc-bg);color:var(--acc-ink);font-size:.95rem;display:none}
.qz .exp.on{display:block}

/* ---------- mnemos / nombres ---------- */
.mn{display:grid;gap:8px}
.mn .card{display:flex;gap:12px;align-items:flex-start;padding:10px 14px}
.mn .card .i{font-family:var(--f-ui);font-weight:800;color:var(--acc);font-size:1.1rem;min-width:1.6em}
table.nb{border-collapse:collapse;width:100%;background:var(--card);font-size:.95rem}
table.nb td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.nb td:first-child{white-space:nowrap;font-size:1.02rem}
.plan .card{margin:8px 0}
.plan .card h3{font-size:1rem;margin-bottom:4px;font-family:var(--f-ui)}

/* ---------- modal ---------- */
dialog.modal{border:0;border-radius:16px;padding:0;max-width:min(960px,96vw);width:96vw;background:transparent;color:var(--ink)}
dialog.modal::backdrop{background:rgba(10,12,20,.55);backdrop-filter:blur(2px)}
dialog.modal .inner{background:var(--bg);border-radius:16px;max-height:88vh;overflow:auto;padding:12px}
dialog.modal .close{position:sticky;top:0;float:right;z-index:5;border:1px solid var(--line2);background:var(--card);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:1.1rem}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-family:var(--f-ui);font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}

@media (max-width:640px){
  body{font-size:15.5px}
  .top{position:static}
  .brand small{display:none}
  .tabs button{padding:5px 10px;font-size:.88rem}
  .top-in{padding:8px 12px 6px}
  .tools{margin-left:0;width:100%}
  .tools input[type=search]{flex:1;width:auto}
  main{padding:14px 12px 70px}
  .fiche .row{grid-template-columns:1fr;gap:3px}
  .fiche .fh .meta{margin-left:0}
  .ladder .step{grid-template-columns:1fr;margin-left:calc(var(--i) * 6px)}
  .chain .ct{min-width:0;flex-basis:100%}
  table.cmp td:first-child,table.cmp th:first-child{min-width:110px;max-width:130px}
}
@media print{
  .top,.bar,.treebar,.fbtn,.fc .act{display:none!important}
  .view{display:block!important}
  .fiche,.clz,.card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">L'Allaire en tête<small>mémoriser les chapitres 2 et 3 — théorie et algorithmes</small></div>
  <nav class="tabs" aria-label="Vues">
    <button data-view="squelette">Squelette</button>
    <button data-view="fiches">Fiches</button>
    <button data-view="comparer">Comparer</button>
    <button data-view="pourquoi">Pourquoi</button>
    <button data-view="entrainer">S'entraîner</button>
    <button data-view="memo">Mémo</button>
  </nav>
  <div class="tools">
    <span class="seg" title="Priorité : ★★★ diapos, ★★ livre (clé), ★ approfondissement"><button data-prio="3">★★★</button><button data-prio="2">★★+</button><button data-prio="1">tout</button></span>
    <span class="seg" title="Chapitre"><button data-chap="all">ch. 2+3</button><button data-chap="2">ch. 2</button><button data-chap="3">ch. 3</button></span>
    <input id="q" type="search" placeholder="chercher (2.5.17, Uzawa, Farkas…)" aria-label="Rechercher">
    <button id="theme" class="iconbtn" title="Thème clair / sombre / auto">◐</button>
  </div>
</div></header>
<main id="app">
  <section class="view" id="v-squelette"></section>
  <section class="view" id="v-fiches"></section>
  <section class="view" id="v-comparer"></section>
  <section class="view" id="v-pourquoi"></section>
  <section class="view" id="v-entrainer"></section>
  <section class="view" id="v-memo"></section>
</main>

<script>window.DATA = {"fiches": [{"id": "2.1.3", "label": "Lemme 2.1.3", "nom": "Une suite minimisante existe toujours", "surnom": "l'infimum existe, reste à l'atteindre", "sec": "2.1 · Définitions", "chap": 2, "prio": 2, "qs": ["existence"], "cadre": "$V$ normé, $K\\subset V$, $J:K\\to\\R$. $\\inf_K J\\in\\R\\cup\\{-\\infty\\}$ existe toujours ; on écrit $\\min$ seulement s'il est atteint.", "hyp": [["$K\\ne\\emptyset$", "sinon $\\inf=+\\infty$ et il n'y a rien à chercher"]], "concl": "Il existe une suite $(u^n)\\subset K$ telle que $J(u^n)\\to\\inf_K J$ : une **suite minimisante**.", "manque": "Aucune convergence de $(u^n)$ : pour $J(x)=e^x$ sur $\\R$, $u^n=-n$ est minimisante et part à l'infini. Tout le chapitre 2.2–2.3 consiste à empêcher cette fuite.", "diff": [], "pourquoi": [], "preuve": "Par l'absurde : si aucune suite ne faisait tendre $J$ vers $m=\\inf_KJ$, un $m+\\eps$ minorerait $J$, contredisant « $m$ = plus grand minorant ».", "mnemo": "« L'inf existe toujours ; la vraie question est : est-il atteint ? » La suite minimisante est l'étape 1 de la méthode directe (§T1).", "cloze": "Si $K$ est [[non vide]], il existe une suite $(u^n)$ de $K$ telle que $J(u^n)\\to[[\\inf_K J]]$ : une [[suite minimisante]]. Elle n'a aucune raison de [[converger]].", "liens": ["2.2.1", "2.3.8", "2.3.9", "T1"]}, {"id": "2.2.1", "label": "Théorème 2.2.1", "nom": "Existence en dimension finie", "surnom": "le théorème « compacité »", "sec": "2.2 · Dimension finie", "chap": 2, "prio": 3, "qs": ["existence"], "diapos": "Diapos : « $J$ **sci** et **coercive** sur $K\\subset\\R^n$ fermé ». Coercive = infinie à l'infini ; sci (semi-continue inférieurement, $\\liminf J(u_n)\\ge J(u)$) suffit à la place de continue (Ex. 2.2.3).", "cadre": "$V=\\R^N$ (dimension finie : les fermés bornés sont compacts).", "hyp": [["$K$ **fermé** non vide", "la limite de la sous-suite reste dans $K$"], ["$J$ **continue** sur $K$ (ou seulement sci)", "passer à la limite : $J(u)\\le\\liminf J(u^{n_k})=\\inf_KJ$"], ["$J$ **infinie à l'infini** sur $K$ : $\\norm{u^n}\\to\\infty\\Rightarrow J(u^n)\\to+\\infty$ (2.2)", "borner la suite minimisante ; **inutile si $K$ est borné** (Rem. 2.2.2)"]], "concl": "Il existe **au moins un** point de minimum de $J$ sur $K$.", "plus": "Seconde phrase : de **toute suite minimisante** on peut extraire une sous-suite qui converge vers un point de minimum. (Toute méthode qui fait tendre $J$ vers l'inf produit des points qui s'accumulent sur des minima.)", "manque": "Pas d'unicité (ajouter « $J$ strictement convexe, $K$ convexe » : §2.3.4). Et rien en dimension infinie : l'étape « extraire une sous-suite convergente » (Bolzano–Weierstrass) s'effondre (Ex. 2.3.1–2.3.2).", "diff": [["2.3.9", "en Hilbert on perd la compacité ; on la remplace par la **convexité de $K$ et de $J$** (extraction faible)."], ["2.3.8", "avec $J$ α-convexe, plus besoin de « infinie à l'infini » ni de dimension finie, et on gagne l'unicité."]], "pourquoi": [["$K$ fermé", "$J(x)=x$ sur $K=\\,]0,2]$ : $\\inf=0$ non atteint, la limite $0$ sort de $K$."], ["$J$ continue (sci)", "$J(x)=x^2$ pour $x\\ne0$, $J(0)=1$ sur $[-2,2]$ : $J$ saute vers le haut en $0$, $\\inf=0$ non atteint."], ["infinie à l'infini", "$J(x)=e^x$ sur $\\R$ : la suite minimisante $-n$ s'échappe."], ["dimension finie", "Ex. 2.3.1 dans $\\ell^2$ : $J(x)=(\\norm x^2-1)^2+\\sum x_i^2/i$, $J(e_n)=1/n\\to0$ mais $J>0$ partout ; $(e_n)$ bornée sans sous-suite convergente."]], "preuve": "§T1 méthode directe en 5 temps : suite minimisante (§2.1.3) → **bornée** par (2.2) → **Bolzano–Weierstrass** (c'est ici que sert $\\R^N$) → limite dans $K$ (**fermé**) → $J(u)\\le\\liminf J(u^{n_k})=\\inf_KJ$ (**continuité/sci**).", "mnemo": "« **F·C·I** : Fermé, Continue, Infinie à l'infini. » La compacité fabrique un candidat, la continuité le certifie. Si $K$ est borné, le « I » est gratuit (Weierstrass).", "cloze": "Soit $K$ un ensemble [[fermé]] [[non vide]] de [[$\\R^N$]] et $J$ une fonction [[continue]] sur $K$, [[infinie à l'infini]] ($\\norm{u^n}\\to\\infty\\Rightarrow J(u^n)\\to+\\infty$). Alors il existe [[au moins un]] point de minimum de $J$ sur $K$. De plus, de toute [[suite minimisante]] on peut extraire une [[sous-suite]] qui converge vers [[un point de minimum]].", "liens": ["2.1.3", "2.3.9", "2.3.8", "3.4.6", "3.2.9", "T1"]}, {"id": "2.3.1", "label": "Exemples 2.3.1–2.3.2", "nom": "Pourquoi la dimension infinie casse l'existence", "surnom": "la fuite dans les directions de l'espace", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 2, "qs": ["existence", "contre"], "cadre": "Deux fonctions continues, infinies à l'infini, sur un fermé d'un Hilbert, **sans minimum**.", "hyp": [["Ex. 2.3.1 : $V=\\ell^2$, $J(x)=(\\norm x^2-1)^2+\\sum_{i\\ge1}x_i^2/i$", "$J(e_n)=1/n\\to0=\\inf J$, mais $J(x)=0$ exigerait $x=0$ **et** $\\norm x=1$"], ["Ex. 2.3.2 : dents de scie $u^n$ de pente $\\pm h$, $J_h(v)=\\int_0^1\\big((|v'|-h)^2+v^2\\big)$", "$J_h(u^n)\\to0$ mais $J_h(u)=0$ exigerait $u\\equiv0$ **et** $|u'|\\equiv h$"]], "concl": "Une suite minimisante peut rester **bornée sans aucune sous-suite convergente** ($\\norm{e_n-e_m}=\\sqrt2$) : c'est l'étape 3 de §T1 qui manque. La boule unité n'est pas compacte en dimension infinie.", "manque": "Ni $J$ ni $J_h$ ne sont convexes : la limite faible ($e_n\\rightharpoonup0$) fait **moins bien** que la suite ($J(0)=1>0$). C'est exactement ce que la convexité interdit (§2.3.9).", "diff": [], "pourquoi": [], "preuve": "Calcul direct. Petite coquille du livre : $J_h(u^n)=\\frac{h^2}{12n^2}$ (et non $\\frac{h^2}{4n}$), sans conséquence.", "mnemo": "« En dimension infinie, fermé + borné ≠ compact : on paie la compacité en convexité. »", "cloze": "Dans $\\ell^2$, $J(x)=(\\norm x^2-1)^2+\\sum x_i^2/i$ vérifie $J(e_n)=[[1/n]]\\to0=\\inf J$ mais n'a pas de minimum car $J(x)=0$ exigerait [[$x=0$]] et [[$\\norm x=1$]]. La suite $(e_n)$ est [[bornée]] mais sans [[sous-suite convergente]] : $\\norm{e_n-e_m}=[[\\sqrt2]]$.", "liens": ["2.2.1", "2.3.9", "2.3.12"]}, {"id": "2.3.4", "label": "Déf. 2.3.2 · Prop. 2.3.4", "nom": "Convexité : local = global, et unicité", "surnom": "« convexe : local = global ; strict : au plus un »", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 3, "qs": ["unicite", "outil"], "cadre": "$K$ convexe non vide. $J$ convexe : $J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)$ (2.7) ; **strictement** convexe : inégalité stricte pour $u\\ne v$, $\\theta\\in]0,1[$. ($J$ convexe ⟺ son épigraphe est convexe, Rem. 2.3.3.)", "hyp": [["$K$ **convexe**", "le segment $[u,v]$ reste dans $K$ : la direction $v-u$ est admissible"], ["$J$ **convexe** sur $K$", "le graphe est sous la corde"], ["(+ $J$ **strictement** convexe)", "pour l'unicité seulement"]], "concl": "Tout minimum **local** est **global** ; l'ensemble des points de minimum est **convexe** (éventuellement vide). Si $J$ est strictement convexe : **au plus un** point de minimum.", "manque": "**Jamais l'existence** : $e^x$ est strictement convexe sur $\\R$ sans minimum. « Au plus un », pas « au moins un ».", "diff": [["2.3.8", "l'α-convexité (plus forte que la stricte convexité) donne en plus l'existence."]], "pourquoi": [["$K$ convexe", "$x^2$ sur $[-2,-1]\\cup[\\tfrac12,3]$ : minimum local en $-1$, non global."], ["strictement convexe", "$\\max(|x|-1,0)^2$ : convexe, minima = tout $[-1,1]$ (un convexe, mais pas un singleton)."]], "preuve": "§T2 segment : si $J(v)<J(u)$, alors $J(u+\\theta(v-u))\\le(1-\\theta)J(u)+\\theta J(v)<J(u)$ pour $\\theta$ aussi petit qu'on veut : $u$ n'est pas un minimum local. Deux minima distincts avec inégalité stricte : le milieu ferait mieux.", "mnemo": "« Convexe : pas de faux fond de vallée. Strict : une seule vallée au plus. » Propriétés utiles (diapos) : somme et $\\max$ de convexes sont convexes ; $J$ convexe (majorée sur une boule) est continue.", "cloze": "Si $J$ est [[convexe]] sur un ensemble [[convexe]] $K$, tout point de minimum [[local]] est un minimum [[global]] et l'ensemble des points de minimum est [[convexe]] (éventuellement [[vide]]). Si de plus $J$ est [[strictement convexe]], il existe [[au plus un]] point de minimum.", "liens": ["2.3.8", "2.5.1", "2.4.4", "T2"]}, {"id": "2.3.5", "label": "Lemme 2.3.5", "nom": "Convexe et majorée sur une boule ⇒ continue", "surnom": "le nœud papillon", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 2, "qs": ["outil"], "diapos": "Diapos : « $J$ convexe est continue ». Vrai pour une fonction convexe à valeurs réelles en dimension finie ; en dimension infinie il faut la majoration sur une boule.", "cadre": "$J$ convexe sur $V$, $v_0\\in V$.", "hyp": [["$J$ convexe", "deux cordes encadrent $J$"], ["$J$ **majorée** (par $M$) sur la boule unité centrée en $v_0$", "la pente du papillon est $M-J(v_0)$"]], "concl": "$J$ est continue sur cette boule ouverte : $|J(v)-J(v_0)|\\le\\big(M-J(v_0)\\big)\\norm{v-v_0}$ (après normalisation).", "manque": "Rien sur la dérivabilité (un point anguleux reste possible : $|x|$).", "diff": [], "pourquoi": [["majorée", "une forme linéaire non continue sur un Hilbert de dimension infinie est convexe et discontinue."]], "preuve": "§T2 deux cordes : $v$ entre $v_0$ et le bord donne $J(v)\\le J(v_0)+\\theta(M-J(v_0))$ ; $v_0$ entre $v$ et le bord opposé donne la minoration.", "mnemo": "« Convexe + majorée sur une boule = continue sur la boule. »", "cloze": "Si $J$ est [[convexe]] et [[majorée]] sur une boule, elle est [[continue]] sur la boule ouverte ; la preuve utilise [[deux cordes]] (technique du segment).", "liens": ["2.3.4", "2.3.7", "T2"]}, {"id": "2.3.6", "label": "Définition 2.3.6", "nom": "Forte convexité (α-convexité)", "surnom": "convexe + une parabole en bonus", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 3, "qs": ["outil"], "cadre": "$J$ définie sur un convexe $K$.", "hyp": [["il existe $\\alpha>0$ tel que pour tous $u,v\\in K$, $\\theta\\in[0,1]$ : $J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)-\\dfrac{\\alpha\\,\\theta(1-\\theta)}{2}\\norm{u-v}^2$ (2.9)", "la corde est abaissée d'une parabole de courbure α"]], "concl": "Équivalent : $J-\\frac\\alpha2\\norm\\cdot^2$ est convexe (Ex. 2.3.4). Il suffit de tester $\\theta=\\tfrac12$ (inégalité du milieu (2.10) : $J(\\frac{u+v}2)\\le\\frac{J(u)+J(v)}2-\\frac\\alpha8\\norm{u-v}^2$) si $J$ est localement bornée (Ex. 2.3.3).", "plus": "Exemples : $J(x)=\\frac12Ax\\cdot x-b\\cdot x$ avec $A$ symétrique définie positive est α-convexe avec $\\alpha=\\lambda_{\\min}(A)$ ; $\\frac12a(v,v)-L(v)$ avec $a$ coercive ($a(v,v)\\ge C\\norm v^2$) : $\\alpha=C$. Si $J$ dérivable : §2.4.4 ; si $C^2$ : $J''(u)(w,w)\\ge\\alpha\\norm w^2$ (Ex. 2.4.7).", "manque": "", "diff": [["2.3.4", "la stricte convexité, c'est « $\\alpha>0$ » remplacé par « inégalité stricte » : aucune quantité, donc aucune estimation."]], "pourquoi": [["$\\alpha>0$ uniforme", "$\\ln(1+e^x)$ ou $x^4$ : strictement convexes, mais $J''\\to0$ : aucun $\\alpha>0$ ne convient."]], "preuve": "—", "mnemo": "« α = la courbure minimale garantie. » Le $\\frac{\\theta(1-\\theta)}2$ vaut $\\frac18$ en $\\theta=\\frac12$ : d'où les constantes $\\frac\\alpha8$ puis $\\frac4\\alpha$.", "cloze": "$J$ est [[fortement convexe]] (α-convexe) sur $K$ s'il existe [[$\\alpha>0$]] tel que, pour tous $u,v\\in K$ et $\\theta\\in[0,1]$, $J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)-[[\\dfrac{\\alpha\\theta(1-\\theta)}2\\norm{u-v}^2]]$. Pour $\\theta=\\tfrac12$ : $J(\\tfrac{u+v}2)\\le\\tfrac{J(u)+J(v)}2-[[\\tfrac\\alpha8]]\\norm{u-v}^2$.", "liens": ["2.3.8", "2.4.4", "2.3.7"]}, {"id": "2.3.7", "label": "Proposition 2.3.7", "nom": "Minorante affine, croissance quadratique", "surnom": "convexe ⇒ au-dessus d'une droite ; α-convexe ⇒ au-dessus d'une parabole", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 2, "qs": ["outil"], "cadre": "$K$ convexe fermé non vide, $J$ convexe continue sur $K$.", "hyp": [["$J$ convexe continue sur $K$ convexe fermé", "l'épigraphe est un convexe fermé que l'on peut séparer d'un point"], ["(+ $J$ α-convexe)", "inégalité du milieu (2.10)"]], "concl": "(2.11) il existe $L\\in V'$, $\\delta\\in\\R$ : $J(v)\\ge L(v)+\\delta$ sur $K$. (2.12) si α-convexe : il existe $\\gamma>0,\\eta$ : $J(v)\\ge\\gamma\\norm v^2+\\eta$ — donc $J$ est **minorée et infinie à l'infini**.", "manque": "", "diff": [], "pourquoi": [], "preuve": "§T11 séparation du point $(\\lambda_0,v_0)$, $\\lambda_0<J(v_0)$, de l'épigraphe ; le coefficient de $\\lambda$ est $>0$ (faire $\\lambda\\to+\\infty$). Puis §T3 : (2.10) + (2.11) au milieu.", "mnemo": "C'est ce qui rend « infinie à l'infini » **automatique** dans §2.3.8 : l'hypothèse n'a pas besoin d'y figurer.", "cloze": "Si $J$ est convexe continue sur un convexe fermé, il existe une forme linéaire continue $L$ et $\\delta$ avec $J\\ge[[L+\\delta]]$ (minorante [[affine]]). Si $J$ est [[α-convexe]], $J(v)\\ge[[\\gamma\\norm v^2+\\eta]]$ : $J$ est minorée et [[infinie à l'infini]].", "liens": ["2.3.8", "T11", "T3"]}, {"id": "2.3.8", "label": "Théorème 2.3.8", "nom": "Existence et unicité, cas fortement convexe", "surnom": "le théorème α", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 3, "qs": ["existence", "unicite"], "diapos": "Diapos : « $K$ convexe fermé non vide d'un Hilbert $V$, $J$ α-convexe continue sur $K$ : unique minimum $u$ et $\\norm{v-u}^2\\le\\frac4\\alpha(J(v)-J(u))$ ; toute suite minimisante converge vers $u$. »", "cadre": "$V$ **Hilbert** (complet), $K\\subset V$.", "hyp": [["$K$ **convexe fermé** non vide", "le milieu de deux points reste dans $K$ ; la limite reste dans $K$"], ["$V$ **Hilbert**", "complet : une suite de Cauchy converge"], ["$J$ **α-convexe** sur $K$", "(2.10) rend toute suite minimisante **de Cauchy** ; via §2.3.7, $J$ est minorée"], ["$J$ **continue** sur $K$", "passer à la limite"]], "concl": "Il existe un **unique** minimum $u$ de $J$ sur $K$, et pour tout $v\\in K$ : $$\\norm{v-u}^2\\le\\frac4\\alpha\\big(J(v)-J(u)\\big)\\qquad(2.14)$$ En particulier **toute suite minimisante converge (fortement) vers $u$**.", "manque": "Rien à redire — mais il exige α. Sans α (convexe seulement), on retombe sur §2.3.9 : existence seule.", "diff": [["2.3.9", "**α-convexe** remplace « convexe + infinie à l'infini » ; on **gagne** l'unicité, l'estimation (2.14) et la convergence forte des suites minimisantes ; la preuve devient élémentaire (Cauchy) sans convergence faible."], ["2.2.1", "plus de dimension finie ni d'« infinie à l'infini » (automatique par §2.3.7), mais il faut la convexité de $K$ et la forte convexité de $J$."]], "pourquoi": [["α-convexe (pas seulement convexe)", "$e^x$ sur $\\R$ : strictement convexe, pas de minimum."], ["$K$ fermé", "$x^2$ sur $]0,1]$."], ["$K$ convexe", "$x^2$ sur $\\{-1,1\\}$ : deux minima ; le milieu $0$ sort de $K$."], ["$V$ complet", "la suite de Cauchy minimisante n'aurait pas de limite."]], "preuve": "§T3 milieu, quatre temps : (1) $J$ minorée par (2.12) ; (2) $\\frac\\alpha8\\norm{u^n-u^m}^2\\le\\frac{J(u^n)+J(u^m)}2-J(\\frac{u^n+u^m}2)\\to0$ : **Cauchy** ; (3) complet + fermé + continue : existence, unicité par §2.3.4 ; (4) avec $J(\\frac{u+v}2)\\ge J(u)$ : $\\frac\\alpha8\\norm{u-v}^2\\le\\frac{J(v)-J(u)}2$, c'est (2.14).", "mnemo": "« **4/α** vient du **1/8** du milieu. » Si $J$ est dérivable, (2.23) + Euler donnent mieux : $\\frac2\\alpha$. C'est **l'hypothèse vedette** : elle fournit existence et unicité à tous les algorithmes du chapitre 3 (§3.2.6, §3.4.1, §3.4.3) et la projection sur un convexe fermé ($\\norm{v-x}^2$ est 2-convexe).", "cloze": "Soit $K$ un [[convexe fermé]] non vide d'un espace de [[Hilbert]] $V$ et $J$ une fonction [[α-convexe]] et [[continue]] sur $K$. Alors il existe un [[unique]] minimum $u$ de $J$ sur $K$ et, pour tout $v\\in K$, $\\norm{v-u}^2\\le[[\\dfrac4\\alpha]]\\big(J(v)-J(u)\\big)$. En particulier toute [[suite minimisante]] converge vers $u$.", "liens": ["2.3.6", "2.3.7", "2.3.4", "3.2.6", "3.4.1", "3.4.3", "T3"]}, {"id": "2.3.9", "label": "Théorème 2.3.9", "nom": "Existence, cas convexe (dimension infinie)", "surnom": "la compacité se paie en convexité", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 3, "qs": ["existence"], "diapos": "Diapos : « $K$ convexe fermé non vide d'un Hilbert $V$, $J$ convexe, sci et coercive sur $K$ : il existe un minimum. »", "cadre": "$V$ **Hilbert** (vrai aussi dans un Banach réflexif, Rem. 2.3.11).", "hyp": [["$K$ **convexe fermé** non vide", "un convexe fermé est **faiblement** fermé (Lemme 2.3.15)"], ["$J$ **convexe continue** (sci suffit) sur $K$", "convexe + sci ⇒ **faiblement** sci (Lemme 2.3.15)"], ["$J$ **infinie à l'infini** sur $K$ (2.2)", "borner la suite minimisante, puis extraction **faible** (Lemme 2.3.13)"]], "concl": "Il existe **un** minimum de $J$ sur $K$.", "manque": "**Rien sur l'unicité, ni l'estimation (2.14), ni la convergence des suites minimisantes** (Rem. 2.3.10) : tout ce que §2.3.8 donne en plus.", "diff": [["2.2.1", "même squelette §T1, mais l'extraction est **faible** ; la convexité de $K$ et de $J$ est le prix de la dimension infinie."], ["2.3.8", "convexe + infinie à l'infini au lieu d'α-convexe : existence seule."]], "pourquoi": [["$J$ convexe", "Ex. 2.3.1 : continue, infinie à l'infini, non convexe, pas de minimum ($J(0)=1>\\lim J(e_n)=0$ : la limite faible fait moins bien)."], ["infinie à l'infini", "$e^x$ : convexe, continue, pas de minimum."], ["$K$ convexe", "$K=\\{e_n\\}$ (fermé, borné, non convexe) : $J(x)=\\sum x_i^2/i$ n'atteint pas son inf $0$."]], "preuve": "§T1 faible : (2.2) borne la suite minimisante → Lemme 2.3.13 : sous-suite **faiblement** convergente $u^{n'}\\rightharpoonup u$ → Lemme 2.3.15 : $u\\in K$ et $J(u)\\le\\liminf J(u^{n'})=\\inf_KJ$.", "mnemo": "« En dimension infinie : **F·C·I + C** (fermé, continue, infinie à l'infini, et **convexe**). » Usage type : $\\frac12\\int|\\nabla v|^2-\\int fv$ sur $H^1_0$ (convexe, continue, infinie à l'infini par Poincaré).", "cloze": "Soit $K$ un [[convexe fermé]] non vide d'un espace de [[Hilbert]] $V$ et $J$ une fonction [[convexe]], [[continue]] et [[infinie à l'infini]] sur $K$. Alors il existe [[un minimum]] de $J$ sur $K$ — sans [[unicité]] ni estimation. Preuve : extraction [[faible]] d'une suite minimisante bornée.", "liens": ["2.2.1", "2.3.8", "2.3.12", "2.6.4", "T1"]}, {"id": "2.3.12", "label": "Déf. 2.3.12 · Lemmes 2.3.13–2.3.15", "nom": "La convergence faible, en trois lemmes", "surnom": "l'outil de la preuve de 2.3.9", "sec": "2.3 · Dimension infinie et convexité", "chap": 2, "prio": 1, "qs": ["outil"], "cadre": "$V$ Hilbert. $u^n\\rightharpoonup u$ (faiblement) si $\\ps{u^n}{v}\\to\\ps{u}{v}$ pour tout $v$. Fort ⇒ faible ; réciproque fausse ($e_n\\rightharpoonup0$, $\\norm{e_n}=1$).", "hyp": [["Lemme 2.3.13 : $(u^n)$ bornée", "⇒ sous-suite faiblement convergente (extraction diagonale sur les composantes)"], ["Lemme 2.3.14 : $K$ convexe fermé", "⇒ intersection des demi-espaces fermés qui le contiennent (séparation)"], ["Lemme 2.3.15 : $K$ convexe fermé ; $J$ convexe sci", "⇒ $K$ **faiblement fermé** ; $J$ **faiblement sci** (appliquer 2.3.14 à l'épigraphe)"]], "concl": "Les bornés redeviennent « compacts » pour la convergence faible, et la convexité garantit que $K$ et $J$ se comportent bien pour cette convergence.", "manque": "", "diff": [], "pourquoi": [], "preuve": "Un demi-espace fermé $\\{L\\le\\alpha\\}$ est faiblement fermé par définition de la convergence faible ; le reste suit par séparation (§T11).", "mnemo": "« Borné ⇒ faiblement compact ; convexe fermé ⇒ faiblement fermé ; convexe sci ⇒ faiblement sci. »", "cloze": "De toute suite [[bornée]] d'un Hilbert on peut extraire une sous-suite [[faiblement]] convergente (Lemme 2.3.13). Un convexe fermé est [[faiblement fermé]] et une fonction convexe sci est [[faiblement sci]] (Lemme 2.3.15).", "liens": ["2.3.9", "T11"]}, {"id": "2.4.1", "label": "Déf. 2.4.1 · Rem. 2.4.2–2.4.3", "nom": "Dérivée au sens de Fréchet", "surnom": "près de $u$, $J$ est affine", "sec": "2.4 · Différentiabilité", "chap": 2, "prio": 3, "qs": ["outil"], "cadre": "$J$ définie sur un voisinage de $u\\in V$ à valeurs dans $\\R$.", "hyp": [["il existe une forme linéaire **continue** $L\\in V'$ telle que $J(u+w)=J(u)+L(w)+o(w)$, $\\lim_{w\\to0}\\frac{|o(w)|}{\\norm w}=0$ (2.15)", "le reste est petit **uniformément en direction**"]], "concl": "$L=J'(u)$ est la dérivée (différentielle, gradient). Dans un Hilbert, **Riesz** donne un unique $p\\in V$ avec $L(w)=\\ps{p}{w}$ ; on note aussi $p=J'(u)$ (abus de langage). Dans $\\R^n$ : $\\partial_iJ(u)=L(e_i)$.", "plus": "**Gâteaux** (Rem. 2.4.3) : seulement $\\lim_{\\delta\\to0^+}\\frac{J(u+\\delta w)-J(u)}\\delta=L(w)$ dans chaque direction. Fréchet ⇒ Gâteaux ; réciproque **fausse** même dans $\\R^2$ : $J(x,y)=\\frac{x^6}{(y-x^2)^2+x^8}$ a toutes ses dérivées directionnelles nulles en $0$ mais vaut $1/x^2$ sur la parabole $y=x^2$ (pas même continue).", "manque": "", "diff": [], "pourquoi": [], "preuve": "Méthode de calcul : développer $J(u+w)$, isoler la partie linéaire en $w$, vérifier que le reste est $o(\\norm w)$ ; encadrer suffit (Ex. 2.4.1).", "mnemo": "**Gradients à connaître par cœur** : $J=\\frac12a(v,v)-L(v)$ ($a$ symétrique continue) → $J'(u)w=a(u,w)-L(w)$, $J''(u)=a$ ; $J=\\frac12Ax\\cdot x-b\\cdot x$ → $J'=Ax-b$, $J''=A$ ; $\\frac12\\int v^2-\\int fv$ sur $L^2$ → $u-f$.", "cloze": "$J$ est dérivable au sens de [[Fréchet]] en $u$ s'il existe une forme linéaire [[continue]] $L\\in V'$ telle que $J(u+w)=J(u)+[[L(w)]]+o(w)$ avec $\\lim_{w\\to0}\\frac{|o(w)|}{\\norm w}=[[0]]$. Dans un Hilbert, le théorème de [[Riesz]] donne $L(w)=\\ps{p}{w}$ et on note $p=J'(u)$. Fréchet ⇒ [[Gâteaux]], la réciproque est [[fausse]].", "liens": ["2.4.4", "2.4.7", "2.5.1"]}, {"id": "2.4.4", "label": "Prop. 2.4.4 · Prop. 2.4.5", "nom": "Convexité et α-convexité vues par la dérivée", "surnom": "les trois visages", "sec": "2.4 · Différentiabilité", "chap": 2, "prio": 2, "qs": ["outil"], "cadre": "$J$ différentiable de $V$ dans $\\R$ ; $\\alpha\\ge0$ ($\\alpha=0$ : Prop. 2.4.4 ; $\\alpha>0$ : Prop. 2.4.5).", "hyp": [["$J$ différentiable", "pour écrire tangentes et monotonie"]], "concl": "Sont équivalentes : **(i)** $J$ α-convexe (2.22) ; **(ii)** au-dessus des tangentes : $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}+\\frac\\alpha2\\norm{v-u}^2$ (2.23) ; **(iii)** $J'$ fortement monotone : $\\ps{J'(u)-J'(v)}{u-v}\\ge\\alpha\\norm{u-v}^2$ (2.24). Avec $\\alpha=0$ : (2.20)–(2.21) caractérisent la convexité.", "plus": "Si $J$ est $C^2$ (Ex. 2.4.7) : convexe ⟺ $J''(u)(w,w)\\ge0$ ; α-convexe ⟺ $J''(u)(w,w)\\ge\\alpha\\norm w^2$ (2.28). Stricte convexité ⟺ inégalités strictes dans (2.20)/(2.21) pour $u\\ne v$ (Ex. 2.4.5). Pour $J=\\frac12a(u,u)-L(u)$, (2.24) est exactement la coercivité de $a$ (Rem. 2.4.6).", "manque": "", "diff": [["2.4.10", "(2.23) est la minoration par une parabole de courbure α ; §2.4.10 est la **majoration** par une parabole de courbure $L$ : c'est l'encadrement (Rem. 2.4.11)."]], "pourquoi": [], "preuve": "(i)⇒(ii) : diviser la corde par $\\theta$, $\\theta\\to0$ (§T4). (ii)⇒(iii) : écrire (ii) en $(u,v)$ et $(v,u)$, additionner. (iii)⇒(i) : $\\varphi(t)=J(u+t(v-u))$, $\\varphi'(t)-\\varphi'(s)\\ge\\alpha(t-s)\\norm{v-u}^2$, double intégration $t\\in[\\theta,1]$, $s\\in[0,\\theta]$ (§T12).", "mnemo": "« Sous les cordes (global) — au-dessus des tangentes (ordre 1) — gradient monotone (deux points). » Chaque preuve de convergence du ch. 3 choisit le visage qui l'arrange : (2.23) pour les estimations, (2.24) pour la contraction.", "cloze": "Pour $J$ différentiable et $\\alpha>0$, sont équivalentes : $J$ [[α-convexe]] ; $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}+[[\\tfrac\\alpha2\\norm{v-u}^2]]$ pour tous $u,v$ ; $\\ps{J'(u)-J'(v)}{u-v}\\ge[[\\alpha\\norm{u-v}^2]]$ pour tous $u,v$. Si $J$ est $C^2$ : $J''(u)(w,w)\\ge[[\\alpha\\norm w^2]]$.", "liens": ["2.3.6", "2.4.10", "2.5.1", "3.2.6", "T4", "T12"]}, {"id": "2.4.7", "label": "Déf. 2.4.7 · Lemme 2.4.8", "nom": "Dérivée seconde et formule de Taylor", "surnom": "la courbure dans la direction $w$", "sec": "2.4 · Différentiabilité", "chap": 2, "prio": 3, "qs": ["outil"], "cadre": "$J$ dérivable au voisinage de $u$, et $J'$ dérivable en $u$ : $J'(u+w)=J'(u)+J''(u)w+o(w)$ (reste mesuré dans $V'$). On note $J''(u)(w,v)=(J''(u)w)v$, forme bilinéaire.", "hyp": [["$J$ deux fois dérivable en $u$", ""]], "concl": "**Lemme 2.4.8 (Taylor)** : $J(u+w)=J(u)+\\ps{J'(u)}{w}+\\tfrac12J''(u)(w,w)+o(\\norm w^2)$ (2.27).", "plus": "Pour une forme quadratique $\\frac12a(v,v)-L(v)$ : $J''(u)(v,w)=a(v,w)$ (Ex. 2.4.6). On ne manipule jamais l'opérateur $J''(u)$, seulement la forme quadratique $w\\mapsto J''(u)(w,w)$.", "manque": "Le reste n'est que $o(\\norm w^2)$ : $O(\\norm w^3)$ demande $J''$ lipschitzienne.", "diff": [], "pourquoi": [], "preuve": "§T12 : reste intégral $J(u+w)-J(u)=\\int_0^1\\ps{J'(u+sw)}{w}ds$, insérer $J'(u+sw)=J'(u)+sJ''(u)w+o(sw)$, $\\int_0^1s\\,ds=\\frac12$.", "mnemo": "« Ordre 1 : pente. Ordre 2 : courbure. » C'est ce que lisent les conditions d'ordre 2 (§2.5.3, §2.5.13) et Newton (§3.5.1).", "cloze": "Si $J$ est deux fois dérivable en $u$ : $J(u+w)=J(u)+[[\\ps{J'(u)}{w}]]+[[\\tfrac12J''(u)(w,w)]]+o([[\\norm w^2]])$. Pour $J=\\frac12a(v,v)-L(v)$, $J''(u)(v,w)=[[a(v,w)]]$.", "liens": ["2.5.3", "2.5.13", "3.5.1", "T12"]}, {"id": "2.4.10", "label": "Déf. 2.4.9 · Lemme 2.4.10 · Rem. 2.4.11", "nom": "Dérivée lipschitzienne : majoration quadratique", "surnom": "le sandwich (en haut)", "sec": "2.4 · Différentiabilité", "chap": 2, "prio": 2, "qs": ["outil"], "cadre": "$J$ différentiable de $V$ dans $\\R$.", "hyp": [["$J'$ **lipschitzienne** de constante $L$ : $\\norm{J'(v)-J'(u)}\\le L\\norm{v-u}$", "$J'$ ne s'écarte de $J'(u)$ qu'à pente $L$"]], "concl": "$$J(v)\\le J(u)+\\ps{J'(u)}{v-u}+\\frac L2\\norm{v-u}^2\\qquad\\forall u,v.$$", "plus": "**Rem. 2.4.11 — l'encadrement** : une fonction α-convexe à dérivée $L$-lipschitzienne est coincée entre deux paraboles tangentes : $\\frac\\alpha2\\norm{v-u}^2\\le J(v)-J(u)-\\ps{J'(u)}{v-u}\\le\\frac L2\\norm{v-u}^2$. Nécessairement $\\alpha\\le L$ ; $\\kappa=L/\\alpha$ est le conditionnement. Si $J$ est $C^2$ avec $|J''(u)(w,w)|\\le L\\norm w^2$ (ou $J$ convexe et $J''\\le L$), alors $J'$ est $L$-lipschitzienne (Ex. 2.4.8).", "manque": "", "diff": [["2.4.4", "(2.23) : même formule avec $\\ge$ et $\\frac\\alpha2$ — la forte convexité minore, Lipschitz majore."]], "pourquoi": [["$J'$ lipschitzienne", "$J(x)=x^4$ : $J'$ n'est pas lipschitzienne, aucune parabole ne majore $J$ globalement."]], "preuve": "§T12 : $J(v)-J(u)-\\ps{J'(u)}{v-u}=\\int_0^1\\ps{J'(u+t(v-u))-J'(u)}{v-u}dt\\le\\int_0^1Lt\\norm{v-u}^2dt=\\frac L2\\norm{v-u}^2$.", "mnemo": "« **α en dessous, L au-dessus.** » Avec $v=u-\\mu J'(u)$ il devient le lemme de descente §3.2.10 : c'est tout le secret des preuves de convergence du chapitre 3 (§T13).", "cloze": "Si $J'$ est [[lipschitzienne]] de constante $L$, alors $J(v)\\le J(u)+\\ps{J'(u)}{v-u}+[[\\tfrac L2\\norm{v-u}^2]]$. Si de plus $J$ est α-convexe, $J$ est encadrée entre deux [[paraboles]] tangentes de courbures [[α]] et [[$L$]].", "liens": ["2.4.4", "3.2.10", "3.2.6", "T13", "T12"]}, {"id": "2.5.1", "label": "Théorème 2.5.1 · Rem. 2.5.2", "nom": "Inéquation d'Euler, cas convexe", "surnom": "aucune direction rentrante ne descend", "sec": "2.5.1 · Inéquations d'Euler", "chap": 2, "prio": 3, "qs": ["cn", "cs"], "cadre": "$K$ **convexe**, $u\\in K$, $J$ différentiable en $u$.", "hyp": [["$K$ **convexe**", "$u+h(v-u)\\in K$ pour $h\\in[0,1]$ : chaque $v-u$ est une direction admissible"], ["$J$ **différentiable en $u$**", "dériver le long de la direction"], ["**CN** : $u$ minimum **local** de $J$ sur $K$", ""], ["**CS** : (2.29) + $J$ **convexe**", "au-dessus des tangentes (2.20)"]], "concl": "**CN** : $$\\ps{J'(u)}{v-u}\\ge0\\qquad\\forall v\\in K\\qquad(2.29)$$ **CS** : si $u\\in K$ vérifie (2.29) et $J$ est convexe, $u$ est un minimum **global**.", "plus": "**Rem. 2.5.2** : si $K=V$ ou si $u$ est intérieur à $K$, (2.29) se réduit à l'**équation d'Euler** $J'(u)=0$ (tester $w$ et $-w$).", "manque": "Sans convexité de $J$ : seulement nécessaire ($-x^2$ sur $[-1,1]$ vérifie Euler en $0$, qui est un maximum). Sans convexité de $K$ : $v-u$ n'est plus admissible, il faut le cône tangent (§2.5.5).", "diff": [["2.5.5", "Euler général : remplacer « $v-u$, $v\\in K$ » par « $w\\in K(u)$ » ; pour $K$ convexe, $v-u\\in K(u)$ et on retrouve 2.5.1."], ["2.6.4", "la version « avec multiplicateurs » de la suffisance convexe : KKT suffisant si $J,F_i$ convexes."]], "pourquoi": [["$J$ convexe (pour CS)", "$-x^2$ sur $[-1,1]$ : Euler en $0$, maximum."], ["$K$ convexe", "$K=\\{-1,1\\}$, $J=x$ : $u=1$ est minimum local, mais $\\ps{J'(u)}{v-u}=-2<0$ pour $v=-1$."]], "preuve": "**CN** (§T2+§T4) : $\\frac{J(u+h(v-u))-J(u)}h\\ge0$ pour $h\\in]0,1]$ petit, $h\\to0^+$. **CS** : $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}\\ge J(u)$.", "mnemo": "« L'angle entre $J'(u)$ et toute direction rentrante est **aigu**. » Cas à connaître : projection $\\ps{x-P_Kx}{y-P_Kx}\\le0$ (Ex. 2.5.1) ; inéquation variationnelle $a(u,v-u)\\ge L(v-u)$ (Ex. 2.5.5) ; $J_1+J_2$ avec $J_2$ non dérivable : $\\ps{J_1'(u)}{v-u}+J_2(v)-J_2(u)\\ge0$ (Ex. 2.5.6, utilisé par Uzawa).", "cloze": "Soit $u\\in K$ [[convexe]] et $J$ [[différentiable en $u$]]. Si $u$ est un minimum [[local]] de $J$ sur $K$, alors $\\ps{J'(u)}{v-u}[[\\ge0]]$ pour tout $v\\in[[K]]$. Réciproquement, si $u$ vérifie cette inéquation et si $J$ est [[convexe]], $u$ est un minimum [[global]]. Si $u$ est [[intérieur]] à $K$, l'inéquation devient $J'(u)=[[0]]$.", "liens": ["2.5.5", "2.5.3", "2.6.4", "3.4.1", "3.4.3", "T4"]}, {"id": "2.5.3", "label": "Proposition 2.5.3", "nom": "Condition du second ordre, sans contrainte", "surnom": "quand la pente s'annule, la courbure décide", "sec": "2.5.1 · Inéquations d'Euler", "chap": 2, "prio": 2, "qs": ["cn", "cs"], "cadre": "$K=V$, $J$ deux fois dérivable en $u$ (CN) / au voisinage de $u$ (CS).", "hyp": [["**CN** : $u$ minimum local", "Taylor à l'ordre 2 le long de $tw$"], ["**CS** : $J'(u)=0$ et $J''(v)(w,w)\\ge0$ pour tout $w$ et **tout $v$ dans un voisinage de $u$** (2.35)", "Taylor avec reste intégral exact"]], "concl": "**CN (2.34)** : $J'(u)=0$ et $J''(u)(w,w)\\ge0$ pour tout $w\\in V$. **CS** : sous (2.35), $u$ est un minimum local.", "manque": "La CS exige $J''\\ge0$ **au voisinage**, pas seulement au point : $x^3$ en $0$ a $J'=J''=0$ sans être un minimum. (En dimension finie, $J''(u)$ définie positive suffit : minimum local strict.)", "diff": [["2.5.13", "sous contraintes d'égalité, remplacer $J''$ par la Hessienne du **Lagrangien** et $V$ par $\\Ker F'(u)$."]], "pourquoi": [["$J''\\ge0$ au voisinage (CS)", "$x^3$ en $0$ ; en 2D, $\\frac12\\lambda_1x^2-y^4$ : $J''(0)\\ge0$ mais pas de minimum."]], "preuve": "§T5 : $0\\le J(u+tw)-J(u)=\\frac{t^2}2J''(u)(w,w)+o(t^2)$, diviser par $t^2$. CS : $\\varphi(1)=\\varphi(0)+\\varphi'(0)+\\int_0^1(1-t)\\varphi''(t)dt$ avec $\\varphi'(0)=0$, $\\varphi''\\ge0$.", "mnemo": "« Pente nulle, courbure positive. Pour la réciproque : courbure positive **autour**, pas seulement **au point**. »", "cloze": "($K=V$.) Si $u$ est un minimum local de $J$ deux fois dérivable en $u$, alors $J'(u)=[[0]]$ et $J''(u)(w,w)[[\\ge0]]$ pour tout $w$. Réciproquement, si $J'(u)=0$ et $J''(v)(w,w)\\ge0$ pour tout $w$ et tout $v$ dans [[un voisinage de $u$]], alors $u$ est un minimum [[local]].", "liens": ["2.4.7", "2.5.13", "3.5.1", "T5"]}, {"id": "2.5.5", "label": "Déf. 2.5.4 · Prop. 2.5.5", "nom": "Cône des directions admissibles ; Euler général", "surnom": "LE principe : aucune direction admissible ne descend", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 3, "qs": ["cn"], "cadre": "$K$ fermé quelconque (plus de convexité), $u\\in K$.", "hyp": [["**Déf. 2.5.4** : $K(u)=\\Big\\{w\\in V : \\exists v^n\\in K,\\ \\exists\\eps_n\\searrow0,\\ v^n\\to u,\\ \\dfrac{v^n-u}{\\eps_n}\\to w\\Big\\}$", "les « vitesses d'arrivée » en $u$ des chemins contenus dans $K$ ; $0\\in K(u)$, $K(u)$ est un **cône fermé**"], ["$u$ minimum local de $J$ sur $K$, $J$ différentiable en $u$", ""]], "concl": "$$\\ps{J'(u)}{w}\\ge0\\qquad\\forall w\\in K(u).$$", "plus": "**Calcul du cône** : $u$ intérieur ⇒ $K(u)=V$ ; $K$ convexe ⇒ $v-u\\in K(u)$ pour tout $v\\in K$ (on retrouve §2.5.1) ; $K=\\{F=0\\}$ régulier ⇒ $K(u)=\\Ker F'(u)$ (2.38) ; $K=\\{F\\le0\\}$ ⇒ $K(u)\\subset\\{d:\\ps{F_i'(u)}{d}\\le0,\\ i\\in I(u)\\}$ (égalité si qualifiées) ; point isolé ⇒ $\\{0\\}$.", "manque": "Le cône « linéarisé » peut être **plus gros** que le vrai cône tangent (point de rebroussement) : c'est exactement pourquoi régularité et qualification sont indispensables pour passer aux multiplicateurs.", "diff": [["2.5.1", "cas particulier $K$ convexe."]], "pourquoi": [], "preuve": "§T4 : $v^n=u+\\eps_nw+o(\\eps_n)\\in K$, donc $J(u)\\le J(v^n)=J(u)+\\eps_n\\ps{J'(u)}{w}+o(\\eps_n)$ ; diviser par $\\eps_n$.", "mnemo": "« **Tous les théorèmes du premier ordre disent la même chose** : en un minimum, aucune direction admissible n'est une direction de descente. Ils ne diffèrent que par le calcul de $K(u)$ et par l'outil (orthogonal ou Farkas) qui transforme l'inégalité en multiplicateurs. »", "cloze": "Le cône des directions admissibles en $u$ est $K(u)=\\{w : \\exists v^n\\in K,\\ \\exists\\eps_n\\searrow0,\\ v^n\\to u,\\ [[\\tfrac{v^n-u}{\\eps_n}]]\\to w\\}$. Si $u$ est un minimum [[local]] de $J$ sur $K$ et $J$ est différentiable en $u$ : $\\ps{J'(u)}{w}[[\\ge0]]$ pour tout $w\\in[[K(u)]]$. Pour $K=\\{F=0\\}$ régulier, $K(u)=[[\\Ker F'(u)]]$.", "liens": ["2.5.1", "2.5.6", "2.5.17", "2.5.24", "T4"]}, {"id": "2.5.6", "label": "Théorème 2.5.6 · Lemme 2.5.7 · Rem. 2.5.8", "nom": "Contraintes d'égalité : multiplicateurs de Lagrange", "surnom": "égalités : signe libre", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 3, "qs": ["cn"], "cadre": "$K=\\{v\\in V : F_1(v)=\\dots=F_M(v)=0\\}$ (2.36), $u\\in K$.", "hyp": [["$J$ **dérivable en $u$**", ""], ["$F_i$ **continûment dérivables au voisinage** de $u$", "fonctions implicites (Lemme 2.5.7)"], ["$\\big(F_i'(u)\\big)_{1\\le i\\le M}$ **linéairement indépendants** (cas **régulier**)", "garantit $K(u)=\\Ker F'(u)$ **et** l'unicité des $\\lambda_i$"], ["$u$ minimum local de $J$ sur $K$", ""]], "concl": "Il existe $\\lambda_1,\\dots,\\lambda_M\\in\\R$ (**multiplicateurs de Lagrange**, de signe quelconque) tels que $$J'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0\\qquad(2.37)$$ Avec le Lagrangien $\\Lag(v,\\mu)=J(v)+\\mu\\cdot F(v)$ (Déf. 2.5.9) : $\\partial_v\\Lag(u,\\lambda)=0$ et $\\partial_\\mu\\Lag(u,\\lambda)=F(u)=0$ — **stationnarité du Lagrangien**.", "plus": "**Lemme 2.5.10** : $\\inf_{F=0}J=\\inf_v\\sup_{\\mu\\in\\R^M}\\Lag(v,\\mu)$ (le sup vaut $+\\infty$ si $F(v)\\ne0$). **Lemme 2.5.12** : $\\lambda_i=-\\partial_{\\ell_i}J_{\\min}(0)$ où $J_{\\min}(\\ell)=\\inf_{F=\\ell}J$ — le multiplicateur est une **sensibilité** (prix marginal, force de réaction).", "manque": "Condition **nécessaire** seulement ; $n+M$ équations à $n+M$ inconnues, dont les solutions sont des **candidats** (minima, maxima, cols). Rien sur les points irréguliers (à traiter à part). Pour trancher : existence (§2.2.1) + comparaison des valeurs, ou ordre 2 (§2.5.13).", "diff": [["2.5.17", "inégalités : les $\\lambda_i$ deviennent $\\ge0$ avec écarts complémentaires ; « libres » devient « qualifiées » ; Farkas remplace l'orthogonal."], ["2.5.24", "mixte : $\\mu\\in\\R^N$ pour $G=0$, $\\lambda\\ge0$ pour $F\\le0$."]], "pourquoi": [["$F_i'(u)$ libres", "**Rem. 2.5.8** : $V=\\R$, $F(v)=v^2$, $J(v)=v$ : $K=\\{0\\}$, $u=0$, $F'(0)=0$, $J'(0)=1$ : aucun λ."]], "preuve": "(1) $K(u)\\subset\\Ker F'(u)$ : Taylor sur $F$ le long de $w$ (§T4). (2) $\\Ker F'(u)\\subset K(u)$ : Lemme 2.5.7 (application surjective = fonctions implicites) corrige $u+\\eps w$ en un point de $K$. (3) $K(u)$ est un **sous-espace** : tester $w$ et $-w$ dans §2.5.5 ⇒ $J'(u)\\perp\\Ker F'(u)=\\Vect(F_i'(u))^\\perp$ ⇒ $J'(u)\\in\\Vect(F_i'(u))$ (§T6).", "mnemo": "« En un minimum sur une surface, le gradient de $J$ est **normal** à la surface, et la normale est engendrée par les gradients des contraintes. » Méthode : vérifier la régularité → écrire (2.37) et $F(u)=0$ → résoudre → comparer/ordre 2.", "cloze": "Soit $u\\in K=\\{F=0\\}$. On suppose $J$ [[dérivable en $u$]], les $F_i$ [[continûment dérivables]] au voisinage de $u$ et les vecteurs $F_i'(u)$ [[linéairement indépendants]]. Si $u$ est un minimum [[local]] de $J$ sur $K$, il existe $\\lambda_1,\\dots,\\lambda_M\\in[[\\R]]$ tels que $J'(u)+[[\\sum_i\\lambda_iF_i'(u)]]=0$. Contre-exemple sans régularité : $F(v)=[[v^2]]$, $J(v)=v$.", "liens": ["2.5.5", "2.5.13", "2.5.17", "2.5.24", "NL", "T6"]}, {"id": "2.5.12", "label": "Lemme 2.5.12 · Lemme 2.6.6", "nom": "Les multiplicateurs sont des sensibilités", "surnom": "λ = le prix de la contrainte", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 2, "qs": ["outil"], "cadre": "$J_{\\min}(\\ell)=\\inf_{F(v)=\\ell}J(v)$ (2.41) (égalités) ou $\\inf_{F(v)\\le\\ell}J(v)$ (2.64) (inégalités).", "hyp": [["hypothèses de §2.5.6 (resp. de §2.6.4)", ""], ["solution unique $u_\\ell$ pour $\\ell$ petit, différentiable en $\\ell=0$ (resp. $J_{\\min}$ différentiable en $0$)", "pour pouvoir dériver"]], "concl": "$$\\lambda_i=-\\frac{\\partial J_{\\min}}{\\partial\\ell_i}(0).$$ Cas inégalités : $\\lambda\\ge0$ donc $J_{\\min}$ **décroît** quand on relâche ($\\ell$ croît) ; contrainte inactive ⇒ $\\lambda_i=0$ ⇒ $J_{\\min}$ plate.", "manque": "", "diff": [], "pourquoi": [], "preuve": "§T15 : $J_{\\min}(\\ell)=\\Lag(u_\\ell,\\mu,\\ell)=J(u_\\ell)+\\mu\\cdot(F(u_\\ell)-\\ell)$ pour tout $\\mu$ ; dériver en $\\ell$ : le terme en $\\partial u_\\ell/\\partial\\ell$ est multiplié par $J'(u)+\\mu\\cdot F'(u)$, nul pour $\\mu=\\lambda$. Il reste $-\\lambda_i$. On ne dérive **jamais la solution**.", "mnemo": "« Relâcher la contrainte de $\\delta\\ell$ fait gagner $\\lambda\\,\\delta\\ell$. » Même geste pour $\\mathcal G'(q)=F(u_q)$ (dual, Uzawa) et l'état adjoint (§3.7.6).", "cloze": "Sous les hypothèses de Lagrange, si $J_{\\min}(\\ell)=\\inf_{F=\\ell}J$ est dérivable, le multiplicateur vaut $\\lambda_i=[[-\\dfrac{\\partial J_{\\min}}{\\partial\\ell_i}(0)]]$. En inégalités, comme $\\lambda\\ge0$, $J_{\\min}$ [[décroît]] quand $\\ell$ croît. Preuve : dériver $\\Lag(u_\\ell,\\lambda,\\ell)$ ; le terme en $\\partial_\\ell u_\\ell$ disparaît par [[optimalité]].", "liens": ["2.5.6", "2.6.4", "3.4.3", "3.7.6", "T15"]}, {"id": "2.5.13", "label": "Proposition 2.5.13", "nom": "Condition du second ordre sous contraintes d'égalité", "surnom": "la courbure qui compte est celle du Lagrangien", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 3, "qs": ["cn"], "cadre": "Hypothèses de §2.5.6 (cas régulier), $\\lambda$ le multiplicateur.", "hyp": [["$J$ et les $F_i$ **deux fois continûment dérivables** au voisinage de $u$", "dériver deux fois le long d'un chemin"], ["$F_i'(u)$ linéairement indépendants", "les $u'(0)$ des chemins admissibles décrivent tout $K(u)$"], ["$u$ minimum local de $J$ sur $K$", ""]], "concl": "$$\\Big(J''(u)+\\sum_{i=1}^M\\lambda_iF_i''(u)\\Big)(w,w)\\ge0\\qquad\\forall w\\in K(u)=\\bigcap_i[F_i'(u)]^\\perp\\qquad(2.42)$$", "plus": "Version **suffisante** (stricte, utilisée par Newton–Lagrange (3.95) et le Lagrangien augmenté (3.88)) : $\\Lag''(u,\\lambda)(w,w)>0$ pour tout $w\\in\\Ker F'(u)\\setminus\\{0\\}$.", "manque": "Rien sur l'orthogonal de $\\Ker F'(u)$ : la courbure n'est testée que sur le plan tangent.", "diff": [["2.5.3", "sans contrainte : $J''$ sur tout $V$ ; avec égalités : $J''+\\sum\\lambda_iF_i''$ sur $\\Ker F'(u)$ seulement."]], "pourquoi": [["$\\Lag''$ et non $J''$", "$J(x,y)=y$ sur le cercle $x^2+y^2=1$ : $J''\\equiv0$ ne dit rien ; en $(0,-1)$, $\\lambda=\\frac12$ et $J''+\\lambda F''=\\Id$ (minimum) ; en $(0,1)$, $\\lambda=-\\frac12$ et la forme vaut $-\\Id$ (maximum)."]], "preuve": "§T5 : chemin $u(t)\\in K$, $j(t)=J(u(t))$, $f_i(t)=F_i(u(t))\\equiv0$. $j''(0)\\ge0$ et $f_i''(0)=0$ ; on somme $j''(0)+\\sum\\lambda_if_i''(0)$ : les termes $\\ps{J'+\\sum\\lambda_iF_i'}{u''(0)}$ (courbure du chemin) **s'éliminent** grâce à (2.37).", "mnemo": "« Ajouter à la courbure de $J$ celle des contraintes, pondérée par λ ; ne regarder que les directions tangentes. »", "cloze": "Sous les hypothèses de Lagrange avec $J,F_i$ [[deux fois continûment dérivables]] : si $u$ est un minimum local, $\\big(J''(u)+[[\\sum_i\\lambda_iF_i''(u)]]\\big)(w,w)\\ge0$ pour tout $w\\in[[\\Ker F'(u)]]$. Les multiplicateurs servent à éliminer le terme [[$\\ps{J'(u)}{u''(0)}$]] (courbure du chemin).", "liens": ["2.5.6", "2.5.3", "NL", "3.4.8", "T5"]}, {"id": "2.5.15", "label": "Déf. 2.5.14 · Déf. 2.5.15 · Rem. 2.5.16", "nom": "Contraintes actives, contraintes qualifiées", "surnom": "une direction qui rentre à travers toutes les contraintes actives", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 3, "qs": ["outil", "cn"], "cadre": "$K=\\{v : F_i(v)\\le0,\\ 1\\le i\\le M\\}$ (2.44), $u\\in K$.", "hyp": [["**Déf. 2.5.14** : $I(u)=\\{i : F_i(u)=0\\}$, les contraintes **actives** en $u$", "les inactives ($F_i(u)<0$) ne gênent pas localement"], ["**Déf. 2.5.15** : qualifiées en $u$ ⟺ il existe $\\bar w\\in V$ tel que pour tout $i\\in I(u)$ : $\\ps{F_i'(u)}{\\bar w}<0$, **ou bien** $\\ps{F_i'(u)}{\\bar w}=0$ et $F_i$ affine (2.45)", "$\\bar w$ est une direction **rentrante** : $u+\\eps\\bar w\\in K$ pour $\\eps$ petit (Rem. 2.5.16)"]], "concl": "Sous qualification, le cône linéarisé $\\tilde K(u)=\\{w : \\ps{F_i'(u)}{w}\\le0,\\ i\\in I(u)\\}$ est bien le cône des directions admissibles : **la linéarisation ne ment pas**.", "plus": "**Raccourcis** (Rem. 2.5.25–2.5.27) : **Affines** ⇒ qualifiées ($\\bar w=0$) ; gradients actifs $(F_i'(u))_{i\\in I(u)}$ **Libres** (2.56) ⇒ qualifiées (lemme des diapos) ; $F_i$ convexes + un point $v$ avec $F_i(v)<0$ (ou $=0$ et affine) — **Slater** (2.58) ⇒ qualifiées **en tout point**, avec $\\bar w=v-u$. Cas mixte (Déf. 2.5.23) : $G_i'(u)$ libres et $\\bar w\\in\\bigcap[G_i'(u)]^\\perp$ avec $\\ps{F_i'(u)}{\\bar w}<0$.", "manque": "La qualification dépend de la **description** $F$, pas de l'ensemble $K$ : le demi-plan $x\\le0$ est qualifié, le même demi-plan écrit $x^3\\le0$ ne l'est pas.", "diff": [["2.5.6", "l'analogue de « $F_i'(u)$ libres » pour les égalités ; en inégalités, « libres » n'est qu'une condition **suffisante** de qualification."]], "pourquoi": [["qualification", "$K=\\{x^2\\le0\\}=\\{0\\}$, $J=x$ : $F'(0)=0$, aucun $\\bar w$ ; $J'(0)+\\lambda F'(0)=1\\ne0$ : KKT échoue bien que $0$ soit le minimum."]], "preuve": "—", "mnemo": "« Le réflexe d'examen : **A·L·S** — Affines ? Libres ? Slater ? » Sinon vérifier (2.45) à la main ou traiter le point à part.", "cloze": "$I(u)=\\{i : F_i(u)[[=0]]\\}$ est l'ensemble des contraintes [[actives]]. Les contraintes sont [[qualifiées]] en $u$ s'il existe une direction $\\bar w$ telle que, pour tout $i\\in I(u)$, $\\ps{F_i'(u)}{\\bar w}[[<0]]$, ou bien $\\ps{F_i'(u)}{\\bar w}[[=0]]$ et $F_i$ est [[affine]]. Trois conditions suffisantes : contraintes [[affines]], gradients actifs [[libres]], condition de [[Slater]] ($F_i$ convexes et un point strictement admissible).", "liens": ["2.5.17", "2.5.24", "2.6.4"]}, {"id": "2.5.17", "label": "Théorème 2.5.17 · Rem. 2.5.18", "nom": "Contraintes d'inégalité : le théorème KKT", "surnom": "un mur ne fait que pousser, et seulement si on le touche", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 3, "qs": ["cn"], "cadre": "$K=\\{v : F_i(v)\\le0\\}$ (2.44), $u\\in K$.", "hyp": [["$J,F_1,\\dots,F_M$ **dérivables en $u$**", "(seulement en $u$ : moins que pour Lagrange)"], ["contraintes **qualifiées en $u$** (Déf. 2.5.15)", "$\\bar w$ transforme chaque direction du cône linéarisé en direction vraiment admissible"], ["$u$ minimum local de $J$ sur $K$", ""]], "concl": "Il existe $\\lambda_1,\\dots,\\lambda_M\\ge0$ tels que $$J'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0,\\qquad\\lambda_i\\ge0,\\qquad\\lambda_i=0\\ \\text{si}\\ F_i(u)<0.\\qquad(2.46)$$ Forme équivalente (Rem. 2.5.18) : $\\lambda\\ge0$, $F(u)\\le0$, $\\lambda\\cdot F(u)=0$ (**écarts complémentaires**).", "plus": "Avec le Lagrangien $\\Lag(v,\\mu)=J(v)+\\mu\\cdot F(v)$, $\\mu\\in(\\R^+)^M$ (Déf. 2.5.20) : (2.46) = $\\partial_v\\Lag(u,\\lambda)=0$, et « $\\lambda\\ge0$, $F(u)\\le0$, $\\lambda\\cdot F(u)=0$ » = inéquation d'Euler de la **maximisation** en $\\mu$ sur le convexe $(\\R^+)^M$. Lemme 2.5.21 : $\\inf_{F\\le0}J=\\inf_v\\sup_{\\mu\\ge0}\\Lag(v,\\mu)$.", "manque": "Nécessaire seulement : la suffisance demande la **convexité** (Kuhn–Tucker §2.6.4). On ne connaît pas $I(u)$ : **analyse par cas** sur l'ensemble actif (garder les solutions avec $F_i\\le0$ et $\\lambda_i\\ge0$).", "diff": [["2.5.6", "égalités → inégalités : signe **libre** → signe **positif** + complémentarité ; « libres » → « qualifiées » ; orthogonal → Farkas ; $F_i$ $C^1$ au voisinage → dérivables en $u$."], ["2.6.4", "Kuhn–Tucker : les mêmes conditions deviennent **suffisantes** si $J,F_i$ sont convexes."]], "pourquoi": [["qualification", "$\\{x^2\\le0\\}$, $J=x$ (voir §2.5.15)."], ["$\\lambda_i\\ge0$", "si $\\lambda_i<0$ le mur « tirerait » : avec $F=x-1\\le0$, $J=(x-2)^2$ on trouve $\\lambda=2>0$ ; pour $J=(x+2)^2$ le candidat $x=1$ donnerait $\\lambda=-6$ : rejeté, le minimum est intérieur ($x=-2$, $\\lambda=0$)."]], "preuve": "$\\tilde K(u)=\\{w:\\ps{F_i'(u)}{w}\\le0,\\ i\\in I(u)\\}$ ; pour $w\\in\\tilde K(u)$ et $\\delta>0$, $u+\\eps(w+\\delta\\bar w)\\in K$ (trois cas : inactive / $<0$ / $=0$ et affine) ⇒ §T4 : $\\ps{J'(u)}{w+\\delta\\bar w}\\ge0$, $\\delta\\to0$ ⇒ $\\ps{J'(u)}{w}\\ge0$ sur $\\tilde K(u)$ ⇒ **Farkas** §2.5.19 : $J'(u)=-\\sum_{i\\in I(u)}\\lambda_iF_i'(u)$, $\\lambda_i\\ge0$ ; $\\lambda_i=0$ pour $i\\notin I(u)$.", "mnemo": "« **S·A·P·C** : Stationnarité ($J'+\\sum\\lambda_iF_i'=0$), Admissibilité ($F\\le0$), Positivité ($\\lambda\\ge0$), Complémentarité ($\\lambda\\cdot F=0$). » Convention : **minimiser**, contraintes écrites $F\\le0$, $\\Lag=J+\\lambda F$, $\\lambda\\ge0$ ; une contrainte $g\\ge0$ s'écrit $-g\\le0$.", "cloze": "Soit $K=\\{F_i\\le0\\}$, $J$ et les $F_i$ [[dérivables en $u$]], les contraintes [[qualifiées]] en $u$. Si $u$ est un minimum [[local]] de $J$ sur $K$, il existe $\\lambda_1,\\dots,\\lambda_M[[\\ge0]]$ tels que $J'(u)+[[\\sum_i\\lambda_iF_i'(u)]]=0$ et $\\lambda_i=0$ si [[$F_i(u)<0$]] ; de façon équivalente $\\lambda\\ge0$, $F(u)\\le0$ et [[$\\lambda\\cdot F(u)=0$]] (écarts complémentaires). La preuve passe par le lemme de [[Farkas]].", "liens": ["2.5.15", "2.5.19", "2.5.6", "2.5.24", "2.6.4", "3.4.3", "T6"]}, {"id": "2.5.19", "label": "Lemme 2.5.19 (Farkas)", "nom": "Le lemme de Farkas", "surnom": "du cône aux multiplicateurs positifs", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 2, "qs": ["outil"], "cadre": "$a_1,\\dots,a_M\\in V$ ; $\\mathsf K=\\{w : \\ps{a_i}{w}\\le0\\ \\forall i\\}$ ; $\\hat{\\mathsf K}=\\{-\\sum_i\\lambda_ia_i,\\ \\lambda_i\\ge0\\}$ (cône engendré par les $-a_i$).", "hyp": [["$\\ps{p}{w}\\ge0$ pour tout $w\\in\\mathsf K$", "$p$ fait un angle aigu avec tout le cône"]], "concl": "$p\\in\\hat{\\mathsf K}$ : il existe $\\lambda_i\\ge0$ avec $p=-\\sum_i\\lambda_ia_i$. (Réciproque évidente : c'est une équivalence.)", "manque": "", "diff": [["2.5.6", "version « sous-espace » : si $\\ps{p}{w}=0$ sur $\\bigcap[a_i]^\\perp$ alors $p\\in\\Vect(a_i)$, avec des coefficients de **signe quelconque**."]], "pourquoi": [], "preuve": "§T11 : (1) $\\hat{\\mathsf K}$ est un convexe **fermé** (famille libre, puis récurrence si liée : réunion finie de cônes à $M-1$ générateurs). (2) Si $p\\notin\\hat{\\mathsf K}$, on sépare : $\\ps{p}{w}<\\alpha<\\ps{q}{w}$ pour $q\\in\\hat{\\mathsf K}$ ; $q=0$ donne $\\alpha<0$, $q=-\\lambda a_i$, $\\lambda\\to\\infty$ donne $\\ps{a_i}{w}\\le0$ : $w\\in\\mathsf K$ et $\\ps{p}{w}<0$, contradiction. En Hilbert la séparation est une **projection**.", "mnemo": "« Projection ⇒ Farkas ⇒ KKT » : le cœur du chapitre 2 tient en une chaîne. Pour KKT : $p=J'(u)$, $a_i=F_i'(u)$, $i\\in I(u)$.", "cloze": "Soient $a_1,\\dots,a_M\\in V$ et $\\mathsf K=\\{w : \\ps{a_i}{w}[[\\le0]]\\ \\forall i\\}$. Si $\\ps{p}{w}\\ge0$ pour tout $w\\in\\mathsf K$, alors $p=[[-\\sum_i\\lambda_ia_i]]$ avec des $\\lambda_i[[\\ge0]]$. La preuve : le cône engendré est [[fermé]], puis [[séparation]].", "liens": ["2.5.17", "T11", "T6"]}, {"id": "2.5.24", "label": "Déf. 2.5.23 · Théorème 2.5.24", "nom": "Égalités et inégalités mélangées", "surnom": "Lagrange + KKT", "sec": "2.5.2 · Lagrange et KKT", "chap": 2, "prio": 3, "qs": ["cn"], "cadre": "$K=\\{v : G(v)=0,\\ F(v)\\le0\\}$ (2.53), $G:V\\to\\R^N$, $F:V\\to\\R^M$.", "hyp": [["$J$, $F$ dérivables en $u$ ; $G$ dérivable au voisinage de $u$", ""], ["**qualifiées (Déf. 2.5.23)** : les $G_i'(u)$ sont **libres** et il existe $\\bar w\\in\\bigcap_i[G_i'(u)]^\\perp$ avec $\\ps{F_i'(u)}{\\bar w}<0$ pour tout $i\\in I(u)$ (2.54)", "$\\bar w$ reste **tangent** aux égalités et **rentre** à travers les inégalités actives"], ["$u$ minimum local de $J$ sur $K$", ""]], "concl": "Il existe $\\mu_1,\\dots,\\mu_N\\in\\R$ et $\\lambda_1,\\dots,\\lambda_M\\ge0$ tels que $$J'(u)+\\sum_{i=1}^N\\mu_iG_i'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0,\\qquad\\lambda\\ge0,\\ F(u)\\le0,\\ \\lambda\\cdot F(u)=0.\\qquad(2.55)$$", "plus": "Raccourci (Rem. 2.5.26) : $(G_i'(u))_i\\cup(F_i'(u))_{i\\in I(u)}$ **libre** ⇒ qualifiées. Pourquoi $\\mu$ libre : $G=0$ équivaut à $G\\le0$ et $-G\\le0$, d'où $\\mu=\\lambda^+-\\lambda^-$.", "manque": "Même limites que §2.5.6 et §2.5.17 : nécessaire seulement (sauf convexité : Rem. 2.6.5, égalités affines écrites comme deux inégalités).", "diff": [["2.5.6", "ajoute les inégalités et leurs $\\lambda\\ge0$."], ["2.5.17", "ajoute les égalités et leurs $\\mu\\in\\R$ ; $\\bar w$ doit en plus être tangent aux égalités."]], "pourquoi": [], "preuve": "« Simple adaptation » (laissée au lecteur) : même schéma que §2.5.6 et §2.5.17 avec $\\Ker G'(u)$ à la place de $V$.", "mnemo": "« Égalité = multiplicateur **libre** ; inégalité = multiplicateur **positif** et **complémentaire**. »", "cloze": "$K=\\{G=0,\\ F\\le0\\}$. Qualifiées en $u$ : les $G_i'(u)$ sont [[libres]] et il existe $\\bar w\\in[[\\bigcap_i[G_i'(u)]^\\perp]]$ avec $\\ps{F_i'(u)}{\\bar w}[[<0]]$ pour $i\\in I(u)$. Alors en un minimum local : $J'(u)+\\sum\\mu_iG_i'(u)+\\sum\\lambda_iF_i'(u)=0$ avec $\\mu_i\\in[[\\R]]$, $\\lambda_i[[\\ge0]]$ et $\\lambda\\cdot F(u)=[[0]]$.", "liens": ["2.5.6", "2.5.17", "2.5.15"]}, {"id": "2.6.2", "label": "Déf. 2.6.1 · Prop. 2.6.2", "nom": "Point-selle ⇒ minimum (sans convexité)", "surnom": "un col : min en $v$, max en $q$", "sec": "2.6 · Point-selle, Kuhn–Tucker, dualité", "chap": 2, "prio": 2, "qs": ["cs", "dual"], "cadre": "$\\Lag$ défini sur $U\\times P$. Égalités : $P=\\R^M$ ; inégalités : $P=(\\R^+)^M$ ; $\\Lag(v,q)=J(v)+q\\cdot F(v)$.", "hyp": [["**Déf. 2.6.1** : $(u,p)$ point-selle ⟺ $\\Lag(u,q)\\le\\Lag(u,p)\\le\\Lag(v,p)$ pour tous $q\\in P$, $v\\in U$ (2.59)", "$u$ meilleure réponse à $p$, $p$ meilleure réponse à $u$"], ["$J,F_i$ continues ; $U$ ouvert contenant $K$", ""]], "concl": "**Prop. 2.6.2** : si $(u,p)$ est un point-selle, alors $u\\in K$ et $u$ est un minimum **global** de $J$ sur $K$. Si de plus $J,F_i$ sont dérivables en $u$ : $J'(u)+\\sum p_iF_i'(u)=0$ (2.60). **Aucune convexité requise dans ce sens.**", "manque": "La réciproque (minimum ⇒ point-selle) est fausse en général : il faut la convexité et la qualification (§2.6.4). Exemple : $\\Lag(v,q)=(v-q)^2$ sur $[0,1]^2$ n'a pas de point-selle (Ex. 2.6.1).", "diff": [["2.6.4", "Kuhn–Tucker est l'équivalence, sous convexité + qualification."]], "pourquoi": [], "preuve": "Inégalité de gauche pour tout $q\\ge0$ : $(q-p)\\cdot F(u)\\le0$ ⇒ ($q=p+e_i$) $F_i(u)\\le0$ ; ($q=0$, $q=2p$) $p\\cdot F(u)=0$. Inégalité de droite : $J(u)=\\Lag(u,p)\\le J(v)+p\\cdot F(v)\\le J(v)$ pour $v\\in K$. Stationnarité : $u$ minimise $J+p\\cdot F$ sur l'ouvert $U$.", "mnemo": "« La maximisation en $q$ impose la contrainte ; la minimisation en $v$ fait le reste. »", "cloze": "$(u,p)$ est un [[point-selle]] de $\\Lag$ sur $U\\times P$ si $\\Lag(u,q)[[\\le]]\\Lag(u,p)[[\\le]]\\Lag(v,p)$ pour tous $q\\in P$, $v\\in U$. Si $(u,p)$ est un point-selle (sans [[convexité]]), alors $u\\in[[K]]$ et $u$ est un minimum [[global]] de $J$ sur $K$.", "liens": ["2.6.4", "2.6.9", "3.4.3"]}, {"id": "2.6.4", "label": "Théorème 2.6.4 (Kuhn et Tucker) · Rem. 2.6.5", "nom": "Cas convexe : KKT ⟺ point-selle ⟺ minimum global", "surnom": "résoudre KKT, c'est résoudre le problème", "sec": "2.6 · Point-selle, Kuhn–Tucker, dualité", "chap": 2, "prio": 3, "qs": ["cs", "dual"], "diapos": "Diapos, « Théorème 2.6.9 » : « $J$, $F_i$ convexes, $u$ solution du primal ⇒ il existe $\\lambda\\ge0$ tel que $(u,\\lambda)$ soit un point-selle et $I(u)=\\min I=\\max G=G(\\lambda)$ ». C'est en fait Kuhn–Tucker + Cor. 2.6.12 (qui supposent la qualification) ; le vrai Th. 2.6.9 du livre est l'équivalence générale point-selle ⟺ min = max.", "cadre": "$K=\\{F_i\\le0\\}$ (2.62), $\\Lag(v,q)=J(v)+q\\cdot F(v)$ sur $V\\times(\\R^+)^M$.", "hyp": [["$J,F_1,\\dots,F_M$ **convexes continues** sur $V$, dérivables sur $K$", "convexité : les CN deviennent CS ; $K$ est convexe fermé (Rem. 2.6.3 : §2.3.9 donne l'existence si $J$ infinie à l'infini)"], ["contraintes **qualifiées en $u$**", "pour le sens ⇒ (via §2.5.17) seulement"]], "concl": "$u\\in K$ est un minimum **global** de $J$ sur $K$ ⟺ il existe $p\\in(\\R^+)^M$ tel que $(u,p)$ soit un **point-selle** de $\\Lag$ sur $V\\times(\\R^+)^M$ ⟺ $$F(u)\\le0,\\quad p\\ge0,\\quad p\\cdot F(u)=0,\\quad J'(u)+\\sum_ip_iF_i'(u)=0.\\qquad(2.63)$$", "plus": "Le sens **suffisant** tient en une ligne et **sans qualification** : pour $v\\in K$, $J(v)\\ge J(v)+p\\cdot F(v)\\ge J(u)+p\\cdot F(u)+\\ps{J'(u)+p\\cdot F'(u)}{v-u}=J(u)$. Rem. 2.6.5 : égalités affines $Av=b$ via $Av-b\\le0$ et $b-Av\\le0$.", "manque": "Pas d'existence : il faut en plus $J$ infinie à l'infini (§2.3.9) ou α-convexe (§2.3.8). Pas d'unicité de $p$ en général.", "diff": [["2.5.17", "ajoute la convexité : nécessaire ⇒ nécessaire **et suffisant**, minimum local ⇒ **global**, et l'interprétation point-selle."], ["2.6.12", "le corollaire ajoute : $p$ maximise la fonction duale $\\mathcal G$."]], "pourquoi": [["convexité (pour ⇐)", "$-x^2$ sur $[-1,1]$ : KKT en $0$, maximum."], ["qualification (pour ⇒)", "$\\{x^2\\le0\\}$, $J=x$."]], "preuve": "⇒ : §2.5.17 donne (2.63) ; $v\\mapsto J+p\\cdot F$ est convexe ($p\\ge0$) de dérivée nulle en $u$ : inégalité de droite ; $\\Lag(u,q)-\\Lag(u,p)=q\\cdot F(u)\\le0$ : inégalité de gauche. ⇐ : §2.6.2.", "mnemo": "« Convexe + qualifié : KKT **est** la solution. » En examen : existence (§2.2.1/§2.3.9) → unicité (§2.3.4) → qualification (A·L·S) → KKT par analyse de cas → conclure par Kuhn–Tucker.", "cloze": "Soient $J,F_1,\\dots,F_M$ [[convexes]] continues sur $V$, dérivables sur $K$, et $u\\in K$ un point où les contraintes sont [[qualifiées]]. Alors $u$ est un minimum [[global]] de $J$ sur $K$ si et seulement s'il existe $p\\in[[(\\R^+)^M]]$ tel que $(u,p)$ soit un [[point-selle]] de $\\Lag$, ou de manière équivalente : $F(u)\\le0$, $p\\ge0$, [[$p\\cdot F(u)=0$]], $J'(u)+\\sum p_iF_i'(u)=0$.", "liens": ["2.5.17", "2.6.2", "2.6.9", "2.6.12", "3.4.3"]}, {"id": "2.6.9", "label": "Déf. 2.6.7 · Théorème 2.6.9 · Rem. 2.6.11", "nom": "Primal, dual, théorème de dualité, dualité faible", "surnom": "le dual est toujours dessous", "sec": "2.6 · Point-selle, Kuhn–Tucker, dualité", "chap": 2, "prio": 3, "qs": ["dual"], "diapos": "Diapos : $I(v)=\\sup_{\\mu\\ge0}\\Lag(v,\\mu)$ (primal $\\inf_vI$), $G(\\mu)=\\inf_v\\Lag(v,\\mu)$ (dual $\\sup_\\mu G$). **Coquille** : la diapo écrit $\\inf I\\le\\sup G$ ; le bon sens est $\\sup G\\le\\inf I$ (2.75).", "cadre": "$\\Lag$ sur $U\\times P$. Fonction primale $\\mathcal J(v)=\\sup_{q\\in P}\\Lag(v,q)$, duale $\\mathcal G(q)=\\inf_{v\\in U}\\Lag(v,q)$ (2.68). Primal : $\\inf_v\\mathcal J$ ; dual : $\\sup_q\\mathcal G$.", "hyp": [["**Th. 2.6.9** : aucune hypothèse (équivalence pure)", ""], ["**Rem. 2.6.11** : aucune hypothèse", ""]], "concl": "**Th. 2.6.9** : $(u,p)$ est un point-selle ⟺ $\\mathcal J(u)=\\min_{v\\in U}\\mathcal J(v)=\\max_{q\\in P}\\mathcal G(q)=\\mathcal G(p)$ (2.71). **Dualité faible (2.75)** : toujours $\\sup_q\\inf_v\\Lag\\le\\inf_v\\sup_q\\Lag$ ; la différence est le **saut de dualité**.", "plus": "Pour $\\inf_{F\\le0}J$ : $\\mathcal J(v)=J(v)$ si $F(v)\\le0$, $+\\infty$ sinon (2.77) : le primal **est** le problème d'origine. $\\mathcal G$ est toujours **concave** (infimum de fonctions affines de $q$), sous les contraintes triviales $q\\ge0$.", "manque": "Le théorème ne dit pas qu'un point-selle **existe** ; sans point-selle, min et max ne s'échangent pas (Ex. 2.6.1 : saut $\\frac14$ ; sans convexité le saut peut être infini).", "diff": [["2.6.12", "le corollaire fournit l'existence du point-selle dans le cas convexe qualifié."]], "pourquoi": [["point-selle (pour min = max)", "$\\Lag(v,q)=(v-q)^2$ sur $[0,1]^2$ : $\\inf_v\\sup_q=\\frac14>0=\\sup_q\\inf_v$."]], "preuve": "§T9 : $\\inf_{v'}\\Lag(v',q)\\le\\Lag(v,q)\\le\\sup_{q'}\\Lag(v,q')$, sup en $q$ à gauche, inf en $v$ à droite. Point-selle ⇒ (2.71) : $\\mathcal J(v)\\ge\\Lag(v,p)\\ge\\Lag(u,p)=\\mathcal J(u)$ ; (2.71) ⇒ point-selle : $\\Lag(u,q)\\le\\mathcal J(u)=\\Lag^*=\\mathcal G(p)\\le\\Lag(v,p)$.", "mnemo": "« Le primal descend, le dual monte, toute valeur duale minore toute valeur primale ; un point-selle, c'est quand ils se rejoignent. » Sup Inf ≤ Inf Sup : **le Dual est Dessous**.", "cloze": "$\\mathcal J(v)=[[\\sup_{q\\in P}\\Lag(v,q)]]$ (fonction primale), $\\mathcal G(q)=[[\\inf_{v\\in U}\\Lag(v,q)]]$ (fonction duale, toujours [[concave]]). Théorème 2.6.9 : $(u,p)$ est un point-selle ⟺ $\\mathcal J(u)=[[\\min_v\\mathcal J(v)]]=[[\\max_q\\mathcal G(q)]]=\\mathcal G(p)$. Dualité faible, toujours vraie : $\\sup_q\\inf_v\\Lag[[\\le]]\\inf_v\\sup_q\\Lag$ ; la différence est le [[saut
