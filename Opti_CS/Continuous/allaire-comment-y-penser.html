 $\\bar x=A^{-1}(b+B^*p)$ ; dans $B\\bar x=c$ : $(BA^{-1}B^*)p=c-BA^{-1}b$. $S=BA^{-1}B^*$ est symétrique définie positive ($Sq\\cdot q=A^{-1}(B^*q)\\cdot(B^*q)>0$ pour $q\\ne0$, $B^*$ injective). Donc $p=S^{-1}(c-BA^{-1}b)$, $\\bar x=A^{-1}b+A^{-1}B^*S^{-1}(c-BA^{-1}b)$ ; $c=0$ redonne le livre."], ["pas", "Réciproque : si $x\\in K$ et $Ax-b=B^*p$, alors $\\ps{J'(x)}{y-x}=p\\cdot B(y-x)=p\\cdot(c-c)=0$ pour $y\\in K$ : Euler, donc minimum global. Le couple $(\\bar x,p)$ est caractérisé par le système linéaire $A\\bar x-B^*p=b$, $B\\bar x=c$."], ["controle", "Rang $<m$ : $K\\ne\\emptyset$ ssi $c\\in\\Im B$ ; on translate $x=x_0+y$ avec $Bx_0=c$ et on retombe sur l'Ex. 2.5.3 avec $b-Ax_0$. Sensibilité : $\\nabla_cJ_{\\min}=p$ — le multiplicateur est le coût marginal du niveau de contrainte (Lemme §2.5.12, $\\lambda=-p$)."], ["bilan", "Contraintes affines de rang plein : éliminer la variable primale, et **le système se réduit à la matrice duale $BA^{-1}B^*$**, symétrique définie positive — celle qui gouvernera Uzawa (Ex. 3.4.2). Et le réflexe « translater pour se ramener au cas homogène » (T6, T15)."]], "livre": "Identique au corrigé. Garder le calcul de sensibilité : c'est la vérification la plus concrète du Lemme 2.5.12.", "reflexes": ["R1", "R13", "R15"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "exo-2-5-10"}, "voir": ["E2.5.3", "2.5.12", "E3.4.2"]}, {"id": "E2.5.11", "kind": "exo", "num": "Ex. 2.5.11", "label": "Exercice 2.5.11 · niveau 1", "nom": "La plus petite valeur propre par Lagrange : les points critiques sont tous les vecteurs propres", "enonce": "$\\inf_{\\norm x=1}Ax\\cdot x$, $A$ symétrique. Appliquer §2.5.6 ; les minima sont des vecteurs propres pour $\\lambda_{\\min}$.", "chaine": [["but", "Un minimum sous une contrainte d'égalité : §2.5.6 demande $F$ dérivable avec $F'\\ne0$ sur la contrainte. $\\norm x-1$ n'est pas dérivable en $0$ ; je prends $F(x)=x\\cdot x-1$, $F'(x)=2x\\ne0$ sur la sphère."], ["pas", "Existence : sphère compacte, $J$ continue (§2.2.1). Lagrange : $J'(x)=2Ax$, donc $2A\\bar x+2\\lambda\\bar x=0$ : $A\\bar x=\\mu\\bar x$, $\\mu=-\\lambda$. **Tous** les vecteurs propres unitaires sont points critiques : la condition du premier ordre ne trie pas."], ["idee", "Qui trie ? La **valeur** : en un point critique, $J(\\bar x)=A\\bar x\\cdot\\bar x=\\mu$. Avec $e_1$ propre unitaire pour $\\mu_1=\\lambda_{\\min}$ : $\\mu=J(\\bar x)\\le J(e_1)=\\mu_1$, et $\\mu\\ge\\mu_1$ car $\\mu$ est une valeur propre. Donc $\\mu=\\mu_1$."], ["pas", "Réciproque et ensemble des minima : base propre, $J(x)=\\sum\\mu_kx_k^2\\ge\\mu_1$ sur la sphère, égalité ssi $x\\in\\Ker(A-\\mu_1\\Id)$. Minimum $=\\mu_1$, multiplicateur $\\lambda=-\\mu_1$ ; de même $\\max=\\mu_n$."], ["bilan", "Lagrange fournit les **candidats** (ici tout le spectre) ; le tri se fait par comparaison des valeurs ou par le second ordre (Ex. 2.5.16). Et choisir une contrainte $C^1$ : $x\\cdot x-1$ plutôt que $\\norm x-1$ (R1, T6)."]], "livre": "Identique au corrigé.", "reflexes": ["R1", "R10"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "exo-2-5-11"}, "voir": ["2.5.6", "E2.5.16", "E2.5.13"]}, {"id": "E2.5.12", "kind": "exo", "num": "Ex. 2.5.12", "label": "Exercice 2.5.12 · niveau 3", "nom": "Didon : courbure constante par Lagrange, centre sur le rivage par la variation en ξ", "enonce": "Maximiser $\\int_0^\\xi y$ sous $y(0)=y(\\xi)=0$ et $\\int_0^\\xi\\sqrt{1+y'^2}=l$, en $(\\xi,y)$. Calculer les dérivées directionnelles ; montrer que la solution est un arc de cercle.", "chaine": [["but", "Un problème isopérimétrique : aire $\\mathcal A(y)=\\int y$ sous longueur $\\mathcal P(y)=l$. Même grammaire qu'en 2.5.4 (dérivées directionnelles, bosses), avec un multiplicateur : $\\mathcal A'+\\lambda\\mathcal P'=0$ (§2.5.6, admis dans cet espace de fonctions). Je fixe d'abord $\\xi$."], ["pas", "Directions admissibles à $\\xi$ fixé : $w\\in C^1$, $w(0)=w(\\xi)=0$. $\\mathcal A$ est linéaire : $\\mathcal A'(y)(w)=\\int w$. $\\mathcal P'(y)(w)=\\int\\frac{y'w'}{\\sqrt{1+y'^2}}$ (dérivée de $\\sqrt{1+s^2}$ sous l'intégrale)."], ["question", "La condition $\\int w+\\lambda\\int\\frac{y'w'}{\\sqrt{1+y'^2}}=0$ mélange $w$ et $w'$. Je veux tout en $w'$ : $\\int_0^\\xi w=[xw]_0^\\xi-\\int xw'=-\\int xw'$. Donc $\\int_0^\\xi gw'=0$ pour tout $w$ admissible, avec $g=\\lambda\\frac{y'}{\\sqrt{1+y'^2}}-x$."], ["idee", "Lemme de du Bois-Reymond : $\\int gw'=0$ pour tout $w$ nul aux bords ⇒ $g$ constante. Preuve : $w(x)=\\int_0^x(g-\\bar g)$ est admissible ($w(\\xi)=0$ par définition de la moyenne $\\bar g$), et $0=\\int g(g-\\bar g)=\\int(g-\\bar g)^2$. Donc $\\frac{y'}{\\sqrt{1+y'^2}}=\\frac{x-x_0}\\lambda$ ($\\lambda\\ne0$ sinon $x$ serait constant). Cas régulier : $\\mathcal P'(y)=0$ forcerait $y'$ constant, $y\\equiv0$, aire nulle."], ["pas", "Résoudre : $|x-x_0|<|\\lambda|$, $y'=\\sgn(\\lambda)\\frac{x-x_0}{\\sqrt{\\lambda^2-(x-x_0)^2}}$, donc $(x-x_0)^2+(y-y_0)^2=\\lambda^2$ : **arc de cercle** de rayon $|\\lambda|$, et $y(0)=y(\\xi)=0$ donne $x_0=\\xi/2$. C'est la conclusion demandée ; $\\lambda$ est la **courbure inverse**."], ["pas", "Variation en $\\xi$ (complément) : pour dériver en $\\xi$, je fixe le domaine par $x=\\xi t$, $z(t)=y(\\xi t)$ : $\\mathcal A=\\xi\\int_0^1z$, $\\mathcal P=\\int_0^1\\sqrt{\\xi^2+z'^2}$. Un seul multiplicateur pour $(\\xi,z)$, donc le même $\\lambda$ : $\\int y+\\lambda\\int\\frac{dx}{\\sqrt{1+y'^2}}=0$. Sur l'arc supérieur de rayon $R=-\\lambda>0$ et de centre à profondeur $h$ : $\\frac1{\\sqrt{1+y'^2}}=\\frac{y+h}R$, et la condition devient $-h\\xi=0$ : **le centre est sur le rivage**, demi-cercle $R=l/\\pi$, aire $l^2/2\\pi$."], ["controle", "Subtilité : pour $h=0$ les tangentes aux bouts sont verticales, $y\\notin C^1$ — dans la classe de l'énoncé le sup n'est pas atteint, il est approché par des arcs. Sensibilité (§2.5.12) : $R=-\\lambda=l/\\pi=\\frac d{dl}(l^2/2\\pi)$, le gain d'aire par unité de longueur."], ["bilan", "Calcul des variations avec contrainte intégrale : **mettre toute la condition sous la forme $\\int gw'=0$** (intégration par parties), **du Bois-Reymond** ($g$ constante), puis résoudre l'équation différentielle. Pour une variable de domaine, **changer de variable pour fixer le domaine** (T4, T6, T15)."]], "livre": "Le corrigé est cette chaîne, y compris la variation en $\\xi$ et la subtilité de la classe $C^1$. Le lemme de du Bois-Reymond, avec sa preuve en une ligne, est la technique à garder — il sert aussi dans l'Ex. 2.6.3.", "reflexes": ["R1", "R4", "R13", "R15"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "exo-2-5-12"}, "voir": ["E2.5.4", "2.5.12", "E2.6.3"]}, {"id": "E2.5.13", "kind": "exo", "num": "Ex. 2.5.13", "label": "Exercice 2.5.13 · niveau 2", "nom": "Forme linéaire sur un ellipsoïde : le sup est au bord, et l'inclusion renverse l'ordre", "enonce": "$A>0$, $b\\ne0$. $\\sup_{Ax\\cdot x\\le1}b\\cdot x$ et $\\sup_{Ax\\cdot x=1}b\\cdot x$ sont équivalents, ont une solution unique, à calculer ; en déduire $A\\ge B\\Rightarrow B^{-1}\\ge A^{-1}$.", "chaine": [["but", "Un sup sur un ellipsoïde plein et sur sa frontière. Intuition : une forme linéaire non nulle n'a pas de maximum **intérieur** (on peut toujours avancer dans la direction $b$), donc le sup est au bord. Je dois le prouver, puis Lagrange sur le bord."], ["pas", "Existence : $E=\\{Ax\\cdot x\\le1\\}$ borné ($\\norm x\\le\\alpha^{-1/2}$), fermé, non vide ; $\\Sigma$ aussi. $\\max$ atteint sur chacun. Sup au bord : $M=b\\cdot\\bar x\\ge\\eps\\norm b^2>0$ (tester $\\eps b\\in E$) ; si $A\\bar x\\cdot\\bar x<1$, le point $\\hat x=\\bar x/\\sqrt{A\\bar x\\cdot\\bar x}\\in\\Sigma$ donnerait $b\\cdot\\hat x>M$ : contradiction. Donc $\\bar x\\in\\Sigma$, mêmes valeurs, mêmes solutions."], ["pas", "Lagrange sur $\\Sigma=\\{F=0\\}$, $F=Ax\\cdot x-1$, $F'=2Ax\\ne0$ : on minimise $-b\\cdot x$, $-b+2\\lambda A\\bar x=0$, $\\bar x=A^{-1}b/2\\lambda$ ; la contrainte donne $4\\lambda^2=A^{-1}b\\cdot b=:s^2$. Deux candidats $\\pm A^{-1}b/s$, valeurs $\\pm s$ : le max est $\\bar x=A^{-1}b/\\sqrt{A^{-1}b\\cdot b}$, unique, de valeur $\\sqrt{A^{-1}b\\cdot b}$. Vérification par Cauchy–Schwarz pour $\\ps\\cdot\\cdot_A$."], ["idee", "Question 2 : $A\\ge B$ ⇒ $\\{Ax\\cdot x\\le1\\}\\subset\\{Bx\\cdot x\\le1\\}$ : l'ellipsoïde de $A$ est **plus petit**. Le max d'une même fonction sur un ensemble plus grand est plus grand : $\\sqrt{A^{-1}b\\cdot b}\\le\\sqrt{B^{-1}b\\cdot b}$ pour tout $b$, i.e. $B^{-1}\\ge A^{-1}$."], ["bilan", "**Une valeur optimale est monotone par rapport à l'ensemble admissible** : c'est souvent le chemin le plus court pour comparer deux quantités définies par une optimisation (R12). Et $(\\max_{Ax\\cdot x\\le1}b\\cdot x)^2=A^{-1}b\\cdot b$ : la norme duale de $\\sqrt{Ax\\cdot x}$ est $\\sqrt{A^{-1}b\\cdot b}$."]], "livre": "Identique au corrigé (T1, T6). L'argument de la question 2 est un modèle : prouver une inégalité matricielle sans calcul, par comparaison d'ensembles admissibles.", "reflexes": ["R12", "R1"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "exo-2-5-13"}, "voir": ["2.5.6", "E2.5.11"]}, {"id": "E2.5.14", "kind": "exo", "num": "Ex. 2.5.14", "label": "Exercice 2.5.14 · niveau 2", "nom": "Entropie : le minimum est intérieur (pente −∞ en 0), Lagrange égalise, Gibbs par log t ≤ t − 1", "enonce": "Minimiser $\\sum p_i\\log p_i$ sur le simplexe ; unique minimum à calculer. Puis $-\\sum p_i\\log p_i=\\inf_q-\\sum p_i\\log q_i$ (Gibbs).", "chaine": [["but", "Existence : simplexe compact, $J$ continue ($t\\log t\\to0$ en $0$). Unicité : $\\varphi=t\\log t$ strictement convexe ($\\varphi''=1/t$), donc $J$ strictement convexe. Reste à **calculer**, et l'obstacle est que les contraintes $p_i\\ge0$ pourraient être actives."], ["question", "Le minimum touche-t-il le bord ? Si $\\bar p_j=0$ et $\\bar p_k>0$, je transfère une masse $t$ de $k$ vers $j$ : $g(t)=\\varphi(t)+\\varphi(\\bar p_k-t)+$cste, $g'(t)=\\log t-\\log(\\bar p_k-t)\\to-\\infty$ en $0^+$. La pente infinie de $t\\log t$ en $0$ rend tout bord **répulsif** : $g(t)<g(0)$ pour $t$ petit, contradiction. Donc $\\bar p_i>0$."], ["pas", "Seule la contrainte $\\sum p_i=1$ est active, $F'=(1,\\dots,1)\\ne0$, $J$ est $C^1$ près de $\\bar p$ : Lagrange, $\\log\\bar p_i+1+\\lambda=0$, tous les $\\bar p_i$ égaux : $\\bar p=(1/n,\\dots,1/n)$, $J=-\\log n$. Entropie maximale $\\log n$ pour la loi uniforme seule."], ["idee", "Gibbs : je veux $-\\sum p_i\\log q_i\\ge-\\sum p_i\\log p_i$, i.e. $\\sum p_i\\log(q_i/p_i)\\le0$. La seule inégalité disponible sur $\\log$ : sa tangente en $1$, $\\log t\\le t-1$. Alors $\\sum_{p_i>0}p_i\\log\\frac{q_i}{p_i}\\le\\sum p_i(\\frac{q_i}{p_i}-1)=\\sum_{p_i>0}q_i-1\\le0$. Égalité ssi $q=p$ (sur le support)."], ["controle", "Avec $q$ uniforme, Gibbs redonne $-\\sum p_i\\log p_i\\le\\log n$ : seconde preuve de la question 1, sans Lagrange. Et l'entropie est un inf de fonctions linéaires en $p$ : concave (Ex. 2.3.2)."], ["bilan", "Avant Lagrange, **vérifier que le minimum est intérieur** : une pente infinie au bord le garantit (R11, perturber vers l'intérieur). Pour une inégalité avec un $\\log$, **la tangente en 1** fait presque toujours le travail (R1)."]], "livre": "Identique au corrigé (T4, T6). La seconde preuve par Gibbs montre qu'une inégalité de tangente peut remplacer tout l'appareil des multiplicateurs — même idée que dans l'Ex. 2.5.15.", "reflexes": ["R11", "R1", "R12"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "exo-2-5-14"}, "voir": ["2.5.6", "E2.5.15", "E2.3.2"]}, {"id": "E2.5.15", "kind": "exo", "num": "Ex. 2.5.15", "label": "Exercice 2.5.15 · niveau 3", "nom": "Maxwellienne : contraintes linéaires ⇒ log M polynôme de degré 2, puis preuve par la tangente", "enonce": "$H(f)=\\int f\\log f$ est strictement convexe ; sous les contraintes de moments (2.39), le minimum est la Maxwellienne $M(v)=\\frac\\rho{(2\\pi T)^{N/2}}e^{-|v-u|^2/2T}$.", "chaine": [["but", "Un problème de minimisation « en dimension infinie » avec $N+2$ contraintes **linéaires** en $f$ : masse, impulsion, énergie. Stratégie : stricte convexité point par point ; calcul **formel** par Lagrange pour deviner la forme ; identification des paramètres ; puis une preuve rigoureuse par l'inégalité de tangente, comme pour Gibbs."], ["pas", "Stricte convexité : $\\varphi=t\\log t$ strictement convexe ; $\\Delta=\\theta\\varphi(f)+(1-\\theta)\\varphi(g)-\\varphi(\\theta f+(1-\\theta)g)\\ge0$ point par point, $>0$ sur $\\{f\\ne g\\}$ ; intégrer, et une fonction $\\ge0$ d'intégrale nulle est nulle p.p."], ["pas", "Lagrange formel : $\\frac d{dt}H(f+tg)|_0=\\int(1+\\log f)g$ ; multiplicateurs $\\alpha,\\beta,\\gamma$ des trois contraintes : $\\int(1+\\log M+\\alpha+\\beta\\cdot v+\\frac\\gamma2|v|^2)g=0$ pour tout $g$, donc $\\log M=-1-\\alpha-\\beta\\cdot v-\\frac\\gamma2|v|^2$ : **exponentielle d'un polynôme de degré 2**. Intégrabilité force $\\gamma>0$ ; en complétant le carré, $M=Ke^{-|v-w|^2/2\\theta}$."], ["pas", "Identification par les moments (gaussiennes : $\\int e^{-|x|^2/2\\theta}=(2\\pi\\theta)^{N/2}$, $\\int|x|^2e^{-|x|^2/2\\theta}=N\\theta(2\\pi\\theta)^{N/2}$, intégrale impaire nulle) : $K=\\rho(2\\pi\\theta)^{-N/2}$, $w=u$, $\\theta=T$."], ["idee", "Rigueur sans admettre l'existence : tangente de $\\varphi$ en $M(v)$, point par point, $f\\log f\\ge M\\log M+(1+\\log M)(f-M)$. Or $1+\\log M$ est une combinaison linéaire de $1,v_i,|v|^2$, et $f,M$ ont **les mêmes moments** : $\\int(1+\\log M)(f-M)=0$. Donc $H(f)\\ge H(M)$, égalité ssi $f=M$ p.p. : unique minimum."], ["bilan", "Principe du maximum d'entropie : sous des contraintes de moments $\\int\\psi_kf=m_k$, le minimiseur de $\\int f\\log f$ est $\\exp(\\sum c_k\\psi_k)$. Et la **preuve par la tangente** : le calcul formel devine la forme, l'inégalité de convexité la valide en une ligne (T6 puis R12)."]], "livre": "Identique au corrigé. À retenir : seule la trace $\\int|v|^2f$ est imposée, pas chaque $\\int v_iv_jf$ — c'est pourquoi $\\log M$ ne contient que $|v|^2$.", "reflexes": ["R1", "R12", "R13"], "liens": {"fiche": "2.5.6", "guide": "exo-2-5-15"}, "voir": ["E2.5.14", "2.5.10"]}, {"id": "E2.5.16", "kind": "exo", "num": "Ex. 2.5.16", "label": "Exercice 2.5.16 · niveau 2", "nom": "Second ordre sous contraintes : la Hessienne du Lagrangien, sur l'espace tangent seulement", "enonce": "Condition nécessaire du second ordre pour l'Exemple 1.2.3 ($\\min_{\\Ker B}\\frac12Ax\\cdot x-b\\cdot x$) et pour l'Ex. 2.5.11 (sphère).", "chaine": [["but", "Appliquer la Proposition §2.5.13 : $(J''+\\sum\\lambda_iF_i'')(w,w)\\ge0$ pour $w\\in K(u)=\\bigcap[F_i'(u)]^\\perp$. Deux calculs : repérer $F''$ et $K(u)$ dans chaque cas."], ["pas", "Exemple 1.2.3 : contraintes linéaires, $F_i''=0$, $K(\\bar x)=\\Ker B$ : condition $Aw\\cdot w\\ge0$ pour $w\\in\\Ker B$ — **$A$ positive sur $\\Ker B$, pas partout**. Ici elle est aussi suffisante : Taylor exact, $J(\\bar x+w)=J(\\bar x)+\\frac12Aw\\cdot w$ pour $w\\in\\Ker B$ (le terme linéaire est $B^*p\\cdot w=0$). Exemple : $A=\\diag(1,-1)$, $B=(0\\ 1)$."], ["pas", "Sphère : $J''=2A$, $F''=2\\Id$, $K(\\bar x)=\\bar x^\\perp$, premier ordre $A\\bar x=\\mu\\bar x$ ($\\mu=-\\lambda$) : condition $2Aw\\cdot w+2\\lambda w\\cdot w\\ge0$, i.e. $Aw\\cdot w\\ge\\mu\\norm w^2$ pour $w\\perp\\bar x$."], ["idee", "Lecture spectrale : $\\bar x^\\perp$ est stable par $A$ ; la restriction a pour valeurs propres celles de $A$ avec $\\mu$ comptée une fois de moins ; « toutes $\\ge\\mu$ » signifie $\\mu=\\mu_1$. **Le second ordre retrouve seul** la conclusion de l'Ex. 2.5.11. Réciproquement, si $\\mu>\\mu_1$, $w=e_1\\perp\\bar x$ viole la condition : les autres points critiques sont des cols ou maxima."], ["bilan", "Tester **la Hessienne du Lagrangien, sur l'espace tangent** : $J''=2A$ peut être indéfinie alors que $2(A-\\mu\\Id)$ est positive sur $\\bar x^\\perp$ ; le terme $\\lambda F''$ décale le spectre (T5, R16)."]], "livre": "Identique au corrigé.", "reflexes": ["R16", "R1"], "liens": {"fiche": "2.5.13", "scene": "ordre2", "guide": "exo-2-5-16"}, "voir": ["2.5.13", "E2.5.11", "E2.5.3"]}, {"id": "E2.5.17", "kind": "exo", "num": "Ex. 2.5.17", "label": "Exercice 2.5.17 · niveau 1", "nom": "KKT pour une quadratique sous Bx ≤ c : contraintes affines, donc qualifiées", "enonce": "$A>0$, $B$ de rang $m$. Appliquer §2.5.17 : $A\\bar x-b+B^*p=0$, $p\\ge0$, $p\\cdot(B\\bar x-c)=0$.", "chaine": [["but", "Un exercice de **traduction** : vérifier les hypothèses du théorème KKT et réécrire sa conclusion en notation matricielle."], ["pas", "Existence-unicité : $K$ convexe fermé (demi-espaces), non vide ($Bx_0=c$ par surjectivité), $J$ $\\alpha$-convexe : §2.3.8. Qualification : $F_i=b_i\\cdot x-c_i$ affines ; Définition 2.5.15 avec $w=0$ (Remarque 2.5.16) : rien à vérifier."], ["pas", "§2.5.17 : $\\lambda_i\\ge0$, $A\\bar x-b+\\sum\\lambda_ib_i=0$, $\\lambda_i=0$ si $b_i\\cdot\\bar x<c_i$. Avec $p=\\lambda$ et $\\sum p_ib_i=B^*p$ : $A\\bar x-b+B^*p=0$, $p\\ge0$ ; et $p\\cdot(B\\bar x-c)=\\sum p_i(b_i\\cdot\\bar x-c_i)$ est une somme de termes nuls."], ["controle", "$p$ unique ($B^*$ injective). Conditions **suffisantes** par Kuhn–Tucker (§2.6.4). Le rang $m$ ne sert pas à l'existence de $p$, seulement à $K\\ne\\emptyset$ pour tout $c$ et à l'unicité. $p$ maximise la fonction duale sur $\\R^m_+$ : départ d'Uzawa (Ex. 3.4.2)."], ["bilan", "Devant des contraintes affines : **qualification gratuite**, et la condition « $\\lambda_i=0$ si inactive » s'écrit $p\\cdot(B\\bar x-c)=0$ dès que $p\\ge0$ et $B\\bar x\\le c$ (somme de termes de même signe) (T6)."]], "livre": "Identique au corrigé.", "reflexes": ["R1", "R12"], "liens": {"fiche": "2.5.17", "scene": "kkt", "guide": "exo-2-5-17"}, "voir": ["2.5.17", "2.6.4", "E3.4.2"]}, {"id": "E2.5.18", "kind": "exo", "num": "Ex. 2.5.18", "label": "Exercice 2.5.18 · niveau 2", "nom": "Régularisation sous contrainte d'écart : une seule contrainte, active ou non, puis Green", "enonce": "$\\inf\\{\\int|\\nabla u|^2:u\\in V_0,\\ \\int|u-f|^2\\le\\eps^2\\}$. Un minimum vérifie $u_\\eps=f$, ou bien $-\\Delta u_\\eps+\\lambda(u_\\eps-f)=0$ avec $\\lambda\\ge0$, $u_\\eps=0$ au bord.", "chaine": [["but", "KKT avec **une** contrainte d'inégalité, dans un espace de fonctions (au niveau de rigueur du livre). Plan : dérivées directionnelles exactes, qualification, KKT, puis Green pour passer du faible au fort comme en 2.5.4."], ["pas", "$J(u+tw)$ et $F(u+tw)$ sont des polynômes de degré 2 en $t$ : $\\ps{J'(u)}w=2\\int\\nabla u\\cdot\\nabla w$, $\\ps{F'(u)}w=2\\int(u-f)w$."], ["question", "Qualification en $u_\\eps$ ? Si la contrainte est inactive, rien à vérifier. Si elle est active, $\\int|u_\\eps-f|^2=\\eps^2>0$ donc $u_\\eps-f\\not\\equiv0$ : une bosse $w$ placée là où $u_\\eps-f\\ne0$ donne $\\int(u_\\eps-f)w\\ne0$, et en changeant le signe de $w$, $\\ps{F'(u_\\eps)}w<0$ : (2.45). La qualification ne pourrait échouer que si $F'(u_\\eps)=0$, i.e. $u_\\eps=f$ — mais alors $F(f)=-\\eps^2<0$, contrainte inactive. D'où l'alternative de l'énoncé."], ["pas", "KKT : $\\lambda\\ge0$ (nul si inactive) avec $\\int\\nabla u_\\eps\\cdot\\nabla w+\\lambda\\int(u_\\eps-f)w=0$ pour tout $w\\in V_0$. Green ($w=0$ au bord) : $\\int(-\\Delta u_\\eps+\\lambda(u_\\eps-f))w=0$ pour tout $w$, et les bosses donnent l'équation."], ["controle", "$\\lambda=0$ ⇒ ($w=u_\\eps$) $\\int|\\nabla u_\\eps|^2=0$ ⇒ $u_\\eps=0$ : c'est le cas $\\int f^2\\le\\eps^2$. Sinon $\\lambda>0$, contrainte active, $-\\Delta u_\\eps+\\lambda u_\\eps=\\lambda f$ : un **lissage** de $f$, avec $\\lambda$ fixé par $\\int|u_\\eps-f|^2=\\eps^2$. L'alternative $u_\\eps=f$ n'arrive que pour $f=0$."], ["bilan", "Une contrainte d'inégalité : **distinguer active / inactive**, vérifier la qualification en exhibant une direction qui fait décroître strictement $F$, puis Green et bosses pour l'équation (T4, T6)."]], "livre": "Identique au corrigé (T4, T6). La discussion finale ($\\lambda=0$ ⟺ $\\int f^2\\le\\eps^2$) est ce qui donne du sens au multiplicateur : c'est le paramètre de lissage.", "reflexes": ["R1", "R4", "R13"], "liens": {"fiche": "2.5.17", "scene": "kkt", "guide": "exo-2-5-18"}, "voir": ["2.5.17", "E2.5.4"]}, {"id": "E2.6.1", "kind": "exo", "num": "Ex. 2.6.1", "label": "Exercice 2.6.1 · niveau 2", "nom": "Un saut de dualité : l'ordre inf/sup avantage celui qui joue en second", "enonce": "Donner un Lagrangien pour lequel $\\inf_v\\sup_q\\Lag>\\sup_q\\inf_v\\Lag$ avec deux membres finis.", "chaine": [["but", "Je sais (§2.6.9) qu'il y a égalité en présence d'un point-selle, et que les hypothèses naturelles sont « convexe en $v$, concave en $q$ ». Pour un saut, je dois **violer** l'une d'elles. Image : $\\inf\\sup$ = $v$ joue en premier et $q$ répond ; $\\sup\\inf$ = $q$ joue en premier et $v$ répond. Celui qui répond est avantagé."], ["idee", "Une fonction nulle quand $v$ **recopie** $q$ et grande sinon : $\\Lag(v,q)=(v-q)^2$ sur $[0,1]^2$. Si $q$ est annoncé, $v$ le recopie : $\\inf_v=0$, donc $\\sup\\inf=0$. Si $v$ est annoncé, $q$ s'en éloigne le plus possible : $\\sup_q=\\max(v^2,(1-v)^2)\\ge\\frac14$, minimum $\\frac14$ en $v=\\frac12$."], ["pas", "Saut $=\\frac14>0$, membres finis ; par §2.6.9 il n'y a pas de point-selle. Ce qui manque : la **concavité en $q$** ($q\\mapsto(v-q)^2$ est convexe), toutes les autres hypothèses de l'Ex. 2.6.2 étant satisfaites."], ["controle", "Variante « contrainte » : $\\min\\{-v:v\\in\\{0,1\\},v\\le\\frac12\\}$, $\\Lag=-v+q(v-\\frac12)$ : $\\inf\\sup=0$, $\\sup\\inf=-\\frac12$. Ici le saut vient de la non-convexité de $U$ (entiers). Vérification numérique sur une grille : $0{,}25$ et $0$."], ["bilan", "Pour fabriquer un contre-exemple, **identifier l'hypothèse à violer et construire le cas le plus simple qui la viole** (R10, R3). Et l'image du jeu séquentiel : jouer en second ne peut qu'aider, d'où $\\inf\\sup\\ge\\sup\\inf$ toujours (T9)."]], "livre": "Identique au corrigé.", "reflexes": ["R10", "R3", "R1"], "liens": {"fiche": "2.6.9", "scene": "col", "guide": "exo-2-6-1"}, "voir": ["2.6.9", "E2.6.2"]}, {"id": "E2.6.2", "kind": "exo", "num": "Ex. 2.6.2", "label": "Exercice 2.6.2 · niveau 3", "nom": "Existence d'un point-selle par compacité : la meilleure réponse, puis un segment", "enonce": "$U,P$ convexes compacts, $\\Lag(\\cdot,q)$ strictement convexe continue, $\\Lag(v,\\cdot)$ concave continue. Il existe un point-selle.", "chaine": [["but", "Construire $(u,p)$ avec $\\Lag(u,q)\\le\\Lag(u,p)\\le\\Lag(v,p)$. Je n'ai que de la compacité et de la convexité : pas de dérivées. Il faut **fabriquer un candidat** par des minimisations successives."], ["idee", "Meilleure réponse : pour chaque $q$, $\\Lag(\\cdot,q)$ a un unique minimiseur $v(q)$ (continue sur compact, strictement convexe). Fonction duale $\\mathcal G(q)=\\Lag(v(q),q)=\\min_v\\Lag(v,q)$ : inf de continues, donc s.c.s., donc atteint son max en $p$ sur le compact $P$. Candidat : $u=v(p)$. L'inégalité de **droite** est alors gratuite : $\\Lag(u,p)=\\mathcal G(p)\\le\\Lag(v,p)$."], ["question", "L'inégalité de gauche, $\\Lag(u,q)\\le\\Lag(u,p)$ ? Je ne sais rien de $\\Lag(u,\\cdot)$ sauf sa concavité, et $p$ maximise $\\mathcal G$, pas $\\Lag(u,\\cdot)$. Je **perturbe** $p$ vers $q$ le long du segment (R4, R11) : $q_t=(1-t)p+tq$, $v_t=v(q_t)$. Maximalité de $p$, puis concavité en $q$, puis définition de $\\mathcal G$ : $\\mathcal G(p)\\ge\\mathcal G(q_t)=\\Lag(v_t,q_t)\\ge(1-t)\\Lag(v_t,p)+t\\Lag(v_t,q)\\ge(1-t)\\mathcal G(p)+t\\Lag(v_t,q)$. Je simplifie et divise par $t$ : $\\Lag(v_t,q)\\le\\mathcal G(p)=\\Lag(u,p)$ $(\\ast)$."], ["pas", "Il reste à faire $t\\to0$ dans $(\\ast)$, ce qui demande $v_t\\to u$. Compacité : une sous-suite $v_{t_k}\\to\\bar v$ ; en passant à la limite dans $(1-t_k)\\Lag(v_{t_k},p)+t_k\\Lag(v_{t_k},q)\\le\\Lag(v,q_{t_k})$ (continuités, bornitude), $\\Lag(\\bar v,p)\\le\\Lag(v,p)$ pour tout $v$ : $\\bar v$ minimise $\\Lag(\\cdot,p)$, donc $\\bar v=u$ par **unicité**. Toute sous-suite tend vers $u$, donc $v_t\\to u$ (T10)."], ["pas", "$t\\to0$ dans $(\\ast)$ : $\\Lag(u,q)\\le\\Lag(u,p)$. Point-selle, et $\\min\\sup=\\max\\min=\\Lag(u,p)$ (§2.6.9)."], ["controle", "Sans concavité : Ex. 2.6.1. Sans compacité : $e^{-v}$ sur $[0,\\infty[$. Stricte convexité = commodité : sinon on régularise par $\\eps\\norm v^2$, on obtient $(u_\\eps,p_\\eps)$, on extrait, et $\\Lag(u,q)\\le\\Lag(v,p)$ pour tous $v,q$ — c'est von Neumann–Sion dans le cas compact."], ["bilan", "Sans dérivées : **construire le candidat par meilleure réponse et maximisation de la fonction duale**, obtenir une inégalité gratuite, et pour l'autre **perturber le long d'un segment** et passer à la limite grâce à l'unicité (T2, T10, R4, R11)."]], "livre": "Identique au corrigé. Noter que c'est la même architecture que la preuve du Théorème 2.6.9 (sens réciproque) : on y perturbe aussi le long d'un segment.", "reflexes": ["R4", "R11", "R8", "R5"], "liens": {"fiche": "2.6.9", "scene": "col", "guide": "exo-2-6-2"}, "voir": ["2.6.9", "E2.6.1"]}, {"id": "E2.6.3", "kind": "exo", "num": "Ex. 2.6.3", "label": "Exercice 2.6.3 · niveau 3", "nom": "Énergie complémentaire : intégrer par parties, compléter le carré, puis exhiber un couple sans saut", "enonce": "$G(\\tau)=\\frac12\\int\\tau^2$ sous $-\\tau'=f$, Lagrangien $\\Lag(\\tau,v)=\\frac12\\int\\tau^2+\\int v(\\tau'+f)$. La fonction duale est $-J(v)$ (Ex. 2.5.4) ; $(\\sigma,u)$ est un point-selle et $\\sigma=u'$.", "chaine": [["but", "Calculer $\\mathcal D(v)=\\inf_\\tau\\Lag(\\tau,v)$ et reconnaître $-J(v)$ ; puis montrer un point-selle **sans** théorème d'existence, en exhibant un couple admissible de même valeur (pas de saut ⇒ point-selle, §2.6.9)."], ["pas", "Fonction duale. Le terme $\\int v\\tau'$ mélange $\\tau'$ et $v$ : intégration par parties, $\\int v\\tau'=[v\\tau]_0^L-\\int v'\\tau$. Si $v(0)=v(L)=0$, le bord disparaît et $\\Lag=\\frac12\\int(\\tau-v')^2-\\frac12\\int v'^2+\\int fv$ (carré complété). L'inf en $\\tau$ du premier terme est $0$ (approcher $v'$ ; atteint en $\\tau=v'$) : $\\mathcal D(v)=-J(v)$. Si $v$ ne s'annule pas au bord, le terme de bord peut être rendu arbitrairement négatif : $\\mathcal D(v)=-\\infty$. Le dual est bien $\\sup_K(-J)$."], ["pas", "Fonction primale : $\\sup_v\\Lag(\\tau,v)=G(\\tau)$ si $\\tau'+f=0$, $+\\infty$ sinon ($v=sh$ avec $\\int h(\\tau'+f)>0$, $s\\to\\infty$) : le primal est (2.83)."], ["idee", "Pas de saut : il me faut un $\\tau$ admissible dont la valeur $G(\\tau)$ égale $-J(u)$. Candidat naturel : $\\tau=u'$. Admissible car $-u''=f$ (Euler de $J$ + du Bois-Reymond, Ex. 2.5.4), et $\\int fu=-\\int u''u=\\int u'^2$ donne $-J(u)=\\frac12\\int u'^2=G(u')$."], ["pas", "Dualité faible (T9) : $\\mathcal D(u)=G(u')\\ge G(\\sigma)=\\mathcal J(\\sigma)\\ge\\Lag(\\sigma,u)\\ge\\mathcal D(u)$ — tout est égalité : $\\min\\mathcal J=\\max\\mathcal D$, et §2.6.9 (réciproque) donne le point-selle $(\\sigma,u)$."], ["pas", "$\\sigma=u'$ : inégalité de droite avec $\\tau=u'$ : $\\frac12\\int(\\sigma-u')^2-J(u)=\\Lag(\\sigma,u)\\le\\Lag(u',u)=-J(u)$, donc $\\int(\\sigma-u')^2=0$."], ["bilan", "Deux gestes : **intégrer par parties pour faire passer la dérivée sur la variable duale, puis compléter le carré** (le prix : les conditions aux limites tombent sur $v$) ; et **prouver un point-selle en exhibant un couple admissible de même valeur** — la contrainte mécanique $\\sigma=\\mu u'$ est la loi de comportement (T9)."]], "livre": "Identique au corrigé ($\\mu=1$ ; pour $\\mu$ quelconque, $G=\\frac12\\int\\tau^2/\\mu$ et $\\sigma=\\mu u'$). La structure « énergie en déplacements / énergie complémentaire » est la dualité convexe sous sa forme physique la plus parlante.", "reflexes": ["R12", "R1", "R5"], "liens": {"fiche": "2.6.9", "scene": "col", "guide": "exo-2-6-3"}, "voir": ["2.6.9", "E2.5.4", "E2.5.12"]}, {"id": "E3.2.1", "kind": "exo", "num": "Ex. 3.2.1", "label": "Exercice 3.2.1 · niveau 1", "nom": "Pas optimal d'une quadratique : l'inverse d'un quotient de Rayleigh", "enonce": "Gradient à pas optimal sur $J=\\frac12Ax\\cdot x-b\\cdot x$, $A>0$ de valeurs propres $\\lambda_1\\le\\dots\\le\\lambda_N$. Montrer $1/\\lambda_N\\le\\mu^n\\le1/\\lambda_1$.", "chaine": [["but", "Encadrer un pas défini par une minimisation. Pour une quadratique, cette minimisation est **explicite** : $j(\\mu)=J(x^n-\\mu g^n)$ est un trinôme en $\\mu$."], ["pas", "$g^n=Ax^n-b\\ne0$. $j(\\mu)=J(x^n)-\\mu\\norm{g^n}^2+\\frac{\\mu^2}2Ag^n\\cdot g^n$ (symétrie de $A$), strictement convexe ; $j'(\\mu^n)=0$ donne $\\mu^n=\\norm{g^n}^2/(Ag^n\\cdot g^n)$. C'est (3.6) : $J'(x^{n+1})\\cdot g^n=0$."], ["idee", "$\\mu^n$ est l'inverse du quotient de Rayleigh $Ag\\cdot g/\\norm g^2$, coincé entre $\\lambda_1$ et $\\lambda_N$ (base orthonormée propre : $Ag\\cdot g=\\sum\\lambda_ig_i^2$). Je passe à l'inverse."], ["controle", "Bornes atteintes quand $g^n$ est un vecteur propre : alors $J'(x^{n+1})=g^n-\\mu^nAg^n=0$, convergence en une itération. L'Ex. 3.2.2 généralise avec $\\alpha,L$ à la place de $\\lambda_1,\\lambda_N$."], ["bilan", "Pour une quadratique, **écrire le trinôme le long de la direction** ; un rapport $\\norm g^2/Ag\\cdot g$ se borne toujours par le spectre (T14, R16)."]], "livre": "Identique.", "reflexes": ["R16", "R1"], "liens": {"fiche": "3.2.1", "scene": "pasoptimal", "guide": "exo-3-2-1"}, "voir": ["3.2.1", "E3.2.2"]}, {"id": "E3.2.2", "kind": "exo", "num": "Ex. 3.2.2", "label": "Exercice 3.2.2 · niveau 2", "nom": "Pas optimaux bornés : coincé entre deux paraboles", "enonce": "$J$ $\\alpha$-convexe, $J'$ $L$-lipschitzienne. Les pas optimaux vérifient $0<c\\le\\mu^n\\le C<\\infty$.", "chaine": [["but", "Plus de trinôme explicite, mais l'énoncé souffle l'outil : l'encadrement quadratique (Remarque 2.4.11), $\\frac\\alpha2\\norm{v-w}^2\\le J(v)-J(w)-\\ps{J'(w)}{v-w}\\le\\frac L2\\norm{v-w}^2$. Le long de la direction de descente, $j(\\mu)=J(u^n-\\mu g^n)$ est **coincée entre deux paraboles** de même tangente en $0$."], ["pas", "$w=u^n$, $v=u^n-\\mu g^n$ : $J(u^n)-\\mu\\norm{g^n}^2+\\frac{\\alpha\\mu^2}2\\norm{g^n}^2\\le j(\\mu)\\le J(u^n)-\\mu\\norm{g^n}^2+\\frac{L\\mu^2}2\\norm{g^n}^2$."], ["idee", "Le minimum de $j$ ne peut pas être n'importe où : $j(\\mu^n)\\le j(1/L)\\le$ (parabole du haut en $1/L$) $=J(u^n)-\\frac{\\norm{g^n}^2}{2L}$ ; et $j(\\mu^n)\\ge$ parabole du bas en $\\mu^n$. Donc $\\alpha(\\mu^n)^2-2\\mu^n+\\frac1L\\le0$ : $\\mu^n$ est entre les racines $c=\\frac{1-\\sqrt{1-\\alpha/L}}\\alpha\\ge\\frac1{2L}$ et $C=\\frac{1+\\sqrt{1-\\alpha/L}}\\alpha\\le\\frac2\\alpha$."], ["controle", "Plus fin avec (3.6) : $\\ps{J'(u^n)-J'(u^{n+1})}{u^n-u^{n+1}}=\\mu^n\\norm{g^n}^2$, encadré par $\\alpha$ et $L$ fois $(\\mu^n)^2\\norm{g^n}^2$ : $1/L\\le\\mu^n\\le1/\\alpha$, exactement l'Ex. 3.2.1. Et $C\\le2/\\alpha$ explose quand $\\alpha\\to0$ (Ex. 3.2.3)."], ["bilan", "Quand une quantité est définie par un minimum, **l'encadrer en comparant la valeur minimale à une valeur test** ($j(\\mu^n)\\le j(1/L)$) et en minorant par la parabole du bas (T13, R2)."]], "livre": "Identique au corrigé ; la variante par (3.6) est plus courte et plus précise — à préférer si l'on a le droit d'utiliser l'orthogonalité.", "reflexes": ["R2", "R12"], "liens": {"fiche": "3.2.1", "scene": "pasoptimal", "guide": "exo-3-2-2"}, "voir": ["E3.2.1", "E3.2.3", "2.4.10"]}, {"id": "E3.2.3", "kind": "exo", "num": "Ex. 3.2.3", "label": "Exercice 3.2.3 · niveau 3", "nom": "Fonction plate en 0 : le pas optimal explose comme ‖x‖^{−2(p−1)}", "enonce": "$J=\\frac1{2p}(Ax\\cdot x)^p$, $p\\ge2$, $A>0$. Strictement convexe, minimum en $0$, pas fortement convexe en $0$ ; si $\\norm{x^n}=\\eps^n\\to0$, les pas optimaux vérifient $\\mu^n=O((\\eps^n)^{-2(p-1)})$.", "chaine": [["but", "$J=\\varphi\\circ q$, $q=Ax\\cdot x$, $\\varphi(t)=t^p/2p$ convexe strictement croissante sur $\\R_+$. Convexité par composition (Ex. 2.3.1, version stricte) ; minimum en $0$ évident ; pas de forte convexité parce que la courbure s'annule en $0$. Le pas : comme $\\varphi$ est croissante, **minimiser $J$ sur une droite revient à minimiser $q$**, un trinôme."], ["pas", "Stricte convexité : $q$ strictement convexe (identité de l'Ex. 2.3.5), $\\varphi$ strictement croissante et convexe : $J(\\theta x+(1-\\theta)y)<\\varphi(\\theta q(x)+(1-\\theta)q(y))\\le\\theta J(x)+(1-\\theta)J(y)$. Pas $\\alpha$-convexe près de $0$ : (2.23) en $u=0$ donnerait $J(v)\\ge\\frac\\alpha2\\norm v^2$, or $J(v)\\le\\frac{(\\lambda_N\\norm v^2)^p}{2p}$, donc $\\alpha\\le C\\norm v^{2(p-1)}\\to0$."], ["pas", "Pas : $J'(x)=q(x)^{p-1}Ax=s_ny_n$ avec $s_n=q(x^n)^{p-1}$, $y_n=Ax^n$. Minimiser $q(x^n-\\mu g^n)$ : $\\mu^n=\\frac{Ax^n\\cdot g^n}{Ag^n\\cdot g^n}=\\frac1{s_n}\\frac{\\norm{y_n}^2}{Ay_n\\cdot y_n}$."], ["idee", "Deux facteurs : un quotient de Rayleigh inverse, entre $1/\\lambda_N$ et $1/\\lambda_1$ (Ex. 3.2.1), et $1/s_n$ avec $\\lambda_1^{p-1}(\\eps^n)^{2(p-1)}\\le s_n\\le\\lambda_N^{p-1}(\\eps^n)^{2(p-1)}$. Donc $\\lambda_N^{-p}(\\eps^n)^{-2(p-1)}\\le\\mu^n\\le\\lambda_1^{-p}(\\eps^n)^{-2(p-1)}$ : explosion à la vitesse exacte annoncée. Le gradient est minuscule ($\\sim\\norm x^{2p-1}$), le pas compense."], ["controle", "$x^{n+1}=x^n-t_nAx^n$ avec $t_n=\\mu^ns_n\\in[1/\\lambda_N,1/\\lambda_1]$ : ce sont exactement les itérées du pas optimal pour la quadratique $\\frac12Ax\\cdot x$, donc $x^n\\to0$ (§3.2.1) et l'hypothèse $\\eps^n\\to0$ est automatique. Ce n'est pas la méthode qui échoue, c'est le pas qui explose."], ["bilan", "**Composer par une fonction croissante ne change pas les minimiseurs sur une droite** : le pas optimal de $\\varphi\\circ q$ se calcule sur $q$. Et la borne $2/\\alpha$ de l'Ex. 3.2.2 dégénère exactement quand $J''=0$ au minimum (T2, T14, R15)."]], "livre": "Identique au corrigé, avec le complément qui identifie les itérées à celles de la quadratique — la remarque qui rend l'exercice limpide.", "reflexes": ["R15", "R16", "R3"], "liens": {"fiche": "3.2.1", "scene": "vitesses", "guide": "exo-3-2-3"}, "voir": ["E3.2.2", "E3.2.1", "E2.3.1"]}, {"id": "E3.2.4", "kind": "exo", "num": "Ex. 3.2.4", "label": "Exercice 3.2.4 · niveau 1", "nom": "De la distance au gradient et à la valeur : γⁿ puis γ²ⁿ", "enonce": "Sous les hypothèses de §3.2.6 : $\\norm{J'(u^n)}\\le C_0\\gamma^n$ et $0\\le J(u^n)-J(u)\\le C_0\\gamma^{2n}$.", "chaine": [["but", "Je pars de $\\norm{u^n-u}\\le\\gamma^n\\norm{u^0-u}$ (§3.2.6) et je veux transférer la vitesse au gradient puis à la valeur."], ["pas", "Gradient : (3.8) dit $J'(u^n)=(u^n-u^{n+1})/\\mu$, différence de deux itérées, chacune à distance $\\le\\gamma^n\\norm{u^0-u}$ de $u$ : $\\norm{J'(u^n)}\\le\\frac{1+\\gamma}\\mu\\norm{u^0-u}\\gamma^n$. (Ou directement : $\\norm{J'(u^n)}=\\norm{J'(u^n)-J'(u)}\\le L\\norm{u^n-u}$.)"], ["pas", "Valeur : convexité en $u^n$ évaluée en $u$, $J(u)\\ge J(u^n)+\\ps{J'(u^n)}{u-u^n}$, donc $0\\le J(u^n)-J(u)\\le\\ps{J'(u^n)}{u^n-u}\\le\\norm{J'(u^n)}\\norm{u^n-u}$ : **produit de deux $\\gamma^n$**, d'où $\\gamma^{2n}$."], ["controle", "L'erreur sur la valeur est quadratique en l'erreur sur le point **parce que $J'(u)=0$** : l'encadrement de la Remarque 2.4.11 en $u$ donne même $\\frac\\alpha2\\norm{u^n-u}^2\\le J(u^n)-J(u)\\le\\frac L2\\norm{u^n-u}^2$."], ["bilan", "Valeur $\\lesssim$ gradient × distance (convexité), et au minimum le gradient est nul : la valeur converge deux fois plus vite que le point (T13, R12)."]], "livre": "Identique.", "reflexes": ["R12", "R15"], "liens": {"fiche": "3.2.6", "scene": "pasfixe", "guide": "exo-3-2-4"}, "voir": ["3.2.6", "2.4.10"]}, {"id": "E3.2.5", "kind": "exo", "num": "Ex. 3.2.5", "label": "Exercice 3.2.5 · niveau 2", "nom": "Pas fixe sur une quadratique : tout se lit sur le spectre de Id − μA", "enonce": "$x^n-x^*=B(x^{n-1}-x^*)$ avec $B=\\Id-\\mu A$ ; convergence ssi $0<\\mu<2/\\lambda_N$ ; meilleur pas $2/(\\lambda_1+\\lambda_N)$, facteur $\\gamma_B=\\frac{1-\\lambda_1/\\lambda_N}{1+\\lambda_1/\\lambda_N}$ ; comparer à la Remarque 3.2.8.", "chaine": [["but", "Sur une quadratique, le gradient à pas fixe est une **itération linéaire sur l'erreur** : $x^n-x^*=(x^{n-1}-x^*)-\\mu A(x^{n-1}-x^*)$ puisque $b=Ax^*$. Tout est dans $B=\\Id-\\mu A$."], ["pas", "$B$ symétrique, valeurs propres $1-\\mu\\lambda_i$ dans la base de $A$ ; norme = rayon spectral $\\rho=\\max(|1-\\mu\\lambda_1|,|1-\\mu\\lambda_N|)$ ($t\\mapsto|1-\\mu t|$ convexe, max aux extrémités). Donc $\\norm{x^n-x^*}\\le\\rho^n\\norm{x^0-x^*}$."], ["pas", "Ssi : si $\\rho\\ge1$, un départ $x^*+e_i$ avec $|1-\\mu\\lambda_i|\\ge1$ ne converge pas. Convergence pour tout $x^0$ ⟺ $|1-\\mu\\lambda_i|<1$ pour tout $i$ ⟺ $0<\\mu<2/\\lambda_N$."], ["idee", "Meilleur pas : $\\rho\\ge\\max(1-\\mu\\lambda_1,\\mu\\lambda_N-1)$, l'une décroît, l'autre croît ; minimum à leur croisement $\\mu_B=2/(\\lambda_1+\\lambda_N)$, valeur $\\gamma_B=\\frac{\\lambda_N-\\lambda_1}{\\lambda_N+\\lambda_1}$. Optimal au sens fort : un vecteur propre de $B$ réalise l'égalité."], ["controle", "Comparaison : $\\alpha=\\lambda_1$, $L=\\lambda_N$ (meilleures constantes). Remarque 3.2.8 : $\\mu=\\alpha/L^2$, $\\gamma=\\sqrt{1-\\alpha^2/L^2}$. Avec $r=\\lambda_1/\\lambda_N$ : $\\gamma_B/\\gamma=\\sqrt{(1-r)/(1+r)^3}<1$. Mal conditionné : $\\gamma_B\\approx1-2r$ ($\\kappa/2$ itérations par facteur $e$) contre $\\gamma\\approx1-r^2/2$ ($2\\kappa^2$). Et $\\mu_B,\\gamma_B$ sont exactement $\\mu_{opt},\\gamma_{opt}$ de §3.3.1 : l'estimation y est atteinte, l'intervalle $]0,2/L[$ ne peut être élargi."], ["bilan", "**Linéariser l'itération et lire le spectre** : vitesse = rayon spectral, meilleur pas = égaliser les deux valeurs extrêmes ; la vitesse du gradient est dictée par le conditionnement $\\kappa$ (T14, R16)."]], "livre": "Identique au corrigé (T14, T7). Le rapport $\\gamma_B/\\gamma$ dit pourquoi la preuve générale de 3.2.6 est pessimiste d'un facteur $\\kappa$.", "reflexes": ["R16", "R15", "R10"], "liens": {"fiche": "3.3.1", "scene": "pasfixe", "guide": "exo-3-2-5"}, "voir": ["3.3.1", "3.2.6", "E2.4.3"]}, {"id": "E3.2.6", "kind": "exo", "num": "Ex. 3.2.6", "label": "Exercice 3.2.6 · niveau 1", "nom": "Sans convexité : le lemme de descente suffit pour J′(uⁿ) → 0", "enonce": "$J$ différentiable, infinie à l'infini, $J'$ $L$-lipschitzienne, pas de convexité. Pour $0<\\mu<2/L$ : $J(u^n)$ décroît et $J'(u^n)\\to0$.", "chaine": [["but", "Refaire la Proposition §3.2.9 en retirant la convexité (R14). Dans sa preuve, la convexité ne sert qu'à **identifier la limite** ; la descente vient du Lemme 3.2.10, qui n'utilise que Lipschitz."], ["pas", "Lemme 3.2.10 avec $v=u^n$, $v^*=u^{n+1}$ : $J(u^n)-J(u^{n+1})\\ge c\\norm{J'(u^n)}^2$, $c=\\mu(1-\\frac{L\\mu}2)>0$. Décroissance."], ["pas", "Minoration : dans $\\R^N$, $J$ continue infinie à l'infini a un minimum $m$ (§2.2.1). (Dans un Hilbert : $u^n$ reste dans $\\{J\\le J(u^0)\\}$, borné, où $J$ est bornée par la majoration quadratique.)"], ["pas", "Télescopage : $c\\sum_{k\\le n}\\norm{J'(u^k)}^2\\le J(u^0)-m$, série convergente, terme général $\\to0$."], ["controle", "Toute valeur d'adhérence est un point critique, **pas forcément un minimum** (Ex. 3.2.7). Vitesse : $\\min_{k\\le n}\\norm{J'(u^k)}^2\\le\\frac{J(u^0)-m}{c(n+1)}$."], ["bilan", "Retirer une hypothèse = repérer où elle sert ; ici la convexité ne servait qu'à la fin, et sans elle il reste la **stationnarité** (T8, T13, R14)."]], "livre": "Identique.", "reflexes": ["R14", "R7"], "liens": {"fiche": "3.2.9", "scene": "sandwich", "guide": "exo-3-2-6"}, "voir": ["3.2.9", "E3.2.7"]}, {"id": "E3.2.7", "kind": "exo", "num": "Ex. 3.2.7", "label": "Exercice 3.2.7 · niveau 2", "nom": "Convergence vers un col : un axe invariant", "enonce": "$J=\\frac12x_1^2+\\frac14x_2^4-\\frac12x_2^2$. Points critiques $O,P,Q$ ; $P,Q$ minima, $O$ col ; depuis $(1,0)$ toute méthode de gradient converge vers $O$.", "chaine": [["but", "Un exemple où la conclusion de l'Ex. 3.2.6 (point critique) ne peut pas être améliorée. Je commence par comprendre la fonction : $J=\\frac12x_1^2+\\frac14(x_2^2-1)^2-\\frac14$ (compléter le carré)."], ["pas", "Non convexe : $J(0,0)=0>-\\frac14=$ moyenne de $J(0,\\pm1)$. Gradient $(x_1,x_2(x_2^2-1))$ : points critiques $O,P,Q$. $P,Q$ minima globaux (valeur $-\\frac14$, la forme complétée) ; en $O$, Hessienne $\\diag(1,-1)$, pas positive : col ($J(t,0)>0$, $J(0,t)<0$)."], ["idee", "Pourquoi $O$ depuis $(1,0)$ ? Sur l'axe $x_2=0$, le gradient est $(x_1,0)$ : **horizontal**. Aucun pas de gradient, quel que soit $\\mu^n$, ne peut quitter l'axe : par récurrence $x^n=(a_n,0)$, $a_{n+1}=(1-\\mu^n)a_n$. L'axe est invariant, et son seul point critique est $O$."], ["pas", "Si la règle de pas assure la convergence vers un point critique (par ex. $\\mu^n\\ge\\mu_{\\min}>0$ ⇒ $\\nabla J(x^n)=(x^n-x^{n+1})/\\mu^n\\to0$), la limite est sur l'axe fermé, critique, donc $=O$. Pas fixe : $a_n=(1-\\mu)^n$, converge ssi $0<\\mu<2$ ; pas optimal : $\\mu^0=1$, $x^1=O$ en un coup."], ["controle", "Instable : depuis $(1,\\delta)$, $|x_2^n|$ est multiplié par $\\approx1+\\mu>1$ et les itérées filent vers $Q$ ou $P$. Et sans hypothèse sur les pas ($\\mu^n=2^{-n-2}$), la limite n'est même pas critique."], ["bilan", "Pour piéger un algorithme, **chercher un sous-ensemble invariant** (ici un axe de symétrie) et regarder ce qu'il contient. Sans convexité, la théorie ne promet qu'un point critique, et cet exemple montre que c'est optimal (R10, R3)."]], "livre": "Identique au corrigé. Le complément sur l'instabilité est important : en pratique les erreurs d'arrondi sauvent le gradient, mais aucun théorème ne le garantit.", "reflexes": ["R10", "R3", "R1"], "liens": {"fiche": "3.2.9", "scene": "local", "guide": "exo-3-2-7"}, "voir": ["3.2.9", "E3.2.6"]}, {"id": "E3.3.1", "kind": "exo", "num": "Ex. 3.3.1", "label": "Exercice 3.3.1 · niveau 2", "nom": "Nesterov converge : une borne uniforme remplace la monotonie", "enonce": "Sous les hypothèses de §3.3.7, $V=\\R^N$, $J$ strictement convexe infinie à l'infini. (1) $u^n$ bornée ; (2) toute sous-suite convergente tend vers un zéro de $J'$ ; (3) $u^n\\to u$.", "chaine": [["but", "Passer de la convergence des **valeurs** ($J(u^n)-J(u)\\le\\kappa/(n+2)^2$) à celle des **itérées**. Nesterov n'est pas une méthode de descente, donc pas d'ensemble de sous-niveau stable ; mais l'estimation donne une borne uniforme, ce qui suffit."], ["pas", "(1) $J(u^n)\\le J(u)+\\kappa/4$ ; infinie à l'infini ⇒ bornée (une sous-suite partant à l'infini aurait $J\\to\\infty$)."], ["pas", "(2) $u^{n_k}\\to\\bar u$ : $J(\\bar u)=\\lim J(u^{n_k})=J(u)$ (continuité + estimation), minimum global, donc $J'(\\bar u)=0$ (Euler, §2.5.1)."], ["pas", "(3) Toute valeur d'adhérence minimise $J$, donc vaut $u$ par stricte convexité. Suite bornée avec une seule valeur d'adhérence ⇒ convergence (sinon une sous-suite resterait à distance $\\ge\\eta$ et aurait une valeur d'adhérence $\\ne u$) (T10)."], ["controle", "$v^n\\to u$ aussi, car le coefficient d'extrapolation est dans $[0,1[$ et $u^n-u^{n-1}\\to0$. La stricte convexité ne sert qu'à l'unicité de la limite."], ["bilan", "**Suite bornée + unique valeur d'adhérence ⇒ convergence** : le pont standard entre valeurs et itérées en dimension finie, qui marche même sans monotonie (T1, T10, R8)."]], "livre": "Identique.", "reflexes": ["R8", "R1"], "liens": {"fiche": "3.3.7", "scene": "acceleres", "guide": "exo-3-3-1"}, "voir": ["3.3.7", "3.2.9"]}, {"id": "E3.3.2", "kind": "exo", "num": "Ex. 3.3.2", "label": "Exercice 3.3.2 · niveau 3", "nom": "Gradient conjugué : trois orthogonalités par récurrence, chacune réglée par un paramètre", "enonce": "Récurrence (3.35). Montrer $r_n=Ax_n-b$, $Ap_n\\cdot p_j=0$ pour $j<n$, et Fletcher–Reeves = Polak–Ribière.", "chaine": [["but", "Prouver que les $p_n$ sont $A$-conjugués. Si je tente $Ap_{n+1}\\cdot p_j=0$ directement, je tombe sur des produits $r_{n+1}\\cdot r_j$ et $r_{n+1}\\cdot p_j$ que je ne contrôle pas : il faut **renforcer l'hypothèse de récurrence** pour qu'elle contienne ce dont la preuve a besoin (R12)."], ["acquis", "$r_n=Ax_n-b$ par récurrence immédiate ($Ax_{n+1}-b=r_n-\\mu_nAp_n=r_{n+1}$). Et deux paramètres libres, $\\mu_n$ et $\\beta_n$, dont je dois voir ce qu'ils annulent."], ["idee", "Hypothèse $(H_n)$ : pour $j<n$, (i) $r_n\\cdot p_j=0$, (ii) $r_n\\cdot r_j=0$, (iii) $Ap_n\\cdot p_j=0$. Conséquence : $r_n\\cdot p_n=\\norm{r_n}^2$, donc $\\mu_n=\\frac{r_n\\cdot p_n}{Ap_n\\cdot p_n}$ est le **pas optimal** sur la direction $p_n$."], ["pas", "(i) au rang $n+1$ : $r_{n+1}\\cdot p_j=r_n\\cdot p_j-\\mu_nAp_n\\cdot p_j$ ; nul pour $j<n$ par $(H_n)$, et pour $j=n$ c'est $\\norm{r_n}^2-\\mu_nAp_n\\cdot p_n=0$ : **le choix de $\\mu_n$**. (ii) : $r_j\\in\\Vect(p_j,p_{j-1})$, donc (ii) découle de (i)."], ["pas", "(iii) : $Ap_{n+1}\\cdot p_j=p_{n+1}\\cdot Ap_j$ avec $Ap_j=(r_j-r_{j+1})/\\mu_j$ : $=\\frac1{\\mu_j}r_{n+1}\\cdot(r_j-r_{j+1})+\\beta_nAp_n\\cdot p_j$. Pour $j<n$ : (ii) et $(H_n)$. Pour $j=n$ : $-\\frac{\\norm{r_{n+1}}^2}{\\mu_n}+\\beta_n\\frac{\\norm{r_n}^2}{\\mu_n}=0$ : **le choix de $\\beta_n$**."], ["pas", "FR = PR : $\\beta^{PR}_n=\\frac{r_{n+1}\\cdot(r_{n+1}-r_n)}{\\norm{r_n}^2}=\\frac{\\norm{r_{n+1}}^2}{\\norm{r_n}^2}$ puisque $r_{n+1}\\cdot r_n=0$."], ["controle", "Les résidus non nuls sont orthogonaux deux à deux dans $\\R^N$ : au plus $N$, donc $r_n=0$ pour un $n\\le N$ — solution exacte en $N$ itérations."], ["bilan", "Dans une récurrence à plusieurs paramètres, **chaque paramètre est choisi pour annuler exactement un terme** ; et quand l'induction ne passe pas, **renforcer l'hypothèse** avec les orthogonalités intermédiaires (R5, R12)."]], "livre": "Identique au corrigé (T4 pas optimal). Le GC est souvent présenté comme un miracle : ici on voit que $\\mu_n$ et $\\beta_n$ sont les deux seuls degrés de liberté, et qu'ils sont consommés par (i) et (iii).", "reflexes": ["R5", "R12", "R1"], "liens": {"fiche": "3.3.17", "scene": "acceleres", "guide": "exo-3-3-2"}, "voir": ["3.3.17", "3.2.1"]}, {"id": "E3.3.3", "kind": "exo", "num": "Ex. 3.3.3", "label": "Exercice 3.3.3 · niveau 1", "nom": "Sous-différentiel de |x| en 0 : les pentes qui restent sous le graphe", "enonce": "$J=|x|$ sur $\\R$. Calculer $\\partial J(0)$.", "chaine": [["but", "Définition (3.36) : $p\\in\\partial J(0)$ ssi $|y|\\ge py$ pour tout $y$ — la droite de pente $p$ par l'origine reste sous le graphe."], ["pas", "$y>0$ : $p\\le1$. $y<0$ : division par un négatif renverse, $p\\ge-1$. Réciproque : $|p|\\le1\\Rightarrow py\\le|y|$. Donc $\\partial J(0)=[-1,1]$."], ["controle", "$=[J_g'(0),J_d'(0)]$. Par le Lemme §3.3.21, $|x|=\\max(x,-x)$, deux fonctions actives en $0$ : sous-gradients $\\pm1$, et $\\partial J(0)$ est leur enveloppe convexe. $0\\in\\partial J(0)$ : $0$ est le minimum (Lemme 3.3.20)."], ["bilan", "En $10^{-6}$ comme en $10^6$ le sous-gradient est de norme $1$ : **sa norme ne mesure pas la distance à l'optimum** — d'où la normalisation et les pas $\\rho_k\\to0$ de l'algorithme du sous-gradient (§3.3.23) (R3)."]], "livre": "Identique.", "reflexes": ["R1", "R3"], "liens": {"fiche": "3.3.19", "scene": "sousdiff", "guide": "exo-3-3-3"}, "voir": ["3.3.21", "3.3.23", "E2.5.6"]}, {"id": "E3.3.4", "kind": "exo", "num": "Ex. 3.3.4", "label": "Exercice 3.3.4 · niveau 1", "nom": "Prox de l'indicatrice = projection", "enonce": "$I_K=0$ sur $K$, $+\\infty$ ailleurs. $I_K$ est convexe et $\\prox_{I_K}=P_K$.", "chaine": [["but", "Convexité : l'épigraphe est $\\R_+\\times K$, produit de convexes. (Ou : si $u,v\\in K$, le segment reste dans $K$ et (2.7) est une égalité $0=0$ ; sinon le membre de droite est $+\\infty$.)"], ["pas", "Prox : $\\argmin_y\\frac1{2\\tau}\\norm{y-x}^2+I_K(y)$ ; le coût est infini hors de $K$, donc on minimise $\\norm{y-x}$ sur $K$ : c'est $P_K(x)$, unique par §2.3.8 ($1$-convexe sur un convexe fermé). Et $\\tau I_K=I_K$, donc $\\prox_{\\tau I_K}=P_K$ pour tout $\\tau$."], ["controle", "L'inéquation d'Euler de ce problème est (8.1). L'algorithme proximal sur $I_K$ seul est trivial ($x^1=P_K(x^0)$) ; combiné à un pas de gradient, il redonne le gradient projeté (Ex. 3.3.6)."], ["bilan", "**Ajouter $I_K$ = imposer la contrainte** ; le prox généralise la projection (R1)."]], "livre": "Identique.", "reflexes": ["R1"], "liens": {"fiche": "3.3.32", "scene": "projete", "guide": "exo-3-3-4"}, "voir": ["E3.3.6", "E2.5.1", "3.3.32"]}, {"id": "E3.3.5", "kind": "exo", "num": "Ex. 3.3.5", "label": "Exercice 3.3.5 · niveau 3", "nom": "Moreau–Yosida : tout sort de l'optimalité du prox, puis le théorème de l'enveloppe", "enonce": "$J_\\tau(x)=\\min_y\\frac1{2\\tau}\\norm{x-y}^2+J(y)$. $J_\\tau$ convexe, différentiable, $\\min J=\\min J_\\tau$, et $\\prox_{\\tau J}(x^k)=x^{k+1}\\iff x^{k+1}=x^k-\\tau J_\\tau'(x^k)$.", "chaine": [["but", "$J_\\tau$ est une **valeur minimale** : sa dérivée devrait être la dérivée partielle en $x$ de $\\Phi_x(y)=\\frac1{2\\tau}\\norm{x-y}^2+J(y)$ au point optimal $p(x)=\\prox_{\\tau J}(x)$, soit $(x-p(x))/\\tau$ (théorème de l'enveloppe, T15). Tout le travail est de le justifier sans dériver $p$, qui n'est pas différentiable en général."], ["acquis", "$\\Phi_x$ est $\\frac1\\tau$-convexe continue : unique minimiseur $p(x)$ (§2.3.8). La seule information sur $p=p(x)$ : son optimalité. Je la rends exploitable par le segment $p+t(y-p)$ et la convexité de $J$ (Ex. 2.5.6) : $J(y)\\ge J(p)+\\frac1\\tau\\ps{x-p}{y-p}$ pour tout $y$, i.e. $\\frac{x-p}\\tau\\in\\partial J(p)$."], ["pas", "Prox 1-lipschitzien, en **croisant** (R12) : l'inégalité pour $(x_1,y=p_2)$ et pour $(x_2,y=p_1)$, additionnées : $\\norm{p_1-p_2}^2\\le\\ps{x_1-x_2}{p_1-p_2}\\le\\norm{x_1-x_2}\\norm{p_1-p_2}$. Pas différentiable (le seuillage ne l'est pas en $\\pm\\tau$), mais lipschitzien suffit."], ["idee", "Différentiabilité par **encadrement avec deux candidats** : $\\Phi_{x+h}(y)-\\Phi_x(y)=\\frac1\\tau\\ps{x-y}h+\\frac{\\norm h^2}{2\\tau}$. Candidat $p$ dans $J_\\tau(x+h)$ : $J_\\tau(x+h)-J_\\tau(x)\\le\\frac1\\tau\\ps{x-p}h+\\frac{\\norm h^2}{2\\tau}$ ; candidat $p_h=p(x+h)$ dans $J_\\tau(x)$ : $\\ge\\frac1\\tau\\ps{x-p_h}h+\\frac{\\norm h^2}{2\\tau}$. L'écart entre les deux bornes est $\\frac1\\tau\\ps{p-p_h}h$, de taille $\\le\\norm h^2/\\tau$ par Lipschitz. Donc $|J_\\tau(x+h)-J_\\tau(x)-\\frac1\\tau\\ps{x-p}h|\\le\\frac{\\norm h^2}{2\\tau}$ : $J_\\tau'(x)=(x-p(x))/\\tau$."], ["pas", "Convexité : $\\ps{J_\\tau'(x_1)-J_\\tau'(x_2)}{x_1-x_2}=\\frac1\\tau(\\norm{x_1-x_2}^2-\\ps{p_1-p_2}{x_1-x_2})\\ge0$ (étape 1 + Cauchy–Schwarz) : gradient monotone (§2.4.4)."], ["pas", "Mêmes minima : $J_\\tau\\le J$ (candidat $y=x$) et $J_\\tau(x)\\ge J(p(x))\\ge\\inf J$ : $\\inf J_\\tau=\\inf J$. Minimiseur de $J$ ⇒ de $J_\\tau$ ; réciproquement $J_\\tau'(\\bar x)=0$ ⇒ $\\bar x=p(\\bar x)$ ⇒ $J(\\bar x)=J_\\tau(\\bar x)=\\inf J$. Les minimiseurs sont les **points fixes du prox**. Et $x-\\tau J_\\tau'(x)=p(x)$ : une itération proximale = un pas de gradient de pas $\\tau$ sur $J_\\tau$."], ["controle", "En développant le carré dans l'étape 1 : $J_\\tau'$ est $\\frac1\\tau$-lipschitzien, donc $\\tau=1/L$ est toujours un pas admissible : convergence sans condition sur $\\tau$ (Remarque 3.3.33)."], ["bilan", "**Tout tirer de l'optimalité du prox** (inclusion dans le sous-différentiel), croiser pour Lipschitz, **encadrer une valeur minimale avec deux candidats** pour sa dérivée : c'est la preuve type du théorème de l'enveloppe quand le minimiseur n'est pas dérivable (T3, T4, T15, R12)."]], "livre": "Identique au corrigé. L'énoncé suggère « prox différentiable » : le corrigé montre que c'est faux en général et que lipschitzien suffit — un bon exemple de lecture critique d'une indication.", "reflexes": ["R12", "R5", "R10"], "liens": {"fiche": "3.3.32", "scene": "sousdiff", "guide": "exo-3-3-5"}, "voir": ["3.3.32", "E2.5.6", "2.5.12"]}, {"id": "E3.3.6", "kind": "exo", "num": "Ex. 3.3.6", "label": "Exercice 3.3.6 · niveau 1", "nom": "Explicite-implicite avec I_K = gradient projeté", "enonce": "$J_1$ fortement convexe différentiable, $J_2=I_K$. L'algorithme (3.53) est le gradient projeté.", "chaine": [["but", "Un pas explicite sur $J_1$, un pas implicite (prox) sur $J_2$. Avec $J_2=I_K$, le prox est $P_K$ (Ex. 3.3.4)."], ["pas", "$\\min(J_1+I_K)=\\min_KJ_1$ : problème (3.55). $\\prox_{\\tau I_K}=P_K$ ($\\tau I_K=I_K$). Donc $x^{k+1}=P_K(x^k-\\tau J_1'(x^k))$ : (3.59) avec $\\mu=\\tau$."], ["controle", "Faisable dès $k\\ge1$ ; convergence par §3.4.1 si $J_1'$ est $L$-lipschitzienne et $0<\\tau<2\\alpha/L^2$ ; les points fixes sont les solutions de l'inéquation d'Euler (3.56), par (8.1)."], ["bilan", "Prox = projection généralisée ; explicite-implicite = gradient projeté généralisé, la contrainte remplacée par un terme non différentiable (R1)."]], "livre": "Identique.", "reflexes": ["R1"], "liens": {"fiche": "3.4.1", "scene": "projete", "guide": "exo-3-3-6"}, "voir": ["3.4.1", "E3.3.4", "3.3.32"]}, {"id": "E3.3.7", "kind": "exo", "num": "Ex. 3.3.7", "label": "Exercice 3.3.7 · niveau 1", "nom": "Prox d'une quadratique : un système linéaire, et un pas implicite sans condition", "enonce": "$J=\\frac12Ax\\cdot x-b\\cdot x$, $A>0$. Déterminer $\\prox_J$.", "chaine": [["but", "Minimiser $\\Psi(y)=\\frac1{2\\tau}\\norm{y-x}^2+J(y)$ : quadratique de Hessienne $\\frac1\\tau\\Id+A>0$, unique minimum au zéro du gradient."], ["pas", "$\\frac{y-x}\\tau+Ay-b=0$ ⟺ $(\\Id+\\tau A)y=x+\\tau b$ ; $\\Id+\\tau A$ inversible (valeurs propres $1+\\tau\\lambda_i\\ge1$) : $\\prox_{\\tau J}(x)=(\\Id+\\tau A)^{-1}(x+\\tau b)$, et $\\prox_J=(\\Id+A)^{-1}(x+b)$. C'est le pas de gradient **implicite** $y=x-\\tau J'(y)$."], ["controle", "Algorithme proximal : $x^*=A^{-1}b$ point fixe, $x^{k+1}-x^*=(\\Id+\\tau A)^{-1}(x^k-x^*)$, facteur $(1+\\tau\\lambda_1)^{-1}<1$ **pour tout $\\tau$** — contre $\\tau<2/\\lambda_N$ pour l'explicite (Ex. 3.2.5). Cohérent avec le Lemme §3.3.32. Mais un prox coûte un système linéaire de matrice $\\Id+\\tau A$, aussi dur que $Ax=b$ : le proximal n'a d'intérêt que si le prox est explicite ($\\norm\\cdot_1$, $I_K$…)."], ["bilan", "Implicite = $(\\Id+\\tau A)^{-1}$ (contracte toujours), explicite = $\\Id-\\tau A$ (contracte si $\\tau<2/\\lambda_N$) : la signature des schémas implicites (T14)."]], "livre": "Identique.", "reflexes": ["R16", "R1", "R15"], "liens": {"fiche": "3.3.32", "scene": "pasfixe", "guide": "exo-3-3-7"}, "voir": ["3.3.32", "E3.2.5"]}, {"id": "E3.4.1", "kind": "exo", "num": "Ex. 3.4.1", "label": "Exercice 3.4.1 · niveau 1", "nom": "Projeter sur l'hyperplan Σxᵢ = 1 : la correction le long de la normale est le multiplicateur", "enonce": "$K=\\{\\sum x_i=1\\}$. Expliciter $P_K$ et interpréter (3.58) en termes de multiplicateur.", "chaine": [["but", "Un hyperplan affine de normale $e=(1,\\dots,1)$, direction $H=e^\\perp$. Sur un sous-espace, (8.1) avec $\\pm z$ devient une égalité : $x-P_K(x)\\perp H$, donc colinéaire à $e$."], ["pas", "$P_K(x)=x-te$ avec $e\\cdot(x-te)=1$ : $t=(e\\cdot x-1)/N$. Donc $(P_Kx)_i=x_i-\\frac1N(\\sum_jx_j-1)$ — la formule du cours $x+B^*(BB^*)^{-1}(c-Bx)$ avec $B=e^T$, $BB^*=N$."], ["idee", "(3.58) en $u\\in K$ : $P_K(u-\\mu J'(u))=u-\\mu J'(u)+\\frac\\mu N(e\\cdot J'(u))e$ ; égal à $u$ ssi $J'(u)+\\lambda e=0$ avec $\\lambda=-\\frac1N\\sum_i\\partial_iJ(u)$. C'est **Lagrange** pour $F=\\sum x_i-1$, $F'=e$ : à l'optimum toutes les dérivées partielles sont égales, et $\\lambda$ est l'opposé de leur moyenne."], ["controle", "Gradient projeté : $u^{n+1}=u^n-\\mu(J'(u^n)-m_ne)$, $m_n=\\frac1Ne\\cdot J'(u^n)$ : descente le long du gradient projeté sur $H$ ($\\Id-\\frac1Nee^T$ est le projecteur sur $H$), et $-m_n\\to\\lambda$."], ["bilan", "Sur un sous-espace affine, **la projection calcule le multiplicateur** : la correction retranchée le long de la normale vaut $\\mu\\lambda e$ au point fixe (T6, R13)."]], "livre": "Identique.", "reflexes": ["R13", "R1"], "liens": {"fiche": "3.4.1", "scene": "projete", "guide": "exo-3-4-1"}, "voir": ["3.4.1", "E2.5.7"]}, {"id": "E3.4.2", "kind": "exo", "num": "Ex. 3.4.2", "label": "Exercice 3.4.2 · niveau 2", "nom": "Uzawa sur une quadratique : gradient projeté sur une fonction duale fortement concave", "enonce": "$\\min\\{\\frac12Av\\cdot v-b\\cdot v:Bv\\le c\\}$. Appliquer Uzawa ; si $B$ est de rang $M$, $p^n\\to p$.", "chaine": [["but", "§3.4.3 ne dit rien de $p^n$. Ici tout est explicite : je peux calculer l'itération sur $p^n$ et espérer une **contraction**, ce qui manquait dans le cas général."], ["pas", "Minimisation en $v$ : $Av-b+B^*p^n=0$, $u^n=A^{-1}(b-B^*p^n)$. Alors $Bu^n-c=d-Cp^n$ avec $C=BA^{-1}B^*$, $d=BA^{-1}b-c$ : $p^{n+1}=P_{\\R^M_+}(p^n+\\mu(d-Cp^n))$. Et $d-Cq=\\nabla G(q)$ pour la fonction duale $G(q)=-\\frac12Cq\\cdot q+d\\cdot q-$cste : **gradient projeté montant sur le dual**."], ["idee", "Si $B$ est de rang $M$, $C$ est définie positive ($Cq\\cdot q=A^{-1}(B^*q)\\cdot(B^*q)$, $B^*$ injective) : le dual est **fortement** concave, et un gradient projeté sur une fonction fortement concave contracte. Valeurs propres $0<\\gamma_1\\le\\gamma_M\\le L^2/\\alpha$."], ["pas", "Le point-selle vérifie $p=P(p+\\mu F(u))$ et $F(u)=d-Cp$ ; je soustrais et j'utilise (8.2) : $\\norm{p^{n+1}-p}\\le\\norm{(\\Id-\\mu C)(p^n-p)}\\le\\rho\\norm{p^n-p}$, $\\rho=\\max(|1-\\mu\\gamma_1|,|1-\\mu\\gamma_M|)<1$ pour $0<\\mu<2/\\gamma_M$, en particulier pour $\\mu<2\\alpha/L^2$. Convergence géométrique de $p^n$, et $u^n-u=-A^{-1}B^*(p^n-p)$ suit."], ["controle", "Meilleur pas $2/(\\gamma_1+\\gamma_M)$, facteur $(\\gamma_M-\\gamma_1)/(\\gamma_M+\\gamma_1)$ : le **conditionnement de la matrice duale** gouverne Uzawa (comme $A$ gouverne le gradient, Ex. 3.2.5). Rang $<M$ : $\\gamma_1=0$, facteur $1$, plus de contraction, et $p$ n'est plus unique."], ["bilan", "Uzawa = gradient projeté sur le dual ; quand le dual est fortement concave (rang plein), **la même analyse spectrale que l'Ex. 3.2.5** donne la vitesse (T7, T14, R16)."]], "livre": "Identique au corrigé. C'est l'exercice qui donne du sens au seuil $2\\alpha/L^2$ de §3.4.3 : $\\gamma_M\\le L^2/\\alpha$ est la constante de Lipschitz du gradient dual.", "reflexes": ["R16", "R9", "R15"], "liens": {"fiche": "3.4.3", "scene": "uzawa", "guide": "exo-3-4-2"}, "voir": ["3.4.3", "E3.2.5", "E2.5.17"]}, {"id": "E3.4.3", "kind": "exo", "num": "Ex. 3.4.3", "label": "Exercice 3.4.3 · niveau 3", "nom": "Pénalisation : les multiplicateurs approchés sont bornés, puis l'unicité conclut", "enonce": "Sous les hypothèses de §3.4.6, $J,F_i\\in C^1$, contraintes qualifiées et $(F_i'(u))_{i\\in I(u)}$ libres. Alors $\\frac2\\eps\\max(F_i(u_\\eps),0)\\to\\lambda_i$.", "chaine": [["but", "Les quantités $\\lambda_i^\\eps=\\frac2\\eps\\max(F_i(u_\\eps),0)$ apparaissent dans l'équation d'Euler de $J_\\eps$ : $g(t)=\\max(t,0)^2$ est $C^1$ de dérivée $2\\max(t,0)$, donc $J'(u_\\eps)+\\sum\\lambda_i^\\eps F_i'(u_\\eps)=0$ avec $\\lambda_i^\\eps\\ge0$. C'est **KKT avec des multiplicateurs approchés**. Plan : bornés ⇒ extraire ⇒ identifier ⇒ unicité (T10)."], ["pas", "Inactives : $u_\\eps\\to u$ (§3.4.6) et $F_i(u)<0$ ⇒ $F_i(u_\\eps)<0$ pour $\\eps$ petit ⇒ $\\lambda_i^\\eps=0=\\lambda_i$."], ["question", "Les $\\lambda^\\eps$ sont-ils bornés ? Si $s_k=\\sum_{I(u)}\\lambda_i^{\\eps_k}\\to\\infty$, je **normalise** : $\\theta^k=\\lambda^{\\eps_k}/s_k$ sur le simplexe compact, j'extrais $\\theta^k\\to\\theta\\ne0$, et l'équation d'Euler divisée par $s_k$ donne à la limite $\\sum_{I(u)}\\theta_iF_i'(u)=0$ : contredit l'indépendance. Donc bornés."], ["pas", "Identification : $\\lambda^{\\eps_k}\\to\\bar\\lambda$ ; limite dans Euler : $J'(u)+\\sum\\bar\\lambda_iF_i'(u)=0$, $\\bar\\lambda\\ge0$, nul hors de $I(u)$. **Unicité des multiplicateurs** ⇒ $\\bar\\lambda=\\lambda$. Toute valeur d'adhérence vaut $\\lambda$ et la famille est bornée : convergence."], ["controle", "L'étape 3 redémontre l'existence des multiplicateurs ; l'indépendance implique la qualification. Lecture : $\\max(F_i(u_\\eps),0)\\approx\\eps\\lambda_i/2$, violation d'ordre $\\eps$ sur les contraintes actives, et la pénalisation fournit gratuitement les multiplicateurs — c'est (3.87) avec $\\lambda^n=0$, $\\mu=2/\\eps$."], ["bilan", "Technique type pour un problème approché : **écrire sa condition d'optimalité, borner les multiplicateurs approchés par normalisation et indépendance, passer à la limite, conclure par unicité** (T6, T10, R8)."]], "livre": "Identique au corrigé. L'argument de normalisation (diviser par la somme et extraire sur le simplexe) est le geste à retenir : il sert chaque fois qu'il faut prouver qu'une famille de multiplicateurs reste bornée.", "reflexes": ["R8", "R13", "R12"], "liens": {"fiche": "3.4.6", "scene": "penal", "guide": "exo-3-4-3"}, "voir": ["3.4.6", "2.5.17", "3.4.8"]}, {"id": "E3.4.4", "kind": "exo", "num": "Ex. 3.4.4", "label": "Exercice 3.4.4 · niveau 1", "nom": "Barrière : −1/t est convexe croissante sur ]−∞,0[", "enonce": "$J,F_i$ convexes. $v\\mapsto J(v)-\\eps\\sum1/F_i(v)$ est convexe sur $\\{F<0\\}$.", "chaine": [["but", "Somme de $J$ et de $\\varphi\\circ F_i$ avec $\\varphi(t)=-1/t$ : l'Ex. 2.3.1 dit « convexe croissante ∘ convexe = convexe », à condition que le domaine soit convexe et que $\\varphi$ soit croissante et convexe sur l'intervalle des valeurs."], ["pas", "Domaine $D=\\{F_i<0\\}$ convexe (corde de $F_i$ strictement négative). Sur $]-\\infty,0[$ : $\\varphi'=1/t^2>0$, $\\varphi''=-2/t^3>0$. Composition : $\\varphi(F_i(w))\\le\\varphi(\\theta F_i(u)+(1-\\theta)F_i(v))\\le\\theta\\varphi(F_i(u))+(1-\\theta)\\varphi(F_i(v))$. Somme avec $\\eps>0$ : convexe ; strictement si $J$ l'est."], ["controle", "La barrière tend vers $+\\infty$ au bord de $D$ : les itérées restent intérieures (Remarque 3.4.7). Même argument pour la barrière logarithmique $-\\ln(-t)$ ($\\varphi'=-1/t>0$, $\\varphi''=1/t^2>0$)."], ["bilan", "Réflexe de l'Ex. 2.3.1, à réutiliser tel quel : vérifier **domaine convexe, $\\varphi$ croissante et convexe** (R1)."]], "livre": "Identique.", "reflexes": ["R1"], "liens": {"fiche": "3.4.6", "scene": "penal", "guide": "exo-3-4-4"}, "voir": ["E2.3.1", "3.4.6"]}], "reflexes": {"R1": {"nom": "Traduire en formules, avec les quantificateurs", "txt": "Avant de chercher quoi que ce soit, j'écris **ce que je veux** et **ce que j'ai** sous forme d'inégalités ou d'égalités, avec leurs quantificateurs (« pour tout $v\\in K$ », « il existe $\\lambda\\ge0$ »). Un mot comme « minimum », « convexe », « lipschitzien » ne sert à rien tant qu'il n'est pas une formule. Souvent, le simple fait d'écrire la conclusion montre quel objet il faut fabriquer (une suite, un multiplicateur, une direction) et quelle inégalité il faut produire."}, "R2": {"nom": "Mesurer le fossé et nommer ce qui manque", "txt": "Je mets côte à côte l'inégalité que j'ai et celle que je veux, et je regarde **ce qui diffère** : un terme en trop, un terme qui manque, une inégalité dans le mauvais sens, une quantité que je ne contrôle pas. Ce terme reçoit un nom (le reste $R$, le terme croisé, la courbure du chemin $u''(0)$…). La preuve consiste presque toujours à éliminer ou à contrôler précisément ce terme-là, et rien d'autre."}, "R3": {"nom": "Le cas minuscule", "txt": "Je teste l'énoncé sur le cas le plus simple possible : dimension 1, une fonction quadratique $\\frac12 x^2$ ou $\\frac12\\langle Ax,x\\rangle$, deux points, une seule contrainte affine. Là, tout se calcule : je vois **si** c'est vrai, **quelle constante** apparaît ($4/\\alpha$, $2/L$, $(\\kappa-1)/(\\kappa+1)$), et quelle inégalité est une égalité. La preuve générale ne fait ensuite que remplacer le calcul exact par une inégalité."}, "R4": {"nom": "Une variable à la fois : la coupe le long d'un segment", "txt": "Dans un espace de dimension quelconque, je ne sais rien faire ; sur une droite, je sais tout (dériver, intégrer, Taylor). Je pose donc $\\varphi(t)=J(u+t(v-u))$ ou $J(u+tw)$ et je raisonne sur cette fonction d'une variable réelle : $\\varphi'(t)=\\ps{J'(u+t(v-u))}{v-u}$, $\\varphi''(t)=J''(\\cdot)(w,w)$. C'est le geste commun à T4, T5 et T12 : toutes les inégalités de convexité, tous les développements de Taylor du cours sont des énoncés sur $\\varphi$."}, "R5": {"nom": "Un paramètre libre est une arme : le faire tendre, ou l'optimiser", "txt": "Quand une inégalité vraie « pour tout $\\theta$ » (ou $h$, $\\mu$, $\\eps$, $\\delta$, $t$) contient ce paramètre, je ne la laisse pas telle quelle : je fais $\\theta\\to0$ (ça fabrique une dérivée), je prends $\\theta=\\tfrac12$ (ça donne une constante propre), ou je choisis la valeur qui rend le membre de droite le plus petit (le pas $\\mu=1/L$ au fond de la parabole, $\\mu=2/(L+\\alpha)$ qui égalise deux facteurs). Un paramètre qu'on n'a pas utilisé est une inégalité qu'on n'a pas finie."}, "R6": {"nom": "Chercher la quantité qui décroît", "txt": "Pour prouver qu'une suite converge vers un point que je ne connais pas, je cherche une quantité positive $E_n$ qui **décroît** le long des itérations : la distance au but $\\norm{u^n-u}^2$, la valeur $J(u^n)-J(u)$, une distance sur le dual $\\norm{p^n-p}^2$, un potentiel mêlant les deux. Puis je quantifie la décroissance : $E_{n+1}\\le E_n-c\\,(\\text{quelque chose})$. Si $E_{n+1}\\le\\gamma E_n$, c'est une contraction (T7) ; sinon je somme (R7). Quand la quantité naturelle ne décroît pas (sous-gradient, Uzawa, Nesterov), c'est qu'il faut en choisir une autre."}, "R7": {"nom": "Sommer les pas : le télescopage", "txt": "Une inégalité valable à chaque pas, $c\\,a_n\\le E_n-E_{n+1}$, se somme : $c\\sum a_n\\le E_0-E_{N+1}\\le E_0$. Donc $\\sum a_n<\\infty$, donc $a_n\\to0$ — sans jamais connaître la limite de $E_n$. Beaucoup de preuves de convergence ne sont que cela : trouver la bonne inégalité à un pas, puis sommer (T8)."}, "R8": {"nom": "Bornée ⇒ extraire ; puis vérifier que la limite a tout ce qu'il faut", "txt": "Si je ne sais pas faire converger toute une suite, je me contente d'une sous-suite (Bolzano–Weierstrass en dimension finie, extraction faible en Hilbert). Il reste deux vérifications : la limite est bien dans l'ensemble admissible (fermeture), et elle satisfait la propriété voulue (continuité, semi-continuité, ou « point critique »). Si l'unicité est connue, toutes les sous-suites ont la même limite et la suite entière converge (T10)."}, "R9": {"nom": "Lire l'itération comme une application, la solution comme son point fixe", "txt": "Un algorithme $u^{n+1}=T(u^n)$ converge si $T$ contracte ; et la solution est caractérisée par $u=T(u)$. Je commence donc par réécrire la condition d'optimalité sous forme de point fixe ($u=u-\\mu J'(u)$, $u=P_K(u-\\mu J'(u))$, $p=P_{\\R_+^M}(p+\\mu F(u))$), ce qui me dit à la fois quel algorithme écrire et quelle quantité contrôler : $\\norm{T(v)-T(u)}$."}, "R10": {"nom": "Pourquoi pas plus ? Chercher le contre-exemple de l'énoncé plus fort", "txt": "Une inéquation là où j'attendais une équation, un « il existe une sous-suite » au lieu d'une convergence, un $\\liminf$ au lieu d'une limite : je me demande pourquoi l'énoncé n'est pas plus fort, et je cherche le contre-exemple ($[a,b]$ et la dérivée au bord ; $e^x$ sans minimum ; $x^3$ en 0). Ce contre-exemple me dit exactement quelle étape de la preuve est fragile, et donc comment elle doit être écrite."}, "R11": {"nom": "Je n'ai qu'une information : perturber", "txt": "« $u$ est un minimum » ne donne qu'une chose : $J(v)\\ge J(u)$ pour les $v$ autorisés. La seule façon d'en tirer une formule est de choisir $v=u+h\\,w$ avec $h$ petit et $w$ une direction **admissible**, puis de développer et de faire $h\\to0$. Toutes les conditions d'optimalité (Euler, Lagrange, KKT, ordre 2) sortent de ce geste ; la seule difficulté est de décrire les directions admissibles."}, "R12": {"nom": "La même quantité, écrite de deux façons", "txt": "Développer $\\norm{a-b}^2$ en $\\norm a^2-2\\ps ab+\\norm b^2$ ; écrire une inégalité en $(u,v)$ puis en $(v,u)$ et additionner ; écrire la valeur optimale comme $\\Lag(u,\\mu)$ « pour tout $\\mu$ » puis choisir $\\mu$. À chaque fois, un terme encombrant disparaît ou change de camp. Quand je suis bloqué par un terme que je ne contrôle pas, je cherche une seconde écriture de la même quantité dans laquelle il s'annule."}, "R13": {"nom": "Changer de côté : des directions aux multiplicateurs", "txt": "« $\\ps{p}{w}\\ge0$ pour toutes les directions $w$ d'un cône » est une infinité de conditions ; « $p=-\\sum\\lambda_ia_i$ avec $\\lambda_i\\ge0$ » en est un nombre fini. Passer de l'une à l'autre, c'est la dualité : orthogonal d'un sous-espace (égalités, $\\lambda$ libres), lemme de Farkas (inégalités, $\\lambda\\ge0$), séparation d'un convexe. Dès qu'une condition porte sur « tous les $w$ », je cherche la version avec multiplicateurs (T6)."}, "R14": {"nom": "Retirer une hypothèse pour voir quelle étape casse", "txt": "Pour comprendre une preuve, et surtout pour la retrouver, je repère **où chaque hypothèse sert** : fermé → la limite reste dans $K$ ; continue → on passe à la limite dans $J$ ; infinie à l'infini → la suite est bornée ; $\\alpha$ → le terme croisé ; $L$ → le terme carré. Si une hypothèse ne sert nulle part, j'ai oublié une étape ; si une étape ne consomme aucune hypothèse, elle est probablement fausse."}, "R15": {"nom": "Les constantes racontent la preuve", "txt": "$4/\\alpha$ vient de $\\theta=\\tfrac12$ dans $\\theta(1-\\theta)/2$ ; $2\\alpha/L^2$ vient de $1-2\\alpha\\mu+\\mu^2L^2<1$ ; $1/L$ est le sommet d'une parabole ; $2/(L+\\alpha)$ égalise $|1-\\mu\\alpha|$ et $|1-\\mu L|$ ; $\\sqrt{\\kappa}$ apparaît quand deux racines complexes ont pour module $\\sqrt\\nu$. Lire la constante d'un énoncé, c'est deviner l'inégalité et le paramètre qui l'ont produite — et donc la moitié de la preuve."}, "R16": {"nom": "Près de la solution, linéariser et lire les valeurs propres", "txt": "Pour une vitesse précise ou une convergence locale, je remplace l'itération par sa linéarisation $e^{n+1}\\approx Be^n$ autour de la solution ; la vitesse est le rayon spectral de $B$, et chaque direction propre se traite comme une suite réelle. C'est ainsi qu'on trouve le meilleur pas, le réglage de la boule pesante, la constante de Newton (T14)."}, "R17": {"nom": "Partir de la dimension 1 et transporter l'argument", "txt": "Sur un intervalle $[a,b]$, tout est visible : au bord gauche, un minimum n'impose que $J'(a)\\ge0$ ; à l'intérieur, $J'=0$ ; la convexité est « graphe sous la corde ». Je comprends d'abord l'énoncé là, puis je demande ce qui joue le rôle de « à droite de $a$ » en dimension quelconque : les directions admissibles. L'énoncé général est presque toujours la version 1D, écrite le long de ces directions."}}, "groups": [{"titre": "2.1 – 2.2 · Infimum, suites minimisantes, existence en dimension finie", "ids": ["2.1.3", "2.2.1"]}, {"titre": "2.3 · Convexité et existence en dimension infinie", "ids": ["2.3.4", "2.3.5", "2.3.7", "2.3.8", "2.3.9"]}, {"titre": "2.4 · Dérivée, convexité par la dérivée, encadrements", "ids": ["2.4.4", "2.4.8", "2.4.10"]}, {"titre": "2.5 · Conditions d'optimalité", "ids": ["2.5.1", "2.5.3", "2.5.5", "2.5.6", "2.5.10", "2.5.12", "2.5.13", "2.5.17", "2.5.19", "2.5.21", "2.5.24"]}, {"titre": "2.6 · Point-selle, Kuhn–Tucker, dualité", "ids": ["2.6.2", "2.6.4", "2.6.6", "2.6.9", "2.6.12"]}, {"titre": "3.2 · Gradient sans contrainte", "ids": ["3.2.1", "3.2.6", "3.2.9", "3.3.1", "3.3.3"]}, {"titre": "3.3 · Accélération, sous-gradient, stochastique, proximal", "ids": ["3.3.7", "3.3.10", "3.3.15", "3.3.17", "3.3.21", "3.3.23", "3.3.28", "3.3.32"]}, {"titre": "3.4 · Contraintes : projection, Uzawa, pénalisation, Lagrangien augmenté", "ids": ["3.4.1", "3.4.3", "3.4.4", "3.4.6", "3.4.8"]}, {"titre": "3.5 – 3.7 · Newton, approximations successives, adjoint", "ids": ["3.5.1", "NL", "3.6.1", "3.7.6"]}, {"titre": "Exercices du chapitre 2", "ids": ["E2.2.1", "E2.2.2", "E2.2.3", "E2.2.4", "E2.3.1", "E2.3.2", "E2.3.3", "E2.3.4", "E2.3.5", "E2.3.6", "E2.4.1", "E2.4.2", "E2.4.3", "E2.4.4", "E2.4.5", "E2.4.6", "E2.4.7", "E2.4.8", "E2.5.1", "E2.5.2", "E2.5.3", "E2.5.4", "E2.5.5", "E2.5.6", "E2.5.7", "E2.5.8", "E2.5.9", "E2.5.10", "E2.5.11", "E2.5.12", "E2.5.13", "E2.5.14", "E2.5.15", "E2.5.16", "E2.5.17", "E2.5.18", "E2.6.1", "E2.6.2", "E2.6.3"]}, {"titre": "Exercices du chapitre 3", "ids": ["E3.2.1", "E3.2.2", "E3.2.3", "E3.2.4", "E3.2.5", "E3.2.6", "E3.2.7", "E3.3.1", "E3.3.2", "E3.3.3", "E3.3.4", "E3.3.5", "E3.3.6", "E3.3.7", "E3.4.1", "E3.4.2", "E3.4.3", "E3.4.4"]}], "methode": "<div class=\"intro\"><p>Devant une démonstration déjà écrite, on se dit « jamais je n'aurais trouvé ». C'est normal : une preuve publiée est le <b>résultat nettoyé<\/b> d'une recherche qui a tâtonné, et le tâtonnement a disparu. Ce fichier remet le tâtonnement. Pour chaque théorème et chaque exercice, je raconte à la première personne comment on peut y penser <i>sans connaître la preuve<\/i> : ce que je veux, ce que j'ai, ce qui manque, ce que j'essaie, ce qui coince, et l'idée qui débloque. Puis je déroule la preuve dans cet ordre-là, qui est celui de la découverte, avant de relire la preuve du livre pour voir pourquoi elle est écrite comme elle est, et quelle technique elle vaut la peine d'emporter.<\/p>\n<p>Les sept questions ci-dessous sont celles que je me pose <b>dans cet ordre<\/b>, pour n'importe quel énoncé. La plupart des chaînes de ce fichier ne font que les parcourir.<\/p><\/div>\n\n<div class=\"q\"><div class=\"n\">1<\/div><div><b>Qu'est-ce que je veux, exactement ?<\/b> J'écris la conclusion comme une formule avec ses quantificateurs. Elle me dit quel objet je dois fabriquer : un point $u$, une suite, un $\\lambda\\ge0$, une inégalité pour tout $v$. (Réflexe R1.)<\/div><\/div>\n<div class=\"q\"><div class=\"n\">2<\/div><div><b>Qu'est-ce que j'ai, exactement ?<\/b> Chaque hypothèse devient aussi une formule. Puis je mets les deux listes côte à côte et je mesure le fossé : quel terme manque, quel terme est en trop, quelle quantité je ne contrôle pas. (R2, R14.)<\/div><\/div>\n<div class=\"q\"><div class=\"n\">3<\/div><div><b>Est-ce vrai, et avec quelle constante, dans le cas minuscule ?<\/b> Dimension 1, une quadratique, deux points. Je calcule tout. Si la constante de l'énoncé apparaît, je sais quelle inégalité la produit. (R3, R15, R17.)<\/div><\/div>\n<div class=\"q\"><div class=\"n\">4<\/div><div><b>Quel est le seul geste possible ?<\/b> Si l'information est « $u$ est un minimum », le seul geste est de perturber $u$ dans une direction admissible et de faire tendre le pas vers 0 (R11, R4). Si c'est « l'algorithme itère », le seul geste est de chercher une quantité qui décroît et de sommer (R6, R7), ou de reconnaître un point fixe et une contraction (R9). Si c'est « pour toutes les directions d'un cône », le geste est de passer aux multiplicateurs (R13). Il y a rarement plus de deux gestes possibles.<\/div><\/div>\n<div class=\"q\"><div class=\"n\">5<\/div><div><b>Qu'est-ce qui coince ?<\/b> J'essaie le geste et je regarde précisément le terme qui résiste. Je lui donne un nom. Puis je cherche une seconde écriture de la même quantité dans laquelle il disparaît (R12), ou un paramètre libre à ajuster (R5).<\/div><\/div>\n<div class=\"q\"><div class=\"n\">6<\/div><div><b>Où chaque hypothèse a-t-elle servi ?<\/b> Une fois la preuve trouvée, je vérifie que chaque hypothèse a été consommée, et à quelle ligne. C'est ainsi que je saurai, plus tard, reconnaître dans un énoncé nouveau quelle preuve s'applique. (R14.)<\/div><\/div>\n<div class=\"q\"><div class=\"n\">7<\/div><div><b>Pourquoi pas plus ?<\/b> Je cherche le contre-exemple qui empêche de conclure davantage (équation au lieu d'inéquation, suite entière au lieu de sous-suite). Il m'explique la forme exacte de l'énoncé, et c'est lui que je retiendrai. (R10.)<\/div><\/div>\n\n<div class=\"intro\" style=\"margin-top:14px\"><p><b>Deux preuves quand il le faut.<\/b> Pour certains résultats, la preuve la plus naturelle n'est pas la plus courte. Je donne alors d'abord la preuve <i>que l'on trouve<\/i> (parfois plus longue, mais dont chaque pas est motivé), puis « la preuve du livre » : plus compacte, elle emploie une technique (T1–T15 du guide) qui resservira ailleurs, et je dis où.<\/p>\n<p><b>Comment lire.<\/b> La barre de gauche liste les résultats puis les exercices, dans l'ordre du cours ; <span class=\"kbd\">←<\/span> <span class=\"kbd\">→<\/span> passent de l'un à l'autre ; « marquer lu » se souvient de ta progression dans ce navigateur. Les liens en tête de chaque entrée ouvrent la section du guide, la fiche de mémorisation et, quand elle existe, la scène 3D correspondante (fichiers à garder dans le même dossier).<\/p><\/div>"};</script>
<script>window.XREF={"res:2.1.1": "<b>Définition 2.1.1<\/b> <p>$u$ est un minimum (ou point de minimum) <strong>local<\/strong> de $J$ sur $K$ si et seulement si $u\\in K$ et $\\exists\\,\\delta\\gt0,\\ \\forall v\\in K,\\ \\norm{v-u}\\lt\\delta\\Rightarrow J(v)\\ge J(u)$. Il est <strong>global<\/strong> si $u\\in K$ et $J(v)\\ge J(u)$ pour tout $v\\in K$.<\/p>", "res:2.1.2": "<b>Définition 2.1.2<\/b> <p>L'<strong>infimum<\/strong> de $J$ sur $K$ est la borne supérieure dans $\\R$ des constantes qui minorent $J$ sur <span class=\"nw\">$K$ ;<\/span> il vaut $-\\infty$ si $J$ n'est pas minorée, $+\\infty$ si $K$ est vide. Une <strong>suite minimisante<\/strong> est une suite $(u^n)$ avec $u^n\\in K$ et $\\lim J(u^n)=\\inf_{v\\in K}J(v)$.<\/p>", "res:2.1.3": "<b>Lemme 2.1.3<\/b> <p>Pour tout problème d'optimisation, si $K$ est non vide, il existe au moins une suite minimisante.<\/p>", "res:2.2.1": "<b>Théorème 2.2.1<\/b> (Existence d'un minimum en dimension finie) <p>Soit $K$ un ensemble fermé non vide de $\\R^N$, et $J$ une fonction continue sur $K$ à valeurs dans $\\R$ vérifiant la propriété, dite « infinie à l'infini »,<\/p>\n$$\\forall (u^n)_{n\\ge0}\\ \\text{suite dans}\\ K,\\quad \\lim_{n\\to+\\infty}\\norm{u^n}=+\\infty\\ \\Longrightarrow\\ \\lim_{n\\to+\\infty}J(u^n)=+\\infty. \\tag{2.2}$$\n<p>Alors il existe au moins un point de minimum de $J$ sur $K$. De plus, on peut extraire de toute suite minimisante de $J$ sur $K$ une sous-suite convergeant vers un point de minimum sur $K$.<\/p>", "exm:2.3.1": "<b>Exemple 2.3.1<\/b> <p>Dans $\\ell^2(\\R)=\\{x=(x_i)_{i\\ge1},\\ \\sum x_i^2\\lt+\\infty\\}$, soit $J(x)=\\big(\\norm{x}^2-1\\big)^2+\\sum_{i\\ge1}\\frac{x_i^2}{i}$. Alors $\\inf J=0$ mais aucun $x$ ne réalise $J(x)=0$.<\/p>", "exm:2.3.2": "<b>Exemple 2.3.2<\/b> <p>$V$ = fonctions continues, dérivables par morceaux sur $(0,1)$, avec $\\ps{u}{v}=\\int_0^1(u'v'+uv)\\,dx$. Pour $0\\lt h\\le1$, $J_h(v)=\\int_0^1\\big((|v'(x)|-h)^2+v(x)^2\\big)dx$. $J_h$ est continue
