 pour tout $i\\in I(u)$, ou bien $\\ps{F_i'(u)}{\\bar w}<0$, ou bien $\\ps{F_i'(u)}{\\bar w}=0$ et $F_i$ est affine.", "eq:2.46": "<b>(2.46)<\/b> Conditions KKT (Th. 2.5.17) : $J'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0$, $\\lambda_i\\ge0$, et $\\lambda_i=0$ si $F_i(u)<0$ (contrainte inactive).", "eq:2.47": "<b>(2.47)<\/b> Cône linéarisé : $\\tilde K(u)=\\{w\\in V:\\ \\ps{F_i'(u)}w\\le0\\ \\ \\forall i\\in I(u)\\}$.", "eq:2.48": "<b>(2.48)<\/b> Preuve de KKT, cas $i\\in I(u)$ avec $\\ps{F_i'(u)}{\\bar w}<0$ : $F_i(u+\\eps(w+\\delta\\bar w))=\\eps\\ps{F_i'(u)}{w+\\delta\\bar w}+o(\\eps)\\le\\eps\\delta\\ps{F_i'(u)}{\\bar w}+o(\\eps)<0$ pour $\\eps$ petit.", "eq:2.49": "<b>(2.49)<\/b> Preuve de KKT, cas $i\\in I(u)$ avec $F_i$ affine et $\\ps{F_i'(u)}{\\bar w}=0$ : $F_i(u+\\eps(w+\\delta\\bar w))=\\eps\\ps{F_i'(u)}w\\le0$.", "eq:2.50": "<b>(2.50)<\/b> Preuve du lemme de Farkas : si la famille $(a_i)$ est liée, le cône $\\hat{\\mathsf K}=\\{-\\sum_i\\lambda_ia_i,\\ \\lambda_i\\ge0\\}$ est une réunion finie de cônes à $M-1$ générateurs (fermés par récurrence).", "eq:2.51": "<b>(2.51)<\/b> Preuve du lemme de Farkas : si $p\\notin\\hat{\\mathsf K}$ (convexe fermé), on sépare : il existe $w\\ne0$ et $\\alpha$ avec $\\ps pw<\\alpha<\\ps qw$ pour tout $q\\in\\hat{\\mathsf K}$.", "eq:2.52": "<b>(2.52)<\/b> Lemme 2.5.21 : $\\inf_{F(v)\\le0}J(v)=\\inf_{v\\in V}\\ \\sup_{\\mu\\in(\\R^+)^M}\\Lag(v,\\mu)$, $\\Lag(v,\\mu)=J(v)+\\mu\\cdot F(v)$.", "eq:2.53": "<b>(2.53)<\/b> Contraintes mélangées : $K=\\{v\\in V,\\ G(v)=0,\\ F(v)\\le0\\}$, $G:V\\to\\R^N$ (égalités), $F:V\\to\\R^M$ (inégalités).", "eq:2.54": "<b>(2.54)<\/b> Qualification mixte (Déf. 2.5.23) : les $G_i'(u)$ sont libres et il existe $\\bar w\\in\\bigcap_i[G_i'(u)]^\\perp$ avec $\\ps{F_i'(u)}{\\bar w}<0$ pour tout $i\\in I(u)$.", "eq:2.55": "<b>(2.55)<\/b> KKT mixte (Th. 2.5.24) : $J'(u)+\\sum_i\\mu_iG_i'(u)+\\sum_i\\lambda_iF_i'(u)=0$, $\\lambda\\ge0$, $F(u)\\le0$, $\\lambda\\cdot F(u)=0$ ($\\mu\\in\\R^N$ libre).", "eq:2.56": "<b>(2.56)<\/b> Rem. 2.5.25 : si les gradients actifs $(F_i'(u))_{i\\in I(u)}$ forment une famille libre, les contraintes sont qualifiées en $u$.", "eq:2.57": "<b>(2.57)<\/b> Rem. 2.5.26 (cas mixte) : si $(G_i'(u))_{i}\\cup(F_i'(u))_{i\\in I(u)}$ est une famille libre, les contraintes (2.53) sont qualifiées en $u$.", "eq:2.58": "<b>(2.58)<\/b> Rem. 2.5.27 (Slater) : si les $F_i$ sont convexes et s'il existe $v$ avec, pour tout $i$, $F_i(v)<0$ ou ($F_i(v)=0$ et $F_i$ affine), les contraintes sont qualifiées en tout point de $K$.", "eq:2.59": "<b>(2.59)<\/b> Point-selle (Déf. 2.6.1) : $(u,p)\\in U\\times P$ avec $\\Lag(u,q)\\le\\Lag(u,p)\\le\\Lag(v,p)$ pour tout $q\\in P$ et tout $v\\in U$.", "eq:2.60": "<b>(2.60)<\/b> Prop. 2.6.2 : si $(u,p)$ est un point-selle de $\\Lag=J+q\\cdot F$, alors $u\\in K$ est un minimum global de $J$ sur $K$, et si tout est dérivable, $J'(u)+\\sum_ip_iF_i'(u)=0$.", "eq:2.61": "<b>(2.61)<\/b> Le point-selle du Lagrangien $J+q\\cdot F$ écrit explicitement : $J(u)+q\\cdot F(u)\\le J(u)+p\\cdot F(u)\\le J(v)+p\\cdot F(v)$ pour tous $q\\in P$, $v\\in U$.", "eq:2.62": "<b>(2.62)<\/b> Cadre de Kuhn–Tucker : $K=\\{F_i(v)\\le0\\}$ avec $J,F_1,\\dots,F_M$ convexes continues sur $V$ et dérivables sur $K$.", "eq:2.63": "<b>(2.63)<\/b> Conditions de Kuhn–Tucker (Th. 2.6.4) : $F(u)\\le0$, $p\\ge0$, $p\\cdot F(u)=0$, $J'(u)+\\sum_ip_iF_i'(u)=0$ — nécessaires et suffisantes dans le cas convexe qualifié, équivalentes à « $(u,p)$ point-selle ».", "eq:2.64": "<b>(2.64)<\/b> Valeur optimale, cas des inégalités (Lemme 2.6.6) : $J_{\\min}(\\ell)=\\inf_{F(v)\\le\\ell}J(v)$.", "eq:2.66": "<b>(2.66)<\/b> Dans la preuve du Lemme 2.6.6 : $J_{\\min}(\\ell)+\\lambda\\cdot\\ell-J_{\\min}(0)\\ge0$ — la droite de pente $-\\lambda$ reste sous la valeur optimale, d'où $\\nabla J_{\\min}(0)=-\\lambda$.", "eq:2.67": "<b>(2.67)<\/b> Déf. 2.6.7 : un Lagrangien $\\Lag$ défini sur $U\\times P$ et possédant un point-selle $(u,p)$.", "eq:2.68": "<b>(2.68)<\/b> Fonctions primal eq:3.50": "<b>(3.50)<\/b> Pas de gradient implicite : $x^{k+1}=x^k-\\tau J_2'(x^{k+1})$ (la dérivée est prise au point d'arrivée).", "eq:3.51": "<b>(3.51)<\/b> Le problème proximal : $\\min_x\\ \\frac1{2\\tau}\\norm{x-x^k}^2+J_2(x)$ — fortement convexe, donc à solution unique si $J_2$ est convexe.", "eq:3.52": "<b>(3.52)<\/b> Son minimiseur est l'opérateur proximal : $x^{k+1}=\\prox_{\\tau J_2}(x^k)$.", "eq:3.53": "<b>(3.53)<\/b> Algorithme explicite-implicite : $x^{k+1/2}=x^k-\\tau J_1'(x^k)$ (gradient sur $J_1$), puis $x^{k+1}=\\prox_{\\tau J_2}(x^{k+1/2})$ (prox sur $J_2$).", "eq:3.54": "<b>(3.54)<\/b> Inégalité clé du Lemme 3.3.32 ((2.23) pour la fonction $\\frac1\\tau$-convexe $x\\mapsto J(x)+\\frac1{2\\tau}\\norm{x-x^k}^2$ en son minimum $x^{k+1}$) : $J(x)+\\frac1{2\\tau}\\norm{x-x^k}^2\\ge J(x^{k+1})+\\frac1{2\\tau}\\norm{x^{k+1}-x^k}^2+\\frac1{2\\tau}\\norm{x-x^{k+1}}^2$.", "eq:3.55": "<b>(3.55)<\/b> Le problème avec contraintes : $\\inf_{v\\in K}J(v)$, $J$ α-convexe différentiable, $K$ fermé non vide.", "eq:3.56": "<b>(3.56)<\/b> Inéquation d'Euler sur $K$ convexe fermé : $\\ps{J'(u)}{v-u}\\ge0$ pour tout $v\\in K$.", "eq:3.57": "<b>(3.57)<\/b> Réécriture de (3.56) : $\\ps{u-(u-\\mu J'(u))}{v-u}\\ge0$ pour tout $v\\in K$ — c'est la caractérisation (8.1) de $u$ comme projection de $u-\\mu J'(u)$.", "eq:3.58": "<b>(3.58)<\/b> Point fixe : $u=P_K\\big(u-\\mu J'(u)\\big)$ pour tout $\\mu>0$.", "eq:3.59": "<b>(3.59)<\/b> Gradient projeté : $u^{n+1}=P_K\\big(u^n-\\mu J'(u^n)\\big)$.", "eq:3.61": "<b>(3.61)<\/b> Projection sur un pavé $\\prod_i[a_i,b_i]$ : $(P_Kx)_i=\\min(\\max(a_i,x_i),b_i)$, coordonnée par coordonnée.", "eq:3.62": "<b>(3.62)<\/b> Problème d'Uzawa : $\\inf_{F(v)\\le0}J(v)$, $J$ convexe, $F:V\\to\\R^M$ convexe.", "eq:3.63": "<b>(3.63)<\/b> Son Lagrangien : $\\Lag(v,q)=J(v)+q\\cdot F(v)$ sur $V\\times(\\R^+)^M$.", "eq:3.65": "<b>(3.65)<\/b> Point fixe du multiplicateur : $p=P_{\\R^M_+}\\big(p+\\mu F(u)\\big)$ pour tout $\\mu>0$ (l'inégalité de gauche du point-selle relue avec (8.1)).", "eq:3.66": "<b>(3.66)<\/b> Algorithme d'Uzawa : $p^0\\in(\\R^+)^M$ ; $u^n$ minimise $\\Lag(\\cdot,p^n)$ sur $V$ ; $p^{n+1}=P_{\\R^M_+}\\big(p^n+\\mu F(u^n)\\big)$.", "eq:3.67": "<b>(3.67)<\/b> $F$ lipschitzienne : $\\norm{F(v)-F(w)}\\le L\\norm{v-w}$.", "eq:3.68": "<b>(3.68)<\/b> Inéquation d'Euler de $u$ (Ex. 2.5.6) : $\\ps{J'(u)}{v-u}+p\\cdot\\big(F(v)-F(u)\\big)\\ge0$ pour tout $v$.", "eq:3.69": "<b>(3.69)<\/b> Inéquation d'Euler de $u^n$ (Ex. 2.5.6) : $\\ps{J'(u^n)}{v-u^n}+p^n\\cdot\\big(F(v)-F(u^n)\\big)\\ge0$ pour tout $v$.", "eq:3.70": "<b>(3.70)<\/b> Euler croisées + forte monotonie : $r^n\\cdot\\big(F(u^n)-F(u)\\big)\\le-\\alpha\\norm{u^n-u}^2$, avec $r^n=p^n-p$.", "eq:3.71": "<b>(3.71)<\/b> Décroissance de l'énergie d'Uzawa : $\\beta\\norm{u^n-u}^2\\le\\norm{r^n}^2-\\norm{r^{n+1}}^2$ avec $\\beta=2\\mu\\alpha-\\mu^2L^2>0$.", "eq:3.72": "<b>(3.72)<\/b> Le problème dual : $\\sup_{q\\ge0}\\mathcal G(q)$.", "eq:3.73": "<b>(3.73)<\/b> La fonction duale : $\\mathcal G(q)=\\inf_{v\\in V}\\Lag(v,q)$, de gradient $\\mathcal G'(q)=F(u_q)$ où $u_q$ minimise $\\Lag(\\cdot,q)$.", "eq:3.74": "<b>(3.74)<\/b> Arrow–Hurwicz : $u^{n+1}=u^n-\\mu_n\\big(J'(u^n)+p^n\\cdot F'(u^n)\\big)$ et $p^{n+1}=P_{\\R^M_+}\\big(p^n+\\mu_nF(u^n)\\big)$ — un pas de descente en $v$, un pas de montée en $q$.", "eq:3.75": "<b>(3.75)<\/b> Dans la preuve du Th. 3.4.4 : $\\norm{u^{n+1}-u}^2=\\norm{u^n-u}^2-2\\mu_n\\ps{\\partial_v\\Lag(u^n,p^n)}{u^n-u}+\\mu_n^2\\norm{\\partial_v\\Lag(u^n,p^n)}^2$.", "eq:3.76": "<b>(3.76)<\/b> Dans la preuve du Th. 3.4.4 : le développement de $\\norm{p^{n+1}-p}^2$ (projection 1-lipschitzienne) : $\\norm{p^{n+1}-p}^2\\le\\norm{p^n-p}^2+2\\mu_n\\big(F(u^n)-F(u)\\big)\\cdot(p^n-p)+\\mu_n^2\\norm{F(u^n)-F(u)}^2$.", "eq:3.78": "<b>(3.78)<\/b> Problème pénalisé : $\\inf_{F(v)\\le0}J(v)$ sur $\\R^N$, $J$ et $F$ convexes continues.", "eq:3.79": "<b>(3.79)<\/b> Pénalisation extérieure : $\\inf_{v\\in\\R^N}\\Big(J(v)+\\frac1\\eps\\sum_{i=1}^M\\big[\\max(F_i(v),0)\\big]^2\\Big)$ — un ressort de raideur $1/\\eps$ remplace la contrainte.", "eq:3.80": "<b>(3.80)<\/b> Comparaison des minimiseurs : $J_\\eps(u_\\eps)=J(u_\\eps)+\\frac{G(u_\\eps)}\\eps\\le J_\\eps(u)=J(u)$ (car $G(u)=0$).", "eq:3.81": "<b>(3.81)<\/b> D'où $J(u_\\eps)\\le J_\\eps(u_\\eps)\\le J(u)$ : la famille $(u_\\eps)$ est bornée et la pénalisation sous-estime l'optimum.", "eq:3.82": "<b>(3.82)<\/b> Pénalisation intérieure (barrière) : minimiser $J(v)-\\eps\\sum_i\\frac1{F_i(v)}$ sur $\\{v:\\ F(v)<0\\}$, puis $\\eps\\to0$.", "eq:3.83": "<b>(3.83)<\/b> Problème du Lagrangien augmenté : $\\inf_{F(v)=0}J(v)$ en dimension finie, $J,F$ de classe $C^1$.", "eq:3.84": "<b>(3.84)<\/b> Lagrangien augmenté : $\\Lag_{aug}(v,\\lambda,\\mu)=J(v)+\\lambda\\cdot F(v)+\\frac\\mu2\\norm{F(v)}^2$.", "eq:3.85": "<b>(3.85)<\/b> Point critique de $\\Lag_{aug}(\\cdot,\\lambda^n,\\mu)$ : $J'(v^n)+\\lambda^n\\cdot F'(v^n)+\\mu F(v^n)\\cdot F'(v^n)=0$.", "eq:3.86": "<b>(3.86)<\/b> Condition d'optimalité du problème : $J'(v^*)+\\lambda^*\\cdot F'(v^*)=0$.", "eq:3.87": "<b>(3.87)<\/b> Mise à jour du multiplicateur (en comparant (3.85) et (3.86)) : $\\lambda^{n+1}=\\lambda^n+\\mu F(v^n)$.", "eq:3.88": "<b>(3.88)<\/b> Condition suffisante d'ordre 2 : $\\big(J''(v^*)+\\lambda^*\\cdot F''(v^*)\\big)(w,w)>0$ pour tout $w\\in\\Ker F'(v^*)\\setminus\\{0\\}$.", "eq:3.89": "<b>(3.89)<\/b> Hessienne du Lagrangien augmenté en $v^*$ : $\\Lag''(v^*,\\lambda^*)(w,w)+\\mu\\norm{F'(v^*)w}^2$.", "eq:3.90": "<b>(3.90)<\/b> Méthode de Newton pour $F(u)=0$ : $u^{n+1}=u^n-\\big(F'(u^n)\\big)^{-1}F(u^n)$ (on résout un système linéaire, on n'inverse pas).", "eq:3.91": "<b>(3.91)<\/b> Modèle quadratique de Newton : minimiser $J(v)+J'(v)\\cdot(w-v)+\\frac12J''(v)(w-v)\\cdot(w-v)$, de minimum $w=v-(J''(v))^{-1}J'(v)$.", "eq:3.92": "<b>(3.92)<\/b> Convergence quadratique (Prop. 3.5.1) : $\\norm{u^{n+1}-u}\\le C\\norm{u^n-u}^2$ et $\\norm{u^n-u}\\le C^{-1}(C\\eps)^{2^n}$ si $\\norm{u^0-u}\\le\\eps$, $C\\eps<1$.", "eq:3.93": "<b>(3.93)<\/b> Problème avec contraintes d'égalité : $\\min_{G(v)=0}J(v)$, $G:V\\to\\R^M$.", "eq:3.94": "<b>(3.94)<\/b> Système de Lagrange : $J'(u)+\\lambda\\cdot G'(u)=0$ et $G(u)=0$ — $N+M$ équations, $N+M$ inconnues $(u,\\lambda)$.", "eq:3.95": "<b>(3.95)<\/b> Hypothèse d'inversibilité : $\\big(J''(u)+\\lambda\\cdot G''(u)\\big)(w,w)>0$ pour tout $w\\in\\Ker G'(u)$, $w\\ne0$ (condition d'ordre 2 stricte).", "eq:3.96": "<b>(3.96)<\/b> Une itération de Newton–Lagrange = le programme quadratique $\\min_w Q^n(w)$ sous $G(u^n)+G'(u^n)\\cdot(w-u^n)=0$, $Q^n$ développement d'ordre 2 du Lagrangien en $u^n$.", "eq:3.97": "<b>(3.97)<\/b> Variante où l'on développe $J$ au lieu du Lagrangien (Hessienne $J''$ au lieu de $J''+\\lambda\\cdot G''$) : peut ne pas converger (Rem. 3.5.4).", "eq:3.98": "<b>(3.98)<\/b> Newton en dimension infinie : $u^{n+1}$ minimise le modèle quadratique $J(u^n)+J'(u^n)(w-u^n)+\\frac12J''(u^n)(w-u^n,w-u^n)$.", "eq:3.99": "<b>(3.99)<\/b> Formulation variationnelle du pas de Newton : $J''(u^n)\\big(u^{n+1}-u^n,w\\big)=-J'(u^n)(w)$ pour tout $w$ (résolue par Lax–Milgram).", "eq:3.100": "<b>(3.100)<\/b> Problème des approximations successives : $\\inf_{F(v)=0}J(v)$.", "eq:3.102": "<b>(3.102)<\/b> Modèle du gradient : $J_{n-1}(v)=J(v^{n-1})+J'(v^{n-1})\\cdot(v-v^{n-1})+\\frac1{2\\mu}\\norm{v-v^{n-1}}^2$ ; son minimum est le pas de gradient à pas fixe $\\mu$.", "eq:3.103": "<b>(3.103)<\/b> SLP : $J$ et $F$ remplacées par leurs approximations affines en $v^{n-1}$ ($J(v^{n-1})+J'(v^{n-1})\\cdot(v-v^{n-1})$, de même pour $F$) — un programme linéaire.", "eq:3.104": "<b>(3.104)<\/b> Région de confiance : $\\norm{v-v^{n-1}}\\le\\delta$ (en norme $\\ell^\\infty$ ou $\\ell^1$ pour rester linéaire).", "eq:3.105": "<b>(3.105)<\/b> SQP : $J$ remplacée par son modèle quadratique de matrice $Q^{n-1}=J''(v^{n-1})+\\lambda^{n-1}\\cdot F''(v^{n-1})$ (Hessienne du Lagrangien), $F$ par son approximation affine.", "eq:3.108": "<b>(3.108)<\/b> Fonction composée : $\\inf_{v\\in\\R^N}J(v)=J_m\\circ J_{m-1}\\circ\\dots\\circ J_1(v)$, $J_i:\\R^{N_i}\\to\\R^{N_{i+1}}$, $N_{m+1}=1$ (réseau de neurones, programme découpé).", "eq:3.109": "<b>(3.109)<\/b> Dérivation composée (mode direct) : $J'(v)\\cdot h=J_m'\\cdot\\big(J_{m-1}'\\cdots J_1'\\,h\\big)$, chaque $J_i'$ évaluée à l'entrée de $J_i$ — une passe par direction $h$.", "eq:3.110": "<b>(3.110)<\/b> Rétropropagation : $\\nabla J(v)=J_1'^{\\,*}J_2'^{\\,*}\\cdots J_m'^{\\,*}$, calculé de droite à gauche en partant du dernier gradient (un vecteur) — une seule passe, par les transposées.", "eq:3.111": "<b>(3.111)<\/b> Contrainte de modèle : $\\inf_{F(v,y)=0}J(v,y)$, $v$ le contrôle, $y$ l'état (solution d'une EDO/EDP $F(v,y)=0$).", "eq:3.112": "<b>(3.112)<\/b> Problème réduit : $\\inf_v\\tilde J(v)=J(v,y(v))$, $y(v)$ l'état associé à $v$.", "eq:3.113": "<b>(3.113)<\/b> Système linéarisé (Lemme 3.7.3) : $\\frac{\\partial F}{\\partial y}\\,(y'(v)\\cdot h)=-\\frac{\\partial F}{\\partial v}\\cdot h$ — une résolution par direction $h$.", "eq:3.115": "<b>(3.115)<\/b> État adjoint (Lemme 3.7.5) : $\\big(\\frac{\\partial F}{\\partial y}(v,y(v))\\big)^*p=-\\frac{\\partial J}{\\partial y}(v,y(v))$ — l'unique $p$ annulant $\\partial_y\\Lag$.", "eq:3.116": "<b>(3.116)<\/b> Prop. 3.7.6 : $\\tilde J'(v)=\\frac{\\partial J}{\\partial v}(v,y(v))+\\Big\\langle p(v),\\frac{\\partial F}{\\partial v}(v,y(v))\\Big\\rangle$ — le gradient complet pour une résolution adjointe.", "eq:3.118": "<b>(3.118)<\/b> Problème décomposable : $\\inf\\sum_{i=1}^nJ_i(v_i)$ sous $\\sum_{i=1}^nF_i(v_i)=F_0$.", "eq:3.119": "<b>(3.119)<\/b> Décomposition par les prix (Uzawa) : chaque unité résout $\\inf_{v_i}J_i(v_i)+p^k\\cdot F_i(v_i)$, puis $p^{k+1}=p^k+\\mu\\big(\\sum_iF_i(v_i^k)-F_0\\big)$.", "eq:3.120": "<b>(3.120)<\/b> Le sous-problème de l'unité $i$ à prix $p^k$ fixé : $\\inf_{v_i}J_i(v_i)+p^k\\cdot F_i(v_i)$.", "eq:3.121": "<b>(3.121)<\/b> Décomposition par les quantités : l'unité $i$ résou     var el = e.target.closest && e.target.closest('.xref');
    if (el){ e.preventDefault(); if (cur === el && pinned){ hide(); } else { show(el); pinned = true; } return; }
    if (e.target.closest && e.target.closest('.xpop')){ if (e.target.classList.contains('xpop-x')) hide(); return; }
    hide();
  });
  document.addEventListener('focusin', function(e){ var el = e.target.closest && e.target.closest('.xref'); if (el) show(el); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hide(); });
  pop.querySelector('.xpop-go').addEventListener('click', function(){ pinned = false; setTimeout(hide, 50); });

  /* enveloppe les références d'un fragment rendu dynamiquement (avant le rendu KaTeX) */
  var KW = /\b(Théorèmes?|Th\.|Propositions?|Prop\.|Lemmes?|Corollaires?|Cor\.|Remarques?|Rem\.|Définitions?|Déf\.|Exemples?|Exercices?|Ex\.|Figures?|Fig\.)\s+(\d\.\d+(?:\.\d+)?)((?:\s*(?:,|et|–|-|à)\s*\d\.\d+(?:\.\d+)?)*)/g;
  var EQR = /\((\d\.\d{1,3})\)/g;
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function kind(k){ k = k.replace(/\.$/,''); if (/^Exemple/.test(k)) return 'exm:'; if (/^(Exercice|Ex)/.test(k)) return 'exo:'; if (/^Fig/.test(k)) return 'fig:'; return 'res:'; }
  function wrap(key, text){ return '<span class="xref" data-k="'+key+'" tabindex="0">'+esc(text)+'</span>'; }
  function linkText(t){
    var parts = t.split(/(\$\$[\s\S]*?\$\$|\$[^$\n]*?\$)/); var changed = false;
    var out = parts.map(function(seg, i){
      if (i % 2 === 1) return esc(seg);
      var s = esc(seg);
      s = s.replace(KW, function(m, kw, n1, rest){
        var nums = [n1].concat(rest.match(/\d\.\d+(?:\.\d+)?/g) || []); var pref = kind(kw);
        for (var j = 0; j < nums.length; j++) if (!D[pref + nums[j]]) return m;
        changed = true; var res = '', last = 0;
        for (var j2 = 0; j2 < nums.length; j2++){ var p = m.indexOf(nums[j2], last); if (j2 === 0) res += wrap(pref + nums[0], m.slice(0, p + nums[0].length)); else res += m.slice(last, p) + wrap(pref + nums[j2], nums[j2]); last = p + nums[j2].length; }
        return res + m.slice(last);
      });
      s = s.replace(EQR, function(m, n){ if (!D['eq:' + n]) return m; changed = true; return wrap('eq:' + n, m); });
      return s;
    });
    return changed ? out.join('') : null;
  }
  window.xrefify = function(root){
    if (!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: function(n){
      var p = n.parentElement;
      while (p && p !== root){ if (p.matches('a, .tech, .xref, h1, h2, h3, .kind, script, style, .katex, .xpop')) return NodeFilter.FILTER_REJECT; p = p.parentElement; }
      return /\(\d\.\d{1,3}\)|\d\.\d+\.\d+/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP; } });
    var nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){ var html = linkText(n.nodeValue); if (html !== null){ var tpl = document.createElement('span'); tpl.innerHTML = html; while (tpl.firstChild) n.parentNode.insertBefore(tpl.firstChild, n); n.parentNode.removeChild(n); } });
  };
})();
</script>
<script>(function(){
'use strict';
const D = window.DATA;
const MACROS = {
  "\\R": "\\mathbb{R}", "\\N": "\\mathbb{N}",
  "\\ps": "\\langle #1,\\,#2\\rangle", "\\norm": "\\lVert #1\\rVert",
  "\\Lag": "\\mathcal{L}", "\\eps": "\\varepsilon",
  "\\le": "\\leqslant", "\\leq": "\\leqslant", "\\ge": "\\geqslant", "\\geq": "\\geqslant",
  "\\Vect": "\\operatorname{Vect}", "\\Ker": "\\operatorname{Ker}", "\\Id": "\\mathrm{Id}", "\\Im": "\\operatorname{Im}",
  "\\sgn": "\\operatorname{sgn}", "\\prox": "\\operatorname{prox}", "\\argmin": "\\operatorname*{arg\\,min}", "\\argmax": "\\operatorname*{arg\\,max}",
  "\\diag": "\\operatorname{diag}", "\\Epi": "\\operatorname{Epi}"
};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KINDS = {but:'Ce que je veux', acquis:'Ce que j\'ai', fosse:'Le fossé', essai:'Premier réflexe', impasse:'Ça coince', question:'La question qui débloque', idee:'L\'idée', pas:'Je déroule', controle:'Contrôle', bilan:'Ce que j\'emporte', note:'Remarque', image:'L\'image'};
const ITEMS = D.items; const byId = {}; ITEMS.forEach(it => byId[it.id] = it);
const REF = D.reflexes;
const ORDER = []; D.groups.forEach(g => g.ids.forEach(id => { if(byId[id]) ORDER.push(id); }));
const posOf = id => ORDER.indexOf(id);
/* mini-markdown : paragraphes, **gras**, *italique*, listes "- ", formules laissées à KaTeX */
function md(s){
  if(!s) return '';
  let t = esc(s);
  t = t.replace(/\*\*([\s\S]+?)\*\*/g, '<b>$1</b>');
  t = t.replace(/(^|[\s(])\*([^*\n$]+?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
  t = t.replace(/§([0-9]+\.[0-9]+\.[0-9]+|NL)/g, (m, id) => byId[id] ? '<a class="ref" href="#'+id+'">'+short(byId[id])+'</a>' : m);
  t = t.replace(/\bT([0-9]{1,2})\b/g, (m, n) => '<span class="tech">T'+n+'</span>');
  const blocks = t.split(/\n\s*\n+/);
  return blocks.map(b => {
    const lines = b.split('\n');
    if(lines.every(l => /^\s*-\s+/.test(l))) return '<ul class="plain">' + lines.map(l => '<li>' + l.replace(/^\s*-\s+/, '') + '</li>').join('') + '</ul>';
    return '<p>' + b.replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
function short(it){ return it.label.replace(/ · niveau \d/, '').replace('Théorème', 'Th.').replace('Proposition', 'Prop.').replace('Corollaire', 'Cor.').replace('Exercice', 'Ex.'); }
function renderMath(el){ if(typeof window.renderMathInElement !== 'function') return; try{ window.renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false, strict:'ignore', macros:MACROS}); }catch(e){} }
/* mémoire « lu » */
let LU = {}; try{ LU = JSON.parse(localStorage.getItem('pense-lu') || '{}'); }catch(e){}
const saveLu = () => { try{ localStorage.setItem('pense-lu', JSON.stringify(LU)); }catch(e){} };

/* barre latérale */
const list = $('#list'); const sel = $('#sel');
function buildSide(filter){
  list.innerHTML = ''; sel.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  const mk = (id, label, cls, on) => { const b = document.createElement('button'); b.className = 'special' + (on ? ' on' : ''); b.textContent = label; b.addEventListener('click', () => go(id)); list.appendChild(b); };
  mk('methode', 'La méthode : sept questions', '', cur === 'methode'); mk('reflexes', 'La boîte à réflexes', '', cur === 'reflexes');
  D.groups.forEach(g => {
    const items = g.ids.filter(id => byId[id]).filter(id => !f || (byId[id].label + ' ' + byId[id].nom + ' ' + id).toLowerCase().includes(f));
    if(!items.length) return;
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = g.titre; list.appendChild(h);
    const og = document.createElement('optgroup'); og.label = g.titre; sel.appendChild(og);
    items.forEach(id => { const it = byId[id]; const b = document.createElement('button'); b.className = 'it' + (it.kind === 'exo' ? ' exo' : '') + (LU[id] ? ' lu' : '') + (id === cur ? ' on' : ''); b.dataset.id = id; b.innerHTML = '<span class="n">'+esc(it.num || id)+'</span><span>'+esc(it.nom)+'</span>'; b.addEventListener('click', () => go(id)); list.appendChild(b);
      const o = document.createElement('option'); o.value = id; o.textContent = (it.num || id) + ' · ' + it.nom; og.appendChild(o); });
  });
  const o1 = document.createElement('option'); o1.value = 'methode'; o1.textContent = '— La méthode'; sel.insertBefore(o1, sel.firstChild);
  const o2 = document.createElement('option'); o2.value = 'reflexes'; o2.textContent = '— La boîte à réflexes'; sel.insertBefore(o2, sel.firstChild);
  sel.value = cur;
}
sel.addEventListener('change', () => go(sel.value));
$('#search').addEventListener('input', e => buildSide(e.target.value));

let cur = null;
function reflexChip(k){ const r = REF[k]; if(!r) return ''; return '<a class="reflex" href="#reflexes-'+k+'"><b>'+k+'</b><span>'+esc(r.nom)+'</span></a>'; }
function usesOf(k){ return ORDER.filter(id => (byId[id].reflexes || []).includes(k)); }

function renderItem(it){
  const kindLab = it.kind === 'exo' ? 'Exercice' : 'Résultat';
  let h = '<div class="hd"><span class="kind'+(it.kind === 'exo' ? ' exo' : '')+'">'+esc(it.label)+'</span><h2>'+esc(it.nom)+'</h2>';
  h += '<span class="mark"><button id="lu" class="'+(LU[it.id] ? 'on' : '')+'">'+(LU[it.id] ? '✓ lu' : 'marquer lu')+'</button></span></div>';
  const L = it.liens || {}; let links = [];
  if(L.guide) links.push('<a href="allaire-decortique.html#'+L.guide+'">le guide ↗</a>');
  if(L.fiche) links.push('<a href="allaire-en-tete.html#fiche-'+L.fiche+'">la fiche ↗</a>');
  if(L.scene) links.push('<a href="allaire-en-images.html#'+L.scene+'">la scène 3D ↗</a>');
  (it.voir || []).forEach(id => { if(byId[id]) links.push('<a href="#'+id+'">voir aussi : '+short(byId[id])+'</a>'); });
  if(links.length) h += '<div class="liens">'+links.join('')+'</div>';
  h += '<div class="enonce"><span class="lab">'+(it.kind === 'exo' ? 'L\'énoncé' : 'L\'énoncé')+'</span>'+md(it.enonce)+'</div>';
  if(it.chaine && it.chaine.length){
    h += '<div class="sec-h">La chaîne de réflexion <small>comment j\'y pense, sans connaître '+(it.kind === 'exo' ? 'le corrigé' : 'la preuve')+'</small></div><div class="chaine">';
    let n = 0;
    it.chaine.forEach(st => { const k = st[0], txt = st[1]; const lab = KINDS[k] || k; let num = ''; if(k === 'pas'){ n++; num = '<span class="num">'+n+'</span>'; }
      h += '<div class="step k-'+k+'"><div class="lab"><span>'+lab+'</span>'+num+'</div><div class="txt">'+md(txt)+'</div></div>'; });
    h += '</div>';
  }
  if(it.livre){ h += '<div class="sec-h">'+(it.kind === 'exo' ? 'Le corrigé du guide, et ce qu\'il m\'apprend' : 'La preuve du livre, et ce qu\'elle m\'apprend')+'</div><div class="card livre">'+md(it.livre)+'</div>'; }
  if(it.reflexes && it.reflexes.length){ h += '<div class="sec-h">Les réflexes à retenir</div><div class="reflexbox">'+it.reflexes.map(reflexChip).join('')+'</div>'; }
  const i = posOf(it.id);
  h += '<div class="foot"><button id="prev">← précédent</button><span class="progress">'+(i+1)+' / '+ORDER.length+'</span><button id="next">suivant →</button></div>';
  return h;
}
function renderReflexes(){
  let h = '<div class="hd"><h2>La boîte à réflexes</h2></div><div class="intro"><p>Ce ne sont pas des techniques de démonstration (celles-là, les <span class="tech">T1</span>…<span class="tech">T15</span>, sont dans <i>L\'Allaire en tête</i>) mais des <b>gestes de recherche</b> : ce que je fais quand je ne sais pas encore. Chaque réflexe renvoie aux chaînes où il sert. Quand tu es bloqué devant un énoncé nouveau, parcours la liste : l\'un d\'eux est presque toujours le bon premier geste.</p></div>';
  Object.keys(REF).forEach(k => { const r = REF[k]; const uses = usesOf(k);
    h += '<div class="rf" id="rf-'+k+'"><h3><b>'+k+'</b>'+esc(r.nom)+'</h3>'+md(r.txt)+(uses.length ? '<div class="use">Sert dans : '+uses.map(id => '<a href="#'+id+'">'+short(byId[id])+'</a>').join(' ')+'</div>' : '')+'</div>'; });
  return h;
}
function renderMethode(){ return '<div class="hd"><h2>La méthode : sept questions, toujours dans cet ordre</h2></div>' + md(D.methode) ; }

function go(id, anchor){
  if(id !== cur){
    cur = id; const main = $('#main');
    if(id === 'reflexes') main.innerHTML = renderReflexes();
    else if(id === 'methode') main.innerHTML = renderMethode();
    else { const it = byId[id]; if(!it){ cur = null; return go(ORDER[0]); } main.innerHTML = renderItem(it);
      $('#prev').addEventListener('click', () => go(ORDER[(posOf(id)-1+ORDER.length)%ORDER.length])); $('#next').addEventListener('click', () => go(ORDER[(posOf(id)+1)%ORDER.length]));
      $('#lu').addEventListener('click', () => { LU[id] = !LU[id]; if(!LU[id]) delete LU[id]; saveLu(); $('#lu').className = LU[id] ? 'on' : ''; $('#lu').textContent = LU[id] ? '✓ lu' : 'marquer lu'; buildSide($('#search').value); }); }
    if(window.xrefify) window.xrefify(main);
    renderMath(main);
    buildSide($('#search').value);
    $('#cnt').textContent = byId[id] ? (posOf(id)+1) + ' / ' + ORDER.length : '';
    history.replaceState(null, '', '#' + id + (anchor ? '-' + anchor : ''));
  }
  if(anchor){ const el = document.getElementById('rf-'+anchor); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
  else window.scrollTo({top:0});
}
document.addEventListener('keydown', e => { if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; if(!byId[cur]) return; if(e.key === 'ArrowRight') go(ORDER[(posOf(cur)+1)%ORDER.length]); if(e.key === 'ArrowLeft') go(ORDER[(posOf(cur)-1+ORDER.length)%ORDER.length]); });
function route(){ const h = decodeURIComponent((location.hash || '').slice(1)); if(!h) return go('methode'); const m = /^reflexes-(R\d+)$/.exec(h); if(m) return go('reflexes', m[1]); if(h === 'reflexes' || h === 'methode' || byId[h]) return go(h); go('methode'); }
window.addEventListener('hashchange', () => { const h = decodeURIComponent((location.hash || '').slice(1)); const m = /^reflexes-(R\d+)$/.exec(h); const id = m ? 'reflexes' : h; if(id !== cur || m) route(); });
$('#prevTop').addEventListener('click', () => go(ORDER[(Math.max(0,posOf(cur))-1+ORDER.length)%ORDER.length])); $('#nextTop').addEventListener('click', () => go(ORDER[(posOf(cur)+1)%ORDER.length]));
route();
})();
</script>
