et infinie à l'infini, et pourtant n'a pas de minimum.<\/p>", "res:2.3.2": "<b>Définition 2.3.2<\/b> <p>$J$, définie sur un convexe non vide $K\\subset V$, est <strong>convexe<\/strong> si $J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)$ pour tous $u,v\\in K$, $\\theta\\in[0,1]$ (2.7) ; <strong>strictement convexe<\/strong> si l'inégalité est stricte pour $u\\ne v$ et $\\theta\\in]0,1[$.<\/p>", "res:2.3.4": "<b>Proposition 2.3.4<\/b> <p>Si $J$ est une fonction convexe sur un ensemble convexe $K$, tout point de minimum local de $J$ sur $K$ est un minimum global, et l'ensemble des points de minimum est un ensemble convexe (éventuellement vide). Si de plus $J$ est strictement convexe, alors il existe au plus un point de minimum.<\/p>", "res:2.3.5": "<b>Lemme 2.3.5<\/b> <p>Soit $v_0\\in V$ et $J$ une fonction convexe majorée sur la boule unité de centre $v_0$. Alors $J$ est continue sur cette boule ouverte.<\/p>", "res:2.3.6": "<b>Définition 2.3.6<\/b> <p>$J$, définie sur un convexe $K$, est <strong>fortement convexe<\/strong> (ou α-convexe) s'il existe $\\alpha\\gt0$ tel que, pour tous $u,v\\in K$ et $\\theta\\in[0,1]$,<\/p>\n$$J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)-\\frac{\\alpha\\theta(1-\\theta)}{2}\\norm{u-v}^2. \\tag{2.9}$$", "res:2.3.7": "<b>Proposition 2.3.7<\/b> <p>Si $J$ est convexe continue sur un ensemble $K$ convexe fermé non vide, il existe une forme linéaire continue $L\\in V'$ et une constante $\\delta\\in\\R$ telles que $J(v)\\ge L(v)+\\delta$ pour tout $v\\in K$ (2.11). Si de plus $J$ est fortement convexe sur $K$, il existe $\\gamma\\gt0$ et $\\eta\\in\\R$ tels que $J(v)\\ge\\gamma\\norm{v}^2+\\eta$ pour tout $v\\in K$ (2.12).<\/p>", "res:2.3.8": "<b>Théorème 2.3.8<\/b> (Existence d'un minimum, cas fortement convexe) <p>Soit $K$ un convexe fermé non vide d'un Hilbert $V$ et $J$ une fonction α-convexe continue sur $K$. Alors il existe un unique minimum $u$ de $J$ sur $K$, et<\/p>\n$$\\norm{v-u}^2\\le\\frac4\\alpha\\big(J(v)-J(u)\\big)\\qquad\\forall v\\in K. \\tag{2.14}$$\n<p>En particulier, toute suite minimisante de $J$ sur $K$ converge vers $u$.<\/p>", "res:2.3.9": "<b>Théorème 2.3.9<\/b> (Existence d'un minimum, cas convexe) <p>Soit $K$ un convexe fermé non vide d'un espace de Hilbert $V$, et $J$ une fonction convexe continue sur $K$, infinie à l'infini dans $K$ (condition (2.2)). Alors il existe un minimum de $J$ sur $K$.<\/p>", "res:2.3.12": "<b>Définition 2.3.12<\/b> <p>$(u^n)$ converge faiblement vers $u\\in V$ si $\\lim_{n\\to\\infty}\\ps{u^n}{v}=\\ps{u}{v}$ pour tout $v\\in V$.<\/p>", "res:2.3.13": "<b>Lemme 2.3.13<\/b> <p>De toute suite $u^n$ bornée dans $V$ on peut extraire une sous-suite qui converge faiblement.<\/p>", "res:2.3.14": "<b>Lemme 2.3.14<\/b> <p>Une partie convexe fermée $K$ de $V$ est l'intersection des demi-espaces fermés $\\{L(v)\\le\\alpha\\}$ qui contiennent $K$.<\/p>", "res:2.3.15": "<b>Lemme 2.3.15<\/b> <p>Un convexe fermé non vide est fermé pour la convergence faible. Si $J$ est convexe et sci sur $K$, alors $J$ est aussi sci sur $K$ pour la convergence faible.<\/p>", "res:2.4.1": "<b>Définition 2.4.1<\/b> <p>$J$, définie sur un voisinage de $u\\in V$ à valeurs dans $\\R$, est dérivable (ou différentiable) au sens de Fréchet en $u$ s'il existe une forme linéaire continue $L\\in V'$ telle que<\/p>\n$$J(u+w)=J(u)+L(w)+o(w),\\qquad\\lim_{w\\to0}\\frac{|o(w)|}{\\norm{w}}=0. \\tag{2.15}$$\n<p>On note $L=J'(u)$ la dérivée (différentielle, gradient) de $J$ en $u$.<\/p>", "res:2.4.4": "<b>Proposition 2.4.4<\/b> <p>Soit $J$ différentiable de $V$ dans $\\R$. Sont équivalentes : $J$ est convexe sur $V$ (2.19) ; $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}$ pour tous $u,v$ (2.20) ; $\\ps{J'(u)-J'(v)}{u-v}\\ge0$ pour tous $u,v$ (2.21).<\/p>", "res:2.4.5": "<b>Proposition 2.4.5<\/b> <p>Soit $J$ différentiable de $V$ dans $\\R$ et $\\alpha\\gt0$. Sont équivalentes : $J$ est α-convexe sur $V$ (2.22) ;<\/p>\n$$J(v)\\ge J(u)+\\ps{J'(u)}{v-u}+\\frac\\alpha2\\norm{v-u}^2\\quad\\forall u,v \\tag{2.23}$$\n$$\\ps{J'(u)-J'(v)}{u-v}\\ge\\alpha\\norm{u-v}^2\\quad\\forall u,v. \\tag{2.24}$$", "res:2.4.7": "<b>Définition 2.4.7<\/b> <p>$J$ est deux fois dérivable en $u$ si $J$ est dérivable au voisinage de $u$ et si $J'$ est dérivable en <span class=\"nw\">$u$ :<\/span> $J'(u+w)=J'(u)+J''(u)w+o(w)$ avec $\\lim_{w\\to0}\\norm{o(w)}_{V'}/\\norm{w}_V=0$. On note $J''(u)(w,v)$ la forme bilinéaire $(J''(u)w)v$.<\/p>", "res:2.4.8": "<b>Lemme 2.4.8<\/b> <p>Si $J$ est deux fois dérivable, $J(u+w)=J(u)+\\ps{J'(u)}{w}+\\frac12J''(u)(w,w)+o(\\norm{w}^2)$ (2.27).<\/p>", "res:2.4.9": "<b>Définition 2.4.9<\/b> <p>$F:V\\to W$ est lipschitzienne de constante $L\\gt0$ si $\\norm{F(v)-F(u)}\\le L\\norm{v-u}$ pour tous $u,v$.<\/p>", "res:2.4.10": "<b>Lemme 2.4.10<\/b> <p>Soit $J$ différentiable de $V$ dans $\\R$ dont la dérivée $J'$ est lipschitzienne de constante $L\\gt0$. Alors<\/p>\n$$J(v)\\le J(u)+\\ps{J'(u)}{v-u}+\\frac L2\\norm{v-u}^2\\qquad\\forall u,v\\in V.$$", "res:2.5.1": "<b>Théorème 2.5.1<\/b> (Inéquation d'Euler, cas convexe) <p>Soit $u\\in K$ convexe. On suppose que $J$ est différentiable en $u$. Si $u$ est un point de minimum local de $J$ sur $K$, alors<\/p>\n$$\\ps{J'(u)}{v-u}\\ge0\\qquad\\forall v\\in K. \\tag{2.29}$$\n<p>Si $u\\in K$ vérifie (2.29) et si $J$ est convexe, alors $u$ est un minimum global de $J$ sur $K$.<\/p>", "res:2.5.3": "<b>Proposition 2.5.3<\/b> <p>On suppose $K=V$ et $J$ deux fois dérivable en $u$. Si $u$ est un point de minimum local de $J$, alors $J'(u)=0$ et $J''(u)(w,w)\\ge0$ pour tout $w\\in V$ (2.34). Réciproquement, si pour tout $v$ dans un voisinage de $u$, $J'(u)=0$ et $J''(v)(w,w)\\ge0$ pour tout $w$ (2.35), alors $u$ est un minimum local de $J$.<\/p>", "res:2.5.4": "<b>Définition 2.5.4<\/b> <p>En tout point $v\\in K$, l'ensemble<\/p>\n$$K(v)=\\Big\\{w\\in V,\\ \\exists(v^n)\\in K^{\\N},\\ \\exists(\\eps_n)\\in(\\R_+^*)^{\\N},\\ \\lim v^n=v,\\ \\lim\\eps_n=0,\\ \\lim\\frac{v^n-v}{\\eps_n}=w\\Big\\}$$\n<p>est appelé le cône des directions admissibles au point $v$ (ou cône tangent).<\/p>", "res:2.5.5": "<b>Proposition 2.5.5<\/b> (Inéquation d'Euler, cas général) <p>Soit $u$ un minimum local de $J$ sur $K$. Si $J$ est différentiable en $u$, on a $\\ps{J'(u)}{w}\\ge0$ pour tout $w\\in K(u)$.<\/p>", "res:2.5.6": "<b>Théorème 2.5.6<\/b> <p>Soit $u\\in K$. On suppose $J$ dérivable en $u$ et les $F_i$ continûment dérivables dans un voisinage de $u$, et les vecteurs $\\big(F_i'(u)\\big)_{1\\le i\\le M}$ linéairement indépendants. Alors, si $u$ est un minimum local de $J$ sur $K$, il existe $\\lambda_1,\\dots,\\lambda_M\\in\\R$, appelés multiplicateurs de Lagrange, tels que<\/p>\n$$J'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0. \\tag{2.37}$$", "res:2.5.7": "<b>Lemme 2.5.7<\/b> <p>Soit $\\mathcal F(\\eps,v):\\R\\times V\\to\\R^M$ avec $\\mathcal F(0,v_0)=0$, continûment différentiable près de $(0,v_0)$. Si la différentielle partielle $h\\mapsto\\ps{D_v\\mathcal F(0,v_0)}{h}$ est surjective de $V$ sur $\\R^M$, il existe un voisinage $\\mathcal V$ de $(0,v_0)$ et $C\\gt0$ tels que pour tout $(\\eps,v)\\in\\mathcal V$ il existe $v_\\eps$ avec $\\mathcal F(\\eps,v_\\eps)=0$ et $\\norm{v-v_\\eps}_V\\le C\\norm{\\mathcal F(\\eps,v)}_{\\R^M}$.<\/p>", "res:2.5.9": "<b>Définition 2.5.9<\/b> <p>Le Lagrangien du problème est $\\Lag(v,\\mu)=J(v)+\\sum_{i=1}^M\\mu_iF_i(v)=J(v)+\\mu\\cdot F(v)$ sur $V\\times\\R^M$.<\/p>", "res:2.5.10": "<b>Lemme 2.5.10<\/b> <p>$\\displaystyle\\inf_{v\\in V,\\,F(v)=0}J(v)=\\inf_{v\\in V}\\ \\sup_{\\mu\\in\\R^M}\\Lag(v,\\mu)$ (2.40).<\/p>", "res:2.5.12": "<b>Lemme 2.5.12<\/b> <p>Sous les hypothèses du Théorème 2.5.6, on suppose que (2.41) a, pour $\\ell$ petit, une solution unique $u_\\ell$, différentiable par rapport à $\\ell$ en 0. Si $u$ est la solution pour $\\ell=0$ et $\\lambda$ le multiplicateur associé, alors $\\lambda_i=-\\dfrac{\\partial J_{\\min}}{\\partial\\ell_i}(0)$ pour $1\\le i\\le M$.<\/p>", "res:2.5.13": "<b>Proposition 2.5.13<\/b> <p>Sous les hypothèses du Théorème 2.5.6, avec $J,F_1,\\dots,F_M$ deux fois continûment dérivables et les $F_i'(u)$ linéairement indépendants, soit $\\lambda$ le multiplicateur de 2.5.6. Tout minimum local $u$ de $J$ sur $K$ vérifie<\/p>\n$$\\Big(J''(u)+\\sum_{i=1}^M\\lambda_iF_i''(u)\\Big)(w,w)\\ge0\\qquad\\forall w\\in K(u)=\\bigcap_{i=1}^M[F_i'(u)]^\\perp. \\tag{2.42}$$", "res:2.5.14": "<b>Définition 2.5.14<\/b> <p>$I(u)=\\{i\\in\\{1,\\dots,M\\},\\ F_i(u)=0\\}$ est l'ensemble des contraintes actives en $u\\in K$.<\/p>", "res:2.5.15": "<b>Définition 2.5.15<\/b> <p>Les contraintes (2.44) sont qualifiées en $u\\in K$ si et seulement s'il existe une direction $\\bar w\\in V$ telle que, pour tout $i\\in I(u)$, ou bien $\\ps{F_i'(u)}{\\bar w}\\lt0$, ou bien $\\ps{F_i'(u)}{\\bar w}=0$ et $F_i$ est affine (2.45).<\/p>", "res:2.5.17": "<b>Théorème 2.5.17<\/b> <p>On suppose que $K$ est donné par (2.44), que $J,F_1,\\dots,F_M$ sont dérivables en $u$ et que les contraintes sont qualifiées en $u$. Alors, si $u$ est un minimum local de $J$ sur $K$, il existe $\\lambda_1,\\dots,\\lambda_M\\ge0$, appelés multiplicateurs de Lagrange, tels que<\/p>\n$$J'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0,\\qquad\\lambda_i\\ge0,\\qquad\\lambda_i=0\\ \\text{si}\\ F_i(u)\\lt0. \\tag{2.46}$$", "res:2.5.19": "<b>Lemme 2.5.19<\/b> (de Farkas) <p>Soient $a_1,\\dots,a_M\\in V$, $\\mathsf K=\\{w\\in V,\\ \\ps{a_i}{w}\\le0,\\ 1\\le i\\le M\\}$ et $\\hat{\\mathsf K}=\\{q\\in V,\\ \\exists\\lambda_1,\\dots,\\lambda_M\\ge0,\\ q=-\\sum_i\\lambda_ia_i\\}$. Alors, pour tout <span class=\"nw\">$p\\in V$ :<\/span> $\\ \\ps{p}{w}\\ge0\\ \\ \\forall w\\in\\mathsf K\\ \\Longrightarrow\\ p\\in\\hat{\\mathsf K}$. (La réciproque est évidente : c'est une équivalence.)<\/p>", "res:2.5.20": "<b>Définition 2.5.20<\/b> <p>Le Lagrangien du problème de minimisation de $J$ sous $F(v)\\le0$ est $\\Lag(v,\\mu)=J(v)+\\sum_{i=1}^M\\mu_iF_i(v)=J(v)+\\mu\\cdot F(v)$ pour $(v,\\mu)\\in V\\times(\\R^+)^M$. La variable positive $\\mu$ est le multiplicateur de Lagrange.<\/p>", "res:2.5.21": "<b>Lemme 2.5.21<\/b> <p>$\\displaystyle\\inf_{v\\in V,\\,F(v)\\le0}J(v)=\\inf_{v\\in V}\\ \\sup_{\\mu\\in(\\R^+)^M}\\Lag(v,\\mu)$ (2.52).<\/p>", "res:2.5.23": "<b>Définition 2.5.23<\/b> <p>Les contraintes (2.53) sont qualifiées en $u\\in K$ si et seulement si les $\\big(G_i'(u)\\big)_{1\\le i\\le N}$ sont linéairement indépendants et s'il existe $\\bar w\\in\\bigcap_{i=1}^N[G_i'(u)]^\\perp$ tel que $\\ps{F_i'(u)}{\\bar w}\\lt0$ pour tout $i\\in I(u)$ (2.54).<\/p>", "res:2.5.24": "<b>Théorème 2.5.24<\/b> <p>Soit $u\\in K$. On suppose $J$ et $F$ dérivables en $u$, $G$ dérivable dans un voisinage de $u$, et les contraintes qualifiées en $u$. Alors, si $u$ est un minimum local de $J$ sur $K$, il existe $\\mu_1,\\dots,\\mu_N\\in\\R$ et $\\lambda_1,\\dots,\\lambda_M\\ge0$ tels que<\/p>\n$$J'(u)+\\sum_{i=1}^N\\mu_iG_i'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0,\\qquad\\lambda\\ge0,\\ F(u)\\le0,\\ \\lambda\\cdot F(u)=0. \\tag{2.55}$$", "res:2.6.1": "<b>Définition 2.6.1<\/b> <p>$(u,p)\\in U\\times P$ est un <strong>point-selle<\/strong> de $\\Lag$ sur $U\\times P$ si $\\ \\forall q\\in P,\\ \\ \\Lag(u,q)\\le\\Lag(u,p)\\le\\Lag(v,p)\\ \\ \\forall v\\in U$ (2.59).<\/p>", "res:2.6.2": "<b>Proposition 2.6.2<\/b> <p>On suppose $J,F_1,\\dots,F_M$ continues sur $V$, $K$ défini par (2.36) ou (2.44), $P=\\R^M$ ou $(\\R^+)^M$ selon le cas, $U$ un ouvert contenant $K$ et $\\Lag(v,q)=J(v)+q\\cdot F(v)$. Si $(u,p)$ est un point-selle de $\\Lag$ sur $U\\times P$, alors $u\\in K$ et $u$ est un <strong>minimum global<\/strong> de $J$ sur $K$. Si de plus $J,F_i$ sont dérivables en $u$, alors $J'(u)+\\sum_ip_iF_i'(u)=0$ (2.60).<\/p>", "res:2.6.4": "<b>Théorème 2.6.4<\/b> (de Kuhn et Tucker) <p>On suppose $J,F_1,\\dots,F_M$ convexes continues sur $V$ et dérivables sur $K$ (2.62). Soit $u\\in K$ un point où les contraintes sont qualifiées (Déf. 2.5.15). Alors $u$ est un minimum global de $J$ sur $K$ si et seulement s'il existe $p\\in(\\R^+)^M$ tel que $(u,p)$ soit un point-selle de $\\Lag$ sur $V\\times(\\R^+)^M$, ou de manière équivalente tel que<\/p>\n$$F(u)\\le0,\\quad p\\ge0,\\quad p\\cdot F(u)=0,\\quad J'(u)+\\sum_{i=1}^Mp_iF_i'(u)=0. \\tag{2.63}$$", "res:2.6.6": "<b>Lemme 2.6.6<\/b> <p>Sous les hypothèses du Théorème 2.6.4, si (2.64) a une solution unique $u_\\ell$ pour $\\ell$ petit et si $J_{\\min}$ est différentiable en 0, alors, avec $\\lambda$ le multiplicateur de la solution $u$ pour <span class=\"nw\">$\\ell=0$ :<\/span> $\\lambda_i=-\\dfrac{\\partial J_{\\min}}{\\partial\\ell_i}(0)$.<\/p>", "res:2.6.7": "<b>Définition 2.6.7<\/b> <p>Soit $\\Lag$ défini sur $U\\times P$, possédant un point-selle $(u,p)$ (2.67). Pour $v\\in U$ et $q\\in P$, on pose<\/p>\n$$\\mathcal J(v)=\\sup_{q\\in P}\\Lag(v,q),\\qquad\\mathcal G(q)=\\inf_{v\\in U}\\Lag(v,q). \\tag{2.68}$$\n<p>Le <strong>problème primal<\/strong> est $\\inf_{v\\in U}\\mathcal J(v)$ (2.69), le <strong>problème dual<\/strong> $\\sup_{q\\in P}\\mathcal G(q)$ (2.70).<\/p>", "res:2.6.9": "<b>Théorème 2.6.9<\/b> (de dualité) <p>Le couple $(u,p)$ est un point-selle de $\\Lag$ sur $U\\times P$ si et seulement si $\\ \\mathcal J(u)=\\min_{v\\in U}\\mathcal J(v)=\\max_{q\\in P}\\mathcal G(q)=\\mathcal G(p)$ (2.71).<\/p>", "res:2.6.12": "<b>Corollaire 2.6.12<\/b> <p>On suppose $J,F_1,\\dots,F_M$ convexes et dérivables sur $V$. Soit $u$ avec $F(u)\\le0$ et les contraintes qualifiées en $u$. Si $u$ est un minimum global de $J$ sur $K$, il existe $p\\in(\\R^+)^M$ tel que : 1. $p$ est un maximum global de $\\mathcal G$ sur <span class=\"nw\">$(\\R^+)^M$ ;<\/span> 2. $(u,p)$ est un point-selle de $\\Lag$ sur <span class=\"nw\">$V\\times(\\R^+)^M$ ;<\/span> 3. $F(u)\\le0$, $p\\ge0$, $p\\cdot F(u)=0$, $J'(u)+p\\cdot F'(u)=0$ (2.78).<\/p>", "res:3.2.1": "<b>Théorème 3.2.1<\/b> <p>On suppose $J$ α-convexe différentiable et $J'$ lipschitzien sur tout borné de <span class=\"nw\">$V$ :<\/span> $\\forall M\\gt0,\\ \\exists L_M\\gt0,\\ \\norm{v}+\\norm{w}\\le M\\Rightarrow\\norm{J'(v)-J'(w)}\\le L_M\\norm{v-w}$ (3.5). Alors l'algorithme de gradient à pas optimal converge : quel que soit $u^0$, $(u^n)$ converge vers la solution $u$ de (3.1).<\/p>", "res:3.2.6": "<b>Théorème 3.2.6<\/b> <p>On suppose $J$ α-convexe différentiable et $J'$ lipschitzien sur <span class=\"nw\">$V$ :<\/span> $\\norm{J'(v)-J'(w)}\\le L\\norm{v-w}$ (3.9). Alors, si $0\\lt\\mu\\lt2\\alpha/L^2$, l'algorithme de gradient à pas fixe converge : quel que soit $u^0$, $(u^n)$ converge vers $u$ et<\/p>\n$$\\norm{u^n-u}\\le\\gamma^n\\norm{u^0-u},\\qquad\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}\\lt1 .$$", "res:3.2.9": "<b>Proposition 3.2.9<\/b> <p>Soit $J$ définie sur $V=\\R^N$, strictement convexe, différentiable, infinie à l'infini, de dérivée $L$-lipschitzienne. Si $0\\lt\\mu\\lt2/L$, l'algorithme de gradient à pas fixe converge vers la solution $u$ de (3.1).<\/p>", "res:3.2.10": "<b>Lemme 3.2.10<\/b> <p>Soit $J$ différentiable, de dérivée $L$-lipschitzienne, $v\\in V$ et $v^*=v-\\mu J'(v)$. Alors $J(v)-J(v^*)\\ge\\mu\\big(1-\\frac{L\\mu}2\\big)\\norm{J'(v)}^2$.<\/p>", "res:3.3.1": "<b>Proposition 3.3.1<\/b> <p>On ajoute aux hypothèses du Théorème 3.2.6 que $V=\\R^N$ et que $J$ est de classe $C^2$. Alors l'algorithme de gradient à pas fixe converge pour $0\\lt\\mu\\lt2/L$, et la vitesse optimale s'obtient pour <span class=\"nw\">$\\mu_{opt}=2/(L+\\alpha)$ :<\/span><\/p>\n$$\\norm{u^n-u}\\le\\gamma_{opt}^n\\norm{u^0-u},\\qquad\\gamma_{opt}=\\frac{1-\\alpha/L}{1+\\alpha/L}\\lt1 .$$", "res:3.3.3": "<b>Proposition 3.3.3<\/b> <p>Soit $J$ sur $\\R^N$ strictement convexe, $C^2$, infinie à l'infini, de dérivée $L$-lipschitzienne. Pour $0\\lt\\mu\\lt2/L$, le gradient à pas fixe converge et $0\\le J(u^n)-J(u)\\le\\frac{\\kappa}{n+1}$ avec $\\kappa=\\frac{\\norm{u^0-u}^2}{\\mu(1-L\\mu/2)}$.<\/p>", "res:3.3.5": "<b>Lemme 3.3.5<\/b> (co-coercivité) <p>Sous ces hypothèses, $\\norm{J'(v)-J'(w)}^2\\le L\\ps{J'(v)-J'(w)}{v-w}$ pour tous $v,w$.<\/p>", "res:3.3.7": "<b>Proposition 3.3.7<\/b> <p>Soit $J$ convexe différentiable, de dérivée $L$-lipschitzienne, possédant un minimum $u$, et $0\\lt\\mu\\le1/L$. Alors $0\\le J(u^n)-J(u)\\le\\frac\\kappa{(n+2)^2}$ avec $\\kappa=2\\mu^{-1}\\norm{u^0-u}^2+4\\big(J(u^0)-J(u)\\big)$.<\/p>", "res:3.3.10": "<b>Proposition 3.3.10<\/b> <p>Si $J$ est α-convexe à dérivée $L$-lipschitzienne et $0\\lt\\mu\\le1/L$, la suite (3.19) converge vers $u$, et pour <span class=\"nw\">$\\mu=1/L$ :<\/span> $\\norm{u^n-u}\\le\\frac2\\alpha\\gamma_{Nest}^n\\norm{u^0-u}$ avec $\\gamma_{Nest}=1-\\sqrt{\\alpha/L}$.<\/p>", "res:3.3.15": "<b>Théorème 3.3.15<\/b> <p>Soit $J$ convexe de classe $C^2$ sur $\\R^N$ avec $\\alpha\\,\\Id\\le J''(u)\\le L\\,\\Id$. Si $u^1,u^0$ sont assez proches du minimum $u$, pour $0\\le\\nu\\lt1$ et $0\\lt\\mu\\lt2(1+\\nu)/L$ l'algorithme converge ; pour $\\nu=\\big(\\frac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}\\big)^2$ et $\\mu=\\frac4{(\\sqrt L+\\sqrt\\alpha)^2}$, il existe $C$ avec $\\norm{u^n-u}\\le C\\gamma_{BP}^n\\norm{u^0-u}$, $\\gamma_{BP}=\\frac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}$.<\/p>", "res:3.3.17": "<b>Proposition 3.3.17<\/b> (admise) <p>Pour $A$ symétrique définie positive de valeurs propres $0\\lt\\lambda_1\\le\\dots\\le\\lambda_N$ et $x$ solution de <span class=\"nw\">$Ax=b$ :<\/span> $\\ \\norm{x_n-x}_2\\le2\\sqrt{\\lambda_N/\\lambda_1}\\Big(\\frac{1-\\sqrt{\\lambda_1/\\lambda_N}}{1+\\sqrt{\\lambda_1/\\lambda_N}}\\Big)^n\\norm{x_0-x}_2$.<\/p>", "res:3.3.19": "<b>Définition 3.3.19<\/b> <p>Si $J$ est convexe de $\\R^n$ dans $\\R$, le sous-différentiel de $J$ en $x$ est $\\partial J(x)=\\{p\\in\\R^n\\ |\\ J(y)-J(x)\\ge p\\cdot(y-x),\\ \\forall y\\in\\R^n\\}$ (3.36) ; ses éléments sont les sous-gradients.<\/p>", "res:3.3.20": "<b>Lemme 3.3.20<\/b> <p>Si $0\\in\\partial J(x)$, alors $x$ est un point de minimum de $J$.<\/p>", "res:3.3.21": "<b>Lemme 3.3.21<\/b> <p>Soit $\\mathcal J(x)=\\sup_{\\lambda\\in\\Lambda}J_\\lambda(x)$ (3.37), $\\Lambda$ fini, $J_\\lambda$ convexes différentiables, et $\\Gamma(x)=\\{\\lambda,\\ J_\\lambda(x)=\\mathcal J(x)\\}$. Pour tout $\\lambda\\in\\Gamma(x)$, $J_\\lambda'(x)$ est un sous-gradient de $\\mathcal J$ en $x$.<\/p>", "res:3.3.23": "<b>Proposition 3.3.23<\/b> <p>Soit $J$ convexe, infinie à l'infini, admettant en tout point un sous-différentiel non vide et localement lipschitzienne : $\\forall M\\gt0,\\ \\exists L_M,\\ \\norm{x}+\\norm{y}\\le M\\Rightarrow|J(x)-J(y)|\\le L_M\\norm{x-y}$. Si les pas vérifient (3.39), l'algorithme du sous-gradient converge.<\/p>", "res:3.3.28": "<b>Proposition 3.3.28<\/b> <p>Si $F$ est α-convexe et $\\frac1n\\sum_i\\norm{f_i'(x)}^2\\le C(1+\\norm{x-x^*}^2)$ (3.44), avec $x^*$ le minimum, alors pour $\\mu^k=\\frac1{k+1}$ l'algorithme converge en moyenne.<\/p>", "res:3.3.32": "<b>Lemme 3.3.32<\/b> <p>Soit $J$ convexe différentiable sur $\\R^n$ d'unique minimum $x^*$, $\\tau\\gt0$, et $x^{k+1}=\\prox_{\\tau J}(x^k)$. Alors <span class=\"nw\">$x^k\\to x^*$ ;<\/span> si de plus $J$ est α-convexe, $\\norm{x^k-x^*}^2\\le\\norm{x^0-x^*}^2\\frac1{(1+2\\tau\\alpha)^k}$.<\/p>", "res:3.4.1": "<b>Théorème 3.4.1<\/b> <p>On suppose $J$ α-convexe différentiable et $J'$ lipschitzien de constante $L$. Si $0\\lt\\mu\\lt2\\alpha/L^2$, l'algorithme de gradient à pas fixe avec projection converge : quel que soit $u^0\\in K$, $(u^n)$ converge vers la solution $u$ de (3.55).<\/p>", "res:3.4.3": "<b>Théorème 3.4.3<\/b> <p>On suppose $J$ α-convexe différentiable et $F$ convexe et lipschitzienne de $V$ dans <span class=\"nw\">$\\R^M$ :<\/span> $\\norm{F(v)-F(w)}\\le L\\norm{v-w}$ (3.67). Si $0\\lt\\mu\\lt2\\alpha/L^2$, l'algorithme d'Uzawa converge : quel que soit $p^0$, la suite $(u^n)$ converge vers la solution $u$ de (3.62).<\/p>", "res:3.4.4": "<b>Théorème 3.4.4<\/b> <p>Si $J$ est α-convexe différentiable, $F$ convexe différentiable de dérivée bornée par $C_F$, et $v\\mapsto J'(v)+p\\cdot F'(v)$ $L$-lipschitzienne pour tout $p\\ge0$, alors il existe un point-selle $(u,p)$, $u$ est l'unique solution, et pour le pas $\\mu_n=\\frac{\\alpha\\gamma\\norm{u^n-u}^2}{C^2(\\norm{u^n-u}^2+\\norm{p^n-p}^2)}$ avec $0\\lt\\gamma\\lt1$ et $C^2=\\max(2L^2+C_F^2,2C_F^2)$, l'algorithme converge : $u^n\\to u$.<\/p>", "res:3.4.5": "<b>Lemme 3.4.5<\/b> <p>Si $J,F$ sont convexes différentiables, $J$ α-convexe, et $(u,p)$ un point-selle, alors pour tout <span class=\"nw\">$(v,q)$ :<\/span> $\\frac\\alpha2\\norm{u-v}^2\\le\\ps{\\frac{\\partial\\Lag}{\\partial v}(v,q)}{v-u}-\\frac{\\partial\\Lag}{\\partial q}(v,q)\\cdot(q-p)$.<\/p>", "res:3.4.6": "<b>Proposition 3.4.6<\/b> <p>On suppose $J$ continue, strictement convexe et infinie à l'infini, les $F_i$ convexes continues, et $K=\\{v,\\ F_i(v)\\le0\\ \\forall i\\}$ non vide. Si $u$ est l'unique solution de (3.78) et $u_\\eps$ l'unique solution de (3.79), alors $\\lim_{\\eps\\to0}u_\\eps=u$.<\/p>", "res:3.4.8": "<b>Lemme 3.4.8<\/b> <p>$J,F$ de classe $C^2$, $v^*$ minimum local de (3.83) avec $F'(v^*)$ de rang $M$, $\\lambda^*$ son multiplicateur, et la condition suffisante d'ordre 2 : $\\big(J''(v^*)+\\lambda^*\\cdot F''(v^*)\\big)(w,w)\\gt0$ pour tout $w\\in\\Ker F'(v^*)\\setminus\\{0\\}$ (3.88). Alors il existe $\\mu_0$ tel que pour tout $\\mu\\ge\\mu_0$, $v^*$ est un minimum local <em>sans contrainte<\/em> de $v\\mapsto\\Lag_{aug}(v,\\lambda^*,\\mu)$.<\/p>", "res:3.5.1": "<b>Proposition 3.5.1<\/b> <p>Soit $F$ de classe $C^2$ de $\\R^N$ dans $\\R^N$ et $u$ un zéro régulier. Il existe $\\eps\\gt0$ et $0\\lt C\\lt1/\\eps$ tels que, si $\\norm{u-u^0}\\le\\eps$, la méthode de Newton converge :<\/p>\n$$\\norm{u^{n+1}-u}\\le C\\norm{u^n-u}^2\\qquad\\text{et}\\qquad\\norm{u^n-u}\\le C^{-1}(C\\eps)^{2^n}. \\tag{3.92}$$", "res:3.6.1": "<b>Lemme 3.6.1<\/b> <p>Sans contrainte, avec l'approximation $J_{n-1}(v)=J(v^{n-1})+J'(v^{n-1})\\cdot(v-v^{n-1})+\\frac1{2\\mu}\\norm{v-v^{n-1}}^2$ (3.102), la méthode des approximations successives est exactement le gradient à pas fixe $\\mu$.<\/p>", "res:3.7.6": "<b>Proposition 3.7.6<\/b> <p>Sous (H), $\\tilde J$ est différentiable et $\\ \\tilde J'(v)=\\frac{\\partial J}{\\partial v}(v,y(v))+\\Big\\langle p(v),\\frac{\\partial F}{\\partial v}(v,y(v))\\Big\\rangle$ (3.116).<\/p>", "res:2.2.2": "<b>Remarque 2.2.2<\/b> La propriété (2.2), qui assure que toute suite minimisante est bornée, est automatiquement vérifiée si $K$ est borné. Sinon, elle exprime que $J$ est infinie à l'infini dans $K$.", "res:2.3.3": "<b>Remarque 2.3.3<\/b> L'épigraphe de $J$ est $\\mathrm{Epi}(J)=\\{(\\lambda,v)\\in\\R\\times K,\\ \\lambda\\ge J(v)\\}$ ; $J$ est convexe si et seulement si $\\mathrm{Epi}(J)$ est une partie convexe de $\\R\\times V$.", "res:2.3.10": "<b>Remarque 2.3.10<\/b> Contrairement au Théorème 2.3.8, rien sur l'unicité ni sur l'estimation d'erreur (2.14), qui sera pourtant précieuse pour les algorithmes.", "res:2.3.11": "<b>Remarque 2.3.11<\/b> Le théorème reste vrai dans un Banach réflexif.", "res:2.4.2": "<b>Remarque 2.4.2<\/b> Dans un Hilbert, le théorème de Riesz fournit un unique $p\\in V$ avec $\\ps{p}{w}=L(w)$, d'où $J(u+w)=J(u)+\\ps{p}{w}+o(w)$ (2.16) ; on note aussi $p=J'(u)$, « ce qui peut prêter à confusion ». En pratique on calcule $L$, rarement $p$.", "res:2.4.3": "<b>Remarque 2.4.3<\/b> La dérivée de Gâteaux (directionnelle) demande seulement $\\lim_{\\delta\\to0^+}\\frac{J(u+\\delta w)-J(u)}\\delta=L(w)$ pour tout $w$ (2.18). Fréchet implique Gâteaux ; la réciproque est fausse même dans <span class=\"nw\">$\\R^2$ :<\/span> $J(x,y)=\\frac{x^6}{(y-x^2)^2+x^8}$, $J(0,0)=0$.", "res:2.4.6": "<b>Remarque 2.4.6<\/b> (2.20) et (2.23) disent que $J$ est au-dessus de son plan tangent ; (2.21) et (2.24) sont des propriétés de monotonie de $J'$. Pour $J=\\frac12a(u,u)-L(u)$, (2.24) est exactement la coercivité de $a$.", "res:2.4.11": "<b>Remarque 2.4.11<\/b> Toute fonction à dérivée lipschitzienne est majorée par une quadratique ; une fonction fortement convexe est minorée par une quadratique (2.23) de même partie affine. Une fonction α-convexe à dérivée lipschitzienne est donc encadrée par deux quadratiques tangentes en $u$ — propriété exploitée dans toutes les preuves de convergence.", "res:2.5.2": "<b>Remarque 2.5.2<\/b> (2.29) est une condition nécessaire, nécessaire et suffisante si $J$ est convexe : la dérivée directionnelle dans toute direction rentrante est positive. Si $K=V$, ou si $u$ est intérieur à $K$, elle se réduit à l'équation d'Euler $J'(u)=0$.", "res:2.5.8": "<b>Remarque 2.5.8<\/b> Si les $F_i'(u)$ sont libres, on parle de <strong>cas régulier<\/strong>. Sinon la conclusion peut être fausse : $V=\\R$, $F(v)=v^2$, <span class=\"nw\">$J(v)=v$ ;<\/span> alors $K=\\{0\\}$, $u=0$, $F'(u)=0$ et <span class=\"nw\">$J'(u)=1$ :<\/span> (2.37) n'a pas lieu.", "res:2.5.11": "<b>Remarque 2.5.11<\/b> Ce n'est pas un jeu d'écriture : les algorithmes itératifs ne peuvent pas garantir $F(u^n)=0$. Si $F(u^n)\\gt0$ (une contrainte), on choisit $\\mu^n\\gt0$ et la minimisation de $\\Lag(v,\\mu^n)$ fait baisser $J$ <em>et<\/em> <span class=\"nw\">$F$ ;<\/span> si $F(u^n)\\lt0$, on choisit $\\mu^n\\lt0$. C'est le principe d'Uzawa (section 3.4.2).", "res:2.5.16": "<b>Remarque 2.5.16<\/b> $\\bar w$ est une « direction rentrante » : $u+\\eps\\bar w\\in K$ pour $\\eps\\ge0$ petit. Si toutes les $F_i$ sont affines, $\\bar w=0$ convient : les contraintes affines sont toujours qualifiées.", "res:2.5.18": "<b>Remarque 2.5.18<\/b> Forme équivalente : $J'(u)+\\sum\\lambda_iF_i'(u)=0$, $\\lambda\\ge0$, <span class=\"nw\">$\\lambda\\cdot F(u)=0$ ;<\/span> cette dernière égalité est la condition des <strong>écarts complémentaires<\/strong>.", "res:2.5.22": "<b>Remarque 2.5.22<\/b> Algorithmiquement : si $F(u^n)\\le0$ est violée, on prend $\\mu^n\\ge0$ positif sur les contraintes violées et nul sur les inactives ; minimiser $\\Lag(v,\\mu^n)$ réduit à la fois $J$ et la violation (Uzawa, 3.4.2).", "res:2.5.25": "<b>Remarque 2.5.25<\/b> (gradients actifs libres) Si $(F_i'(u))_{i\\in I(u)}$ est une famille libre (2.56), les contraintes sont qualifiées : on prend $\\bar w=\\sum_{i\\in I(u)}\\alpha_iF_i'(u)$ avec $\\ps{F_j'(u)}{\\bar w}=-1$ pour tout $j\\in I(u)$, ce qui est possible car la matrice de Gram $(\\ps{F_i'(u)}{F_j'(u)})_{ij}$ est inversible. La réciproque est fausse.", "res:2.5.26": "<b>Remarque 2.5.26<\/b> (cas mixte) Si $(G_i'(u))_{1\\le i\\le N}\\cup(F_i'(u))_{i\\in I(u)}$ est libre (2.57), les contraintes (2.53) sont qualifiées au sens de 2.5.23.", "res:2.5.27": "<b>Remarque 2.5.27<\/b> (contraintes convexes, type Slater) Si les $F_i$ sont convexes et s'il existe $v\\in V$ avec, pour tout $i$, $F_i(v)\\lt0$, ou bien $F_i(v)=0$ et $F_i$ affine (2.58), alors les contraintes sont qualifiées en tout $u\\in K$, avec <span class=\"nw\">$\\bar w=v-u$ :<\/span> pour $i\\in I(u)$, $\\ps{F_i'(u)}{v-u}=F_i(u)+\\ps{F_i'(u)}{v-u}\\le F_i(v)$ par (2.20).", "res:2.6.3": "<b>Remarque 2.6.3<\/b> $K$ est alors convexe fermé, et le Théorème 2.3.9 donne l'existence d'un minimum dès que $K\\ne\\emptyset$ et que $J$ est infinie à l'infini.", "res:2.6.5": "<b>Remarque 2.6.5<\/b> Le théorème ne s'applique qu'aux inégalités ; mais des égalités <em>affines<\/em> $Av=b$ s'écrivent $Av-b\\le0$ et $b-Av\\le0$, affines donc convexes.", "res:2.6.8": "<b>Remarque 2.6.8<\/b> $\\mathcal J$ peut valoir $+\\infty$ et $\\mathcal G$ valoir $-\\infty$ par endroits ; l'existence du point-selle garantit que leurs domaines ne sont pas vides, car $\\mathcal J(u)=\\mathcal G(p)=\\Lag(u,p)$.", "res:2.6.10": "<b>Remarque 2.6.10<\/b> (2.71) s'écrit $\\min_v\\sup_q\\Lag=\\max_q\\inf_v\\Lag$ : on peut échanger min et max — d'où le nom de <em>min-max<\/em>. C'est faux sans point-selle.", "res:2.6.11": "<b>Remarque 2.6.11<\/b> (dualité faible) Même sans point-selle, $\\inf_{v\\in U}\\sup_{q\\in P}\\Lag(v,q)\\ge\\sup_{q\\in P}\\inf_{v\\in U}\\Lag(v,q)$ (2.75). La différence, positive, est le <strong>saut de dualité<\/strong>.", "res:2.6.13": "<b>Remarque 2.6.13<\/b> (le dual d'un problème quadratique) Pour $\\min_{Bv-c\\le0}\\frac12Av\\cdot v-b\\cdot v$ ($A$ symétrique définie positive, $B$ de taille $M\\times N$) : $\\Lag(\\cdot,q)$ est fortement convexe, minimale en $v=A^{-1}(b-B^*q)$, et le dual s'écrit\n$$\\sup_{q\\ge0}\\Big(-\\frac12q\\cdot BA^{-1}B^*q+(BA^{-1}b-c)\\cdot q-\\frac12A^{-1}b\\cdot b\\Big). \\tag{2.81}$$\nEncore quadratique à contraintes affines, mais les contraintes $q\\ge0$ sont triviales à projeter ; la solution est unique si $B$ est de rang $M$.", "res:2.6.14": "<b>Remarque 2.6.14<\/b> (variables d'écart) On peut aussi remplacer $F_i(v)\\le0$ par $F_i(v)+z_i=0$, <span class=\"nw\">$z_i\\ge0$ :<\/span> peu économe (plus de variables et de contraintes), mais c'est l'idée reprise en programmation linéaire.", "res:3.1.1": "<b>Remarque 3.1.1<\/b> Le livre se limite aux algorithmes déterministes utilisant des dérivées. Les algorithmes stochastiques (recuit simulé, génétiques) visent des minima globaux de fonctions non convexes, à un prix élevé ; les méthodes sans dérivées sont peu efficaces.", "res:3.2.3": "<b>Remarque 3.2.3<\/b> Un algorithme « converge » s'il converge <em>quelle que soit l'initialisation<\/em> <span class=\"nw\">$u^0$ :<\/span> une théorie sous conditions sur $u^0$ serait ruinée par les erreurs d'arrondi.", "res:3.2.2": "<b>Remarque 3.2.2<\/b> Si $J$ est de classe $C^2$, (3.5) est automatique.", "res:3.2.4": "<b>Remarque 3.2.4<\/b> (préconditionnement) Pour $P$ symétrique définie positive, $PJ'(u^n)$ est aussi une direction de descente : $J(u^{n+1})=J(u^n)-\\mu_n\\ps{PJ'(u^n)}{J'(u^n)}+o(\\mu_n)\\lt J(u^n)$. Choisir $P$ revient à changer le produit scalaire qui définit le gradient ; utile quand les composantes ont des échelles très différentes.", "res:3.2.5": "<b>Remarque 3.2.5<\/b> (recherche linéaire) En pratique on se contente d'un pas qui fait « suffisamment » décroître <span class=\"nw\">$j$ :<\/span> règle d'Armijo–Goldstein $-p^-j'(0)\\tilde\\mu^n\\le j(0)-j(\\tilde\\mu^n)\\le-p^+j'(0)\\tilde\\mu^n$ avec <span class=\"nw\">$0\\lt p^-\\lt p^+\\lt1$ ;<\/span> ou règle de Wolfe.", "res:3.2.7": "<b>Remarque 3.2.7<\/b> Plus simple que le pas optimal (pas de recherche linéaire), mais on connaît rarement α et $L$, donc on ne sait pas a priori si $\\mu$ est assez petit.", "res:3.2.8": "<b>Remarque 3.2.8<\/b> Convergence géométrique : $\\norm{u^n-u}^{1/n}\\le\\gamma\\lt1$. Le meilleur pas pour cette borne est $\\mu=\\alpha/L^2$, qui donne $\\gamma=\\sqrt{1-\\alpha^2/L^2}$ — mais ce n'est pas la vitesse optimale du gradient à pas fixe, car la preuve a privilégié la simplicité : la Proposition 3.3.1 fait mieux.", "res:3.2.11": "<b>Remarque 3.2.11<\/b> Le lemme garantit la décroissance d'un pas de gradient <em>sans aucune hypothèse de convexité<\/em>.", "res:3.3.2": "<b>Remarque 3.3.2<\/b> D'après l'Exercice 3.2.5 (quadratique), on ne peut ni améliorer cette vitesse ni élargir l'intervalle <span class=\"nw\">$]0,2/L[$ :<\/span> elle est optimale.", "res:3.3.4": "<b>Remarque 3.3.4<\/b> La vitesse porte sur $J(u^n)-J(u)$, algébrique (en $1/n$) au lieu de géométrique ; rien n'est dit sur $\\norm{u^n-u}$, qui peut converger aussi lentement qu'on veut si $J$ est très plate près du minimum.", "res:3.3.6": "<b>Remarque 3.3.6<\/b> Toutes ces vitesses sont indépendantes de la dimension — précieux en très grande dimension. Mais le coût d'une itération en dépend (produit matrice-vecteur en $N^2$ pour une quadratique), et α, $L$ peuvent en dépendre de façon cachée (discrétisation d'une EDP).", "res:3.3.8": "<b>Remarque 3.3.8<\/b> $1/n^2$ au lieu de $1/n$ (Prop. 3.3.3) ; avec quelques hypothèses de plus, $u^n\\to u$ (<a href=\"#exo-3-3-1\">Ex. 3.3.1<\/a>).", "res:3.3.9": "<b>Remarque 3.3.9<\/b> (optimalité) Tous les algorithmes de gradient du livre vérifient $u^n\\in u^0+\\Vect\\{J'(u^0),\\dots,J'(u^{n-1})\\}$. Pour $J(v)=\\frac L8\\big((v_1-1)^2+\\sum_{i=2}^p(v_i-v_{i-1})^2+\\sum_{i\\gt p}v_i^2\\big)$ et $u^0=0$, l'information ne se propage que d'une composante par itération, d'où $J(u^n)-J(u)\\ge\\frac{L}{8(n+1)}$ jusqu'à <span class=\"nw\">$n=p$ :<\/span> à constante près, la borne en $1/n^2$ ne peut pas être améliorée pour les fonctions convexes.", "res:3.3.11": "<b>Remarque 3.3.11<\/b> Pour α/L petit, bien meilleur que le gradient : $1-\\sqrt{1/\\kappa}$ au lieu de $1-2/\\kappa$. $a_n\\to1/\\sqrt q$ et, pour $\\mu=1/L$, le coefficient d'extrapolation tend vers $\\frac{1-\\sqrt q}{1+\\sqrt q}$.", "res:3.3.16": "<b>Remarque 3.3.16<\/b> $\\gamma_{BP}=\\frac{1-\\sqrt{\\alpha/L}}{1+\\sqrt{\\alpha/L}}\\lt\\gamma_{Nest}=1-\\sqrt{\\alpha/L}$ : plus rapide encore, mais il faut connaître α et $L$ pour régler $\\mu$ et $\\nu$ — rarement le cas en pratique.", "res:3.3.22": "<b>Remarque 3.3.22<\/b> Ces fonctions « max » apparaissent dans la relaxation lagrangienne (optimisation combinatoire) et dans l'approche du pire des cas en optimisation robuste ($\\lambda$ = scénario incertain).", "res:3.3.24": "<b>Remarque 3.3.24<\/b> Les hypothèses sont vérifiées par les fonctions (3.37) avec $\\Lambda$ fini, les $J_\\lambda$ convexes différentiables et l'une infinie à l'infini.", "res:3.3.25": "<b>Remarque 3.3.25<\/b> Très lent : pour $\\rho_k=(k+1)^{-1/2-\\eps}$, $\\min_{k\\le i}J(x^k)-J(x^*)\\le C/i^{1/2-\\eps}$.", "res:3.3.26": "<b>Remarque 3.3.26<\/b> Pas de décroissance garantie : pour $\\mathcal J=\\max(J_1,J_2)$ en un point où $J_1=J_2$, le sous-gradient $J_1'(x)$ peut faire monter $J_2$, donc $\\mathcal J$.", "res:3.3.27": "<b>Remarque 3.3.27<\/b> On normalise <span class=\"nw\">$p^k$ :<\/span> la norme d'un sous-gradient ne dit rien de l'optimalité (tous les éléments de $[-1,1]$ sont sous-gradients de $|x|$ en 0).", "res:3.3.31": "<b>Remarque 3.3.31<\/b> (seuillage doux) Pour $A=\\Id$, le problème se découple : $x_i^*$ minimise $\\frac1{2\\tau}|x_i-b_i|^2+|x_i|$, d'où $x_i^*=S_\\tau(b_i)=0$ si $|b_i|\\lt\\tau$, et $b_i-\\sgn(b_i)\\tau$ sinon (3.49). Si la donnée est plus petite que le bruit $\\tau$, on la met à zéro.", "res:3.3.33": "<b>Remarque 3.3.33<\/b> Aucune condition de petitesse sur <span class=\"nw\">$\\tau$ :<\/span> c'est la signature des schémas implicites. Le résultat s'étend aux $J$ non dérivables via les sous-gradients.", "res:3.4.2": "<b>Remarque 3.4.2<\/b> Le gradient projeté est un algorithme <strong>faisable<\/strong> : chaque itéré est dans $K$. Les algorithmes suivants (Uzawa, pénalisation) sont <strong>infaisables<\/strong> : seule la limite vérifie les contraintes — bien plus faciles à mettre en œuvre.", "res:3.4.7": "<b>Remarque 3.4.7<\/b> (pénalisation intérieure) La méthode ci-dessus est <em>extérieure<\/em> : $u_\\eps$ viole en général les contraintes. La pénalisation intérieure minimise $J(v)-\\eps\\sum_i\\frac1{F_i(v)}$ sur $\\{F(v)\\lt0\\}$ (3.82) : la « barrière » empêche les itérés d'approcher $F_i=0$, et on fait $\\eps\\to0$ (fonction convexe sur ce domaine, <a href=\"#exo-3-4-4\">Ex. 3.4.4<\/a>).", "res:3.4.9": "<b>Remarque 3.4.9<\/b> Avec une bonne estimation du multiplicateur, une pénalisation <em>finie<\/em> suffit : pas besoin de $\\mu\\to\\infty$, donc pas de mauvais conditionnement. C'est ce qui rend la méthode plus robuste que la pénalisation.", "res:3.5.2": "<b>Remarque 3.5.2<\/b> La convergence quadratique a un prix : un système linéaire par itération, $F$ de classe $C^2$, $u^0$ proche de $u$. Newton peut diverger même dans $\\R$, ne converge que géométriquement vers un zéro non régulier ($F(x)=\\norm{x}^2$), et peut converger vers un maximum ou un col de $J$.", "res:3.5.3": "<b>Remarque 3.5.3<\/b> (quasi-Newton) Pour éviter de calculer $J''$, on approche $(F'(u^n))^{-1}$ par $S^n$ mis à jour par des corrections de rang 1 : $u^{n+1}=u^n-S^nF(u^n)$, $S^{n+1}=S^n+C^n$.", "res:3.5.4": "<b>Remarque 3.5.4<\/b> Approcher $J$ au lieu du Lagrangien (3.97) peut ne pas converger : c'est la Hessienne du Lagrangien — pas celle de $J$ — qui est positive sur l'espace tangent aux contraintes (Prop. 2.5.13).", "res:3.7.7": "<b>Remarque 3.7.7<\/b> Le gradient complet coûte un seul calcul supplémentaire (l'adjoint, un système avec $A^*$), au lieu de <span class=\"nw\">$N$ :<\/span> amélioration considérable en grande dimension. C'est le calcul qui se cache derrière l'identification paramétrique des diapos (Exemple 3).", "exo:2.2.1": "<b>Exercice 2.2.1<\/b> · Rôle des hypothèses d'existence <p>Montrer par des exemples que le fait que $K$ est fermé ou que $J$ est continue est en général nécessaire pour l'existence d'un minimum. Donner un exemple de fonction continue et minorée de $\\R$ dans $\\R$ n'admettant pas de minimum sur $\\R$.<\/p>", "exo:2.2.2": "<b>Exercice 2.2.2<\/b> · Affaiblir la condition infinie à l'infini <p>Montrer que l'on peut remplacer la propriété « infinie à l'infini » (2.2) par la condition plus faible<\/p>\n<p>$$\\inf_{v\\in K}J(v)\\lt\\lim_{R\\to+\\infty}\\Big(\\inf_{\\norm{v}\\ge R}J(v)\\Big).$$<\/p>", "exo:2.2.3": "<b>Exercice 2.2.3<\/b> · La semi-continuité inférieure suffit <p>Montrer que l'on peut remplacer la continuité de $J$ par la semi-continuité inférieure de $J$ définie par<\/p>\n<p>$$\\forall (u^n)_{n\\ge 0}\\ \\text{suite dans}\\ K,\\qquad \\lim_{n\\to+\\infty}u^n=u\\ \\Longrightarrow\\ \\liminf_{n\\to+\\infty}J(u^n)\\ge J(u).$$<\/p>", "exo:2.2.4": "<b>Exercice 2.2.4<\/b> · Existence pour deux exemples modèles <p>Montrer qu'il existe un minimum pour les Exemples 1.2.1 et 1.2.3.<\/p>", "exo:2.3.1": "<b>Exercice 2.3.1<\/b> · Opérations qui préservent la convexité <p>Soient $J_1$ et $J_2$ deux fonctions convexes sur $V$, $\\lambda\\gt 0$, et $\\varphi$ une fonction convexe croissante sur un intervalle de $\\R$ contenant l'ensemble $J_1(V)$. Montrer que $J_1+J_2$, $\\max(J_1,J_2)$, $\\lambda J_1$ et $\\varphi\\circ J_1$ sont convexes.<\/p>", "exo:2.3.2": "<b>Exercice 2.3.2<\/b> · Convexe égale sup de minorantes affines <p>Soit $(L_i)_{i\\in I}$ une famille (éventuellement infinie) de fonctions affines sur $V$. Montrer que $\\sup_{i\\in I}L_i$ est convexe sur $V$. Réciproquement, soit $J$ une fonction convexe continue sur $V$. Montrer que $J$ est égale au $\\sup_{L_i\\le J}L_i$ où les fonctions $L_i$ sont affines.<\/p>", "exo:2.3.3": "<b>Exercice 2.3.3<\/b> · Forte convexité testée au milieu <p>Soit $J$ une fonction localement bornée sur un ensemble convexe $K$ et $\\alpha\\gt 0$ tels que, pour tout $u,v\\in K$,<\/p>\n<p>$$J\\Big(\\frac{u+v}{2}\\Big)\\le\\frac{J(u)+J(v)}{2}-\\frac{\\alpha}{8}\\norm{u-v}^2.\\tag{2.10}$$<\/p>\n<p>Montrer que $J$ est fortement ou $\\alpha$-convexe.<\/p>", "exo:2.3.4": "<b>Exercice 2.3.4<\/b> · Forte convexité et partie quadratique <p>Montrer qu'une fonction $J$, définie sur un ensemble convexe $K$, est fortement ou $\\alpha$-convexe si et seulement si la fonction $J(v)-\\frac{\\alpha}{2}\\norm{v}^2$ est convexe sur $K$.<\/p>", "exo:2.3.5": "<b>Exercice 2.3.5<\/b> · Convexité d'une fonction quadratique <p>Soit $A$ une matrice symétrique d'ordre $N$ et $b\\in\\R^N$. Pour $x\\in\\R^N$, on pose $J(x)=\\frac12Ax\\cdot x-b\\cdot x$. Montrer que $J$ est convexe si et seulement si $A$ est semi-définie positive, et que $J$ est strictement convexe si et seulement si $A$ est définie positive. Dans ce dernier cas, montrer que $J$ est aussi fortement convexe et trouver la meilleure constante $\\alpha$.<\/p>", "exo:2.3.6": "<b>Exercice 2.3.6<\/b> · Fonctionnelle quadratique sur un Hilbert <p>Soit $V$ un espace de Hilbert (avec les notations usuelles pour son produit scalaire et sa norme). Soit $L(v)$ une forme linéaire continue sur $V$, et soit $a(u,v)$ une forme bilinéaire continue et symétrique sur $V\\times V$. Soit la fonction $J$ définie sur $V$ par<\/p>\n<p>$$J(v)=\\frac12a(v,v)-L(v).$$<\/p>\n<p>Montrer que $J$ est convexe sur $V$ si $a$ est positive, c'est-à-dire $a(v,v)\\ge 0$ pour tout $v\\in V$. Montrer que $J$ est fortement convexe sur $V$ si $a$ est coercive, c'est-à-dire s'il existe $C\\gt 0$ tel que $a(v,v)\\ge C\\norm{v}^2$ pour tout $v\\in V$.<\/p>", "exo:2.4.1": "<b>Exercice 2.4.1<\/b> · Continuité et encadrement au premier ordre <p>Montrer que (2.15) implique la continuité de $J$ en $u$. Montrer aussi que, si deux formes linéaires continues $L_1,L_2$ vérifient<\/p>\n<p>$$\\begin{cases} J(u+w)\\ge J(u)+L_1(w)+o(w),\\\\ J(u+w)\\le J(u)+L_2(w)+o(w),\\end{cases}\\tag{2.17}$$<\/p>\n<p>alors $J$ est dérivable et $L_1=L_2=J'(u)$.<\/p>", "exo:2.4.2": "<b>Exercice 2.4.2<\/b> · Dérivée d'une fonctionnelle quadratique <p>Soit $a$ une forme bilinéaire symétrique continue sur $V\\times V$. Soit $L$ une forme linéaire continue sur $V$. On pose $J(u)=\\frac12a(u,u)-L(u)$. Montrer que $J$ est dérivable sur $V$ et que $\\ps{J'(u)}{w}=a(u,w)-L(w)$ pour tout $u,w\\in V$.<\/p>", "exo:2.4.3": "<b>Exercice 2.4.3<\/b> · Gradient d'une quadratique matricielle <p>Soit $A$ une matrice symétrique $N\\times N$ et $b\\in\\R^N$. Pour $x\\in\\R^N$, on pose $J(x)=\\frac12Ax\\cdot x-b\\cdot x$. Montrer que $J$ est dérivable et que $J'(x)=Ax-b$ pour tout $x\\in\\R^N$.<\/p>", "exo:2.4.4": "<b>Exercice 2.4.4<\/b> · Gradient dans L² par identification <p>On reprend l'Exercice 2.4.2 avec $V=L^2(\\Omega)$ ($\\Omega$ étant un ouvert de $\\R^N$), $a(u,v)=\\int_\\Omega uv\\,dx$, et $L(u)=\\int_\\Omega fu\\,dx$ avec $f\\in L^2(\\Omega)$. En identifiant $V$ et $V'$, montrer que $J'(u)=u-f$.<\/p>", "exo:2.4.5": "<b>Exercice 2.4.5<\/b> · Stricte convexité et dérivée première <p>Montrer qu'une fonction $J$ dérivable sur $V$ est strictement convexe si et seulement si<\/p>\n<p>$$J(v)\\gt J(u)+\\ps{J'(u)}{v-u}\\qquad\\forall u,v\\in V\\ \\text{avec}\\ u\\neq v,$$<\/p>\n<p>ou encore<\/p>\n<p>$$\\ps{J'(u)-J'(v)}{u-v}\\gt 0\\qquad\\forall u,v\\in V\\ \\text{avec}\\ u\\neq v.$$<\/p>", "exo:2.4.6": "<b>Exercice 2.4.6<\/b> · Dérivée seconde d'une fonctionnelle quadratique <p>Soit $a$ une forme bilinéaire symétrique continue sur $V\\times V$. Soit $L$ une forme linéaire continue sur $V$. On pose $J(u)=\\frac12a(u,u)-L(u)$. Montrer que $J$ est deux fois dérivable sur $V$ et que $J''(u)(v,w)=a(v,w)$ pour tout $u,v,w\\in V$. Appliquer ce résultat aux exemples des Exercices 2.4.3, 2.4.4.<\/p>", "exo:2.4.7": "<b>Exercice 2.4.7<\/b> · Convexité et dérivée seconde <p>Montrer que si $J$ est deux fois dérivable sur $V$ les conditions des Propositions 2.4.4 et 2.4.5 sont respectivement équivalentes à<\/p>\n<p>$$J''(u)(w,w)\\ge 0\\quad\\text{et}\\quad J''(u)(w,w)\\ge\\alpha\\norm{w}^2\\qquad\\forall u,w\\in V.\\tag{2.28}$$<\/p>", "exo:2.4.8": "<b>Exercice 2.4.8<\/b> · Dérivée seconde bornée, gradient lipschitzien <p>Soit $J$ une fonction de classe $C^2$ de $V$ dans $\\R$. On suppose qu'il existe une constante $L\\gt 0$ telle que $J''(u)(w,w)\\le L\\norm{w}^2$ pour tout $u,w\\in V$. Montrer que $J'$ est Lipschitzienne de constante $L\\gt 0$.<\/p>", "exo:2.5.1": "<b>Exercice 2.5.1<\/b> · Projection sur un convexe fermé <p>Soit $K$ un convexe fermé non vide de $V$. Pour $x \\in V$, on cherche la projection $x_K \\in K$ de $x$ sur $K$ (voir le Théorème 5.1.3)\n$$\\norm{x - x_K} = \\min_{y \\in K} \\norm{x - y}.$$\nMontrer que la condition nécessaire et suffisante (2.29) se ramène exactement à (8.1).<\/p>\n<p><em>Rappels.<\/em> (2.29) : $\\ps{J'(u)}{v - u} \\ge 0$ pour tout $v \\in K$. (8.1) : $x_K \\in K$ et $\\ps{x - x_K}{y - x_K} \\le 0$ pour tout $y \\in K$.<\/p>", "exo:2.5.2": "<b>Exercice 2.5.2<\/b> · Moindres carrés : existence et unicité <p>On reprend l'Exemple 1.2.4 du problème « aux moindres carrés ». Montrer que ce problème admet toujours une solution et écrire l'équation d'Euler correspondante. Montrer aussi que la solution est unique si et seulement si $\\Ker A = \\{0\\}$.<\/p>\n<p><em>Rappel.<\/em> L'Exemple 1.2.4 est le problème $\\displaystyle\\min_{x \\in \\R^n} J(x) = \\norm{Ax - b}^2$, où $A$ est une matrice $p \\times n$, $b \\in \\R^p$ et $\\norm{\\cdot}$ la norme euclidienne.<\/p>", "exo:2.5.3": "<b>Exercice 2.5.3<\/b> · Quadratique sur un noyau, multiplicateur <p>On reprend l'Exemple 1.2.3\n$$\\inf_{x \\in \\Ker B}\\left\\{ J(x) = \\frac12 Ax\\cdot x - b\\cdot x \\right\\}$$\navec $A$ matrice symétrique carrée d'ordre $n$, et $B$ de taille $m \\times n$ ($m \\le n$). Montrer qu'il existe une solution si $A$ est positive et $b \\in (\\Ker A \\cap \\Ker B)^\\perp$, et qu'elle est unique si $A$ est définie positive. Montrer que tout point de minimum $\\overline{x} \\in \\R^n$ vérifie\n$$A\\overline{x} - b = B^*p \\quad \\text{avec } p \\in \\R^m .$$<\/p>", "exo:2.5.4": "<b>Exercice 2.5.4<\/b> · Problème de Dirichlet variationnel en 1D <p>On reprend l'Exemple 1.2.8 et on considère le problème d'optimisation\n$$\\inf_{u \\in K} J(u) = \\frac12\\int_0^L \\mu\\,|u'(x)|^2\\,dx - \\int_0^L f(x)\\,u(x)\\,dx,$$\noù $f(x)$ est une fonction continue sur $[0,L]$, $\\mu \\gt 0$ et $K$ est défini par\n$$K = \\{u \\in C^1[0,L] \\text{ tel que } u(0) = 0 \\text{ et } u(L) = 0\\}.$$\nVérifier que $K$ est convexe et calculer la dérivée directionnelle $J'(u)(w)$. Montrer que le point de minimum $u_* \\in K$ de $J$ (s'il existe et s'il est de classe $C^2$) vérifie la condition nécessaire suivante\n$$\\begin{cases} -\\mu\\,u_*''(x) = f(x) &amp; \\text{si } 0 \\lt x \\lt L, \\\\ u_*(0) = u_*(L) = 0. \\end{cases}$$\nEn déduire une formule pour ce point de minimum et donc qu'il est unique.<\/p>", "exo:2.5.5": "<b>Exercice 2.5.5<\/b> · Inéquation variationnelle et minimisation <p>Soit $K$ un convexe fermé non vide de $V$, soit $a$ une forme bilinéaire symétrique continue coercive sur $V$, et soit $L$ une forme linéaire continue sur $V$. Montrer que $J(v) = \\frac12 a(v,v) - L(v)$ admet un unique point de minimum dans $K$, noté $u$. Montrer que $u$ est aussi l'unique solution du problème (appelé inéquation variationnelle)\n$$u \\in K \\quad \\text{et} \\quad a(u, v - u) \\ge L(v - u) \\quad \\forall v \\in K .$$<\/p>", "exo:2.5.6": "<b>Exercice 2.5.6<\/b> · Euler avec une partie non dérivable <p>Soit $J_1$ et $J_2$ deux fonctions convexes continues sur une partie convexe fermée non vide $K \\subset V$. On suppose que $J_1$ seulement est dérivable. Montrer que $u \\in K$ est un minimum de $J_1 + J_2$ si et seulement si\n$$\\ps{J_1'(u)}{v - u} + J_2(v) - J_2(u) \\ge 0 \\quad \\forall v \\in K .$$<\/p>", "exo:2.5.7": "<b>Exercice 2.5.7<\/b> · Sous-espace affine et multiplicateurs de Lagrange <p>On suppose que $K$ est un sous-espace affine fermé de $V$, $K = u_0 + \\mathcal{P}$, avec $u_0 \\in V$, où on suppose aussi que $\\mathcal{P}$ est un sous-espace vectoriel fermé de $V$, défini comme une intersection finie d'hyperplans, c'est-à-dire que\n$$\\mathcal{P} = \\{v \\in V, \\ \\ps{a_i}{v} = 0 \\text{ pour } 1 \\le i \\le M\\},$$\noù $a_1, \\dots, a_M$ sont donnés dans $V$. Montrer que la condition d'optimalité (2.29) s'écrit sous la forme\n$$u \\in K \\quad \\text{et} \\quad \\exists\\, \\lambda_1, \\dots, \\lambda_M \\in \\R, \\quad J'(u) + \\sum_{i=1}^M \\lambda_i a_i = 0, \\tag{2.31}$$\navec des réels $\\lambda_i$ (qui seront appelés multiplicateurs de Lagrange dans le Théorème 2.5.6).<\/p>", "exo:2.5.8": "<b>Exercice 2.5.8<\/b> · Cône polyédral et multiplicateurs positifs <p>Soit $(a_1, \\dots, a_M)$ une famille libre dans $V$. Supposons que $K$ est défini par\n$$K = \\{v \\in V, \\ \\ps{a_i}{v} \\le 0 \\text{ pour } 1 \\le i \\le M\\}.$$\nVérifier que $K$ est un cône convexe fermé, ce qui signifie que $K$ est un ensemble convexe fermé tel que $\\lambda v \\in K$ pour tout $v \\in K$ et tout $\\lambda \\ge 0$. Montrer que la condition d'optimalité (2.29) implique que\n$$\\ps{J'(u)}{u} = 0 \\quad \\text{et} \\quad \\ps{J'(u)}{w} \\ge 0 \\quad \\forall w \\in K. \\tag{2.32}$$\nEn déduire que si $u$ vérifie (2.29), alors il existe des réels positifs ou nuls $\\lambda_i \\ge 0$ tels que\n$$u \\in K \\quad \\text{et} \\quad \\exists\\, \\lambda_1, \\dots, \\lambda_M \\ge 0, \\quad J'(u) + \\sum_{i=1}^M \\lambda_i a_i = 0, \\tag{2.33}$$\net, de plus, $\\lambda_i = 0$ si $\\ps{a_i}{u} \\lt 0$. Nous verrons que ces réels $\\lambda_i$ sont encore appelés multiplicateurs de Lagrange au Théorème 2.5.17.<\/p>", "exo:2.5.9": "<b>Exercice 2.5.9<\/b> · Cône des directions admissibles : exemples <p>Montrer que $K(v) = V$ si $v$ est intérieur à $K$. Montrer que $K(v_0) = \\{0\\}$ si $K = K_0 \\cup \\{v_0\\}$ avec la distance $d(v_0, K_0) \\gt 0$.<\/p>\n<p><em>Rappel (Définition 2.5.4).<\/em> $w \\in K(v)$ s'il existe $(v^n) \\in K^{\\N}$ et $(\\eps^n) \\in (\\R_+^*)^{\\N}$ tels que $v^n \\to v$, $\\eps^n \\to 0$ et $\\dfrac{v^n - v}{\\eps^n} \\to w$.<\/p>", "exo:2.5.10": "<b>Exercice 2.5.10<\/b> · Quadratique sous contrainte affine non homogène <p>Généraliser les résultats ci-dessus pour cette variante de l'Exemple 1.2.3 : $$\\min_{Bx=c}\\Big\\{J(x)=\\frac12Ax\\cdot x-b\\cdot x\\Big\\},$$ où $c\\in\\R^m$ est un vecteur donné.<\/p>\n<p>Rappel des « résultats ci-dessus » (cas $c=0$, traité après la Remarque 2.5.8) : $A$ est symétrique définie positive d'ordre $n$, $B$ est de taille $m\\times n$ avec $m\\le n$ et de rang <span class=\"nw\">$m$ ;<\/span> le point de minimum $\\bar x$ vérifie $A\\bar x-b=B^*p$, avec $p=-(BA^{-1}B^*)^{-1}BA^{-1}b$ et $\\bar x=A^{-1}\\big(\\Id-B^*(BA^{-1}B^*)^{-1}BA^{-1}\\big)b$.<\/p>", "exo:2.5.11": "<b>Exercice 2.5.11<\/b> · Plus petite valeur propre par Lagrange <p>Soit $A$ une matrice carrée d'ordre $n$, symétrique. On veut caractériser et calculer les solutions de $$\\inf_{x\\in\\R^n,\\ \\norm{x}=1}J(x)=Ax\\cdot x,$$ où $\\norm{x}$ est la norme euclidienne de $x$. Appliquer le Théorème 2.5.6 et en déduire que les points de minimum de $J$ sur la sphère unité sont des vecteurs propres de $A$ associés à la plus petite valeur propre.<\/p>", "exo:2.5.12": "<b>Exercice 2.5.12<\/b> · Problème de Didon et arc de cercle <p>Selon la légende rapportée par Virgile dans l'Énéide, la fondation de la ville de Carthage par la reine Didon conduisit à un problème typique du calcul des variations. Il s'agissait de trouver la plus grande surface possible (pour la ville) s'appuyant sur le rivage (une droite) et de frontière terrestre de longueur donnée. La réponse est intuitivement un demi-disque. Mathématiquement, le problème est de trouver la courbe plane, définie par le graphe d'une fonction $y(x)$ pour $x\\in(0,\\xi)$, de longueur fixée $l\\ge0$, qui enclôt avec le segment $(0,\\xi)$ reliant ses deux extrémités l'aire maximum. Autrement dit, on résout $$\\sup_{\\xi\\ge0,\\ y\\in C^1[0,\\xi]}\\int_0^\\xi y(x)\\,dx,$$ avec les contraintes $$y(0)=y(\\xi)=0,\\qquad\\int_0^\\xi\\sqrt{1+y'(x)^2}\\,dx=l.$$<\/p>\n<p>La longueur $\\xi$ du segment est une variable d'optimisation, de même que la fonction $y(x)$ qui donne la position de la courbe au-dessus du point $x$ du segment. En s'inspirant de l'Exercice 2.5.4, calculer les dérivées directionnelles de la fonction objectif et de la contrainte intégrale. En déduire que la solution du problème de Didon est nécessairement un arc de cercle.<\/p>", "exo:2.5.13": "<b>Exercice 2.5.13<\/b> · Forme linéaire sur un ellipsoïde <p>Soit $A$ une matrice $n\\times n$ symétrique définie positive et $b\\in\\R^n$ non nul.<\/p>\n<ol>\n<li>Montrer que les problèmes $$\\sup_{Ax\\cdot x\\le1}b\\cdot x\\qquad\\text{et}\\qquad\\sup_{Ax\\cdot x=1}b\\cdot x$$ sont équivalents et qu'ils ont une solution. Utiliser le Théorème 2.5.6 pour calculer cette solution et montrer qu'elle est unique.<\/li>\n<li>On introduit un ordre partiel dans l'ensemble des matrices symétriques définies positives d'ordre $n$ en disant que $A\\ge B$ si et seulement si $Ax\\cdot x\\ge Bx\\cdot x$ pour tout $x\\in\\R^n$. Déduire de la question précédente que, si $A\\ge B$, alors $B^{-1}\\ge A^{-1}$.<\/li>\n<\/ol>", "exo:2.5.14": "<b>Exercice 2.5.14<\/b> · Entropie de Shannon et inégalité de Gibbs <p>Montrer que l'entropie de Shannon de l'Exemple 1.2.7 admet un unique point de minimum que l'on calculera. Montrer aussi que, pour tout $p\\in\\R^n_+$ tel que $\\sum_{i=1}^np_i=1$, $$-\\sum_{i=1}^np_i\\log p_i=\\inf_{q\\in\\R^n_+,\\ \\sum_{i=1}^nq_i=1}\\ -\\sum_{i=1}^np_i\\log q_i.$$<\/p>\n<p>(Exemple 1.2.7 : on minimise $J(p)=\\sum_{i=1}^np_i\\log p_i$ sur $K=\\{p\\in\\R^n_+,\\ \\sum_ip_i=1\\}$, avec la convention <span class=\"nw\">$0\\log0=0$ ;<\/span> minimiser $J$ revient à maximiser l'entropie $-\\sum_ip_i\\log p_i$.)<\/p>", "exo:2.5.15": "<b>Exercice 2.5.15<\/b> · Entropie de Boltzmann et Maxwellienne <p>En théorie cinétique des gaz, les molécules de gaz sont représentées en tout point de l'espace par une fonction de répartition $f(v)$ dépendant de la vitesse microscopique $v\\in\\R^N$. Les quantités macroscopiques, comme la densité du gaz $\\rho$, sa vitesse $u$ et sa température $T$, se retrouvent grâce aux moments de la fonction <span class=\"nw\">$f(v)$ :<\/span> $$\\begin{gathered}\\rho=\\int_{\\R^N}f(v)\\,dv,\\qquad\\rho u=\\int_{\\R^N}v\\,f(v)\\,dv,\\\\ \\frac12\\rho|u|^2+\\frac N2\\rho T=\\frac12\\int_{\\R^N}|v|^2f(v)\\,dv.\\end{gathered}\\tag{2.39}$$ Boltzmann a introduit l'entropie cinétique $H(f)$ définie par $$H(f)=\\int_{\\R^N}f(v)\\log\\big(f(v)\\big)\\,dv.$$<\/p>\n<p>Montrer que $H$ est strictement convexe sur l'espace des fonctions $f(v)\\gt0$ mesurables telles que $H(f)\\lt+\\infty$. On minimise $H$ sur cet espace sous les contraintes de moment (2.39), et on admettra qu'il existe un unique point de minimum $M(v)$. Montrer que ce point de minimum est une Maxwellienne définie par $$M(v)=\\frac{\\rho}{(2\\pi T)^{N/2}}\\exp\\Big(-\\frac{|v-u|^2}{2T}\\Big).$$<\/p>", "exo:2.5.16": "<b>Exercice 2.5.16<\/b> · Conditions du second ordre sous contraintes <p>Calculer la condition nécessaire d'optimalité du second ordre pour l'Exemple 1.2.3 et l'Exercice 2.5.11.<\/p>\n<p>(Exemple 1.2.3 : minimiser $J(x)=\\frac12Ax\\cdot x-b\\cdot x$ sur $\\Ker B$, avec $A$ symétrique d'ordre $n$ et $B$ de taille $m\\times n$.)<\/p>", "exo:2.5.17": "<b>Exercice 2.5.17<\/b> · KKT pour une quadratique sous contraintes affines <p>Soit $A$ une matrice symétrique définie positive d'ordre $n$, et $B$ une matrice de taille $m\\times n$ avec $m\\le n$ et de rang $m$. On considère le problème de minimisation $$\\min_{x\\in\\R^n,\\ Bx\\le c}\\Big\\{J(x)=\\frac12Ax\\cdot x-b\\cdot x\\Big\\}.$$ Appliquer le Théorème 2.5.17 pour obtenir l'existence d'un multiplicateur de Lagrange $p\\in\\R^m$ tel qu'un point de minimum $\\bar x$ vérifie $$A\\bar x-b+B^*p=0,\\qquad p\\ge0,\\qquad p\\cdot(B\\bar x-c)=0.$$<\/p>", "exo:2.5.18": "<b>Exercice 2.5.18<\/b> · Régularisation sous contrainte d'écart quadratique <p>Soit $f$ une fonction définie sur un ouvert borné $\\Omega$. Pour $\\eps\\gt0$, on considère le problème de régularisation suivant : $$\\inf_{u\\in V_0,\\ \\int_\\Omega|u-f|^2dx\\le\\eps^2}\\ \\int_\\Omega|\\nabla u|^2dx,$$ où $V_0=\\{v\\in C^1(\\overline\\Omega),\\ v=0\\text{ sur }\\partial\\Omega\\}$. Montrer qu'un point de minimum $u_\\eps$ vérifie, soit $u_\\eps=f$, soit il existe $\\lambda\\ge0$ tel que $u_\\eps$ est solution de $$\\begin{cases}-\\Delta u_\\eps+\\lambda(u_\\eps-f)=0&amp;\\text{dans }\\Omega,\\\\ u_\\eps=0&amp;\\text{sur }\\partial\\Omega.\\end{cases}$$<\/p>", "exo:2.6.1": "<b>Exercice 2.6.1<\/b> · Un saut de dualité strict <p>Donner un exemple de Lagrangien pour lequel l'inégalité (2.75) $$\\inf_{v\\in U}\\Big(\\sup_{q\\in P}\\Lag(v,q)\\Big)\\ge\\sup_{q\\in P}\\Big(\\inf_{v\\in U}\\Lag(v,q)\\Big)$$ est stricte avec ses deux membres finis.<\/p>", "exo:2.6.2": "<b>Exercice 2.6.2<\/b> · Existence d'un point-selle par compacité <p>Soit $U$ (respectivement $P$) un convexe compact non vide de $V$ (respectivement $Q$). On suppose que le Lagrangien est tel que $v\\mapsto\\Lag(v,q)$ est strictement convexe continu sur $U$ pour tout $q\\in P$, et $q\\mapsto\\Lag(v,q)$ est concave continu sur $P$ pour tout $v\\in U$. Montrer alors l'existence d'un point-selle de $\\Lag$ sur $U\\times P$.<\/p>", "exo:2.6.3": "<b>Exercice 2.6.3<\/b> · Énergie complémentaire et dualité <p>On reprend l'Exemple 1.2.8, déjà étudié à l'Exercice 2.5.4. En mécanique, il est bien connu que la minimisation de l'énergie « en déplacements » $J(u)$ de l'Exercice 2.5.4 est équivalente à la minimisation d'une autre énergie, dite complémentaire, dont la signification physique est tout aussi importante que celle de $J(u)$. Cette énergie complémentaire est définie en termes d'un champ de contraintes (mécaniques) $\\tau(x)$ par $$G(\\tau)=\\frac12\\int_0^L|\\tau|^2dx.\\tag{2.82}$$ Elle s'accompagne d'une contrainte sur $\\tau$, qui doit être statiquement admissible, c'est-à-dire vérifier $-\\tau'=f$ dans $(0,L)$. Autrement dit, on considère le problème de minimisation sous contrainte $$\\inf_{-\\tau'=f\\text{ dans }(0,L)}\\Big\\{G(\\tau)=\\frac12\\int_0^L|\\tau|^2dx\\Big\\}.\\tag{2.83}$$ Pour $\\tau$ et $v$, deux fonctions définies de $(0,L)$ dans $\\R$, on introduit le Lagrangien correspondant $$\\Lag(\\tau,v)=\\frac12\\int_0^L|\\tau|^2dx+\\int_0^Lv\\,(\\tau'+f)\\,dx.$$<\/p>\n<p>Montrer que la fonction duale $\\mathcal D(v)$ correspondante n'est rien d'autre que l'opposée de l'énergie, $-J(v)$, de l'Exercice 2.5.4. En admettant que $-J$ admette un point de maximum $u$ et que (2.83) admette un point de minimum $\\sigma$, montrer que $(\\sigma,u)$ est un point-selle du Lagrangien et que $\\sigma=u'$.<\/p>\n<p>(Exercice 2.5.4 : $J(v)=\\frac12\\int_0^L\\mu|v'|^2dx-\\int_0^Lfv\\,dx$ sur $K=\\{v\\in C^1[0,L],\\ v(0)=v(L)=0\\}$, avec $f$ continue et $\\mu\\gt0$.)<\/p>", "exo:3.2.1": "<b>Exercice 3.2.1<\/b> · Pas optimal pour une fonctionnelle quadratique <p>On applique l'algorithme du gradient à pas optimal à la fonction $J(x)=\\frac12 Ax\\cdot x-b\\cdot x$, définie de $\\R^N$ dans $\\R$, avec $b\\in\\R^N$ et $A$ une matrice symétrique définie positive de valeurs propres $0\\lt\\lambda_1\\le\\cdots\\le\\lambda_N$. Montrer qu'à chaque itération $n$ le pas optimal vérifie $1/\\lambda_N\\le\\mu^n\\le1/\\lambda_1$.<\/p>", "exo:3.2.2": "<b>Exercice 3.2.2<\/b> · Pas optimaux bornés par encadrement quadratique <p>On applique l'algorithme du gradient à pas optimal à une fonction $J$ $\\alpha$-convexe différentiable et telle que sa dérivée $J'$ est $L$-lipschitzienne sur $V$ (voir la Définition 2.4.9). En utilisant l'encadrement de $J$ par deux fonctions quadratiques (cf. la Remarque 2.4.11), montrer que la suite des pas optimaux vérifie $0\\lt c\\le\\mu^n\\le C\\lt+\\infty$ pour deux constantes $c,C$ indépendantes de $n$.<\/p>", "exo:3.2.3": "<b>Exercice 3.2.3<\/b> · Fonction plate : le pas optimal explose <p>Soit $J(x)=\\frac{1}{2p}(Ax\\cdot x)^p$, définie de $\\R^N$ dans $\\R$, pour un entier $p\\ge2$ et $A$ une matrice symétrique définie positive. Montrer que $J$ est strictement convexe, que son minimum est atteint en $0$ et qu'elle n'est pas fortement convexe en $0$.<\/p>\n<p>On applique l'algorithme du gradient à pas optimal à $J$ et on suppose que la suite des itérées vérifie $\\norm{x^n}=\\eps^n\\to0$ avec $\\eps^n\\gt0$. Montrer que la suite des pas optimaux tend vers l'infini comme $\\mu^n=\\mathcal O\\big((\\eps^n)^{-2(p-1)}\\big)$.<\/p>", "exo:3.2.4": "<b>Exercice 3.2.4<\/b> · Vitesse du gradient et de la valeur <p>On se place sous les hypothèses du Théorème 3.2.6. En utilisant la définition (3.8) de l'algorithme, montrer qu'il existe une constante $C_0$ telle que\n$$\\norm{J'(u^n)}\\le C_0\\gamma^n,$$\net, en utilisant la convexité de $J$ au point $u^n$,\n$$0\\le J(u^n)-J(u)\\le C_0\\gamma^{2n}\\quad\\text{avec}\\quad\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}.$$<\/p>", "exo:3.2.5": "<b>Exercice 3.2.5<\/b> · Pas fixe optimal : cas quadratique <p>Soit $A$ une matrice symétrique définie positive de taille $N\\times N$, de valeurs propres ordonnées $0\\lt\\lambda_1\\le\\cdots\\le\\lambda_N$, et soit $b\\in\\R^N$. On considère l'algorithme du gradient à pas fixe pour la fonction définie sur $\\R^N$ par\n$$J(x)=\\frac12Ax\\cdot x-b\\cdot x .$$\nRécrire l'algorithme sous la forme $(x^n-x^*)=B(x^{n-1}-x^*)$ où $x^*=A^{-1}b$ et $B$ est une matrice que l'on précisera. En étudiant le rayon spectral de $B$, montrer que l'algorithme converge si et seulement si le pas fixe vérifie $0\\lt\\mu\\lt2/\\lambda_N$, et que la meilleure vitesse de convergence de l'algorithme s'obtient pour le choix du pas de descente $\\mu_B=2/(\\lambda_1+\\lambda_N)$, qui conduit à\n$$\\norm{x^n-x^*}\\le\\gamma_B^n\\norm{x^0-x^*}\\quad\\text{avec}\\quad\\gamma_B=\\frac{1-\\lambda_1/\\lambda_N}{1+\\lambda_1/\\lambda_N}.$$\nComparer avec la valeur optimisée de $\\gamma$ dans la Remarque 3.2.8 (identifier les valeurs $L$ et $\\alpha$ pour la fonction $J(x)$).<\/p>", "exo:3.2.6": "<b>Exercice 3.2.6<\/b> · Gradient à pas fixe sans convexité <p>Soit une fonction $J(u)$ différentiable, infinie à l'infini et telle que $J'$ est lipschitzien, c'est-à-dire vérifie (3.9) pour une constante $L\\gt0$. On ne suppose pas que $J$ est convexe. À l'aide des mêmes raisonnements que pour la Proposition 3.2.9, montrer que l'algorithme du gradient à pas fixe $0\\lt\\mu\\lt2/L$ vérifie que $J(u^n)$ décroît et que $J'(u^n)$ tend vers $0$.<\/p>", "exo:3.2.7": "<b>Exercice 3.2.7<\/b> · Convergence vers un point selle <p>Soit la fonction $J(x)=\\frac12x_1^2+\\frac14x_2^4-\\frac12x_2^2$ définie sur $\\R^2$. Vérifier que $J$ n'est pas convexe et que l'ensemble de ses points critiques (où son gradient s'annule) est formé de $O=(0,0)$, $P=(0,-1)$ et $Q=(0,1)$. Montrer que $P$ et $Q$ sont des points de minimum tandis que $O$ est un point selle.<\/p>\n<p>Montrer que, si on initialise un algorithme de gradient au point $x^0=(1,0)$, alors quelle que soit la règle de choix du pas de descente $\\mu^n\\gt0$ (fixe, optimal ou autre) qui assure la convergence, la limite est le point $O$, qui n'est pas un minimum, même local, de $J$.<\/p>", "exo:3.3.1": "<b>Exercice 3.3.1<\/b> · Convergence des itérées de Nesterov <p>On se place sous les hypothèses de la Proposition 3.3.7 et dans un espace de dimension finie $V=\\R^N$. On suppose de plus que la fonction $J$ est strictement convexe et infinie à l'infini. On considère la suite $u^n$ donnée par l'algorithme (3.14) de Nesterov.<\/p>\n<ol>\n<li>Montrer que la suite $u^n$ est bornée.<\/li>\n<li>Montrer que toute sous-suite convergente de $u^n$ converge vers une limite où $J'$ s'annule.<\/li>\n<li>En déduire que toute la suite $u^n$ converge vers l'unique point de minimum de $J$.<\/li>\n<\/ol>", "exo:3.3.2": "<b>Exercice 3.3.2<\/b> · Directions conjuguées du gradient conjugué <p>Soit $A$ une matrice symétrique définie positive. Soit $x_0\\in\\R^N$. Pour la récurrence (3.35), démontrer que $r_n=Ax_n-b$. Montrer que la suite $p_n$ vérifie $Ap_n\\cdot p_j=0$ pour $0\\le j\\lt n$ (on dit que la suite $p_n$ est conjuguée par rapport à $A$). Vérifier que les formules de Fletcher-Reeves et Polak-Ribière coïncident dans ce cas.<\/p>\n<p><em>Rappel de (3.35).<\/em> Pour <span class=\"nw\">$n\\ge0$ :<\/span> $x_{n+1}=x_n-\\mu_np_n$, $r_{n+1}=r_n-\\mu_nAp_n$, $p_{n+1}=r_{n+1}+\\beta_np_n$, avec $p_0=r_0=Ax_0-b$, $\\mu_n=\\norm{r_n}^2/(Ap_n\\cdot p_n)$ et $\\beta_n=\\norm{r_{n+1}}^2/\\norm{r_n}^2$.<\/p>", "exo:3.3.3": "<b>Exercice 3.3.3<\/b> · Sous-différentiel de la valeur absolue <p>Soit $J(x)=|x|$ définie de $\\R$ dans $\\R$. Calculer son sous-gradient $\\partial J(0)$, c'est-à-dire son sous-différentiel en $0$ au sens de la Définition 3.3.19.<\/p>", "exo:3.3.4": "<b>Exercice 3.3.4<\/b> · Prox de l'indicatrice : la projection <p>Soit $K$ un convexe fermé de $\\R^n$. On définit la fonction indicatrice de $K$ comme l'application de $\\R^n$ dans $\\R\\cup\\{+\\infty\\}$ définie par\n$$I_K(x)=\\begin{cases}0 &amp; \\text{si } x\\in K,\\\\ +\\infty &amp; \\text{si } x\\notin K.\\end{cases}$$\nVérifier que $I_K$ est une fonction convexe et que l'application proximale $\\prox_{I_K}$ est simplement l'opérateur de projection orthogonale sur $K$.<\/p>", "exo:3.3.5": "<b>Exercice 3.3.5<\/b> · Régularisation de Moreau-Yosida et prox <p>Soit $J$ une fonction convexe minorée par une fonction affine sur $\\R^n$. Pour $\\tau\\gt0$, on définit la régularisation de Moreau-Yosida de $J$, notée $J_\\tau$, par\n$$J_\\tau(x)=\\min_{y\\in\\R^n}\\frac{1}{2\\tau}\\norm{x-y}^2+J(y).$$\nMontrer que $J_\\tau$ est convexe, différentiable et que $\\min_{x\\in\\R^n}J(x)=\\min_{x\\in\\R^n}J_\\tau(x)$ (indication : on pourra utiliser la forte convexité de la fonction dont la minimisation donne $J_\\tau$ pour montrer d'abord que l'application proximale est différentiable). Vérifier que\n$$\\prox_{\\tau J}(x^k)=x^{k+1}\\iff x^{k+1}=x^k-\\tau J_\\tau'(x^k),$$\nc'est-à-dire qu'une itération de l'algorithme proximal pour $J$ est équivalente à une itération de l'algorithme du gradient à pas fixe pour $J_\\tau$.<\/p>", "exo:3.3.6": "<b>Exercice 3.3.6<\/b> · Explicite-implicite et gradient projeté <p>Soit $J_1$ une fonction fortement convexe différentiable sur $\\R^n$. Soit $K$ un convexe fermé de $\\R^n$ et $J_2=I_K$, la fonction indicatrice de $K$ définie comme à l'Exercice 3.3.4. Vérifier que l'algorithme explicite-implicite (3.53) n'est rien d'autre que l'algorithme de gradient projeté de la Sous-section 3.4.1.<\/p>", "exo:3.3.7": "<b>Exercice 3.3.7<\/b> · Opérateur proximal d'une quadratique <p>Soit $A$ une matrice $n\\times n$ symétrique réelle, définie positive, et $b\\in\\R^n$. On définit la fonction quadratique $J$ sur $\\R^n$ par\n$$J(x)=\\frac12Ax\\cdot x-b\\cdot x .$$\nDéterminer l'opérateur proximal $\\prox_J$.<\/p>", "exo:3.4.1": "<b>Exercice 3.4.1<\/b> · Projection sur un hyperplan affine <p>Soit $V=\\R^N$ et $K=\\big\\{x\\in\\R^N \\text{ tel que } \\sum_{i=1}^Nx_i=1\\big\\}$. Expliciter l'opérateur de projection orthogonale $P_K$ et interpréter dans ce cas la formule (3.58) en termes de multiplicateur de Lagrange.<\/p>", "exo:3.4.2": "<b>Exercice 3.4.2<\/b> · Uzawa pour un problème quadratique <p>Appliquer l'algorithme d'Uzawa au problème de la Remarque 2.6.13 (fonctionnelle quadratique et contraintes affines en dimension finie). Si la matrice $B$ est de rang $M$, ce qui assure l'unicité de $p$ d'après la Remarque 2.6.13, montrer que la suite $p^n$ converge vers $p$.<\/p>\n<p><em>Rappel.<\/em> Il s'agit de $\\min\\big\\{J(v)=\\frac12Av\\cdot v-b\\cdot v\\ :\\ v\\in\\R^N,\\ Bv-c\\le0\\big\\}$, avec $A$ symétrique définie positive de taille $N\\times N$, $b\\in\\R^N$, $B$ matrice $M\\times N$ et <span class=\"nw\">$c\\in\\R^M$ ;<\/span> le Lagrangien est $\\Lag(v,q)=\\frac12Av\\cdot v-b\\cdot v+q\\cdot(Bv-c)$ sur $\\R^N\\times(\\R_+)^M$.<\/p>", "exo:3.4.3": "<b>Exercice 3.4.3<\/b> · Pénalisation et multiplicateurs de Lagrange <p>En plus des hypothèses de la Proposition 3.4.6, on suppose que les fonctions $J$ et $F_1,\\dots,F_M$ sont continûment différentiables. On note de nouveau $I(u)$ l'ensemble des contraintes actives en $u$, et on suppose que les contraintes sont qualifiées en $u$ au sens de la Définition 2.5.15. Enfin, on suppose que les vecteurs $\\big(F_i'(u)\\big)_{i\\in I(u)}$ sont linéairement indépendants, ce qui assure l'unicité des multiplicateurs de Lagrange $\\lambda_1,\\dots,\\lambda_M$ tels que $J'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0$, avec $\\lambda_i=0$ si $i\\notin I(u)$. Montrer alors que, pour tout indice $i\\in\\{1,\\dots,M\\}$,\n$$\\lim_{\\eps\\to0}\\Big[\\frac2\\eps\\max\\big(F_i(u_\\eps),0\\big)\\Big]=\\lambda_i .$$<\/p>", "exo:3.4.4": "<b>Exercice 3.4.4<\/b> · Convexité de la fonction barrière <p>Soit des fonctions $J$ et $F_1,\\dots,F_M$ convexes. Vérifier que la fonction minimisée dans (3.82), $v\\mapsto J(v)-\\eps\\sum_{i=1}^M\\frac{1}{F_i(v)}$ avec $\\eps\\gt0$, est bien convexe sur le domaine défini par $F(v)\\lt0$.<\/p>", "exm:1.2.1": "<b>Exemple 1.2.1<\/b> (programme linéaire, problème de transport) : acheminer une marchandise de $M$ entrepôts (stocks $s_i$) vers $N$ clients (demandes $r_j$) au coût $\\sum_{i,j}c_{ij}v_{ij}$ minimal, sous $v_{ij}\\ge0$, $\\sum_jv_{ij}\\le s_i$, $\\sum_iv_{ij}\\ge r_j$ — critère et contraintes linéaires.", "exm:1.2.3": "<b>Exemple 1.2.3<\/b> (quadratique sur un noyau) : $\\inf_{x\\in\\Ker B}\\ \\frac12Ax\\cdot x-b\\cdot x$, $A$ symétrique d'ordre $n$ (définie positive dans le cas de base), $B$ matrice $m\\times n$ ; repris en 2.5 avec la contrainte $Bx=c$.", "exm:1.2.4": "<b>Exemple 1.2.4<\/b> (moindres carrés) : $\\min_{x\\in\\R^n}\\norm{Ax-b}^2$, $A$ matrice $p\\times n$, $b\\in\\R^p$ — équations normales $A^*Ax=A^*b$.", "exm:1.2.7": "<b>Exemple 1.2.7<\/b> (entropie de Shannon) : minimiser $\\sum_ip_i\\log p_i$ sur le simplexe $\\{p\\ge0,\\ \\sum_ip_i=1\\}$ ($0\\log0=0$), c'est-à-dire maximiser l'entropie $-\\sum p_i\\log p_i$.", "exm:1.2.8": "<b>Exemple 1.2.8<\/b> (problème de Dirichlet 1D, énergie en déplacements) : $\\inf_{u\\in K}\\ \\frac12\\int_0^L\\mu|u'|^2dx-\\int_0^Lfu\\,dx$, $K=\\{u\\in C^1[0,L],\\ u(0)=u(L)=0\\}$.", "fig:2.1": "<b>Figure 2.1<\/b> du livre : le cône des directions admissibles $K(v)$ — une direction $w$ est admissible en $v$ si des points de $K$ s'approchent de $v$ dans la direction $w$ (Définition 2.5.4).", "fig:2.2": "<b>Figure 2.2<\/b> du livre : l'inéquation d'Euler $\\ps{J'(u)}{v-u}\\ge0$ — le gradient $J'(u)$ fait un angle aigu avec toute direction rentrante $v-u$, donc $-J'(u)$ pointe hors de $K$.", "res:3.3.12": "<b>Lemme 3.3.12<\/b> : si $J$ est α-convexe à dérivée $L$-lipschitzienne, $0<\\mu\\le1/L$ et $v^*=v-\\mu J'(v)$, alors pour tout $w$ : $J(w)+\\frac{1-\\alpha\\mu}{2\\mu}\\norm{w-v}^2\\ge J(v^*)+\\frac1{2\\mu}\\norm{v^*-w}^2$ — l'encadrement quadratique sous sa forme la plus fine.", "res:3.3.13": "<b>Lemme 3.3.13<\/b> : la suite $a_n$ de (3.19) croît vers $1/\\sqrt q$ ($q=\\alpha/L$) et vérifie $a_{n+1}(a_{n+1}-1)\\le a_n^2(1-qa_{n+1})$.", "res:3.3.14": "<b>Remarque 3.3.14<\/b> : pour $q=0$ (pas de forte convexité), la suite (3.19) redonne l'algorithme (3.14).", "res:3.3.18": "<b>Remarque 3.3.18<\/b> : pour une fonction non quadratique, le gradient conjugué (formules de Fletcher–Reeves ou de Polak–Ribière) n'est plus une méthode exacte en $N$ itérations ; on le redémarre périodiquement, et il converge au moins comme le gradient à pas optimal.", "res:3.3.29": "<b>Remarque 3.3.29<\/b> : le gradient stochastique avec le pas $\\mu^k=1/(k+1)$ converge en espérance à une vitesse algébrique (en $1/k$), bien plus lente que le gradient « batch », mais chaque itération ne coûte qu'un seul gradient $f_i'$ au lieu de $n$.", "res:3.3.30": "<b>Remarque 3.3.30<\/b> (mini-batch) : on moyenne $m$ gradients tirés au hasard à chaque itération, compromis entre le coût d'une itération et la variance du bruit ; à pas constant, l'erreur ne tend pas vers 0 mais plafonne.", "res:3.5.5": "<b>Remarque 3.5.5<\/b> : si $N=M$ et $\\nabla F(u^n)$ est inversible, la méthode de Gauss–Newton pour $\\min\\norm{F(u)}^2$ coïncide exactement avec la méthode de Newton pour $F(u)=0$.", "res:3.7.1": "<b>Lemme 3.7.1<\/b> (dérivation composée) : pour $J=J_m\\circ\\dots\\circ J_1$, $J'(v)\\cdot h=J_m'(x_m)\\cdot\\big(J_{m-1}'(x_{m-1})\\cdots J_1'(x_1)h\\big)$ avec $x_1=v$, $x_{i+1}=J_i(x_i)$ ; le gradient s'obtient par les transposées, à rebours (3.110).", "res:3.7.2": "<b>Remarque 3.7.2<\/b> : comme $N_{m+1}=1$, le dernier facteur $J_m'(x_m)^*$ est un simple vecteur ; en multipliant par les transposées de droite à gauche, chaque étape est un produit matrice-vecteur : c'est la rétropropagation, au coût d'une seule dérivée directionnelle.", "res:3.7.3": "<b>Lemme 3.7.3<\/b> : sous (H), $\\tilde J'(v)\\cdot h=\\frac{\\partial J}{\\partial v}\\cdot h+\\big\\langle\\frac{\\partial J}{\\partial y},y'(v)\\cdot h\\big\\rangle$, où $y'(v)\\cdot h$ résout le système linéarisé (3.113) — une résolution par direction $h$.", "res:3.7.4": "<b>Remarque 3.7.4<\/b> : pour un modèle linéaire $F(v,y)=Ay-b(v)$, calculer le gradient de $\\tilde J$ par le Lemme 3.7.3 demande $N$ résolutions de systèmes avec la matrice $A$ (une par composante de $v$).", "res:3.7.5": "<b>Lemme 3.7.5<\/b> (état adjoint) : avec $\\Lag(v,y,p)=J(v,y)+\\ps p{F(v,y)}$, l'état adjoint $p(v)$ est l'unique solution de $\\big(\\frac{\\partial F}{\\partial y}\\big)^*p=-\\frac{\\partial J}{\\partial y}$ (3.115), c'est-à-dire l'unique $p$ annulant $\\frac{\\partial\\Lag}{\\partial y}$.", "res:3.7.8": "<b>Remarque 3.7.8<\/b> : pour le problème décomposable (3.118), si les $F_i$ sont affines et les $J_i$ fortement convexes, l'algorithme d'Uzawa (décomposition par les prix) converge d'après le Théorème 3.4.3.", "res:5.1.3": "<b>Théorème 5.1.3<\/b> (projection sur un convexe fermé) : dans un espace de Hilbert $V$, si $K$ est un convexe fermé non vide, tout $x\\in V$ a une unique projection $P_Kx\\in K$ réalisant $\\min_{y\\in K}\\norm{x-y}$, caractérisée par $\\ps{x-P_Kx}{y-P_Kx}\\le0$ pour tout $y\\in K$ ; de plus $P_K$ est 1-lipschitzienne.", "res:8.1.12": "<b>Théorème 8.1.12<\/b> (séparation d'un point et d'un convexe fermé) : si $C$ est un convexe fermé non vide d'un Hilbert et $x_0\\notin C$, il existe une forme linéaire continue $L$ et $\\alpha\\in\\R$ avec $L(x_0)<\\alpha<L(y)$ pour tout $y\\in C$ (en Hilbert : $L=\\ps{P_Cx_0-x_0}{\\cdot}$).", "eq:2.1": "<b>(2.1)<\/b> Le problème général : $\\inf_{v\\in K\\subset V}J(v)$ — $V$ espace vectoriel normé, $K$ l'ensemble admissible (les contraintes), $J:K\\to\\R$ le critère.", "eq:2.2": "<b>(2.2)<\/b> « Infinie à l'infini » : pour toute suite $(u^n)$ de $K$, $\\norm{u^n}\\to+\\infty\\Rightarrow J(u^n)\\to+\\infty$ (automatique si $K$ est borné).", "eq:2.6": "<b>(2.6)<\/b> Condition abstraite d'existence en dimension infinie : toute suite bornée $(u^n)$ de $K$ avec $J(u^n)\\to\\ell$ doit fournir un $u\\in K$ avec $J(u)\\le\\ell$ (ce que la compacité donne en dimension finie ; la convexité le donnera en dimension infinie).", "eq:2.7": "<b>(2.7)<\/b> Convexité : $J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)$ pour tous $u,v\\in K$, $\\theta\\in[0,1]$ (stricte si l'inégalité est stricte pour $u\\ne v$, $\\theta\\in]0,1[$).", "eq:2.9": "<b>(2.9)<\/b> Forte convexité (α-convexité) : $J(\\theta u+(1-\\theta)v)\\le\\theta J(u)+(1-\\theta)J(v)-\\frac{\\alpha\\theta(1-\\theta)}2\\norm{u-v}^2$ pour tous $u,v\\in K$, $\\theta\\in[0,1]$.", "eq:2.10": "<b>(2.10)<\/b> Forte convexité « au milieu » : $J\\big(\\frac{u+v}2\\big)\\le\\frac{J(u)+J(v)}2-\\frac\\alpha8\\norm{u-v}^2$ (équivaut à (2.9) si $J$ est localement bornée, Ex. 2.3.3).", "eq:2.11": "<b>(2.11)<\/b> Minorante affine (Prop. 2.3.7) : $J$ convexe continue sur $K$ convexe fermé ⇒ il existe $L\\in V'$ et $\\delta\\in\\R$ avec $J(v)\\ge L(v)+\\delta$ pour tout $v\\in K$.", "eq:2.12": "<b>(2.12)<\/b> Croissance quadratique (Prop. 2.3.7) : $J$ fortement convexe continue ⇒ il existe $\\gamma>0$, $\\eta\\in\\R$ avec $J(v)\\ge\\gamma\\norm v^2+\\eta$ pour tout $v\\in K$ — donc $J$ est minorée et infinie à l'infini.", "eq:2.13": "<b>(2.13)<\/b> Dans la preuve de la Prop. 2.3.7 : la séparation du point $(\\lambda_0,v_0)$ (pris sous le graphe) et de l'épigraphe donne $\\alpha,\\beta\\in\\R$, $L\\in V'$ avec $\\beta\\lambda+L(v)>\\alpha>\\beta\\lambda_0+L(v_0)$ pour tout $(\\lambda,v)\\in\\mathrm{Epi}(J)$.", "eq:2.14": "<b>(2.14)<\/b> Estimation du Th. 2.3.8 : si $u$ est le minimum de $J$ α-convexe sur $K$, $\\norm{v-u}^2\\le\\frac4\\alpha\\big(J(v)-J(u)\\big)$ pour tout $v\\in K$.", "eq:2.15": "<b>(2.15)<\/b> Dérivabilité (au sens de Fréchet) en $u$ : il existe $L\\in V'$ (linéaire continue) avec $J(u+w)=J(u)+L(w)+o(w)$, $\\lim_{w\\to0}|o(w)|/\\norm w=0$ ; on note $L=J'(u)$.", "eq:2.16": "<b>(2.16)<\/b> Version Hilbert (Riesz) de (2.15) : $J(u+w)=J(u)+\\ps pw+o(w)$ pour un unique $p\\in V$, noté aussi $J'(u)$ (le gradient).", "eq:2.17": "<b>(2.17)<\/b> Encadrement de l'Ex. 2.4.1 : $J(u+w)\\ge J(u)+L_1(w)+o(w)$ et $J(u+w)\\le J(u)+L_2(w)+o(w)$ avec $L_1,L_2\\in V'$ ⇒ $J$ est dérivable en $u$ et $L_1=L_2=J'(u)$.", "eq:2.18": "<b>(2.18)<\/b> Dérivée de Gâteaux (directionnelle) : $\\lim_{\\delta\\to0^+}\\frac{J(u+\\delta w)-J(u)}\\delta=L(w)$ pour tout $w$ (plus faible que Fréchet).", "eq:2.19": "<b>(2.19)<\/b> « $J$ est convexe sur $V$ » — première des trois conditions équivalentes de la Prop. 2.4.4 (avec (2.20) et (2.21)).", "eq:2.20": "<b>(2.20)<\/b> Tangente sous le graphe : $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}$ pour tous $u,v\\in V$ (équivaut à la convexité, Prop. 2.4.4).", "eq:2.21": "<b>(2.21)<\/b> Monotonie du gradient : $\\ps{J'(u)-J'(v)}{u-v}\\ge0$ pour tous $u,v\\in V$ (équivaut à la convexité, Prop. 2.4.4).", "eq:2.22": "<b>(2.22)<\/b> « $J$ est α-convexe sur $V$ » — première des trois conditions équivalentes de la Prop. 2.4.5 (avec (2.23) et (2.24)).", "eq:2.23": "<b>(2.23)<\/b> Tangente + parabole : $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}+\\frac\\alpha2\\norm{v-u}^2$ pour tous $u,v$ (équivaut à l'α-convexité, Prop. 2.4.5).", "eq:2.24": "<b>(2.24)<\/b> Forte monotonie : $\\ps{J'(u)-J'(v)}{u-v}\\ge\\alpha\\norm{u-v}^2$ pour tous $u,v$ (équivaut à l'α-convexité, Prop. 2.4.5).", "eq:2.25": "<b>(2.25)<\/b> Dans la preuve de la Prop. 2.4.5, pour $\\varphi(t)=J(u+t(v-u))$ : $\\varphi'(t)-\\varphi'(s)\\ge\\alpha(t-s)\\norm{v-u}^2$ pour $t\\ge s$ (c'est (2.24) le long du segment).", "eq:2.27": "<b>(2.27)<\/b> Taylor à l'ordre 2 (Lemme 2.4.8) : $J(u+w)=J(u)+\\ps{J'(u)}w+\\frac12J''(u)(w,w)+o(\\norm w^2)$.", "eq:2.28": "<b>(2.28)<\/b> Convexité par la Hessienne (Ex. 2.4.7) : $J$ convexe ⟺ $J''(u)(w,w)\\ge0$, et α-convexe ⟺ $J''(u)(w,w)\\ge\\alpha\\norm w^2$, pour tous $u,w\\in V$.", "eq:2.29": "<b>(2.29)<\/b> Inéquation d'Euler (Th. 2.5.1) : $u\\in K$ et $\\ps{J'(u)}{v-u}\\ge0$ pour tout $v\\in K$ — nécessaire pour un minimum local sur $K$ convexe, suffisante si $J$ est convexe. Si $u$ est intérieur : $J'(u)=0$.", "eq:2.30": "<b>(2.30)<\/b> Le quotient de la preuve du Th. 2.5.1 : $\\frac{J(u+h(v-u))-J(u)}h\\ge0$ pour $h\\in]0,1]$ (car $u+h(v-u)\\in K$), dont la limite en $0^+$ est $\\ps{J'(u)}{v-u}$.", "eq:2.31": "<b>(2.31)<\/b> Sous-espace affine $K=u_0+\\mathcal P$ (Ex. 2.5.7) : (2.29) ⟺ $u\\in K$ et il existe $\\lambda_1,\\dots,\\lambda_M\\in\\R$ avec $J'(u)+\\sum_i\\lambda_ia_i=0$.", "eq:2.32": "<b>(2.32)<\/b> Cône $K=\\{\\ps{a_i}v\\le0\\}$ (Ex. 2.5.8) : $\\ps{J'(u)}u=0$ et $\\ps{J'(u)}w\\ge0$ pour tout $w\\in K$.", "eq:2.33": "<b>(2.33)<\/b> Cône (Ex. 2.5.8) : $u\\in K$ et il existe $\\lambda_1,\\dots,\\lambda_M\\ge0$ avec $J'(u)+\\sum_i\\lambda_ia_i=0$, et $\\lambda_i=0$ si $\\ps{a_i}u<0$ — un KKT à la main.", "eq:2.34": "<b>(2.34)<\/b> Second ordre, condition nécessaire sans contrainte (Prop. 2.5.3) : $J'(u)=0$ et $J''(u)(w,w)\\ge0$ pour tout $w\\in V$.", "eq:2.35": "<b>(2.35)<\/b> Second ordre, condition suffisante (Prop. 2.5.3) : $J'(u)=0$ et $J''(v)(w,w)\\ge0$ pour tout $w$ et tout $v$ dans un voisinage de $u$ ⇒ $u$ est un minimum local.", "eq:2.36": "<b>(2.36)<\/b> Contraintes d'égalité : $K=\\{v\\in V,\\ F(v)=0\\}$ avec $F=(F_1,\\dots,F_M):V\\to\\R^M$.", "eq:2.37": "<b>(2.37)<\/b> Condition de Lagrange (Th. 2.5.6) : si $u$ est un minimum local sur $\\{F=0\\}$ et les $F_i'(u)$ sont libres, il existe $\\lambda_1,\\dots,\\lambda_M\\in\\R$ (multiplicateurs) avec $J'(u)+\\sum_{i=1}^M\\lambda_iF_i'(u)=0$.", "eq:2.38": "<b>(2.38)<\/b> Cône des directions admissibles d'une contrainte d'égalité régulière : $K(u)=\\Ker F'(u)=\\{w:\\ \\ps{F_i'(u)}w=0\\ \\forall i\\}$, l'espace tangent.", "eq:2.39": "<b>(2.39)<\/b> Contraintes de moments (Ex. 2.5.15) : $\\rho=\\int f\\,dv$, $\\rho u=\\int vf\\,dv$, $\\frac12\\rho|u|^2+\\frac N2\\rho T=\\frac12\\int|v|^2f\\,dv$.", "eq:2.40": "<b>(2.40)<\/b> Lemme 2.5.10 : $\\inf_{F(v)=0}J(v)=\\inf_{v\\in V}\\ \\sup_{\\mu\\in\\R^M}\\Lag(v,\\mu)$ avec $\\Lag(v,\\mu)=J(v)+\\mu\\cdot F(v)$ — le Lagrangien internalise la contrainte.", "eq:2.41": "<b>(2.41)<\/b> Valeur optimale paramétrée par le niveau de contrainte (Lemme 2.5.12) : $J_{\\min}(\\ell)=\\inf_{F(v)=\\ell}J(v)$, $\\ell\\in\\R^M$.", "eq:2.42": "<b>(2.42)<\/b> Second ordre sous contraintes (Prop. 2.5.13) : $\\big(J''(u)+\\sum_i\\lambda_iF_i''(u)\\big)(w,w)\\ge0$ pour tout $w\\in K(u)=\\bigcap_i[F_i'(u)]^\\perp$ — la Hessienne du Lagrangien, sur l'espace tangent.", "eq:2.43": "<b>(2.43)<\/b> Dans la preuve de la Prop. 2.5.13 : l'ordre 1 le long d'une courbe de $K$ redonne $J'(u)+\\sum_i\\lambda_iF_i'(u)=0$.", "eq:2.44": "<b>(2.44)<\/b> Contraintes d'inégalité : $K=\\{v\\in V,\\ F_i(v)\\le0,\\ 1\\le i\\le M\\}$ ; $I(u)=\\{i: F_i(u)=0\\}$ est l'ensemble des contraintes actives en $u$.", "eq:2.45": "<b>(2.45)<\/b> Qualification (Déf. 2.5.15) : il existe une direction $\\bar w\\in V$ telle que,
