p\\cdot F(u)=0$ est le geste à retenir : quand $P$ est un cône et que l'inégalité est vraie en $p$, on la teste en $0$ et en $2p$ pour obtenir une égalité.", "reflexes": ["R1", "R5", "R12"], "liens": {"fiche": "2.6.2", "scene": "col", "guide": "r-2-6-2"}, "num": "2.6.2"}, {"id": "2.6.4", "kind": "th", "label": "Théorème 2.6.4", "nom": "Kuhn–Tucker : dans le cas convexe, KKT devient nécessaire et suffisant", "enonce": "$J,F_i$ convexes continues sur $V$, dérivables sur $K=\\{F\\le0\\}$, contraintes qualifiées en $u\\in K$. Alors $u$ est un minimum global ssi il existe $p\\in(\\R^+)^M$ tel que $(u,p)$ soit un point-selle de $\\Lag$ sur $V\\times(\\R^+)^M$, ssi (2.63) : $F(u)\\le0$, $p\\ge0$, $p\\cdot F(u)=0$, $J'(u)+p\\cdot F'(u)=0$.", "chaine": [["but", "Fermer la boucle : minimum ⇒ KKT ⇒ point-selle ⇒ minimum. Le dernier maillon est §2.6.2 ; le premier est KKT §2.5.17 (grâce à la qualification). Il reste le milieu : KKT ⇒ point-selle."], ["question", "KKT dit que $\\Lag(\\cdot,p)$ est **stationnaire** en $u$. Le point-selle demande que $u$ **minimise** $\\Lag(\\cdot,p)$ sur tout $V$. Qu'est-ce qui transforme « dérivée nulle » en « minimum global » ? La convexité : tangente sous le graphe (2.20)."], ["pas", "$v\\mapsto J(v)+p\\cdot F(v)$ est convexe (somme de fonctions convexes à coefficients $p_i\\ge0$) et sa dérivée est nulle en $u$ : donc $\\Lag(v,p)\\ge\\Lag(u,p)+\\ps{\\partial_v\\Lag(u,p)}{v-u}=\\Lag(u,p)$ pour tout $v$. C'est l'inégalité de droite."], ["pas", "Inégalité de gauche : $\\Lag(u,q)-\\Lag(u,p)=(q-p)\\cdot F(u)=q\\cdot F(u)\\le0$ pour $q\\ge0$, puisque $p\\cdot F(u)=0$ et $F(u)\\le0$."], ["controle", "La suffisance (KKT ⇒ minimum) tient en une ligne et **sans qualification** : pour $v\\in K$, $J(v)\\ge J(v)+p\\cdot F(v)\\ge J(u)+p\\cdot F(u)+\\ps{J'(u)+p\\cdot F'(u)}{v-u}=J(u)$. La qualification ne sert qu'au sens nécessaire, via §2.5.17."], ["bilan", "Dans le cas convexe, **résoudre le système (2.63), c'est résoudre le problème** : l'analyse par cas de KKT n'est plus seulement une liste de candidats, le survivant est LE minimum. Attention à la diapo : le « Théorème 2.6.9 » des diapos mélange ce théorème et le Corollaire 2.6.12."]], "livre": "Identique. Noter la remarque 2.6.5 : des égalités affines s'écrivent comme deux inégalités affines (donc convexes), ce qui fait rentrer les contraintes $Av=b$ dans le théorème.", "reflexes": ["R1", "R14"], "liens": {"fiche": "2.6.4", "scene": "kkt", "guide": "r-2-6-4"}, "num": "2.6.4"}, {"id": "2.6.6", "kind": "th", "label": "Lemme 2.6.6", "nom": "Sensibilité, cas des inégalités : la tangente de pente −λ reste sous J_min", "enonce": "Sous les hypothèses de Kuhn–Tucker, $J_{\\min}(\\ell)=\\inf_{F(v)\\le\\ell}J(v)$ ; si la solution $u_\\ell$ est unique pour $\\ell$ petit et $J_{\\min}$ différentiable en $0$, alors $\\lambda_i=-\\partial J_{\\min}/\\partial\\ell_i(0)$.", "chaine": [["but", "Même énoncé que §2.5.12, mais je n'ai plus $F(u_\\ell)=\\ell$ (seulement $\\le\\ell$) : le calcul par dérivation en chaîne ne passe plus tel quel. En revanche j'ai la convexité, donc des inégalités **globales**."], ["idee", "Au lieu de dériver, écrire que $u$ minimise globalement $J+\\lambda\\cdot F$ (convexe, dérivée nulle, §2.6.4) : $J(v)+\\lambda\\cdot F(v)\\ge J(u)+\\lambda\\cdot F(u)=J(u)$ pour tout $v$. Puis tester $v=u_\\ell$."], ["pas", "$v=u_\\ell$ : $F(u_\\ell)\\le\\ell$ et $\\lambda\\ge0$ donnent $\\lambda\\cdot F(u_\\ell)\\le\\lambda\\cdot\\ell$, d'où $J_{\\min}(\\ell)+\\lambda\\cdot\\ell\\ge J_{\\min}(0)$ (2.66) : la fonction affine $\\ell\\mapsto J_{\\min}(0)-\\lambda\\cdot\\ell$ est **sous** le graphe de $J_{\\min}$ et le touche en $0$."], ["pas", "Si $J_{\\min}$ est différentiable en $0$ : $J_{\\min}(\\ell)=J_{\\min}(0)+\\nabla J_{\\min}(0)\\cdot\\ell+o(\\ell)$, donc $(\\nabla J_{\\min}(0)+\\lambda)\\cdot\\ell+o(\\ell)\\ge0$ pour tout $\\ell$ petit ; avec $\\ell=te$ puis $\\ell=-te$, $t\\to0^+$ : $(\\nabla J_{\\min}(0)+\\lambda)\\cdot e=0$ pour tout $e$. Donc $\\nabla J_{\\min}(0)=-\\lambda$."], ["controle", "Comme $\\lambda\\ge0$, $J_{\\min}$ décroît quand $\\ell$ croît : relâcher une contrainte ne peut qu'aider. Si la contrainte $i$ est inactive, $\\lambda_i=0$ et $J_{\\min}$ est plate dans cette direction."], ["bilan", "Deux façons d'obtenir une sensibilité : dériver (égalités, §2.5.12) ou **encadrer par une tangente** (inégalités, convexité). La seconde est plus robuste : (2.66) est vraie pour tout $\\ell$, pas seulement au premier ordre."]], "livre": "Identique (T15). L'inégalité (2.66) est l'inégalité de sous-gradient : $-\\lambda$ est un sous-gradient de la fonction convexe $J_{\\min}$ en $0$ — un lien avec la Définition 3.3.19.", "reflexes": ["R12", "R5"], "liens": {"fiche": "2.5.12", "scene": "kkt", "guide": "r-2-6-6"}, "num": "2.6.6"}, {"id": "2.6.9", "kind": "th", "label": "Théorème 2.6.9 (et Rem. 2.6.11)", "nom": "Dualité : le sandwich 𝒢 ≤ ℒ ≤ 𝒥, et quand il se referme", "enonce": "$\\mathcal J(v)=\\sup_{q\\in P}\\Lag(v,q)$ (primal), $\\mathcal G(q)=\\inf_{v\\in U}\\Lag(v,q)$ (dual). Toujours : $\\inf_v\\sup_q\\Lag\\ge\\sup_q\\inf_v\\Lag$ (2.75). Et $(u,p)$ est un point-selle ssi $\\mathcal J(u)=\\min\\mathcal J=\\max\\mathcal G=\\mathcal G(p)$ (2.71).", "chaine": [["but", "Comprendre pourquoi « point-selle » et « $\\min\\mathcal J=\\max\\mathcal G$, valeurs atteintes » sont la même chose. Avant tout, voir l'inégalité qui est **toujours** vraie."], ["pas", "Dualité faible. Pour tous $v,q$ : $\\mathcal G(q)=\\inf_{v'}\\Lag(v',q)\\le\\Lag(v,q)\\le\\sup_{q'}\\Lag(v,q')=\\mathcal J(v)$. Un sandwich : toute valeur duale minore toute valeur primale. Je prends le sup en $q$ à gauche, l'inf en $v$ à droite : $\\sup\\mathcal G\\le\\inf\\mathcal J$ (2.75). La différence est le saut de dualité, positif ou nul."], ["question", "Quand le sandwich se referme-t-il ? Il faut un $v=u$ et un $q=p$ où les deux inégalités du sandwich sont des égalités : $\\mathcal G(p)=\\Lag(u,p)=\\mathcal J(u)$. Je traduis : $\\Lag(u,p)=\\inf_v\\Lag(v,p)$ et $\\Lag(u,p)=\\sup_q\\Lag(u,q)$ — c'est exactement la définition du point-selle !"], ["pas", "Point-selle ⇒ (2.71). Soit $\\Lag^*=\\Lag(u,p)$. Pour tout $v$ : $\\mathcal J(v)\\ge\\Lag(v,p)\\ge\\Lag^*$ (seconde inégalité du point-selle), et $\\mathcal J(u)=\\sup_q\\Lag(u,q)=\\Lag^*$ (première inégalité). Donc $\\min\\mathcal J=\\Lag^*=\\mathcal J(u)$. Symétriquement $\\max\\mathcal G=\\Lag^*=\\mathcal G(p)$."], ["pas", "(2.71) ⇒ point-selle. Soit $\\Lag^*=\\mathcal J(u)=\\mathcal G(p)$. Par définition du sup : $\\Lag(u,q)\\le\\mathcal J(u)=\\Lag^*$ pour tout $q$ ; par définition de l'inf : $\\Lag(v,p)\\ge\\mathcal G(p)=\\Lag^*$ pour tout $v$. En particulier ($q=p$, $v=u$) $\\Lag(u,p)=\\Lag^*$, et les deux inégalités sont celles du point-selle."], ["controle", "Rien d'autre que des définitions de sup et d'inf : ce théorème n'utilise ni convexité ni dérivée. Contre-exemple sans point-selle : $\\Lag(v,q)=(v-q)^2$ sur $[0,1]^2$, $\\inf\\sup=\\frac14>\\sup\\inf=0$ (Ex. 2.6.1). Coquille des diapos : $\\inf I\\le\\sup G$ est à l'envers."], ["bilan", "Dès qu'il y a un $\\inf\\sup$, écrire le **sandwich** $\\inf_v\\Lag\\le\\Lag(v,q)\\le\\sup_q\\Lag$ et en prendre les bornes (T9). L'égalité est une propriété rare — c'est exactement le point-selle — et c'est elle qu'Uzawa exploite : maximiser $\\mathcal G$ (facile, concave, contraintes $q\\ge0$) donne $\\min\\mathcal J$."]], "livre": "Identique. Le livre définit $\\mathcal J$ et $\\mathcal G$ en supposant l'existence du point-selle (pour que les domaines soient non vides) ; les formules ont un sens sans cette hypothèse, et (2.75) aussi.", "reflexes": ["R1", "R10"], "liens": {"fiche": "2.6.9", "scene": "col", "guide": "r-2-6-9"}, "num": "2.6.9"}, {"id": "2.6.12", "kind": "th", "label": "Corollaire 2.6.12", "nom": "La dualité en optimisation convexe : résoudre le dual, puis récupérer u", "enonce": "$J,F_i$ convexes dérivables, $u\\in K$ avec contraintes qualifiées, $u$ minimum global. Alors il existe $p\\ge0$ tel que : $p$ maximise $\\mathcal G$ sur $(\\R^+)^M$ ; $(u,p)$ est un point-selle ; et (2.78) : $F(u)\\le0$, $p\\ge0$, $p\\cdot F(u)=0$, $J'(u)+p\\cdot F'(u)=0$.", "chaine": [["but", "Assembler : Kuhn–Tucker donne le point-selle, la dualité donne « $p$ maximise $\\mathcal G$ ». Et comprendre à quoi ça sert."], ["pas", "§2.6.4 : $u$ minimum global + qualification ⇒ $p\\ge0$ avec $(u,p)$ point-selle et (2.78). §2.6.9 : point-selle ⇒ $\\mathcal G(p)=\\max\\mathcal G$."], ["question", "Pourquoi préférer le dual ? $\\mathcal G(q)=\\inf_v\\big(J(v)+q\\cdot F(v)\\big)$ est un **infimum de fonctions affines en $q$** : donc concave, quelle que soit la convexité du primal ; et ses contraintes, $q\\ge0$, sont triviales à projeter. Le primal peut être horrible (contraintes non linéaires), le dual est toujours une maximisation concave sur un orthant."], ["pas", "Méthode en deux temps : résoudre $\\max_{q\\ge0}\\mathcal G(q)$, d'où $p$ ; puis $u$ est un minimum sans contrainte de $\\Lag(\\cdot,p)$ (inégalité de droite du point-selle). Cas quadratique (Remarque 2.6.13) : $\\Lag(\\cdot,q)$ est fortement convexe, $v(q)=A^{-1}(b-B^*q)$ est explicite, et $\\mathcal G$ est une quadratique concave de $q$."], ["controle", "Cas minuscule : $\\min(v-2)^2$ sous $v\\le1$. $\\Lag(v,q)=(v-2)^2+q(v-1)$, minimal en $v_q=2-q/2$, $\\mathcal G(q)=q-q^2/4$ : concave, maximale en $p=2$ avec $\\mathcal G(2)=1=\\min J$ ; et $\\mathcal G'(q)=1-q/2=F(v_q)$ : la dérivée du dual est la contrainte évaluée au minimiseur — c'est ce qu'Uzawa suivra. Sans convexité, le dual peut être inutile : pour $\\min(-x^2)$ sur $[-1,1]$, $\\mathcal G\\equiv-\\infty$."], ["bilan", "Le dual est la **version lisse et concave** du problème ; son gradient est la violation de la contrainte au minimiseur courant (T15). Tout l'algorithme d'Uzawa (§3.4.3) est « gradient projeté sur le dual »."]], "livre": "Identique (avec une coquille : « minimum sur $V$ » à lire « sur $K$ »). À retenir : pas d'unicité de $p$ a priori ; et l'existence de $u$ demande en plus forte convexité ou « infinie à l'infini ».", "reflexes": ["R3", "R15"], "liens": {"fiche": "2.6.12", "scene": "uzawa", "guide": "r-2-6-12"}, "num": "2.6.12"}, {"id": "3.2.1", "kind": "th", "label": "Théorème 3.2.1", "nom": "Gradient à pas optimal : converger sans contraction, grâce à l'angle droit", "enonce": "$J$ α-convexe différentiable, $J'$ lipschitzienne sur tout borné (3.5). L'algorithme $u^{n+1}=u^n-\\mu_nJ'(u^n)$, avec $\\mu_n$ qui minimise $\\mu\\mapsto J(u^n-\\mu J'(u^n))$, converge vers l'unique minimum $u$ pour tout $u^0$.", "chaine": [["but", "$u^n\\to u$, sans aucune formule pour $\\mu_n$ : je ne peux pas espérer une contraction explicite comme pour un pas fixe. Il me faut une autre stratégie."], ["acquis", "Un pas optimal fait au moins aussi bien que $\\mu=0$ : $J(u^{n+1})\\le J(u^n)$, **gratuitement**. Et $u$ est caractérisé par $J'(u)=0$ ; de plus, par (2.24) avec $J'(u)=0$ : $\\alpha\\norm{u^n-u}^2\\le\\ps{J'(u^n)}{u^n-u}\\le\\norm{J'(u^n)}\\norm{u^n-u}$, donc $\\norm{u^n-u}\\le\\norm{J'(u^n)}/\\alpha$. **La distance au but est contrôlée par la norme du gradient.** Mon objectif devient : $J'(u^n)\\to0$."], ["question", "$J(u^n)$ décroît et est minorée par $J(u)$, donc converge. Mais « converge » ne dit pas vers quoi. Pour en tirer quelque chose, il me faut une décroissance **quantifiée** : $J(u^n)-J(u^{n+1})\\ge c\\cdot(\\text{quelque chose})$ ; alors la somme des « quelque chose » converge et ils tendent vers 0 (télescopage). Quel « quelque chose » ? Idéalement $\\norm{J'(u^n)}^2$, ou à défaut $\\norm{u^{n+1}-u^n}^2$."], ["idee", "Ce que je sais du pas optimal, c'est une **condition d'optimalité** : $j(\\mu)=J(u^n-\\mu J'(u^n))$ est minimale en $\\mu_n$, donc $j'(\\mu_n)=0$, soit $\\ps{J'(u^{n+1})}{J'(u^n)}=0$ (3.6) : deux gradients successifs sont orthogonaux. C'est la seule information sur $\\mu_n$, il faut la faire travailler. Comme $u^n-u^{n+1}=\\mu_nJ'(u^n)$, elle dit aussi $\\ps{J'(u^{n+1})}{u^n-u^{n+1}}=0$."], ["pas", "Décroissance quantifiée. La forte convexité (2.23) écrite **en $u^{n+1}$** : $J(u^n)\\ge J(u^{n+1})+\\ps{J'(u^{n+1})}{u^n-u^{n+1}}+\\frac\\alpha2\\norm{u^n-u^{n+1}}^2$. Le terme croisé est nul par (3.6) : $J(u^n)-J(u^{n+1})\\ge\\frac\\alpha2\\norm{u^n-u^{n+1}}^2$ (3.7). Je somme : $\\frac\\alpha2\\sum_n\\norm{u^{n+1}-u^n}^2\\le J(u^0)-J(u)<\\infty$, donc $u^{n+1}-u^n\\to0$."], ["pas", "De $u^{n+1}-u^n\\to0$ à $J'(u^n)\\to0$. Lipschitz donne $\\norm{J'(u^{n+1})-J'(u^n)}\\le L_M\\norm{u^{n+1}-u^n}\\to0$ — mais ça ne dit pas que $J'(u^n)$ est petit, seulement que deux gradients successifs sont proches ! Sauf que... deux gradients successifs sont **orthogonaux** : Pythagore, $\\norm{J'(u^n)-J'(u^{n+1})}^2=\\norm{J'(u^n)}^2+\\norm{J'(u^{n+1})}^2\\ge\\norm{J'(u^n)}^2$. Donc $\\norm{J'(u^n)}\\le L_M\\norm{u^{n+1}-u^n}\\to0$. (3.6) a servi une seconde fois, et c'est le cœur de la preuve."], ["pas", "Il manquait un détail : $L_M$ suppose la suite bornée. $J(u^n)\\le J(u^0)$ et $J$ α-convexe est infinie à l'infini (croissance quadratique (2.12)) : donc $\\norm{u^n}\\le M$."], ["pas", "Conclusion : $\\norm{u^n-u}\\le\\norm{J'(u^n)}/\\alpha\\to0$."], ["controle", "Où chaque hypothèse sert : α-convexité à trois endroits (existence de $u$, (3.7), et la borne finale par le gradient) ; Lipschitz sur les bornés à un seul (étape 2). Rien ne donne de vitesse : le théorème ne dit pas à quel rythme $J'(u^n)\\to0$. Sur une quadratique, le pas optimal zigzague au taux $(\\kappa-1)/(\\kappa+1)$ — pas mieux que le pas fixe optimal."], ["bilan", "Quand un paramètre de l'algorithme est défini par une **optimisation** (ici $\\mu_n$), la seule chose qu'on en sait est sa condition d'optimalité, et c'est elle qu'il faut exploiter — ici l'orthogonalité (3.6), utilisée trois fois. Et le schéma « $J$ décroît ⇒ somme des carrés finie ⇒ gradient → 0 ⇒ distance → 0 » est le squelette de toutes les preuves sans contraction."]], "livre": "La preuve du livre suit exactement ces cinq temps. Ce qu'elle apprend : (i) comment on remplace l'absence de formule pour $\\mu_n$ par (3.6) ; (ii) le télescopage (T8) comme substitut de la contraction (T7). On notera que la vitesse n'est pas dans l'énoncé : pour une vitesse, il faut le pas fixe (§3.2.6) ou l'analyse spectrale (§3.3.1).", "reflexes": ["R6", "R7", "R2", "R12"], "liens": {"fiche": "3.2.1", "scene": "pasoptimal", "guide": "r-3-2-1"}, "num": "3.2.1"}, {"id": "3.2.6", "kind": "th", "label": "Théorème 3.2.6", "nom": "Gradient à pas fixe : une contraction, et d'où vient 2α/L²", "enonce": "$J$ α-convexe différentiable, $J'$ $L$-lipschitzienne sur $V$. Si $0<\\mu<2\\alpha/L^2$, $u^{n+1}=u^n-\\mu J'(u^n)$ converge vers $u$ pour tout $u^0$, et $\\norm{u^n-u}\\le\\gamma^n\\norm{u^0-u}$ avec $\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}<1$.", "chaine": [["but", "Une convergence **géométrique** : $\\norm{u^{n+1}-u}\\le\\gamma\\norm{u^n-u}$ avec $\\gamma<1$. C'est l'énoncé d'une contraction."], ["idee", "L'itération est $u^{n+1}=T(u^n)$ avec $T(v)=v-\\mu J'(v)$, et la solution est un **point fixe** : $T(u)=u-\\mu J'(u)=u$ puisque $J'(u)=0$. Il suffit donc de montrer que $T$ est contractante : $\\norm{T(v)-T(u)}\\le\\gamma\\norm{v-u}$."], ["pas", "Je développe la norme au carré (le seul calcul possible) : $\\norm{T(v)-T(u)}^2=\\norm{v-u-\\mu(J'(v)-J'(u))}^2=\\norm{v-u}^2-2\\mu\\ps{J'(v)-J'(u)}{v-u}+\\mu^2\\norm{J'(v)-J'(u)}^2$. Deux termes à contrôler, et j'ai exactement deux hypothèses."], ["pas", "Le terme croisé doit être **grand** (il est précédé d'un signe moins) : c'est la forte monotonie (2.24), $\\ps{J'(v)-J'(u)}{v-u}\\ge\\alpha\\norm{v-u}^2$. Le terme carré doit être **petit** : c'est Lipschitz, $\\norm{J'(v)-J'(u)}^2\\le L^2\\norm{v-u}^2$. D'où $\\norm{T(v)-T(u)}^2\\le(1-2\\alpha\\mu+\\mu^2L^2)\\norm{v-u}^2$."], ["pas", "Il reste à lire la constante : $1-2\\alpha\\mu+\\mu^2L^2<1$ ssi $\\mu(\\mu L^2-2\\alpha)<0$ ssi $0<\\mu<2\\alpha/L^2$ — voilà le seuil. Et le polynôme en $\\mu$ est minimal en $\\mu=\\alpha/L^2$, où $\\gamma=\\sqrt{1-\\alpha^2/L^2}$ (Remarque 2.3.8)."], ["controle", "Cas minuscule : $J=\\frac12(\\alpha x^2+Ly^2)$. Le vrai facteur est $\\max(|1-\\mu\\alpha|,|1-\\mu L|)$, inférieur à 1 jusqu'à $\\mu=2/L$ : la borne du théorème est **pessimiste** d'un facteur $\\kappa$ sur l'intervalle des pas, parce que (2.24) et Lipschitz sont utilisées séparément, chacune étant une égalité sur un axe différent, jamais sur les deux. La Proposition §3.3.1 répare cela en regardant le rayon spectral. Sans $\\alpha$ : plus de contraction (il reste la descente, §3.2.9)."], ["bilan", "Un algorithme itératif, c'est une application ; la solution, son point fixe ; la convergence, une contraction (T7). Et pour la prouver : **développer le carré**, le terme croisé pour la convexité, le terme carré pour Lipschitz — l'encadrement quadratique (T13) sous sa forme la plus simple."]], "livre": "Identique. Le livre pose $v^n=u^n-u$ et écrit (3.10). À retenir pour plus tard : la même preuve, avec la projection $P_K$ (1-lipschitzienne) en plus, donne le gradient projeté (§3.4.1) ; et avec la projection sur le dual, Uzawa (§3.4.3).", "reflexes": ["R9", "R12", "R15", "R3"], "liens": {"fiche": "3.2.6", "scene": "pasfixe", "guide": "r-3-2-6"}, "num": "3.2.6"}, {"id": "3.2.9", "kind": "th", "label": "Proposition 3.2.9 et Lemme 3.2.10", "nom": "Sans forte convexité : le lemme de descente, puis la compacité", "enonce": "Lemme 3.2.10 : si $J'$ est $L$-lipschitzienne et $v^*=v-\\mu J'(v)$, alors $J(v)-J(v^*)\\ge\\mu(1-\\frac{L\\mu}2)\\norm{J'(v)}^2$. Proposition 3.2.9 : $J$ strictement convexe différentiable sur $\\R^N$, infinie à l'infini, $J'$ $L$-lipschitzienne, $0<\\mu<2/L$ : le gradient à pas fixe converge vers $u$.", "chaine": [["but", "Plus de $\\alpha$, donc plus de contraction ni d'estimation $\\norm{u^n-u}\\le\\norm{J'(u^n)}/\\alpha$. Que me reste-t-il ? La parabole **du haut** (Lemme §2.4.10) : $J(v)\\le J(u)+\\ps{J'(u)}{v-u}+\\frac L2\\norm{v-u}^2$."], ["pas", "Lemme de descente. J'applique cette majoration au pas de gradient, $v^*-v=-\\mu J'(v)$ : $J(v^*)\\le J(v)-\\mu\\norm{J'(v)}^2+\\frac L2\\mu^2\\norm{J'(v)}^2=J(v)-\\mu(1-\\frac{L\\mu}2)\\norm{J'(v)}^2$. C'est une parabole en $\\mu$, négative pour $0<\\mu<2/L$, la plus basse en $\\mu=1/L$ : voilà d'où viennent **$2/L$** et **$1/L$**. Aucune convexité n'a servi."], ["question", "J'ai donc une décroissance quantifiée, $J(u^n)-J(u^{n+1})\\ge c\\norm{J'(u^n)}^2$ avec $c=\\mu(1-\\frac{L\\mu}2)>0$. Même schéma qu'en §3.2.1 : je somme, $\\sum\\norm{J'(u^n)}^2<\\infty$, donc $J'(u^n)\\to0$. Mais sans $\\alpha$, « gradient petit » n'implique pas « proche de $u$ ». Comment conclure ?"], ["idee", "Par **compacité** : je suis dans $\\R^N$ et $J$ est infinie à l'infini. $J(u^n)\\le J(u^0)$ borne la suite ; j'extrais une sous-suite convergente $u^{n'}\\to\\bar u$ ; par continuité de $J'$, $J'(\\bar u)=\\lim J'(u^{n'})=0$ : $\\bar u$ est un point critique. Et $J$ strictement convexe n'a qu'un point critique, le minimum $u$ (un point critique d'une fonction convexe est un minimum global, et il est unique)."], ["pas", "Toutes les sous-suites convergentes de $(u^n)$, qui est bornée, ont la même limite $u$ : donc toute la suite converge vers $u$ (T10)."], ["controle", "Dimension finie : indispensable pour extraire. Stricte convexité : pour l'unicité du point critique (sans elle, l'algorithme converge vers un point critique, qui peut être un col : $J=\\frac12x_1^2+\\frac14x_2^4-\\frac12x_2^2$ depuis $(1,0)$, Ex. 3.2.7). Infinie à l'infini : pour la borne. Et toujours pas de vitesse : ce sera la Proposition §3.3.3."], ["bilan", "Deux outils séparés : le **lemme de descente** (de la seule hypothèse Lipschitz : chaque pas fait baisser $J$ d'au moins $c\\norm{J'}^2$) et le **relais par compacité** quand on ne contrôle pas la distance au but. À comparer avec §3.2.1 : même télescopage, mais la conclusion passe par l'extraction au lieu de passer par $\\alpha$."]], "livre": "Identique (T13 puis T10). Le lemme 3.2.10 est à connaître par cœur : c'est lui qui, dans toutes les preuves suivantes (1/n, Nesterov), fournit l'inégalité « à un pas ».", "reflexes": ["R5", "R7", "R8", "R15"], "liens": {"fiche": "3.2.9", "scene": "sandwich", "guide": "r-3-2-9"}, "num": "3.2.9"}, {"id": "3.3.1", "kind": "th", "label": "Proposition 3.3.1", "nom": "La vraie vitesse du pas fixe : linéariser et lire le rayon spectral", "enonce": "Hypothèses de §3.2.6 plus $V=\\R^N$ et $J$ de classe $C^2$. Alors le pas fixe converge pour $0<\\mu<2/L$, et pour $\\mu_{opt}=2/(L+\\alpha)$ : $\\norm{u^n-u}\\le\\gamma_{opt}^n\\norm{u^0-u}$, $\\gamma_{opt}=\\frac{L-\\alpha}{L+\\alpha}=\\frac{\\kappa-1}{\\kappa+1}$.", "chaine": [["but", "Faire mieux que $2\\alpha/L^2$ et $\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}$, qui sont pessimistes sur la quadratique. Je sais exactement ce qui se passe pour $J=\\frac12\\ps{Ax}{x}$ : $u^{n+1}-u=(\\Id-\\mu A)(u^n-u)$, et le facteur est le rayon spectral $\\max_\\lambda|1-\\mu\\lambda|$. Je voudrais la même chose pour $J$ quelconque."], ["idee", "Rendre l'erreur **linéaire** : $J'(u^n)-J'(u)=\\int_0^1J''(u+t(u^n-u))\\,dt\\ (u^n-u)=:A^n(u^n-u)$ (reste intégral, T12). Alors $u^{n+1}-u=u^n-u-\\mu(J'(u^n)-J'(u))=(\\Id-\\mu A^n)(u^n-u)$ : exactement la forme quadratique, avec une matrice $A^n$ qui dépend du pas mais reste coincée entre $\\alpha\\Id$ et $L\\Id$ (moyenne de Hessiennes qui le sont, par (2.28) et Lipschitz)."], ["pas", "$B^n=\\Id-\\mu A^n$ est symétrique avec $(1-\\mu L)\\Id\\le B^n\\le(1-\\mu\\alpha)\\Id$ ; sa norme euclidienne est son rayon spectral, $\\rho(B^n)\\le\\max(|1-\\mu L|,|1-\\mu\\alpha|)$. Pour $0<\\mu<2/L$, c'est $<1$ : contraction, convergence."], ["pas", "Optimiser $\\mu$ : $\\max(|1-\\mu\\alpha|,|1-\\mu L|)$ est minimal quand les deux valent la même chose, $1-\\mu\\alpha=\\mu L-1$, soit $\\mu=\\frac2{L+\\alpha}$ et $\\gamma=\\frac{L-\\alpha}{L+\\alpha}$."], ["controle", "Sur la quadratique $\\diag(\\alpha,L)$, c'est une égalité (Ex. 3.2.5) : on ne peut ni élargir $]0,2/L[$ ni améliorer $\\gamma_{opt}$. Avec $\\kappa$ grand, $\\gamma_{opt}\\approx1-2/\\kappa$ : il faut $\\sim\\kappa$ itérations par facteur $e$, contre $\\sim\\kappa^2$ pour la borne de §3.2.6. La différence entre les deux preuves : §3.2.6 majore séparément le terme croisé par $\\alpha$ et le terme carré par $L$, comme si les deux pires cas arrivaient en même temps."], ["bilan", "Près de la solution (et ici partout, grâce au reste intégral), **linéariser l'itération et lire les valeurs propres** (T14) donne la vitesse exacte. Et un facteur du type $\\max(|1-\\mu\\alpha|,|1-\\mu L|)$ s'optimise en égalisant les deux termes."]], "livre": "Identique. Noter la finesse : $B^n$ est symétrique, donc norme = rayon spectral ; pour une matrice non symétrique (boule pesante, §3.3.15), il faut passer par une norme adaptée, et on ne gagne qu'une convergence locale.", "reflexes": ["R16", "R5", "R3", "R15"], "liens": {"fiche": "3.3.1", "scene": "pasfixe", "guide": "r-3-3-1"}, "num": "3.3.1"}, {"id": "3.3.3", "kind": "th", "label": "Proposition 3.3.3 et Lemme 3.3.5", "nom": "Convexe mais plat : pourquoi la vitesse est en 1/n", "enonce": "$J$ strictement convexe $C^2$ sur $\\R^N$, infinie à l'infini, $J'$ $L$-lipschitzienne, $0<\\mu<2/L$. Alors $0\\le J(u^n)-J(u)\\le\\frac{\\kappa}{n+1}$ avec $\\kappa=\\frac{\\norm{u^0-u}^2}{\\mu(1-L\\mu/2)}$. Lemme 3.3.5 (co-coercivité) : $\\norm{J'(v)-J'(w)}^2\\le L\\ps{J'(v)-J'(w)}{v-w}$.", "chaine": [["but", "Une vitesse sans forte convexité. Elle ne peut porter que sur $\\Delta_n=J(u^n)-J(u)$ : la distance $\\norm{u^n-u}$ peut tendre vers $0$ aussi lentement qu'on veut si $J$ est plate (Remarque 3.3.4)."], ["acquis", "Le lemme de descente : $\\Delta_n-\\Delta_{n+1}\\ge c\\norm{J'(u^n)}^2$, $c=\\mu(1-\\frac{L\\mu}2)$. Pour en faire une récurrence sur $\\Delta_n$ seul, il me faut une minoration de $\\norm{J'(u^n)}$ **par $\\Delta_n$**."], ["question", "Que relie $\\Delta_n$ au gradient, sans $\\alpha$ ? La convexité : tangente en $u^n$ sous le graphe, évaluée en $u$ : $J(u)\\ge J(u^n)+\\ps{J'(u^n)}{u-u^n}$, donc $\\Delta_n\\le\\ps{J'(u^n)}{u^n-u}\\le\\norm{J'(u^n)}\\,\\norm{u^n-u}$ (3.11). Si je savais que $\\norm{u^n-u}\\le R=\\norm{u^0-u}$, j'aurais $\\norm{J'(u^n)}\\ge\\Delta_n/R$."], ["pas", "La distance au but décroît-elle ? $\\norm{u^{n+1}-u}^2=\\norm{u^n-u}^2-2\\mu\\ps{J'(u^n)}{u^n-u}+\\mu^2\\norm{J'(u^n)}^2$ (avec $J'(u)=0$). Il me faut $\\ps{J'(u^n)}{u^n-u}\\ge\\frac1L\\norm{J'(u^n)}^2$ : c'est la **co-coercivité** (Lemme 3.3.5). Alors $\\norm{u^{n+1}-u}^2\\le\\norm{u^n-u}^2-\\mu(\\frac2L-\\mu)\\norm{J'(u^n)}^2\\le\\norm{u^n-u}^2$ dès que $\\mu<2/L$."], ["pas", "Lemme 3.3.5, par linéarisation : $J'(v)-J'(w)=A(v-w)$ avec $A=\\int_0^1J''(w+t(v-w))dt$, symétrique, $0\\le A\\le L\\Id$ (convexité et Lipschitz). Pour une telle matrice, $A^2\\le LA$ (vrai sur chaque valeur propre : $\\lambda^2\\le L\\lambda$ pour $0\\le\\lambda\\le L$). Donc $\\norm{A d}^2=\\ps{A^2d}{d}\\le L\\ps{Ad}{d}$, c'est-à-dire $\\norm{J'(v)-J'(w)}^2\\le L\\ps{J'(v)-J'(w)}{v-w}$."], ["pas", "Récurrence : $\\Delta_{n+1}\\le\\Delta_n-c\\norm{J'(u^n)}^2\\le\\Delta_n-\\frac{c}{R^2}\\Delta_n^2=\\Delta_n-\\frac{\\Delta_n^2}\\kappa$ (3.13). Cas minuscule : l'équation différentielle $\\Delta'=-\\Delta^2/\\kappa$ a pour solution $\\Delta(t)=\\kappa/(t+C)$ — d'où le $1/n$. Rigoureusement : je divise par $\\Delta_n\\Delta_{n+1}$ : $\\frac1{\\Delta_{n+1}}\\ge\\frac1{\\Delta_n}+\\frac{\\Delta_n}{\\kappa\\Delta_{n+1}}\\ge\\frac1{\\Delta_n}+\\frac1\\kappa$ (car $\\Delta_{n+1}\\le\\Delta_n$). Donc $\\frac1{\\Delta_n}\\ge\\frac1{\\Delta_0}+\\frac n\\kappa\\ge\\frac{n+1}\\kappa$ si $\\Delta_0\\le\\kappa$ (vrai : $\\Delta_0\\le\\norm{J'(u^0)}R\\le LR^2\\le\\kappa$ puisque $c\\le1/L$... le livre vérifie ce point). D'où $\\Delta_n\\le\\frac\\kappa{n+1}$."], ["controle", "Pourquoi pas mieux que $1/n$ ? Pour $J(x)=x^p/p$ avec $p$ grand, la décroissance observée est en $n^{-p/(p-2)}$, exposant qui tend vers $1$ : l'ordre $1/n$ est optimal pour le gradient à pas fixe sur l'ensemble des fonctions convexes. Pour aller plus vite sans $\\alpha$, il faut changer d'algorithme : Nesterov, $1/n^2$."], ["bilan", "Schéma à retenir : **inégalité à un pas** (descente) + **inégalité de convexité** (valeur ≤ gradient × distance) + **distance décroissante** (co-coercivité) ⇒ récurrence $\\Delta_{n+1}\\le\\Delta_n-\\Delta_n^2/\\kappa$ ⇒ $1/n$. Et le cas minuscule $\\Delta'=-\\Delta^2/\\kappa$ dit immédiatement l'ordre de grandeur."]], "livre": "Le livre donne l'idée (T8 télescopage, T13) ; la co-coercivité y est prouvée par la même linéarisation $A=\\int J''$ (T12). La récurrence (3.13) ⇒ $\\kappa/(n+1)$ est un petit lemme arithmétique qu'il vaut la peine de refaire une fois : il revient dans toutes les vitesses « sous-linéaires ».", "reflexes": ["R2", "R3", "R7", "R12"], "liens": {"fiche": "3.3.3", "scene": "vitesses", "guide": "r-3-3-3"}, "num": "3.3.3"}, {"id": "3.3.7", "kind": "th", "label": "Proposition 3.3.7", "nom": "Nesterov, cas convexe : d'où sortent l'extrapolation et la suite aₙ", "enonce": "$J$ convexe différentiable, $J'$ $L$-lipschitzienne, minimum $u$, $0<\\mu\\le1/L$. Avec $a_0=1$, $v^0=u^{-1}=u^0$, $u^n=v^n-\\mu J'(v^n)$, $a_{n+1}=\\frac12\\big(1+\\sqrt{4a_n^2+1}\\big)$, $v^{n+1}=u^n+\\frac{a_n-1}{a_{n+1}}(u^n-u^{n-1})$ : $0\\le J(u^n)-J(u)\\le\\frac{\\kappa}{(n+2)^2}$, $\\kappa=\\frac2\\mu\\norm{u^0-u}^2+4(J(u^0)-J(u))$.", "chaine": [["but", "Je serai honnête : cette preuve, **on ne la devine pas** en partant de rien — on la *construit* par la méthode du potentiel, et c'est cette construction que je veux comprendre, parce qu'elle explique l'algorithme lui-même (pourquoi extrapoler, pourquoi cette suite $a_n$)."], ["acquis", "Une seule inégalité « à un pas », mais très riche. Pour $v$ quelconque, $v^*=v-\\mu J'(v)$ et $\\mu\\le1/L$ : le lemme de descente donne $J(v^*)\\le J(v)-\\frac\\mu2\\norm{J'(v)}^2$, et la convexité $J(v)\\le J(w)+\\ps{J'(v)}{v-w}$ pour tout $w$. Ensemble, et en reconnaissant un carré ($v^*-v=-\\mu J'(v)$) : $$J(v^*)-J(w)\\ \\le\\ \\frac1{2\\mu}\\Big(\\norm{v-w}^2-\\norm{v^*-w}^2\\Big)\\qquad\\text{pour tout }w.\\qquad(\\star)$$ Un pas de gradient depuis $v$ rapproche de **n'importe quel** $w$, d'une quantité qui domine le gain en valeur."], ["essai", "Avec $w=u$ et $v=u^n$ (gradient ordinaire), $(\\star)$ sommée donne $\\sum\\Delta_n\\le\\frac1{2\\mu}\\norm{u^0-u}^2$ : la moyenne des $\\Delta_n$ est en $1/n$, pas mieux. Pour obtenir $1/n^2$, il faut **pondérer** : multiplier l'inégalité du pas $n$ par un poids $a_n^2$ croissant comme $n^2$, et obtenir malgré tout un télescopage."], ["question", "Télescoper demande, à chaque pas, une différence « (quantité au rang $n$) − (même quantité au rang $n+1$) ». Pour les valeurs : $a_{n+1}^2\\Delta_{n+1}-a_n^2\\Delta_n$. Pour les distances : $\\norm{z^n-u}^2-\\norm{z^{n+1}-u}^2$ avec un point auxiliaire $z^n$ à déterminer. Je cherche donc à combiner $(\\star)$ pour obtenir **exactement** $a_{n+1}^2\\Delta_{n+1}-a_n^2\\Delta_n\\le\\frac1{2\\mu}\\big(\\norm{z^n-u}^2-\\norm{z^{n+1}-u}^2\\big)$."], ["idee", "J'écris $(\\star)$ au pas $n+1$ (depuis $v=v^{n+1}$, arrivée $u^{n+1}$) avec les deux seuls points que je connais, $w=u^n$ et $w=u$, et je les combine avec des poids $(1-\\frac1a)$ et $\\frac1a$, $a=a_{n+1}$ : à gauche $\\Delta_{n+1}-(1-\\frac1a)\\Delta_n$ ; multiplié par $a^2$, cela fait $a^2\\Delta_{n+1}-(a^2-a)\\Delta_n$, qui télescope si $a^2-a=a_n^2$ — **c'est la définition de la suite $a_n$** ! À droite, une identité algébrique (vraie pour tout $x,y,z,u$, à vérifier en développant) : si $v=(1-\\frac1a)x+\\frac1az$ alors $a^2\\big[(1-\\frac1a)(\\norm{v-x}^2-\\norm{y-x}^2)+\\frac1a(\\norm{v-u}^2-\\norm{y-u}^2)\\big]=\\norm{z-u}^2-\\norm{z'-u}^2$ avec $z'=x+a(y-x)$. Elle impose que $v^{n+1}$ soit la **combinaison** $(1-\\frac1{a_{n+1}})u^n+\\frac1{a_{n+1}}z^n$, avec $z^{n+1}=u^n+a_{n+1}(u^{n+1}-u^n)$ : c'est exactement l'extrapolation du livre ($z^n=u^n-p^n$ dans ses notations)."], ["pas", "Donc, avec $E_n=\\norm{z^n-u}^2+2\\mu a_n^2\\Delta_n$ : $E_{n+1}\\le E_n$. Le potentiel décroît, et $2\\mu a_n^2\\Delta_n\\le E_0=\\norm{u^0-u}^2+2\\mu\\Delta_0$ (car $z^0=u^0$, $a_0=1$)."], ["pas", "Enfin $a_{n+1}=\\frac{1+\\sqrt{1+4a_n^2}}2\\ge\\frac{1+2a_n}2=a_n+\\frac12$, donc $a_n\\ge1+\\frac n2$, et $\\Delta_n\\le\\frac{E_0}{2\\mu(1+n/2)^2}=\\frac{\\frac2\\mu\\norm{u^0-u}^2+4\\Delta_0}{(n+2)^2}$."], ["controle", "Où $\\mu\\le1/L$ sert : pour que le lemme de descente donne le $\\frac\\mu2$ propre de $(\\star)$. Où la convexité sert : dans $(\\star)$, deux fois (en $w=u^n$ et $w=u$). L'extrapolation n'est pas un choix esthétique : c'est **le point d'où il faut partir** pour que le potentiel télescope. Et $1/n^2$ est optimal pour les méthodes du premier ordre (Remarque 3.3.9)."], ["bilan", "La **méthode du potentiel** : on ne devine pas $E_n$, on l'impose par la condition de télescopage, et cette condition *définit* les coefficients de l'algorithme. C'est ainsi qu'on conçoit un algorithme accéléré, et c'est le réflexe T8 poussé au bout."]], "livre": "Le livre part des notations $p^n=(a_n-1)(u^{n-1}-u^n)$ et développe $\\norm{u^{n+1}-p^{n+1}-u}^2$ (3.15), majore deux produits scalaires par convexité et utilise (3.17) ; l'identité $a_{n+1}(a_{n+1}-1)=a_n^2$ fait le reste. C'est la même preuve écrite « en avant » ; la version « en arrière » ci-dessus montre pourquoi chaque ingrédient est là. Technique à emporter : l'inégalité $(\\star)$, forme optimale du lemme de descente + convexité, qui resservira pour le proximal (§3.3.32).", "reflexes": ["R6", "R7", "R12", "R5"], "liens": {"fiche": "3.3.7", "scene": "acceleres", "guide": "r-3-3-7"}, "num": "3.3.7"}, {"id": "3.3.10", "kind": "th", "label": "Proposition 3.3.10", "nom": "Nesterov, cas fortement convexe : pourquoi √κ", "enonce": "$J$ α-convexe, $J'$ $L$-lipschitzienne, $0<\\mu\\le1/L$, $q=\\alpha/L$. Avec la suite (3.19) ($a_{n+1}$ définie par $a_{n+1}^2-a_{n+1}=a_n^2(1-qa_{n+1})$, extrapolation de coefficient $\\frac{(a_n-1)(1-a_{n+1}\\alpha\\mu)}{a_{n+1}(1-\\alpha\\mu)}$), la suite converge et, pour $\\mu=1/L$ : $\\norm{u^n-u}\\le\\frac2\\alpha\\gamma_{Nest}^n\\norm{u^0-u}$ avec $\\gamma_{Nest}=1-\\sqrt{\\alpha/L}$.", "chaine": [["but", "Comprendre d'où vient le $\\sqrt{\\alpha/L}=1/\\sqrt\\kappa$, alors que le gradient ne donne que $1-1/\\kappa$ (à constante près)."], ["acquis", "La même inégalité à un pas que §3.3.7, mais **renforcée** par la forte convexité (Lemme 3.3.12) : $J(w)+\\frac{1-\\alpha\\mu}{2\\mu}\\norm{w-v}^2\\ge J(v^*)+\\frac1{2\\mu}\\norm{v^*-w}^2$. Par rapport à $(\\star)$, la distance de départ est multipliée par $(1-\\alpha\\mu)<1$ : chaque pas **contracte** aussi le terme de distance, pas seulement le terme de valeur."], ["idee", "Même construction de potentiel $E_n=\\norm{z^n-u}^2+2\\mu a_n^2\\Delta_n$, mais maintenant les deux termes se contractent : le terme de valeur par le jeu des $a_n$, le terme de distance par le facteur $(1-\\alpha\\mu)$. Le meilleur réglage **équilibre les deux contractions** ; l'équation d'équilibre est $a_{n+1}^2-a_{n+1}=a_n^2(1-qa_{n+1})$ (Lemme 3.3.13), dont le point fixe est $a=1/\\sqrt q$. Avec $a_n\\equiv1/\\sqrt q$ et $\\mu=1/L$, le potentiel est multiplié à chaque pas par $1-\\sqrt q$ : c'est $\\gamma_{Nest}$."], ["pas", "Lecture de l'extrapolation : pour $a_n\\to1/\\sqrt q$ et $\\mu=1/L$, le coefficient tend vers $\\frac{1-\\sqrt q}{1+\\sqrt q}$ (Remarque 3.3.11) — la valeur « standard » de Nesterov fortement convexe."], ["pas", "Conclusion : $2\\mu a_n^2\\Delta_n\\le\\gamma_{Nest}^nE_0$ environ, et $\\frac\\alpha2\\norm{u^n-u}^2\\le\\Delta_n$ (forte convexité en $u$) donne la borne sur $\\norm{u^n-u}$ — avec la constante $2/\\alpha$, pas homogène, trace de ce passage valeur → distance."], ["controle", "Pourquoi $\\sqrt\\kappa$ et pas $\\kappa$ ? Dans le gradient, un seul mécanisme contracte (la distance, au facteur $1-\\alpha\\mu\\approx1-1/\\kappa$). Ici, la contraction est partagée entre deux termes dont l'équilibre se fait en $a=1/\\sqrt q=\\sqrt\\kappa$ : un gain de $\\sqrt{\\cdot}$ qui vient d'un **produit** $a_n^2q$ égal à $1$ à l'équilibre. Sur une quadratique, l'erreur mesurée suit bien $\\gamma_{Nest}^n$."], ["bilan", "À retenir : **équilibrer deux mécanismes de contraction** produit une racine carrée ; c'est la signature de toutes les méthodes accélérées (boule pesante : module $\\sqrt\\nu$ de racines complexes ; GC : polynômes de Tchebychev). Le détail de (3.19) est à comprendre une fois, pas à mémoriser."]], "livre": "La preuve du livre repose sur les Lemmes 3.3.12 (encadrement quadratique le plus fin, T13) et 3.3.13 (croissance de $a_n$ vers $1/\\sqrt q$) ; c'est la même méthode du potentiel que §3.3.7, avec un facteur de contraction en plus. Ce qu'il faut emporter est le facteur $\\gamma_{Nest}=1-\\sqrt{\\alpha/L}$, et la remarque que la constante $\\frac2\\alpha$ n'est pas homogène (elle vient de la conversion valeur → distance).", "reflexes": ["R6", "R15", "R5"], "liens": {"fiche": "3.3.7", "scene": "acceleres", "guide": "r-3-3-10"}, "num": "3.3.10"}, {"id": "3.3.15", "kind": "th", "label": "Théorème 3.3.15", "nom": "La boule pesante : régler μ et ν pour que toutes les racines aient le même module", "enonce": "$J$ convexe $C^2$ avec $\\alpha\\Id\\le J''\\le L\\Id$. L'itération $u^{n+1}=u^n-\\mu J'(u^n)+\\nu(u^n-u^{n-1})$ converge localement pour $0\\le\\nu<1$, $0<\\mu<2(1+\\nu)/L$ ; pour $\\nu=\\big(\\frac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}\\big)^2$ et $\\mu=\\frac4{(\\sqrt L+\\sqrt\\alpha)^2}$ : $\\norm{u^n-u}\\le C\\gamma_{BP}^n\\norm{u^0-u}$ avec $\\gamma_{BP}=\\frac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}$.", "chaine": [["but", "Une méthode à deux pas (de l'inertie) : comment en analyser la vitesse, et comment choisir $\\mu,\\nu$ ? L'énoncé ne promet qu'une convergence **locale** : signe qu'on va linéariser (T14)."], ["idee", "Près de $u$, $J'(u^n)\\approx H(u^n-u)$ avec $H=J''(u)$. L'itération devient linéaire sur l'erreur $e^n=u^n-u$ : $e^{n+1}=(1+\\nu)e^n-\\mu He^n-\\nu e^{n-1}$. À deux pas, je l'écris à un pas sur le couple $z^n=(e^n,e^{n-1})$ : $z^{n+1}=Az^n$ avec $A=\\begin{pmatrix}(1+\\nu)\\Id-\\mu H&-\\nu\\Id\\\\ \\Id&0\\end{pmatrix}$. La vitesse est le rayon spectral de $A$."], ["pas", "Je diagonalise $H$ : sur chaque direction propre de valeur propre $\\lambda\\in[\\alpha,L]$, la récurrence est scalaire, $e_{n+1}=(1+\\nu-\\mu\\lambda)e_n-\\nu e_{n-1}$, d'équation caractéristique $\\rho^2-(1+\\nu-\\mu\\lambda)\\rho+\\nu=0$. Les racines $\\rho_\\pm(\\lambda)$ donnent $e_n\\sim\\rho^n$."], ["question", "Comment rendre $\\max|\\rho|$ le plus petit possible, **uniformément** en $\\lambda\\in[\\alpha,L]$ ? Observation clé : le produit des racines vaut $\\nu$ (coefficient constant). Si les racines sont **complexes conjuguées**, elles ont toutes deux le module $\\sqrt\\nu$ — le même pour tout $\\lambda$ ! Il suffit donc que le discriminant soit $\\le0$ sur tout $[\\alpha,L]$ : $(1+\\nu-\\mu\\lambda)^2\\le4\\nu$."], ["pas", "$(1+\\nu-\\mu\\lambda)^2\\le4\\nu$ équivaut à $|1+\\nu-\\mu\\lambda|\\le2\\sqrt\\nu$, soit $(1-\\sqrt\\nu)^2\\le\\mu\\lambda\\le(1+\\sqrt\\nu)^2$. Comme $\\lambda$ parcourt $[\\alpha,L]$, il faut $(1-\\sqrt\\nu)^2\\le\\mu\\alpha$ et $\\mu L\\le(1+\\sqrt\\nu)^2$ : $\\sqrt\\nu\\ge1-\\sqrt{\\mu\\alpha}$ et $\\sqrt\\nu\\ge\\sqrt{\\mu L}-1$."], ["pas", "Je veux $\\nu$ minimal (c'est le facteur) : j'égalise les deux bornes, $1-\\sqrt{\\mu\\alpha}=\\sqrt{\\mu L}-1$, soit $\\sqrt\\mu=\\frac2{\\sqrt L+\\sqrt\\alpha}$ — d'où $\\mu=\\frac4{(\\sqrt L+\\sqrt\\alpha)^2}$ — puis $\\sqrt\\nu=\\sqrt{\\mu L}-1=\\frac{2\\sqrt L}{\\sqrt L+\\sqrt\\alpha}-1=\\frac{\\sqrt L-\\sqrt\\alpha}{\\sqrt L+\\sqrt\\alpha}=\\gamma_{BP}$."], ["controle", "Aux valeurs propres extrêmes, le discriminant est nul : racine double, et l'erreur y décroît comme $n\\gamma_{BP}^n$ — d'où la constante $C$ (la matrice $A$ n'est pas diagonalisable, on passe par une norme adaptée où $\\norm A\\le\\rho+\\delta$). Convergence locale seulement, parce que la linéarisation néglige $o(\\norm{e^n})$. Pour $\\nu=0$ on retrouve le pas fixe et son $\\gamma=\\frac{L-\\alpha}{L+\\alpha}$ : la boule pesante remplace $(L,\\alpha)$ par $(\\sqrt L,\\sqrt\\alpha)$."], ["bilan", "Analyser une récurrence à deux pas : passer au système, diagonaliser la Hessienne, résoudre le **polynôme caractéristique par valeur propre**, et chercher le régime où toutes les racines sont complexes de même module $\\sqrt\\nu$ — la racine carrée vient de là (T14). Le livre contient trois coquilles dans cette preuve (bornes inversées, $\\mu$ au lieu de $\\sqrt\\mu$) ; l'énoncé est juste."]], "livre": "Identique dans l'idée (stabilité locale, rayon spectral). Ce qu'il faut emporter : « produit des racines $=\\nu$, donc si elles sont complexes leur module est $\\sqrt\\nu$ » — le mécanisme exact de l'accélération, et le même qui fait marcher une suspension amortie de façon critique en physique.", "reflexes": ["R16", "R5", "R3", "R15"], "liens": {"fiche": "3.3.15", "scene": "acceleres", "guide": "r-3-3-15"}, "num": "3.3.15"}, {"id": "3.3.17", "kind": "th", "label": "Proposition 3.3.17 (admise)", "nom": "Gradient conjugué : pourquoi des directions conjuguées terminent en N pas", "enonce": "Pour $J(x)=\\frac12\\ps{Ax}x-\\ps bx$ ($A$ symétrique définie positive, valeurs propres $\\lambda_1\\le\\dots\\le\\lambda_N$) : $x^{n+1}=x^n-\\mu_np^n$, $r^{n+1}=r^n-\\mu_nAp^n$, $p^{n+1}=r^{n+1}+\\beta_np^n$ avec $p^0=r^0=Ax^0-b$, $\\mu_n=\\frac{\\norm{r^n}^2}{\\ps{Ap^n}{p^n}}$, $\\beta_n=\\frac{\\norm{r^{n+1}}^2}{\\norm{r^n}^2}$. Alors $\\norm{x^n-x}\\le2\\sqrt{\\lambda_N/\\lambda_1}\\Big(\\frac{1-\\sqrt{\\lambda_1/\\lambda_N}}{1+\\sqrt{\\lambda_1/\\lambda_N}}\\Big)^n\\norm{x^0-x}$, et la méthode termine en au plus $N$ pas.", "chaine": [["but", "Comprendre ce que « conjuguées » veut dire et pourquoi cela supprime le zigzag — la borne de vitesse, elle, est admise."], ["question", "Le pas optimal zigzague parce que la direction $n+1$ **défait** le gain de la direction $n$. Puis-je choisir les directions pour que minimiser le long de $p^{n+1}$ ne dérègle pas ce que j'ai optimisé le long de $p^n$ ? Pour une quadratique, oui, si $\\ps{Ap^{n+1}}{p^n}=0$ : c'est la **conjugaison**."], ["image", "Dans les coordonnées $y=A^{1/2}x$, $J$ devient $\\frac12\\norm{y-y^*}^2$ : un bol rond. Deux directions $A$-conjuguées deviennent **orthogonales**. Minimiser exactement un bol rond le long de directions orthogonales successives, c'est atteindre le centre en $N$ pas : chaque minimisation fixe une coordonnée sans toucher aux autres."], ["pas", "D'où vient $\\beta_n$ ? J'impose $p^{n+1}=r^{n+1}+\\beta_np^n$ conjugué à $p^n$ : $\\ps{A r^{n+1}}{p^n}+\\beta_n\\ps{Ap^n}{p^n}=0$, soit $\\beta_n=-\\ps{Ar^{n+1}}{p^n}/\\ps{Ap^n}{p^n}$ (3.32). Les identités du pas optimal ($\\ps{r^{n+1}}{p^n}=0$, et $\\mu_nAp^n=r^n-r^{n+1}$) transforment cette formule en $\\norm{r^{n+1}}^2/\\norm{r^n}^2$ : la version de (3.35), qui ne demande qu'un produit scalaire."], ["pas", "Pourquoi $N$ pas (Ex. 3.3.2) : par récurrence, les $p^k$ sont deux à deux conjugués et les $r^k$ deux à deux orthogonaux, et $x^n$ minimise $J$ sur $x^0+\\Vect\\{p^0,\\dots,p^{n-1}\\}$ ; en dimension $N$, ce sous-espace devient tout $\\R^N$ au bout de $N$ directions non nulles."], ["controle", "La vitesse $\\gamma_{BP}$ (avec $\\kappa=\\lambda_N/\\lambda_1$) s'obtient en remarquant que $x^n-x$ est un polynôme en $A$ de degré $n$ appliqué à $x^0-x$, optimal parmi tous ces polynômes, et en le comparant au polynôme de Tchebychev : c'est la partie admise. Elle explique aussi pourquoi le GC profite d'un spectre groupé (deux paquets ⇒ deux itérations)."], ["bilan", "Conjuguer = orthogonaliser dans le bon produit scalaire ; minimiser le long de directions orthogonales d'un bol rond termine en $N$ pas ; et la vitesse $\\sqrt\\kappa$, sans aucun paramètre à régler, est le prix du produit scalaire $A$. En pratique, on préconditionne pour rapprocher $A$ de l'identité (Remarque 3.3.18)."]], "livre": "Le livre admet la proposition et renvoie la conjugaison à l'Exercice 3.3.2. La chose à emporter n'est pas la borne, c'est la lecture dans l'espace $y=A^{1/2}x$ et le fait que, pour une quadratique, Polak–Ribière et Fletcher–Reeves coïncident.", "reflexes": ["R3", "R12"], "liens": {"fiche": "3.3.17", "scene": "acceleres", "guide": "r-3-3-17"}, "num": "3.3.17"}, {"id": "3.3.21", "kind": "th", "label": "Lemmes 3.3.20 et 3.3.21", "nom": "Sous-gradients : 0 ∈ ∂J(x) est un minimum, et le gradient d'un morceau actif est un sous-gradient", "enonce": "$\\partial J(x)=\\{p:\\ J(y)-J(x)\\ge\\ps p{y-x}\\ \\forall y\\}$. Lemme 3.3.20 : si $0\\in\\partial J(x)$, $x$ est un minimum. Lemme 3.3.21 : si $\\mathcal J=\\max_\\lambda J_\\lambda$ ($\\Lambda$ fini, $J_\\lambda$ convexes dérivables) et $J_\\lambda(x)=\\mathcal J(x)$, alors $J_\\lambda'(x)\\in\\partial\\mathcal J(x)$.", "chaine": [["but", "Remplacer « $J'(x)=0$ » par quelque chose qui a un sens aux points anguleux, et savoir **calculer** un sous-gradient d'un maximum."], ["pas", "Lemme 3.3.20 : avec $p=0$, la définition dit $J(y)\\ge J(x)$ pour tout $y$. C'est littéralement « $x$ est un minimum ». (Et réciproquement.)"], ["question", "Pour un max de fonctions lisses, $\\mathcal J$ n'est pas dérivable là où deux morceaux se croisent. Mais chaque morceau actif a une tangente en $x$ qui **passe par** $(x,\\mathcal J(x))$ et reste sous $J_\\lambda$, donc sous $\\mathcal J\\ge J_\\lambda$ : c'est un plan d'appui."], ["pas", "$\\mathcal J(y)-\\mathcal J(x)\\ge J_\\lambda(y)-J_\\lambda(x)\\ge\\ps{J_\\lambda'(x)}{y-x}$ : la première inégalité parce que $\\mathcal J\\ge J_\\lambda$ et $\\mathcal J(x)=J_\\lambda(x)$, la seconde par convexité de $J_\\lambda$ (tangente sous le graphe)."], ["controle", "Au minimum du max de trois paraboles (point triple), $\\partial\\mathcal J(x^*)$ est l'enveloppe convexe des trois gradients actifs, et contient $0$ bien qu'aucun $J_\\lambda'(x^*)$ ne soit nul. La norme d'un sous-gradient ne dit rien de l'optimalité ($\\partial|x|(0)=[-1,1]$) : d'où la normalisation dans l'algorithme §3.3.23."], ["bilan", "Le sous-différentiel est **l'éventail des plans d'appui** ; en un point lisse il se réduit au gradient. Pour un max fini, un sous-gradient se lit sur n'importe quel morceau actif — c'est ce que l'algorithme du sous-gradient utilise."]], "livre": "Identique (deux lignes). Coquille des diapos : $\\partial J(x)=\\{x\\}$ pour $J$ dérivable, lire $\\{J'(x)\\}$.", "reflexes": ["R1", "R3"], "liens": {"fiche": "3.3.19", "scene": "sousdiff", "guide": "r-3-3-21"}, "num": "3.3.21"}, {"id": "3.3.23", "kind": "th", "label": "Proposition 3.3.23", "nom": "L'algorithme du sous-gradient : suivre la distance, pas la valeur", "enonce": "$J$ convexe, infinie à l'infini, de sous-différentiel non vide, localement lipschitzienne. $x^{k+1}=x^k-\\rho_k\\frac{p^k}{\\norm{p^k}}$ avec $p^k\\in\\partial J(x^k)$ et $\\rho_k\\to0$, $\\sum\\rho_k=+\\infty$, $\\sum\\rho_k^2<+\\infty$ (3.39). Alors $x^k$ converge vers un minimum.", "chaine": [["but", "Converger alors que $J(x^k)$ **ne décroît pas** (un sous-gradient n'est pas une direction de descente : Remarque 3.3.26). La quantité à suivre ne peut donc pas être $J(x^k)$. Laquelle ?"], ["acquis", "D'abord, y a-t-il quelque chose vers quoi converger ? Oui : on est dans $\\R^n$ (Définition 3.3.19), $J$ est continue (localement lipschitzienne — et de toute façon une fonction convexe finie sur $\\R^n$ est automatiquement continue, Lemme §2.3.5) et infinie à l'infini : le Théorème §2.2.1 donne un minimum $x^*$, de valeur $J^*=\\min J$. Il n'est **pas forcément unique** (pas de stricte convexité), et la preuve devra en tenir compte. En dimension infinie, « continue + infinie à l'infini » ne suffirait pas (Exemple 2.3.1), mais la convexité sauverait encore l'existence (Théorème §2.3.9)."], ["idee", "La distance à un minimum $x^*$. Un sous-gradient fait, par définition, un angle aigu avec $x^k-x^*$ : $\\ps{p^k}{x^k-x^*}\\ge J(x^k)-J(x^*)\\ge0$ (définition en $y=x^*$). Donc un petit pas dans la direction $-p^k$ **rapproche** de $x^*$, même s'il fait monter $J$."], ["pas", "Je développe : $\\norm{x^{k+1}-x^*}^2=\\norm{x^k-x^*}^2-\\frac{2\\rho_k}{\\norm{p^k}}\\ps{p^k}{x^k-x^*}+\\rho_k^2\\le\\norm{x^k-x^*}^2-\\frac{2\\rho_k}{\\norm{p^k}}\\big(J(x^k)-J^*\\big)+\\rho_k^2$ (3.40). Un terme qui rapproche (proportionnel à $\\rho_k$ et à l'écart en valeur), un terme de bruit $\\rho_k^2$."], ["pas", "Je somme (télescopage) : $\\sum_{k\\le i}\\frac{2\\rho_k}{\\norm{p^k}}(J(x^k)-J^*)\\le\\norm{x^0-x^*}^2+\\sum\\rho_k^2$. Le membre de droite est fini grâce à $\\sum\\rho_k^2<\\infty$ — c'est pour cela que cette condition est là. Et les itérés restent bornés (par la même inégalité), donc $\\norm{p^k}\\le L_M$ (fonction localement lipschitzienne : ses sous-gradients sont bornés)."], ["pas", "Donc $\\min_{k\\le i}(J(x^k)-J^*)\\cdot\\frac2{L_M}\\sum_{k\\le i}\\rho_k\\le\\norm{x^0-x^*}^2+\\sum\\rho_k^2$, soit (3.41) : $\\min_{k\\le i}(J(x^k)-J^*)\\le\\frac{L_M(\\norm{x^0-x^*}^2+\\sum\\rho_k^2)}{2\\sum_{k\\le i}\\rho_k}\\to0$ parce que $\\sum\\rho_k=\\infty$ — c'est pour cela que **cette** condition est là. Lecture des deux conditions : assez de carburant pour arriver, pas trop de bruit pour s'arrêter."], ["question", "Avec $a_k=J(x^k)-J^*\\ge0$, ce que (3.41) me donne vraiment, c'est $\\inf_ka_k=0$ (la suite $\\min_{k\\le i}a_k$ décroît vers $0$). Est-ce la même chose que $\\liminf a_k=0$ ? **Non** : si $a_{k_0}=0$ pour un seul indice (l'itéré $x^{k_0}$ tombe sur un minimum, puis repart, car un sous-gradient non nul peut exister en un minimum non lisse) et $a_k\\ge c>0$ ensuite, (3.41) est vraie et pourtant aucune sous-suite de valeurs ne tend vers $J^*$. Il me faut des indices $k_j\\to\\infty$ avec $a_{k_j}\\to0$."], ["idee", "Je n'ai pas tout utilisé : rien ne m'oblige à sommer (3.40) **à partir de $0$**. En sommant de $k=j$ à $i$, pour un $j$ quelconque : $\\min_{j\\le k\\le i}a_k\\le\\frac{L_M}2\\,\\frac{\\norm{x^j-x^*}^2+\\sum_{k\\ge j}\\rho_k^2}{\\sum_{k=j}^i\\rho_k}\\to0$ quand $i\\to\\infty$, car la queue $\\sum_{k\\ge j}\\rho_k$ d'une série divergente diverge encore, et le numérateur est fixe. Donc $\\inf_{k\\ge j}a_k=0$ **pour tout $j$** — et c'est exactement la définition de la limite inférieure : $\\liminf a_k=\\lim_{j\\to\\infty}\\inf_{k\\ge j}a_k=0$. J'en tire des indices $k_1<k_2<\\dots$ avec $a_{k_m}\\le1/m$ (à chaque étape, l'inf sur $k>k_{m-1}$ est nul). Variante équivalente : la somme entière donne $\\sum_k\\rho_ka_k<\\infty$, et avec $\\sum\\rho_k=\\infty$ une suite positive ne peut pas rester $\\ge\\eps$ à partir d'un rang."], ["pas", "Il reste à faire converger **toute** la suite. $J(x^{k_j})\\to J^*$ et $(x^{k_j})$ est bornée : une sous-suite converge vers un $\\bar x$, et $J(\\bar x)=J^*$ par continuité — un minimum, **pas forcément le $x^*$ de départ** (je le renomme $x^*$ ; (3.40) est valable pour n'importe quel minimum). Puis (3.40) sans le terme négatif : $\\norm{x^{k+1}-x^*}^2\\le\\norm{x^k-x^*}^2+\\rho_k^2$ ; à partir d'un rang $k'$ où $\\norm{x^{k'}-x^*}^2\\le\\delta/2$ et $\\sum_{i\\ge k'}\\rho_i^2\\le\\delta/2$, la suite ne peut plus s'éloigner de plus de $\\delta$. Convergence (T10)."], ["controle", "Pourquoi normaliser $p^k$ ? Parce que $\\norm{p^k}$ ne tend pas vers 0 près de $x^*$ (il reste $\\sim R$ pour le max de bols) : impossible de s'en servir comme pas ou comme test d'arrêt. Pas constant : le terme $\\rho_0^2$ ne s'éteint jamais, plafond. $\\rho_k=1/k^2$ : $\\sum\\rho_k<\\infty$, trajet total borné, la suite s'arrête avant $x^*$. Vitesse : $C/k^{1/2-\\eps}$ pour $\\rho_k=(k+1)^{-1/2-\\eps}$ (Remarque 3.3.25), très lent."], ["bilan", "Quand la valeur $J$ ne décroît pas, **changer de quantité** : la distance à la solution, que l'inégalité de sous-gradient contrôle. Les conditions sur les pas ($\\sum\\rho=\\infty$, $\\sum\\rho^2<\\infty$) se lisent directement sur l'inégalité télescopée. Le gradient stochastique (§3.3.28) obéit exactement à la même logique."]], "livre": "Identique (T8 télescopage sur $\\norm{x^k-x^*}^2$). L'énoncé du livre demande $J$ localement lipschitzienne pour borner les sous-gradients ; c'est automatique pour une fonction convexe finie sur $\\R^n$ (Lemme 2.3.5), mais le livre préfère l'hypothèse explicite.", "reflexes": ["R6", "R7", "R12", "R15"], "liens": {"fiche": "3.3.23", "scene": "sousgradient", "guide": "r-3-3-23"}, "num": "3.3.23"}, {"id": "3.3.28", "kind": "th", "label": "Proposition 3.3.28", "nom": "Gradient stochastique : la même preuve, en espérance", "enonce": "$F=\\frac1n\\sum_if_i$ α-convexe, $\\frac1n\\sum_i\\norm{f_i'(x)}^2\\le C(1+\\norm{x-x^*}^2)$ (3.44). Alors $x^{k+1}=x^k-\\mu^kf_{i_k}'(x^k)$, $i_k$ uniforme, converge en moyenne pour $\\mu^k=\\frac1{k+1}$.", "chaine": [["but", "Un seul gradient $f_{i_k}'$ par itération au lieu de $n$ : le pas est **bruité**. Que peut-on prouver ? Pas une convergence sûre, une convergence en espérance : $\\mathbb E\\norm{x^k-x^*}^2\\to0$."], ["idee", "Même geste que pour le sous-gradient : développer $\\norm{x^{k+1}-x^*}^2$ (3.45), puis prendre l'espérance **sur le tirage $i_k$, à $x^k$ fixé**. Le terme croisé devient déterministe : $\\mathbb E[f_{i_k}'(x^k)]=\\frac1n\\sum_if_i'(x^k)=F'(x^k)$, et la forte monotonie donne $\\ps{F'(x^k)}{x^k-x^*}\\ge\\alpha\\norm{x^k-x^*}^2$. Le terme carré est contrôlé par (3.44)."], ["pas", "$\\mathbb E\\norm{x^{k+1}-x^*}^2\\le(1-2\\alpha\\mu^k+C(\\mu^k)^2)\\norm{x^k-x^*}^2+C(\\mu^k)^2$. Deux termes : une contraction de facteur $1-2\\alpha\\mu^k+C(\\mu^k)^2$, et un bruit $C(\\mu^k)^2$ qui ne s'éteint que si $\\mu^k\\to0$."], ["pas", "Deux exigences contradictoires : $\\mu^k\\to0$ pour tuer le bruit, mais $\\sum\\mu^k=\\infty$ pour que le produit des facteurs $\\prod(1-2\\alpha\\mu^k)$ tende vers 0. $\\mu^k=\\frac1{k+1}$ satisfait les deux : $e_k=\\mathbb E\\norm{x^k-x^*}^2$ vérifie une récurrence du type $e_{k+1}\\le(1-\\frac{2\\alpha}{k+1})e_k+\\frac C{(k+1)^2}$, dont la solution décroît comme $1/k$ (si $2\\alpha>1$) ou $k^{-2\\alpha}$ sinon."], ["controle", "Cas minuscule : $f_i(x)=\\frac12\\norm{x-a_i}^2$, $x^*$ la moyenne des $a_i$, $\\alpha=1$ ; avec $\\mu^k=\\frac1{k+1}$, $x^k$ est exactement la moyenne des $k$ points tirés et $e_k=\\sigma^2/k$. À pas constant, les itérés tremblent autour de $x^*$ avec une erreur $\\approx\\mu\\sigma^2/2$ : le bruit impose un plancher."], ["bilan", "La logique du sous-gradient en espérance : **distance au but, terme qui rapproche, terme de bruit, pas décroissant mais pas sommable**. Lent ($1/k$), mais chaque pas coûte $n$ fois moins — et c'est ce qu'on fait en apprentissage."]], "livre": "Le livre donne l'idée (développer, espérance, forte convexité et (3.44)). À emporter : la condition (3.44) joue le rôle de la borne $L_M$ sur les sous-gradients ; elle est vérifiée pour des $f_i$ quadratiques uniformément fortement convexes ou à gradients bornés (Remarque 3.3.29).", "reflexes": ["R6", "R12", "R3"], "liens": {"fiche": "3.3.28", "guide": "r-3-3-28"}, "num": "3.3.28"}, {"id": "3.3.32", "kind": "th", "label": "Lemme 3.3.32", "nom": "L'algorithme proximal : une minimisation implicite, sans condition sur le pas", "enonce": "$J$ convexe différentiable sur $\\R^n$, de minimum unique $x^*$, $\\tau>0$, $x^{k+1}=\\prox_{\\tau J}(x^k)=\\argmin_x\\big(J(x)+\\frac1{2\\tau}\\norm{x-x^k}^2\\big)$. Alors $x^k\\to x^*$ ; si $J$ est α-convexe, $\\norm{x^k-x^*}^2\\le\\frac{\\norm{x^0-x^*}^2}{(1+2\\tau\\alpha)^k}$.", "chaine": [["but", "Un pas « implicite » : $x^{k+1}$ est défini par une minimisation, pas par une formule. Comme pour le pas optimal (§3.2.1), tout ce que j'en sais est sa **condition d'optimalité**, ou mieux : une inégalité d'optimalité."], ["idee", "La fonction $\\varphi_k(x)=J(x)+\\frac1{2\\tau}\\norm{x-x^k}^2$ est $\\frac1\\tau$-convexe (convexe plus une parabole de courbure $\\frac1\\tau$), minimale en $x^{k+1}$. La forte convexité (2.23) en son minimum, où la dérivée est nulle, dit : $\\varphi_k(x)\\ge\\varphi_k(x^{k+1})+\\frac1{2\\tau}\\norm{x-x^{k+1}}^2$ pour tout $x$ (3.54). C'est l'inégalité $(\\star)$ de Nesterov, version implicite — et elle vaut pour **tout** $\\tau$."], ["pas", "$x=x^k$ dans (3.54) : $J(x^k)\\ge J(x^{k+1})+\\frac1\\tau\\norm{x^{k+1}-x^k}^2$. Décroissance de $J$."], ["pas", "$x=x^*$ dans (3.54) : $J(x^*)+\\frac1{2\\tau}\\norm{x^*-x^k}^2\\ge J(x^{k+1})+\\frac1{2\\tau}\\norm{x^{k+1}-x^k}^2+\\frac1{2\\tau}\\norm{x^*-x^{k+1}}^2$. Donc $\\norm{x^*-x^{k+1}}^2\\le\\norm{x^*-x^k}^2-2\\tau(J(x^{k+1})-J^*)$ : la distance décroît, et en sommant $2\\tau\\sum_k(J(x^{k+1})-J^*)\\le\\norm{x^0-x^*}^2$. Avec $J(x^k)$ décroissante : $k\\,(J(x^k)-J^*)\\le\\frac1{2\\tau}\\norm{x^0-x^*}^2$, vitesse $1/k$ sur les valeurs, puis convergence de toute la suite par compacité et unicité (T10)."], ["pas", "Si $J$ est α-convexe, $\\varphi_k$ est $(\\alpha+\\frac1\\tau)$-convexe et (3.54) se renforce en $\\frac{1+\\tau\\alpha}{2\\tau}\\norm{x-x^{k+1}}^2$ ; avec $J(x^{k+1})-J^*\\ge\\frac\\alpha2\\norm{x^{k+1}-x^*}^2$ (forte convexité en $x^*$) : $\\norm{x^*-x^k}^2\\ge(1+2\\tau\\alpha)\\norm{x^*-x^{k+1}}^2$. Géométrique, et **d'autant plus rapide que $\\tau$ est grand**."], ["controle", "Aucune condition de petitesse sur $\\tau$ : c'est la signature des schémas implicites (Remarque 3.3.33). Le prix : chaque pas est une minimisation. Pour $J$ non dérivable, remplacer $J'$ par le sous-différentiel ne change rien à la preuve, qui n'utilise que (2.23) via (3.54). Et $\\prox$ de l'indicatrice d'un convexe = projection : le gradient projeté est un cas particulier."], ["bilan", "Un pas implicite donne une inégalité d'optimalité **pour tout $x$** (3.54), qu'on teste en $x^k$ (descente) et en $x^*$ (distance) : exactement la stratégie de $(\\star)$. C'est la même preuve que Nesterov et le sous-gradient, mais sans bruit et sans condition sur le pas."]], "livre": "Identique (T13, T10). Le lien à faire : l'inégalité (3.54) est la forme « forte » de la condition d'optimalité $0\\in\\partial J(x^{k+1})+\\frac1\\tau(x^{k+1}-x^k)$, le gradient implicite (3.50). Pour le LASSO, le prox de $\\norm\\cdot_1$ est le seuillage doux : la raison pour laquelle l'algorithme produit des zéros exacts.", "reflexes": ["R11", "R5", "R6", "R7"], "liens": {"fiche": "3.3.32", "guide": "r-3-3-32"}, "num": "3.3.32"}, {"id": "3.4.1", "kind": "th", "label": "Théorème 3.4.1", "nom": "Gradient projeté : l'inéquation d'Euler est une équation de point fixe", "enonce": "$K$ convexe fermé, $J$ α-convexe différentiable, $J'$ $L$-lipschitzienne, $0<\\mu<2\\alpha/L^2$. L'algorithme $u^{n+1}=P_K\\big(u^n-\\mu J'(u^n)\\big)$ converge vers la solution $u$ de $\\inf_KJ$, quel que soit $u^0\\in K$.", "chaine": [["but", "Mêmes hypothèses qu'en §3.2.6, plus un convexe $K$. Je voudrais réutiliser la preuve par contraction : $u$ point fixe d'une application contractante $T_K$, et $u^{n+1}=T_K(u^n)$."], ["acquis", "Sans contrainte, $T(v)=v-\\mu J'(v)$ contracte de rapport $\\gamma=\\sqrt{1-2\\alpha\\mu+\\mu^2L^2}<1$, et $u$ est son point fixe **parce que** $J'(u)=0$. Avec $K$, $J'(u)\\ne0$ en général : $u$ n'est plus point fixe de $T$, et $T(u^n)$ sort de $K$. Ce que je sais de $u$, c'est l'inéquation d'Euler (§2.5.1) : $\\ps{J'(u)}{v-u}\\ge0$ pour tout $v\\in K$."], ["question", "Un pas de gradient qui sort de $K$, le plus naturel est de le **ramener** dans $K$ par la projection $P_K$. Mais est-ce que $u$ est point fixe de $P_K\\circ T$ ? Autrement dit : $u=P_K(u-\\mu J'(u))$ ? Ce que je sais d'une projection, c'est sa caractérisation (8.1) : $y=P_Kx$ ssi $\\ps{x-y}{v-y}\\le0$ pour tout $v\\in K$."], ["idee", "Je mets les deux caractérisations côte à côte. Euler, multipliée par $-\\mu<0$ : $\\ps{-\\mu J'(u)}{v-u}\\le0$, soit $\\ps{(u-\\mu J'(u))-u}{v-u}\\le0$ pour tout $v\\in K$. C'est **exactement** (8.1) avec $x=u-\\mu J'(u)$ et $y=u$. Donc $u=P_K(u-\\mu J'(u))$ (3.58), pour tout $\\mu>0$. L'algorithme n'est pas un choix : c'est l'inéquation d'Euler relue comme une équation de point fixe."], ["pas", "Contraction. $\\norm{u^{n+1}-u}=\\norm{P_K(Tu^n)-P_K(Tu)}\\le\\norm{Tu^n-Tu}\\le\\gamma\\norm{u^n-u}$, à condition que $P_K$ soit **1-lipschitzienne** (8.2). La composée d'une contraction de rapport $\\gamma$ et d'une application 1-lipschitzienne est une contraction de rapport $\\gamma$ : $\\norm{u^n-u}\\le\\gamma^n\\norm{u^0-u}\\to0$."], ["pas", "Pourquoi $P_K$ est 1-lipschitzienne : j'écris (8.1) deux fois en croisant. Pour $x$ avec $v=P_Kx'$ : $\\ps{x-P_Kx}{P_Kx'-P_Kx}\\le0$ ; pour $x'$ avec $v=P_Kx$ : $\\ps{x'-P_Kx'}{P_Kx-P_Kx'}\\le0$. J'additionne : $\\ps{(x-x')-(P_Kx-P_Kx')}{P_Kx'-P_Kx}\\le0$, c'est-à-dire $\\norm{P_Kx-P_Kx'}^2\\le\\ps{x-x'}{P_Kx-P_Kx'}\\le\\norm{x-x'}\\,\\norm{P_Kx-P_Kx'}$ (Cauchy–Schwarz). Je simplifie : $\\norm{P_Kx-P_Kx'}\\le\\norm{x-x'}$."], ["controle", "$u^0\\in K$ ne sert même pas à la preuve (dès $u^1$, tout est dans $K$ : algorithme *faisable*, Remarque 3.4.2). Le seuil $2\\alpha/L^2$ est aussi pessimiste qu'en §3.2.6 : sur une quadratique la contraction tient jusqu'à $2/L$. Et le vrai problème est ailleurs : pour un $K$ quelconque, **on ne sait pas calculer $P_K$** — le gradient projeté n'est praticable que si la projection est explicite (pavé, sous-espace affine). Au point limite, la ligne de niveau $J=J(u)$ est tangente à $K$ et $-J'(u)$ est dans le cône normal : c'est (3.58) dessinée."], ["bilan", "Deux réflexes. **Une condition d'optimalité est une équation de point fixe** : il suffit de la mettre sous la forme $\\ps{x-y}{v-y}\\le0$ pour reconnaître une projection, et l'algorithme s'écrit tout seul. Et **contraction ∘ 1-lipschitzienne = contraction** : tout ce que l'on compose avec une projection (ou une troncature, cf. Uzawa) garde sa vitesse. La preuve de (8.2) par croisement de (8.1) est la même manœuvre que le croisement des inéquations d'Euler en §3.4.3."]], "livre": "Identique (T7). Le livre renvoie à la preuve de §3.2.6 pour la contraction de $T$ et à (8.2) pour la projection. À emporter : la lecture (3.57)–(3.58) de l'inéquation d'Euler, qui resservira telle quelle pour le multiplicateur d'Uzawa (3.65) et pour l'algorithme proximal (§3.3.32, où $P_K$ devient $\\prox$).", "reflexes": ["R9", "R1", "R12", "R15"], "liens": {"fiche": "3.4.1", "scene": "projete", "guide": "r-3-4-1"}, "voir": ["3.2.6", "2.5.1"], "num": "3.4.1"}, {"id": "3.4.3", "kind": "th", "label": "Théorème 3.4.3", "nom": "Uzawa : pas de contraction en p, mais une énergie qui décroît et qui contrôle u", "enonce": "$J$ α-convexe différentiable, $F:V\\to\\R^M$ convexe et $L$-lipschitzienne (3.67), $0<\\mu<2\\alpha/L^2$. L'algorithme d'Uzawa — $u^n$ minimise $\\Lag(\\cdot,p^n)=J+p^n\\cdot F$, puis $p^{n+1}=P_{\\R^M_+}\\big(p^n+\\mu F(u^n)\\big)$ (3.66) — vérifie $u^n\\to u$, solution de $\\inf_{F\\le0}J$, quel que soit $p^0\\ge0$.", "chaine": [["but", "$u^n\\to u$. Ce que je sais de la cible : par Kuhn–Tucker (§2.6.4), il existe $p\\ge0$ tel que $(u,p)$ soit point-selle de $\\Lag$ ; $u$ minimise $\\Lag(\\cdot,p)$ ; et l'inégalité de gauche du point-selle, $(p-q)\\cdot F(u)\\ge0$ pour tout $q\\ge0$, se relit comme en §3.4.1 : $p=P_{\\R^M_+}\\big(p+\\mu F(u)\\big)$ (3.65). **Le couple $(u,p)$ est un point fixe de l'itération d'Uzawa.**"], ["essai", "Premier réflexe, copier §3.4.1 : montrer que $q\\mapsto P_{\\R^M_+}\\big(q+\\mu F(u_q)\\big)$ est contractante, où $u_q$ minimise $\\Lag(\\cdot,q)$. Il me faudrait une forte monotonie de $q\\mapsto-F(u_q)$, c'est-à-dire une forte concavité de la fonction duale $\\mathcal G(q)=\\inf_v\\Lag(v,q)$ (dont le gradient est $F(u_q)$, T15)."], ["impasse", "Il n'y en a pas : le multiplicateur $p$ n'est même pas unique en général (Remarque 2.6.13), donc aucune contraction en $q$ n'est possible. D'ailleurs l'énoncé ne promet **rien** sur $p^n$. Il faut une autre stratégie — et la bonne cible n'est pas $\\norm{p^n-p}\\to0$ mais $\\norm{u^n-u}\\to0$."], ["question", "Si $\\norm{p^n-p}$ ne contracte pas, décroît-elle au moins ? Je développe, en soustrayant le point fixe (3.65) à (3.66) et en utilisant $P_{\\R^M_+}$ 1-lipschitzienne, avec $r^n=p^n-p$ : $$\\norm{r^{n+1}}^2\\le\\norm{r^n+\\mu(F(u^n)-F(u))}^2=\\norm{r^n}^2+2\\mu\\,r^n\\cdot\\big(F(u^n)-F(u)\\big)+\\mu^2\\norm{F(u^n)-F(u)}^2.$$ Le terme carré est $\\le\\mu^2L^2\\norm{u^n-u}^2$ (Lipschitz). Tout repose sur le **signe du terme croisé** : il me faut $r^n\\cdot(F(u^n)-F(u))\\le-c\\norm{u^n-u}^2$. Intuition : si $p^n_i>p_i$, la contrainte $i$ est sur-pénalisée, $u^n$ est plus « rentré » que $u$, donc $F_i(u^n)<F_i(u)$ : le produit est négatif. Reste à le prouver."], ["idee", "La seule information sur $u^n$ et $u$ est qu'ils minimisent $\\Lag(\\cdot,p^n)$ et $\\Lag(\\cdot,p)$. Un minimiseur, je le caractérise par son inéquation d'Euler — ici celle de l'Exercice 2.5.6, car $p\\cdot F$ est convexe mais pas forcément dérivable : $\\ps{J'(u)}{v-u}+p\\cdot(F(v)-F(u))\\ge0$ pour tout $v$ (3.68), et de même pour $(u^n,p^n)$ (3.69). **Je croise** : $v=u^n$ dans (3.68), $v=u$ dans (3.69), et j'additionne : $\\ps{J'(u)-J'(u^n)}{u^n-u}+(p-p^n)\\cdot\\big(F(u^n)-F(u)\\big)\\ge0$. Avec la forte monotonie (2.24) : $r^n\\cdot\\big(F(u^n)-F(u)\\big)\\le-\\ps{J'(u^n)-J'(u)}{u^n-u}\\le-\\alpha\\norm{u^n-u}^2$ (3.70). C'est le signe espéré, et quantifié par $\\alpha$."], ["pas", "Je recolle : $\\norm{r^{n+1}}^2\\le\\norm{r^n}^2-(2\\alpha\\mu-\\mu^2L^2)\\norm{u^n-u}^2$. Pour $0<\\mu<2\\alpha/L^2$, $\\beta=2\\alpha\\mu-\\mu^2L^2>0$ et $$\\beta\\norm{u^n-u}^2\\le\\norm{r^n}^2-\\norm{r^{n+1}}^2.\\qquad(3.71)$$"], ["pas", "Je somme (télescopage, T8) : $\\beta\\sum_n\\norm{u^n-u}^2\\le\\norm{r^0}^2<\\infty$, donc $\\norm{u^n-u}\\to0$. La suite $\\norm{r^n}$ décroît et converge, mais vers une limite dont je ne sais rien : $p^n$ est bornée, c'est tout."], ["controle", "Même seuil $2\\alpha/L^2$ qu'en §3.2.6, ce n'est pas un hasard : Uzawa est le gradient projeté **sur le dual**, $p^{n+1}=P_{\\R^M_+}(p^n+\\mu\\mathcal G'(p^n))$ avec $\\mathcal G'(q)=F(u_q)$, et le gradient de $\\mathcal G$ est $L^2/\\alpha$-lipschitzien (sur le cas quadratique, $-\\mathcal G''=BA^{-1}B^*$, de norme $\\le L^2/\\alpha$) : $2\\alpha/L^2=2/L_{dual}$, le seuil de la Proposition §3.2.9 pour une fonction concave sans forte concavité — ce qui explique aussi pourquoi on n'obtient pas $p^n\\to p$. Cas minuscule : $\\min(v-2)^2$ sous $v\\le1$, $u^n=2-p^n/2$, $p^{n+1}=\\max(0,p^n+\\mu(1-p^n/2))$ : facteur $|1-\\mu/2|$, convergence pour $\\mu<4=2\\alpha/L^2$ avec $\\alpha=2$, $L=1$. Si $B$ est de rang $M$ dans le cas quadratique, $p^n\\to p$ (Ex. 3.4.2)."], ["bilan", "Trois choses. **Quand il n'y a pas de contraction, chercher une quantité qui décroît** (ici $\\norm{p^n-p}^2$) **et dont la décroissance est quantifiée par ce que l'on veut** (ici $\\norm{u^n-u}^2$) : la convergence de $u^n$ se lit dans l'énergie de $p^n$. **Pour comparer deux minimiseurs, croiser leurs inéquations d'Euler** (T6/T8) : c'est la manœuvre qui produit (3.70), et c'est la même qu'en §3.4.1 pour (8.2). Enfin : l'algorithme itère sur $p$, mais la preuve parle de $u$ — et l'énoncé est honnête sur ce point."]], "livre": "La preuve du livre est exactement celle-ci : existence (Th. 2.3.8 + Kuhn–Tucker), Euler croisées (3.68)–(3.70), décroissance (3.71), télescopage. Techniques : T8 avec $E_n=\\norm{r^n}^2$, et le croisement des inéquations d'Euler, qui est la forme « variationnelle » de la monotonie du gradient. À emporter aussi : la lecture duale (T15, $\\mathcal G'(q)=F(u_q)$), qui dit ce que fait l'algorithme et pourquoi le seuil est celui du gradient sur le dual.", "reflexes": ["R6", "R12", "R9", "R15", "R1"], "liens": {"fiche": "3.4.3", "scene": "uzawa", "guide": "r-3-4-3"}, "voir": ["3.4.1", "2.6.4", "3.2.9"], "num": "3.4.3"}, {"id": "3.4.4", "kind": "th", "label": "Théorème 3.4.4 et Lemme 3.4.5", "nom": "Arrow–Hurwicz : quand les deux variables bougent, l'énergie est la somme des deux distances", "enonce": "$J$ α-convexe différentiable, $F$ convexe différentiable avec $\\norm{F'}\\le C_F$, et $v\\mapsto J'(v)+q\\cdot F'(v)$ $L$-lipschitzienne pour tout $q\\ge0$. L'algorithme $u^{n+1}=u^n-\\mu_n\\big(J'(u^n)+p^n\\cdot F'(u^n)\\big)$, $p^{n+1}=P_{\\R^M_+}\\big(p^n+\\mu_nF(u^n)\\big)$ (3.74), avec le pas $\\mu_n=\\frac{\\alpha\\gamma\\norm{u^n-u}^2}{C^2(\\norm{u^n-u}^2+\\norm{p^n-p}^2)}$, $0<\\gamma<1$, $C^2=\\max(2L^2+C_F^2,\\,2C_F^2)$, vérifie $u^n\\to u$. Lemme 3.4.5 : pour un point-selle $(u,p)$ et tout $(v,q)$, $q\\ge0$ : $\\frac\\alpha2\\norm{v-u}^2\\le\\ps{\\partial_v\\Lag(v,q)}{v-u}-\\partial_q\\Lag(v,q)\\cdot(q-p)$.", "chaine": [["but", "Uzawa demande à chaque pas une minimisation **exacte** en $v$. Ici on ne fait qu'un pas de gradient en $v$ (descente sur $\\Lag(\\cdot,p^n)$) et un pas en $q$ (montée sur $\\Lag(u^n,\\cdot)$, projetée). Je veux encore $u^n\\to u$."], ["fosse", "Dans §3.4.3, tout reposait sur l'inéquation d'Euler de $u^n$, minimiseur de $\\Lag(\\cdot,p^n)$. Je la perds : $u^n$ n'est plus un minimiseur de rien. Ce que j'ai à la place : $u^{n+1}-u^n=-\\mu_n\\partial_v\\Lag(u^n,p^n)$ et $p^{n+1}=P_{\\R^M_+}(p^n+\\mu_n\\partial_q\\Lag(u^n,p^n))$ avec $\\partial_q\\Lag=F$ ; et pour la cible, $\\partial_v\\Lag(u,p)=0$ et $p=P_{\\R^M_+}(p+\\mu_nF(u))$ (3.65)."], ["idee", "Les deux variables font chacune un pas de gradient depuis $(u^n,p^n)$ : par symétrie, la bonne énergie est $E_n=\\norm{u^n-u}^2+\\norm{p^n-p}^2$ (R6). Je développe les deux carrés et je regarde ce que deviennent les termes croisés : $$\\norm{u^{n+1}-u}^2=\\norm{u^n-u}^2-2\\mu_n\\ps{\\partial_v\\Lag(u^n,p^n)}{u^n-u}+\\mu_n^2\\norm{\\partial_v\\Lag(u^n,p^n)}^2,\\quad(3.75)$$ $$\\norm{p^{n+1}-p}^2\\le\\norm{p^n-p}^2+2\\mu_n\\big(F(u^n)-F(u)\\big)\\cdot(p^n-p)+\\mu_n^2\\norm{F(u^n)-F(u)}^2\\quad(3.76)$$ (la seconde par (3.65) et $P_{\\R^M_+}$ 1-lipschitzienne, comme pour Uzawa). Somme des termes croisés : $-2\\mu_n\\big[\\ps{\\partial_v\\Lag(u^n,p^n)}{u^n-u}-(F(u^n)-F(u))\\cdot(p^n-p)\\big]$. Je veux que le crochet soit $\\ge\\frac\\alpha2\\norm{u^n-u}^2$ : c'est le lemme."], ["pas", "Le lemme, à partir de la structure du Lagrangien (α-convexe en $v$, **affine** en $q$). Pour $(v,q)$ quelconque : $\\Lag(\\cdot,q)$ α-convexe donne $\\ps{\\partial_v\\Lag(v,q)}{v-u}\\ge\\Lag(v,q)-\\Lag(u,q)+\\frac\\alpha2\\norm{v-u}^2$. Affine en $q$ : $(F(v)-F(u))\\cdot(q-p)=[\\Lag(v,q)-\\Lag(v,p)]-[\\Lag(u,q)-\\Lag(u,p)]$. Je soustrais : $\\ps{\\partial_v\\Lag(v,q)}{v-u}-(F(v)-F(u))\\cdot(q-p)\\ge\\Lag(v,p)-\\Lag(u,p)+\\frac\\alpha2\\norm{v-u}^2\\ge\\frac\\alpha2\\norm{v-u}^2$, car $u$ minimise $\\Lag(\\cdot,p)$ (inégalité de droite du point-selle). Tout s'est télescopé sauf ce qu'il faut. (Le Lemme 3.4.5 du livre a $F(v)\\cdot(q-p)$ au lieu de $(F(v)-F(u))\\cdot(q-p)$ : la différence est $-F(u)\\cdot q\\ge0$ pour $q\\ge0$, donc sa version découle de celle-ci.)"], ["pas", "Les termes carrés. $\\partial_v\\Lag(u^n,p^n)=\\big[\\partial_v\\Lag(u^n,p^n)-\\partial_v\\Lag(u,p^n)\\big]+\\big[(p^n-p)\\cdot F'(u)\\big]$ (puisque $\\partial_v\\Lag(u,p)=0$) : norme $\\le L\\norm{u^n-u}+C_F\\norm{p^n-p}$, carré $\\le2L^2\\norm{u^n-u}^2+2C_F^2\\norm{p^n-p}^2$. Et $\\norm{F(u^n)-F(u)}^2\\le C_F^2\\norm{u^n-u}^2$. Total $\\le(2L^2+C_F^2)\\norm{u^n-u}^2+2C_F^2\\norm{p^n-p}^2\\le C^2E_n$ — voilà d'où sort $C^2=\\max(2L^2+C_F^2,2C_F^2)$."], ["pas", "Bilan, avec $d_n=\\norm{u^n-u}$ : $E_{n+1}\\le E_n-\\mu_n\\alpha d_n^2+\\mu_n^2C^2E_n$. Un paramètre libre, $\\mu_n$ (R5) : le trinôme en $\\mu_n$ est minimal en $\\mu_n=\\frac{\\alpha d_n^2}{2C^2E_n}$ ; le livre prend $\\mu_n=\\gamma\\frac{\\alpha d_n^2}{C^2E_n}$ avec $0<\\gamma<1$, ce qui donne $E_{n+1}\\le E_n-\\gamma(1-\\gamma)\\frac{\\alpha^2d_n^4}{C^2E_n}$. Donc $E_n$ décroît, $E_n\\le E_0$, et en sommant : $\\gamma(1-\\gamma)\\frac{\\alpha^2}{C^2E_0}\\sum_nd_n^4\\le E_0$. D'où $d_n\\to0$."], ["controle", "Le pas dépend de $u$ et $p$, inconnus : c'est un **théorème d'existence d'un pas**, pas une recette (le livre l'énonce ainsi). Et $\\mu_n\\sim d_n^2$ s'effondre quand $u^n\\to u$ : la convergence est lente. Rien sur $p^n$, comme pour Uzawa : la décroissance ne contrôle que $d_n^4/E_n$. Avec un pas constant sur l'exemple minuscule ($J=(v-2)^2$, $F=v-1$), l'itération linéarisée a la valeur propre double $1-\\mu$ : ça converge sans tourner ; avec $J=\\frac12(v-2)^2$, valeurs propres complexes, trajectoire en spirale."], ["bilan", "**Quand deux variables bougent en même temps, l'énergie est la somme des deux distances au carré, et c'est la structure point-selle (convexe en $v$, affine en $q$) qui rend le terme croisé négatif.** Le lemme n'est rien d'autre que l'inégalité de point-selle réécrite comme une inégalité de monotonie pour l'opérateur $(\\partial_v\\Lag,-\\partial_q\\Lag)$ — la forme générale derrière Uzawa, Arrow–Hurwicz et toutes les méthodes primales-duales."]], "livre": "Le livre additionne (3.75) et (3.76), applique le Lemme 3.4.5 au terme croisé et choisit le pas (T8, T13). Ce qu'il faut emporter est le lemme : une inégalité de point-selle se transforme en inégalité de monotonie en une ligne, en utilisant que $\\Lag$ est convexe en $v$ et affine en $q$.", "reflexes": ["R6", "R12", "R5", "R2"], "liens": {"fiche": "3.4.4", "scene": "uzawa", "guide": "r-3-4-4"}, "voir": ["3.4.3", "2.6.2"], "num": "3.4.4"}, {"id": "3.4.6", "kind": "th", "label": "Proposition 3.4.6", "nom": "Pénalisation : tester chaque minimiseur dans le problème de l'autre", "enonce": "$V=\\R^N$, $J$ continue strictement convexe infinie à l'infini, $F_i$ convexes continues, $K=\\{F\\le0\\}\\ne\\emptyset$. Si $u$ est la solution de $\\inf_KJ$ (3.78) et $u_\\eps$ celle de $\\inf_{\\R^N}J_\\eps$, $J_\\eps=J+\\frac1\\eps G$, $G=\\sum_i[\\max(F_i,0)]^2$ (3.79), alors $u_\\eps\\to u$ quand $\\eps\\to0$.", "chaine": [["but", "$u_\\eps\\to u$. Pas de forte convexité dans les hypothèses, donc aucune estimation quantitative à espérer : ce sera **borné ⇒ extraire ⇒ identifier la limite ⇒ unicité** (R8, T10). Mon travail est de trouver (i) pourquoi $(u_\\eps)$ est bornée, (ii) pourquoi toute limite est dans $K$, (iii) pourquoi elle minimise $J$ sur $K$."], ["acquis", "Ce qui caractérise $u_\\eps$ : $J_\\eps(u_\\eps)\\le J_\\eps(v)$ pour **tout** $v\\in\\R^N$. Ce qui caractérise $u$ : $J(u)\\le J(v)$ pour $v\\in K$. Et je connais un point particulier de $K$ : $u$ lui-même, pour lequel $G(u)=0$, donc $J_\\eps(u)=J(u)$."], ["idee", "**Tester chaque minimiseur dans le problème de l'autre** (R12). Le seul test disponible tout de suite : $v=u$ dans la minimalité de $u_\\eps$ : $$J(u_\\eps)+\\frac1\\eps G(u_\\eps)=J_\\eps(u_\\eps)\\le J_\\eps(u)=J(u).\\qquad(3.80)$$ Une ligne, deux informations : comme $G\\ge0$, $J(u_\\eps)\\le J(u)$ (3.81) — $u_\\eps$, moins contraint, fait au moins aussi bien que $u$ ; et $G(u_\\eps)\\le\\eps\\big(J(u)-J(u_\\eps)\\big)$ — la violation est de l'ordre de $\\eps$."], ["pas", "(i) Borne. $J(u_\\eps)\\le J(u)$ et $J$ infinie à l'infini : $(u_\\eps)$ reste dans l'ensemble borné $\\{J\\le J(u)\\}$. (ii) La violation tend vers 0 : $J$ continue et infinie à l'infini a un minimum $m$ sur $\\R^N$ (Th. 2.2.1), donc $0\\le G(u_\\eps)\\le\\eps(J(u)-m)\\to0$."], ["pas", "(iii) Extraction. $u_{\\eps_k}\\to u^*$ pour une suite $\\eps_k\\to0$. $G$ continue : $G(u^*)=\\lim G(u_{\\eps_k})=0$, donc $F_i(u^*)\\le0$ pour tout $i$ : $u^*\\in K$. $J$ continue : $J(u^*)=\\lim J(u_{\\eps_k})\\le J(u)$. Donc $u^*$ minimise $J$ sur $K$, et par unicité (stricte convexité) $u^*=u$. Toutes les sous-suites convergentes de la suite bornée $(u_\\eps)$ ont la même limite $u$ : $u_\\eps\\to u$ (T10)."], ["controle", "Où sert quoi : stricte convexité **uniquement** pour l'unicité (sans elle, les valeurs d'adhérence sont des minimiseurs) ; infinie à l'infini pour la borne ; continuité pour passer à la limite ; la convexité des $F_i$ **ne sert qu'à l'existence de $u_\\eps$** ($G$ convexe, donc $J_\\eps$ strictement convexe) — l'argument de convergence lui-même n'utilise aucune convexité. Pourquoi pas mieux (R10) ? (3.80) dit $J_\\eps(u_\\eps)\\le J(u)$ : la pénalisation **sous-estime** l'optimum (exemple minuscule : $J_\\eps(u_\\eps)=\\frac1{1+\\eps}<1$). Et $G(u_\\eps)=O(\\eps)$ ne donne que $\\max(F_i(u_\\eps),0)=O(\\sqrt\\eps)$ ; en réalité c'est $O(\\eps)$, parce que $\\frac2\\eps\\max(F_i(u_\\eps),0)\\to\\lambda_i$, le multiplicateur (Ex. 3.4.3) — on le voit sur l'équation d'Euler de $J_\\eps$ : $J'(u_\\eps)+\\sum_i\\frac2\\eps\\max(F_i(u_\\eps),0)F_i'(u_\\eps)=0$, à comparer avec KKT $J'(u)+\\sum\\lambda_iF_i'(u)=0$. La tension du ressort, c'est le multiplicateur."], ["bilan", "La ligne $J_\\eps(u_\\eps)\\le J_\\eps(u)=J(u)$ est l'archétype des **estimations a priori** : pour comparer les solutions de deux problèmes voisins, on teste l'une dans le problème de l'autre, et on lit sur l'inégalité à la fois la borne et la petitesse du défaut. Ensuite, sans forte convexité, le relais par compacité (R8) et l'unicité (T10). Même schéma pour une régularisation, une discrétisation (Galerkin), une méthode de barrière (Remarque 3.4.7)."]], "livre": "Identique (T1 méthode directe, T10 sous-suites) : existence, comparaison (3.80)–(3.81), passage à la limite. Ce que le livre ajoute en remarque et qu'il faut garder : le multiplicateur caché $\\frac2\\eps\\max(F_i(u_\\eps),0)\\to\\lambda_i$, et le prix de $\\eps\\to0$ (conditionnement en $1/\\eps$), qui motive le Lagrangien augmenté (§3.4.8).", "reflexes": ["R12", "R8", "R10", "R15"], "liens": {"fiche": "3.4.6", "scene": "penal", "guide": "r-3-4-6"}, "voir": ["2.2.1", "3.4.8"], "num": "3.4.6"}, {"id": "3.4.8", "kind": "th", "label": "Lemme 3.4.8 (Lagrangien augmenté)", "nom": "Lagrangien augmenté : positif sur le noyau, pénalisé sur l'orthogonal — et comment recoller les deux", "enonce": "$J,F$ de classe $C^2$, $v^*$ minimum local de $\\inf_{F=0}J$ avec $F'(v^*)$ de rang $M$, $\\lambda^*$ son multiplicateur, et la condition d'ordre 2 stricte (3.88) : $\\Lag''(v^*,\\lambda^*)(w,w)>0$ pour $w\\in\\Ker F'(v^*)\\setminus\\{0\\}$. Alors il existe $\\mu_0$ tel que pour $\\mu\\ge\\mu_0$, $v^*$ soit un minimum local **sans contrainte** de $v\\mapsto\\Lag_{aug}(v,\\lambda^*,\\mu)=J(v)+\\lambda^*\\cdot F(v)+\\frac\\mu2\\norm{F(v)}^2$.", "chaine": [["but", "Un minimum local sans contrainte, pour une fonction $C^2$ : la condition suffisante d'ordre 2 (§2.5.3) demande **gradient nul** et **Hessienne définie positive** en $v^*$. Deux vérifications, pas plus."], ["pas", "Gradient : $\\Lag_{aug}'(v^*)=J'(v^*)+\\lambda^*\\cdot F'(v^*)+\\mu\\,F(v^*)\\cdot F'(v^*)=0+\\mu\\cdot0$, par Lagrange (§2.5.6) et $F(v^*)=0$. Point critique pour **tout** $\\mu$ : c'est le multiplicateur exact $\\lambda^*$ qui fait que la pénalité ne déplace pas le point critique — contrairement à la pénalisation pure, où $u_\\eps\\ne u$."], ["pas", "Hessienne : la dérivée seconde de $\\frac\\mu2\\norm F^2$ est $\\mu\\big(F'^*F'+F\\cdot F''\\big)$, et $F(v^*)=0$ tue le second terme. Donc $$\\Lag_{aug}''(v^*)(w,w)=\\Lag''(v^*,\\lambda^*)(w,w)+\\mu\\norm{F'(v^*)w}^2.\\qquad(3.89)$$ Pénaliser le **carré** de $F$, c'est précisément ce qui rend la Hessienne aussi simple."], ["question", "Est-ce défini positif pour $\\mu$ grand ? Sur $\\Ker F'(v^*)$ : le terme en $\\mu$ est nul et (3.88) fait le travail — $\\mu$ n'y peut rien. Sur l'orthogonal du noyau : $F'(v^*)$ est de rang $M$, donc $\\norm{F'w}^2\\ge c\\norm w^2$ pour $w\\perp\\Ker F'$ ($c>0$ la plus petite valeur propre non nulle de $F'^*F'$) et $\\mu$ domine tout. Mais un $w$ quelconque **mélange** les deux : $w=w_1+w_2$, et le terme croisé $2\\Lag''(w_1,w_2)$ peut être négatif. « Positif sur chacun des deux morceaux » ne suffit pas, il faut recoller."], ["idee", "Absorber le terme croisé par Young (T13 sous sa forme élémentaire). Je note $a=\\min\\{\\Lag''(w,w):w\\in\\Ker F',\\norm w=1\\}>0$ (minimum d'une fonction continue sur une sphère compacte, (3.88)), $b=\\norm{\\Lag''(v^*,\\lambda^*)}$. Alors $\\Lag_{aug}''(w,w)\\ge a\\norm{w_1}^2-2b\\norm{w_1}\\norm{w_2}-b\\norm{w_2}^2+\\mu c\\norm{w_2}^2$, et $2b\\norm{w_1}\\norm{w_2}\\le\\frac a2\\norm{w_1}^2+\\frac{2b^2}a\\norm{w_2}^2$. D'où $\\Lag_{aug}''(w,w)\\ge\\frac a2\\norm{w_1}^2+\\Big(\\mu c-b-\\frac{2b^2}a\\Big)\\norm{w_2}^2>0$ pour $w\\ne0$ dès que $\\mu>\\mu_0=\\frac1c\\big(b+\\frac{2b^2}a\\big)$."], ["pas", "Variante classique, par l'absurde et compacité (R8) : si pour $\\mu_k\\to\\infty$ il existait $w_k$ unitaire avec $\\Lag_{aug}''(w_k,w_k)\\le0$, alors $\\norm{F'w_k}^2\\le-\\Lag''(w_k,w_k)/\\mu_k\\le b/\\mu_k\\to0$ ; une sous-suite $w_k\\to w$ unitaire, avec $F'w=0$ et $\\Lag''(w,w)=\\lim\\Lag''(w_k,w_k)\\le0$ : contradiction avec (3.88). Moins explicite, mais sans aucun calcul."], ["controle", "Pourquoi « local » : rien ne dit que $\\Lag_{aug}$ est convexe loin de $v^*$ ($J$ peut ne pas l'être). Sur l'exemple $A+\\mu aa^T$, le seuil exact est $\\mu_0=-1/s$, $s=a\\cdot A^{-1}a$ : pour $\\mu<\\mu_0$ un col en $v^*$, au-delà un minimum. Ce que le lemme apporte par rapport à la pénalisation (Remarque 3.4.9) : avec le bon multiplicateur, **un $\\mu$ fini suffit**, donc pas de conditionnement en $1/\\eps$. Et d'où vient la mise à jour $\\lambda^{n+1}=\\lambda^n+\\mu F(v^n)$ (3.87) : le point critique de $\\Lag_{aug}(\\cdot,\\lambda^n,\\mu)$ vérifie $J'+(\\lambda^n+\\mu F(v^n))\\cdot F'=0$, à comparer avec $J'+\\lambda^*\\cdot F'=0$ : le « multiplicateur effectif » est $\\lambda^n+\\mu F(v^n)$, on l'adopte. Sur l'exemple, $\\lambda^{k+1}-\\lambda^*=\\frac{\\lambda^k-\\lambda^*}{1+\\mu s}$ : géométrique à $\\mu$ fixé."], ["bilan", "**Une forme quadratique positive sur un sous-espace, plus un terme qui domine sur l'orthogonal : découper $w=w_1+w_2$ et absorber le terme croisé par Young** — ou raisonner par l'absurde avec une suite unitaire. C'est le même mécanisme que la coercivité d'une somme en analyse. Et le réflexe « $F(v^*)=0$ simplifie la Hessienne de $\\norm F^2$ » : pénaliser un carré ne coûte rien au second ordre."]], "livre": "Le livre donne la preuve en deux lignes : point critique, Hessienne (3.89), « le premier terme est défini positif sur $\\Ker F'$, le second sur son orthogonal, la somme l'est pour $\\mu$ assez grand ». C'est l'idée juste, sans le recollemen
