<style>:root{
  --bg:#f4f5f8; --card:#ffffff; --card2:#f8f9fb; --ink:#171a21; --ink2:#444b58; --ink3:#7a8190; --line:#e1e4ea; --line2:#c9cdd6;
  --acc:#1d4e89; --acc-bg:#e9f0fa;
  --green:#1f9d63; --orange:#e8762b; --purple:#7c3aed; --red:#d63a3a; --blue:#2a6fd6; --yellow:#c9900a; --gray:#6b7280; --cyan:#0e9aa7; --pink:#d6338f;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-text:"STIX Two Text",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:16.5px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-ui);margin:0;line-height:1.2}
p{margin:.35em 0}
b,strong{font-weight:650}
a{color:var(--acc)}
.katex{font-size:1.04em}
.katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden}
button{font:inherit;color:inherit}
/* layout */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1380px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-ui);font-weight:800;font-size:1.1rem;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--ink3);font-size:.72rem;margin-top:-2px}
.nav{display:flex;gap:6px;align-items:center;margin-left:auto;font-family:var(--f-ui);font-size:.9rem;flex-wrap:wrap}
.nav button,.pill{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink2);font-family:var(--f-ui);font-size:.88rem;text-decoration:none}
.nav button:hover,.pill:hover{border-color:var(--acc);color:var(--acc)}
.nav .cnt{color:var(--ink3);font-size:.85rem;padding:0 6px}
.nav input{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-family:var(--f-ui);font-size:.88rem;width:200px}
.wrap{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:290px 1fr;gap:18px;padding:16px}
aside{position:sticky;top:62px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-family:var(--f-ui);padding-right:4px}
aside .grp{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:12px 0 4px 8px}
aside .grp:first-child{margin-top:0}
aside button.it{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--ink2);font-size:.86rem;line-height:1.25}
aside button.it:hover{background:var(--card)}
aside button.it.on{background:var(--card);border-color:var(--line2);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
aside button.it .n{color:var(--ink3);font-size:.72rem;min-width:3.2em;font-variant-numeric:tabular-nums}
aside button.it.exo .n{color:var(--orange)}
aside select{display:none;width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line2);background:var(--card)}
aside .special{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--acc);font-weight:600;font-size:.86rem;margin:4px 0}
aside .special.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{min-width:0}
/* en-tête d'un résultat */
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.hd h2{font-size:1.45rem;font-weight:750}
.hd .kind{font-family:var(--f-ui);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:var(--acc-bg);padding:2px 8px;border-radius:999px;white-space:nowrap}
.hd .kind.exo{color:var(--orange);background:#fdf0e6}
.liens{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-ui);font-size:.8rem;margin:4px 0 12px}
.liens a{color:var(--acc);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;background:var(--card)}
.liens a:hover{border-color:var(--acc)}
.enonce{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:0 12px 12px 0;padding:10px 16px;margin:0 0 16px}
.enonce .lab{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-weight:700;display:block;margin-bottom:2px}
.sec-h{font-family:var(--f-ui);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:22px 0 8px}
.sec-h small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink3);margin-left:8px}
/* la chaîne */
.chaine{position:relative;padding-left:0;margin:0}
.step{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px 0 10px;border-bottom:1px dashed var(--line);position:relative}
.step:last-child{border-bottom:0}
.step .lab{font-family:var(--f-ui);font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);padding-top:4px;display:flex;gap:8px;align-items:flex-start}
.step .lab::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:4px}
.step .lab .num{color:var(--ink3);font-weight:600;letter-spacing:0;text-transform:none;font-size:.8rem}
.step .txt{min-width:0}
.step .txt p:first-child{margin-top:0}
.step .txt p:last-child{margin-bottom:0}
.step.k-but{--c:var(--blue)} .step.k-acquis{--c:var(--green)} .step.k-fosse{--c:var(--orange)} .step.k-essai{--c:var(--gray)} .step.k-impasse{--c:var(--red)} .step.k-question{--c:var(--purple)} .step.k-idee{--c:var(--yellow)} .step.k-pas{--c:var(--ink)} .step.k-controle{--c:var(--cyan)} .step.k-bilan{--c:var(--green)} .step.k-note{--c:var(--ink3)} .step.k-image{--c:var(--pink)}
.step.k-idee .txt{background:#fff9e6;border:1px solid #f1e2b0;border-radius:10px;padding:8px 12px}
.step.k-impasse .txt{color:var(--ink2)}
.step.k-impasse .txt > p:first-child::before,.step.k-impasse .txt > :not(p):first-child::before{content:"✗ ";color:var(--red);font-weight:700}
.step.k-bilan .txt{background:#eaf7f0;border:1px solid #c6e8d5;border-radius:10px;padding:8px 12px}
.step.k-question .txt{font-style:italic}
.step.k-question .txt .katex{font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:0 0 10px}
.card.livre{border-left:4px solid var(--gray)}
.card.livre .lab{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);font-weight:700;display:block;margin-bottom:4px}
.tech{display:inline-block;font-family:var(--f-ui);font-size:.74rem;font-weight:700;color:var(--purple);background:#f1e9fd;border-radius:999px;padding:1px 8px;margin:0 2px;text-decoration:none}
.reflex{display:inline-flex;gap:6px;align-items:baseline;font-family:var(--f-ui);font-size:.82rem;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:5px 10px;margin:3px 4px 3px 0;text-decoration:none;cursor:pointer}
.reflex b{color:var(--green);font-size:.74rem}
.reflex:hover{border-color:var(--green)}
.reflexbox{display:flex;flex-wrap:wrap}
ul.plain{padding-left:20px;margin:.3em 0}
ul.plain li{margin:3px 0}
/* page réflexes et méthode */
.rf{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 12px}
.rf h3{font-size:1.05rem;margin-bottom:4px}
.rf h3 b{color:var(--green);font-family:var(--f-ui);font-size:.8rem;margin-right:8px}
.rf .use{font-family:var(--f-ui);font-size:.8rem;color:var(--ink3);margin-top:6px}
.rf .use a{text-decoration:none;color:var(--acc);margin-right:6px;white-space:nowrap}
.intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.q{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.q .n{font-family:var(--f-ui);font-weight:800;color:var(--acc);font-size:1.2rem}
.q:last-child{border-bottom:0}
.kbd{font-family:var(--f-ui);font-size:.75rem;border:1px solid var(--line2);border-radius:4px;padding:0 5px;background:var(--card2)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:999px;font-family:var(--f-ui);font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.foot{display:flex;justify-content:space-between;margin:22px 0 40px;font-family:var(--f-ui)}
.foot button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink2)}
.foot button:hover{border-color:var(--acc);color:var(--acc)}
.progress{font-family:var(--f-ui);font-size:.8rem;color:var(--ink3)}
.mark{font-family:var(--f-ui);font-size:.8rem;margin-left:auto;display:flex;gap:6px}
.mark button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--ink2);font-size:.8rem}
.mark button.on{background:var(--green);color:#fff;border-color:var(--green)}
aside button.it.lu .n::after{content:" ✓";color:var(--green)}
@media (max-width:1000px){
  .wrap{grid-template-columns:1fr;padding:12px}
  aside{position:static;max-height:none}
  aside .list{display:none}
  aside select{display:block}
  .step{grid-template-columns:1fr;gap:4px}
  .step .lab{padding-top:0}
}
</style>

.xref{cursor:help;border-bottom:1px dotted var(--accent,var(--acc,#1d4e89));color:var(--accent,var(--acc,#1d4e89));text-decoration:none;border-radius:2px}
.xref:hover,.xref:focus,.xref.on{background:var(--accent-tint,var(--acc-bg,#eef3fa));outline:none}
.xpop{position:absolute;z-index:9999;max-width:min(560px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:var(--sheet,var(--card,#fff));color:var(--ink,#151a24);border:1px solid var(--accent-soft,var(--line2,#cbdaef));border-left:4px solid var(--accent,var(--acc,#1d4e89));border-radius:8px;box-shadow:0 10px 30px rgba(20,30,50,.18);padding:10px 34px 12px 14px;font-size:.95rem;line-height:1.5;font-family:var(--f-text,serif)}
.xpop[hidden]{display:none}
.xpop .xpop-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;font-family:var(--f-ui,sans-serif);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3,var(--ink3,#7a8292))}
.xpop .xpop-h a{color:var(--accent,var(--acc,#1d4e89));text-decoration:none;font-weight:600;text-transform:none;letter-spacing:0;font-size:.85rem;white-space:nowrap}
.xpop .xpop-h a:hover{text-decoration:underline}
.xpop .xpop-b p{margin:.3em 0}
.xpop .xpop-b .katex-display{margin:.4em 0;overflow-x:auto}
.xpop .xpop-b b{color:var(--accent,var(--acc,#1d4e89))}
.xpop .xpop-b .nw{white-space:nowrap}
.xpop .xpop-x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:1.05rem;color:var(--ink-3,var(--ink3,#7a8292));cursor:pointer;line-height:1}
.eqa{display:block;position:relative}
.eqa:target::before,.xref:target::before{content:"";position:absolute;inset:-6px -8px;border-radius:6px;background:rgba(240,200,60,.28);pointer-events:none}
.xref:target{position:relative}
@media (max-width:640px){.xpop{max-width:calc(100vw - 16px);font-size:.9rem}}
</style>

<script>window.DATA={"items": [{"id": "2.1.3", "kind": "th", "label": "Lemme 2.1.3", "nom": "Il existe toujours une suite minimisante", "enonce": "Si $K\\ne\\emptyset$, il existe une suite $(u^n)$ de points de $K$ telle que $J(u^n)\\to\\inf_{v\\in K}J(v)$ (cet infimum pouvant valoir $-\\infty$).", "chaine": [["but", "Je dois **fabriquer** une suite de points de $K$ dont les valeurs descendent vers $m=\\inf_KJ$. Je n'ai aucun point particulier sous la main : il faut que la définition même de $m$ me fournisse des points."], ["acquis", "La définition de l'infimum : $m$ est le plus grand des minorants de $J$ sur $K$. Autrement dit (si $m$ est fini) : pour tout $\\eps>0$, $m+\\eps$ **n'est pas** un minorant."], ["fosse", "Ce « n'est pas un minorant » est une négation : *il n'est pas vrai que tous les $J(v)$ dépassent $m+\\eps$*. Niée, une phrase « pour tout » devient une phrase « il existe » : il existe $v\\in K$ avec $J(v)<m+\\eps$. Voilà le point que je cherchais, à $\\eps$ près."], ["idee", "Prendre $\\eps=1/n$ et appeler $u^n$ le point obtenu : $m\\le J(u^n)<m+\\frac1n$, donc $J(u^n)\\to m$."], ["pas", "Cas $m$ fini. Pour chaque $n\\ge1$, $m+\\frac1n>m$ n'est pas un minorant, donc il existe $u^n\\in K$ avec $J(u^n)<m+\\frac1n$ ; et $J(u^n)\\ge m$ puisque $m$ minore. D'où $J(u^n)\\to m$."], ["pas", "Cas $m=-\\infty$. Aucun réel ne minore $J$ : en particulier $-n$ ne minore pas, donc il existe $u^n\\in K$ avec $J(u^n)<-n$, et $J(u^n)\\to-\\infty$."], ["controle", "Où ai-je utilisé $K\\ne\\emptyset$ ? Pour que l'infimum ait un sens (sinon $\\inf\\emptyset=+\\infty$ et il n'y a aucun point à choisir). Rien d'autre n'a servi : ni continuité, ni structure de $V$."], ["bilan", "Une définition par « plus grand minorant » se convertit en suite en **niant la minoration à $\\eps$ près**. Le lemme ne dit rien de la position des $u^n$ : pour $J(x)=e^x$ sur $\\R$, $u^n=-n$ convient et part à l'infini. Toute la section 2.2 consiste à empêcher cette fuite."]], "livre": "Le livre raisonne par l'absurde (« si aucune suite ne convenait, il existerait $\\eps$ avec $J\\ge m+\\eps$ partout, contradiction »). C'est la même idée dans l'autre sens ; la version directe ci-dessus se généralise mieux : c'est elle qu'on refait, sans y penser, chaque fois qu'on écrit « soit $u^n$ tel que $J(u^n)\\le\\inf J+1/n$ » dans une preuve d'existence (T1).", "reflexes": ["R1", "R10"], "liens": {"fiche": "2.2.1", "guide": "r-2-1-3"}, "num": "2.1.3"}, {"id": "2.2.1", "kind": "th", "label": "Théorème 2.2.1", "nom": "Existence d'un minimum en dimension finie", "enonce": "$K$ fermé non vide de $\\R^N$, $J$ continue sur $K$ et infinie à l'infini (2.2) : $\\norm{u^n}\\to+\\infty\\Rightarrow J(u^n)\\to+\\infty$ pour toute suite de $K$. Alors $J$ atteint son minimum sur $K$, et de toute suite minimisante on peut extraire une sous-suite qui converge vers un point de minimum.", "chaine": [["but", "Trouver un point $u\\in K$ avec $J(u)\\le J(v)$ pour tout $v\\in K$. C'est un énoncé d'existence : je dois **produire** $u$. Mais je ne connais aucun point de $K$ qui ait une chance particulière d'être le minimum."], ["acquis", "Trois hypothèses : $K$ fermé (les limites de suites de $K$ restent dans $K$), $J$ continue (je peux passer à la limite dans $J$), et (2.2) : une suite de $K$ qui part à l'infini a des valeurs qui explosent."], ["essai", "Premier réflexe : « prendre le point où $J$ est la plus petite ». C'est circulaire, c'est exactement ce qu'il faut prouver. Deuxième réflexe : le théorème de Weierstrass, « une fonction continue sur un compact atteint son minimum ». Mais $K$ n'est pas supposé borné, donc pas compact."], ["question", "Si je ne peux pas désigner le minimum, puis-je au moins fabriquer des points qui s'en **approchent en valeur** ? Oui : c'est le Lemme §2.1.3, une suite minimisante $u^n$ avec $J(u^n)\\to\\inf_KJ$. Elle existe toujours. La question devient : peut-elle me conduire à un vrai point de minimum ?"], ["idee", "Si une sous-suite de $(u^n)$ converge vers un point $u$, alors (i) $u\\in K$ parce que $K$ est fermé, et (ii) $J(u)=\\lim J(u^{n_k})=\\inf_KJ$ parce que $J$ est continue. Donc $u$ serait le minimum cherché. Tout se ramène à : **extraire une sous-suite convergente**, ce qui, en dimension finie, est vrai dès que la suite est bornée (Bolzano–Weierstrass)."], ["pas", "La suite minimisante est bornée. Supposons que non : une sous-suite vérifie $\\norm{u^{n_k}}\\to+\\infty$. Par (2.2), $J(u^{n_k})\\to+\\infty$. Mais $J(u^{n_k})\\to\\inf_KJ<+\\infty$ (l'infimum est fini ou $-\\infty$, jamais $+\\infty$ puisque $K\\ne\\emptyset$). Contradiction. C'est exactement le rôle de l'hypothèse « infinie à l'infini » : elle interdit à la suite minimisante de fuir."], ["pas", "Bolzano–Weierstrass dans $\\R^N$ : une sous-suite $u^{n_k}$ converge vers un $u\\in\\R^N$. (C'est ici, et seulement ici, que la dimension finie sert.)"], ["pas", "$u\\in K$, parce que $K$ est fermé et que les $u^{n_k}$ sont dans $K$."], ["pas", "$J$ continue : $J(u)=\\lim_kJ(u^{n_k})=\\inf_KJ$. Donc $J(u)\\le J(v)$ pour tout $v\\in K$, et au passage l'infimum est fini. La seconde affirmation du théorème est gratuite : je n'ai rien supposé sur la suite minimisante de départ."], ["controle", "Chaque hypothèse a servi à une étape et une seule : (2.2) à la borne, la dimension finie à l'extraction, « fermé » à la limite dans $K$, « continue » au passage à la limite. Si j'en retire une, c'est cette étape-là qui casse : $K=]0,2]$ et $J(x)=x$ (limite hors de $K$) ; $J(x)=x^2$ sauf $J(0)=1$ (saut vers le haut) ; $J=e^x$ sur $\\R$ (fuite). À l'étape 4, je n'ai utilisé que $J(u)\\le\\liminf J(u^{n_k})$ : la semi-continuité inférieure suffit, c'est la version des diapos (Ex. 2.2.3)."], ["bilan", "Le schéma, qu'on appelle **méthode directe** (T1) : suite minimisante → bornée → sous-suite convergente → limite admissible → valeur limite = infimum. Je le reconnaîtrai dans §2.3.8, §2.3.9, §3.4.6 : à chaque fois la question sera « qui me donne l'extraction ? » — et en dimension infinie, ce sera le problème."]], "livre": "La preuve du livre est exactement cette chaîne, en quatre lignes. Ce qu'il faut en garder, c'est la place de chaque hypothèse : quand, plus tard, un énoncé demandera « $J$ sci » au lieu de « continue », ou « $K$ borné » au lieu de « infinie à l'infini », je saurai que seule une étape change. Et quand on passera à un espace de Hilbert (§2.3.9), c'est l'étape 2 qui n'aura plus de sens : il faudra une autre notion de convergence.", "reflexes": ["R1", "R8", "R14", "R10"], "liens": {"fiche": "2.2.1", "scene": "existence", "guide": "r-2-2-1"}, "num": "2.2.1"}, {"id": "2.3.4", "kind": "th", "label": "Proposition 2.3.4", "nom": "Convexe : local = global, et unicité si strictement convexe", "enonce": "$J$ convexe sur un convexe $K$ : tout minimum local est global, et l'ensemble des minima est convexe. Si $J$ est strictement convexe, il y a au plus un minimum.", "chaine": [["but", "$u$ est un minimum **local** : $J(w)\\ge J(u)$ pour les $w\\in K$ proches de $u$. Je veux $J(v)\\ge J(u)$ pour un $v\\in K$ **quelconque**, éventuellement très loin."], ["fosse", "Mon information est locale, ma conclusion est globale. Il me faut un pont entre $v$ (loin) et le voisinage de $u$ (près). La convexité de $K$ me donne un objet qui relie les deux : le segment $[u,v]$, entièrement dans $K$."], ["idee", "Sur ce segment, les points $w_\\theta=u+\\theta(v-u)$ sont dans $K$ et, pour $\\theta$ petit, dans le voisinage de $u$ : donc $J(w_\\theta)\\ge J(u)$. Et la convexité de $J$ majore $J(w_\\theta)$ par la corde : $J(w_\\theta)\\le(1-\\theta)J(u)+\\theta J(v)$. Si $J(v)<J(u)$, la corde descend dès que $\\theta>0$ : contradiction avec $J(w_\\theta)\\ge J(u)$."], ["pas", "Soit $\\delta$ le rayon du minimum local et $v\\in K$. Pour $\\theta\\in\\,]0,1]$ assez petit, $\\norm{w_\\theta-u}=\\theta\\norm{v-u}<\\delta$ et $w_\\theta\\in K$ ($K$ convexe). Donc $J(u)\\le J(w_\\theta)\\le(1-\\theta)J(u)+\\theta J(v)$, soit $\\theta J(u)\\le\\theta J(v)$, soit $J(u)\\le J(v)$. Global."], ["pas", "Ensemble des minima convexe : si $u_1,u_2$ sont des minima, $w=\\theta u_1+(1-\\theta)u_2\\in K$ et $\\inf_KJ\\le J(w)\\le\\theta J(u_1)+(1-\\theta)J(u_2)=\\inf_KJ$ : $w$ est un minimum."], ["pas", "Unicité : si $J$ est strictement convexe et $u_1\\ne u_2$, le même calcul avec $\\theta\\in\\,]0,1[$ donne $J(w)<\\inf_KJ$, impossible. (C'est le **cas minuscule** à garder en tête : deux fonds de vallée distincts, et le milieu fait strictement mieux.)"], ["controle", "Deux convexités ont servi, et pas au même endroit : celle de $K$ pour que $w_\\theta$ soit admissible, celle de $J$ pour la corde. Sans celle de $K$ : $x^2$ sur $[-2,-1]\\cup[\\frac12,3]$ a un minimum local en $-1$ qui n'est pas global, parce que le segment vers $\\frac12$ sort de $K$. Sans celle de $J$ : deux puits."], ["bilan", "L'**argument du segment** (T2) : pour exploiter une convexité, je me place sur un segment $[u,v]$ et je compare le graphe à la corde. Et le réflexe « le milieu fait mieux » (T3) est l'arme de l'unicité et, bientôt, des suites de Cauchy (§2.3.8)."]], "livre": "Identique. À noter : la preuve ne demande $J(w_\\theta)\\ge J(u)$ que pour $\\theta$ petit, c'est pourquoi un minimum *local* suffit ; et elle n'utilise aucune dérivée. La version avec dérivée est la suffisance dans §2.5.1 : « tangente sous le graphe ».", "reflexes": ["R4", "R11", "R3", "R14"], "liens": {"fiche": "2.3.4", "scene": "local", "guide": "r-2-3-4"}, "num": "2.3.4"}, {"id": "2.3.5", "kind": "th", "label": "Lemme 2.3.5", "nom": "Une fonction convexe majorée sur une boule y est continue", "enonce": "Si $J$ est convexe et majorée par $M$ sur la boule unité ouverte de centre $v_0$, alors $J$ est continue sur cette boule.", "chaine": [["but", "Continuité en $v_0$ (puis ailleurs par le même argument) : $|J(v)-J(v_0)|\\le C\\norm{v-v_0}$ pour $v$ proche de $v_0$ suffirait largement."], ["acquis", "Deux choses seulement : la corde est au-dessus du graphe (convexité), et $J\\le M$ sur la boule. Rien sur la régularité."], ["fosse", "La convexité ne donne que des inégalités **entre trois points alignés** : le point du milieu est sous la corde des deux autres. Pour contrôler $J(v)$ je dois donc placer $v$ sur un segment dont je connais les extrémités ; pour la majoration, $v_0$ et un point du bord $e$ (où $J\\le M$) ; pour la minoration, il faut que $v_0$ soit *au milieu* de $v$ et d'un autre point."], ["image", "En dimension 1 : le graphe sur $]v_0-r,v_0+r[$ est coincé dans un « nœud papillon » de sommet $(v_0,J(v_0))$ et de pentes $\\pm(M-J(v_0))/r$. Quand $v\\to v_0$, le papillon se referme : c'est la continuité, même en un point anguleux."], ["pas", "Majoration. Je normalise ($v_0=0$, $J(0)=0$, rayon 1 ; translater et retrancher une constante ne change ni la convexité ni le fait d'être majorée). Je prends $J\\le M$ sur la boule fermée (sinon je remplace le point du bord par un point un peu à l'intérieur : rien ne change). Pour $0<\\norm v<1$, posons $\\theta=\\norm v$ et $e=v/\\norm v$ : alors $v=\\theta e+(1-\\theta)\\,0$, donc $J(v)\\le\\theta J(e)+(1-\\theta)J(0)\\le M\\norm v$."], ["pas", "Minoration. Je veux $0$ au milieu de $v$ et d'un point du bord : $0=\\frac1{1+\\theta}v+\\frac\\theta{1+\\theta}(-e)$ avec $\\theta=\\norm v$ (vérification : $\\frac1{1+\\theta}v-\\frac{\\theta}{1+\\theta}\\frac{v}{\\norm v}=0$). Convexité : $0=J(0)\\le\\frac{J(v)+\\theta J(-e)}{1+\\theta}\\le\\frac{J(v)+\\theta M}{1+\\theta}$, donc $J(v)\\ge-M\\norm v$."], ["pas", "Donc $|J(v)|\\le M\\norm v$ : continuité en $0$. En un autre point de la boule ouverte, je recommence avec une boule plus petite centrée en ce point, sur laquelle $J$ est encore majorée par $M$."], ["controle", "La majoration a servi deux fois (sur $e$ et sur $-e$) ; sans elle, rien : en dimension infinie, une forme linéaire non continue est convexe et discontinue partout. En dimension finie, une fonction convexe à valeurs réelles est automatiquement majorée sur une boule (par ses valeurs aux sommets d'un cube qui la contient), d'où « convexe ⇒ continue » des diapos."], ["bilan", "Pour coincer une valeur $J(v)$ par convexité, je cherche **deux segments** : l'un où $v$ est au milieu (majoration), l'autre où le point de référence est au milieu (minoration). Le même geste donnera les inégalités (2.10) et (2.14)."]], "livre": "La preuve du livre est celle-ci, écrite après normalisation ($v_0=0$, $J(0)=0$). Le seul point un peu caché est la minoration : il faut penser à exprimer $0$ comme barycentre de $v$ et de $-v/\\norm v$. Une fois vue, on la refait partout : c'est « l'argument du segment » (T2) utilisé à l'envers.", "reflexes": ["R4", "R12", "R3"], "liens": {"fiche": "2.3.4", "guide": "r-2-3-5"}, "num": "2.3.5"}, {"id": "2.3.7", "kind": "th", "label": "Proposition 2.3.7", "nom": "Minorante affine d'une fonction convexe ; croissance quadratique si α-convexe", "enonce": "$J$ convexe continue sur un convexe fermé $K$ : il existe $L\\in V'$ et $\\delta$ avec $J(v)\\ge L(v)+\\delta$ sur $K$ (2.11). Si $J$ est α-convexe, il existe $\\gamma>0$, $\\eta$ avec $J(v)\\ge\\gamma\\norm v^2+\\eta$ (2.12).", "chaine": [["but", "(2.11) : trouver un **hyperplan sous le graphe**. (2.12) : montrer que $J$ grandit au moins comme une parabole, donc est minorée et infinie à l'infini — c'est la raison d'être de l'énoncé, qui prépare §2.3.8."], ["acquis", "Convexité et continuité de $J$ ; et un outil « abstrait » que l'énoncé appelle : le théorème de séparation (T11) — un point hors d'un convexe fermé peut en être séparé par un hyperplan."], ["question", "Un hyperplan sous le graphe, ça ressemble à quoi comme objet ? À un hyperplan de $\\R\\times V$ qui laisse tout l'épigraphe $\\Epi(J)=\\{(\\lambda,v):\\lambda\\ge J(v)\\}$ d'un côté. Et l'épigraphe d'une fonction convexe continue est un **convexe fermé**. Je sais donc séparer de lui n'importe quel point extérieur."], ["idee", "Prendre un point sous le graphe, $(\\lambda_0,v_0)$ avec $\\lambda_0<J(v_0)$, le séparer de l'épigraphe, et lire l'hyperplan obtenu comme une fonction affine de $v$."], ["pas", "Séparation : il existe $\\beta\\in\\R$, $L\\in V'$, $\\alpha\\in\\R$ avec $\\beta\\lambda+L(v)>\\alpha>\\beta\\lambda_0+L(v_0)$ pour tout $(\\lambda,v)\\in\\Epi(J)$ (2.13)."], ["pas", "Ce qui coince : si $\\beta=0$ l'hyperplan est « vertical » et ne dit rien sur $J$. Je dois montrer $\\beta>0$. À $v$ fixé, $\\lambda$ peut être aussi grand que je veux dans l'épigraphe : $\\beta\\lambda+L(v)>\\alpha$ pour tout $\\lambda\\ge J(v)$ force $\\beta\\ge0$. Puis $v=v_0$ : $\\beta(\\lambda-\\lambda_0)>0$ pour $\\lambda=J(v_0)>\\lambda_0$, donc $\\beta\\ne0$. Conclusion $\\beta>0$."], ["pas", "Je divise par $\\beta$ avec $\\lambda=J(v)$ : $J(v)>\\frac{\\alpha-L(v)}\\beta$. C'est une minorante affine : (2.11)."], ["question", "Pour (2.12) : où est la parabole ? Dans la forte convexité au milieu, (2.10) : $J(\\frac{v+v_0}2)\\le\\frac{J(v)+J(v_0)}2-\\frac\\alpha8\\norm{v-v_0}^2$. Elle dit que $J(v)$ dépasse $2J(\\text{milieu})-J(v_0)+\\frac\\alpha4\\norm{v-v_0}^2$ : il me manque seulement une minoration du milieu — et je viens d'en obtenir une, affine."], ["pas", "Avec (2.11) au milieu : $\\frac{J(v)+J(v_0)}2\\ge\\frac{L(v)+L(v_0)}2+\\delta+\\frac\\alpha8\\norm{v-v_0}^2$. Je développe $\\norm{v-v_0}^2=\\norm v^2-2\\ps v{v_0}+\\norm{v_0}^2$ et je majore tout ce qui est linéaire en $v$ par $C\\norm v$ (Cauchy–Schwarz, $|L(v)|\\le\\norm L\\norm v$) : $J(v)\\ge\\frac\\alpha4\\norm v^2-C\\norm v-C'$. Enfin $C\\norm v\\le\\frac\\alpha8\\norm v^2+\\frac{2C^2}\\alpha$ (inégalité $ab\\le\\frac{a^2}2+\\frac{b^2}2$ bien dosée) : $J(v)\\ge\\frac\\alpha8\\norm v^2+\\eta$."], ["controle", "(2.11) utilise convexité **et** continuité (épigraphe fermé) — c'est la version propre de « une fonction convexe est au-dessus de ses tangentes », sans dérivée. (2.12) n'utilise la forte convexité qu'au milieu : c'est (2.10), qui suffit à tout (Ex. 2.3.3)."], ["bilan", "Deux réflexes. **Séparer** : pour prouver qu'une fonction convexe est au-dessus de quelque chose d'affine, on sépare un point de l'épigraphe. **Absorber le terme linéaire dans le terme quadratique** : $C\\norm v\\le\\frac\\alpha8\\norm v^2+C''$ ; c'est ainsi qu'une croissance quadratique « mange » toujours une croissance linéaire."]], "livre": "Même preuve. Le passage délicat, $\\beta>0$, est l'endroit où l'on apprend à manipuler un hyperplan séparateur dans $\\R\\times V$ : on « pousse » le point de l'épigraphe vers le haut ($\\lambda\\to+\\infty$) pour trier les signes. La technique T11 reviendra pour Farkas (§2.5.19) et pour la fermeture faible (Lemme 2.3.14).", "reflexes": ["R1", "R2", "R13", "R12"], "liens": {"fiche": "2.3.8", "guide": "r-2-3-7"}, "num": "2.3.7"}, {"id": "2.3.8", "kind": "th", "label": "Théorème 2.3.8", "nom": "Existence et unicité, cas fortement convexe (et l'estimation 4/α)", "enonce": "$K$ convexe fermé non vide d'un Hilbert, $J$ α-convexe continue sur $K$. Alors $J$ a un unique minimum $u$ sur $K$, et $\\norm{v-u}^2\\le\\frac4\\alpha\\big(J(v)-J(u)\\big)$ pour tout $v\\in K$ (2.14) ; toute suite minimisante converge vers $u$.", "chaine": [["but", "Existence d'un minimum, **sans dimension finie**. Et une estimation : être presque optimal en valeur force à être proche de $u$ en position."], ["acquis", "La méthode directe (T1) de §2.2.1 : suite minimisante, bornée, extraction, limite dans $K$, passage à la limite. Et la forte convexité (2.9), en particulier au milieu (2.10)."], ["impasse", "Je rejoue §2.2.1. La suite minimisante existe ; elle est bornée grâce à (2.12) ($J\\ge\\gamma\\norm v^2+\\eta$, donc $J(u^n)$ borné ⇒ $\\norm{u^n}$ borné). Mais l'extraction d'une sous-suite convergente n'est plus disponible : la boule d'un Hilbert n'est pas compacte (Exemple 2.3.1)."], ["question", "Qu'est-ce qui, dans un Hilbert, remplace la compacité pour faire converger une suite ? La **complétude** : une suite de Cauchy converge. Puis-je prouver que la suite minimisante est de Cauchy, c'est-à-dire contrôler $\\norm{u^n-u^m}$ par ce que je connais, les valeurs $J(u^n)$ et $J(u^m)$ ?"], ["idee", "C'est exactement ce que dit (2.10) : $\\frac\\alpha8\\norm{u^n-u^m}^2\\le\\frac{J(u^n)+J(u^m)}2-J\\big(\\frac{u^n+u^m}2\\big)$. Le milieu est dans $K$ (convexe), donc $J(\\text{milieu})\\ge m=\\inf_KJ$ ; et $J(u^n),J(u^m)\\to m$. Le membre de droite tend vers $0$ : **la forte convexité fabrique le Cauchy**."], ["pas", "$m$ est fini : par (2.12), $J\\ge\\eta$ sur $K$."], ["pas", "Cauchy : $\\frac\\alpha8\\norm{u^n-u^m}^2\\le\\frac{J(u^n)-m}2+\\frac{J(u^m)-m}2\\to0$ quand $n,m\\to\\infty$."], ["pas", "$V$ complet : $u^n\\to u$. $K$ fermé : $u\\in K$. $J$ continue : $J(u)=m$. Existence — et toute la suite converge, pas seulement une sous-suite : c'est mieux qu'en dimension finie, parce que l'unicité est déjà en germe."], ["pas", "Unicité : Proposition §2.3.4 (strictement convexe)."], ["pas", "Estimation (2.14) : le même geste du milieu, avec $u$ et $v$ : $\\frac{u+v}2\\in K$ donc $J(\\frac{u+v}2)\\ge J(u)$, et (2.10) donne $\\frac\\alpha8\\norm{u-v}^2\\le\\frac{J(u)+J(v)}2-J(\\frac{u+v}2)\\le\\frac{J(v)-J(u)}2$, soit $\\norm{v-u}^2\\le\\frac4\\alpha(J(v)-J(u))$."], ["controle", "D'où vient le $4$ ? De $\\frac{\\theta(1-\\theta)}2=\\frac18$ pour $\\theta=\\frac12$, et du $\\frac12$ devant $J(v)-J(u)$ : $8/2=4$. Si $J$ est dérivable, (2.23) et l'inéquation d'Euler feront mieux ($2/\\alpha$) : la corde est un outil plus grossier que la tangente. Sans forte convexité : $e^x$, pas de minimum ; $K$ non fermé : $x^2$ sur $]0,1]$ ; $K$ non convexe : le milieu sort de $K$ et l'argument meurt ($x^2$ sur $\\{-1,1\\}$ a deux minima)."], ["bilan", "Quand la compacité manque, chercher une inégalité qui rend la suite **de Cauchy** : une quantité positive, contrôlée par des valeurs qui convergent. Et « presque optimal ⇒ proche » (2.14) est l'estimation que tous les algorithmes du chapitre 3 utiliseront pour convertir une décroissance de $J$ en convergence des itérés."]], "livre": "Le livre suit ces quatre étapes (T3, l'argument du milieu, utilisé deux fois). Remarquer que la preuve est *plus courte* qu'en dimension finie : pas d'extraction, pas de sous-suite. C'est le signe que la forte convexité est une hypothèse très puissante — assez pour qu'on la retrouve dans presque tous les théorèmes du chapitre 3.", "reflexes": ["R6", "R3", "R15", "R14"], "liens": {"fiche": "2.3.8", "scene": "corde", "guide": "r-2-3-8"}, "num": "2.3.8"}, {"id": "2.3.9", "kind": "th", "label": "Théorème 2.3.9", "nom": "Existence, cas convexe en dimension infinie : la convergence faible", "enonce": "$K$ convexe fermé non vide d'un Hilbert, $J$ convexe continue sur $K$, infinie à l'infini. Alors $J$ a un minimum sur $K$. (Outils : Lemmes 2.3.13–2.3.15 sur la convergence faible.)", "chaine": [["but", "Existence sans forte convexité, donc sans l'argument de Cauchy de §2.3.8, et sans compacité."], ["acquis", "La suite minimisante est bornée (c'est (2.2)). La méthode directe cale à l'étape « extraire une sous-suite convergente » : l'Exemple 2.3.1 montre une suite minimisante bornée ($e_n$ dans $\\ell^2$) sans aucune sous-suite convergente."], ["question", "Dans cet exemple, la suite $e_n$ ne converge pas, mais chacune de ses **coordonnées** converge vers $0$. Existe-t-il une notion de convergence, plus faible, pour laquelle une suite bornée a toujours une sous-suite convergente ? Oui : la convergence faible, $\\ps{u^n}{v}\\to\\ps uv$ pour tout $v$ — « converger composante par composante » (Définition 2.3.12), et le Lemme 2.3.13 l'obtient par extraction diagonale sur les coordonnées."], ["fosse", "J'ai récupéré une limite faible $u$. Mais la méthode directe demande ensuite deux choses, et toutes deux sont **fausses en général** : que $u\\in K$ (dans l'Exemple 2.3.1, $e_n\\rightharpoonup0$ et $0$ n'est pas minimiseur), et que $J(u)\\le\\liminf J(u^{n'})$ (là-bas $J(0)=1>0$). Il faut une hypothèse qui rende $K$ fermé pour la convergence faible et $J$ semi-continue inférieurement pour elle."], ["idee", "La convexité. Un demi-espace fermé $\\{v:L(v)\\le a\\}$ est faiblement fermé *par définition même* de la convergence faible ($L(u^n)\\to L(u)$). Un convexe fermé est une intersection de demi-espaces fermés (Lemme 2.3.14, par séparation T11) : donc faiblement fermé. Et $J$ convexe continue a un épigraphe convexe fermé, donc faiblement fermé : donc $J$ est faiblement sci (Lemme 2.3.15)."], ["pas", "Suite minimisante $u^n$, bornée par (2.2). Lemme 2.3.13 : $u^{n'}\\rightharpoonup u$."], ["pas", "Lemme 2.3.15 : $K$ faiblement fermé, donc $u\\in K$ ; $J$ faiblement sci, donc $J(u)\\le\\liminf J(u^{n'})=\\inf_KJ$. Donc $J(u)=\\inf_KJ$."], ["controle", "Le prix de l'extraction faible est payé deux fois par la convexité (de $K$, de $J$). Et je perds, par rapport à §2.3.8, l'unicité et l'estimation (2.14) : sans courbure, deux minima ou un fond plat sont possibles (Remarque 2.3.10). Les deux contre-exemples du livre ne sont pas convexes : c'est bien là que ça casse."], ["bilan", "Schéma général de la dimension infinie : **affaiblir la convergence jusqu'à retrouver la compacité, puis payer en convexité** pour que l'ensemble et la fonction supportent cette convergence faible. C'est le squelette du calcul des variations (énergies d'EDP sur $H^1_0$)."]], "livre": "La preuve du livre tient en trois lignes parce que tout le travail est dans les trois lemmes. La chose à retenir est la *logique* : même méthode directe, mais chaque étape est remplacée par sa version faible, et chaque remplacement coûte une hypothèse de convexité. Le détail (extraction diagonale, séparation) est de l'analyse fonctionnelle qu'on admet volontiers en première lecture.", "reflexes": ["R8", "R14", "R10", "R13"], "liens": {"fiche": "2.3.9", "scene": "existence", "guide": "r-2-3-9"}, "num": "2.3.9"}, {"id": "2.4.4", "kind": "th", "label": "Propositions 2.4.4 et 2.4.5", "nom": "Les trois visages de la convexité : cordes, tangentes, gradient monotone", "enonce": "$J$ différentiable sur $V$, $\\alpha\\ge0$. Sont équivalentes : (2.22) $J$ est α-convexe (pour $\\alpha=0$ : convexe) ; (2.23) $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}+\\frac\\alpha2\\norm{v-u}^2$ pour tous $u,v$ ; (2.24) $\\ps{J'(u)-J'(v)}{u-v}\\ge\\alpha\\norm{u-v}^2$ pour tous $u,v$.", "chaine": [["but", "Trois énoncés sur $J$, $J'$ en un point, $J'$ en deux points. Je dois les relier en boucle : (2.22) ⇒ (2.23) ⇒ (2.24) ⇒ (2.22). Je traite directement $\\alpha>0$ ; $\\alpha=0$ est le même calcul sans le terme quadratique."], ["acquis", "Tout se passe sur un segment : je pose $\\varphi(t)=J(u+t(v-u))$, fonction d'une variable, avec $\\varphi'(t)=\\ps{J'(u+t(v-u))}{v-u}$. (2.22) dit que $\\varphi$ est sous ses cordes abaissées, (2.23) que $\\varphi$ est au-dessus de sa tangente en $0$ relevée d'une parabole, (2.24) que $\\varphi'$ croît au moins comme $\\alpha t\\norm{v-u}^2$."], ["question", "(2.22) ⇒ (2.23) : comment une inégalité sur les cordes devient-elle une inégalité sur la tangente ? La tangente est la **limite des cordes** issues de $u$ : il suffit de faire tendre $\\theta$ vers 0."], ["pas", "J'écris (2.22) avec les poids $\\theta$ sur $v$ et $1-\\theta$ sur $u$ : $J(u+\\theta(v-u))\\le(1-\\theta)J(u)+\\theta J(v)-\\frac{\\alpha\\theta(1-\\theta)}2\\norm{v-u}^2$. Je fais passer $J(u)$ à gauche et je divise par $\\theta$ : $\\frac{J(u+\\theta(v-u))-J(u)}\\theta\\le J(v)-J(u)-\\frac{\\alpha(1-\\theta)}2\\norm{v-u}^2$. À gauche, un taux d'accroissement de $\\varphi$ en $0$, qui tend vers $\\varphi'(0)=\\ps{J'(u)}{v-u}$. À droite, $\\theta\\to0$ donne $J(v)-J(u)-\\frac\\alpha2\\norm{v-u}^2$. C'est (2.23)."], ["question", "(2.23) ⇒ (2.24) : je veux une inégalité **sans valeurs de $J$**. Comment les faire disparaître ? En écrivant (2.23) deux fois, en échangeant les rôles de $u$ et $v$, et en additionnant : $J(u)$ et $J(v)$ apparaissent une fois de chaque côté."], ["pas", "$J(v)\\ge J(u)+\\ps{J'(u)}{v-u}+\\frac\\alpha2\\norm{v-u}^2$ et $J(u)\\ge J(v)+\\ps{J'(v)}{u-v}+\\frac\\alpha2\\norm{v-u}^2$. Somme : $0\\ge\\ps{J'(u)-J'(v)}{v-u}+\\alpha\\norm{v-u}^2$, c'est-à-dire $\\ps{J'(u)-J'(v)}{u-v}\\ge\\alpha\\norm{u-v}^2$ : (2.24)."], ["question", "(2.24) ⇒ (2.22) : le vrai sens difficile. J'ai une propriété de $J'$ et je veux une propriété de $J$. Le seul pont de $J'$ vers $J$, c'est **intégrer**. Sur le segment, (2.24) entre $u+t(v-u)$ et $u+s(v-u)$ s'écrit $\\varphi'(t)-\\varphi'(s)\\ge\\alpha(t-s)\\norm{v-u}^2$ pour $t\\ge s$ (2.25) : la pente croît au moins linéairement."], ["idee", "Comparer les deux morceaux du graphe à la **tangente au point $\\theta$** où je veux l'inégalité. À droite de $\\theta$, la pente dépasse $\\varphi'(\\theta)$ d'au moins $\\alpha(t-\\theta)d^2$ (avec $d=\\norm{v-u}$) ; à gauche, elle lui est inférieure d'au moins $\\alpha(\\theta-s)d^2$. En intégrant, le graphe est au-dessus de sa tangente en $\\theta$, relevé de deux paraboles — et la corde, qui joint deux points du graphe, est donc au-dessus de $\\varphi(\\theta)$ d'une quantité calculable."], ["pas", "À droite : pour $t\\in[\\theta,1]$, $\\varphi'(t)\\ge\\varphi'(\\theta)+\\alpha(t-\\theta)d^2$ ; j'intègre : $\\varphi(1)-\\varphi(\\theta)\\ge(1-\\theta)\\varphi'(\\theta)+\\frac{\\alpha d^2}2(1-\\theta)^2$. À gauche : pour $s\\in[0,\\theta]$, $\\varphi'(s)\\le\\varphi'(\\theta)-\\alpha(\\theta-s)d^2$ ; j'intègre : $\\varphi(\\theta)-\\varphi(0)\\le\\theta\\varphi'(\\theta)-\\frac{\\alpha d^2}2\\theta^2$."], ["pas", "Je multiplie la première par $\\theta$, la seconde par $(1-\\theta)$ et je soustrais : $\\theta\\varphi(1)+(1-\\theta)\\varphi(0)-\\varphi(\\theta)\\ge\\theta(1-\\theta)\\varphi'(\\theta)-(1-\\theta)\\theta\\varphi'(\\theta)+\\frac{\\alpha d^2}2\\big[\\theta(1-\\theta)^2+(1-\\theta)\\theta^2\\big]=\\frac{\\alpha\\theta(1-\\theta)}2d^2$. Les termes en $\\varphi'(\\theta)$ se sont détruits exactement — c'est pour cela qu'il fallait choisir la tangente **en $\\theta$** et pas en $0$. Comme $\\varphi(\\theta)=J((1-\\theta)u+\\theta v)$, c'est (2.22)."], ["controle", "Où la différentiabilité sert-elle ? Pour que $\\varphi'$ existe et que l'intégration ait un sens (en toute rigueur, $\\varphi$ dérivable à dérivée croissante suffit). Pour $\\alpha=0$, la même boucle donne la Proposition 2.4.4 sans aucun terme quadratique. La version stricte (inégalités strictes pour $u\\ne v$) est l'Exercice 2.4.5."], ["bilan", "Trois gestes à garder : **cordes → tangente** en faisant tendre $\\theta$ vers 0 ; **supprimer les valeurs de $J$** en symétrisant et en additionnant ; **de $J'$ vers $J$** en intégrant le long du segment. Et un principe : chaque algorithme du chapitre 3 choisit le visage qui l'arrange — (2.23) pour une descente, (2.24) pour une contraction."]], "livre": "Le livre prouve (2.24) ⇒ (2.22) par une double intégrale : $\\int_\\theta^1\\!\\int_0^\\theta\\big(\\varphi'(t)-\\varphi'(s)\\big)\\,ds\\,dt$, dont le membre de gauche vaut exactement $\\theta\\varphi(1)+(1-\\theta)\\varphi(0)-\\varphi(\\theta)$ et le membre de droite $\\frac{\\alpha\\theta(1-\\theta)}2d^2$. C'est plus court et c'est la même chose : la double intégrale compare toutes les pentes de gauche à toutes les pentes de droite, là où j'ai comparé chacune à la pente médiane en $\\theta$. La technique T12 (« intégrer le long du segment ») est celle qu'on réutilise pour Taylor (§2.4.8) et pour le lemme de majoration (§2.4.10).", "reflexes": ["R4", "R5", "R12", "R1"], "liens": {"fiche": "2.4.4", "scene": "monotone", "guide": "r-2-4-4"}, "num": "2.4.4"}, {"id": "2.4.8", "kind": "th", "label": "Lemme 2.4.8", "nom": "Taylor à l'ordre 2 : d'où vient le ½", "enonce": "Si $J$ est deux fois dérivable, $J(u+w)=J(u)+\\ps{J'(u)}{w}+\\frac12J''(u)(w,w)+o(\\norm w^2)$ (2.27).", "chaine": [["but", "Un développement de $J$ à l'ordre 2, alors que la Définition 2.4.7 ne me donne qu'un développement de $J'$ à l'ordre 1 : $J'(u+w)=J'(u)+J''(u)w+o(w)$."], ["question", "Comment passer d'une information sur $J'$ à une information sur $J$ ? En intégrant le long du segment $[u,u+w]$ : $J(u+w)-J(u)=\\int_0^1\\frac{d}{ds}J(u+sw)\\,ds=\\int_0^1\\ps{J'(u+sw)}{w}\\,ds$."], ["pas", "J'insère le développement de $J'$ au point $u+sw$ : $\\ps{J'(u+sw)}{w}=\\ps{J'(u)}{w}+s\\,J''(u)(w,w)+\\ps{o(sw)}{w}$."], ["pas", "J'intègre terme à terme : $\\int_0^1\\ps{J'(u)}{w}ds=\\ps{J'(u)}{w}$ ; $\\int_0^1s\\,ds\\cdot J''(u)(w,w)=\\frac12J''(u)(w,w)$ — voilà le $\\frac12$ ; et $\\big|\\int_0^1\\ps{o(sw)}{w}ds\\big|\\le\\norm w\\sup_s\\norm{o(sw)}=o(\\norm w^2)$."], ["bilan", "Le $\\frac12$ de Taylor est $\\int_0^1s\\,ds$. Plus généralement, la **formule avec reste intégral** $\\varphi(1)=\\varphi(0)+\\varphi'(0)+\\int_0^1(1-t)\\varphi''(t)\\,dt$ est l'outil exact ; elle servira pour la condition suffisante d'ordre 2 (§2.5.3) et pour Newton (§3.5.1)."]], "livre": "C'est la preuve du livre (T12). Elle montre que, dans un espace de dimension quelconque, on ne manipule jamais l'opérateur $J''(u)$ mais seulement la forme quadratique $w\\mapsto J''(u)(w,w)$ : la courbure dans la direction $w$.", "reflexes": ["R4", "R12"], "liens": {"fiche": "2.4.4", "guide": "r-2-4-8"}, "num": "2.4.8"}, {"id": "2.4.10", "kind": "th", "label": "Lemme 2.4.10", "nom": "Dérivée lipschitzienne ⇒ majoration quadratique (la parabole du haut)", "enonce": "Si $J'$ est $L$-lipschitzienne, $J(v)\\le J(u)+\\ps{J'(u)}{v-u}+\\frac L2\\norm{v-u}^2$ pour tous $u,v$.", "chaine": [["but", "Contrôler le **reste** $R=J(v)-J(u)-\\ps{J'(u)}{v-u}$ (l'écart entre $J$ et son plan tangent en $u$) par $\\frac L2\\norm{v-u}^2$."], ["acquis", "Seulement : $\\norm{J'(x)-J'(y)}\\le L\\norm{x-y}$. Donc l'information porte sur les **variations de $J'$**, pas sur $J$ : il faut intégrer, comme en §2.4.4."], ["image", "En dimension 1 : $R=\\int_u^v\\big(J'(s)-J'(u)\\big)\\,ds$, l'aire entre la courbe de $J'$ et la droite horizontale $J'(u)$. Lipschitz dit que $J'$ ne s'écarte de $J'(u)$ qu'à pente $L$ au plus : l'aire tient sous un triangle de base $v-u$ et de hauteur $L(v-u)$, d'aire $\\frac L2(v-u)^2$."], ["pas", "$R=\\int_0^1\\ps{J'(u+t(v-u))-J'(u)}{v-u}\\,dt$ (dérivée de $t\\mapsto J(u+t(v-u))$, moins le terme tangent)."], ["pas", "Cauchy–Schwarz puis Lipschitz : $|\\ps{J'(u+t(v-u))-J'(u)}{v-u}|\\le L\\,t\\norm{v-u}\\cdot\\norm{v-u}$. Et $\\int_0^1t\\,dt=\\frac12$ : $R\\le\\frac L2\\norm{v-u}^2$."], ["controle", "Je n'ai pas utilisé de convexité : ce lemme vaut pour toute fonction à dérivée lipschitzienne, et il donne aussi $R\\ge-\\frac L2\\norm{v-u}^2$. Si de plus $J$ est α-convexe, (2.23) dit $R\\ge\\frac\\alpha2\\norm{v-u}^2$ : le graphe est **coincé entre deux paraboles** tangentes, de courbures $\\alpha$ et $L$ (Remarque 2.4.11). Ce sandwich est l'outil de toutes les preuves de convergence (T13)."], ["bilan", "Dès que je vois « $J'$ lipschitzienne », je pense « parabole majorante de courbure $L$ » ; dès que je vois « α-convexe », « parabole minorante de courbure $\\alpha$ ». Et $\\kappa=L/\\alpha$ mesure l'écart entre les deux : c'est lui qui réglera toutes les vitesses."]], "livre": "Même preuve, en deux lignes (T12). L'Exercice 2.4.8 fait le chemin inverse : si $J$ est $C^2$ avec $|J''(u)(w,w)|\\le L\\norm w^2$, alors $J'$ est $L$-lipschitzienne — par la même intégrale, appliquée à $J'$.", "reflexes": ["R4", "R3", "R2"], "liens": {"fiche": "2.4.10", "scene": "sandwich", "guide": "r-2-4-10"}, "num": "2.4.10"}, {"id": "2.5.1", "kind": "th", "label": "Théorème 2.5.1", "nom": "L'inéquation d'Euler : pourquoi une inéquation, et pourquoi elle suffit si J est convexe", "enonce": "$K$ convexe, $J$ différentiable en $u\\in K$. Si $u$ est un minimum local de $J$ sur $K$, alors $\\ps{J'(u)}{v-u}\\ge0$ pour tout $v\\in K$ (2.29). Réciproquement, si $J$ est convexe et $u$ vérifie (2.29), $u$ est un minimum global.", "chaine": [["but", "Une condition **calculable** sur $J'(u)$ à partir de « $u$ est un minimum local sur $K$ »."], ["image", "Cas minuscule : $J$ sur un intervalle $[a,b]$. Si le minimum est en $a$, je ne peux comparer $J(a)$ qu'aux $J(a+h)$ avec $h>0$ : $J(a+h)-J(a)\\ge0$, donc $hJ'(a)+o(h)\\ge0$, donc $J'(a)\\ge0$ — et rien de plus, puisque $h<0$ sort de l'intervalle. À l'intérieur, les deux signes sont permis et $J'=0$."], ["question", "En dimension quelconque, qu'est-ce qui joue le rôle de « $h>0$, à droite de $a$ » ? Les **directions admissibles** : les $w$ tels que $u+hw\\in K$ pour $h>0$ petit. Si $K$ est convexe, j'en ai une famille toute prête : $w=v-u$ pour $v\\in K$, puisque $u+h(v-u)\\in K$ pour $h\\in[0,1]$."], ["pas", "Nécessité. Pour $v\\in K$ et $h\\in\\,]0,1]$ petit, $u+h(v-u)\\in K$ et proche de $u$, donc $J(u+h(v-u))\\ge J(u)$. Par définition de la dérivée, $J(u+h(v-u))-J(u)=h\\ps{J'(u)}{v-u}+o(h)$. Je divise par $h>0$ et je fais $h\\to0^+$ : $\\ps{J'(u)}{v-u}\\ge0$."], ["controle", "Pourquoi une inéquation ? Parce que je n'ai le droit de diviser que par $h>0$ : pour $h<0$, le point $u+h(v-u)$ sort de $K$ et $J$ peut très bien y descendre. Si $u$ est intérieur à $K$ (ou $K=V$), toutes les directions $\\pm w$ sont admissibles et (2.29) donne $\\ps{J'(u)}{w}=0$ pour tout $w$ : l'équation $J'(u)=0$. Géométriquement : $J'(u)$ fait un angle aigu avec chaque direction rentrante, tout $K$ est dans le demi-espace $\\{\\ps{J'(u)}{v-u}\\ge0\\}$."], ["question", "Suffisance : (2.29) ne regarde que le premier ordre en $u$ ; comment pourrait-elle garantir un minimum **global** ? Seulement si le premier ordre contrôle tout : c'est ce que dit la convexité, « la tangente est sous le graphe » (2.20)."], ["pas", "Si $J$ est convexe et (2.29) vraie : pour $v\\in K$, $J(v)\\ge J(u)+\\ps{J'(u)}{v-u}\\ge J(u)$. Minimum global."], ["controle", "Sans convexité de $J$, pas de suffisance : $-x^2$ sur $[-1,1]$ vérifie (2.29) en $0$, qui est un maximum. Sans convexité de $K$, $v-u$ n'est plus admissible : il faudra le cône tangent (§2.5.5). Exemple à retenir : $J=\\frac12\\norm{v-c}^2$, (2.29) devient $\\ps{c-u}{v-u}\\le0$, la caractérisation de la projection $u=P_K(c)$ (Ex. 2.5.1)."], ["bilan", "Le geste fondamental du chapitre (T4) : **perturber $u$ dans une direction admissible, développer, diviser par $h>0$, faire $h\\to0$**. Tout le reste de la section 2.5 consiste à décrire les directions admissibles quand $K$ n'est plus convexe."]], "livre": "Identique. Le livre insiste sur la figure 2.2 (angle aigu). À retenir aussi : réécrite $\\ps{u-(u-\\mu J'(u))}{v-u}\\ge0$, l'inéquation d'Euler dit que $u$ est la projection de $u-\\mu J'(u)$ sur $K$ : $u=P_K(u-\\mu J'(u))$, le point fixe du gradient projeté (§3.4.1).", "reflexes": ["R17", "R11", "R10", "R4"], "liens": {"fiche": "2.5.1", "scene": "euler", "guide": "r-2-5-1"}, "num": "2.5.1"}, {"id": "2.5.3", "kind": "th", "label": "Proposition 2.5.3", "nom": "Le second ordre sans contrainte : nécessaire en un point, suffisant sur un voisinage", "enonce": "$K=V$, $J$ deux fois dérivable en $u$. Si $u$ est un minimum local : $J'(u)=0$ et $J''(u)(w,w)\\ge0$ pour tout $w$ (2.34). Réciproquement, si $J'(u)=0$ et $J''(v)(w,w)\\ge0$ pour tout $w$ et tout $v$ dans un voisinage de $u$ (2.35), alors $u$ est un minimum local.", "chaine": [["but", "Quand la pente est nulle, c'est la courbure qui décide : je veux la condition sur $J''$."], ["pas", "Nécessité. $J'(u)=0$ d'abord (Euler, $u$ intérieur). Alors le terme d'ordre 1 de Taylor (2.27) disparaît : $0\\le J(u+tw)-J(u)=\\frac{t^2}2J''(u)(w,w)+o(t^2)$. Je divise par $t^2>0$ et $t\\to0$ : $J''(u)(w,w)\\ge0$. Même geste que pour Euler, un ordre plus loin."], ["question", "Réciproque : pourquoi l'énoncé exige-t-il $J''\\ge0$ sur **tout un voisinage** et pas seulement en $u$ ? Je cherche le contre-exemple : $J(x)=x^3$ en $0$ a $J'(0)=J''(0)=0$ sans être un minimum. La courbure en $u$ seule ne contrôle pas $J$ un peu plus loin ; pour aller de $u$ à $u+w$, j'ai besoin de la courbure **tout le long du chemin**."], ["idee", "Taylor avec reste intégral sur $\\varphi(t)=J(u+tw)$ : $\\varphi(1)=\\varphi(0)+\\varphi'(0)+\\int_0^1(1-t)\\varphi''(t)\\,dt$. Le terme $\\varphi'(0)=\\ps{J'(u)}w$ est nul, et $\\varphi''(t)=J''(u+tw)(w,w)\\ge0$ tant que $u+tw$ reste dans le voisinage : donc $J(u+w)\\ge J(u)$."], ["controle", "Pourquoi le reste intégral et pas (2.27) ? Parce que (2.27) a un $o(\\norm w^2)$ dont je ne contrôle pas le signe ; le reste intégral est exact et son signe est celui de $\\varphi''$. En dimension finie, si $J''(u)$ est **définie positive** et $J$ de classe $C^2$, elle le reste au voisinage par continuité : minimum local strict. $x^4$ en $0$ montre que la positivité large en un point ne suffit pas, et que la condition (2.35) sur un voisinage est, elle, satisfaite."], ["bilan", "Deux outils à ne pas confondre : le développement (2.27) avec un $o(\\cdot)$, bon pour les conditions **nécessaires** (on divise, on passe à la limite) ; la formule avec **reste exact**, bonne pour les conditions **suffisantes** (on a besoin d'un signe). Et toujours : chercher le contre-exemple de l'énoncé plus fort ($x^3$)."]], "livre": "La preuve du livre est celle-ci (T5). La version sous contraintes (§2.5.13) remplacera $u+tw$ par un chemin admissible $u(t)$ et fera apparaître la courbure du chemin, qu'absorberont les multiplicateurs.", "reflexes": ["R11", "R10", "R4", "R14"], "liens": {"fiche": "2.5.3", "guide": "r-2-5-3"}, "num": "2.5.3"}, {"id": "2.5.5", "kind": "th", "label": "Proposition 2.5.5", "nom": "Euler sans convexité de K : le cône des directions admissibles", "enonce": "$K(u)$ = ensemble des $w$ limites de $(v^n-u)/\\eps_n$ avec $v^n\\in K$, $v^n\\to u$, $\\eps_n\\to0^+$ (Définition 2.5.4). Si $u$ est un minimum local de $J$ sur $K$ et $J$ différentiable en $u$ : $\\ps{J'(u)}{w}\\ge0$ pour tout $w\\in K(u)$.", "chaine": [["but", "Refaire Euler quand $K$ n'est plus convexe, donc quand les segments $[u,v]$ sortent de $K$."], ["question", "De quoi ai-je eu besoin dans §2.5.1 ? De points $v^n\\in K$ qui s'approchent de $u$ « dans une direction $w$ » : $v^n=u+\\eps_nw+o(\\eps_n)$. Je n'ai pas besoin du segment entier, seulement d'une suite. Alors je **définis** l'ensemble des directions qui ont cette propriété : c'est $K(u)$. La définition est fabriquée sur mesure pour que la preuve marche."], ["pas", "Soit $w\\in K(u)$ : $v^n\\in K$, $v^n\\to u$, $(v^n-u)/\\eps_n\\to w$, donc $v^n=u+\\eps_n w+o(\\eps_n)$. Pour $n$ grand, $J(v^n)\\ge J(u)$ (minimum local) et $J(v^n)=J(u)+\\eps_n\\ps{J'(u)}{w}+o(\\eps_n)$. Je soustrais, je divise par $\\eps_n>0$, je passe à la limite : $\\ps{J'(u)}{w}\\ge0$."], ["controle", "Si $K$ est convexe, $v-u\\in K(u)$ (prendre $v^n=u+\\eps_n(v-u)$) : je retrouve §2.5.1. Propriétés gratuites : $0\\in K(u)$, $K(u)$ est un cône fermé, $K(u)=V$ en un point intérieur, $K(u)=\\{0\\}$ en un point isolé (où la proposition ne dit rien : normal, un point isolé est toujours un minimum local)."], ["bilan", "Le principe du livre : **aucune direction admissible n'est une direction de descente**. Toute la suite (Lagrange, KKT) consiste à *calculer* $K(u)$ quand $K$ est décrit par des contraintes — et le piège sera que le cône linéarisé peut être plus gros que le vrai cône (points de rebroussement)."]], "livre": "Identique. Une définition qui a l'air compliquée (trois suites) est en réalité la liste exacte de ce dont la preuve de T4 a besoin : c'est souvent ainsi que naissent les définitions.", "reflexes": ["R11", "R1"], "liens": {"fiche": "2.5.5", "guide": "r-2-5-5"}, "num": "2.5.5"}, {"id": "2.5.6", "kind": "th", "label": "Théorème 2.5.6", "nom": "Multiplicateurs de Lagrange : calculer le cône tangent d'une surface", "enonce": "$K=\\{F=0\\}$, $F=(F_1,\\dots,F_M)$ continûment dérivable près de $u$, les $F_i'(u)$ linéairement indépendants, $J$ dérivable en $u$. Si $u$ est un minimum local de $J$ sur $K$, il existe $\\lambda\\in\\R^M$ avec $J'(u)+\\sum_i\\lambda_iF_i'(u)=0$ (2.37).", "chaine": [["but", "Des **nombres** $\\lambda_i$, de signe quelconque, tels que $J'(u)$ soit une combinaison des $F_i'(u)$. Autrement dit : $J'(u)\\in\\Vect\\{F_i'(u)\\}$."], ["acquis", "Le principe §2.5.5 : $\\ps{J'(u)}{w}\\ge0$ pour tout $w\\in K(u)$. Donc tout dépend de $K(u)$, le cône tangent à la surface $\\{F=0\\}$ en $u$."], ["image", "Une bille au point le plus bas d'une courbe (ou d'une surface) : la pesanteur $-J'(u)$ est perpendiculaire à la courbe, donc colinéaire à la normale $F'(u)$. « Perpendiculaire à toutes les tangentes » = « combinaison des normales » : c'est la phrase à prouver."], ["question", "Que vaut $K(u)$ ? Devinette par linéarisation : si $v^n=u+\\eps_nw+o(\\eps_n)$ reste sur $F=0$, alors $0=F(v^n)=F(u)+\\eps_n\\ps{F'(u)}{w}+o(\\eps_n)$, et comme $F(u)=0$, en divisant : $\\ps{F_i'(u)}{w}=0$. Donc $K(u)\\subset\\Ker F'(u)$ (l'espace tangent linéarisé). Est-ce une égalité ?"], ["fosse", "L'inclusion inverse demande de **construire** une suite de points de $K$ dans chaque direction tangente $w$ : partir de $u+\\eps w$, qui n'est en général plus sur la surface ($F(u+\\eps w)=o(\\eps)$), et le **corriger** pour revenir sur $F=0$, d'une quantité $o(\\eps)$ pour que la direction reste $w$. C'est un problème d'équation : résoudre $F(v)=0$ près de $u+\\eps w$."], ["idee", "Résoudre $F(v)=0$ près d'un point où $F'$ est surjective, c'est le théorème des fonctions implicites, ici sous la forme du Lemme 2.5.7 : si $D_v\\mathcal F$ est surjective, on peut corriger $v$ en $v_\\eps$ avec $\\mathcal F(\\eps,v_\\eps)=0$ et $\\norm{v-v_\\eps}\\le C\\norm{\\mathcal F(\\eps,v)}$. C'est **ici** que l'hypothèse « les $F_i'(u)$ sont libres » sert : elle dit exactement que $F'(u)$ est surjective sur $\\R^M$."], ["pas", "$\\Ker F'(u)\\subset K(u)$. Soit $w\\in\\Ker F'(u)$ et $\\mathcal F(\\eps,v)=F(v+\\eps w)$. En $(0,u)$ : $D_v\\mathcal F=F'(u)$, surjective. $\\mathcal F(\\eps,u)=F(u+\\eps w)=o(\\eps)$ car $\\ps{F'(u)}{w}=0$. Le lemme donne $v_\\eps$ avec $F(v_\\eps+\\eps w)=0$ et $\\norm{u-v_\\eps}\\le C\\,o(\\eps)$. Les points $v^\\eps=v_\\eps+\\eps w\\in K$ vérifient $(v^\\eps-u)/\\eps=w+(v_\\eps-u)/\\eps\\to w$ : $w\\in K(u)$."], ["pas", "Conclusion : $K(u)=\\Ker F'(u)$ est un **sous-espace vectoriel**. Dans §2.5.5, je peux tester $w$ et $-w$ : $\\ps{J'(u)}{w}=0$ pour tout $w\\in\\Ker F'(u)$, c'est-à-dire $J'(u)\\in(\\Ker F'(u))^\\perp$."], ["pas", "Algèbre linéaire : $(\\Ker F'(u))^\\perp=\\big(\\bigcap_i[F_i'(u)]^\\perp\\big)^\\perp=\\Vect\\{F_1'(u),\\dots,F_M'(u)\\}$ (l'orthogonal d'une intersection d'hyperplans est engendré par leurs normales). Donc $J'(u)=-\\sum_i\\lambda_iF_i'(u)$ pour certains réels $\\lambda_i$, uniques puisque la famille est libre. C'est (2.37)."], ["controle", "Pourquoi les $\\lambda_i$ sont-ils de signe quelconque ? Parce que $K(u)$ est un espace vectoriel : $w$ et $-w$ sont tous deux admissibles. Sans régularité : $F(v)=v^2$, $K=\\{0\\}$, $K(0)=\\{0\\}$ mais $\\Ker F'(0)=\\R$ ; le cône linéarisé ment, et $J(v)=v$ a son minimum en $0$ sans aucun $\\lambda$ (Remarque 2.5.8)."], ["bilan", "Trois temps qui reviendront pour KKT : (1) **deviner** le cône par linéarisation (dériver la contrainte) ; (2) **prouver** l'inclusion inverse par une correction (fonctions implicites), ce qui consomme l'hypothèse de régularité ; (3) **changer de côté** : « $J'(u)$ orthogonal à un sous-espace » devient « combinaison des normales » (T6)."]], "livre": "La preuve du livre est exactement ces trois temps ; le Lemme 2.5.7 y est démontré par un argument de point fixe (une variante du théorème des fonctions implicites). Ce qu'il faut emporter : la régularité des contraintes ne sert qu'à l'inclusion $\\Ker F'(u)\\subset K(u)$, et c'est la seule étape qui n'est pas de la pure dérivation. En pratique : écrire (2.37) et $F(u)=0$, $N+M$ équations, $N+M$ inconnues.", "reflexes": ["R11", "R13", "R14", "R1"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "r-2-5-6"}, "num": "2.5.6"}, {"id": "2.5.10", "kind": "th", "label": "Lemme 2.5.10", "nom": "Le Lagrangien internalise la contrainte : inf sur F=0 égale inf sup de ℒ", "enonce": "$\\Lag(v,\\mu)=J(v)+\\mu\\cdot F(v)$. Alors $\\inf_{F(v)=0}J(v)=\\inf_{v\\in V}\\sup_{\\mu\\in\\R^M}\\Lag(v,\\mu)$ (2.40).", "chaine": [["but", "Remplacer un problème **avec** contrainte par un problème **sans** contrainte sur $v$, au prix d'un sup sur une nouvelle variable."], ["idee", "Je regarde $\\sup_\\mu\\big(J(v)+\\mu\\cdot F(v)\\big)$ à $v$ fixé. Si $F(v)=0$, c'est $J(v)$ quel que soit $\\mu$. Si $F(v)\\ne0$, je peux choisir $\\mu=tF(v)$ avec $t\\to+\\infty$ : le sup vaut $+\\infty$. Le sup est une **pénalité infinie** hors de la contrainte, nulle dessus."], ["pas", "Donc $\\sup_\\mu\\Lag(v,\\mu)=J(v)$ si $F(v)=0$, $+\\infty$ sinon ; l'inf sur tout $v$ de cette fonction ne retient que les $v$ admissibles : c'est $\\inf_{F=0}J$."], ["bilan", "Ce n'est pas un jeu d'écriture (Remarque 2.5.11) : un algorithme ne peut pas imposer $F(u^n)=0$ ; avec $\\mu^n$ bien choisi (positif si $F(u^n)>0$, négatif sinon), minimiser $\\Lag(\\cdot,\\mu^n)$ fait baisser $J$ **et** la violation. C'est l'idée d'Uzawa. Et le point-selle (§2.6.2) sera le cas où l'on peut échanger inf et sup."]], "livre": "Identique (une ligne). La version inégalités est le Lemme 2.5.21, avec $\\mu\\ge0$ : le sup vaut $J(v)$ si $F(v)\\le0$ (atteint en $\\mu=0$) et $+\\infty$ sinon.", "reflexes": ["R1", "R5"], "liens": {"fiche": "2.5.6", "guide": "r-2-5-10"}, "num": "2.5.10"}, {"id": "2.5.12", "kind": "th", "label": "Lemme 2.5.12", "nom": "Le multiplicateur est une sensibilité : λ = −∂J_min/∂ℓ", "enonce": "$J_{\\min}(\\ell)=\\inf_{F(v)=\\ell}J(v)$, de solution unique $u_\\ell$ différentiable en $\\ell$ près de $0$ ; $u=u_0$, $\\lambda$ son multiplicateur. Alors $\\lambda_i=-\\dfrac{\\partial J_{\\min}}{\\partial\\ell_i}(0)$.", "chaine": [["but", "Relier $\\lambda$ (un objet de la condition d'optimalité) à la **pente de la valeur optimale** quand on déplace le niveau de la contrainte."], ["essai", "Dérivation en chaîne, naïvement : $J_{\\min}(\\ell)=J(u_\\ell)$, donc $\\frac{\\partial J_{\\min}}{\\partial\\ell_i}=\\big\\langle J'(u_\\ell),\\frac{\\partial u_\\ell}{\\partial\\ell_i}\\big\\rangle$. Je ne connais pas $\\frac{\\partial u_\\ell}{\\partial\\ell_i}$, la sensibilité de la solution — ça a l'air bloqué."], ["question", "Mais que sais-je de $J'(u)$ ? Lagrange : $J'(u)=-\\lambda\\cdot F'(u)$. Et que sais-je de $u_\\ell$ ? Qu'elle vérifie $F(u_\\ell)=\\ell$ **identiquement** en $\\ell$ — donc je peux dériver cette identité."], ["idee", "Substituer : $\\big\\langle J'(u),\\frac{\\partial u_\\ell}{\\partial\\ell_i}\\big\\rangle=-\\sum_j\\lambda_j\\big\\langle F_j'(u),\\frac{\\partial u_\\ell}{\\partial\\ell_i}\\big\\rangle=-\\sum_j\\lambda_j\\frac{\\partial}{\\partial\\ell_i}\\big[F_j(u_\\ell)\\big]=-\\sum_j\\lambda_j\\frac{\\partial\\ell_j}{\\partial\\ell_i}=-\\lambda_i$. La sensibilité inconnue $\\frac{\\partial u_\\ell}{\\partial\\ell_i}$ n'intervient qu'à travers $F_j(u_\\ell)=\\ell_j$, que je connais exactement."], ["pas", "En $\\ell=0$ : $\\frac{\\partial J_{\\min}}{\\partial\\ell_i}(0)=\\big\\langle J'(u),\\frac{\\partial u_\\ell}{\\partial\\ell_i}(0)\\big\\rangle=-\\lambda\\cdot\\big\\langle F'(u),\\frac{\\partial u_\\ell}{\\partial\\ell_i}(0)\\big\\rangle=-\\lambda\\cdot e_i=-\\lambda_i$."], ["controle", "Les hypothèses (solution unique, différentiable en $\\ell$) ne servent qu'à donner un sens à $\\frac{\\partial u_\\ell}{\\partial\\ell}$ ; le théorème n'en calcule jamais la valeur. Exemple : $\\min_{v=b}(v-2)^2$, $J_{\\min}(b)=(b-2)^2$, $J_{\\min}'(1)=-2$, et le multiplicateur en $b=1$ vaut bien $\\lambda=2$."], ["bilan", "Le multiplicateur est le **prix** d'une unité de contrainte : relâcher $F=\\ell$ d'un $\\delta\\ell$ change la valeur optimale de $-\\lambda\\,\\delta\\ell$. Et le geste « dériver une valeur optimale sans dériver la solution » (T15) reviendra pour la fonction duale (Uzawa) et pour l'état adjoint (§3.7.6)."]], "livre": "Le livre emballe le même calcul dans le Lagrangien : $J_{\\min}(\\ell)=\\Lag(u_\\ell,\\mu,\\ell)=J(u_\\ell)+\\mu\\cdot(F(u_\\ell)-\\ell)$ pour **tout** $\\mu$ (la parenthèse est nulle), puis dérive et choisit $\\mu=\\lambda$ pour tuer le terme en $\\partial u_\\ell/\\partial\\ell$. C'est le réflexe « la même quantité écrite de deux façons, avec un paramètre libre qu'on choisit ensuite » — exactement celui de l'état adjoint.", "reflexes": ["R12", "R2", "R15"], "liens": {"fiche": "2.5.12", "scene": "kkt", "guide": "r-2-5-12"}, "num": "2.5.12"}, {"id": "2.5.13", "kind": "th", "label": "Proposition 2.5.13", "nom": "Second ordre sous contraintes : pourquoi la Hessienne du Lagrangien", "enonce": "Sous les hypothèses de §2.5.6 avec $J$, $F$ de classe $C^2$ : en un minimum local $u$ de multiplicateur $\\lambda$, $\\big(J''(u)+\\sum_i\\lambda_iF_i''(u)\\big)(w,w)\\ge0$ pour tout $w\\in K(u)=\\Ker F'(u)$ (2.42).", "chaine": [["but", "Une condition de courbure, comme §2.5.3, mais sur la surface $F=0$. Je m'attends naïvement à « $J''(u)(w,w)\\ge0$ pour $w$ tangent » — l'énoncé dit autre chose : il y a un terme $\\lambda\\cdot F''$. Pourquoi ?"], ["image", "$J(x,y)=y$ sur le cercle $x^2+y^2=1$ : $J''\\equiv0$, et pourtant $(0,-1)$ est un minimum franc et $(0,1)$ un maximum. La courbure qui compte n'est pas celle de $J$ (nulle) mais celle de la **contrainte**, qui fait remonter la trajectoire. Il faut un terme qui mesure la courbure du chemin."], ["pas", "Le geste de §2.5.3, mais le long d'un chemin $u(t)$ qui reste dans $K$ : $u(0)=u$, $F(u(t))=0$, $u'(0)=w$ (il en existe pour tout $w\\in\\Ker F'(u)$, par les fonctions implicites — même hypothèse de régularité que §2.5.6). Posons $j(t)=J(u(t))$ : $0$ est un minimum local de $j$, donc $j'(0)=0$ et $j''(0)\\ge0$."], ["pas", "Je calcule $j''(0)=J''(u)(w,w)+\\ps{J'(u)}{u''(0)}$. Le second terme contient $u''(0)$, la courbure du chemin, que je ne contrôle pas : c'est **le terme qui coince**. Je lui donne un nom et je cherche une autre relation où il apparaît."], ["idee", "La contrainte ! $f_i(t)=F_i(u(t))\\equiv0$, donc $f_i''(0)=F_i''(u)(w,w)+\\ps{F_i'(u)}{u''(0)}=0$. Voilà une équation qui contient $u''(0)$, pondérée par $F_i'(u)$. Et Lagrange dit $J'(u)=-\\sum\\lambda_iF_i'(u)$ : en ajoutant $\\sum_i\\lambda_if_i''(0)=0$ à $j''(0)$, les termes en $u''(0)$ se regroupent en $\\ps{J'(u)+\\sum\\lambda_iF_i'(u)}{u''(0)}=0$."], ["pas", "$0\\le j''(0)=j''(0)+\\sum_i\\lambda_if_i''(0)=\\big(J''(u)+\\sum_i\\lambda_iF_i''(u)\\big)(w,w)+\\ps{J'(u)+\\sum_i\\lambda_iF_i'(u)}{u''(0)}=\\big(J''(u)+\\sum_i\\lambda_iF_i''(u)\\big)(w,w)$. C'est (2.42) : la Hessienne du Lagrangien $\\Lag(\\cdot,\\lambda)$ apparaît **par élimination** du terme de courbure du chemin."], ["controle", "Sur l'exemple : en $(0,-1)$, $\\lambda=\\frac12$ et $J''+\\lambda F''=\\Id$ ; en $(0,1)$, $\\lambda=-\\frac12$ et la forme vaut $-\\Id$ : (2.42) échoue, ce n'est pas un minimum. Le multiplicateur « plie » le plan $J$ en bol ou en chapeau selon son signe."], ["bilan", "Quand un terme inconnu bloque, chercher **une seconde équation qui le contient** (ici, la contrainte dérivée deux fois) et la combiner avec les bons poids — et les bons poids sont les multiplicateurs. C'est la raison profonde pour laquelle Newton–Lagrange et SQP (§3.5) utilisent $\\Lag''$ et non $J''$."]], "livre": "Identique : « par chemins admissibles » (T5). Le livre note aussi que l'ordre 1 ressort gratuitement du même calcul ($j'(0)=0$ et $f_i'(0)=0$). Variante utile : si $(J''+\\lambda\\cdot F'')(w,w)>0$ strictement sur $\\Ker F'(u)\\setminus\\{0\\}$, $u$ est un minimum local strict (condition suffisante, Lemme 3.4.8).", "reflexes": ["R2", "R12", "R3", "R4"], "liens": {"fiche": "2.5.13", "scene": "ordre2", "guide": "r-2-5-13"}, "num": "2.5.13"}, {"id": "2.5.17", "kind": "th", "label": "Théorème 2.5.17", "nom": "KKT : des directions rentrantes aux multiplicateurs positifs", "enonce": "$K=\\{F_i\\le0\\}$, $J,F_i$ dérivables en $u$, contraintes qualifiées en $u$ (Définition 2.5.15). Si $u$ est un minimum local, il existe $\\lambda_i\\ge0$ avec $J'(u)+\\sum_i\\lambda_iF_i'(u)=0$ et $\\lambda_i=0$ si $F_i(u)<0$ (2.46).", "chaine": [["but", "Comme Lagrange, mais avec deux nouveautés dans la conclusion : $\\lambda_i\\ge0$, et $\\lambda_i=0$ pour les contraintes inactives. Ces deux signes doivent sortir de la géométrie : les inégalités sont **à sens unique**."], ["acquis", "Le principe §2.5.5 : $\\ps{J'(u)}{w}\\ge0$ sur le cône tangent $K(u)$. Et l'expérience de §2.5.6 : deviner le cône par linéarisation, prouver l'inclusion inverse, puis changer de côté."], ["image", "Une bille dans un bol, bloquée par des murs. Son poids $-J'(u)$ est équilibré par les réactions des murs touchés : un mur **pousse** ($\\lambda_i\\ge0$) et seulement si on le touche ($\\lambda_i=0$ sinon). La preuve doit retrouver ces deux faits."], ["pas", "Deviner le cône. Les contraintes inactives ($F_i(u)<0$) ne gênent pas près de $u$ : par continuité, $F_i<0$ reste vrai. Pour une contrainte active, $F_i(u+\\eps w)=\\eps\\ps{F_i'(u)}{w}+o(\\eps)\\le0$ demande $\\ps{F_i'(u)}{w}\\le0$. Candidat : $\\tilde K(u)=\\{w:\\ps{F_i'(u)}{w}\\le0,\\ i\\in I(u)\\}$, le **cône linéarisé** (2.47), où seules les contraintes actives comptent — voilà d'où viendra $\\lambda_i=0$ pour les inactives."], ["fosse", "Comme pour Lagrange, est-ce que toute direction de $\\tilde K(u)$ est vraiment admissible ? Si $\\ps{F_i'(u)}{w}<0$, oui, $F_i$ décroît franchement. Mais si $\\ps{F_i'(u)}{w}=0$, le $o(\\eps)$ peut être positif et sortir de $K$ (point de rebroussement : le cône linéarisé est une droite, le vrai cône une demi-droite). Je ne peux pas faire mieux sans hypothèse : c'est **là** que la qualification intervient."], ["idee", "La qualification me donne une direction $\\bar w$ qui entre franchement à travers toutes les contraintes actives ($\\ps{F_i'(u)}{\\bar w}<0$), ou qui les longe quand elles sont affines (auquel cas il n'y a pas de $o(\\eps)$). Au lieu de tester $w$, je teste $w+\\delta\\bar w$ : légèrement incliné vers l'intérieur, il devient vraiment admissible. Puis je fais $\\delta\\to0$."], ["pas", "Soit $w\\in\\tilde K(u)$, $\\delta>0$. Montrons $u+\\eps(w+\\delta\\bar w)\\in K$ pour $\\eps>0$ petit, contrainte par contrainte. (a) $i\\notin I(u)$ : $F_i(u)<0$, continuité. (b) $i\\in I(u)$ et $\\ps{F_i'(u)}{\\bar w}<0$ : $F_i(u+\\eps(w+\\delta\\bar w))=\\eps\\big(\\ps{F_i'(u)}{w}+\\delta\\ps{F_i'(u)}{\\bar w}\\big)+o(\\eps)\\le\\eps\\delta\\ps{F_i'(u)}{\\bar w}+o(\\eps)<0$ : le terme strictement négatif $\\delta\\ps{F_i'(u)}{\\bar w}$ absorbe le $o(\\eps)$. (c) $i\\in I(u)$, $\\ps{F_i'(u)}{\\bar w}=0$ et $F_i$ affine : $F_i(u+\\eps(w+\\delta\\bar w))=\\eps\\ps{F_i'(u)}{w}\\le0$ exactement."], ["pas", "Le chemin $\\eps\\mapsto u+\\eps(w+\\delta\\bar w)$ est admissible, donc (§2.5.5 ou directement T4) $\\ps{J'(u)}{w+\\delta\\bar w}\\ge0$. Comme c'est vrai pour tout $\\delta>0$ : $\\ps{J'(u)}{w}\\ge0$ pour tout $w\\in\\tilde K(u)$."], ["question", "Changer de côté. J'ai « $J'(u)\\ge0$ sur le cône $\\{w:\\ps{F_i'(u)}{w}\\le0\\}$ » et je veux « $J'(u)=-\\sum\\lambda_iF_i'(u)$ avec $\\lambda_i\\ge0$ ». Cas minuscule, une seule contrainte : le cône est le demi-espace $\\{\\ps aw\\le0\\}$ ; « $p$ positif sur ce demi-espace » force $p$ perpendiculaire au bord et dirigé vers le bon côté, $p=-\\lambda a$, $\\lambda\\ge0$. Avec plusieurs contraintes, c'est le **lemme de Farkas** §2.5.19 : $p=-\\sum\\lambda_ia_i$, $\\lambda_i\\ge0$."], ["pas", "Farkas avec $p=J'(u)$ et $a_i=F_i'(u)$, $i\\in I(u)$ : $J'(u)=-\\sum_{i\\in I(u)}\\lambda_iF_i'(u)$, $\\lambda_i\\ge0$. Je pose $\\lambda_i=0$ pour $i\\notin I(u)$ : c'est (2.46)."], ["controle", "D'où vient chaque signe : $\\lambda_i\\ge0$ parce que le cône est à sens unique (les $-w$ ne sont pas admissibles) — contrairement à Lagrange où $K(u)$ est un espace vectoriel ; $\\lambda_i=0$ pour les inactives parce qu'elles n'entrent pas dans la définition du cône. Sans qualification : $K=\\{x^2\\le0\\}=\\{0\\}$, $J(x)=x$ : minimum en $0$, mais $J'(0)+\\lambda F'(0)=1\\ne0$. Contraintes affines : $\\bar w=0$ convient, toujours qualifiées — c'est pourquoi, à l'examen, les cas affines ne demandent aucune vérification."], ["bilan", "Même squelette que Lagrange : cône deviné par linéarisation, inclusion justifiée (ici par l'inclinaison $w+\\delta\\bar w$, qui remplace les fonctions implicites), puis **changement de côté** (Farkas au lieu de l'orthogonal). Et la méthode pratique en découle : on ne connaît pas $I(u)$, donc on essaie chaque ensemble actif, on résout, et on garde les candidats avec $F_i\\le0$ et $\\lambda_i\\ge0$."]], "livre": "Identique, en trois cas (2.48)–(2.49) puis Farkas (T4, T6). Un détail de la preuve mérite un regard : à l'étape (b), c'est la **stricte** négativité de $\\ps{F_i'(u)}{\\bar w}$ qui permet d'absorber le $o(\\eps)$ ; l'affinité dans le cas (c) est ce qui dispense de cette marge. La Définition 2.5.15 est, une fois de plus, exactement la liste de ce dont la preuve a besoin.", "reflexes": ["R11", "R13", "R14", "R3"], "liens": {"fiche": "2.5.17", "scene": "kkt", "guide": "r-2-5-17"}, "num": "2.5.17"}, {"id": "2.5.19", "kind": "th", "label": "Lemme 2.5.19", "nom": "Farkas : une décomposition, ou un certificat qui la contredit", "enonce": "$a_1,\\dots,a_M\\in V$, $\\mathsf K=\\{w:\\ps{a_i}{w}\\le0\\ \\forall i\\}$, $\\hat{\\mathsf K}=\\{-\\sum_i\\lambda_ia_i,\\ \\lambda_i\\ge0\\}$. Si $\\ps pw\\ge0$ pour tout $w\\in\\mathsf K$, alors $p\\in\\hat{\\mathsf K}$.", "chaine": [["but", "Une infinité de conditions (« $p$ positif sur tout le cône $\\mathsf K$ ») doit produire $M$ nombres $\\lambda_i\\ge0$."], ["image", "Dans le plan, avec $a_1,a_2$ : $\\mathsf K$ est un secteur, $\\hat{\\mathsf K}$ le secteur engendré par $-a_1,-a_2$, et les deux sont **polaires** l'un de l'autre : chaque bord de l'un est perpendiculaire à un bord de l'autre. « $p\\ge0$ sur $\\mathsf K$ » signifie que $p$ est dans le polaire de $\\mathsf K$, c'est-à-dire dans $\\hat{\\mathsf K}$. Le lemme dit que le polaire du polaire est le cône de départ — pour les cônes **fermés** convexes."], ["essai", "Preuve directe ? Je ne vois pas comment fabriquer les $\\lambda_i$ à partir d'inégalités. Par l'absurde, alors : supposons $p\\notin\\hat{\\mathsf K}$ et cherchons un **certificat**, une direction $w\\in\\mathsf K$ avec $\\ps pw<0$."], ["question", "Comment fabriquer une direction à partir de « $p$ n'est pas dans le convexe $\\hat{\\mathsf K}$ » ? En Hilbert : par la **projection** sur ce convexe fermé. Si $q=P_{\\hat{\\mathsf K}}(p)$, alors $w=q-p\\ne0$ et la caractérisation de la projection, $\\ps{p-q}{r-q}\\le0$ pour tout $r\\in\\hat{\\mathsf K}$, va me donner les signes."], ["pas", "$\\hat{\\mathsf K}$ est un cône : avec $r=0$ et $r=2q$ dans la caractérisation, $\\ps{p-q}{-q}\\le0$ et $\\ps{p-q}{q}\\le0$, donc $\\ps{p-q}{q}=0$ (l'angle est droit en $q$). Il reste $\\ps{p-q}{r}\\le0$ pour tout $r\\in\\hat{\\mathsf K}$, soit $\\ps wr\\ge0$."], ["pas", "Avec $r=-a_i$ (qui est dans $\\hat{\\mathsf K}$) : $\\ps{w}{a_i}\\le0$ pour tout $i$ : $w\\in\\mathsf K$. Et $\\ps pw=\\ps{p-q}{w}+\\ps qw=-\\norm{w}^2+0<0$. Contradiction avec l'hypothèse : donc $p\\in\\hat{\\mathsf K}$."], ["controle", "J'ai projeté sur $\\hat{\\mathsf K}$, donc j'ai eu besoin qu'il soit **fermé**. Un cône engendré par un nombre fini de vecteurs l'est, mais ce n'est pas évident (étapes 1–2 du livre : si les $a_i$ sont liés, on élimine un générateur, récurrence). C'est le seul point technique, et c'est lui qui fait la différence entre cônes « finis » et cônes quelconques."], ["bilan", "Pour prouver « $p$ est dans un convexe fermé », supposer le contraire et **séparer** : en Hilbert, la projection fournit l'hyperplan séparateur et sa normale $w$ est le certificat. Chaîne complète : projection (Euler) ⇒ Farkas ⇒ KKT."]], "livre": "Le livre utilise le théorème de séparation abstrait (T11) : $\\ps pw<\\alpha<\\ps qw$ pour tout $q\\in\\hat{\\mathsf K}$ ; puis $0\\in\\hat{\\mathsf K}$ donne $\\alpha<0$ et $q=-ta_i$, $t\\to+\\infty$, donne $\\ps{a_i}{w}\\le0$. La version par projection ci-dessus est la même preuve, avec un hyperplan explicite ; elle montre que l'inéquation d'Euler de la projection (Ex. 2.5.1) et Farkas sont un seul et même fait.", "reflexes": ["R13", "R10", "R3"], "liens": {"fiche": "2.5.17", "guide": "r-2-5-19"}, "num": "2.5.19"}, {"id": "2.5.21", "kind": "th", "label": "Lemme 2.5.21", "nom": "Le Lagrangien des inégalités : sup sur μ ≥ 0", "enonce": "$\\inf_{F(v)\\le0}J(v)=\\inf_{v\\in V}\\sup_{\\mu\\in(\\R^+)^M}\\big(J(v)+\\mu\\cdot F(v)\\big)$ (2.52).", "chaine": [["but", "Même idée que §2.5.10, mais la contrainte est $F\\le0$ : le sup sur $\\mu$ doit laisser passer $F(v)<0$ et punir $F(v)>0$."], ["idee", "Avec $\\mu\\ge0$ : si $F(v)\\le0$, $\\mu\\cdot F(v)\\le0$ et le sup est atteint en $\\mu=0$, il vaut $J(v)$ ; si une composante $F_i(v)>0$, $\\mu_i\\to+\\infty$ fait exploser le sup. La contrainte de signe sur $\\mu$ est exactement ce qui rend le sup inoffensif sur $K$."], ["pas", "$\\sup_{\\mu\\ge0}\\Lag(v,\\mu)=J(v)$ si $F(v)\\le0$, $+\\infty$ sinon ; l'inf en $v$ ne retient que $K$."], ["bilan", "KKT relu avec le Lagrangien : (2.46) est $\\partial_v\\Lag(u,\\lambda)=0$, et $\\lambda\\ge0$, $F(u)\\le0$, $\\lambda\\cdot F(u)=0$ est l'inéquation d'Euler de la **maximisation** en $\\mu$ sur le convexe $(\\R^+)^M$. Les deux variables jouent des rôles symétriques : c'est le point-selle de §2.6."]], "livre": "Laissé au lecteur par le livre ; la preuve tient en une ligne.", "reflexes": ["R1", "R5"], "liens": {"fiche": "2.5.17", "guide": "r-2-5-21"}, "num": "2.5.21"}, {"id": "2.5.24", "kind": "th", "label": "Théorème 2.5.24", "nom": "Égalités et inégalités mélangées : adapter, pas réinventer", "enonce": "$K=\\{G=0,\\ F\\le0\\}$, contraintes qualifiées (Définition 2.5.23 : $G_i'(u)$ libres et $\\bar w\\in\\Ker G'(u)$ avec $\\ps{F_i'(u)}{\\bar w}<0$ pour $i\\in I(u)$). En un minimum local : $J'(u)+\\sum\\mu_iG_i'(u)+\\sum\\lambda_iF_i'(u)=0$, $\\lambda\\ge0$, $\\lambda\\cdot F(u)=0$ (2.55).", "chaine": [["but", "Des multiplicateurs libres pour les égalités, positifs et complémentaires pour les inégalités. Je ne veux pas refaire deux preuves : je veux voir comment celles de §2.5.6 et §2.5.17 se combinent."], ["essai", "Premier réflexe : écrire $G=0$ comme $G\\le0$ et $-G\\le0$, et appliquer KKT. Ça marche si les contraintes restent qualifiées, et les multiplicateurs $\\lambda^+-\\lambda^-$ sont bien de signe quelconque ; mais la qualification au sens 2.5.15 échoue en général (on ne peut pas avoir $\\ps{G_i'(u)}{\\bar w}<0$ et $\\ps{-G_i'(u)}{\\bar w}<0$ à la fois) sauf si $G$ est affine. D'où une définition de qualification adaptée."], ["idee", "Suivre le schéma de KKT, mais en travaillant **dans** $\\Ker G'(u)$ : les directions admissibles sont tangentes aux égalités (fonctions implicites, comme en §2.5.6, grâce aux $G_i'(u)$ libres) et rentrantes pour les inégalités actives (inclinaison $w+\\delta\\bar w$ avec $\\bar w\\in\\Ker G'(u)$). On obtient $\\ps{J'(u)}{w}\\ge0$ pour tout $w\\in\\Ker G'(u)$ avec $\\ps{F_i'(u)}{w}\\le0$, $i\\in I(u)$."], ["pas", "Changer de côté en deux temps : Farkas dans le sous-espace $\\Ker G'(u)$ donne $J'(u)+\\sum_{i\\in I(u)}\\lambda_iF_i'(u)\\in(\\Ker G'(u))^\\perp$ avec $\\lambda_i\\ge0$ ; puis l'orthogonal de $\\Ker G'(u)$ est engendré par les $G_i'(u)$ (comme en §2.5.6), d'où les $\\mu_i$ de signe quelconque."], ["bilan", "Égalité = deux directions admissibles ($\\pm w$) ⇒ multiplicateur libre ; inégalité = une seule ⇒ multiplicateur positif, nul si inactif. Une fois ce principe compris, aucun des trois théorèmes n'est à apprendre séparément."]], "livre": "Le livre dit « simple adaptation, laissée au lecteur ». C'est vrai à condition d'avoir compris que la seule chose qui change est l'espace dans lequel on applique Farkas : $\\Ker G'(u)$ au lieu de $V$. Conditions de qualification faciles à vérifier : Remarques 2.5.25–2.5.27 (gradients actifs libres ; cas mixte ; Slater pour des contraintes convexes).", "reflexes": ["R13", "R11"], "liens": {"fiche": "2.5.24", "guide": "r-2-5-24"}, "num": "2.5.24"}, {"id": "2.6.2", "kind": "th", "label": "Proposition 2.6.2", "nom": "Un point-selle du Lagrangien donne un minimum sous contrainte, sans convexité", "enonce": "$\\Lag(v,q)=J(v)+q\\cdot F(v)$ sur $U\\times P$ ($P=\\R^M$ pour $F=0$, $P=(\\R^+)^M$ pour $F\\le0$). Si $(u,p)$ est un point-selle — $\\Lag(u,q)\\le\\Lag(u,p)\\le\\Lag(v,p)$ pour tous $q\\in P$, $v\\in U$ — alors $u\\in K$ et $u$ est un minimum global de $J$ sur $K$ ; si $J,F$ sont dérivables en $u$, $J'(u)+\\sum p_iF_i'(u)=0$.", "chaine": [["but", "Trois conclusions : $u$ admissible, $u$ optimal, stationnarité. Et une hypothèse en deux inégalités. Je vais lire chaque inégalité **séparément** : chacune doit donner quelque chose."], ["pas", "Inégalité de gauche, $\\Lag(u,q)\\le\\Lag(u,p)$ pour tout $q\\in P$ : $(q-p)\\cdot F(u)\\le0$ pour tout $q\\in P$. Elle ne concerne que $F(u)$ : elle doit donner l'**admissibilité**. Cas $P=\\R^M$ : $q-p$ décrit tout $\\R^M$, donc $F(u)=0$. Cas $P=(\\R^+)^M$ : je choisis des $q$ tests. $q=p+e_i$ : $F_i(u)\\le0$. $q=0$ : $-p\\cdot F(u)\\le0$ ; $q=2p$ : $p\\cdot F(u)\\le0$. Donc $p\\cdot F(u)=0$ : les écarts complémentaires."], ["pas", "Inégalité de droite, $\\Lag(u,p)\\le\\Lag(v,p)$ pour tout $v\\in U$ : $u$ minimise $J+p\\cdot F$ **sans contrainte**. Pour $v\\in K$ : $J(u)=J(u)+p\\cdot F(u)\\le J(v)+p\\cdot F(v)\\le J(v)$, la dernière inégalité parce que $p\\ge0$ et $F(v)\\le0$ (ou $F(v)=0$). Minimum global sur $K$."], ["pas", "Stationnarité : $u$ minimise $J+p\\cdot F$ sur l'ouvert $U$, donc la dérivée s'annule (Remarque 2.5.2) : $J'(u)+p\\cdot F'(u)=0$."], ["controle", "Aucune convexité n'a servi : un point-selle est une condition **suffisante** d'optimalité, toujours. C'est la réciproque (minimum ⇒ point-selle) qui demandera convexité et qualification (§2.6.4)."], ["bilan", "Lire une inégalité « pour tout $q$ dans un cône » en choisissant des $q$ **tests** bien placés ($p+e_i$, $0$, $2p$) : c'est ainsi qu'on extrait des égalités d'une inégalité. Et la seconde inégalité dit que le multiplicateur a transformé le problème contraint en problème libre."]], "livre": "Identique. Le choix $q=0$ et $q=2p$ pour obtenir $
