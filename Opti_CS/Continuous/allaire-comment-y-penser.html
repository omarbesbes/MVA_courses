t ; la preuve par l'absurde ci-dessus est la version rigoureuse standard (T10 appliqué à une suite unitaire), et la version Young donne un $\\mu_0$ explicite.", "reflexes": ["R1", "R16", "R8", "R15"], "liens": {"fiche": "3.4.8", "scene": "penal", "guide": "r-3-4-8"}, "voir": ["2.5.13", "3.4.6"], "num": "3.4.8"}, {"id": "3.5.1", "kind": "th", "label": "Proposition 3.5.1", "nom": "Newton : linéariser au point courant, pour que le terme linéaire de l'erreur disparaisse", "enonce": "$F:\\R^N\\to\\R^N$ de classe $C^2$, $u$ un zéro régulier ($F(u)=0$, $F'(u)$ inversible). Il existe $\\eps>0$ et $C<1/\\eps$ tels que, si $\\norm{u^0-u}\\le\\eps$, la méthode de Newton $u^{n+1}=u^n-F'(u^n)^{-1}F(u^n)$ vérifie $\\norm{u^{n+1}-u}\\le C\\norm{u^n-u}^2$ et $\\norm{u^n-u}\\le C^{-1}(C\\eps)^{2^n}$ (3.92).", "chaine": [["but", "Une convergence **quadratique** : $e^{n+1}=O(\\norm{e^n}^2)$ avec $e^n=u^n-u$. Pour cela il faut que dans $e^{n+1}=e^n-F'(u^n)^{-1}F(u^n)$, le terme **linéaire** en $e^n$ disparaisse exactement."], ["acquis", "$F(u)=0$, donc $F(u^n)=F(u^n)-F(u)$ : une différence de $F$ entre deux points proches, que Taylor sait développer. Mais autour de quel point ? La matrice de l'itération est $F'(u^n)$ : pour qu'elle simplifie le terme linéaire, il faut développer **autour de $u^n$**, pas autour de $u$ (où je ne connais rien de calculable)."], ["idee", "Taylor avec reste intégral (T12), $F(u)$ développé en $u^n$ : $F(u)=F(u^n)+F'(u^n)(u-u^n)+\\int_0^1(1-s)F''\\big(u^n+s(u-u^n)\\big)(u-u^n,u-u^n)\\,ds$. Avec $F(u)=0$ et $u-u^n=-e^n$ : $F(u^n)=F'(u^n)e^n-R^n$ où $R^n$ est le reste, quadratique en $e^n$. Alors $$e^{n+1}=e^n-F'(u^n)^{-1}\\big(F'(u^n)e^n-R^n\\big)=F'(u^n)^{-1}R^n .$$ Le terme linéaire a disparu **parce que** la matrice de l'itération est exactement celle du développement."], ["pas", "Majoration. Sur une boule $B(u,\\delta)$ : $F'(v)$ inversible avec $\\norm{F'(v)^{-1}}\\le C_1$ (l'ensemble des matrices inversibles est ouvert et l'inversion est continue : c'est là que sert « zéro régulier »), et $\\norm{F''(v)}\\le C_2$ ($F''$ continue sur un compact : c'est là que sert $C^2$). Comme $\\int_0^1(1-s)\\,ds=\\frac12$ : $\\norm{R^n}\\le\\frac{C_2}2\\norm{e^n}^2$, donc $\\norm{e^{n+1}}\\le C\\norm{e^n}^2$ avec $C=\\frac{C_1C_2}2$ — tant que $u^n\\in B(u,\\delta)$."], ["pas", "Rester dans la boule. Je choisis $\\eps<\\delta$ avec $C\\eps<1$. Si $\\norm{e^n}\\le\\eps$, alors $\\norm{e^{n+1}}\\le C\\eps\\cdot\\norm{e^n}\\le\\norm{e^n}\\le\\eps$ : par récurrence, tous les itérés restent dans la boule (et l'erreur décroît). C'est ici que la convergence est seulement **locale**."], ["pas", "Le double exponentiel. Je pose $a_n=C\\norm{e^n}$ : $a_{n+1}\\le a_n^2$, donc $a_n\\le a_0^{2^n}\\le(C\\eps)^{2^n}$ (récurrence immédiate, ou logarithme : $\\log a_n\\le2^n\\log a_0$). D'où $\\norm{e^n}\\le C^{-1}(C\\eps)^{2^n}$ : le nombre de chiffres exacts double à chaque itération."], ["controle", "En dimension 1, $e_{n+1}=\\frac{\\int_0^1(1-s)F''(u_n+s(u-u_n))ds}{F'(u_n)}e_n^2\\approx\\frac{F''(u)}{2F'(u)}e_n^2$ : la constante est un rapport, et $\\eps$ est d'autant plus petit que $F'(u)$ est petit ou $F''$ grand. Zéro non régulier ($F(x)=x^2$) : $e_{n+1}=e_n/2$, linéaire seulement. Loin de $u$ : $\\arctan$ diverge pour $|u^0|>1{,}39$, et $x^3-2x+2$ a un cycle $0\\leftrightarrow1$. Pour $F=J'$, Newton trouve un point critique quelconque — minimum, maximum ou col (Remarque 3.5.2) : la convexité n'est jamais entrée dans la preuve."], ["bilan", "**Linéariser autour du point courant, pas autour de la solution** : c'est là que l'on connaît la matrice, et c'est ce qui fait disparaître le terme linéaire de l'erreur. **Taylor avec reste intégral** (T12) rend la constante explicite. Et la récurrence $a_{n+1}\\le a_n^2$ ⇒ $a_n\\le a_0^{2^n}$ est la signature de l'ordre 2 — à condition de rester dans la boule où les constantes sont valables (T7, variante quadratique)."]], "livre": "Identique ; le livre écrit $\\frac12\\int_0^1F''\\,ds$ au lieu de $\\int_0^1(1-s)F''\\,ds$ (coquille sans conséquence puisque $\\int_0^1(1-s)ds=\\frac12$). Techniques : T12 puis T7. À emporter : le découpage « constantes sur une boule / rester dans la boule / récurrence », qui est celui de toutes les preuves de convergence locale.", "reflexes": ["R16", "R2", "R3", "R15"], "liens": {"fiche": "3.5.1", "scene": "newton", "guide": "r-3-5-1"}, "voir": ["3.3.1", "NL"], "num": "3.5.1"}, {"id": "NL", "kind": "th", "label": "(3.93)–(3.96) · Remarque 3.5.4", "nom": "Newton sur le système de Lagrange : l'inversibilité par le noyau, et pourquoi la Hessienne du Lagrangien", "enonce": "Pour $\\min_{G(v)=0}J(v)$ (3.93) avec $G_1'(u),\\dots,G_M'(u)$ libres, on applique Newton au système de Lagrange $\\mathcal F(u,\\lambda)=\\big(J'(u)+\\lambda\\cdot G'(u),\\ G(u)\\big)=0$ (3.94), de matrice jacobienne $\\mathcal F'=\\begin{pmatrix}\\Lag''(u,\\lambda)&G'(u)^*\\\\ G'(u)&0\\end{pmatrix}$. Sous (3.95) — $\\Lag''(u,\\lambda)(w,w)>0$ pour $w\\in\\Ker G'(u)\\setminus\\{0\\}$ — cette matrice est inversible, donc Newton converge quadratiquement ; une itération revient à minimiser le développement d'ordre 2 du Lagrangien sous la contrainte linéarisée (3.96).", "chaine": [["but", "Profiter de la convergence quadratique de Newton (§3.5.1) pour un problème **avec contraintes**. Newton demande un système $\\mathcal F=0$ carré (autant d'équations que d'inconnues) et un zéro régulier. Le système, je l'ai : les conditions de Lagrange (3.94), $N+M$ équations en les $N+M$ inconnues $(u,\\lambda)$. Reste la régularité : $\\mathcal F'(u,\\lambda)$ est-elle inversible ?"], ["pas", "J'écris la jacobienne. Dérivée de $(u,\\lambda)\\mapsto J'(u)+\\sum_i\\lambda_iG_i'(u)$ : en $u$, $J''(u)+\\sum\\lambda_iG_i''(u)=\\Lag''(u,\\lambda)$ ; en $\\lambda$, la matrice dont les colonnes sont les $G_i'(u)$, c'est $G'(u)^*$. Dérivée de $G$ : $G'(u)$ en $u$, $0$ en $\\lambda$. Matrice symétrique par blocs, avec un bloc nul sur la diagonale : elle n'est **jamais** définie positive (c'est une matrice de point-selle, à $M$ valeurs propres négatives). L'inversibilité doit se montrer à la main : par le **noyau** (R16, une matrice carrée est inversible ssi son noyau est nul)."], ["pas", "Noyau. $(w,\\nu)$ avec $\\Lag''w+G'^*\\nu=0$ et $G'w=0$. La seconde dit $w\\in\\Ker G'(u)$. Je multiplie scalairement la première par $w$ : $\\Lag''(w,w)+\\ps{G'^*\\nu}{w}=\\Lag''(w,w)+\\ps{\\nu}{G'w}=\\Lag''(w,w)=0$. Par (3.95), $w=0$. Il reste $G'^*\\nu=\\sum_i\\nu_iG_i'(u)=0$, donc $\\nu=0$ puisque les $G_i'(u)$ sont libres. Noyau nul : $\\mathcal F'(u,\\lambda)$ inversible. Chaque hypothèse a tué une composante : **la qualification tue $\\nu$, la condition d'ordre 2 tue $w$**."], ["question", "Pourquoi la Hessienne du **Lagrangien** et pas celle de $J$ ? Si je remplaçais $\\Lag''$ par $J''$ dans la matrice (3.97), le point fixe serait encore $(u,\\lambda)$, mais l'itération ne serait plus celle de Newton pour $\\mathcal F$ : plus de convergence quadratique, et même, en général, plus de convergence (sur le cercle, le facteur linéarisé vaut $1-\\Lag''(t,t)/J''(t,t)=-2$). La raison de fond est la Proposition §2.5.13 : sur la variété $\\{G=0\\}$, le comportement d'ordre 2 de $J$ est donné par $\\Lag''(u,\\lambda)$ restreinte à l'espace tangent, parce que la **courbure de la contrainte** entre par le terme $\\lambda\\cdot G''$."], ["idee", "Lecture « optimisation » d'une itération (3.96). Le pas de Newton résout $\\Lag''(u^n,\\lambda^n)\\,\\delta u+G'(u^n)^*\\delta\\lambda=-\\Lag'(u^n,\\lambda^n)$ et $G'(u^n)\\,\\delta u=-G(u^n)$. Ce sont **exactement** les conditions de Lagrange du programme quadratique $$\\begin{gathered}\\min_w\\ Q^n(w)=\\Lag(u^n,\\lambda^n)+\\Lag'(u^n,\\lambda^n)\\cdot(w-u^n)+\\tfrac12\\Lag''(u^n,\\lambda^n)(w-u^n,w-u^n)\\\\ \\text{sous}\\quad G(u^n)+G'(u^n)(w-u^n)=0,\\end{gathered}$$ avec $w-u^n=\\delta u$ et pour multiplicateur $\\delta\\lambda=\\lambda^{n+1}-\\lambda^n$. (Le livre écrit $\\lambda^{n+1}$ : c'est le multiplicateur si l'on met $J'(u^n)$ au lieu de $\\Lag'(u^n,\\lambda^n)$ dans le terme linéaire, ce qui ne change pas $u^{n+1}$ car la différence est constante sur la contrainte linéarisée.) Newton = minimiser le modèle quadratique du Lagrangien sur la contrainte linéarisée : c'est la SQP de §3.6.1."], ["controle", "(3.95) est suffisante, pas nécessaire : au maximum de $J$ sur le cercle, $\\Lag''(t,t)<0$, mais $\\det\\mathcal F'=-\\norm{G'}^2\\Lag''(t,t)\\ne0$ et Newton y converge aussi vite — il cherche un zéro de $\\mathcal F$, sans distinguer minimum et maximum (Remarque 3.5.2). Convergence locale seulement : un départ à 90° du minimum envoie $u^1$ très loin. Et la convergence quadratique porte sur le **couple** $(u^n,\\lambda^n)$ : les deux doublent leurs chiffres exacts."], ["bilan", "**Pour appliquer Newton à un problème contraint : écrire les conditions d'optimalité comme un système carré, et vérifier la régularité par le noyau** — la qualification des contraintes et la condition d'ordre 2 sont exactement ce qu'il faut pour que le noyau soit nul. Et la règle à ne plus oublier : avec une contrainte courbe, **c'est la Hessienne du Lagrangien qui compte** (§2.5.13, Remarque 3.5.4)."]], "livre": "Le livre donne l'argument du noyau et l'interprétation (3.96), avec le multiplicateur noté $\\lambda^{n+1}$ (voir ci-dessus). Technique : T14 (linéariser, ici le système tout entier) et le raisonnement « noyau nul ⇒ inversible », qui est celui de toutes les matrices de point-selle (mixtes, KKT, Stokes…).", "reflexes": ["R1", "R16", "R12", "R14"], "liens": {"fiche": "NL", "scene": "newton", "guide": "newton-lagrange"}, "voir": ["3.5.1", "2.5.13", "2.5.6"], "num": "NL"}, {"id": "3.6.1", "kind": "th", "label": "Lemme 3.6.1 · SLP · SQP", "nom": "Un algorithme = un modèle local que l'on minimise : gradient, Newton, SLP, SQP d'un seul regard", "enonce": "Sans contrainte, avec le modèle $J_{n-1}(v)=J(v^{n-1})+J'(v^{n-1})\\cdot(v-v^{n-1})+\\frac1{2\\mu}\\norm{v-v^{n-1}}^2$ (3.102), la méthode des approximations successives ($v^n$ minimise $J_{n-1}$) est exactement le gradient à pas fixe $\\mu$. Avec contraintes : modèles affines + région de confiance (SLP, (3.103)–(3.104)) ; modèle quadratique du Lagrangien + contraintes affines (SQP, (3.105)).", "chaine": [["but", "Comprendre une *stratégie* plutôt qu'un théorème : remplacer le problème par un modèle facile autour du point courant, le résoudre, recommencer. Je teste sur le modèle le plus simple possible et je regarde ce qui sort."], ["pas", "(3.102) est une parabole de courbure $\\frac1\\mu\\Id$, tangente à $J$ en $v^{n-1}$ (même valeur, même pente). Elle est fortement convexe : un unique minimum, donné par son équation d'Euler $J'(v^{n-1})+\\frac1\\mu(v-v^{n-1})=0$, soit $v^n=v^{n-1}-\\mu J'(v^{n-1})$. **C'est (3.8), le gradient à pas fixe.** Le pas $\\mu$ est l'inverse de la courbure que l'on prête au modèle."], ["question", "Pourquoi ce modèle et pas un autre ? Trois choix naturels pour un modèle local : affine ($J(v^{n-1})+J'(v^{n-1})\\cdot(v-v^{n-1})$) — mais il n'a pas de minimum, d'où la **région de confiance** $\\norm{v-v^{n-1}}\\le\\delta$ : c'est la SLP ; quadratique avec la vraie Hessienne (3.91) — c'est **Newton**, cher et parfois sans minimum ; quadratique avec la Hessienne la plus bête, $\\frac1\\mu\\Id$ — c'est le gradient. Le paramètre $\\mu$ est libre (R5) : que dit-il ?"], ["idee", "Si $\\mu\\le1/L$, le modèle est **au-dessus** de $J$ partout : c'est la parabole du haut du Lemme §2.4.10, $J(v)\\le J(w)+J'(w)\\cdot(v-w)+\\frac L2\\norm{v-w}^2\\le J_{n-1}(v)$. Alors $$J(v^n)\\le J_{n-1}(v^n)\\le J_{n-1}(v^{n-1})=J(v^{n-1}) :$$ descente garantie, sans aucun calcul — c'est le lemme de descente §3.2.9 vu géométriquement. Principe général (« majorer puis minimiser ») : **tout modèle tangent qui majore $J$ fait descendre $J$**. Il explique d'un coup le gradient ($\\mu\\le1/L$), le proximal (§3.3.32 : on modélise $J_1$ et on garde $J_2$ tel quel), le gradient projeté (modèle + indicatrice de $K$), et pourquoi Newton peut **ne pas** descendre : son modèle colle à l'ordre 2 mais peut passer sous $J$."], ["pas", "Avec contraintes, même recette, en modélisant $J$ et $F$. SLP : tout affine, un programme linéaire par itération, région de confiance en norme $\\ell^1$ ou $\\ell^\\infty$ pour rester linéaire. SQP : contrainte affine, objectif quadratique de matrice $Q^{n-1}=\\Lag''(v^{n-1},\\lambda^{n-1})$ — la Hessienne du **Lagrangien**, parce que ce qui compte est $J$ sur la variété $\\{F=0\\}$ et que la courbure de la contrainte y entre par $\\lambda\\cdot F''$ (§2.5.13) ; et $Q^{n-1}$ est positive près d'un minimum. Une itération de SQP est un pas de Newton sur le système de Lagrange (§NL)."], ["controle", "Sur $J(x)=\\frac12x^2+3\\ln\\cosh x$ ($\\alpha=1$, $L=4$) : avec $\\mu\\le1/4$ le modèle du gradient ne passe jamais sous $J$ et chaque pas descend ; Newton atteint la précision machine en quatre pas depuis $0{,}8$, mais depuis $2{,}2$ il tourne sur le cycle $\\pm2{,}663$ bien que $J$ soit α-convexe — son modèle n'est pas un majorant. Pour $\\mu=1/L$, le modèle (3.102) est exactement la parabole majorante de T13."], ["bilan", "**Un algorithme, c'est un modèle local plus sa minimisation ; pour prouver une descente, chercher un modèle tangent qui majore $J$.** Ce point de vue unifie le chapitre : gradient (3.102), Newton (3.91), proximal, gradient projeté, SLP, SQP ne diffèrent que par le modèle. Et avec une contrainte, le modèle doit être celui du Lagrangien."]], "livre": "La preuve du livre tient en une ligne (l'équation d'Euler du modèle). Ce qu'il faut emporter n'est pas la preuve mais le regard : les méthodes d'approximations successives (3.6), SLP, SQP, et le lien avec Newton–Lagrange. Le principe « majorant tangent ⇒ descente » n'est pas dans le livre sous ce nom, mais c'est lui qui est derrière le Lemme 3.2.10 (T13).", "reflexes": ["R1", "R3", "R5", "R12"], "liens": {"fiche": "3.6.1", "scene": "sandwich", "guide": "r-3-6-1"}, "voir": ["2.4.10", "3.2.9", "NL", "3.3.32"], "num": "3.6.1"}, {"id": "3.7.6", "kind": "th", "label": "Lemmes 3.7.1, 3.7.3, 3.7.5 · Proposition 3.7.6", "nom": "L'état adjoint : transposer pour ne jamais calculer y′(v) — et c'est la rétropropagation", "enonce": "Sous (H) — pour tout $v$, $F(v,y)=0$ a une unique solution $y(v)$, différentiable, avec $\\frac{\\partial F}{\\partial y}$ inversible — la fonction réduite $\\tilde J(v)=J(v,y(v))$ est différentiable et $$\\tilde J'(v)=\\frac{\\partial J}{\\partial v}(v,y(v))+\\Big\\langle p(v),\\frac{\\partial F}{\\partial v}(v,y(v))\\Big\\rangle,\\qquad(3.116)$$ où l'état adjoint $p(v)$ est l'unique solution de $\\big(\\frac{\\partial F}{\\partial y}\\big)^*p=-\\frac{\\partial J}{\\partial y}$ (3.115). Lemme 3.7.1 : pour $J=J_m\\circ\\dots\\circ J_1$, $\\nabla J(v)=J_1'(x_1)^*\\cdots J_m'(x_m)^*$, calculé de droite à gauche (3.110).", "chaine": [["but", "Le gradient complet de $\\tilde J$ au prix d'**une** résolution supplémentaire, au lieu de $N$. Point de départ : la dérivation composée (Lemme 3.7.3), $\\tilde J'(v)\\cdot h=\\frac{\\partial J}{\\partial v}\\cdot h+\\big\\langle\\frac{\\partial J}{\\partial y},y'(v)\\cdot h\\big\\rangle$, où $y'(v)\\cdot h$ résout le système linéarisé $\\frac{\\partial F}{\\partial y}\\,(y'(v)\\cdot h)=-\\frac{\\partial F}{\\partial v}\\cdot h$ (3.113) : une résolution **par direction $h$**, donc $N$ pour le gradient."], ["acquis", "En notant $M=\\frac{\\partial F}{\\partial y}$ (inversible), $a=\\frac{\\partial J}{\\partial y}$ (un vecteur fixe) et $b_h=\\frac{\\partial F}{\\partial v}\\cdot h$ (un vecteur qui dépend de $h$, pas cher) : $\\tilde J'(v)\\cdot h=\\frac{\\partial J}{\\partial v}\\cdot h-\\ps{a}{M^{-1}b_h}$. Tout le coût est dans $M^{-1}b_h$, à refaire pour chaque $h$."], ["idee", "Un produit scalaire $\\ps{a}{M^{-1}b_h}$ où seul $b_h$ change : je **transpose** (R12, la même quantité de deux façons) : $\\ps{a}{M^{-1}b_h}=\\ps{(M^{-1})^*a}{b_h}=\\ps{M^{-*}a}{b_h}$. Le vecteur $M^{-*}a$ ne dépend pas de $h$ : je le calcule **une fois**, par une résolution avec $M^*$, et chaque dérivée directionnelle devient un produit scalaire. Je pose $p=-M^{-*}a$, c'est-à-dire $\\big(\\frac{\\partial F}{\\partial y}\\big)^*p=-\\frac{\\partial J}{\\partial y}$ : c'est (3.115). Et $\\tilde J'(v)\\cdot h=\\frac{\\partial J}{\\partial v}\\cdot h+\\ps{p}{\\frac{\\partial F}{\\partial v}\\cdot h}$ : c'est (3.116). La preuve, c'est une transposition."], ["pas", "La même chose habillée en multiplicateur — la présentation du livre (T15). Lagrangien $\\Lag(v,y,p)=J(v,y)+\\ps{p}{F(v,y)}$. Comme $F(v,y(v))=0$, $\\tilde J(v)=\\Lag(v,y(v),p)$ **pour tout $p$**. Je dérive : $\\tilde J'(v)\\cdot h=\\frac{\\partial\\Lag}{\\partial v}\\cdot h+\\big\\langle\\frac{\\partial\\Lag}{\\partial y},y'(v)\\cdot h\\big\\rangle$. Le terme gênant contient $y'(v)$ ; j'ai un paramètre libre, $p$ (R5) : je le choisis pour **annuler le coefficient** de $y'(v)$, $\\frac{\\partial\\Lag}{\\partial y}=\\frac{\\partial J}{\\partial y}+\\big(\\frac{\\partial F}{\\partial y}\\big)^*p=0$ — c'est (3.115), et il reste $\\frac{\\partial\\Lag}{\\partial v}\\cdot h$, c'est (3.116). L'état adjoint est le multiplicateur de la contrainte de modèle, et (3.116) est la formule de sensibilité du Lemme §2.5.12."], ["pas", "La rétropropagation (Lemme 3.7.1) est le même geste avec $M$ triangulaire. $J=J_m\\circ\\dots\\circ J_1$, $x_1=v$, $x_{i+1}=J_i(x_i)$ : $J'(v)\\cdot h=J_m'(x_m)\\cdot\\big(J_{m-1}'(x_{m-1})\\cdots J_1'(x_1)h\\big)$. Mode direct : une passe par direction, $N$ passes. Je transpose : $\\nabla J(v)=J_1'(x_1)^*J_2'(x_2)^*\\cdots J_m'(x_m)^*$, et je calcule **de droite à gauche** en partant de $J_m'(x_m)^*$, qui est un vecteur (car $N_{m+1}=1$) : $m$ produits matrice-vecteur, une seule passe (3.110). Chaque étape $g_i=J_i'(x_i)^*g_{i+1}$ est une équation adjointe $x_{i+1}=J_i(x_i)$ résolue à l'envers."], ["controle", "Coût : mode direct $N\\sum_iN_iN_{i+1}$, mode adjoint $\\sum_iN_iN_{i+1}$ — le facteur $N$ est exactement le nombre de directions que l'on n'a plus à parcourir (Remarque 3.7.7 : deux résolutions au lieu de $N+1$). Sur le modèle $-(vy')'=1$, l'adjoint coïncide avec les différences finies à $10^{-6}$ près, et comme $A^*=A$, la résolution adjointe utilise la même matrice. Où sert (H) : $y'(v)$ existe (fonctions implicites) et $M^*$ est inversible, donc $p$ existe et est unique."], ["bilan", "**Quand une quantité coûteuse apparaît dans un produit scalaire $\\ps{a}{M^{-1}b_h}$ pour beaucoup de $h$, transposer : $M^{-*}a$ se calcule une fois.** Version multiplicateur : écrire $\\tilde J=\\Lag(v,y(v),p)$ pour tout $p$, et choisir $p$ pour tuer le terme que l'on ne veut pas calculer (T15). Adjoint, rétropropagation, différentiation automatique inverse : trois noms pour cette transposition."]], "livre": "Le livre prouve 3.7.6 par le Lagrangien (T15), en deux lignes ; la version « transposer un produit scalaire » est la même preuve sans habillage, et dit pourquoi ça marche. Pour 3.7.1, le livre a des coquilles d'indices (dérivées évaluées au mauvais point), mais la structure — produit des transposées à rebours — est juste.", "reflexes": ["R12", "R5", "R1", "R15"], "liens": {"fiche": "3.7.6", "guide": "r-3-7-6"}, "voir": ["2.5.12", "3.4.3"], "num": "3.7.6"}, {"id": "E2.2.1", "kind": "exo", "num": "Ex. 2.2.1", "label": "Exercice 2.2.1 · niveau 1", "nom": "Casser une hypothèse à la fois", "enonce": "Montrer par des exemples que « $K$ fermé » et « $J$ continue » sont en général nécessaires à l'existence d'un minimum. Donner une fonction continue et minorée de $\\R$ dans $\\R$ sans minimum sur $\\R$.", "chaine": [["but", "Des contre-exemples, pas une preuve. La question cachée est : **pourquoi** le Théorème §2.2.1 a-t-il besoin de chaque hypothèse ? Je relis sa preuve : une suite minimisante, bornée grâce à « infinie à l'infini », dont on extrait une sous-suite convergente, dont la limite est dans $K$ (fermé) et réalise l'infimum (continuité)."], ["idee", "Chaque hypothèse bloque une façon d'échapper pour la suite minimisante : **sortir de $K$** (fermé), **sauter à la limite** ($J$ continue), **partir à l'infini** ((2.2)). Pour chaque exemple, je casse **une seule** hypothèse et je construis la suite qui s'échappe par la porte ouverte. Je travaille dans $\\R$, avec $K$ borné quand je peux, pour que (2.2) soit gratuite (Remarque 2.2.2)."], ["pas", "$K$ non fermé : $K=]0,1]$, $J(x)=x$. $J$ continue, $K$ borné. $\\inf_KJ=0$ (par $1/n$), jamais atteint : la suite minimisante $1/n$ converge vers $0\\notin K$."], ["pas", "$J$ non continue : $K=[-1,1]$ fermé borné, $J(x)=|x|$ sauf $J(0)=1$. $\\inf_KJ=0$, non atteint ; la suite $1/n$ converge bien vers $0\\in K$, mais $J$ **saute vers le haut** à la limite : $J(0)=1>0=\\lim J(1/n)$. Je note que si $J(0)=-1$ (saut vers le bas), le minimum existe : c'est la semi-continuité inférieure qui compte (Ex. 2.2.3)."], ["pas", "Continue, minorée, sans minimum : $J(x)=e^x$ sur $\\R$. Minorée par $0$, $\\inf=0$ par $x=-n$, jamais atteint : la suite minimisante **part à l'infini**, et c'est (2.2) qui est violée. ($\\arctan$, $1/(1+x^2)$ marchent aussi.)"], ["controle", "« En général nécessaires » : les hypothèses sont suffisantes, pas nécessaires. $J(x)=(x-\\frac12)^2$ a un minimum sur $]0,1]$ non fermé. Mes exemples montrent seulement qu'on ne peut pas les **supprimer** sans contrepartie."], ["bilan", "Pour comprendre une hypothèse, je cherche la porte qu'elle ferme dans la preuve, puis je construis l'exemple qui passe par cette porte quand on l'ouvre — une hypothèse à la fois (R14)."]], "livre": "Le corrigé du guide est exactement cette grille à trois portes, avec en prime le point 4 (suffisantes ≠ nécessaires). À emporter : les trois mots-clés *sortie, saut, fuite* pour retrouver instantanément les trois contre-exemples.", "reflexes": ["R14", "R3", "R10"], "liens": {"fiche": "2.2.1", "scene": "existence", "guide": "exo-2-2-1"}, "voir": ["2.2.1", "E2.2.3"]}, {"id": "E2.2.2", "kind": "exo", "num": "Ex. 2.2.2", "label": "Exercice 2.2.2 · niveau 2", "nom": "Confiner la suite minimisante avec un niveau intermédiaire", "enonce": "Montrer qu'on peut remplacer « infinie à l'infini » (2.2) par la condition plus faible $\\inf_{v\\in K}J(v)<\\lim_{R\\to+\\infty}\\big(\\inf_{\\norm v\\ge R}J(v)\\big)$.", "chaine": [["but", "Refaire le Théorème §2.2.1 avec une hypothèse plus faible. Dans sa preuve, (2.2) ne sert qu'à **une** chose : rendre bornée la suite minimisante. Il me suffit donc de montrer que la nouvelle condition fait la même chose."], ["acquis", "Je nomme : $m=\\inf_KJ$ et $\\varphi(R)=\\inf\\{J(v):v\\in K,\\norm v\\ge R\\}$. Quand $R$ grandit, l'ensemble rétrécit, donc $\\varphi$ **croît** et a une limite $\\ell$ ; l'hypothèse dit $m<\\ell$. Lecture : loin de l'origine, $J$ reste au-dessus d'un niveau strictement supérieur à l'infimum."], ["idee", "Une suite minimisante finit sous tout niveau $c>m$. Si je choisis $c$ **entre** $m$ et $\\ell$, alors au-delà d'un rayon $R_0$, $J>c$ : la suite minimisante, qui finit sous $c$, ne peut plus sortir de la boule de rayon $R_0$. C'est le confinement cherché."], ["pas", "Rigoureusement : $\\varphi(R)\\to\\ell>c$ donne $R_0$ avec $\\varphi(R_0)>c$, i.e. $J(v)>c$ dès que $v\\in K$, $\\norm v\\ge R_0$. Contraposée : $J(v)\\le c\\Rightarrow\\norm v<R_0$. Pour une suite minimisante, $J(u^n)\\to m<c$, donc $J(u^n)<c$ et $\\norm{u^n}<R_0$ pour $n$ grand : bornée."], ["pas", "La fin est celle du théorème : Bolzano–Weierstrass, $u^{n_k}\\to u$, $u\\in K$ (fermé), $J(u)=\\lim J(u^{n_k})=m$ (continuité). Minimum atteint, et $m$ fini."], ["controle", "Plus faible, vraiment ? (2.2) donne $\\ell=+\\infty>m$ (sinon une suite avec $\\norm{u^n}\\ge n$ et $J(u^n)<M$ contredirait (2.2)). Réciproque fausse : $J=-e^{-x^2}$ sur $\\R$, $m=-1<0=\\ell$, et $J$ ne tend pas vers $+\\infty$. Et le **strict** est indispensable : $J=e^x$, $m=\\ell=0$, pas de minimum (Ex. 2.2.1)."], ["bilan", "Quand on affaiblit une hypothèse, repérer **à quel unique endroit** de la preuve elle sert et ne remplacer que cela (R14). Ici : « bornée » s'obtient par un niveau intermédiaire $c$ — un geste de confinement qui resservira pour toute fonction « coercive sur un sous-niveau »."]], "livre": "Le corrigé suit cette chaîne (cadre, comparaison avec (2.2), confinement, méthode directe T1, nécessité du strict). À retenir surtout l'étape 3 : fixer un niveau strictement entre deux bornes pour transformer une limite en une inégalité uniforme.", "reflexes": ["R14", "R2", "R8"], "liens": {"fiche": "2.2.1", "scene": "existence", "guide": "exo-2-2-2"}, "voir": ["2.2.1", "2.1.3"]}, {"id": "E2.2.3", "kind": "exo", "num": "Ex. 2.2.3", "label": "Exercice 2.2.3 · niveau 1", "nom": "Ne garder que l'inégalité qui sert : la semi-continuité inférieure", "enonce": "Montrer qu'on peut remplacer la continuité de $J$ par la semi-continuité inférieure : $u^n\\to u\\Rightarrow\\liminf J(u^n)\\ge J(u)$.", "chaine": [["but", "Même méthode que l'exercice précédent : où la continuité sert-elle dans la preuve de §2.2.1 ? À un seul endroit : à la fin, $J(u)=\\lim J(u^{n_k})=m$."], ["question", "Mais ai-je besoin de l'**égalité** ? Pour conclure que $u$ est un minimum, il me faut $J(u)\\le m$. Or $J(u)\\ge m$ est **gratuit** dès que $u\\in K$ (définition de l'infimum). La seule inégalité à démontrer est $J(u)\\le m$, et la s.c.i. donne exactement $J(u)\\le\\liminf J(u^{n_k})=m$."], ["pas", "Je reprends la preuve : suite minimisante bornée par (2.2) (si elle ne l'était pas, une sous-suite $\\norm{u^{n_k}}\\to\\infty$ donnerait $J(u^{n_k})\\to+\\infty$, contre $J(u^{n_k})\\to m<+\\infty$), sous-suite convergente $u^{n_k}\\to u\\in K$ (fermé), puis $J(u)\\le\\liminf J(u^{n_k})=m\\le J(u)$. Donc $J(u)=m$, fini."], ["controle", "Exemple : $J=|x|$ sauf $J(0)=-1$ sur $[-1,1]$ : pas continue, mais s.c.i. (elle ne saute que vers le bas), minimum en $0$. Avec $J(0)=+1$ (Ex. 2.2.1), la s.c.i. échoue en $0$ et le minimum disparaît. Pour un **maximum**, ce serait la semi-continuité supérieure."], ["bilan", "Une égalité dans une preuve cache souvent une seule inégalité utile ; l'autre vient gratuitement d'une définition. Repérer laquelle, c'est trouver l'hypothèse minimale (R14, R2)."]], "livre": "Identique au corrigé (T1). Ce qu'il faut emporter : « pour minimiser, $J$ peut sauter vers le bas, jamais vers le haut », et le réflexe de demander, devant toute égalité d'une preuve, laquelle des deux inégalités travaille vraiment.", "reflexes": ["R14", "R2"], "liens": {"fiche": "2.2.1", "scene": "existence", "guide": "exo-2-2-3"}, "voir": ["2.2.1", "E2.2.1"]}, {"id": "E2.2.4", "kind": "exo", "num": "Ex. 2.2.4", "label": "Exercice 2.2.4 · niveau 1", "nom": "Vérifier les hypothèses d'existence sur deux modèles", "enonce": "Montrer qu'il existe un minimum pour les Exemples 1.2.1 (programme linéaire de transport) et 1.2.3 ($\\min_{Bx=0}\\frac12Ax\\cdot x-b\\cdot x$, $A$ symétrique définie positive).", "chaine": [["but", "Existence en dimension finie : je dois cocher les cases du Théorème §2.2.1 — $K$ fermé, non vide, et ($K$ borné ou $J$ infinie à l'infini). Rien d'autre à inventer : c'est un exercice de **vérification** d'hypothèses."], ["pas", "Exemple 1.2.3. $K=\\Ker B$ : non vide ($0$), fermé (image réciproque de $\\{0\\}$ par une application linéaire continue). $J$ polynomiale donc continue. Infinie à l'infini ? Je minore : $Ax\\cdot x\\ge\\lambda_1\\norm x^2$ (base propre orthonormée) et $b\\cdot x\\le\\norm b\\norm x$ (Cauchy–Schwarz) : $J(x)\\ge\\norm x(\\frac{\\lambda_1}2\\norm x-\\norm b)\\to+\\infty$. Case cochée. Bonus : unicité par stricte convexité (Ex. 2.3.5 + Prop. §2.3.4)."], ["pas", "Exemple 1.2.1 (transport, $v_{ij}\\ge0$, $\\sum_jv_{ij}\\le s_i$, $\\sum_iv_{ij}\\ge r_j$). $K$ fermé : intersection finie de demi-espaces fermés. $K$ **borné** : $0\\le v_{ij}\\le\\sum_kv_{ik}\\le s_i$. Non vide : il faut un point explicite — $v_{ij}=s_ir_j/S$ avec $S=\\sum s_i$ marche si $\\sum r_j\\le S$ (sinon $K=\\emptyset$, en sommant les contraintes). $J$ linéaire donc continue ; $K$ borné rend (2.2) automatique."], ["controle", "La dernière case n'est pas décorative : $\\min_{x\\ge0}(-x)$ est un programme linéaire sans solution. Pour $A$ seulement positive dans 1.2.3, le minimum existe ssi $b\\perp(\\Ker A\\cap\\Ker B)$ : c'est l'Ex. 2.5.3 (on élimine les directions où $J$ est constante)."], ["bilan", "Existence = une check-list (fermé, non vide, borné ou coercif) ; unicité = une autre question (stricte convexité). Et le geste technique pour la coercivité d'une quadratique : **minorer par $\\lambda_{\\min}$, majorer le terme linéaire par Cauchy–Schwarz** (R1, R15)."]], "livre": "Le corrigé fait les mêmes vérifications, en précisant les hypothèses prises sur les exemples du chapitre 1 (non fournis) ; il traite en complément $A$ seulement positive, ce qui anticipe l'Ex. 2.5.3.", "reflexes": ["R1", "R15"], "liens": {"fiche": "2.2.1", "scene": "existence", "guide": "exo-2-2-4"}, "voir": ["2.2.1", "E2.3.5", "E2.5.3"]}, {"id": "E2.3.1", "kind": "exo", "num": "Ex. 2.3.1", "label": "Exercice 2.3.1 · niveau 1", "nom": "Transporter l'inégalité de convexité", "enonce": "$J_1,J_2$ convexes, $\\lambda>0$, $\\varphi$ convexe croissante sur un intervalle contenant $J_1(V)$. Montrer que $J_1+J_2$, $\\max(J_1,J_2)$, $\\lambda J_1$ et $\\varphi\\circ J_1$ sont convexes.", "chaine": [["but", "Quatre fois la même chose : écrire (2.7) au point $w=\\theta u+(1-\\theta)v$ pour la nouvelle fonction. Je pars de ce que j'ai : $J_k(w)\\le\\theta J_k(u)+(1-\\theta)J_k(v)$ pour $k=1,2$, et je regarde quelles opérations **conservent le sens** de cette inégalité."], ["pas", "Somme : j'additionne les deux inégalités. Multiple : je multiplie par $\\lambda>0$, le sens est conservé (il serait renversé pour $\\lambda<0$)."], ["pas", "Maximum $M=\\max(J_1,J_2)$ : le piège est de vouloir comparer $M(w)$ à $M(u)$ directement. Je majore chaque $J_k(w)$ par $\\theta M(u)+(1-\\theta)M(v)$ (car $J_k\\le M$ et les coefficients sont $\\ge0$), **puis** je prends le max sur $k$ à gauche."], ["pas", "Composition : $J_1(w)\\le t:=\\theta J_1(u)+(1-\\theta)J_1(v)$, avec $t$ dans l'intervalle (combinaison convexe de deux points de l'intervalle). $\\varphi$ croissante : $\\varphi(J_1(w))\\le\\varphi(t)$ ; $\\varphi$ convexe : $\\varphi(t)\\le\\theta\\varphi(J_1(u))+(1-\\theta)\\varphi(J_1(v))$. Les deux hypothèses sur $\\varphi$ servent chacune exactement une fois."], ["controle", "Si j'enlève « croissante » : $e^{-x^2}=\\varphi\\circ J_1$ avec $\\varphi=e^{-t}$ convexe décroissante, et $e^{-x^2}$ n'est pas convexe ($\\varphi\\circ J_1(0)=1>e^{-1}$, moyenne des valeurs en $\\pm1$). Et $\\min(J_1,J_2)$ n'est pas convexe : $\\min(x,-x)=-|x|$. Exemple utile : $\\norm v^2=\\varphi(\\norm v)$ avec $\\varphi=t^2$ croissante sur $[0,\\infty[$."], ["bilan", "Les fonctions convexes forment un cône stable par max (même par sup, Ex. 2.3.2) et par composition **à gauche** par une convexe croissante. Le geste : partir de l'inégalité connue et la **transporter** opération par opération, en vérifiant à chaque fois que le sens est conservé (R1)."]], "livre": "Identique au corrigé (T2). Le contre-exemple $e^{-x^2}$ et le cas de $\\min$ sont ce qu'il faut garder : ils disent exactement où chaque hypothèse sert.", "reflexes": ["R1", "R14", "R10"], "liens": {"fiche": "2.3.4", "scene": "corde", "guide": "exo-2-3-1"}, "voir": ["E2.3.2", "E3.4.4"]}, {"id": "E2.3.2", "kind": "exo", "num": "Ex. 2.3.2", "label": "Exercice 2.3.2 · niveau 3", "nom": "Une convexe continue est le sup de ses minorantes affines", "enonce": "Un sup de fonctions affines est convexe. Réciproquement, $J$ convexe continue sur $V$ est égale à $\\sup\\{L\\text{ affine continue},\\ L\\le J\\}$.", "chaine": [["but", "Sens direct : chaque $L_i$ vérifie (2.7) avec égalité, et un sup de majorations reste une majoration — c'est l'Ex. 2.3.1 étendu à une famille infinie. Le vrai travail est la réciproque : pour tout $v_0$ et tout $\\lambda_0<J(v_0)$, trouver une affine $L\\le J$ avec $L(v_0)>\\lambda_0$. Alors le sup en $v_0$ dépasse tout $\\lambda_0<J(v_0)$, donc vaut $J(v_0)$ (l'inégalité $\\sup\\le J$ est évidente)."], ["acquis", "Je connais déjà un résultat de ce type : la Proposition §2.3.7 fabrique **une** minorante affine passant par $(v_0,J(v_0))$ en séparant un point de l'épigraphe. Ici je veux une minorante dont la valeur en $v_0$ est proche de $J(v_0)$ : je sépare le point $(\\lambda_0,v_0)$, **juste sous le graphe**, de l'épigraphe."], ["pas", "L'épigraphe $\\Epi(J)=\\{(\\lambda,v):\\lambda\\ge J(v)\\}$ est convexe (Remarque 2.3.3) et **fermé** : si $(\\lambda_n,v_n)\\to(\\lambda,v)$ dans l'épigraphe, $\\lambda=\\lim\\lambda_n\\ge\\lim J(v_n)=J(v)$ par continuité. C'est là que la continuité sert (la s.c.i. suffirait). $(\\lambda_0,v_0)\\notin\\Epi(J)$ puisque $\\lambda_0<J(v_0)$."], ["pas", "Séparation (T11, Th. 8.1.12) dans le Hilbert $\\R\\times V$ : il existe $\\beta\\in\\R$, $\\ell\\in V'$, $\\alpha$ avec $\\beta\\lambda+\\ell(v)>\\alpha>\\beta\\lambda_0+\\ell(v_0)$ pour tout $(\\lambda,v)\\in\\Epi(J)$."], ["question", "L'hyperplan est-il **non vertical** ($\\beta\\ne0$) ? Sinon je n'obtiens pas une fonction de $v$. Je fais $\\lambda\\to+\\infty$ à $v$ fixé dans l'inégalité de gauche : $\\beta\\ge0$. Puis je teste $(\\lambda,v)=(J(v_0),v_0)$ : $\\beta J(v_0)+\\ell(v_0)>\\alpha>\\beta\\lambda_0+\\ell(v_0)$, donc $\\beta(J(v_0)-\\lambda_0)>0$, donc $\\beta>0$. C'est **parce que j'ai pris le point sous le graphe en $v_0$** que je peux conclure $\\beta>0$."], ["pas", "Je divise par $\\beta>0$ avec $\\lambda=J(v)$ : $J(v)>L(v):=\\frac{\\alpha-\\ell(v)}\\beta$ pour tout $v$, affine continue ; et l'inégalité de droite donne $L(v_0)>\\lambda_0$. Gagné."], ["controle", "Sans continuité (ni s.c.i.), l'épigraphe n'est pas fermé et la séparation échoue. En dimension finie, une convexe à valeurs réelles est automatiquement continue. Conséquences : le sens direct dit que la fonction duale (inf d'affines) est concave (§2.6.9) ; la réciproque est le point de départ des sous-gradients (§3.3.21)."], ["bilan", "Pour approcher une convexe par en dessous en un point : **séparer un point placé juste sous le graphe de l'épigraphe fermé**, et vérifier que l'hyperplan n'est pas vertical en testant le point du graphe. C'est la version « fonctions » du Lemme 2.3.14 (T11)."]], "livre": "Le corrigé est cette preuve (T11), avec le soin de préciser « affine continue » en dimension infinie et le produit scalaire sur $\\R\\times V$. À emporter : le test $\\beta>0$, qui est l'étape que l'on oublie toujours.", "reflexes": ["R1", "R11", "R2"], "liens": {"fiche": "2.3.8", "scene": "corde", "guide": "exo-2-3-2"}, "voir": ["2.3.7", "3.3.21"]}, {"id": "E2.3.3", "kind": "exo", "num": "Ex. 2.3.3", "label": "Exercice 2.3.3 · niveau 3", "nom": "Convexité au milieu plus bornitude : les dyadiques, puis le doublement", "enonce": "$J$ localement bornée sur $K$ convexe, avec $J(\\frac{u+v}2)\\le\\frac{J(u)+J(v)}2-\\frac\\alpha8\\norm{u-v}^2$ (2.10). Montrer que $J$ est $\\alpha$-convexe.", "chaine": [["but", "Passer d'une inégalité **au milieu** ($\\theta=\\frac12$) à l'inégalité pour tout $\\theta$ (2.9). Deux obstacles : le terme quadratique, et les $\\theta$ non dyadiques."], ["idee", "Le terme quadratique d'abord. $\\norm{\\frac{u+v}2}^2=\\frac{\\norm u^2+\\norm v^2}2-\\frac{\\norm{u-v}^2}4$ : donc $G=J-\\frac\\alpha2\\norm\\cdot^2$ vérifie exactement $G(\\frac{u+v}2)\\le\\frac{G(u)+G(v)}2$ — le $-\\frac\\alpha8\\norm{u-v}^2$ est **précisément** le défaut de convexité-milieu de $\\frac\\alpha2\\norm\\cdot^2$. Et $J$ est $\\alpha$-convexe ssi $G$ est convexe (Ex. 2.3.4). Je suis ramené à : convexe au milieu + localement bornée ⇒ convexe."], ["pas", "Une variable à la fois (R4) : $g(t)=G(tu+(1-t)v)$ sur $[0,1]$ est convexe au milieu et **majorée** (segment compact, bornitude locale, sous-recouvrement fini). Je retranche l'affine qui coïncide aux bouts : $h(t)=g(t)-tg(1)-(1-t)g(0)$, encore convexe au milieu, majorée par $M$, avec $h(0)=h(1)=0$. But : $h\\le0$."], ["pas", "Dyadiques, par récurrence sur $n$ : $h(k/2^n)\\le0$. Pour $k$ impair, $k/2^{n+1}$ est le milieu de deux dyadiques du rang $n$, donc $h\\le$ moyenne de deux nombres $\\le0$."], ["question", "Et les autres $\\theta$ ? Si $h(\\theta)=\\delta>0$, la convexité au milieu dit : $h(\\theta)\\le\\frac{h(d)+h(\\theta')}2$ pour tout $d$, où $\\theta'=2\\theta-d$ est le symétrique de $d$ par rapport à $\\theta$. Avec $d$ dyadique, $h(d)\\le0$, donc $h(\\theta')\\ge2h(\\theta)=2\\delta$ : **le défaut double** à chaque symétrie. En répétant, $h$ dépasse $M$ — contradiction, à condition de rester dans $[0,1]$."], ["pas", "Rester dans $[0,1]$ : je choisis les dyadiques $d_p$ de plus en plus proches, $|\\theta_p-d_p|\\le r2^{-p-1}$ avec $r=\\min(\\theta,1-\\theta)$, de sorte que $|\\theta_{p+1}-\\theta|\\le\\sum_qr2^{-q-1}<r$. Alors $h(\\theta_p)\\ge2^p\\delta\\to\\infty$, contre $h\\le M$. Donc $h\\le0$, $G$ convexe, $J$ $\\alpha$-convexe."], ["controle", "La bornitude n'est pas un détail : une fonction additive non linéaire (axiome du choix) vérifie l'égalité au milieu sans être convexe. Et l'étape « retirer $\\frac\\alpha2\\norm\\cdot^2$ » est le geste de l'Ex. 2.3.4, qui ramène « fortement convexe » à « convexe »."], ["bilan", "Deux gestes : **retirer la partie quadratique** pour ramener $\\alpha$-convexe à convexe (T3) ; et pour passer d'une propriété au milieu à tous les $\\theta$, **dyadiques par récurrence, puis argument de doublement** contre une borne (R4, R10)."]], "livre": "Le corrigé est cette preuve (T3 puis T2), avec la construction explicite des $\\theta_p$. C'est un exercice de niveau 3 parce que l'argument de doublement ne se devine pas du premier coup ; mais il se retient par son image : un défaut de convexité ne peut pas rester borné s'il double à chaque symétrie.", "reflexes": ["R4", "R10", "R1"], "liens": {"fiche": "2.3.8", "scene": "corde", "guide": "exo-2-3-3"}, "voir": ["E2.3.4", "2.3.5"]}, {"id": "E2.3.4", "kind": "exo", "num": "Ex. 2.3.4", "label": "Exercice 2.3.4 · niveau 1", "nom": "α-convexe = convexe après avoir retiré ½α‖v‖²", "enonce": "$J$ est $\\alpha$-convexe sur $K$ ssi $J-\\frac\\alpha2\\norm\\cdot^2$ est convexe sur $K$.", "chaine": [["but", "Comparer (2.9) pour $J$ et (2.7) pour $G=J-\\frac\\alpha2\\norm\\cdot^2$. Les deux portent sur le même triplet $(u,v,\\theta)$ : il suffit de calculer le **défaut de convexité** $\\Delta_F=\\theta F(u)+(1-\\theta)F(v)-F(w)$ de la fonction $\\norm\\cdot^2$."], ["pas", "Je développe le carré : $\\norm{\\theta u+(1-\\theta)v}^2=\\theta^2\\norm u^2+2\\theta(1-\\theta)\\ps uv+(1-\\theta)^2\\norm v^2$. Avec $\\theta^2=\\theta-\\theta(1-\\theta)$ et $(1-\\theta)^2=(1-\\theta)-\\theta(1-\\theta)$ : $=\\theta\\norm u^2+(1-\\theta)\\norm v^2-\\theta(1-\\theta)\\norm{u-v}^2$. Donc $\\Delta_{\\norm\\cdot^2}=\\theta(1-\\theta)\\norm{u-v}^2$ — c'est l'identité hilbertienne."], ["pas", "$F\\mapsto\\Delta_F$ est linéaire, donc $\\Delta_G=\\Delta_J-\\frac{\\alpha\\theta(1-\\theta)}2\\norm{u-v}^2$. $G$ convexe ⟺ $\\Delta_G\\ge0$ pour tout triplet ⟺ $\\Delta_J\\ge\\frac{\\alpha\\theta(1-\\theta)}2\\norm{u-v}^2$, qui est (2.9). Équivalence triplet par triplet."], ["controle", "Conséquences gratuites : $\\alpha$-convexe ⇒ strictement convexe ($\\Delta_{\\norm\\cdot^2}>0$ si $u\\ne v$) ; et si $J$ est dérivable, $G'=J'-\\alpha\\,\\Id$ et la monotonie (2.21) de $G'$ redonne (2.24)."], ["bilan", "Le défaut de convexité d'une somme est la somme des défauts ; celui de $\\frac12\\norm\\cdot^2$ est exactement $\\frac{\\theta(1-\\theta)}2\\norm{u-v}^2$. Dès lors, toute propriété des fonctions fortement convexes se ramène à une propriété des fonctions convexes (T3, R12)."]], "livre": "Identique au corrigé. L'identité hilbertienne de l'étape 1 est à savoir refaire en dix secondes : elle sert dans les Ex. 2.3.3, 2.3.5, 2.3.6 et dans toutes les preuves de contraction du chapitre 3.", "reflexes": ["R12", "R1"], "liens": {"fiche": "2.3.8", "scene": "corde", "guide": "exo-2-3-4"}, "voir": ["E2.3.3", "E2.3.5"]}, {"id": "E2.3.5", "kind": "exo", "num": "Ex. 2.3.5", "label": "Exercice 2.3.5 · niveau 2", "nom": "Convexité d'une quadratique : le défaut se calcule exactement", "enonce": "$J(x)=\\frac12Ax\\cdot x-b\\cdot x$, $A$ symétrique. $J$ convexe ⟺ $A\\ge0$ ; strictement convexe ⟺ $A>0$ ; dans ce cas $J$ est $\\alpha$-convexe et la meilleure constante est $\\lambda_{\\min}(A)$.", "chaine": [["but", "Trois équivalences sur la même fonction : je ne vais pas les traiter séparément mais calculer **une fois** le défaut de convexité, comme dans l'Ex. 2.3.4, et tout lire dessus."], ["pas", "La partie linéaire $-b\\cdot x$ a un défaut nul. Pour $Ax\\cdot x$, même calcul que l'identité hilbertienne avec $A$ symétrique à la place du produit scalaire : $\\theta J(x)+(1-\\theta)J(y)-J(\\theta x+(1-\\theta)y)=\\frac{\\theta(1-\\theta)}2A(x-y)\\cdot(x-y)$ $(\\ast)$."], ["pas", "Lecture. $A\\ge0$ ⇒ membre de droite $\\ge0$ ⇒ convexe. Réciproque : $x=z$, $y=0$, $\\theta=\\frac12$ dans $(\\ast)$ donne $\\frac18Az\\cdot z\\ge0$. Stricte : $A>0$ ⇒ inégalité stricte pour $x\\ne y$, $\\theta\\in]0,1[$ ; réciproque par le même test. Forte : (2.9) ⟺ $\\frac{\\theta(1-\\theta)}2Az\\cdot z\\ge\\frac{\\alpha\\theta(1-\\theta)}2\\norm z^2$ ⟺ $Az\\cdot z\\ge\\alpha\\norm z^2$."], ["pas", "Meilleure constante : base orthonormée propre, $Az\\cdot z=\\sum\\lambda_iz_i^2\\ge\\lambda_1\\norm z^2$, égalité pour $z=e_1$. Donc $\\alpha_{\\max}=\\lambda_1=\\min_{z\\ne0}\\frac{Az\\cdot z}{\\norm z^2}$ (quotient de Rayleigh)."], ["controle", "Pourquoi pas plus (R10) ? Pour une quadratique en dimension finie, stricte = forte. Faux en général : $x^4$ strictement convexe, pas fortement convexe en $0$ (il faudrait $t^4\\ge\\frac\\alpha2t^2$ près de $0$). Faux en dimension infinie même pour une quadratique (Ex. 2.3.6 : $a(e_n,e_n)=1/n\\to0$)."], ["bilan", "Pour une quadratique, **tout se lit sur $(\\ast)$** : le signe de la forme $z\\mapsto Az\\cdot z$ donne la convexité, sa stricte positivité la stricte convexité, sa minoration $\\lambda_{\\min}$ la forte convexité. Le test minimal : $x=z$, $y=0$, $\\theta=\\frac12$ (R3)."]], "livre": "Identique au corrigé (T3). À retenir : l'identité $(\\ast)$ et le contre-exemple $x^4$, qui sépare « strictement » de « fortement ».", "reflexes": ["R12", "R3", "R10"], "liens": {"fiche": "2.3.8", "scene": "corde", "guide": "exo-2-3-5"}, "voir": ["E2.3.4", "E2.3.6", "E2.4.3"]}, {"id": "E2.3.6", "kind": "exo", "num": "Ex. 2.3.6", "label": "Exercice 2.3.6 · niveau 1", "nom": "La même identité sur un Hilbert : positive ⇒ convexe, coercive ⇒ fortement convexe", "enonce": "$J(v)=\\frac12a(v,v)-L(v)$ avec $a$ bilinéaire symétrique continue, $L$ linéaire continue. $a$ positive ⇒ $J$ convexe ; $a$ coercive ($a(v,v)\\ge C\\norm v^2$) ⇒ $J$ est $C$-convexe.", "chaine": [["but", "C'est l'Ex. 2.3.5 où $Ax\\cdot y$ devient $a(x,y)$. Je refais le calcul en ne me servant que de ce qui est disponible : **bilinéarité et symétrie**."], ["pas", "$\\theta J(u)+(1-\\theta)J(v)-J(\\theta u+(1-\\theta)v)=\\frac{\\theta(1-\\theta)}2a(u-v,u-v)$ $(\\ast)$ : la partie linéaire disparaît, le développement de $a(w,w)$ utilise la symétrie pour regrouper les termes croisés."], ["pas", "$a$ positive ⇒ $(\\ast)\\ge0$ ⇒ (2.7). $a$ coercive ⇒ $(\\ast)\\ge\\frac{C\\theta(1-\\theta)}2\\norm{u-v}^2$ ⇒ (2.9) avec $\\alpha=C$."], ["controle", "Réciproques par $v=0$, $\\theta=\\frac12$ ; meilleure constante $\\inf_{\\norm w=1}a(w,w)$. La continuité de $a$ et $L$ n'a pas servi : elle donne la continuité de $J$, nécessaire pour appliquer le Théorème §2.3.8 (existence/unicité sur un convexe fermé, Ex. 2.5.5). Dimension infinie : $a(x,x)>0$ pour $x\\ne0$ ne donne **pas** la forte convexité, cf. $a(x,y)=\\sum x_iy_i/i$ sur $\\ell^2$ : $a(e_n,e_n)=1/n\\to0$ (sphère unité non compacte)."], ["bilan", "Même geste qu'en dimension finie ; la nouveauté est la distinction **définie positive ≠ coercive** en dimension infinie, qui vient de la non-compacité de la sphère (R3, R10)."]], "livre": "Identique au corrigé. Ce qu'il faut emporter est la remarque finale sur $\\ell^2$ : en dimension infinie, c'est la coercivité, pas la positivité stricte, qui donne existence et unicité.", "reflexes": ["R12", "R10"], "liens": {"fiche": "2.3.8", "scene": "existence", "guide": "exo-2-3-6"}, "voir": ["E2.3.5", "E2.5.5", "2.3.8"]}, {"id": "E2.4.1", "kind": "exo", "num": "Ex. 2.4.1", "label": "Exercice 2.4.1 · niveau 2", "nom": "Encadré entre deux développements d'ordre 1, donc dérivable", "enonce": "(2.15) implique la continuité de $J$ en $u$. Si $L_1,L_2\\in V'$ vérifient $J(u+w)\\ge J(u)+L_1(w)+o(w)$ et $J(u+w)\\le J(u)+L_2(w)+o(w)$ (2.17), alors $J$ est dérivable en $u$ et $L_1=L_2=J'(u)$.", "chaine": [["but", "Continuité : $J(u+w)-J(u)=L(w)+o(w)$, et les deux morceaux tendent vers $0$ ($|L(w)|\\le\\norm L\\norm w$ ; $|o(w)|=\\norm w\\cdot o(w)/\\norm w$). Fait. Le cœur est (2.17) : deux formes linéaires qui encadrent **à un $o(w)$ près** doivent être égales."], ["question", "Comment comparer deux formes linéaires à partir d'une inégalité vraie seulement « à un $o(w)$ près » ? En soustrayant : $(L_1-L_2)(w)\\le o_2(w)-o_1(w)$. Le membre de gauche est **homogène de degré 1**, le membre de droite est $o(\\norm w)$ : sur un rayon $w=th$, le premier est $t(L_1-L_2)(h)$ et le second $o(t)$."], ["pas", "Je divise par $t>0$ et je fais $t\\to0^+$ : $(L_1-L_2)(h)\\le0$ pour tout $h$. Puis $h\\to-h$ : $\\ge0$. Donc $L_1=L_2=:L$."], ["pas", "Dérivabilité : $(\\ast)$ devient $o_1(w)\\le J(u+w)-J(u)-L(w)\\le o_2(w)$, donc le reste est majoré en valeur absolue par $\\max(|o_1|,|o_2|)=o(w)$. C'est (2.15) : $J'(u)=L$."], ["controle", "Réciproque fausse pour la continuité ($|x|$). Usage typique de (2.17) : minoration affine par convexité (2.20) + majoration quadratique (Lemme §2.4.10) ⇒ dérivabilité. Avec deux égalités, c'est l'unicité de la dérivée."], ["bilan", "**Tester une inégalité sur un rayon $w=th$, diviser par $t$, faire $t\\to0^+$, changer $h$ en $-h$** : c'est le geste qui transforme une inégalité « à $o(w)$ près » en une égalité de formes linéaires (T4, R4)."]], "livre": "Identique au corrigé (T4). Ce rayon $w=th$ est le même geste que dans la preuve du Théorème 2.5.1 (dériver le long d'une direction admissible) : un $o$ ne survit pas à une division par $t$.", "reflexes": ["R4", "R12"], "liens": {"fiche": "2.4.4", "scene": "sandwich", "guide": "exo-2-4-1"}, "voir": ["2.4.10", "2.5.1"]}, {"id": "E2.4.2", "kind": "exo", "num": "Ex. 2.4.2", "label": "Exercice 2.4.2 · niveau 1", "nom": "Dériver une quadratique : la définition de Fréchet mot pour mot", "enonce": "$J(u)=\\frac12a(u,u)-L(u)$, $a$ bilinéaire symétrique continue, $L$ linéaire continue. $J$ est dérivable et $\\ps{J'(u)}w=a(u,w)-L(w)$.", "chaine": [["but", "La Définition 2.4.1 demande : $J(u+w)=J(u)+\\ell_u(w)+o(w)$ avec $\\ell_u$ linéaire **continue**. Programme : développer, isoler ce qui est linéaire en $w$, vérifier continuité et reste."], ["pas", "Bilinéarité puis symétrie : $J(u+w)=J(u)+[a(u,w)-L(w)]+\\frac12a(w,w)$. Développement **exact**, pas de $o$ caché."], ["pas", "$\\ell_u=a(u,\\cdot)-L$ est linéaire ; continue car $|\\ell_u(w)|\\le(M\\norm u+\\norm L)\\norm w$ ($M$ constante de continuité de $a$). Le reste $\\frac12a(w,w)$ vérifie $|\\cdot|\\le\\frac M2\\norm w^2=o(\\norm w)$. Définition satisfaite."], ["controle", "Sans symétrie, la partie linéaire serait $\\frac12(a(u,w)+a(w,u))-L(w)$. Avec Riesz, $J'(u)=Au-f$. Et l'équation d'Euler $J'(u)=0$ s'écrit $a(u,w)=L(w)$ pour tout $w$ : une formulation variationnelle."], ["bilan", "Pour une quadratique, le développement est exact : $J(u+w)=J(u)+\\ps{J'(u)}w+\\frac12a(w,w)$. Cette ligne contient la dérivée, la dérivée seconde (Ex. 2.4.6) et la convexité (Ex. 2.3.6) (T4)."]], "livre": "Identique au corrigé. L'unique point à ne pas oublier : la continuité de $\\ell_u$, qui est ce qui distingue $V'$ du dual algébrique en dimension infinie.", "reflexes": ["R1"], "liens": {"fiche": "2.4.4", "guide": "exo-2-4-2"}, "voir": ["E2.4.3", "E2.4.6", "E2.5.5"]}, {"id": "E2.4.3", "kind": "exo", "num": "Ex. 2.4.3", "label": "Exercice 2.4.3 · niveau 1", "nom": "Le gradient d'une quadratique matricielle est Ax − b (si A est symétrique)", "enonce": "$J(x)=\\frac12Ax\\cdot x-b\\cdot x$, $A$ symétrique $N\\times N$. $J$ dérivable et $J'(x)=Ax-b$.", "chaine": [["but", "C'est l'Ex. 2.4.2 avec $a(x,y)=Ax\\cdot y$ et $L=b\\cdot$ ; il reste à **identifier** la forme linéaire à un vecteur via le produit scalaire euclidien."], ["pas", "$a$ bilinéaire, symétrique ($Ay\\cdot x=y\\cdot A^Tx=y\\cdot Ax$), continue ($|Ax\\cdot y|\\le\\norm A\\norm x\\norm y$). Donc $\\ps{J'(x)}w=Ax\\cdot w-b\\cdot w=(Ax-b)\\cdot w$, et le vecteur qui représente cette forme est $Ax-b$. Vérification directe : $J(x+w)=J(x)+(Ax-b)\\cdot w+\\frac12Aw\\cdot w$."], ["controle", "Si $A$ n'est pas symétrique : $Ax\\cdot x=\\frac12(A+A^T)x\\cdot x$, donc $J'(x)=\\frac12(A+A^T)x-b$. Ex. : $A=\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$, $J=\\frac12x_1x_2$, gradient $\\frac12(x_2,x_1)\\ne Ax$."], ["bilan", "$\\nabla(\\frac12Ax\\cdot x-b\\cdot x)=Ax-b$ pour $A$ symétrique ; avec $A>0$, minimiser $J$ ⟺ résoudre $Ax=b$ : c'est l'origine des méthodes de gradient pour les systèmes linéaires (R1)."]], "livre": "Identique. Le piège de la symétrie est la seule chose à retenir ici.", "reflexes": ["R1"], "liens": {"fiche": "2.4.4", "scene": "pasfixe", "guide": "exo-2-4-3"}, "voir": ["E2.4.2", "E2.3.5", "E3.2.5"]}, {"id": "E2.4.4", "kind": "exo", "num": "Ex. 2.4.4", "label": "Exercice 2.4.4 · niveau 1", "nom": "Le gradient dépend du produit scalaire : u − f dans L²", "enonce": "$V=L^2(\\Omega)$, $a(u,v)=\\int uv$, $L(u)=\\int fu$. En identifiant $V$ et $V'$, $J'(u)=u-f$.", "chaine": [["but", "Deux temps : la forme linéaire (Ex. 2.4.2), puis sa **lecture** à travers le produit scalaire de $L^2$ (Riesz)."], ["pas", "$a$ est le produit scalaire de $L^2$ : bilinéaire, symétrique, continue (Cauchy–Schwarz) ; $L$ continue car $f\\in L^2$. Donc $\\ps{J'(u)}w=\\int uw-\\int fw=\\int(u-f)w=\\ps{u-f}w_{L^2}$. Comme $u-f\\in L^2$, Riesz identifie $J'(u)=u-f$."], ["controle", "Vérification : $J(u)=\\frac12\\norm{u-f}^2-\\frac12\\norm f^2$, minimale en $u=f$, où $J'=0$. Avec le produit scalaire pondéré $\\int\\rho uv$, la **même** forme linéaire est représentée par $(u-f)/\\rho$ : le gradient change avec le produit scalaire — c'est l'idée du préconditionnement (Remarque 3.2.4)."], ["bilan", "Calculer d'abord la forme linéaire, puis la représenter : le gradient est un objet relatif au produit scalaire choisi (R1)."]], "livre": "Identique au corrigé ; la remarque sur le préconditionnement est ce qu'il faut garder.", "reflexes": ["R1"], "liens": {"fiche": "2.4.4", "guide": "exo-2-4-4"}, "voir": ["E2.4.2", "E2.5.4"]}, {"id": "E2.4.5", "kind": "exo", "num": "Ex. 2.4.5", "label": "Exercice 2.4.5 · niveau 2", "nom": "Protéger une inégalité stricte : passer par le milieu", "enonce": "$J$ dérivable sur $V$. $J$ strictement convexe ⟺ $J(v)>J(u)+\\ps{J'(u)}{v-u}$ pour $u\\ne v$ ⟺ $\\ps{J'(u)-J'(v)}{u-v}>0$ pour $u\\ne v$.", "chaine": [["but", "La version large est la Proposition §2.4.4 : (C) ⟺ (T) ⟺ (M). Je veux la version stricte. Danger connu : **un passage à la limite transforme une inégalité stricte en inégalité large**. Je dois repérer dans la preuve large où l'on passe à la limite, et contourner."], ["essai", "(C) ⇒ (T) comme dans §2.4.4 : $\\frac{J(u+\\theta(v-u))-J(u)}\\theta\\le J(v)-J(u)$ puis $\\theta\\to0$. L'inégalité stricte de convexité devient large à la limite. Impasse pour le strict."], ["idee", "Ne pas passer à la limite : utiliser l'inégalité **large** (2.20), déjà connue, entre $u$ et un point intermédiaire $m=\\frac{u+v}2$, et réserver la **stricte** convexité à l'autre moitié. $J(m)\\ge J(u)+\\frac12\\ps{J'(u)}{v-u}$ (large, (2.20)) et $J(m)<\\frac12J(u)+\\frac12J(v)$ (stricte, $\\theta=\\frac12$). Enchaîné : $J(v)>J(u)+\\ps{J'(u)}{v-u}$."], ["pas", "(T) ⇒ (C) : (T) en $w=\\theta u+(1-\\theta)v$ vers $u$ et vers $v$ ($w\\ne u,v$), combinaison à poids $\\theta,1-\\theta$ : les termes en $J'(w)$ s'annulent ($\\theta(u-w)+(1-\\theta)(v-w)=0$), il reste $\\theta J(u)+(1-\\theta)J(v)>J(w)$."], ["pas", "(T) ⇒ (M) : (T) pour $(u,v)$ et pour $(v,u)$, additionnées : $0>-\\ps{J'(u)-J'(v)}{u-v}$. (M) ⇒ (T) : une variable, $\\varphi(t)=J(u+t(v-u))$, $\\varphi'(t)=\\ps{J'(x_t)}{v-u}$ ; accroissements finis, $J(v)-J(u)=\\varphi'(\\xi)$, et (M) entre $x_\\xi$ et $u$ donne $\\varphi'(\\xi)>\\varphi'(0)$."], ["controle", "Pas d'analogue strict de (2.28) : $x^4$ est strictement convexe ($4x^3$ strictement croissante) avec $J''(0)=0$."], ["bilan", "Pour conserver une inégalité stricte, **ne jamais passer à la limite** : passer par un point intermédiaire et n'utiliser la stricte qu'une fois, à distance finie (R3, R4). Et pour (M) ⇒ (T), se ramener à une variable et aux accroissements finis."]], "livre": "Identique au corrigé (T3 milieu, T2 segment). L'« essai » raté est la vraie leçon : le réflexe « $\\theta\\to0$ » de la Proposition 2.4.4 est exactement ce qu'il faut éviter.", "reflexes": ["R3", "R4", "R12"], "liens": {"fiche": "2.4.4", "scene": "monotone", "guide": "exo-2-4-5"}, "voir": ["2.4.4", "E2.4.7"]}, {"id": "E2.4.6", "kind": "exo", "num": "Ex. 2.4.6", "label": "Exercice 2.4.6 · niveau 1", "nom": "Dérivée seconde d'une quadratique : l'application u ↦ J′(u) est affine", "enonce": "$J(u)=\\frac12a(u,u)-L(u)$ est deux fois dérivable et $J''(u)(v,w)=a(v,w)$. Appliquer aux Ex. 2.4.3 et 2.4.4.", "chaine": [["but", "$J''(u)$ est la dérivée en $u$ de l'application $u\\mapsto J'(u)\\in V'$ (Définition 2.4.7). Je connais $J'(u)=a(u,\\cdot)-L$ (Ex. 2.4.2) : cette application est **affine** en $u$, et la dérivée d'une application affine est sa partie linéaire, avec un reste **nul**."], ["pas", "$J'(u+v)-J'(u)=a(u+v,\\cdot)-a(u,\\cdot)=a(v,\\cdot)=:Av$, avec $A:V\\to V'$ linéaire continue ($\\norm{Av}_{V'}\\le M\\norm v$). Donc $J''(u)=A$ pour tout $u$ : $J''(u)(v,w)=a(v,w)$, indépendant de $u$ ; Taylor (2.27) est exact."], ["pas", "Ex. 2.4.3 : $J''(x)(v,w)=Av\\cdot w$, Hessienne constante $A$. Ex. 2.4.4 : $J''(u)(v,w)=\\int vw$, soit $J''=\\Id$ après identification."], ["bilan", "Dérivée seconde = dérivée de la dérivée ; pour une quadratique, la dérivée est affine et la seconde est constante. Combiné à l'Ex. 2.4.7, cela redonne les Ex. 2.3.5 et 2.3.6 (convexe ⟺ $a\\ge0$) (T5)."]], "livre": "Identique.", "reflexes": ["R1"], "liens": {"fiche": "2.4.4", "scene": "ordre2", "guide": "exo-2-4-6"}, "voir": ["E2.4.2", "E2.4.7"]}, {"id": "E2.4.7", "kind": "exo", "num": "Ex. 2.4.7", "label": "Exercice 2.4.7 · niveau 2", "nom": "Convexité et Hessienne : de J′ à J″ comme de J à J′", "enonce": "$J$ deux fois dérivable. $J$ convexe ⟺ $J''(u)(w,w)\\ge0$ ; $J$ $\\alpha$-convexe ⟺ $J''(u)(w,w)\\ge\\alpha\\norm w^2$ (2.28).", "chaine": [["but", "Par les Propositions §2.4.4, convexe ⟺ (2.21) et $\\alpha$-convexe ⟺ (2.24), et (2.21) est (2.24) avec $\\alpha=0$. Je traite donc d'un coup : (2.24) ⟺ (2.28), pour $\\alpha\\ge0$. Même structure que le passage de $J$ à $J'$ : **dériver** dans un sens, **intégrer (accroissements finis)** dans l'autre."], ["pas", "(2.24) ⇒ (2.28) : $v=u+tw$, $t>0$ : $\\ps{J'(u+tw)-J'(u)}{tw}\\ge\\alpha t^2\\norm w^2$. Définition de $J''$ : $J'(u+tw)=J'(u)+tJ''(u)w+r(t)$, $\\norm{r(t)}=o(t)$. Donc $t^2J''(u)(w,w)+o(t^2)\\ge\\alpha t^2\\norm w^2$ ; je divise par $t^2$, $t\\to0^+$."], ["pas", "(2.28) ⇒ (2.24) : une variable, $\\psi(t)=\\ps{J'(v+th)}h$ avec $h=u-v$ ; $\\psi'(t)=J''(v+th)(h,h)\\ge\\alpha\\norm h^2$. Accroissements finis : $\\ps{J'(u)-J'(v)}{u-v}=\\psi(1)-\\psi(0)=\\psi'(\\xi)\\ge\\alpha\\norm{u-v}^2$."], ["controle", "Variante du sens direct via Taylor (Lemme §2.4.8) sur (2.23). Dimension finie : convexe ⟺ Hessienne semi-définie positive partout ; $\\alpha$-convexe ⟺ $\\lambda_{\\min}(J'')\\ge\\alpha$ partout. Stricte : $J''(w,w)>0$ suffit (puis Ex. 2.4.5) mais n'est pas nécessaire ($x^4$)."], ["bilan", "Passer d'un ordre de dérivation au suivant : **dériver une inégalité le long d'un rayon** (division par $t^2$, limite) dans un sens, **accroissements finis sur une fonction d'une variable** dans l'autre (T5, T12, R4)."]], "livre": "Identique au corrigé. Noter que le passage par (2.24) plutôt que par la définition (2.9) économise un ordre de dérivation : c'est le bon point d'entrée.", "reflexes": ["R4", "R12"], "liens": {"fiche": "2.4.4", "scene": "ordre2", "guide": "exo-2-4-7"}, "voir": ["2.4.4", "E2.4.5", "E2.4.8"]}, {"id": "E2.4.8", "kind": "exo", "num": "Ex. 2.4.8", "label": "Exercice 2.4.8 · niveau 2", "nom": "Hessienne bornée ⇒ gradient lipschitzien : intégrer, après avoir polarisé", "enonce": "$J\\in C^2$ avec $J''(u)(w,w)\\le L\\norm w^2$. Montrer que $J'$ est $L$-lipschitzienne.", "chaine": [["but", "Je veux $\\norm{J'(v)-J'(u)}_{V'}\\le L\\norm{v-u}$, i.e. $|\\ps{J'(v)-J'(u)}w|\\le L\\norm{v-u}\\norm w$. Une différence de $J'$ entre deux points : je l'écris comme l'**intégrale de $J''$ sur le segment** (T12)."], ["controle", "Avant de foncer, je teste l'énoncé sur un cas minuscule (R3) : $J=-x^4$ sur $\\R$. $J''=-12x^2\\le L$ pour tout $L>0$, mais $J'=-4x^3$ n'est pas lipschitzienne. **L'énoncé est faux avec une borne d'un seul côté** : il faut $|J''(u)(w,w)|\\le L\\norm w^2$ — automatique si $J$ est convexe ($J''\\ge0$, Ex. 2.4.7), qui est le cadre où le résultat sert."], ["pas", "Intégration : $\\psi(t)=\\ps{J'(u+th)}w$, $h=v-u$, $\\psi'(t)=J''(u+th)(h,w)$ continue. $\\ps{J'(v)-J'(u)}w=\\int_0^1J''(u+th)(h,w)\\,dt$. Il me faut une borne sur la forme **bilinéaire** $J''(z)(h,w)$, alors que l'hypothèse porte sur la forme **quadratique** $J''(z)(w,w)$."], ["idee", "Polarisation : $4b(h,w)=b(h+w,h+w)-b(h-w,h-w)\\le L(\\norm{h+w}^2+\\norm{h-w}^2)=2L(\\norm h^2+\\norm w^2)$ (parallélogramme). Pour $\\norm h=\\norm w=1$ : $b(h,w)\\le L$ ; homogénéité : $|b(h,w)|\\le L\\norm h\\norm w$. (Si $b\\ge0$, Cauchy–Schwarz $|b(h,w)|\\le b(h,h)^{1/2}b(w,w)^{1/2}$ fait le travail directement.)"], ["pas", "Donc $|\\ps{J'(v)-J'(u)}w|\\le L\\norm{v-u}\\norm w$, et le sup sur $\\norm w\\le1$ donne la constante de Lipschitz $L$."], ["bilan", "Trois gestes : **tester l'énoncé sur un cas minuscule** avant de le prouver (il était incomplet) ; **intégrer $J''$ le long du segment** ; **polariser** pour passer d'une forme quadratique à une forme bilinéaire. Réciproque pour $J$ convexe : $J'$ $L$-lipschitzienne ⟺ $0\\le J''\\le L$ ; pour une quadratique, $L=\\lambda_{\\max}$ (T12, T13)."]], "livre": "Le corrigé commence par le contre-exemple $-x^4$ et corrige l'hypothèse : c'est l'exemple même du réflexe R10 (« pourquoi pas plus ? ») appliqué à un énoncé. Puis T12 et la polarisation.", "reflexes": ["R3", "R10", "R12"], "liens": {"fiche": "2.4.10", "scene": "sandwich", "guide": "exo-2-4-8"}, "voir": ["2.4.10", "E2.4.7"]}, {"id": "E2.5.1", "kind": "exo", "num": "Ex. 2.5.1", "label": "Exercice 2.5.1 · niveau 1", "nom": "Projection : minimiser le carré, et Euler devient (8.1)", "enonce": "$K$ convexe fermé non vide, $x\\in V$, $x_K$ la projection ($\\norm{x-x_K}=\\min_K\\norm{x-y}$). Montrer que l'inéquation d'Euler (2.29) se ramène exactement à (8.1) : $\\ps{x-x_K}{y-x_K}\\le0$ pour tout $y\\in K$.", "chaine": [["but", "Appliquer le Théorème §2.5.1 au problème de projection. Il me faut une fonction **dérivable** : la norme ne l'est pas en $y=x$. Je minimise plutôt $J(y)=\\frac12\\norm{x-y}^2$ — mêmes minimiseurs ($t\\mapsto t^2/2$ croissante), dérivable partout."], ["pas", "Dérivée : $J(y+w)=J(y)+\\ps{y-x}w+\\frac12\\norm w^2$, donc $J'(y)=y-x$ (Riesz). La même identité avec $w=v-y$ est (2.23) avec $\\alpha=1$ : $J$ est $1$-convexe — le Théorème §2.3.8 donne au passage existence et unicité de $x_K$."], ["pas", "Euler (nécessaire, et suffisante par convexité) : $\\ps{J'(x_K)}{y-x_K}=\\ps{x_K-x}{y-x_K}\\ge0$ pour tout $y\\in K$ ; je change le signe : $\\ps{x-x_K}{y-x_K}\\le0$. C'est (8.1), mot pour mot."], ["controle", "Vérification directe (Pythagore) : $\\norm{x-y}^2=\\norm{x-x_K}^2-2\\ps{x-x_K}{y-x_K}+\\norm{y-x_K}^2\\ge\\norm{x-x_K}^2+\\norm{y-x_K}^2$ sous (8.1) : minimalité et unicité en une ligne. Géométrie : l'angle entre $x-x_K$ et toute direction rentrante est obtus."], ["bilan", "**Dès qu'une norme apparaît dans un critère, minimiser son carré.** Et (8.1) relue avec $x=u-\\mu J'(u)$ donne $u=P_K(u-\\mu J'(u))$ : la base du gradient projeté (§3.4.1) (T4, R1)."]], "livre": "Identique au corrigé. L'étape « Pythagore généralisé » est la preuve la plus courte de l'existence-unicité de la projection : à connaître.", "reflexes": ["R1", "R12"], "liens": {"fiche": "2.5.1", "scene": "projete", "guide": "exo-2-5-1"}, "voir": ["2.5.1", "3.4.1"]}, {"id": "E2.5.2", "kind": "exo", "num": "Ex. 2.5.2", "label": "Exercice 2.5.2 · niveau 2", "nom": "Moindres carrés : constante sur Ker A, coercive sur l'orthogonal", "enonce": "$\\min_{x\\in\\R^n}\\norm{Ax-b}^2$, $A$ matrice $p\\times n$. Existence d'une solution, équation d'Euler, unicité ssi $\\Ker A=\\{0\\}$.", "chaine": [["but", "Existence sur $\\R^n$ entier. Le Théorème §2.2.1 veut « infinie à l'infini » : faux ici si $\\Ker A\\ne\\{0\\}$, car $J(tz)=\\norm b^2$ pour $z\\in\\Ker A$. Je dois **contourner** : $J$ est constante le long de $\\Ker A$, donc je peux l'oublier et minimiser sur l'orthogonal, où elle redevient coercive."], ["pas", "Dérivée et convexité : $J(x+h)=J(x)+2A^*(Ax-b)\\cdot h+\\norm{Ah}^2$, donc $J'(x)=2A^*(Ax-b)$ et $J(x+h)\\ge J(x)+J'(x)\\cdot h$ : convexe (2.20). Euler ($K=\\R^n$) : $A^*Ax=A^*b$, les **équations normales**, nécessaires et suffisantes."], ["pas", "Existence : $x=z+y$, $z\\in N=\\Ker A$, $y\\in N^\\perp$, $J(x)=J(y)$. Sur $N^\\perp$, $A$ est injective, donc $\\norm{Ay}\\ge c\\norm y$ avec $c=\\min_{\\text{sphère de }N^\\perp}\\norm{Ay}>0$ (compacité). Alors $\\sqrt{J(y)}\\ge c\\norm y-\\norm b\\to\\infty$ : §2.2.1 sur le fermé $N^\\perp$ donne $y^*$, qui minimise $J$ sur tout $\\R^n$ puisque $J(z+y)=J(y)\\ge J(y^*)$."], ["pas", "Unicité : l'ensemble des solutions est $y^*+\\Ker(A^*A)$. Et $\\Ker(A^*A)=\\Ker A$ : si $A^*Ax=0$ alors $0=A^*Ax\\cdot x=\\norm{Ax}^2$. Unique ssi $\\Ker A=\\{0\\}$, et alors $x=(A^*A)^{-1}A^*b$."], ["controle", "Autre existence, algébrique : $\\Im(A^*A)=\\Ker(A^*A)^\\perp=(\\Ker A)^\\perp=\\Im A^*\\ni A^*b$, donc les équations normales ont une solution, minimum par convexité."], ["bilan", "Quand $J$ n'est pas coercive, **repérer les directions où elle est constante et minimiser sur leur orthogonal** ; le défaut de coercivité est exactement le défaut d'unicité, pas d'existence (R14, T1)."]], "livre": "Identique au corrigé (T1, T4). Le calcul $\\Ker(A^*A)=\\Ker A$ par $\\norm{Ax}^2=A^*Ax\\cdot x$ est un classique à connaître.", "reflexes": ["R14", "R1", "R12"], "liens": {"fiche": "2.5.1", "scene": "euler", "guide": "exo-2-5-2"}, "voir": ["E2.5.3", "2.2.1"]}, {"id": "E2.5.3", "kind": "exo", "num": "Ex. 2.5.3", "label": "Exercice 2.5.3 · niveau 2", "nom": "Quadratique sur un noyau : éliminer N = Ker A ∩ Ker B, puis lire le multiplicateur", "enonce": "$\\inf_{x\\in\\Ker B}\\frac12Ax\\cdot x-b\\cdot x$, $A$ symétrique. Solution si $A\\ge0$ et $b\\perp(\\Ker A\\cap\\Ker B)$ ; unique si $A>0$ ; tout minimum vérifie $A\\bar x-b=B^*p$.", "chaine": [["but", "Même situation que l'Ex. 2.5.2 : $J$ n'est pas coercive sur $W=\\Ker B$ si $A$ est seulement positive. Je cherche les directions où $J$ est constante sur $W$ : $N=\\Ker A\\cap\\Ker B$. Puis la condition d'optimalité sur un sous-espace, qui doit produire le $B^*p$."], ["pas", "$J$ ne voit pas $N$ : $x=z+y$, $z\\in N$, $y\\in W'=W\\cap N^\\perp$ ; $Az=0$ et symétrie donnent $A(z+y)\\cdot(z+y)=Ay\\cdot y$ ; $b\\cdot z=0$ par hypothèse. Donc $J(x)=J(y)$. (L'hypothèse sur $b$ est nécessaire : sinon $J(tz)=-tb\\cdot z\\to-\\infty$.)"], ["pas", "Coercivité sur $W'$ : pour $A\\ge0$ symétrique, $Ay\\cdot y=0\\Rightarrow Ay=0$ (développer $A(y+th)\\cdot(y+th)\\ge0$ et faire $t\\to0^\\pm$). Donc sur $W'$, $Ay\\cdot y>0$ pour $y\\ne0$, et par compacité de la sphère, $Ay\\cdot y\\ge\\alpha\\norm y^2$. §2.2.1 sur $W'$ fournit $y^*$, minimum sur tout $W$."], ["pas", "Unicité si $A>0$ : $J$ strictement convexe (Ex. 2.3.5) sur le convexe $W$ (Prop. §2.3.4)."], ["idee", "Multiplicateur. Euler sur $W$ convexe : $(A\\bar x-b)\\cdot(y-\\bar x)\\ge0$ pour $y\\in W$. $W$ est un **sous-espace** : je prends $y=\\bar x\\pm w$, et l'inégalité devient une égalité, $A\\bar x-b\\perp W=\\Ker B$. Reste à identifier $(\\Ker B)^\\perp$ : de $Bx\\cdot q=x\\cdot B^*q$, $\\Ker B=(\\Im B^*)^\\perp$, donc en dimension finie $(\\Ker B)^\\perp=\\Im B^*$. D'où $A\\bar x-b=B^*p$."], ["controle", "L'étape multiplicateur n'utilise ni $A\\ge0$ ni le rang de $B$ : contraintes affines, pas de qualification nécessaire (Ex. 2.5.7). $p$ unique ssi $\\Ker B^*=\\{0\\}$ (rang $m$). Pour $A\\ge0$, les conditions $\\bar x\\in\\Ker B$, $A\\bar x-b\\in\\Im B^*$ sont aussi suffisantes."], ["bilan", "Sur un sous-espace, **Euler devient une égalité** (tester $\\pm w$), et « orthogonal à $\\Ker B$ » se traduit par « dans $\\Im B^*$ » : c'est la naissance du multiplicateur, avant tout théorème (T6, R13)."]], "livre": "Identique au corrigé (T1 puis T6). Le lemme « $A\\ge0$ symétrique et $Ay\\cdot y=0\\Rightarrow Ay=0$ » et l'identité $(\\Ker B)^\\perp=\\Im B^*$ sont les deux outils à garder.", "reflexes": ["R14", "R13", "R12"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "exo-2-5-3"}, "voir": ["E2.5.2", "E2.5.7", "E2.5.10"]}, {"id": "E2.5.4", "kind": "exo", "num": "Ex. 2.5.4", "label": "Exercice 2.5.4 · niveau 2", "nom": "Dirichlet en 1D : Euler sur un espace vectoriel, puis une bosse", "enonce": "$J(u)=\\frac12\\int_0^L\\mu|u'|^2-\\int_0^Lfu$ sur $K=\\{u\\in C^1[0,L],\\ u(0)=u(L)=0\\}$. $K$ convexe, dérivée directionnelle, condition nécessaire $-\\mu u_*''=f$ avec $u_*(0)=u_*(L)=0$, formule et unicité.", "chaine": [["but", "Un problème de calcul des variations traité avec les outils du chapitre. $K$ est un sous-espace vectoriel (conditions linéaires homogènes) : donc $u_*+tw\\in K$ pour tout $t\\in\\R$, et la condition du premier ordre sera une **égalité** $J'(u_*)(w)=0$, pas une inéquation."], ["pas", "Dérivée directionnelle : je développe $|u'+tw'|^2$ : $J(u+tw)=J(u)+t\\big(\\int\\mu u'w'-\\int fw\\big)+\\frac{t^2}2\\int\\mu|w'|^2$, trinôme en $t$. Donc $J'(u)(w)=\\int\\mu u'w'-\\int fw$."], ["pas", "Minimum en $t=0$ du trinôme $t\\mapsto J(u_*+tw)$ : $J'(u_*)(w)=0$ pour tout $w\\in K$. C'est la **formulation faible** $\\int\\mu u_*'w'=\\int fw$."], ["question", "Comment passer d'une identité « intégrée contre tout $w$ » à une équation point par point ? Je veux d'abord tout mettre sous la forme $\\int gw=0$ : intégration par parties (si $u_*\\in C^2$), le terme de bord $[\\mu u_*'w]_0^L$ est nul car $w\\in K$. Donc $\\int_0^L(-\\mu u_*''-f)w=0$ pour tout $w\\in K$."], ["idee", "Si $g=-\\mu u_*''-f$ était $>0$ en un point $x_0$, elle le resterait sur un petit intervalle (continuité) ; une **bosse** $w\\ge0$ à support dans cet intervalle, non nulle, $C^1$, nulle au bord (par exemple $(\\delta^2-(x-x_0)^2)^2$), donnerait $\\int gw>0$ : contradiction. Donc $g\\equiv0$ : $-\\mu u_*''=f$ sur $]0,L[$, conditions aux limites par $u_*\\in K$."], ["pas", "Formule : deux intégrations avec $u_*(0)=0$, puis $u_*(L)=0$ fixe $u_*'(0)$ ; Fubini donne $u_*(x)=\\frac1\\mu\\int_0^LG(x,s)f(s)ds$, $G(x,s)=\\min(x,s)(L-\\max(x,s))/L$. Tout minimum $C^2$ est donné par cette formule : unicité. (Pour $f=1$ : $x(L-x)/2\\mu$.)"], ["controle", "Existence, en bonus : ce $u_*$ est dans $K$, vérifie la formulation faible (étape 4 à l'envers), et le développement avec $t=1$ donne $J(u_*+w)=J(u_*)+\\frac\\mu2\\int|w'|^2\\ge J(u_*)$, égalité ssi $w=0$. Unique minimum sur tout $K$, sans hypothèse de régularité."], ["bilan", "Minimiser ⟺ formulation faible ⟺ (si régulier) équation différentielle : le principe de Dirichlet. Deux gestes : **sur un espace vectoriel, tester $\\pm w$** ; **pour passer du faible au fort, intégrer par parties puis une bosse** (lemme fondamental) (T4)."]], "livre": "Identique au corrigé (T4), avec le complément d'existence. La « bosse » explicite $(\\delta^2-(x-x_0)^2)^2$ est à retenir : elle est $C^1$, positive, à support compact.", "reflexes": ["R1", "R4", "R12"], "liens": {"fiche": "2.5.1", "scene": "euler", "guide": "exo-2-5-4"}, "voir": ["2.5.1", "E2.5.12", "E2.6.3"]}, {"id": "E2.5.5", "kind": "exo", "num": "Ex. 2.5.5", "label": "Exercice 2.5.5 · niveau 1", "nom": "Lax–Milgram vu comme un minimum : l'inéquation variationnelle", "enonce": "$K$ convexe fermé non vide, $a$ bilinéaire symétrique continue coercive, $L\\in V'$. $J=\\frac12a(v,v)-L(v)$ a un unique minimum $u$ sur $K$, caractérisé par $u\\in K$ et $a(u,v-u)\\ge L(v-u)$ pour tout $v\\in K$.", "chaine": [["but", "Deux résultats du cours à assembler : existence-unicité (§2.3.8, pour une $\\alpha$-convexe continue sur un convexe fermé) et caractérisation par Euler (§2.5.1). Je dois vérifier que $J$ est $\\alpha$-convexe, et calculer $J'$."], ["pas", "$\\alpha$-convexité : l'identité de l'Ex. 2.3.6, $\\theta J(u)+(1-\\theta)J(v)-J(w)=\\frac{\\theta(1-\\theta)}2a(u-v,u-v)\\ge\\frac{\\alpha\\theta(1-\\theta)}2\\norm{u-v}^2$. Continuité par celle de $a$ et $L$. §2.3.8 : unique minimum $u$."], ["pas", "Dérivée (Ex. 2.4.2) : $\\ps{J'(u)}w=a(u,w)-L(w)$. Euler (§2.5.1, nécessaire et suffisante car $J$ convexe) : $\\tilde u$ minimise ssi $a(\\tilde u,v-\\tilde u)\\ge L(v-\\tilde u)$ pour tout $v\\in K$. Donc $u$ résout l'inéquation, et toute solution minimise $J$, donc vaut $u$."], ["controle", "Unicité en croisant (R12) : $u_1,u_2$ solutions, $v=u_2$ dans l'une, $v=u_1$ dans l'autre, somme : $-a(u_1-u_2,u_1-u_2)\\ge0$, donc $\\alpha\\norm{u_1-u_2}^2\\le0$. **Sans symétrie de $a$** — c'est la manœuvre d'Uzawa (§3.4.3). Si $K=V$ : $v=u\\pm w$ donne $a(u,w)=L(w)$ pour tout $w$ : Lax–Milgram symétrique."], ["bilan", "Fonctionnelle quadratique coercive = problème bien posé sur tout convexe fermé ; l'inéquation d'Euler est l'inéquation variationnelle, et **croiser deux inéquations** donne l'unicité même sans symétrie (T3, T4, R12)."]], "livre": "Identique au corrigé. La variante « croisement » est la plus importante : elle ne demande pas de fonction $J$, donc s'étend aux formes non symétriques (Lax–Milgram général, Stampacchia).", "reflexes": ["R12", "R1"], "liens": {"fiche": "2.5.1", "scene": "euler", "guide": "exo-2-5-5"}, "voir": ["E2.3.6", "E2.4.2", "3.4.3"]}, {"id": "E2.5.6", "kind": "exo", "num": "Ex. 2.5.6", "label": "Exercice 2.5.6 · niveau 2", "nom": "Euler avec un terme non dérivable : ne dériver que ce qui l'est", "enonce": "$J_1,J_2$ convexes continues sur $K$, $J_1$ dérivable. $u$ minimise $J_1+J_2$ sur $K$ ssi $\\ps{J_1'(u)}{v-u}+J_2(v)-J_2(u)\\ge0$ pour tout $v\\in K$.", "chaine": [["but", "Refaire la preuve du Théorème §2.5.1 avec un intrus non dérivable. Dans cette preuve, on compare $J(u)$ à $J(u_\\theta)$, $u_\\theta=u+\\theta(v-u)$, on divise par $\\theta$ et on fait $\\theta\\to0$. Pour $J_2$, pas de taux d'accroissement disponible."], ["idee", "Mais $J_2$ est **convexe** : le long du segment, elle est sous sa corde, $J_2(u_\\theta)\\le(1-\\theta)J_2(u)+\\theta J_2(v)$, qui est **linéaire en $\\theta$**. Donc $J_2(u_\\theta)-J_2(u)\\le\\theta(J_2(v)-J_2(u))$ : la division par $\\theta$ se fait sans dériver."], ["pas", "Nécessaire : $J_1(u)+J_2(u)\\le J_1(u_\\theta)+J_2(u_\\theta)\\le J_1(u_\\theta)+(1-\\theta)J_2(u)+\\theta J_2(v)$, donc $\\frac{J_1(u_\\theta)-J_1(u)}\\theta+J_2(v)-J_2(u)\\ge0$ ; $\\theta\\to0^+$ donne l'inéquation."], ["pas", "Suffisante : $J_1$ convexe sur $K$ ⇒ $J_1(v)\\ge J_1(u)+\\ps{J_1'(u)}{v-u}$ (redémontré sur $K$ par le même segment). Alors $J_1(v)+J_2(v)\\ge J_1(u)+J_2(u)+[\\text{inéquation}]\\ge J_1(u)+J_2(u)$."], ["controle", "$J_2=0$ : §2.5.1. Le sens direct vaut pour un minimum local sans convexité de $J_1$. Exemple : $J_1=\\frac1{2\\tau}(v-b)^2$, $J_2=|v|$ sur $\\R$ : $0$ est minimum ssi $|b|\\le\\tau$ — le seuillage (Remarque 3.3.31), source de la parcimonie $\\ell^1$. Et c'est l'inéquation croisée dans Uzawa (§3.4.3)."], ["bilan", "**Ne dériver que ce qui est dérivable ; pour le reste, utiliser la corde** (linéaire en $\\theta$). C'est le premier pas vers les sous-gradients et le proximal (T2, T4)."]], "livre": "Identique au corrigé. L'exemple du seuillage vaut la peine d'être refait : c'est l'Ex. 3.3.3 sous une autre forme.", "reflexes": ["R4", "R12", "R1"], "liens": {"fiche": "2.5.1", "scene": "sousdiff", "guide": "exo-2-5-6"}, "voir": ["2.5.1", "3.4.3", "E3.3.3"]}, {"id": "E2.5.7", "kind": "exo", "num": "Ex. 2.5.7", "label": "Exercice 2.5.7 · niveau 1", "nom": "Sous-espace affine : l'inéquation devient une égalité, l'orthogonal donne les multiplicateurs", "enonce": "$K=u_0+\\mathcal P$, $\\mathcal P=\\{v:\\ps{a_i}v=0,\\ i\\le M\\}$. (2.29) équivaut à $u\\in K$ et $J'(u)+\\sum\\lambda_ia_i=0$ (2.31).", "chaine": [["but", "Réécrire (2.29) sur un sous-espace affine. Ce que je sais de $K$ : $v\\in K$ ⟺ $v-u\\in\\mathcal P$, donc les directions $v-u$ décrivent **tout** $\\mathcal P$, espace vectoriel."], ["pas", "(2.29) ⟺ $\\ps{J'(u)}w\\ge0$ pour tout $w\\in\\mathcal P$ ⟺ (avec $\\pm w$) $\\ps{J'(u)}w=0$ pour tout $w\\in\\mathcal P$ ⟺ $J'(u)\\in\\mathcal P^\\perp$."], ["question", "Qui est $\\mathcal P^\\perp$ ? Par définition $\\mathcal P=E^\\perp$ avec $E=\\Vect(a_i)$, donc $E\\subset\\mathcal P^\\perp$. L'autre inclusion n'est pas automatique en dimension infinie ($(E^\\perp)^\\perp=\\bar E$) — mais $E$ est de dimension finie, donc **fermé** : $q\\in\\mathcal P^\\perp$, $q=q_E+q'$ avec $q'\\in E^\\perp=\\mathcal P$ ; $\\ps q{q'}=0$ et $\\ps{q_E}{q'}=0$ donnent $\\norm{q'}^2=0$. Donc $\\mathcal P^\\perp=E$."], ["pas", "$J'(u)=\\sum\\mu_ia_i$, et $\\lambda_i=-\\mu_i$ donne (2.31). Réciproque : (2.31) ⇒ $\\ps{J'(u)}{v-u}=-\\sum\\lambda_i\\ps{a_i}{v-u}=0$."], ["controle", "Lien avec §2.5.6 : $F_i(v)=\\ps{a_i}{v-u_0}$, $F_i'=a_i$, (2.31) est (2.37). **Aucune indépendance des $a_i$ n'est requise** (contraintes affines, $K$ convexe) ; elle ne sert qu'à l'unicité des $\\lambda_i$. Pour des contraintes non affines elle devient indispensable ($F=v^2$, Remarque 2.5.8)."], ["bilan", "Sur un sous-espace, la condition d'optimalité est « $J'(u)$ orthogonal aux directions admissibles », et **l'orthogonal d'une intersection d'hyperplans est engendré par leurs normales** : voilà les multiplicateurs, sans théorème (T6, R13)."]], "livre": "Identique au corrigé (T6). Le détail « $E$ de dimension finie donc fermé » est ce qui rend l'argument valable en dimension infinie.", "reflexes": ["R13", "R1"], "liens": {"fiche": "2.5.6", "scene": "lagrange", "guide": "exo-2-5-7"}, "voir": ["2.5.6", "E2.5.3", "E2.5.8"]}, {"id": "E2.5.8", "kind": "exo", "num": "Ex. 2.5.8", "label": "Exercice 2.5.8 · niveau 2", "nom": "Cône polyédral : tester 0 et 2u, puis une direction qui n'active qu'une contrainte", "enonce": "$(a_i)$ libre, $K=\\{v:\\ps{a_i}v\\le0\\}$. $K$ est un cône convexe fermé ; (2.29) ⇒ $\\ps{J'(u)}u=0$ et $\\ps{J'(u)}w\\ge0$ pour $w\\in K$ (2.32) ; puis $J'(u)+\\sum\\lambda_ia_i=0$ avec $\\lambda_i\\ge0$, et $\\lambda_i=0$ si $\\ps{a_i}u<0$ (2.33).", "chaine": [["but", "Après l'Ex. 2.5.7 (égalités), les inégalités : je veux voir **d'où vient le signe** des multiplicateurs et les écarts complémentaires, à la main."], ["pas", "Cône convexe fermé : les $\\varphi_i=\\ps{a_i}\\cdot$ sont linéaires continues, $K$ est une intersection de demi-espaces fermés, stable par combinaisons convexes et par $\\lambda\\ge0$."], ["idee", "Sur un cône, j'ai deux points admissibles gratuits à partir de $u$ : $0$ et $2u$. (2.29) avec $v=0$ : $-\\ps pu\\ge0$ ; avec $v=2u$ : $\\ps pu\\ge0$ (où $p=J'(u)$). Donc $\\ps pu=0$, puis pour $w\\in K$, $\\ps pw\\ge\\ps pu=0$. C'est (2.32)."], ["pas", "$p\\in E=\\Vect(a_i)$ : je décompose $p=p_E+p'$, $p'\\in E^\\perp$. Alors $\\pm p'\\in K$ (ils annulent tous les $\\varphi_i$), et (2.32) donne $\\ps p{p'}\\ge0$ et $\\le0$, donc $\\ps p{p'}=0=\\norm{p'}^2$. Donc $p=-\\sum\\lambda_ia_i$, coefficients uniques (famille libre)."], ["question", "Le signe de $\\lambda_j$ ? Il me faudrait une direction $w_j\\in K$ qui **ne touche que la contrainte $j$** : $\\ps{a_i}{w_j}=-\\delta_{ij}$. Avec la famille libre, la matrice de Gram $G=(\\ps{a_i}{a_k})$ est définie positive ; je résous $Gc=-e_j$ et je pose $w_j=\\sum c_ka_k$. Alors $w_j\\in K$ et $0\\le\\ps p{w_j}=-\\sum_i\\lambda_i\\ps{a_i}{w_j}=\\lambda_j$."], ["pas", "Écarts complémentaires : $0=\\ps pu=-\\sum\\lambda_i\\ps{a_i}u$, somme de termes **tous $\\le0$** ($\\lambda_i\\ge0$, $u\\in K$) : chacun est nul, donc $\\lambda_i=0$ si $\\ps{a_i}u<0$."], ["controle", "Variante : le lemme de Farkas (§2.5.19) donne directement $p=-\\sum\\lambda_ia_i$, $\\lambda\\ge0$, même pour une famille liée (multiplicateurs non uniques). L'argument direct montre **à quoi sert la liberté** : pouvoir tirer sur une contrainte sans bouger les autres. Au total j'ai obtenu (2.46) de §2.5.17 pour $F_i=\\ps{a_i}\\cdot$."], ["bilan", "Sur un cône : tester $0$ et $2u$ (R3). Pour le signe d'un multiplicateur : **une direction admissible qui n'active que cette contrainte** (R5). Pour les écarts complémentaires : une somme nulle de termes de même signe (R12)."]], "livre": "Identique au corrigé (T6). La construction par la matrice de Gram est la version « à la main » de Farkas, et elle explique le signe mieux que le lemme général.", "reflexes": ["R3", "R5", "R12", "R13"], "liens": {"fiche": "2.5.17", "scene": "kkt", "guide": "exo-2-5-8"}, "voir": ["2.5.17", "2.5.19", "E2.5.7"]}, {"id": "E2.5.9", "kind": "exo", "num": "Ex. 2.5.9", "label": "Exercice 2.5.9 · niveau 1", "nom": "Cône des directions admissibles : intérieur, point isolé", "enonce": "$K(v)=V$ si $v$ est intérieur à $K$ ; $K(v_0)=\\{0\\}$ si $K=K_0\\cup\\{v_0\\}$ avec $d(v_0,K_0)>0$.", "chaine": [["but", "Deux calculs directs avec la Définition 2.5.4 : $w\\in K(v)$ s'il existe $v^n\\in K$, $\\eps^n>0$, $v^n\\to v$, $\\eps^n\\to0$, $(v^n-v)/\\eps^n\\to w$. Pour montrer $w\\in K(v)$, j'**exhibe** les suites ; pour montrer $K(v_0)=\\{0\\}$, je montre que toute suite autorisée est triviale."], ["pas", "Intérieur : boule $B(v,r)\\subset K$. Pour $w$ quelconque, $v^n=v+w/n$ est dans la boule dès que $n>\\norm w/r$, et $(v^n-v)/\\eps^n=w$ exactement avec $\\eps^n=1/n$. Donc $K(v)=V$."], ["pas", "Point isolé : si $v^n\\to v_0$ avec $v^n\\in K$, alors $\\norm{v^n-v_0}<\\delta=d(v_0,K_0)$ pour $n$ grand, donc $v^n\\notin K_0$, donc $v^n=v_0$ : la suite est **stationnaire**, $(v^n-v_0)/\\eps^n=0$, $w=0$. Et $0\\in K(v_0)$ (suite constante)."], ["controle", "Lecture de §2.5.5 : à l'intérieur, $\\ps{J'(u)}w\\ge0$ pour tout $w\\in V$ donne $J'(u)=0$ ; en un point isolé, condition vide — normal, un point isolé est un minimum local de n'importe quelle fonction."], ["bilan", "$K(v)$ ne dépend que de la forme de $K$ près de $v$ : tout $V$ à l'intérieur, $\\{0\\}$ en un point isolé, l'espace tangent sur une surface (§2.5.6). Le geste : **exhiber $v+\\eps w$** quand on veut $w$ admissible (R1)."]], "livre": "Identique.", "reflexes": ["R1", "R3"], "liens": {"fiche": "2.5.5", "scene": "kkt", "guide": "exo-2-5-9"}, "voir": ["2.5.5", "2.5.6"]}, {"id": "E2.5.10", "kind": "exo", "num": "Ex. 2.5.10", "label": "Exercice 2.5.10 · niveau 1", "nom": "Contrainte affine Bx = c : éliminer x̄ et tout ramener au système dual BA⁻¹B*", "enonce": "$\\min_{Bx=c}\\frac12Ax\\cdot x-b\\cdot x$, $A>0$, $B$ de rang $m$. Généraliser les formules du cas $c=0$.", "chaine": [["but", "Cas $c=0$ connu : $A\\bar x-b=B^*p$, $p=-(BA^{-1}B^*)^{-1}BA^{-1}b$. Je refais le même calcul en traînant $c$ : seule l'équation de contrainte change."], ["pas", "Existence-unicité : $K=\\{Bx=c\\}$ non vide ($B$ surjective), affine donc convexe fermé ; $J$ $\\alpha$-convexe continue ; §2.3.8. Multiplicateur : $F_i(x)=b_i\\cdot x-c_i$ affines, $F_i'=b_i$ libres (rang $m$) : cas régulier de §2.5.6, $A\\bar x-b+\\sum\\lambda_ib_i=0$ ; avec $p=-\\lambda$, $A\\bar x-b=B^*p$."], ["pas", "Calcul :
