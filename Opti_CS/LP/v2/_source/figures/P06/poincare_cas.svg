<svg viewBox="0 0 660 250" role="img" aria-label="Les trois cas de la récurrence de Poincaré" xmlns="http://www.w3.org/2000/svg"><rect x="92.0" y="64.0" width="32" height="32" class="a2"/><rect x="92.0" y="96.0" width="32" height="32" class="a2"/><rect x="92.0" y="128.0" width="32" height="32" class="a2"/><text x="76.0" y="85.0" class="tx-b" text-anchor="middle">1</text><text x="108.0" y="85.0" class="tx" text-anchor="middle">0</text><text x="140.0" y="85.0" class="tx-b" text-anchor="middle">−1</text><text x="76.0" y="117.0" class="tx-b" text-anchor="middle">−1</text><text x="108.0" y="117.0" class="tx" text-anchor="middle">0</text><text x="140.0" y="117.0" class="tx" text-anchor="middle">0</text><text x="76.0" y="149.0" class="tx" text-anchor="middle">0</text><text x="108.0" y="149.0" class="tx" text-anchor="middle">0</text><text x="140.0" y="149.0" class="tx-b" text-anchor="middle">1</text><path d="M56.0 64.0 Q49.0 112.0 56.0 160.0" class="ln ck thin"/><path d="M160.0 64.0 Q167.0 112.0 160.0 160.0" class="ln ck thin"/><text x="108.0" y="36.0" class="tx-b" text-anchor="middle">cas 1 : une colonne nulle</text><text x="108.0" y="196.0" class="tx-s" text-anchor="middle">det = 0</text><rect x="307.0" y="64.0" width="32" height="32" class="a2"/><rect x="307.0" y="96.0" width="32" height="32" class="a2"/><rect x="307.0" y="128.0" width="32" height="32" class="a2"/><text x="291.0" y="85.0" class="tx-b" text-anchor="middle">1</text><text x="323.0" y="85.0" class="tx" text-anchor="middle">0</text><text x="355.0" y="85.0" class="tx-b" text-anchor="middle">−1</text><text x="291.0" y="117.0" class="tx-b" text-anchor="middle">−1</text><text x="323.0" y="117.0" class="tx-b" text-anchor="middle">1</text><text x="355.0" y="117.0" class="tx" text-anchor="middle">0</text><text x="291.0" y="149.0" class="tx" text-anchor="middle">0</text><text x="323.0" y="149.0" class="tx" text-anchor="middle">0</text><text x="355.0" y="149.0" class="tx-b" text-anchor="middle">1</text><path d="M271.0 64.0 Q264.0 112.0 271.0 160.0" class="ln ck thin"/><path d="M375.0 64.0 Q382.0 112.0 375.0 160.0" class="ln ck thin"/><text x="323.0" y="36.0" class="tx-b" text-anchor="middle">cas 2 : une colonne à un seul ±1</text><text x="323.0" y="196.0" class="tx-s" text-anchor="middle">on développe : det = ± det(mineur)</text><text x="506.0" y="85.0" class="tx-b" text-anchor="middle">1</text><text x="538.0" y="85.0" class="tx-b" text-anchor="middle">−1</text><text x="570.0" y="85.0" class="tx" text-anchor="middle">0</text><text x="506.0" y="117.0" class="tx-b" text-anchor="middle">−1</text><text x="538.0" y="117.0" class="tx" text-anchor="middle">0</text><text x="570.0" y="117.0" class="tx-b" text-anchor="middle">1</text><text x="506.0" y="149.0" class="tx" text-anchor="middle">0</text><text x="538.0" y="149.0" class="tx-b" text-anchor="middle">1</text><text x="570.0" y="149.0" class="tx-b" text-anchor="middle">−1</text><path d="M486.0 64.0 Q479.0 112.0 486.0 160.0" class="ln ck thin"/><path d="M590.0 64.0 Q597.0 112.0 590.0 160.0" class="ln ck thin"/><text x="538.0" y="36.0" class="tx-b" text-anchor="middle">cas 3 : un +1 et un −1 partout</text><text x="538.0" y="196.0" class="tx-s" text-anchor="middle">somme des lignes = 0 : det = 0</text><text x="330.0" y="230.0" class="tx-s" text-anchor="middle">l'hypothèse « au plus un +1 et au plus un −1 par colonne » passe aux mineurs : on recommence</text></svg>
