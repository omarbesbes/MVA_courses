<svg viewBox="0 0 660 360" role="img" aria-label="Preuve de l'existence : le cône C engendré par les colonnes (a_i, c_i), la verticale t = b et les coûts réalisables" xmlns="http://www.w3.org/2000/svg"><defs><marker id="P01-cone-arr-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f2"/></marker></defs><text x="114.3" y="330.0" class="tx-s" text-anchor="middle">0</text><text x="168.6" y="330.0" class="tx-s" text-anchor="middle">1</text><text x="222.9" y="330.0" class="tx-s" text-anchor="middle">2</text><text x="277.1" y="330.0" class="tx-s" text-anchor="middle">3</text><text x="331.4" y="330.0" class="tx-s" text-anchor="middle">4</text><text x="385.7" y="330.0" class="tx-s" text-anchor="middle">5</text><text x="440.0" y="330.0" class="tx-s" text-anchor="middle">6</text><text x="55.0" y="320.0" class="tx-s" text-anchor="end">-6</text><text x="55.0" y="282.5" class="tx-s" text-anchor="end">-4</text><text x="55.0" y="245.0" class="tx-s" text-anchor="end">-2</text><text x="55.0" y="207.5" class="tx-s" text-anchor="end">0</text><text x="55.0" y="170.0" class="tx-s" text-anchor="end">2</text><text x="55.0" y="132.5" class="tx-s" text-anchor="end">4</text><text x="55.0" y="95.0" class="tx-s" text-anchor="end">6</text><text x="55.0" y="57.5" class="tx-s" text-anchor="end">8</text><text x="55.0" y="20.0" class="tx-s" text-anchor="end">10</text><line x1="60.0" y1="203.5" x2="440.0" y2="203.5" class="ax"/><line x1="114.3" y1="316.0" x2="114.3" y2="16.0" class="ax"/><text x="440.0" y="344.0" class="tx-s" text-anchor="end">t = a·x</text><text x="64.0" y="10.0" class="tx-s" text-anchor="start">y = c·x</text><path d="M440.0 316.0L440.0 16.0L385.7 16.0L114.3 203.5Z" class="am"/><line x1="114.3" y1="203.5" x2="385.7" y2="16.0" class="ln cm thin"/><line x1="114.3" y1="203.5" x2="385.7" y2="297.2" class="ln cm thin"/><line x1="114.3" y1="203.5" x2="440.0" y2="147.2" class="ln cm thin"/><circle cx="168.6" cy="166.0" r="5" class="fk"/><text x="162.6" y="160.0" class="tx-s" text-anchor="end">𝒜₁ = (1, 2)</text><circle cx="222.9" cy="184.8" r="5" class="fk"/><text x="230.9" y="198.8" class="tx-s" text-anchor="start">𝒜₂ = (2, 1)</text><circle cx="168.6" cy="222.2" r="5" class="fk"/><text x="162.6" y="238.2" class="tx-s" text-anchor="end">𝒜₃ = (1, −1)</text><line x1="331.4" y1="316.0" x2="331.4" y2="16.0" class="ln cm thin dash"/><line x1="331.4" y1="278.5" x2="331.4" y2="53.5" class="ln c1"/><circle cx="331.4" cy="91.0" r="3" class="f2"/><circle cx="331.4" cy="147.2" r="3" class="f2"/><circle cx="331.4" cy="203.5" r="3" class="f2"/><circle cx="331.4" cy="241.0" r="3" class="f2"/><circle cx="331.4" cy="259.8" r="3" class="f2"/><circle cx="331.4" cy="269.1" r="3" class="f2"/><line x1="350.4" y1="100.4" x2="350.4" y2="271.0" class="ln c2 thin" marker-end="url(#P01-cone-arr-2)"/><text x="339.4" y="57.5" class="tx-s" text-anchor="start">(b, 8)</text><circle cx="331.4" cy="278.5" r="6" class="f3"/><text x="321.4" y="292.5" class="tx-b t3" text-anchor="end">(b, z₀) = (4, −4) ∈ C</text><text x="356.4" y="175.4" class="tx-s t2" text-anchor="start">c·xᵏ ↓ z₀</text><text x="470.0" y="40.0" class="tx-b" text-anchor="start">Exemple : min 2x₁ + x₂ − x₃</text><text x="470.0" y="57.0" class="tx-s" text-anchor="start">x ≥ 0, x₁ + 2x₂ + x₃ = 4</text><text x="470.0" y="85.0" class="tx-s" text-anchor="start">gris : le cône C des</text><text x="470.0" y="101.0" class="tx-s" text-anchor="start">combinaisons Σ xᵢ 𝒜ᵢ, xᵢ ≥ 0</text><text x="470.0" y="129.0" class="tx-s t1" text-anchor="start">bleu : C ∩ {t = b} =</text><text x="470.0" y="145.0" class="tx-s t1" text-anchor="start">les coûts réalisables</text><text x="470.0" y="161.0" class="tx-s t1" text-anchor="start">= [−4, 8], fermé</text><text x="470.0" y="189.0" class="tx-s t2" text-anchor="start">orange : une suite</text><text x="470.0" y="205.0" class="tx-s t2" text-anchor="start">minimisante (b, c·xᵏ)</text><text x="470.0" y="233.0" class="tx-s t3" text-anchor="start">vert : sa limite reste</text><text x="470.0" y="249.0" class="tx-s t3" text-anchor="start">dans C (C est fermé)</text></svg>
