<svg viewBox="0 0 660 340" role="img" aria-label="Le triangle T de l'exemple (4.5) en perspective, ses sommets, les valeurs du coût et des lignes de niveau sur T" xmlns="http://www.w3.org/2000/svg"><defs><marker id="P01-triangle-arr-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fk"/></marker><marker id="P01-triangle-arr-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f3"/></marker></defs><line x1="178.0" y1="214.0" x2="44.8" y2="325.0" class="ax" marker-end="url(#P01-triangle-arr-k)"/><text x="20.8" y="329.0" class="tx-i" text-anchor="start">x₁</text><line x1="178.0" y1="214.0" x2="610.0" y2="214.0" class="ax" marker-end="url(#P01-triangle-arr-k)"/><text x="616.0" y="218.0" class="tx-i" text-anchor="start">x₂</text><line x1="178.0" y1="214.0" x2="178.0" y2="32.5" class="ax" marker-end="url(#P01-triangle-arr-k)"/><text x="184.0" y="28.5" class="tx-i" text-anchor="start">x₃</text><path d="M70.0 304.0 L538.0 214.0 L178.0 82.0Z" class="a1"/><path d="M70.0 304.0 L538.0 214.0 L178.0 82.0Z" class="ln c1"/><line x1="92.3" y1="299.7" x2="178.0" y2="82.0" class="ln c2 thin dash"/><text x="153.0" y="154.2" class="tx-s t2" text-anchor="start">coût 4</text><line x1="226.0" y1="274.0" x2="286.0" y2="121.6" class="ln c2 thin dash"/><text x="270.0" y="170.9" class="tx-s t2" text-anchor="start">coût 10</text><line x1="359.7" y1="248.3" x2="394.0" y2="161.2" class="ln c2 thin dash"/><text x="387.0" y="187.7" class="tx-s t2" text-anchor="start">coût 16</text><line x1="262.0" y1="200.0" x2="157.3" y2="192.0" class="ln c3 thin" marker-end="url(#P01-triangle-arr-3)"/><circle cx="262.0" cy="200.0" r="3" class="fk"/><text x="270.0" y="204.0" class="tx-s t3" text-anchor="start">descente dans T</text><circle cx="70.0" cy="304.0" r="6" class="f3"/><text x="60.0" y="326.0" class="tx-b t3" text-anchor="start">(3, 0, 0) : coût 3 — minimum</text><circle cx="538.0" cy="214.0" r="4" class="f1"/><text x="518.0" y="236.0" class="tx-s" text-anchor="start">(0, 6, 0) : coût 24</text><circle cx="178.0" cy="82.0" r="4" class="f1"/><text x="188.0" y="74.0" class="tx-s" text-anchor="start">(0, 0, 2) : coût 4</text><text x="430.0" y="60.0" class="tx-b t1" text-anchor="start">T = {x ≥ 0 : 2x₁ + x₂ + 3x₃ = 6}</text><text x="430.0" y="80.0" class="tx-s t2" text-anchor="start">coût x₁ + 4x₂ + 2x₃</text><text x="430.0" y="98.0" class="tx-s t2" text-anchor="start">pointillés : lignes de niveau sur T</text></svg>
