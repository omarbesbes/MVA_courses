<svg viewBox="0 0 620 330" role="img" aria-label="Encodage big-M d'un ReLU : graphe, enveloppe convexe et relaxations continues" xmlns="http://www.w3.org/2000/svg"><line x1="87.7" y1="280.0" x2="87.7" y2="20.0" class="gr"/><text x="87.7" y="294.0" class="tx-s" text-anchor="middle">-1</text><line x1="193.2" y1="280.0" x2="193.2" y2="20.0" class="gr"/><text x="193.2" y="294.0" class="tx-s" text-anchor="middle">0</text><line x1="298.8" y1="280.0" x2="298.8" y2="20.0" class="gr"/><text x="298.8" y="294.0" class="tx-s" text-anchor="middle">1</text><line x1="404.3" y1="280.0" x2="404.3" y2="20.0" class="gr"/><text x="404.3" y="294.0" class="tx-s" text-anchor="middle">2</text><line x1="56.0" y1="251.9" x2="436.0" y2="251.9" class="gr"/><text x="51.0" y="255.9" class="tx-s" text-anchor="end">0</text><line x1="56.0" y1="181.6" x2="436.0" y2="181.6" class="gr"/><text x="51.0" y="185.6" class="tx-s" text-anchor="end">1</text><line x1="56.0" y1="111.4" x2="436.0" y2="111.4" class="gr"/><text x="51.0" y="115.4" class="tx-s" text-anchor="end">2</text><line x1="56.0" y1="41.1" x2="436.0" y2="41.1" class="gr"/><text x="51.0" y="45.1" class="tx-s" text-anchor="end">3</text><line x1="56.0" y1="251.9" x2="436.0" y2="251.9" class="ax"/><line x1="193.2" y1="280.0" x2="193.2" y2="20.0" class="ax"/><text x="436.0" y="308.0" class="tx-s" text-anchor="end">x (entrée du neurone)</text><text x="60.0" y="14.0" class="tx-s" text-anchor="start">y</text><path d="M87.7 251.9L193.2 251.9L404.3 111.4L404.3 41.1L87.7 146.5Z" class="ln c6 thin dot nofill"/><text x="298.8" y="69.2" class="tx-b t6" text-anchor="middle">M = 4</text><path d="M87.7 251.9L193.2 251.9L404.3 111.4L404.3 111.4L87.7 216.8Z" class="ln c5 thin dash nofill"/><text x="298.8" y="139.5" class="tx-b t5" text-anchor="middle">M = 2</text><path d="M87.7 251.9L193.2 251.9L404.3 111.4Z" class="a1 ln c1 thin"/><line x1="87.7" y1="251.9" x2="193.2" y2="251.9" class="ln c3"/><line x1="193.2" y1="251.9" x2="404.3" y2="111.4" class="ln c3"/><text x="333.2" y="174.1" class="tx-b t3" text-anchor="start">y = max(0, x)</text><text x="452.0" y="34.0" class="tx-b" text-anchor="start">z ∈ {0, 1} :</text><text x="452.0" y="51.0" class="tx-s" text-anchor="start">y ≥ x,  y ≥ 0</text><text x="452.0" y="68.0" class="tx-s" text-anchor="start">y ≤ x + M(1 − z)</text><text x="452.0" y="85.0" class="tx-s" text-anchor="start">y ≤ M z</text><text x="452.0" y="119.0" class="tx-s t3" text-anchor="start">z = 1 ⇒ y = x ≥ 0</text><text x="452.0" y="136.0" class="tx-s t3" text-anchor="start">z = 0 ⇒ y = 0 ≥ x</text><text x="452.0" y="170.0" class="tx-b" text-anchor="start">relaxé (0 ≤ z ≤ 1) :</text><text x="452.0" y="187.0" class="tx-s" text-anchor="start">y ≤ (x + M)/2</text><text x="452.0" y="221.0" class="tx-s" text-anchor="start">ici l = −1, u = 2 ;</text><text x="452.0" y="238.0" class="tx-s" text-anchor="start">M = 2 est le plus petit</text><text x="452.0" y="255.0" class="tx-s" text-anchor="start">M valable : max(|l|, u)</text><text x="452.0" y="289.0" class="tx-s t1" text-anchor="start">bleu : enveloppe convexe</text><text x="452.0" y="306.0" class="tx-s t1" text-anchor="start">du graphe sur [l, u]</text></svg>
