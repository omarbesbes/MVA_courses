<svg viewBox="0 0 640 336" role="img" aria-label="Profit optimal en fonction du stock de bois : concave, linéaire par morceaux, de pente le prix ombre" xmlns="http://www.w3.org/2000/svg"><line x1="56.0" y1="272.0" x2="56.0" y2="22.0" class="gr"/><text x="56.0" y="286.0" class="tx-s" text-anchor="middle">0</text><line x1="123.5" y1="272.0" x2="123.5" y2="22.0" class="gr"/><text x="123.5" y="286.0" class="tx-s" text-anchor="middle">2</text><line x1="191.0" y1="272.0" x2="191.0" y2="22.0" class="gr"/><text x="191.0" y="286.0" class="tx-s" text-anchor="middle">4</text><line x1="258.5" y1="272.0" x2="258.5" y2="22.0" class="gr"/><text x="258.5" y="286.0" class="tx-s" text-anchor="middle">6</text><line x1="326.0" y1="272.0" x2="326.0" y2="22.0" class="gr"/><text x="326.0" y="286.0" class="tx-s" text-anchor="middle">8</text><line x1="393.5" y1="272.0" x2="393.5" y2="22.0" class="gr"/><text x="393.5" y="286.0" class="tx-s" text-anchor="middle">10</text><line x1="461.0" y1="272.0" x2="461.0" y2="22.0" class="gr"/><text x="461.0" y="286.0" class="tx-s" text-anchor="middle">12</text><line x1="528.5" y1="272.0" x2="528.5" y2="22.0" class="gr"/><text x="528.5" y="286.0" class="tx-s" text-anchor="middle">14</text><line x1="596.0" y1="272.0" x2="596.0" y2="22.0" class="gr"/><text x="596.0" y="286.0" class="tx-s" text-anchor="middle">16</text><line x1="56.0" y1="272.0" x2="596.0" y2="272.0" class="gr"/><text x="51.0" y="276.0" class="tx-s" text-anchor="end">0</text><line x1="56.0" y1="225.7" x2="596.0" y2="225.7" class="gr"/><text x="51.0" y="229.7" class="tx-s" text-anchor="end">50</text><line x1="56.0" y1="179.4" x2="596.0" y2="179.4" class="gr"/><text x="51.0" y="183.4" class="tx-s" text-anchor="end">100</text><line x1="56.0" y1="133.1" x2="596.0" y2="133.1" class="gr"/><text x="51.0" y="137.1" class="tx-s" text-anchor="end">150</text><line x1="56.0" y1="86.8" x2="596.0" y2="86.8" class="gr"/><text x="51.0" y="90.8" class="tx-s" text-anchor="end">200</text><line x1="56.0" y1="40.5" x2="596.0" y2="40.5" class="gr"/><text x="51.0" y="44.5" class="tx-s" text-anchor="end">250</text><line x1="56.0" y1="272.0" x2="596.0" y2="272.0" class="ax"/><line x1="56.0" y1="272.0" x2="56.0" y2="22.0" class="ax"/><text x="596.0" y="300.0" class="tx-s" text-anchor="end">b₁ (bois)</text><text x="60.0" y="16.0" class="tx-s" text-anchor="start">V(b₁) = profit maximal</text><path d="M56.0 272.0L224.8 133.1L309.1 91.4L461.0 49.8L596.0 49.8" class="ln c3"/><circle cx="224.8" cy="133.1" r="3.5" class="f3"/><circle cx="309.1" cy="91.4" r="3.5" class="f3"/><circle cx="461.0" cy="49.8" r="3.5" class="f3"/><text x="148.4" y="216.6" class="tx-s t3" text-anchor="start">pente 30</text><text x="274.9" y="126.3" class="tx-s t3" text-anchor="start">pente 18</text><text x="393.1" y="84.6" class="tx-s t3" text-anchor="start">pente 10</text><text x="528.5" y="39.8" class="tx-s t3" text-anchor="middle">pente 0</text><line x1="258.5" y1="105.3" x2="501.5" y2="38.7" class="ln c5 thin dash"/><circle cx="393.5" cy="68.3" r="6" class="f5"/><line x1="393.5" y1="272.0" x2="393.5" y2="68.3" class="ln cm thin dot"/><text x="401.5" y="151.6" class="tx-s t5" text-anchor="start">b₁ = 10 : V = 220,</text><text x="401.5" y="165.6" class="tx-s t5" text-anchor="start">pente y₁ = 10</text><text x="317.1" y="105.4" class="tx-s" text-anchor="start">(15/2 ; 195)</text><text x="461.0" y="39.8" class="tx-s" text-anchor="middle">(12 ; 240)</text><text x="216.8" y="129.1" class="tx-s" text-anchor="end">(5 ; 150)</text><text x="330.0" y="312.0" class="tx-s" text-anchor="middle">Le prix ombre du bois vaut 10 tant que b₁ reste dans [15/2 ; 12] (la base optimale ne change pas) ;</text><text x="330.0" y="328.0" class="tx-s" text-anchor="middle">au-delà de 12, le bois ne limite plus rien : son prix tombe à 0.</text></svg>
