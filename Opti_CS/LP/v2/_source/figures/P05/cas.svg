<svg viewBox="0 0 660 268" role="img" aria-label="Les neuf combinaisons primal / dual : quatre seulement sont possibles" xmlns="http://www.w3.org/2000/svg"><text x="410.0" y="18.0" class="tx-b t5" text-anchor="middle">DUAL (4.18) : max b·p</text><text x="250.0" y="44.0" class="tx-s t5" text-anchor="middle">optimum fini</text><text x="410.0" y="44.0" class="tx-s t5" text-anchor="middle">non borné (+∞)</text><text x="570.0" y="44.0" class="tx-s t5" text-anchor="middle">vide</text><text x="20.0" y="36.0" class="tx-b t1" text-anchor="start">PRIMAL (4.15) :</text><text x="20.0" y="50.0" class="tx-b t1" text-anchor="start">min c·x</text><text x="160.0" y="91.0" class="tx-s t1" text-anchor="end">optimum fini</text><text x="160.0" y="153.0" class="tx-s t1" text-anchor="end">non borné (−∞)</text><text x="160.0" y="215.0" class="tx-s t1" text-anchor="end">vide</text><rect x="172" y="58" width="156" height="58" rx="6" class="a3"/><text x="250.0" y="76.0" class="tx-b t3" text-anchor="middle">possible</text><text x="250.0" y="91.0" class="tx-s" text-anchor="middle">valeurs égales (4.19)</text><text x="250.0" y="106.0" class="tx-s" text-anchor="middle">ex. : (R), 13 = 13</text><rect x="332" y="58" width="156" height="58" rx="6" class="am"/><text x="410.0" y="86.0" class="tx-s" text-anchor="middle">impossible</text><text x="410.0" y="101.0" class="tx-s" text-anchor="middle">(dualité faible)</text><rect x="492" y="58" width="156" height="58" rx="6" class="am"/><text x="570.0" y="86.0" class="tx-s" text-anchor="middle">impossible</text><text x="570.0" y="101.0" class="tx-s" text-anchor="middle">(Th. 4.2.13)</text><rect x="172" y="120" width="156" height="58" rx="6" class="am"/><text x="250.0" y="148.0" class="tx-s" text-anchor="middle">impossible</text><text x="250.0" y="163.0" class="tx-s" text-anchor="middle">(dualité faible)</text><rect x="332" y="120" width="156" height="58" rx="6" class="am"/><text x="410.0" y="148.0" class="tx-s" text-anchor="middle">impossible</text><text x="410.0" y="163.0" class="tx-s" text-anchor="middle">(dualité faible)</text><rect x="492" y="120" width="156" height="58" rx="6" class="a4"/><text x="570.0" y="138.0" class="tx-b t4" text-anchor="middle">possible</text><text x="570.0" y="153.0" class="tx-s" text-anchor="middle">dual vide</text><text x="570.0" y="168.0" class="tx-s" text-anchor="middle">ex. : min −x₁, x₁ − x₂ = 0</text><rect x="172" y="182" width="156" height="58" rx="6" class="am"/><text x="250.0" y="210.0" class="tx-s" text-anchor="middle">impossible</text><text x="250.0" y="225.0" class="tx-s" text-anchor="middle">(Th. 4.2.13)</text><rect x="332" y="182" width="156" height="58" rx="6" class="a4"/><text x="410.0" y="200.0" class="tx-b t4" text-anchor="middle">possible</text><text x="410.0" y="215.0" class="tx-s" text-anchor="middle">primal vide</text><text x="410.0" y="230.0" class="tx-s" text-anchor="middle">ex. : min x₁, x₁ + x₂ = −1</text><rect x="492" y="182" width="156" height="58" rx="6" class="a4"/><text x="570.0" y="200.0" class="tx-b t4" text-anchor="middle">possible</text><text x="570.0" y="215.0" class="tx-s" text-anchor="middle">les deux vides</text><text x="570.0" y="230.0" class="tx-s" text-anchor="middle">ex. : § 4, exemple vide/vide</text><text x="330.0" y="262.0" class="tx-s" text-anchor="middle">Lecture : un primal fini force un dual fini (et réciproquement) ; un problème non borné force l’autre à être vide.</text></svg>
