<svg viewBox="0 0 600 340" role="img" aria-label="Exercice 4.2.7 : le dual en dimension 2, ses quatre contraintes, et son optimum au sommet (12/7, 8/7)" xmlns="http://www.w3.org/2000/svg"><defs><marker id="P05-ex427-arr-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f5"/></marker><marker id="P05-ex427-arr-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f2"/></marker></defs><line x1="79.2" y1="310.0" x2="79.2" y2="20.0" class="gr"/><text x="79.2" y="324.0" class="tx-s" text-anchor="middle">0</text><line x1="176.7" y1="310.0" x2="176.7" y2="20.0" class="gr"/><text x="176.7" y="324.0" class="tx-s" text-anchor="middle">1</text><line x1="274.1" y1="310.0" x2="274.1" y2="20.0" class="gr"/><text x="274.1" y="324.0" class="tx-s" text-anchor="middle">2</text><line x1="371.5" y1="310.0" x2="371.5" y2="20.0" class="gr"/><text x="371.5" y="324.0" class="tx-s" text-anchor="middle">3</text><line x1="50.0" y1="286.5" x2="430.0" y2="286.5" class="gr"/><text x="45.0" y="290.5" class="tx-s" text-anchor="end">0</text><line x1="50.0" y1="208.1" x2="430.0" y2="208.1" class="gr"/><text x="45.0" y="212.1" class="tx-s" text-anchor="end">1</text><line x1="50.0" y1="129.7" x2="430.0" y2="129.7" class="gr"/><text x="45.0" y="133.7" class="tx-s" text-anchor="end">2</text><line x1="50.0" y1="51.4" x2="430.0" y2="51.4" class="gr"/><text x="45.0" y="55.4" class="tx-s" text-anchor="end">3</text><line x1="50.0" y1="286.5" x2="430.0" y2="286.5" class="ax"/><line x1="79.2" y1="310.0" x2="79.2" y2="20.0" class="ax"/><text x="430.0" y="338.0" class="tx-s" text-anchor="end">p₁</text><text x="54.0" y="14.0" class="tx-s" text-anchor="start">p₂</text><path d="M274.1 286.5L246.3 196.9L79.2 129.7L79.2 286.5Z" class="a5"/><path d="M274.1 286.5L246.3 196.9L79.2 129.7L79.2 286.5Z" class="ln c5 thin"/><line x1="281.4" y1="310.0" x2="191.3" y2="20.0" class="ln cm thin"/><text x="188.4" y="34.1" class="tx-s" text-anchor="end">(i) 4p₁ + p₂ = 8</text><line x1="50.0" y1="43.5" x2="430.0" y2="145.4" class="ln cm thin"/><text x="288.7" y="90.5" class="tx-s" text-anchor="start">(ii) p₁ + 3p₂ = 9</text><line x1="50.0" y1="118.0" x2="430.0" y2="270.8" class="ln cm thin"/><text x="347.2" y="227.7" class="tx-s" text-anchor="start">(iii) p₁ + 2p₂ = 4</text><line x1="386.2" y1="310.0" x2="205.9" y2="20.0" class="ln cm thin"/><text x="330.6" y="159.5" class="tx-s" text-anchor="start">(iv) 2p₁ + p₂ = 6</text><line x1="50.0" y1="39.0" x2="386.8" y2="310.0" class="ln c2 thin"/><line x1="50.0" y1="106.2" x2="303.3" y2="310.0" class="ln c2 thin dash"/><circle cx="246.3" cy="196.9" r="6" class="f3"/><text x="236.3" y="214.9" class="tx-b t3" text-anchor="end" style="paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round">p̄ = (12/7, 8/7)</text><line x1="246.3" y1="196.9" x2="289.1" y2="188.3" class="ln c5 thin" marker-end="url(#P05-ex427-arr-5)"/><line x1="246.3" y1="196.9" x2="257.0" y2="179.7" class="ln c5 thin" marker-end="url(#P05-ex427-arr-5)"/><line x1="246.3" y1="196.9" x2="269.8" y2="177.9" class="ln c2 thin" marker-end="url(#P05-ex427-arr-2)"/><text x="293.1" y="198.3" class="tx-s t5" text-anchor="start">(4, 1)</text><text x="253.0" y="175.7" class="tx-s t5" text-anchor="end">(1, 2)</text><text x="277.8" y="171.9" class="tx-s t2" text-anchor="start">b = (1, 1)</text><text x="445.0" y="40.0" class="tx-s" text-anchor="start">Sommets de P<tspan baseline-shift="sub" font-size="75%">ad</tspan></text><text x="445.0" y="56.0" class="tx-s" text-anchor="start">et valeur de p₁ + p₂ :</text><text x="445.0" y="72.0" class="tx-s" text-anchor="start">(0, 0) : 0</text><text x="445.0" y="88.0" class="tx-s" text-anchor="start">(2, 0) : 2</text><text x="445.0" y="104.0" class="tx-s" text-anchor="start">(12/7, 8/7) : 20/7</text><text x="445.0" y="120.0" class="tx-s" text-anchor="start">(0, 2) : 2</text><text x="445.0" y="152.0" class="tx-s" text-anchor="start">Contraintes (ii) et (iv) lâches</text><text x="445.0" y="168.0" class="tx-s" text-anchor="start">à l’optimum ⇒ x₂ = x₄ = 0.</text><text x="445.0" y="200.0" class="tx-s" text-anchor="start">(1, 1) = (1/7)(4, 1) + (3/7)(1, 2) :</text><text x="445.0" y="216.0" class="tx-s" text-anchor="start">les poids 1/7 et 3/7 sont x₁, x₃.</text><text x="88.1" y="277.1" class="tx-b t5" text-anchor="start">P<tspan baseline-shift="sub" font-size="75%">ad</tspan></text></svg>
