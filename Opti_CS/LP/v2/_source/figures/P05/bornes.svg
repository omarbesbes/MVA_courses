<svg viewBox="0 0 660 244" role="img" aria-label="Bornes inférieures données par des combinaisons de contraintes, et coûts de points admissibles, sur une même droite" xmlns="http://www.w3.org/2000/svg"><line x1="40.0" y1="100.0" x2="630.0" y2="100.0" class="ax"/><line x1="40.0" y1="100.0" x2="40.0" y2="104.8" class="ax"/><line x1="82.1" y1="100.0" x2="82.1" y2="104.8" class="ax"/><line x1="124.3" y1="100.0" x2="124.3" y2="104.8" class="ax"/><line x1="166.4" y1="100.0" x2="166.4" y2="104.8" class="ax"/><line x1="208.6" y1="100.0" x2="208.6" y2="104.8" class="ax"/><line x1="250.7" y1="100.0" x2="250.7" y2="104.8" class="ax"/><line x1="292.9" y1="100.0" x2="292.9" y2="104.8" class="ax"/><line x1="335.0" y1="100.0" x2="335.0" y2="104.8" class="ax"/><line x1="377.1" y1="100.0" x2="377.1" y2="104.8" class="ax"/><line x1="419.3" y1="100.0" x2="419.3" y2="104.8" class="ax"/><line x1="461.4" y1="100.0" x2="461.4" y2="104.8" class="ax"/><line x1="503.6" y1="100.0" x2="503.6" y2="104.8" class="ax"/><line x1="545.7" y1="100.0" x2="545.7" y2="104.8" class="ax"/><line x1="587.9" y1="100.0" x2="587.9" y2="104.8" class="ax"/><line x1="630.0" y1="100.0" x2="630.0" y2="104.8" class="ax"/><path d="M40.0 103.0L313.9 103.0L313.9 97.0L40.0 97.0Z" class="a5"/><path d="M313.9 103.0L630.0 103.0L630.0 97.0L313.9 97.0Z" class="a1"/><circle cx="40.0" cy="100.0" r="5" class="f5"/><line x1="40.0" y1="106.0" x2="40.0" y2="114.0" class="ln c5 hair"/><text x="40.0" y="126.0" class="tx-b t5" text-anchor="middle">0</text><text x="40.0" y="139.0" class="tx-s t5" text-anchor="middle">p = (0, 0)</text><circle cx="166.4" cy="100.0" r="5" class="f5"/><line x1="166.4" y1="106.0" x2="166.4" y2="144.0" class="ln c5 hair"/><text x="166.4" y="156.0" class="tx-b t5" text-anchor="middle">6</text><text x="166.4" y="169.0" class="tx-s t5" text-anchor="middle">p = (0, 2/3)</text><circle cx="208.6" cy="100.0" r="5" class="f5"/><line x1="208.6" y1="106.0" x2="208.6" y2="114.0" class="ln c5 hair"/><text x="208.6" y="126.0" class="tx-b t5" text-anchor="middle">8</text><text x="208.6" y="139.0" class="tx-s t5" text-anchor="middle">p = (1, 0)</text><circle cx="271.8" cy="100.0" r="5" class="f5"/><line x1="271.8" y1="106.0" x2="271.8" y2="144.0" class="ln c5 hair"/><text x="271.8" y="156.0" class="tx-b t5" text-anchor="middle">11</text><text x="271.8" y="169.0" class="tx-s t5" text-anchor="middle">p = (1, 1/3)</text><circle cx="292.9" cy="100.0" r="5" class="f5"/><line x1="292.9" y1="106.0" x2="292.9" y2="114.0" class="ln c5 hair"/><text x="292.9" y="126.0" class="tx-b t5" text-anchor="middle">12</text><text x="292.9" y="139.0" class="tx-s t5" text-anchor="middle">p = (3/2, 0)</text><circle cx="377.1" cy="100.0" r="5" class="f1"/><line x1="377.1" y1="94.0" x2="377.1" y2="78.0" class="ln c1 hair"/><text x="377.1" y="62.0" class="tx-b t1" text-anchor="middle">16</text><text x="377.1" y="75.0" class="tx-s t1" text-anchor="middle">x = (0, 8)</text><circle cx="608.9" cy="100.0" r="5" class="f1"/><line x1="608.9" y1="94.0" x2="608.9" y2="78.0" class="ln c1 hair"/><text x="608.9" y="62.0" class="tx-b t1" text-anchor="middle">27</text><text x="608.9" y="75.0" class="tx-s t1" text-anchor="middle">x = (9, 0)</text><circle cx="313.9" cy="100.0" r="7" class="f3"/><line x1="313.9" y1="92.0" x2="313.9" y2="78.0" class="ln c3 hair"/><text x="321.9" y="62.0" class="tx-b t3" text-anchor="end">optimum : 13</text><text x="321.9" y="75.0" class="tx-s t3" text-anchor="end">x̄ = (3, 2) et p̄ = (7/5, 1/5)</text><text x="40.0" y="20.0" class="tx-s t5" text-anchor="start">◀ bornes b·p (combinaisons admissibles) : toutes ≤ 13</text><text x="630.0" y="20.0" class="tx-s t1" text-anchor="end">coûts c·x (points admissibles) : tous ≥ 13 ▶</text><text x="330.0" y="218.0" class="tx-s" text-anchor="middle">Aucune borne ne dépasse un coût : c’est la dualité faible.</text><text x="330.0" y="234.0" class="tx-s" text-anchor="middle">La meilleure borne rejoint le meilleur coût : c’est le théorème de dualité.</text></svg>
