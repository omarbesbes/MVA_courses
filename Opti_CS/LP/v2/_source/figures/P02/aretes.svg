<svg viewBox="0 0 660 330" role="img" aria-label="Aretes et bases voisines sur le polygone de l'Exercice 4.2.1" xmlns="http://www.w3.org/2000/svg"><path d="M238.3 70.7L183.3 102.3L128.4 196.8L128.4 259.9L403.1 259.9Z" class="a1"/><path d="M238.3 70.7L183.3 102.3L128.4 196.8L128.4 259.9L403.1 259.9Z" class="ln c1"/><circle cx="128.4" cy="259.9" r="5" class="f3"/><text x="120.4" y="275.9" class="tx-s t3" text-anchor="end">{3, 4, 5}</text><circle cx="403.1" cy="259.9" r="5" class="f3"/><text x="411.1" y="275.9" class="tx-s t3" text-anchor="start">{1, 3, 4}</text><circle cx="238.3" cy="70.7" r="5" class="f3"/><text x="248.3" y="66.7" class="tx-s t3" text-anchor="start">{1, 2, 3}</text><circle cx="183.3" cy="102.3" r="5" class="f3"/><text x="173.3" y="104.3" class="tx-s t3" text-anchor="end">{1, 2, 5}</text><circle cx="128.4" cy="196.8" r="5" class="f3"/><text x="120.4" y="200.8" class="tx-s t3" text-anchor="end">{2, 4, 5}</text><text x="265.7" y="277.9" class="tx-s" text-anchor="middle">x₁ entre, x₅ sort</text><text x="265.7" y="290.9" class="tx-s t1" text-anchor="middle">sur x₂ = 0</text><text x="330.7" y="165.3" class="tx-s" text-anchor="start">x₂ entre, x₄ sort</text><text x="330.7" y="178.3" class="tx-s t1" text-anchor="start">sur x₅ = 0</text><text x="208.8" y="62.5" class="tx-s" text-anchor="end">x₅ entre, x₃ sort</text><text x="208.8" y="75.5" class="tx-s t1" text-anchor="end">sur x₄ = 0</text><text x="141.9" y="145.5" class="tx-s" text-anchor="end">x₄ entre, x₁ sort</text><text x="141.9" y="158.5" class="tx-s t1" text-anchor="end">sur x₃ = 0</text><text x="118.4" y="226.3" class="tx-s" text-anchor="end">x₃ entre, x₂ sort</text><text x="118.4" y="239.3" class="tx-s t1" text-anchor="end">sur x₁ = 0</text><text x="500.0" y="40.0" class="tx-b" text-anchor="start">Deux sommets voisins :</text><text x="500.0" y="58.0" class="tx-s" text-anchor="start">leurs bases ont m − 1 = 2</text><text x="500.0" y="74.0" class="tx-s" text-anchor="start">colonnes en commun.</text><text x="500.0" y="104.0" class="tx-s" text-anchor="start">L'arête est portée par la</text><text x="500.0" y="120.0" class="tx-s" text-anchor="start">droite xᵢ = 0 de la variable</text><text x="500.0" y="136.0" class="tx-s" text-anchor="start">restée hors base dans les</text><text x="500.0" y="152.0" class="tx-s" text-anchor="start">deux bases.</text><text x="500.0" y="182.0" class="tx-s" text-anchor="start">Passer d'un sommet à son</text><text x="500.0" y="198.0" class="tx-s" text-anchor="start">voisin = échanger une colonne :</text><text x="500.0" y="214.0" class="tx-s" text-anchor="start">une variable entre dans la</text><text x="500.0" y="230.0" class="tx-s" text-anchor="start">base, une autre en sort.</text><text x="500.0" y="260.0" class="tx-s t3" text-anchor="start">C'est le pas du simplexe</text><text x="500.0" y="276.0" class="tx-s t3" text-anchor="start">(partie 3).</text></svg>
