<svg viewBox="0 0 660 270" role="img" aria-label="Un demi-plan n'a pas de sommet ; le quadrant positif ne contient aucune droite" xmlns="http://www.w3.org/2000/svg"><path d="M40.0 230.0L260.0 230.0L260.0 180.0L95.0 30.0L40.0 30.0Z" class="a1"/><line x1="260.0" y1="180.0" x2="95.0" y2="30.0" class="ln c1"/><text x="191.2" y="52.5" class="tx-s t1" text-anchor="start">x₁ + x₂ = 1</text><line x1="122.5" y1="55.0" x2="199.5" y2="125.0" class="ln c6" style="stroke-width:3px"/><circle cx="161.0" cy="90.0" r="4.5" class="fk"/><line x1="62.0" y1="125.0" x2="139.0" y2="195.0" class="ln c6" style="stroke-width:3px"/><circle cx="100.5" cy="160.0" r="4.5" class="fk"/><text x="168.0" y="86.0" class="tx-i" text-anchor="start">p</text><text x="107.5" y="156.0" class="tx-i" text-anchor="start">q</text><text x="150.0" y="20.0" class="tx-b" text-anchor="middle">H = {x₁ + x₂ ≤ 1} : aucun sommet</text><text x="150.0" y="252.0" class="tx-s" text-anchor="middle">p ± t(1, −1) ∈ H pour tout t</text><path d="M431.4 201.4L620.0 201.4L620.0 30.0L431.4 30.0Z" class="a1"/><line x1="431.4" y1="201.4" x2="620.0" y2="201.4" class="ln c1"/><line x1="431.4" y1="201.4" x2="431.4" y2="30.0" class="ln c1"/><line x1="400.0" y1="70.0" x2="620.0" y2="170.0" class="ln c6 dash"/><circle cx="525.7" cy="127.1" r="4.5" class="fk"/><text x="529.7" y="119.1" class="tx-i" text-anchor="start">x⁰</text><text x="402.0" y="62.0" class="tx-s t6" text-anchor="start">x⁰ + t d</text><circle cx="431.4" cy="201.4" r="5" class="f3"/><text x="439.4" y="215.4" class="tx-s t3" text-anchor="start">sommet 0</text><text x="510.0" y="20.0" class="tx-b" text-anchor="middle">ℝ²₊ (forme standard) : pas de droite</text><text x="510.0" y="252.0" class="tx-s" text-anchor="middle">x⁰ + t d ≥ 0 pour tout t ∈ ℝ  ⇒  d = 0</text></svg>
