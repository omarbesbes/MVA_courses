<svg viewBox="0 0 660 330" role="img" aria-label="Variante degeneree x1 + x2 &lt;= 7/2 : trois droites passent par (1 ; 5/2)" xmlns="http://www.w3.org/2000/svg"><text x="79.6" y="310.0" class="tx-s" text-anchor="middle">0</text><text x="145.6" y="310.0" class="tx-s" text-anchor="middle">1</text><text x="211.6" y="310.0" class="tx-s" text-anchor="middle">2</text><text x="277.6" y="310.0" class="tx-s" text-anchor="middle">3</text><text x="343.6" y="310.0" class="tx-s" text-anchor="middle">4</text><text x="35.0" y="268.2" class="tx-s" text-anchor="end">0</text><text x="35.0" y="204.5" class="tx-s" text-anchor="end">1</text><text x="35.0" y="140.9" class="tx-s" text-anchor="end">2</text><text x="35.0" y="77.3" class="tx-s" text-anchor="end">3</text><line x1="40.0" y1="264.2" x2="370.0" y2="264.2" class="ax"/><line x1="79.6" y1="296.0" x2="79.6" y2="16.0" class="ax"/><path d="M145.6 105.1L79.6 200.5L79.6 264.2L310.6 264.2Z" class="a1"/><line x1="79.6" y1="296.0" x2="79.6" y2="16.0" class="ln cm thin"/><line x1="40.0" y1="264.2" x2="370.0" y2="264.2" class="ln cm thin"/><line x1="40.0" y1="257.8" x2="207.2" y2="16.0" class="ln cm thin"/><text x="212.3" y="28.0" class="tx-s" text-anchor="start">x₃ = 0</text><line x1="40.0" y1="156.0" x2="330.4" y2="16.0" class="ln cm thin"/><text x="332.1" y="32.0" class="tx-s" text-anchor="start">x₄ = 0</text><line x1="343.6" y1="296.0" x2="53.2" y2="16.0" class="ln cm thin"/><text x="314.6" y="238.2" class="tx-s" text-anchor="start">x₅ = 0</text><path d="M145.6 105.1L79.6 200.5L79.6 264.2L310.6 264.2Z" class="ln c1"/><circle cx="145.6" cy="105.1" r="5" class="f1"/><circle cx="145.6" cy="105.1" r="5" class="f1"/><circle cx="145.6" cy="105.1" r="5" class="f1"/><circle cx="310.6" cy="264.2" r="5" class="f1"/><circle cx="79.6" cy="200.5" r="5" class="f1"/><circle cx="79.6" cy="264.2" r="5" class="f1"/><circle cx="145.6" cy="105.1" r="8" class="ln c3 nofill"/><circle cx="145.6" cy="105.1" r="5" class="f3"/><text x="133.6" y="97.1" class="tx-b t3" text-anchor="end">(1 ; 5/2)</text><text x="395.0" y="40.0" class="tx-b" text-anchor="start">Trois bases, un seul point :</text><text x="395.0" y="72.0" class="tx-s" text-anchor="start">B = {1, 2, 3} :  x₄ = x₅ = 0</text><text x="407.0" y="88.0" class="tx-s t3" text-anchor="start">x<tspan baseline-shift="sub" font-size="75%">B</tspan> = (x₁, x₂, x₃) = (1, 5/2, 0)</text><text x="395.0" y="118.0" class="tx-s" text-anchor="start">B = {1, 2, 4} :  x₃ = x₅ = 0</text><text x="407.0" y="134.0" class="tx-s t3" text-anchor="start">x<tspan baseline-shift="sub" font-size="75%">B</tspan> = (x₁, x₂, x₄) = (1, 5/2, 0)</text><text x="395.0" y="164.0" class="tx-s" text-anchor="start">B = {1, 2, 5} :  x₃ = x₄ = 0</text><text x="407.0" y="180.0" class="tx-s t3" text-anchor="start">x<tspan baseline-shift="sub" font-size="75%">B</tspan> = (x₁, x₂, x₅) = (1, 5/2, 0)</text><text x="395.0" y="222.0" class="tx-s" text-anchor="start">Chaque fois une variable de base est nulle :</text><text x="395.0" y="238.0" class="tx-s" text-anchor="start">x = (1, 5/2, 0, 0, 0) n'a que 2 &lt; m = 3</text><text x="395.0" y="254.0" class="tx-s" text-anchor="start">composantes non nulles. Trois droites</text><text x="395.0" y="270.0" class="tx-s" text-anchor="start">xᵢ = 0 au lieu de n − m = 2 s'y croisent.</text></svg>
