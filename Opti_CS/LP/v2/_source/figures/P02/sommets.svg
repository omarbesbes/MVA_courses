<svg viewBox="0 0 660 300" role="img" aria-label="Sommet ou pas : un sommet du polygone, un point d'une arête, un point intérieur" xmlns="http://www.w3.org/2000/svg"><text x="57.2" y="286.0" class="tx-s" text-anchor="middle">0</text><text x="115.3" y="286.0" class="tx-s" text-anchor="middle">1</text><text x="173.4" y="286.0" class="tx-s" text-anchor="middle">2</text><text x="231.4" y="286.0" class="tx-s" text-anchor="middle">3</text><text x="289.5" y="286.0" class="tx-s" text-anchor="middle">4</text><text x="347.5" y="286.0" class="tx-s" text-anchor="middle">5</text><text x="29.0" y="252.7" class="tx-s" text-anchor="end">0</text><text x="29.0" y="194.6" class="tx-s" text-anchor="end">1</text><text x="29.0" y="136.5" class="tx-s" text-anchor="end">2</text><text x="29.0" y="78.3" class="tx-s" text-anchor="end">3</text><line x1="34.0" y1="248.7" x2="394.0" y2="248.7" class="ax"/><line x1="57.2" y1="272.0" x2="57.2" y2="22.0" class="ax"/><text x="394.0" y="300.0" class="tx-s" text-anchor="end">x₁</text><text x="38.0" y="16.0" class="tx-s" text-anchor="start">x₂</text><path d="M173.4 74.3L115.3 103.4L57.2 190.6L57.2 248.7L347.5 248.7Z" class="a1"/><path d="M173.4 74.3L115.3 103.4L57.2 190.6L57.2 248.7L347.5 248.7Z" class="ln c1"/><circle cx="173.4" cy="74.3" r="5.5" class="f3"/><text x="181.4" y="68.3" class="tx-s t3" text-anchor="start">sommet (2 ; 3)</text><line x1="231.4" y1="132.5" x2="289.5" y2="190.6" class="ln c6" style="stroke-width:3.2px"/><circle cx="231.4" cy="132.5" r="3.5" class="f6"/><circle cx="289.5" cy="190.6" r="3.5" class="f6"/><circle cx="260.5" cy="161.5" r="4.5" class="fk"/><text x="270.5" y="157.5" class="tx-s" text-anchor="start">(7/2 ; 3/2) = milieu de</text><text x="270.5" y="170.5" class="tx-s" text-anchor="start">(3 ; 2) et (4 ; 1)</text><line x1="86.3" y1="190.6" x2="144.3" y2="190.6" class="ln c6" style="stroke-width:3.2px"/><line x1="115.3" y1="219.7" x2="115.3" y2="161.5" class="ln c6" style="stroke-width:3.2px"/><circle cx="115.3" cy="190.6" r="4.5" class="fk"/><text x="121.3" y="206.6" class="tx-s" text-anchor="start">(1 ; 1)</text><text x="530.0" y="40.0" class="tx-s" text-anchor="middle">Si x = θy + (1−θ)z avec y ≠ z,</text><text x="530.0" y="54.0" class="tx-s" text-anchor="middle">x est aussi le milieu d'un segment</text><line x1="430.0" y1="150" x2="615.0" y2="150" class="ln cm thin"/><circle cx="430.0" cy="150" r="4" class="fm"/><text x="430.0" y="172.0" class="tx-i" text-anchor="middle">y</text><circle cx="615.0" cy="150" r="4" class="fm"/><text x="615.0" y="172.0" class="tx-i" text-anchor="middle">z</text><line x1="491.7" y1="150" x2="615.0" y2="150" class="ln c6" style="stroke-width:3.2px"/><circle cx="553.3" cy="150" r="4.5" class="fk"/><text x="553.3" y="138.0" class="tx-i" text-anchor="middle">x</text><text x="491.7" y="194.0" class="tx-s" text-anchor="middle">x + u</text><text x="615.0" y="194.0" class="tx-s" text-anchor="middle">x − u = z</text><text x="530.0" y="230.0" class="tx-s" text-anchor="middle">θ = 1/3 ;  u = δ(y − z), δ = min(θ, 1−θ)</text><text x="530.0" y="246.0" class="tx-s" text-anchor="middle">x ± u restent sur [y, z], donc dans X<tspan baseline-shift="sub" font-size="75%">ad</tspan></text></svg>
