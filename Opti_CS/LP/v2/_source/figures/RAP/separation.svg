rojection (Th. 5.1.3) :</text><text x="455.0" y="59.0" class="tx-s" text-anchor="start">le point de K le plus proche</text><text x="455.0" y="78.0" class="tx-s" text-anchor="start">de x₀ ; ici sur le côté</text><text x="455.0" y="97.0" class="tx-s" text-anchor="start">x₁ + x₂ = 5, à distance 3/√2.</text><text x="455.0" y="135.0" class="tx-b" text-anchor="start">Séparation (Th. 5.1.12) :</text><text x="455.0" y="173.0" class="tx-s t5" text-anchor="start">= −3/2 (y₁ + y₂),</text><text x="455.0" y="192.0" class="tx-s t5" text-anchor="start">α = −39/4.</text><text x="455.0" y="211.0" class="tx-s" text-anchor="start">L(x₀) = −12 &lt; α</text><text x="455.0" y="230.0" class="tx-s" text-anchor="start">&lt; −15/2 ≤ L(x), x ∈ K.</text><text x="455.0" y="154.0" class="tx-s t5" text-anchor="start"><tspan>L(y) = (x</tspan><tspan baseline-shift="sub" font-size="75%">K</tspan><tspan> − x₀)·y</tspan></text></svg>
