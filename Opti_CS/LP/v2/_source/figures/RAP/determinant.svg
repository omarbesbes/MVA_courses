<svg viewBox="0 0 660 270" role="img" aria-label="Le déterminant de deux vecteurs du plan est l'aire signée du parallélogramme qu'ils engendrent" xmlns="http://www.w3.org/2000/svg"><defs><marker id="RAP-determinant-arr-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fk"/></marker><marker id="RAP-determinant-arr-6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f6"/></marker></defs><line x1="62.5" y1="247.5" x2="62.5" y2="22.0" class="gr"/><line x1="107.6" y1="247.5" x2="107.6" y2="22.0" class="gr"/><line x1="152.7" y1="247.5" x2="152.7" y2="22.0" class="gr"/><line x1="197.8" y1="247.5" x2="197.8" y2="22.0" class="gr"/><line x1="242.9" y1="247.5" x2="242.9" y2="22.0" class="gr"/><line x1="40.0" y1="224.9" x2="270.0" y2="224.9" class="gr"/><line x1="40.0" y1="179.8" x2="270.0" y2="179.8" class="gr"/><line x1="40.0" y1="134.7" x2="270.0" y2="134.7" class="gr"/><line x1="40.0" y1="89.6" x2="270.0" y2="89.6" class="gr"/><line x1="40.0" y1="44.5" x2="270.0" y2="44.5" class="gr"/><line x1="40.0" y1="224.9" x2="270.0" y2="224.9" class="ax"/><line x1="62.5" y1="247.5" x2="62.5" y2="22.0" class="ax"/><path d="M62.5 224.9L152.7 179.8L197.8 44.5L107.6 89.6Z" class="a1"/><path d="M62.5 224.9L152.7 179.8L197.8 44.5L107.6 89.6Z" class="ln c1 thin"/><path d="M62.5 224.9L107.6 224.9L107.6 179.8L62.5 179.8Z" class="am"/><line x1="62.5" y1="224.9" x2="152.7" y2="179.8" class="ln ck thin" marker-end="url(#RAP-determinant-arr-k)"/><line x1="62.5" y1="224.9" x2="107.6" y2="89.6" class="ln ck thin" marker-end="url(#RAP-determinant-arr-k)"/><circle cx="62.5" cy="224.9" r="2" class="fm"/><circle cx="62.5" cy="179.8" r="2" class="fm"/><circle cx="62.5" cy="134.7" r="2" class="fm"/><circle cx="62.5" cy="89.6" r="2" class="fm"/><circle cx="62.5" cy="44.5" r="2" class="fm"/><circle cx="107.6" cy="224.9" r="2" class="fm"/><circle cx="107.6" cy="179.8" r="2" class="fm"/><circle cx="107.6" cy="134.7" r="2" class="fm"/><circle cx="107.6" cy="89.6" r="2" class="fm"/><circle cx="107.6" cy="44.5" r="2" class="fm"/><circle cx="152.7" cy="224.9" r="2" class="fm"/><circle cx="152.7" cy="179.8" r="2" class="fm"/><circle cx="152.7" cy="134.7" r="2" class="fm"/><circle cx="152.7" cy="89.6" r="2" class="fm"/><circle cx="152.7" cy="44.5" r="2" class="fm"/><circle cx="197.8" cy="224.9" r="2" class="fm"/><circle cx="197.8" cy="179.8" r="2" class="fm"/><circle cx="197.8" cy="134.7" r="2" class="fm"/><circle cx="197.8" cy="89.6" r="2" class="fm"/><circle cx="197.8" cy="44.5" r="2" class="fm"/><circle cx="242.9" cy="224.9" r="2" class="fm"/><circle cx="242.9" cy="179.8" r="2" class="fm"/><circle cx="242.9" cy="134.7" r="2" class="fm"/><circle cx="242.9" cy="89.6" r="2" class="fm"/><circle cx="242.9" cy="44.5" r="2" class="fm"/><rect x="155.7" y="180.8" width="74.2" height="15" rx="3" class="lbl-bg"/><text x="158.7" y="191.8" class="tx-s" text-anchor="start">a₁ = (2, 1)</text><rect x="30.4" y="74.6" width="74.2" height="15" rx="3" class="lbl-bg"/><text x="101.6" y="85.6" class="tx-s" text-anchor="end">a₂ = (1, 3)</text><text x="85.1" y="206.4" class="tx-s" text-anchor="middle">1</text><text x="300.0" y="40.0" class="tx-b" text-anchor="start">det(a₁, a₂) = 2·3 − 1·1 = 5</text><text x="300.0" y="59.0" class="tx-s t1" text-anchor="start">aire du parallélogramme = 5 (bleu)</text><text x="300.0" y="78.0" class="tx-s" text-anchor="start">= 5 fois l'aire du carré unité (gris) ;</text><text x="300.0" y="97.0" class="tx-s" text-anchor="start">det(a₂, a₁) = −5 : l'ordre des colonnes</text><text x="300.0" y="116.0" class="tx-s" text-anchor="start">change le signe, pas l'aire.</text><text x="300.0" y="154.0" class="tx-b" text-anchor="start">Colonnes liées : a₁ = (2, 1), a₂′ = (4, 2) = 2a₁</text><text x="300.0" y="173.0" class="tx-s" text-anchor="start">det(a₁, a₂′) = 2·2 − 4·1 = 0 : le parallélogramme</text><text x="300.0" y="192.0" class="tx-s t6" text-anchor="start">est aplati sur une droite (trait rose).</text><line x1="308.2" y1="252.4" x2="362.7" y2="239.1" class="ln ck thin" marker-end="url(#RAP-determinant-arr-k)"/><line x1="308.2" y1="252.4" x2="471.8" y2="212.6" class="ln c6"/><line x1="308.2" y1="252.4" x2="417.3" y2="225.9" class="ln c6 thin" marker-end="url(#RAP-determinant-arr-6)"/><text x="423.3" y="235.9" class="tx-s t6" text-anchor="start">a₂′</text><text x="358.7" y="235.1" class="tx-s" text-anchor="end">a₁</text></svg>
