<svg viewBox="0 0 640 300" role="img" aria-label="Phase I puis phase II : trouver un sommet, puis l'améliorer" xmlns="http://www.w3.org/2000/svg"><defs><marker id="P03-phases-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fm"/></marker></defs><rect x="20" y="20" width="180" height="56" rx="8" class="am"/><rect x="20" y="20" width="180" height="56" rx="8" class="ln cm hair nofill"/><text x="110.0" y="38.0" class="tx-b" text-anchor="middle">Problème (4.1)</text><text x="110.0" y="54.0" class="tx-s" text-anchor="middle">Ax = b, x ≥ 0</text><rect x="20" y="120" width="180" height="56" rx="8" class="am"/><rect x="20" y="120" width="180" height="56" rx="8" class="ln cm hair nofill"/><text x="110.0" y="138.0" class="tx" text-anchor="middle">Rendre b ≥ 0</text><text x="110.0" y="154.0" class="tx-s" text-anchor="middle">lignes où bᵢ &lt; 0 : × (−1)</text><rect x="240" y="120" width="190" height="72" rx="8" class="a4"/><rect x="240" y="120" width="190" height="72" rx="8" class="ln cm hair nofill"/><text x="335.0" y="138.0" class="tx-b" text-anchor="middle">Phase I : (4.8)</text><text x="335.0" y="154.0" class="tx-s" text-anchor="middle">min Σ yᵢ, Ax + y = b,</text><text x="335.0" y="170.0" class="tx-s" text-anchor="middle">x ≥ 0, y ≥ 0 ; départ (0, b)</text><rect x="470" y="20" width="150" height="56" rx="8" class="a2"/><rect x="470" y="20" width="150" height="56" rx="8" class="ln cm hair nofill"/><text x="545.0" y="38.0" class="tx-b" text-anchor="middle">Valeur &gt; 0</text><text x="545.0" y="54.0" class="tx-s" text-anchor="middle">Xad est vide : stop</text><rect x="470" y="120" width="150" height="72" rx="8" class="a3"/><rect x="470" y="120" width="150" height="72" rx="8" class="ln cm hair nofill"/><text x="545.0" y="138.0" class="tx-b" text-anchor="middle">Valeur = 0</text><text x="545.0" y="154.0" class="tx-s" text-anchor="middle">y = 0 ; chasser les yᵢ</text><text x="545.0" y="170.0" class="tx-s" text-anchor="middle">restés en base à 0</text><rect x="470" y="228" width="150" height="56" rx="8" class="a3"/><rect x="470" y="228" width="150" height="56" rx="8" class="ln cm hair nofill"/><text x="545.0" y="246.0" class="tx-b" text-anchor="middle">Phase II</text><text x="545.0" y="262.0" class="tx-s" text-anchor="middle">simplexe sur c</text><rect x="240" y="228" width="190" height="56" rx="8" class="am"/><rect x="240" y="228" width="190" height="56" rx="8" class="ln cm hair nofill"/><text x="335.0" y="246.0" class="tx-b" text-anchor="middle">Résultat</text><text x="335.0" y="262.0" class="tx-s" text-anchor="middle">sommet optimal ou −∞</text><line x1="110.0" y1="76.0" x2="110.0" y2="118.0" class="ln cm thin" marker-end="url(#P03-phases-arr-m)"/><line x1="200.0" y1="148.0" x2="238.0" y2="148.0" class="ln cm thin" marker-end="url(#P03-phases-arr-m)"/><line x1="430.0" y1="140.0" x2="468.0" y2="66.0" class="ln cm thin" marker-end="url(#P03-phases-arr-m)"/><line x1="430.0" y1="160.0" x2="468.0" y2="160.0" class="ln cm thin" marker-end="url(#P03-phases-arr-m)"/><line x1="545.0" y1="192.0" x2="545.0" y2="226.0" class="ln cm thin" marker-end="url(#P03-phases-arr-m)"/><line x1="470.0" y1="256.0" x2="432.0" y2="256.0" class="ln cm thin" marker-end="url(#P03-phases-arr-m)"/></svg>
