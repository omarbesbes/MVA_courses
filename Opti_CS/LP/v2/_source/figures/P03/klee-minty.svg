<svg viewBox="0 0 640 330" role="img" aria-label="Le cube déformé de Klee et Minty (n = 3) : la règle du plus négatif visite les 8 sommets" xmlns="http://www.w3.org/2000/svg"><defs><marker id="P03-klee-minty-arr-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f3"/></marker></defs><line x1="130.0" y1="300.0" x2="350.0" y2="260.0" class="ln cm hair"/><line x1="130.0" y1="300.0" x2="240.0" y2="230.0" class="ln cm hair"/><line x1="130.0" y1="300.0" x2="130.0" y2="90.0" class="ln cm hair"/><line x1="130.0" y1="90.0" x2="350.0" y2="117.2" class="ln cm hair"/><line x1="130.0" y1="90.0" x2="240.0" y2="188.0" class="ln cm hair"/><line x1="240.0" y1="230.0" x2="372.0" y2="246.0" class="ln cm hair"/><line x1="240.0" y1="230.0" x2="240.0" y2="188.0" class="ln cm hair"/><line x1="240.0" y1="188.0" x2="372.0" y2="136.8" class="ln cm hair"/><line x1="350.0" y1="260.0" x2="372.0" y2="246.0" class="ln cm hair"/><line x1="350.0" y1="260.0" x2="350.0" y2="117.2" class="ln cm hair"/><line x1="350.0" y1="117.2" x2="372.0" y2="136.8" class="ln cm hair"/><line x1="372.0" y1="246.0" x2="372.0" y2="136.8" class="ln cm hair"/><line x1="135.9" y1="298.9" x2="342.1" y2="261.4" class="ln c3 thin" marker-end="url(#P03-klee-minty-arr-3)"/><line x1="355.1" y1="256.8" x2="365.3" y2="250.3" class="ln c3 thin" marker-end="url(#P03-klee-minty-arr-3)"/><line x1="366.0" y1="245.3" x2="247.9" y2="231.0" class="ln c3 thin" marker-end="url(#P03-klee-minty-arr-3)"/><line x1="240.0" y1="224.0" x2="240.0" y2="196.0" class="ln c3 thin" marker-end="url(#P03-klee-minty-arr-3)"/><line x1="245.6" y1="185.8" x2="364.5" y2="139.7" class="ln c3 thin" marker-end="url(#P03-klee-minty-arr-3)"/><line x1="367.5" y1="132.8" x2="356.0" y2="122.5" class="ln c3 thin" marker-end="url(#P03-klee-minty-arr-3)"/><line x1="344.0" y1="116.5" x2="137.9" y2="91.0" class="ln c3 thin" marker-end="url(#P03-klee-minty-arr-3)"/><circle cx="130.0" cy="300.0" r="4.5" class="f3"/><text x="120.0" y="314.0" class="tx-s" text-anchor="end">0 : (0, 0, 0)</text><circle cx="350.0" cy="260.0" r="4.5" class="f3"/><text x="358.0" y="274.0" class="tx-s" text-anchor="start">1 : (5, 0, 0)</text><circle cx="372.0" cy="246.0" r="4.5" class="f3"/><text x="382.0" y="250.0" class="tx-s" text-anchor="start">2 : (5, 5, 0)</text><circle cx="240.0" cy="230.0" r="4.5" class="f3"/><text x="230.0" y="234.0" class="tx-s" text-anchor="end">3 : (0, 25, 0)</text><circle cx="240.0" cy="188.0" r="4.5" class="f3"/><text x="230.0" y="184.0" class="tx-s" text-anchor="end">4 : (0, 25, 25)</text><circle cx="372.0" cy="136.8" r="4.5" class="f3"/><text x="382.0" y="138.8" class="tx-s" text-anchor="start">5 : (5, 5, 65)</text><circle cx="350.0" cy="117.2" r="4.5" class="f3"/><text x="360.0" y="121.2" class="tx-s" text-anchor="start">6 : (5, 0, 85)</text><circle cx="130.0" cy="90.0" r="6.5" class="f3"/><text x="120.0" y="88.0" class="tx-s" text-anchor="end">7 : (0, 0, 125)</text><text x="458.0" y="28.0" class="tx-b" text-anchor="start">max 4x₁ + 2x₂ + x₃ sous</text><text x="458.0" y="46.0" class="tx-s" text-anchor="start">x₁ ≤ 5,  4x₁ + x₂ ≤ 25,</text><text x="458.0" y="62.0" class="tx-s" text-anchor="start">8x₁ + 4x₂ + x₃ ≤ 125,  x ≥ 0</text><text x="458.0" y="92.0" class="tx-s" text-anchor="start">Coûts 4x₁ + 2x₂ + x₃ visités :</text><text x="458.0" y="108.0" class="tx-s t3" text-anchor="start">0 → 20 → 30 → 50 →</text><text x="458.0" y="124.0" class="tx-s t3" text-anchor="start">75 → 95 → 105 → 125</text><text x="458.0" y="154.0" class="tx-s" text-anchor="start">7 pivots, chacun améliore le coût :</text><text x="458.0" y="170.0" class="tx-s" text-anchor="start">il passe par les 8 sommets.</text><text x="458.0" y="200.0" class="tx-b" text-anchor="start">En dimension n : 2ⁿ − 1 pivots</text><text x="458.0" y="218.0" class="tx-s" text-anchor="start">(vérifié pour n = 1, …, 10 ;</text><text x="458.0" y="234.0" class="tx-s" text-anchor="start">n = 10 : 1023 pivots).</text><text x="458.0" y="264.0" class="tx-s" text-anchor="start">Les axes sont déformés (x₁ ≤ 5,</text><text x="458.0" y="280.0" class="tx-s" text-anchor="start">x₂ ≤ 25, x₃ ≤ 125) pour la lisibilité.</text></svg>
