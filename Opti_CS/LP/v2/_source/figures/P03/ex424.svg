.6" x2="172.5" y2="14.0" class="ln c2 hair dash"/><line x1="189.0" y1="246.0" x2="315.5" y2="48.4" class="ln c2 hair dash"/><line x1="101.0" y1="208.9" x2="101.0" y2="132.7" class="ln c3" marker-end="url(#P03-ex424-arr-3)"/><circle cx="101.0" cy="211.6" r="3.5" class="fm"/><circle cx="321.0" cy="211.6" r="3.5" class="fm"/><circle cx="156.0" cy="82.7" r="3.5" class="fm"/><circle cx="101.0" cy="125.7" r="3.5" class="fm"/><circle cx="101.0" cy="211.6" r="5" class="f3"/><circle cx="101.0" cy="125.7" r="6.5" class="f3"/><text x="109.0" y="205.6" class="tx-b t3" text-anchor="start">x⁰</text><text x="110.0" y="117.7" class="tx-b t3" text-anchor="start">x¹</text><text x="164.0" y="78.7" class="tx-s" text-anchor="start">(1/4 ; 3/4)</text><text x="328.0" y="206.6" class="tx-s" text-anchor="start">(1 ; 0)</text><line x1="204.4" y1="180.7" x2="169.2" y2="166.9" class="ln c2 thin" marker-end="url(#P03-ex424-arr-2)"/><text x="208.4" y="184.7" class="tx-b t2" text-anchor="start">−c</text><text x="410.0" y="32.0" class="tx-b" text-anchor="start">Sommets et coûts 2x₁ − x₂ :</text><text x="410.0" y="58.0" class="tx-s" text-anchor="start">x⁰ = (0 ; 0)</text><text x="510.0" y="58.0" class="tx-s" text-anchor="start">0</text><text x="410.0" y="78.0" class="tx-s" text-anchor="start">(1 ; 0)</text><text x="510.0" y="78.0" class="tx-s" text-anchor="start">2</text><text x="410.0" y="98.0" class="tx-s" text-anchor="start">(1/4 ; 3/4)</text><text x="510.0" y="98.0" class="tx-s" text-anchor="start">−1/4</text><text x="410.0" y="118.0" class="tx-s t3" text-anchor="start">x¹ = (0 ; 1/2)</text><text x="510.0" y="118.0" class="tx-s t3" text-anchor="start">−1/2  minimum</text><text x="410.0" y="158.0" class="tx-s" text-anchor="start">Un seul pivot depuis x⁰ :</text><text x="410.0" y="174.0" class="tx-s" text-anchor="start">x₂ entre (c̃₂ = −1), x₄ sort,</text><text x="410.0" y="190.0" class="tx-s" text-anchor="start">ε = min(1/1, (1/2)/1) = 1/2.</text><text x="410.0" y="210.0" class="tx-s t3" text-anchor="start">Puis c̃₁ = 1 et c̃₄ = 1 : optimal.</text><text x="410.0" y="240.0" class="tx-s t2" text-anchor="start">Tirets : 2x₁ − x₂ = 1, 0, −1/2</text><text x="410.0" y="256.0" class="tx-s t2" text-anchor="start">(de droite à gauche).</text></svg>
