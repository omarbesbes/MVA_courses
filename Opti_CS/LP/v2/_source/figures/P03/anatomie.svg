<svg viewBox="0 0 640 220" role="img" aria-label="Le tableau du simplexe : B⁻¹A et B⁻¹b, puis la ligne des coûts réduits" xmlns="http://www.w3.org/2000/svg"><rect x="170" y="30" width="300" height="110" class="a1"/><rect x="470" y="30" width="90" height="110" class="a3"/><rect x="170" y="140" width="300" height="44" class="a2"/><rect x="470" y="140" width="90" height="44" class="am"/><rect x="170" y="30" width="390" height="154" class="ln cm thin nofill"/><line x1="470" y1="30" x2="470" y2="184" class="ln cm thin"/><line x1="170" y1="140" x2="560" y2="140" class="ln cm thin"/><text x="320.0" y="80.0" class="tx-b" text-anchor="middle">B⁻¹A</text><text x="320.0" y="100.0" class="tx-s" text-anchor="middle">colonnes de base : vecteurs eⱼ ; colonne i : d = B⁻¹aᵢ</text><text x="515.0" y="80.0" class="tx-b" text-anchor="middle">B⁻¹b</text><text x="515.0" y="100.0" class="tx-s" text-anchor="middle">= x<tspan baseline-shift="sub" font-size="75%">B</tspan></text><text x="320.0" y="167.0" class="tx-b t2" text-anchor="middle">c̃ᵀ = cᵀ − c<tspan baseline-shift="sub" font-size="75%">B</tspan>ᵀ B⁻¹A  (0 sur la base)</text><text x="515.0" y="167.0" class="tx-b" text-anchor="middle">−c·x</text><text x="160.0" y="60.0" class="tx-s" text-anchor="end">1re variable de base</text><text x="160.0" y="90.0" class="tx-s" text-anchor="end">…</text><text x="160.0" y="120.0" class="tx-s" text-anchor="end">m-ième variable de base</text><text x="160.0" y="167.0" class="tx-s t2" text-anchor="end">coûts réduits</text><text x="320.0" y="20.0" class="tx-s" text-anchor="middle">une colonne par variable x₁ … xₙ</text><text x="515.0" y="20.0" class="tx-s" text-anchor="middle">second membre</text><text x="320.0" y="212.0" class="tx-s" text-anchor="middle">Un pivot = une élimination de Gauss–Jordan sur tout le tableau, ligne des coûts comprise.</text></svg>
