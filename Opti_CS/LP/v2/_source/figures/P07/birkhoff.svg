" text-anchor="middle">une ombre plane de B₃ (6 permutations)</text><text x="460.0" y="290.0" class="tx-s" text-anchor="middle">abscisse : coût Σ cᵢⱼ vᵢⱼ de l'exemple 3 × 3 ; ordonnée : 2v₂₂ + 3v₃₂</text><text x="460.0" y="306.0" class="tx-s t3" text-anchor="middle">le minimum du coût est atteint en un sommet : σ = (2,3,1), coût 11</text></svg>
