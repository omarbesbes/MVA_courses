<svg viewBox="0 0 660 372" role="img" aria-label="Four ways to produce a draft: a separate small model, a head on the target, a lookup, a block drafter; for each, where its knowledge comes from and how many passes a draft costs." xmlns="http://www.w3.org/2000/svg"><defs><marker id="02-drafters-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fm"/></marker></defs><text x="190.0" y="16.0" class="tx-s" text-anchor="middle">what it knows</text><text x="350.0" y="16.0" class="tx-s" text-anchor="middle">how it drafts</text><text x="548.0" y="16.0" class="tx-s" text-anchor="middle">cost of a draft</text><text x="14.0" y="56.0" class="tx-b" text-anchor="start">separate</text><text x="14.0" y="73.0" class="tx-b" text-anchor="start">small model</text><rect x="112.0" y="34.0" width="156.0" height="48.0" rx="8" class="a2 ln c2 thin"/><text x="190.0" y="62.5" class="tx" text-anchor="middle">its own weights</text><line x1="269.0" y1="58.0" x2="288.0" y2="58.0" class="ln cm thin" marker-end="url(#02-drafters-arr-m)"/><rect x="290.0" y="34.0" width="136.0" height="48.0" rx="8" class="a2 ln c2 thin"/><text x="358.0" y="54.5" class="tx-b" text-anchor="middle">one token per pass</text><text x="358.0" y="70.5" class="tx" text-anchor="middle">of the small model</text><line x1="427.0" y1="58.0" x2="446.0" y2="58.0" class="ln cm thin" marker-end="url(#02-drafters-arr-m)"/><rect x="452.0" y="36.0" width="22.0" height="24.0" rx="5" class="a2 ln c2 thin"/><text x="463.0" y="52.5" class="tx-m" text-anchor="middle">1</text><rect x="480.0" y="36.0" width="22.0" height="24.0" rx="5" class="a2 ln c2 thin"/><text x="491.0" y="52.5" class="tx-m" text-anchor="middle">2</text><rect x="508.0" y="36.0" width="22.0" height="24.0" rx="5" class="a2 ln c2 thin"/><text x="519.0" y="52.5" class="tx-m" text-anchor="middle">3</text><rect x="536.0" y="36.0" width="22.0" height="24.0" rx="5" class="a2 ln c2 thin"/><text 