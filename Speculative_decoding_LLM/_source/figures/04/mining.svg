<svg viewBox="0 0 660 250" role="img" aria-label="Swap the drafter's token into the target's answer, regenerate the rest, compare the final answers." xmlns="http://www.w3.org/2000/svg"><defs><marker id="04-mining-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fm"/></marker></defs><rect x="16.0" y="20.0" width="190.0" height="52.0" rx="8" class="a1 ln c1 thin"/><text x="111.0" y="42.5" class="tx-b" text-anchor="middle">target's answer y</text><text x="111.0" y="58.5" class="tx" text-anchor="middle">final answer α</text><line x1="207.0" y1="46.0" x2="244.0" y2="46.0" class="ln cm thin" marker-end="url(#04-mining-arr-m)"/><rect x="246.0" y="20.0" width="190.0" height="52.0" rx="8" class="a2 ln c2 thin"/><text x="341.0" y="42.5" class="tx-b" text-anchor="middle">first mismatch t:</text><text x="341.0" y="58.5" class="tx" text-anchor="middle">swap in the drafter's token</text><line x1="437.0" y1="46.0" x2="474.0" y2="46.0" class="ln cm thin" marker-end="url(#04-mining-arr-m)"/><rect x="476.0" y="20.0" width="168.0" height="52.0" rx="8" class="a1 ln c1 thin"/><text x="560.0" y="42.5" class="tx-b" text-anchor="middle">target regenerates</text><text x="560.0" y="58.5" class="tx" text-anchor="middle">the rest → answer α′</text><line x1="560.0" y1="73.0" x2="560.0" y2="108.0" class="ln cm thin" marker-end="url(#04-mining-arr-m)"/><rect x="476.0" y="110.0" width="168.0" height="40.0" rx="8" class="am ln cm thin"/><text x="560.0" y="134.5" class="tx" text-anchor="middle">is α′ equivalent to α?</text><line x1="475.0" y1="130.0" x2="352.0" y2="130.0" class="ln cm thin" marker-end="url(#04-mining-arr-m)"/><text x="414.0" y="124.0" class="tx-s" text-anchor="middle">yes</text><rect x="160.0" y="104.0" width="190.0" height="52.0" rx="8" class="a4 ln c4 thin"/><text x="255.0" y="126.5" class="tx-b" text-anchor="middle">label: unimportant</text><text x="255.0" y="142.5" class="tx" text-anchor="middle">keep the new text as y</text><path d="M160 130 H110 V74" class="ln cm thin nofill"/><line x1="110.0" y1="84.0" x2="110.0" y2="74.0" class="ln cm thin" marker-end="url(#04-mining-arr-m)"/><line x1="560.0" y1="151.0" x2="560.0" y2="186.0" class="ln cm thin" marker-end="url(#04-mining-arr-m)"/><text x="570.0" y="172.0" class="tx-s" text-anchor="start">no</text><rect x="446.0" y="188.0" width="198.0" height="52.0" rx="8" class="a6 ln c6 thin"/><text x="545.0" y="210.5" class="tx-b" text-anchor="middle">label: important</text><text x="545.0" y="226.5" class="tx" text-anchor="middle">keep the target's token</text><text x="124.0" y="206.0" class="tx-s" text-anchor="start">in both cases, continue with the next mismatch</text><path d="M446 214 H60 V74" class="ln cm thin nofill"/><line x1="60.0" y1="84.0" x2="60.0" y2="74.0" class="ln cm thin" marker-end="url(#04-mining-arr-m)"/></svg>
