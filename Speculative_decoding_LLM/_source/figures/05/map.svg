<svg viewBox="0 0 660 330" role="img" aria-label="A two by two map of methods: unit of acceptance (token or step) against whether the large model still processes what is accepted." xmlns="http://www.w3.org/2000/svg"><text x="294.0" y="30.0" class="tx-b" text-anchor="middle">unit accepted: a token</text><text x="530.0" y="30.0" class="tx-b" text-anchor="middle">unit accepted: a step</text><text x="14.0" y="78.0" class="tx-b" text-anchor="start">the large model</text><text x="14.0" y="94.0" class="tx-b" text-anchor="start">still processes</text><text x="14.0" y="110.0" class="tx-b" text-anchor="start">what is accepted</text><text x="14.0" y="126.0" class="tx-s" text-anchor="start">→ latency saved,</text><text x="14.0" y="142.0" class="tx-s" text-anchor="start">   compute not</text><rect x="180.0" y="48.0" width="228.0" height="126.0" rx="8" class="a1 ln c1 thin"/><text x="194.0" y="78.0" class="tx" text-anchor="start">exact speculative decoding</text><text x="194.0" y="97.0" class="tx" text-anchor="start">(pages 1–2)</text><text x="194.0" y="116.0" class="tx" text-anchor="start">relaxed acceptance (page 3)</text><text x="194.0" y="135.0" class="tx" text-anchor="start">judges (page 4)</text><rect x="416.0" y="48.0" width="228.0" height="126.0" rx="8" class="a1 ln c1 thin"/><text x="430.0" y="78.0" class="tx" text-anchor="start">SpecReason: reads, gives a mark</text><text x="430.0" y="97.0" class="tx" text-anchor="start">Lookahead Reasoning: writes</text><text x="430.0" y="116.0" class="tx" text-anchor="start">its own step in parallel</text><text x="430.0" y="135.0" class="tx" text-anchor="start">GSI, SPECS</text><text x="14.0" y="212.0" class="tx-b" text-anchor="start">the large model</text><text x="14.0" y="228.0" class="tx-b" text-anchor="start">is skipped on</text><text x="14.0" y="244.0" class="tx-b" text-anchor="start">what is accepted</text><text x="14.0" y="260.0" class="tx-s" text-anchor="start">→ compute saved; quality:</text><text x="14.0" y="276.0" class="tx-s" text-anchor="start">   the small model's</text><rect x="180.0" y="182.0" width="228.0" height="126.0" rx="8" class="a2 ln c2 thin"/><text x="194.0" y="212.0" class="tx" text-anchor="start">token routing: R2R, CITER</text><text x="194.0" y="231.0" class="tx" text-anchor="start">(the large model reads the</text><text x="194.0" y="250.0" class="tx" text-anchor="start">small model's tokens later,</text><text x="194.0" y="269.0" class="tx" text-anchor="start">in bulk)</text><rect x="416.0" y="182.0" width="228.0" height="126.0" rx="8" class="a2 ln c2 thin"/><text x="430.0" y="212.0" class="tx" text-anchor="start">RSD: a reward model accepts</text><text x="430.0" y="231.0" class="tx" text-anchor="start">step-level cascades</text><text x="294.0" y="324.0" class="tx-s" text-anchor="middle">blue: speculative side</text><text x="530.0" y="324.0" class="tx-s" text-anchor="middle">orange: cascade side</text></svg>
