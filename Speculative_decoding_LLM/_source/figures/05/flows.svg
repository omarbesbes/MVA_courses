<svg viewBox="0 0 660 356" role="img" aria-label="Control flow of three step-level methods: who judges the drafted step and what the large model does." xmlns="http://www.w3.org/2000/svg"><defs><marker id="05-flows-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fm"/></marker></defs><text x="14.0" y="54.0" class="tx-b" text-anchor="start">RSD</text><rect x="104.0" y="28.0" width="118.0" height="46.0" rx="8" class="a2 ln c2 thin"/><text x="163.0" y="47.5" class="tx-b" text-anchor="middle">small model</text><text x="163.0" y="63.5" class="tx" text-anchor="middle">drafts a step</text><line x1="223.0" y1="51.0" x2="246.0" y2="51.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><rect x="248.0" y="28.0" width="150.0" height="46.0" rx="8" class="am ln cm thin"/><text x="323.0" y="47.5" class="tx-b" text-anchor="middle">reward model</text><text x="323.0" y="63.5" class="tx" text-anchor="middle">scores it: r</text><line x1="399.0" y1="51.0" x2="422.0" y2="51.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><rect x="424.0" y="32.0" width="104.0" height="38.0" rx="8" class="am ln cm thin"/><text x="476.0" y="55.5" class="tx" text-anchor="middle">r ≥ δ ?</text><line x1="529.0" y1="51.0" x2="556.0" y2="51.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><text x="542.0" y="45.0" class="tx-s" text-anchor="middle">yes</text><rect x="558.0" y="32.0" width="92.0" height="38.0" rx="8" class="a3 ln c3 thin"/><text x="604.0" y="55.5" class="tx" text-anchor="middle">keep the draft</text><line x1="476.0" y1="71.0" x2="476.0" y2="88.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><text x="486.0" y="84.0" class="tx-s" text-anchor="start">no</text><rect x="410.0" y="90.0" width="132.0" height="34.0" rx="8" class="a1 ln c1 thin"/><text x="476.0" y="104.5" class="tx-b" text-anchor="middle">large model</text><text x="476.0" y="118.5" class="tx" text-anchor="middle">rewrites the step</text><text x="14.0" y="168.0" class="tx-b" text-anchor="start">SpecReason</text><rect x="104.0" y="142.0" width="118.0" height="46.0" rx="8" class="a2 ln c2 thin"/><text x="163.0" y="161.5" class="tx-b" text-anchor="middle">small model</text><text x="163.0" y="177.5" class="tx" text-anchor="middle">drafts a step</text><line x1="223.0" y1="165.0" x2="246.0" y2="165.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><rect x="248.0" y="142.0" width="150.0" height="46.0" rx="8" class="a1 ln c1 thin"/><text x="323.0" y="161.5" class="tx-b" text-anchor="middle">large model reads it,</text><text x="323.0" y="177.5" class="tx" text-anchor="middle">gives a mark 0–9</text><line x1="399.0" y1="165.0" x2="422.0" y2="165.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><rect x="424.0" y="146.0" width="104.0" height="38.0" rx="8" class="am ln cm thin"/><text x="476.0" y="169.5" class="tx" text-anchor="middle">mark ≥ 7 ?</text><line x1="529.0" y1="165.0" x2="556.0" y2="165.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><text x="542.0" y="159.0" class="tx-s" text-anchor="middle">yes</text><rect x="558.0" y="146.0" width="92.0" height="38.0" rx="8" class="a3 ln c3 thin"/><text x="604.0" y="169.5" class="tx" text-anchor="middle">keep the draft</text><line x1="476.0" y1="185.0" x2="476.0" y2="202.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><text x="486.0" y="198.0" class="tx-s" text-anchor="start">no</text><rect x="410.0" y="204.0" width="132.0" height="34.0" rx="8" class="a1 ln c1 thin"/><text x="476.0" y="218.5" class="tx-b" text-anchor="middle">large model</text><text x="476.0" y="232.5" class="tx" text-anchor="middle">rewrites the step</text><text x="14.0" y="282.0" class="tx-b" text-anchor="start">Lookahead</text><text x="14.0" y="298.0" class="tx-b" text-anchor="start">Reasoning</text><rect x="104.0" y="256.0" width="118.0" height="46.0" rx="8" class="a2 ln c2 thin"/><text x="163.0" y="275.5" class="tx-b" text-anchor="middle">small model</text><text x="163.0" y="291.5" class="tx" text-anchor="middle">drafts a step</text><line x1="223.0" y1="279.0" x2="246.0" y2="279.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><rect x="248.0" y="256.0" width="150.0" height="46.0" rx="8" class="a1 ln c1 thin"/><text x="323.0" y="275.5" class="tx-b" text-anchor="middle">large model writes its</text><text x="323.0" y="291.5" class="tx" text-anchor="middle">own step, in parallel</text><line x1="399.0" y1="279.0" x2="422.0" y2="279.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><rect x="424.0" y="260.0" width="104.0" height="38.0" rx="8" class="am ln cm thin"/><text x="476.0" y="283.5" class="tx" text-anchor="middle">same meaning ?</text><line x1="529.0" y1="279.0" x2="556.0" y2="279.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><text x="542.0" y="273.0" class="tx-s" text-anchor="middle">yes</text><rect x="558.0" y="260.0" width="92.0" height="38.0" rx="8" class="a3 ln c3 thin"/><text x="604.0" y="283.5" class="tx" text-anchor="middle">keep the draft</text><line x1="476.0" y1="299.0" x2="476.0" y2="316.0" class="ln cm thin" marker-end="url(#05-flows-arr-m)"/><text x="486.0" y="312.0" class="tx-s" text-anchor="start">no</text><rect x="410.0" y="318.0" width="132.0" height="34.0" rx="8" class="a1 ln c1 thin"/><text x="476.0" y="332.5" class="tx-b" text-anchor="middle">use the large</text><text x="476.0" y="346.5" class="tx" text-anchor="middle">model's step</text></svg>
