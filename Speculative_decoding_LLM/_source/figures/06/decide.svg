<svg viewBox="0 0 660 392" role="img" aria-label="Decision flow: four questions, each with an exit toward an exact method, before choosing a relaxed rule." xmlns="http://www.w3.org/2000/svg"><defs><marker id="06-decide-arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fm"/></marker></defs><rect x="14.0" y="12.0" width="344.0" height="46.0" rx="8" class="am ln cm thin"/><text x="186.0" y="39.5" class="tx" text-anchor="middle">Is the output ordinary text?</text><line x1="359.0" y1="35.0" x2="417.0" y2="35.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="389.0" y="29.0" class="tx-s" text-anchor="middle">no</text><rect x="420.0" y="12.0" width="226.0" height="46.0" rx="8" class="a4 ln c4 thin"/><text x="533.0" y="31.5" class="tx-b" text-anchor="middle">Codes or actions: see §1</text><text x="533.0" y="47.5" class="tx" text-anchor="middle">(relaxed rules are usual there)</text><line x1="186.0" y1="59.0" x2="186.0" y2="85.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="194.0" y="76.0" class="tx-s" text-anchor="start">yes</text><rect x="14.0" y="88.0" width="344.0" height="46.0" rx="8" class="am ln cm thin"/><text x="186.0" y="107.5" class="tx-b" text-anchor="middle">Have you taken the exact gains?</text><text x="186.0" y="123.5" class="tx" text-anchor="middle">a drafter fitted to the target, draft length, load</text><line x1="359.0" y1="111.0" x2="417.0" y2="111.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="389.0" y="105.0" class="tx-s" text-anchor="middle">no</text><rect x="420.0" y="88.0" width="226.0" height="46.0" rx="8" class="a1 ln c1 thin"/><text x="533.0" y="107.5" class="tx-b" text-anchor="middle">Do that first (page 2):</text><text x="533.0" y="123.5" class="tx" text-anchor="middle">nothing to re-evaluate</text><line x1="186.0" y1="135.0" x2="186.0" y2="161.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="194.0" y="152.0" class="tx-s" text-anchor="start">yes</text><rect x="14.0" y="164.0" width="344.0" height="46.0" rx="8" class="am ln cm thin"/><text x="186.0" y="183.5" class="tx-b" text-anchor="middle">Can you measure quality and safety</text><text x="186.0" y="199.5" class="tx" text-anchor="middle">on your own task, at each setting of the rule?</text><line x1="359.0" y1="187.0" x2="417.0" y2="187.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="389.0" y="181.0" class="tx-s" text-anchor="middle">no</text><rect x="420.0" y="164.0" width="226.0" height="46.0" rx="8" class="a1 ln c1 thin"/><text x="533.0" y="191.5" class="tx" text-anchor="middle">Stay exact</text><line x1="186.0" y1="211.0" x2="186.0" y2="237.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="194.0" y="228.0" class="tx-s" text-anchor="start">yes</text><rect x="14.0" y="240.0" width="344.0" height="46.0" rx="8" class="am ln cm thin"/><text x="186.0" y="259.5" class="tx-b" text-anchor="middle">Is the drafter a capable model of the task?</text><text x="186.0" y="275.5" class="tx" text-anchor="middle">a real small model, not a drafting head</text><line x1="359.0" y1="263.0" x2="417.0" y2="263.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="389.0" y="257.0" class="tx-s" text-anchor="middle">no</text><rect x="420.0" y="240.0" width="226.0" height="46.0" rx="8" class="a1 ln c1 thin"/><text x="533.0" y="259.5" class="tx-b" text-anchor="middle">Stay exact,</text><text x="533.0" y="275.5" class="tx" text-anchor="middle">or change the drafter</text><line x1="186.0" y1="287.0" x2="186.0" y2="313.0" class="ln cm thin" marker-end="url(#06-decide-arr-m)"/><text x="194.0" y="304.0" class="tx-s" text-anchor="start">yes</text><rect x="14.0" y="316.0" width="632.0" height="58.0" rx="8" class="a4 ln c4 thin"/><text x="330.0" y="340.5" class="tx-b" text-anchor="middle">A relaxed rule, chosen in the table below</text><text x="330.0" y="358.5" class="tx" text-anchor="middle">exact rule on the first tokens of the answer · report the time per answer, not the tokens per round</text><text x="14.0" y="388.0" class="tx-s" text-anchor="start">blue: an exact method · amber: a lossy rule</text></svg>
