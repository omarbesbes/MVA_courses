<svg viewBox="0 0 720 300" role="img" aria-label="Superposition: three directions in the plane and a read-out with interference" xmlns="http://www.w3.org/2000/svg"><defs><marker id="01-superposition-arr-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f2"/></marker></defs><line x1="37.9" y1="150.0" x2="242.1" y2="150.0" class="ax"/><line x1="140.0" y1="252.1" x2="140.0" y2="47.9" class="ax"/><line x1="140.0" y1="150.0" x2="218.6" y2="150.0" class="ln c2 thin" marker-end="url(#01-superposition-arr-2)"/><text x="232.7" y="154.0" class="tx-b" text-anchor="middle">d1</text><line x1="140.0" y1="150.0" x2="100.7" y2="82.0" class="ln c2 thin" marker-end="url(#01-superposition-arr-2)"/><text x="93.6" y="73.7" class="tx-b" text-anchor="middle">d2</text><line x1="140.0" y1="150.0" x2="100.7" y2="218.0" class="ln c2 thin" marker-end="url(#01-superposition-arr-2)"/><text x="93.6" y="234.3" class="tx-b" text-anchor="middle">d3</text><text x="30.0" y="28.0" class="tx-b" text-anchor="start">3 features in a 2-D space (d₂ = 120°, d₃ = 240°)</text><circle cx="179.3" cy="82.0" r="5" class="f3"/><text x="187.3" y="76.0" class="tx-s" text-anchor="start">a = d₁ + d₂</text><text x="300.0" y="60.0" class="tx-b" text-anchor="start">Read-out  rᵢ = dᵢ · a</text><text x="300.0" y="84.0" class="tx-s" text-anchor="start"></text><text x="500.0" y="84.0" class="tx-b" text-anchor="middle">r₁</text><text x="560.0" y="84.0" class="tx-b" text-anchor="middle">r₂</text><text x="620.0" y="84.0" class="tx-b" text-anchor="middle">r₃</text><text x="300.0" y="112.0" class="tx" text-anchor="start">a = d₁</text><rect x="472.0" y="95.0" width="56.0" height="24.0" rx="3" class="f3 a3" stroke-width="1"/><text x="500.0" y="112.0" class="tx" text-anchor="middle">1</text><rect x="532.0" y="95.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="560.0" y="112.0" class="tx" text-anchor="middle">-0.5</text><rect x="592.0" y="95.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="620.0" y="112.0" class="tx" text-anchor="middle">-0.5</text><text x="300.0" y="146.0" class="tx" text-anchor="start">a = d₁ + d₂</text><rect x="472.0" y="129.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="500.0" y="146.0" class="tx" text-anchor="middle">0.5</text><rect x="532.0" y="129.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="560.0" y="146.0" class="tx" text-anchor="middle">0.5</text><rect x="592.0" y="129.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="620.0" y="146.0" class="tx" text-anchor="middle">-1</text><text x="300.0" y="180.0" class="tx" text-anchor="start">a = d₁ + ½ d₂</text><rect x="472.0" y="163.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="500.0" y="180.0" class="tx" text-anchor="middle">0.75</text><rect x="532.0" y="163.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="560.0" y="180.0" class="tx" text-anchor="middle">0</text><rect x="592.0" y="163.0" width="56.0" height="24.0" rx="3" class="f2 a2" stroke-width="1"/><text x="620.0" y="180.0" class="tx" text-anchor="middle">-0.75</text><text x="300.0" y="232.0" class="tx-s" text-anchor="start">green: read-out equals the true code · orange: interference from</text><text x="300.0" y="248.0" class="tx-s" text-anchor="start">non-orthogonal directions (cosine −½ between any two atoms).</text><text x="300.0" y="276.0" class="tx-s" text-anchor="start">With one feature active the others read −½: a threshold fixes it.</text></svg>
