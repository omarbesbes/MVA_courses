<svg viewBox="0 0 760 335" role="img" aria-label="Left: a sparse linear code with two active directions gives a cone or a box. Right: a block-convex code gives a Minkowski sum of a triangle and a segment." xmlns="http://www.w3.org/2000/svg"><defs><marker id="05-codes-arr-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f2"/></marker></defs><text x="40.0" y="24.0" class="tx-b" text-anchor="start">Sparse linear code  x = z₁d₁ + z₂d₂,  0 ≤ zⱼ ≤ M</text><line x1="40.0" y1="245.7" x2="340.0" y2="245.7" class="ax"/><line x1="77.5" y1="280.0" x2="77.5" y2="40.0" class="ax"/><path d="M77.5 245.7L242.5 208.0L292.0 57.1L127.0 94.9Z" class="a2"/><path d="M77.5 245.7L242.5 208.0L292.0 57.1L127.0 94.9Z" class="ln c2"/><line x1="77.5" y1="245.7" x2="332.5" y2="187.4" class="ln c2 thin dash"/><line x1="77.5" y1="245.7" x2="154.0" y2="12.6" class="ln c2 thin dash"/><line x1="77.5" y1="245.7" x2="152.5" y2="228.6" class="ln c2" marker-end="url(#05-codes-arr-2)"/><text x="158.5" y="222.6" class="tx-b" text-anchor="start">d₁</text><line x1="77.5" y1="245.7" x2="100.0" y2="177.1" class="ln c2" marker-end="url(#05-codes-arr-2)"/><text x="106.0" y="171.1" class="tx-b" text-anchor="start">d₂</text><circle cx="77.5" cy="245.7" r="4" class="fk"/><text x="40.0" y="304.0" class="tx-s" text-anchor="start">a box of codes: each feature varies on its own;</text><text x="40.0" y="320.0" class="tx-s" text-anchor="start">tiles = segments [0, M dⱼ] anchored at the origin</text><text x="410.0" y="24.0" class="tx-b" text-anchor="start">Block-convex code  x = p₁ + p₂,  p₁ ∈ P₁,  p₂ ∈ P₂</text><path d="M435.0 256.0L585.0 256.0L635.0 184.0L510.0 112.0L460.0 184.0Z" class="am"/><path d="M435.0 256.0L585.0 256.0L635.0 184.0L510.0 112.0L460.0 184.0Z" class="ln cm thin"/><path d="M435.0 256.0L585.0 256.0L460.0 184.0Z" class="a1"/><path d="M435.0 256.0L585.0 256.0L460.0 184.0Z" class="ln c1"/><line x1="435.0" y1="256.0" x2="485.0" y2="184.0" class="ln c5"/><circle cx="435.0" cy="256.0" r="4.5" class="f1"/><circle cx="585.0" cy="256.0" r="4.5" class="f1"/><circle cx="460.0" cy="184.0" r="4.5" class="f1"/><circle cx="435.0" cy="256.0" r="4.5" class="f5"/><circle cx="485.0" cy="184.0" r="4.5" class="f5"/><text x="510.0" y="274.0" class="tx-b" text-anchor="middle">P₁ (a triangle)</text><text x="477.0" y="188.0" class="tx-b" text-anchor="end">P₂ (a segment)</text><text x="635.0" y="140.8" class="tx-b" text-anchor="middle">P₁ ⊕ P₂</text><text x="410.0" y="304.0" class="tx-s" text-anchor="start">each tile: a convex combination of its archetypes,</text><text x="410.0" y="320.0" class="tx-s" text-anchor="start">weights in a simplex (non-negative, sum 1)</text></svg>
