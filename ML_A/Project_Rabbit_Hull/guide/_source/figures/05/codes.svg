<svg viewBox="0 0 760 330" role="img" aria-label="Left: a sparse linear code with two active directions gives a cone or a box. Right: a block-convex code gives a Minkowski sum of a triangle and a segment." xmlns="http://www.w3.org/2000/svg"><defs><marker id="05-codes-arr-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f2"/></marker></defs><text x="40.0" y="24.0" class="tx-b" text-anchor="start">Sparse linear code  x = z₁d₁ + z₂d₂,  0 ≤ zⱼ ≤ M</text><line x1="40.0" y1="245.7" x2="340.0" y2="245.7" class="ax"/><line x1="77.5" y1="280.0" x2="77.5" y2="40.0" class="ax"/><path d="M77.5 245.7L242.5 208.0L292.0 57.1L127.0 94.9Z" class="a2"/><path d="M77.5 245.7L242.5 208.0L292.0 57.1L127.0 94.9Z" class="ln c2"/><line x1="77.5" y1="245.7" x2="332.5" y2="187.4" class="ln c2 thin dash"/><line x1="77.5" y1="245.7" x2="154.0" y2="12.6" class="ln c2 thin dash"/><line x1="77.5" y1="245.7" x2="152.5" y2="228.6" class="ln c2" marker-end="url(#05-codes-arr-2)"/><text x="158.5" y="222.6" class="tx-b" text-anchor="start">d₁</text><line x1="77.5" y1="245.7" x2="100.0" y2="177.1" class="ln c2" marker-end="url(#05-codes-arr-2)"/><text x="106.0" y="171.1" class="tx-b" text-anchor="start">d₂</text><circle cx="77.5" cy="245.7" r="4" class="fk"/><text x="118.8" y="98.3" class="tx" text-anchor="start">a box of codes:</text><text x="118.8" y="108.6" class="tx-s" text-anchor="start">each feature varies on its own</text><text x="167.5" y="260.3" class="tx-s" text-anchor="start">segments [0, M dⱼ] anchored at the origin</text><text x="410.0" y="24.0" class="tx-b" text-anchor="start">Block-convex code  x = p₁ + p₂,  p₁ ∈ P₁,  p₂ ∈ P₂</text><path d="M455.0 241.6L605.0 241.6L655.0 169.6L530.0 97.6L480.0 169.6Z" class="am"/><path d="M455.0 241.6L605.0 241.6L655.0 169.6L530.0 97.6L480.0 169.6Z" class="ln cm thin"/><path d="M455.0 241.6L605.0 241.6L480.0 169.6Z" class="a1"/><path d="M455.0 241.6L605.0 241.6L480.0 169.6Z" class="ln c1"/><line x1="455.0" y1="241.6" x2="505.0" y2="169.6" class="ln c5"/><circle cx="455.0" cy="241.6" r="4.5" class="f1"/><circle cx="605.0" cy="241.6" r="4.5" class="f1"/><circle cx="480.0" cy="169.6" r="4.5" class="f1"/><circle cx="455.0" cy="241.6" r="4.5" class="f5"/><circle cx="505.0" cy="169.6" r="4.5" class="f5"/><text x="611.0" y="257.6" class="tx-b" text-anchor="start">P₁ (a tile)</text><text x="497.0" y="173.6" class="tx-b" text-anchor="end">P₂</text><text x="480.0" y="161.6" class="tx-b" text-anchor="middle">P₁ ⊕ P₂</text><text x="605.0" y="68.8" class="tx-s" text-anchor="start">each tile: a convex combination,</text><text x="605.0" y="80.8" class="tx-s" text-anchor="start">weights sum to 1 (a simplex)</text></svg>
