<svg viewBox="0 0 720 270" role="img" aria-label="Barycentric weights of a point: unique in a triangle, not in a square" xmlns="http://www.w3.org/2000/svg"><polygon points="60.0,220.0 210.0,220.0 105.0,92.5" class="f1 a1 ln c1"/><circle cx="120.0" cy="175.0" r="5" class="f3"/><text x="46.0" y="234.0" class="tx-b" text-anchor="start">v₁</text><text x="218.0" y="234.0" class="tx-b" text-anchor="start">v₂</text><text x="113.0" y="86.5" class="tx-b" text-anchor="start">v₃</text><text x="60.0" y="248.0" class="tx-s" text-anchor="start">p = 0.35 v₁ + 0.29 v₂ + 0.35 v₃ : the only way</text><polygon points="410.0,220.0 545.0,220.0 545.0,85.0 410.0,85.0" class="f1 a1 ln c1"/><line x1="410.0" y1="220.0" x2="545.0" y2="85.0" class="ln c2 dash"/><line x1="545.0" y1="220.0" x2="410.0" y2="85.0" class="ln c5 dash"/><circle cx="477.5" cy="152.5" r="5" class="f3"/><text x="394.0" y="234.0" class="tx-b" text-anchor="start">v₁</text><text x="551.0" y="234.0" class="tx-b" text-anchor="start">v₂</text><text x="551.0" y="79.0" class="tx-b" text-anchor="start">v₃</text><text x="394.0" y="79.0" class="tx-b" text-anchor="start">v₄</text><text x="400.0" y="248.0" class="tx-s" text-anchor="start">centre = ½(v₁+v₃) = ½(v₂+v₄) = ¼(v₁+v₂+v₃+v₄)</text><text x="400.0" y="26.0" class="tx-b" text-anchor="start">four vertices in the plane: weights are not unique</text><text x="60.0" y="26.0" class="tx-b" text-anchor="start">three affinely independent vertices: unique</text></svg>
