e cx="676.1" cy="135" r="4.5" class="f1"/><text x="672.1" y="121.0" class="tx-s" text-anchor="end">SAE: largest ≈ 0.92 (read off Fig. 10 A)</text><text x="40.0" y="28.0" class="tx-b" text-anchor="start">Where the paper's three dictionaries sit on one axis (c = 32 000, d = 768)</text><text x="40.0" y="232.0" class="tx-s" text-anchor="start">Grey: baselines and bounds. Orange: the numerically computed Grassmannian frame. Blue: the learned SAE dictionary.</text></svg>
