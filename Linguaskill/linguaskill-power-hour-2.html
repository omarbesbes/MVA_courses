<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguaskill Power Hour 2 — Reading &amp; Listening (C1)</title>
<meta name="description" content="A one-hour intensive practice session for the Linguaskill General Reading and Listening test: prepositions, grammar gap-fill, collocations, phrasal verbs, notices, text cohesion, extended reading and browser-voiced listening.">
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --panel2:#f0f2f7; --text:#1b1f2a; --muted:#5d6472; --border:#d9dde6;
  --accent:#2a4bd7; --accent-ink:#ffffff; --accent-soft:#e6ebff;
  --ok:#157a3a; --ok-soft:#dff5e6; --bad:#c0262d; --bad-soft:#fde4e5; --warn:#b26b00; --warn-soft:#fff1d6;
  --sign:#fffbe8; --sign-border:#e8d48a;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121419; --panel:#1b1e26; --panel2:#232733; --text:#e8eaf0; --muted:#a0a7b6; --border:#343947;
    --accent:#7c93ff; --accent-ink:#0d1020; --accent-soft:#252c4a;
    --ok:#4ad07a; --ok-soft:#163421; --bad:#ff7b81; --bad-soft:#40191c; --warn:#ffc266; --warn-soft:#3b2d12;
    --sign:#2a2714; --sign-border:#6b5d2a; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select{font:inherit}
a{color:var(--accent)}
.muted{color:var(--muted)}
.hidden{display:none !important}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.timer{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 14px}
.timer .digits{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:66px;letter-spacing:.02em}
.timer.warn .digits{color:var(--warn)} .timer.danger .digits{color:var(--bad)}
.timer button{border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.timer button.secondary{background:transparent;color:var(--muted);padding:6px 8px}
.overall{font-size:13px;color:var(--muted);white-space:nowrap}
.overall b{color:var(--text)}
@media (max-width:600px){
  .topbar-inner{padding:8px 12px;gap:8px}
  .brand{font-size:15px}
  .brand small{display:none}
  .timer{padding:3px 4px 3px 10px}
  .timer .digits{font-size:17px;min-width:54px}
  .timer button{padding:5px 10px;font-size:14px}
  .overall{font-size:12px;order:5;width:100%}
}

.shell{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:250px 1fr;gap:16px}
@media (max-width:860px){.shell{grid-template-columns:1fr;padding:12px}}

nav.side{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){nav.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px;-webkit-overflow-scrolling:touch}}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;transition:background .12s}
.navbtn:hover{background:var(--panel2)}
.navbtn.active{border-color:var(--accent);background:var(--accent-soft)}
.navbtn .num{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.navbtn.done .num{background:var(--ok-soft);color:var(--ok)}
.navbtn .lbl{flex:1;min-width:0}
.navbtn .lbl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn .lbl span{font-size:12px;color:var(--muted)}
@media (max-width:860px){.navbtn{width:auto;flex:none;padding:6px 10px}.navbtn .lbl span{display:none}}

main{min-width:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
@media (max-width:600px){.card{padding:16px 14px}}
.card+.card{margin-top:14px}
.mod-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.mod-head h2{margin:0;font-size:22px;letter-spacing:-.01em}
.mod-head .meta{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);line-height:1.4}
.mod-head .meta b{color:var(--text)}
.instructions{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.progress{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:0 0 16px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.counter{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.counter .skip{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}

h3{font-size:17px;margin:22px 0 8px}
p.lead{font-size:16.5px;margin:0 0 14px}

/* ---------- items ---------- */
.item .q{font-size:19px;line-height:1.7;margin:4px 0 14px}
.item .q.small{font-size:16.5px}
input.gap{display:inline-block;width:7.5ch;min-width:7.5ch;margin:0 3px;padding:2px 8px;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;text-align:center;font-weight:600;font-size:inherit;color:var(--text);outline:none}
input.gap:focus{box-shadow:0 0 0 3px rgba(42,75,215,.18)}
input.gap.wide{width:14ch;min-width:14ch}
input.gap.ok{background:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok)}
input.gap.bad{background:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
input.gap:disabled{opacity:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:transform .05s, background .12s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-size:17px;padding:12px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.cta-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 6px}

.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:16px;line-height:1.45}
.opt:hover:not(:disabled){background:var(--panel2)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt.chosen .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.6}

.fb{margin-top:10px;border-radius:10px;padding:10px 14px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .verdict{font-weight:700}
.fb .ans{font-weight:700}
.fb-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fb-list .fb{display:block;margin:0;padding:8px 12px}

.sign{white-space:pre-line;background:var(--sign);border:1px solid var(--sign-border);border-radius:10px;padding:14px 16px;margin:4px 0 14px;font-size:16px;line-height:1.5}
.sign-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.prompt{background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:17px;margin:4px 0 12px}

.passage{font-size:17px;line-height:1.85;background:var(--panel2);border-radius:10px;padding:16px 18px;margin:4px 0 12px}
.passage p{margin:0 0 12px} .passage p:last-child{margin:0}
.passage .pn{display:inline-block;font-size:11px;color:var(--muted);vertical-align:top;margin-right:6px;font-weight:700}
.passage h4{margin:0 0 10px;font-size:18px}
.passage input.gap{font-size:16px}
.gapnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;margin:0 4px 0 0;vertical-align:1px}
select.gapsel{appearance:none;-webkit-appearance:none;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:2px 22px 2px 8px;margin:0 2px;font-weight:600;color:var(--text);cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23777'/></svg>");background-repeat:no-repeat;background-position:right 7px center}
select.gapsel.ok{background-color:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok)}
select.gapsel.bad{background-color:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad)}
select.gapsel:disabled{opacity:1}
.optlist{columns:2;column-gap:20px;margin:0 0 12px;padding:0;list-style:none;font-size:15px}
@media (max-width:700px){.optlist{columns:1}}
.optlist li{break-inside:avoid;margin:0 0 8px;display:flex;gap:8px}
.optlist li b{flex:none;width:22px;height:22px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font-size:12px}
.optlist li.used{opacity:.5}

.qblock{border-top:1px solid var(--border);padding:14px 0 4px}
.qblock .qt{font-weight:600;margin:0 0 8px;font-size:16.5px}
.qblock .opts{gap:6px}
.qblock .opt{padding:8px 10px;font-size:15px}

/* ---------- listening ---------- */
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:12px 14px;margin:4px 0 14px}
.player .play{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.player .play.playing{background:var(--bad)}
.player .state{font-size:13px;color:var(--muted)}
.player .bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:4px}
.player .bars i{width:3px;background:var(--accent);height:4px;border-radius:2px}
.player.playing .bars i{animation:eq .8s infinite ease-in-out}
.player.playing .bars i:nth-child(2){animation-delay:.15s}.player.playing .bars i:nth-child(3){animation-delay:.3s}.player.playing .bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.transcript{background:var(--panel2);border-radius:10px;padding:12px 16px;font-size:15px;line-height:1.7;margin:10px 0}
.transcript .spk{font-weight:700;color:var(--muted);margin-right:6px}
.transcript p{margin:0 0 8px}
.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 12px}
.sentlist{display:flex;flex-direction:column;gap:12px;margin:8px 0 10px;font-size:17px}

/* ---------- summary / review ---------- */
.scoregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.scorecard{background:var(--panel2);border-radius:10px;padding:12px 14px}
.scorecard b{display:block;font-size:14px;margin-bottom:6px}
.scorecard .bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin:6px 0}
.scorecard .bar i{display:block;height:100%;background:var(--ok)}
.scorecard .bar i.mid{background:var(--warn)} .scorecard .bar i.low{background:var(--bad)}
.scorecard small{color:var(--muted)}
.bigstat{display:flex;gap:20px;flex-wrap:wrap;margin:6px 0 14px}
.bigstat div{background:var(--panel2);border-radius:10px;padding:12px 18px;min-width:140px}
.bigstat div b{display:block;font-size:28px;line-height:1.1}
.bigstat div span{font-size:13px;color:var(--muted)}
.mod-summary{text-align:center;padding:10px 0 4px}
.mod-summary .score{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mod-summary p{margin:8px 0 16px;color:var(--muted)}
.review-group h3{margin-top:18px}
.flash{background:var(--panel2);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.flash .ctx{font-size:16px;margin-bottom:6px}
.flash .u{color:var(--bad);text-decoration:line-through;margin-right:8px}
.flash .c{color:var(--ok);font-weight:700}
.flash .e{color:var(--muted);margin-top:4px;font-size:14px}
.retry{border:1px dashed var(--border);border-radius:10px;padding:10px 14px;margin:8px 0}
.retry .item .q{font-size:17px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-left:8px;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- info pages ---------- */
table.plan,table.ref{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 10px}
table.plan th,table.plan td,table.ref th,table.ref td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.plan th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.plan td:first-child{font-weight:700;white-space:nowrap;width:50px}
table.ref th{width:190px;font-weight:700;color:var(--text);background:var(--panel2)}
@media (max-width:600px){table.ref th{width:110px;font-size:13px}table.ref td{font-size:13.5px}}
ul.tips{padding-left:20px} ul.tips li{margin:0 0 8px}
dl.tactics dt{font-weight:700;margin-top:12px} dl.tactics dd{margin:4px 0 0;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips span{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:13.5px;white-space:nowrap}
.chips span b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.kbd{font-size:12px;color:var(--muted);margin-top:10px}
.kbd kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-family:inherit;font-size:11px;background:var(--panel2)}
.fallback{max-width:720px;margin:40px auto;padding:20px;font-family:var(--font)}

</style>
</head>
<body>
<div id="app">
  <div class="fallback">
    <h1>Linguaskill Power Hour</h1>
    <p>This page needs JavaScript. If you are seeing this inside a preview, download the file and open it in Chrome, Edge, Safari or Firefox.</p>
  </div>
</div>
<script>
/* ===== Linguaskill Power Hour — SESSION 2 data (part 1: drills) ===== */
const SESSION_LABEL = "Session 2";
const MODULES = [];

MODULES.push({
  id: "prep", kind: "items", title: "Prepositions", short: "Prepositions", minutes: 9,
  instructions: "Type ONE word in each gap. Enter checks your answer; Enter again moves on. New set — fixed phrases with at / on / in / under, plus verb and adjective patterns.",
  items: [
    {t:"typed", q:"The scheme was abandoned ___ the grounds that it was too costly.", a:["on"], e:"on the grounds that / on the grounds of = for the reason that. Also: on account of, on the basis of."},
    {t:"typed", q:"He was arrested ___ suspicion of fraud.", a:["on"], e:"on suspicion of; on charges of; on the strength of (= because of)."},
    {t:"typed", q:"The two companies are ___ the brink of a merger.", a:["on"], e:"on the brink of / on the verge of / on the point of = very close to."},
    {t:"typed", q:"She is currently ___ leave and will be back on Monday.", a:["on"], e:"on leave / on holiday / on sick leave / on duty / on strike / on business."},
    {t:"typed", q:"The castle has been ___ ruins since the seventeenth century.", a:["in"], e:"in ruins. Also: in tatters, in pieces, in decline, in good condition."},
    {t:"typed", q:"The staff were kept ___ the dark about the takeover.", a:["in"], e:"keep somebody in the dark = not tell them. Also: in the know, in the loop, in the picture."},
    {t:"typed", q:"The witness was reluctant to testify ___ fear of reprisals.", a:["for","through"], e:"for fear of (+ noun / -ing) = because of the fear that (also: through fear of). Also: for lack of, for want of."},
    {t:"typed", q:"___ the risk of sounding ungrateful, I would rather have had the cash.", a:["at"], e:"at the risk of (+ -ing) = even though it may cause. Also: at the expense of, at the mercy of."},
    {t:"typed", q:"The police are completely ___ a loss to explain the rise in cases.", a:["at"], e:"at a loss (to explain / for words) = unable to. Also: at a disadvantage, at a premium."},
    {t:"typed", q:"The hotel is ___ easy reach of the airport.", a:["within","in"], e:"within easy reach of (also 'in easy reach'). Also: within walking distance, within earshot, within reason."},
    {t:"typed", q:"Please keep this information ___ yourself.", a:["to"], e:"keep something to yourself = don't tell anyone. Also: keep to the point, keep to a schedule."},
    {t:"typed", q:"The report is highly critical ___ the way the funds were managed.", a:["of"], e:"critical of. Also: sceptical of, dismissive of, scornful of, appreciative of."},
    {t:"typed", q:"He takes great pride ___ his work.", a:["in"], e:"take pride in / pride yourself on. Also: take an interest in, take part in, take pleasure in."},
    {t:"typed", q:"The hospital is ___ dire need of new equipment.", a:["in"], e:"in (dire / urgent) need of. Also: in search of, in pursuit of, in favour of, in charge of."},
    {t:"typed", q:"I'm afraid I'm not ___ liberty to discuss the details.", a:["at"], e:"at liberty to (formal) = allowed to. Also: at leisure, at ease, at will."},
    {t:"typed", q:"The agreement is binding ___ both parties.", a:["on","upon"], e:"binding on / upon = must be obeyed by. Also: incumbent on, dependent on, conditional on."},
    {t:"typed", q:"Many employees feel ill ___ ease with the new appraisal system.", a:["at"], e:"ill at ease = uncomfortable. Opposite: at ease. Also: at peace, at odds."},
    {t:"typed", q:"The whole village turned out ___ force for the festival.", a:["in"], e:"in force = in large numbers (also: a law 'in force' = valid). Also: in droves, in abundance."},
    {t:"typed", q:"The painting was sold ___ auction for twice its estimated value.", a:["at","by"], e:"at auction (also: sold by auction). Also: at a discount, at a profit / loss, at face value, at cost price."},
    {t:"typed", q:"We are entirely dependent ___ volunteers to keep the service running.", a:["on","upon"], e:"dependent on / rely on / depend on / count on. But: independent OF."},
    {t:"typed", q:"The company was found guilty ___ breaching environmental law.", a:["of"], e:"guilty of / convicted of / accused of / suspected of / cleared of."},
    {t:"typed", q:"Profits fell ___ a disappointing 12% last year, to just under three million.", a:["by"], e:"fall / rise BY an amount; TO a level; a fall OF 12%."},
    {t:"typed", q:"Her generosity is entirely ___ keeping with everything I know about her.", a:["in"], e:"in keeping with = consistent with. Also: in line with, in accordance with. Opposite: out of keeping with."},
    {t:"typed", q:"I'd like to thank everyone who contributed ___ the success of the event.", a:["to","towards","toward"], e:"contribute to / towards. Also: add to, lead to, give rise to, amount to, attribute X to Y."},
    {t:"typed", q:"The report delves ___ the causes of the accident in considerable detail.", a:["into"], e:"delve into = investigate deeply. Also: look into, enquire into, insight into, research into."},
    {t:"typed", q:"After twenty years in politics, she is almost immune ___ criticism.", a:["to","from"], e:"immune TO is the usual choice with criticism and disease; immune FROM is preferred for legal protection (immune from prosecution), though 'immune from criticism' is also heard."},
    {t:"typed", q:"The new regulations will come ___ effect on 1 January.", a:["into"], e:"come into effect / come into force / bring into effect. Also: come into being, come into view."},
    {t:"typed", q:"A spokesperson declined to comment ___ the allegations.", a:["on","upon"], e:"comment on. Also: remark on, elaborate on, expand on, touch on, dwell on."},
    {t:"typed", q:"The village was cut ___ by floods for three days.", a:["off"], e:"cut off = isolated. Also: cut back on, cut down on, cut out, cut in."},
    {t:"typed", q:"We were ___ the impression that the meeting had been cancelled.", a:["under"], e:"under the impression that. Also: under pressure, under way, under control, under no obligation."},
    {t:"typed", q:"There is no point ___ complaining; nothing will change.", a:["in"], e:"there is no point in (+ -ing) / there is no sense in. Compare: it is no use / no good + -ing (no preposition)."},
    {t:"typed", q:"The museum is closed ___ further notice.", a:["until","till"], e:"until further notice = for an unknown period. Also: at short notice, give notice, take notice of."}
  ]
});

MODULES.push({
  id: "gram", kind: "items", title: "Grammar gap-fill", short: "Grammar", minutes: 9,
  instructions: "Open gap-fill, ONE word per gap: two five-gap texts, then twenty sentences. Look left for a verb or adjective that demands a preposition or a negative adverb that triggers inversion; look right at the subject and verb that follow the gap; check the tense.",
  items: [
    {t:"ptyped", title:"Hot cities", text:"Cities are warming faster than the countryside around them, {1} is largely the result of concrete and asphalt absorbing heat during the day and releasing it at night. {2} is this 'heat island' effect more visible than in Phoenix, Arizona, where summer nights now rarely drop below thirty degrees. Planners have begun to respond: some cities require new roofs {3} be painted white, while others have planted thousands of trees. Neither measure is cheap, {4} the alternative — hundreds of heat-related deaths every summer — is far more expensive. The question is no longer whether to act, but how quickly change can be {5} about.",
      gaps:[
        {a:["which"], e:"…, WHICH is largely the result of… — a relative pronoun referring to the whole previous clause."},
        {a:["nowhere"], e:"NOWHERE is this effect more visible than in… — a negative adverb at the start forces inversion (is this effect)."},
        {a:["to"], e:"require something TO be done — require + object + to-infinitive."},
        {a:["but","yet","although","though","while","whereas","and"], e:"Neither measure is cheap, BUT / YET / ALTHOUGH / WHILE the alternative is far more expensive — a contrast linker."},
        {a:["brought"], e:"bring about change = cause it: how quickly change can be BROUGHT about (passive)."}
      ]},
    {t:"ptyped", title:"The lost art of boredom", text:"Most of us reach for our phones the moment we have nothing to do, {1} if boredom were a condition to be cured. Psychologists, however, have begun to argue that it is anything {2} useless. Several studies suggest that people who are made to sit through a dull task come up with more original ideas afterwards than those who have {3} kept busy. The explanation seems to be that a wandering mind is a creative one. {4} that is true, the constant stimulation of modern life may be costing us more than we realise. It may be worth leaving the phone in your pocket {5} and then and simply letting your thoughts drift.",
      gaps:[
        {a:["as"], e:"AS if boredom were a condition — as if / as though + past subjunctive (were) for an unreal comparison."},
        {a:["but"], e:"anything BUT useless = not at all useless. Compare: nothing but = only."},
        {a:["been"], e:"those who have BEEN kept busy — present perfect passive (have been + past participle)."},
        {a:["if","provided","providing","assuming","supposing"], e:"IF that is true, … (also: Provided / Providing / Assuming / Supposing that is true)."},
        {a:["now"], e:"NOW and then = occasionally. Also: every now and again, once in a while, from time to time."}
      ]},
    {t:"typed", q:"Rarely ___ I seen such a beautifully kept garden.", a:["have","had"], e:"Rarely / Seldom + inversion: Rarely HAVE I seen… (or HAD, in a past narrative) — auxiliary before subject."},
    {t:"typed", q:"Under no circumstances ___ passengers to leave their seats during take-off.", a:["are","were"], e:"Under no circumstances + inversion: ARE passengers to leave (be + to-infinitive = must; 'were' if reported in the past)."},
    {t:"typed", q:"It was only when I got home ___ I realised my wallet was missing.", a:["that"], e:"Cleft sentence: It was only when… THAT I realised. (Compare inversion: Only when I got home DID I realise.)"},
    {t:"typed", q:"She would sooner resign ___ accept a pay cut.", a:["than"], e:"would sooner / would rather + bare infinitive … THAN …"},
    {t:"typed", q:"If only I ___ listened to her warning!", a:["had"], e:"If only / I wish + past perfect for a past regret: If only I HAD listened."},
    {t:"typed", q:"You ___ better book early — the tickets sell out within hours.", a:["had"], e:"HAD better + bare infinitive = should (advice / warning). Usually contracted: you'd better."},
    {t:"typed", q:"He talks about the company as ___ he owned it.", a:["if","though"], e:"as IF / as THOUGH + past simple for an unreal present comparison (he doesn't own it)."},
    {t:"typed", q:"___ from being the cheapest option, it is also the most reliable.", a:["apart","aside"], e:"APART from / ASIDE from being = in addition to being (= besides being). Compare: far from being = not at all."},
    {t:"typed", q:"Such ___ the demand that a second performance was added.", a:["was"], e:"Such + be + subject + that…: Such WAS the demand that… (inversion after 'such')."},
    {t:"typed", q:"I'd rather not go out tonight, ___ I'm honest.", a:["if"], e:"IF I'm honest / if I'm being honest / to be honest = frankly."},
    {t:"typed", q:"By the time the fire brigade arrived, the building ___ already collapsed.", a:["had"], e:"By the time + past simple, … past perfect (HAD collapsed) for the earlier of two past events."},
    {t:"typed", q:"The project was abandoned ___ to a lack of funding.", a:["due","owing","thanks"], e:"DUE to / OWING to + noun = because of. ('Thanks to' also works, with an ironic tone.)"},
    {t:"typed", q:"No ___ had I closed the door than the phone rang.", a:["sooner"], e:"No SOONER had I … THAN … (inversion). Compare: Hardly had I … WHEN …"},
    {t:"typed", q:"Were it ___ for the subsidies, the farm would have gone under years ago.", a:["not"], e:"Were it NOT for = if it were not for (inverted conditional). Also: Had it not been for…"},
    {t:"typed", q:"The committee, ___ members are all volunteers, meets once a month.", a:["whose"], e:"WHOSE members — possessive relative pronoun (the committee's members)."},
    {t:"typed", q:"He is said ___ have fled the country before the trial began.", a:["to"], e:"He is said TO have fled = people say that he fled (passive reporting + perfect infinitive)."},
    {t:"typed", q:"___ as it may seem, he had never used a computer before.", a:["strange","odd","surprising","incredible","unlikely","hard","unbelievable","bizarre","absurd","remarkable","astonishing","funny","curious","amazing","weird","crazy","impossible","improbable","implausible","extraordinary","ridiculous","peculiar","shocking","ironic","paradoxical","difficult"], e:"STRANGE / ODD / SURPRISING as it may seem = although it may seem strange (adjective + as + subject + verb)."},
    {t:"typed", q:"Not until the last guest had left ___ she allow herself to sit down.", a:["did"], e:"Not until + clause + inversion in the main clause: Not until … DID she allow herself…"},
    {t:"typed", q:"So little ___ we know about the deep ocean that new species are found on almost every dive.", a:["do"], e:"So + adverb/adjective at the start + inversion: So little DO we know that…"},
    {t:"typed", q:"Had the goalkeeper not slipped, we ___ have won.", a:["would","could","might","should"], e:"Had … not slipped (= if … had not slipped), we WOULD / COULD / MIGHT have won — inverted third conditional. (Formal British English also allows 'we should have won'.)"}
  ]
});

MODULES.push({
  id: "vocab", kind: "items", title: "Vocabulary & collocations", short: "Vocabulary", minutes: 7,
  instructions: "Gapped sentences, four options. Press 1–4 or click. Decide the part of speech, then ask which word actually keeps company with the words around the gap.",
  items: [
    {t:"mcq", q:"The minister's remarks ___ outrage among teachers' unions.", o:["lit","sparked","burned","flamed"], a:1, e:"spark outrage / spark a debate / spark interest = cause suddenly. Also: provoke, trigger, ignite."},
    {t:"mcq", q:"The company has a ___ track record of innovation.", o:["tested","shown","checked","proven"], a:3, e:"a proven track record = a history of success that can be demonstrated."},
    {t:"mcq", q:"The bridge was closed as a ___ measure after cracks were found.", o:["precautionary","cautious","careful","wary"], a:0, e:"a precautionary measure = done to prevent possible harm. 'cautious' and 'wary' describe people."},
    {t:"mcq", q:"She has a ___ grasp of the subject.", o:["hard","tight","stiff","firm"], a:3, e:"a firm / good / solid grasp of = a clear understanding. 'tight grip' is physical."},
    {t:"mcq", q:"The new drug has shown ___ results in early trials.", o:["hopeful","optimistic","expecting","promising"], a:3, e:"promising results / a promising start. 'hopeful' and 'optimistic' describe people's attitudes."},
    {t:"mcq", q:"Critics argue that the policy will ___ the gap between rich and poor.", o:["widen","enlarge","extend","expand"], a:0, e:"widen / narrow / close / bridge the gap."},
    {t:"mcq", q:"The news came as a ___ blow to the family.", o:["sour","salty","bitter","acid"], a:2, e:"a bitter blow / a bitter disappointment / a bitter dispute. Also: a severe blow, a crushing blow."},
    {t:"mcq", q:"The government has ___ a review of the planning laws.", o:["commanded","committed","communicated","commissioned"], a:3, e:"commission a review / a report / a study = formally ask for it to be produced."},
    {t:"mcq", q:"After months of negotiations, the talks finally ___ down.", o:["fell","went","broke","came"], a:2, e:"talks / negotiations / a marriage / a car break down = fail or stop working."},
    {t:"mcq", q:"She was ___ aware that time was running out.", o:["sharply","severely","strictly","acutely"], a:3, e:"acutely aware / acutely conscious / acutely embarrassing. Also: keenly aware, painfully aware."},
    {t:"mcq", q:"The village has remained largely ___ by tourism.", o:["untaken","unheld","untouched","unmoved"], a:2, e:"untouched by = not affected by. unmoved = not emotionally affected."},
    {t:"mcq", q:"The council has ___ to find a solution before the winter.", o:["pledged","swore","assured","engaged"], a:0, e:"pledge / promise / vow / undertake TO do. 'swore' is the wrong form after 'has'; 'assured' needs an object."},
    {t:"mcq", q:"It was a ___ decision, taken without consulting anyone.", o:["rash","raw","rough","rude"], a:0, e:"a rash decision / a rash promise = made too quickly, without thinking. Also: hasty, impulsive."},
    {t:"mcq", q:"Unemployment has reached its highest ___ in a decade.", o:["degree","stage","level","grade"], a:2, e:"the highest level / rate / point. 'degree' goes with to a degree, by degrees."},
    {t:"mcq", q:"The experiment ___ the hypothesis that sleep improves memory.", o:["holds","supports","keeps","carries"], a:1, e:"support / confirm / back up / bear out a hypothesis. Opposite: undermine, refute, disprove."},
    {t:"mcq", q:"The region is ___ to earthquakes.", o:["likely","prone","probable","apt"], a:1, e:"prone to + noun (earthquakes, injury, error). 'apt to' and 'likely to' take a verb."},
    {t:"mcq", q:"He has a ___ interest in the outcome, since he owns shares in the company.", o:["vested","invested","interested","involved"], a:0, e:"a vested interest = a personal reason to want a particular result."},
    {t:"mcq", q:"The hikers were ___ by a sudden snowstorm.", o:["strained","stranded","strangled","straddled"], a:1, e:"stranded = left unable to move or leave. Also: stranded passengers, stranded at the airport."},
    {t:"mcq", q:"The company's share price ___ to a record high yesterday.", o:["raised","lifted","elevated","soared"], a:3, e:"soar / surge / rocket / climb to a high (intransitive). 'raise' needs an object."},
    {t:"mcq", q:"There is ___ evidence that the drug causes side effects.", o:["climbing","ascending","mounting","heightening"], a:2, e:"mounting / growing / compelling / overwhelming evidence. Also: mounting pressure, mounting debts."},
    {t:"mcq", q:"The two parties have reached a ___ agreement on the main points.", o:["hesitant","timid","tender","tentative"], a:3, e:"a tentative agreement / conclusion / step = not yet definite. 'hesitant' and 'timid' describe people."},
    {t:"mcq", q:"He ___ the journalists' questions with his usual skill.", o:["caught","held","gathered","fielded"], a:3, e:"field questions = deal with them (from cricket / baseball). Also: handle, deal with, parry."},
    {t:"mcq", q:"The report paints a ___ picture of conditions in the camp.", o:["bleak","blank","bland","blunt"], a:0, e:"paint a bleak / grim / rosy picture. bland = dull, tasteless; blunt = direct, or not sharp."},
    {t:"mcq", q:"The new law has met with ___ opposition from landlords.", o:["brutal","cruel","fierce","harsh"], a:2, e:"fierce / stiff / strong / vehement opposition. Also: meet with resistance, meet with approval."}
  ]
});

MODULES.push({
  id: "mcgap", kind: "items", title: "Multiple-choice gap-fill", short: "MC gap-fill", minutes: 6,
  instructions: "Three short texts with five gaps each. Click each gap to choose, then check all five at once. Linkers, collocations and verb patterns.",
  items: [
    {t:"pmcq", title:"The bag charge", text:"Since the introduction of a small charge for plastic bags in 2015, their use in British supermarkets has fallen by more than 95%. Few policies have {1} such a dramatic effect at so little cost. The charge works {2} because it is large but because it forces shoppers to make a conscious decision at the till. {3}, the policy has had a side effect that nobody predicted: sales of bin liners have risen sharply, as people who once reused free bags now have to buy them. Campaigners {4} that the overall benefit is still enormous, and most economists {5} with them.",
      gaps:[
        {o:["made","done","had","got"], a:2, e:"have an effect / have an impact / have an influence on."},
        {o:["no","never","none","not"], a:3, e:"works NOT because X but because Y — 'not … but …' contrast."},
        {o:["Despite","Although","Whereas","However"], a:3, e:"However, + full sentence. Despite + noun; Although / Whereas introduce a subordinate clause, not a sentence on its own."},
        {o:["persist","resist","insist","assist"], a:2, e:"insist that … = say firmly. persist in + -ing; resist + noun / -ing."},
        {o:["accept","agree","approve","admit"], a:1, e:"agree WITH somebody. approve OF something; accept / admit + noun or that-clause."}
      ]},
    {t:"pmcq", title:"The marathon boom", text:"Thirty years ago, running a marathon was a {1} achievement, attempted by a few thousand dedicated athletes. Today, big-city races attract {2} of entrants and have to allocate places by lottery. What {3} for this change? Part of the answer lies in technology: GPS watches and training apps have {4} the guesswork out of preparation. But the bigger factor may be social. Running has become something people do together, and finishing a marathon has turned into a {5} of passage for the middle-aged.",
      gaps:[
        {o:["rare","scarce","sparse","seldom"], a:0, e:"a rare achievement = unusual. scarce = not enough of it; sparse = thinly spread; seldom = rarely (adverb)."},
        {o:["ten thousands","tens thousand","tens of thousands","thousand tens"], a:2, e:"tens of thousands / hundreds of thousands / thousands OF entrants."},
        {o:["explains","counts","stands","accounts"], a:3, e:"account FOR = explain. ('explains' would need no 'for'.)"},
        {o:["taken","made","put","got"], a:0, e:"take the guesswork out of something = make it predictable. Also: take the pressure off."},
        {o:["right","ritual","rite","route"], a:2, e:"a rite of passage = an event marking a new stage in life."}
      ]},
    {t:"pmcq", title:"Open-plan offices", text:"Open-plan offices were supposed to encourage collaboration. {1}, a study by Harvard researchers found that face-to-face interaction actually fell by about 70% after companies {2} down the walls, while email traffic soared. Employees, it seems, {3} to headphones and messaging apps to recover some privacy. The findings have {4} many companies to reconsider, and some are now installing quiet zones and small meeting rooms. Whether this will {5} the damage remains to be seen.",
      gaps:[
        {o:["Otherwise","Instead","Besides","Likewise"], a:1, e:"Instead, … = contrary to what was expected. otherwise = if not; likewise = similarly."},
        {o:["hit","knocked","struck","beat"], a:1, e:"knock down a wall / a building. Also: tear down, pull down."},
        {o:["turned","went","moved","looked"], a:0, e:"turn to something = start using it as a solution. Also: resort to."},
        {o:["provoked","promoted","prompted","proposed"], a:2, e:"prompt somebody TO do = cause them to. provoke + noun (provoke anger); promote + noun."},
        {o:["untie","undo","unmake","unfold"], a:1, e:"undo the damage = reverse it. Also: repair the damage, limit the damage."}
      ]}
  ]
});

MODULES.push({
  id: "expr", kind: "items", title: "Expressions & phrasal verbs", short: "Expressions", minutes: 6,
  instructions: "Phrasal verbs, idioms, and six quick 'choose the natural reply' items (Cambridge's own Linguaskill tips sheet calls these social dialogues). Four options; press 1–4 or click.",
  items: [
    {t:"mcq", q:"The company is ___ a new range of products next spring.", o:["bringing up","bringing on","bringing round","bringing out"], a:3, e:"bring out = launch, publish. bring up = raise (a topic / a child); bring on = cause (an illness); bring round = persuade, or revive."},
    {t:"mcq", q:"I wish you'd stop ___ at me — I said I was sorry.", o:["going in","going out","going on","going over"], a:2, e:"go on at somebody = keep criticising, nag. go over = review; go out = leave the house, or (a fire) stop burning."},
    {t:"mcq", q:"The fire ___ in the kitchen and spread quickly.", o:["broke out","broke down","broke up","broke off"], a:0, e:"break out = start suddenly (fire, war, disease). break off = stop abruptly; break up = end (a relationship, a meeting)."},
    {t:"mcq", q:"She ___ the job offer because the salary was too low.", o:["turned up","turned over","turned out","turned down"], a:3, e:"turn down = reject. turn up = arrive; turn out = prove to be; turn over = flip."},
    {t:"mcq", q:"I can't ___ with all these changes to the schedule.", o:["keep up","keep on","keep off","keep in"], a:0, e:"keep up with = stay at the same pace / stay informed. keep on = continue; keep off = avoid."},
    {t:"mcq", q:"The charity was ___ up in 1985 to help homeless teenagers.", o:["put","got","set","made"], a:2, e:"set up = establish, found. Also: set up a meeting, set up a system."},
    {t:"mcq", q:"We'll have to ___ back on travel expenses this year.", o:["look","fall","take","cut"], a:3, e:"cut back on / cut down on = reduce. look back on = remember; fall back on = rely on in an emergency."},
    {t:"mcq", q:"He ___ up a convincing excuse on the spot.", o:["did","took","gave","made"], a:3, e:"make up = invent. Also: make up for = compensate; make up with = reconcile."},
    {t:"mcq", q:"The idea never really ___ off.", o:["took","got","went","set"], a:0, e:"take off = become successful quickly (also: a plane takes off). set off = depart; go off = explode, or (food) go bad."},
    {t:"mcq", q:"I ___ across some old photographs while clearing out the attic.", o:["went","got","came","fell"], a:2, e:"come across = find by chance. Also: stumble across / upon, chance upon."},
    {t:"mcq", q:"Let's not ___ the boat — the client is happy with the current design.", o:["shake","tip","swing","rock"], a:3, e:"rock the boat = cause trouble by changing a situation that works."},
    {t:"mcq", q:"He's been ___ the midnight oil to finish the report.", o:["burning","lighting","blazing","firing"], a:0, e:"burn the midnight oil = work late into the night."},
    {t:"mcq", q:"I only found out about the party ___ the grapevine.", o:["by","along","through","over"], a:2, e:"hear something through (or on) the grapevine = via gossip, unofficially."},
    {t:"mcq", q:"The new manager wants to ___ the ground running.", o:["strike","touch","reach","hit"], a:3, e:"hit the ground running = start a new job with energy and immediate effect."},
    {t:"mcq", q:"Don't count your ___ before they hatch.", o:["eggs","chicks","chickens","hens"], a:2, e:"don't count your chickens (before they hatch) = don't assume success before it happens."},
    {t:"mcq", q:"It's no use ___ the messenger — she's only passing on the news.", o:["hitting","firing","chasing","shooting"], a:3, e:"shoot the messenger = blame the person who brings bad news."},
    {t:"mcq", q:"We're going to have to ___ the bullet and replace the whole system.", o:["chew","eat","swallow","bite"], a:3, e:"bite the bullet = accept something unpleasant and get on with it."},
    {t:"mcq", q:"That's a ___ area — the rules don't say anything about it.", o:["dark","blank","grey","blind"], a:2, e:"a grey area = a situation the rules do not clearly cover. a blind spot = something you fail to notice."},
    {t:"mcq", prompt:"Could I possibly borrow your charger for a minute?", q:"Choose the most natural reply.", o:["Yes, you could possibly.","No, you possibly can.","Of course, I borrow it.","Of course — help yourself."], a:3, e:"'Could I possibly…?' is a polite request; 'Of course / Sure, go ahead / Help yourself' is the natural yes."},
    {t:"mcq", prompt:"I passed my driving test this morning!", q:"Choose the most natural reply.", o:["Good luck!","That's a shame.","Congratulations! First time?","You must be nervous."], a:2, e:"'passed' = succeeded, so congratulate. 'Good luck' is for BEFORE the test."},
    {t:"mcq", prompt:"Sorry to keep you waiting — the traffic was terrible.", q:"Choose the most natural reply.", o:["No problem, I've only just got here myself.","You're welcome.","It's my pleasure.","Yes, you kept me."], a:0, e:"Reply to an apology: 'No problem / Don't worry about it / Not at all'. 'You're welcome' answers a thank-you."},
    {t:"mcq", prompt:"Would you like me to give you a hand with those boxes?", q:"Choose the most natural reply.", o:["That's very kind of you, thanks.","Yes, I would like you.","No, I don't like boxes.","You're welcome."], a:0, e:"'give you a hand' = help. Accept an offer with 'That's very kind / That would be great, thanks'."},
    {t:"mcq", prompt:"I'm thinking of applying for the manager's job.", q:"Choose the most natural reply.", o:["You're welcome.","Never mind, maybe next time.","Yes, I'm thinking so.","Go for it — you'd be great."], a:3, e:"'Go for it' = do it, I encourage you. 'Never mind' is for disappointment."},
    {t:"mcq", prompt:"Do you mind if I leave a bit early today?", q:"Choose the most natural reply.", o:["Yes, I do, go ahead.","No, you can't.","Not at all — is everything all right?","Yes, please leave."], a:2, e:"'Do you mind if…?' — permission is given with 'Not at all' / 'No, go ahead'. 'Yes' would mean you object."}
  ]
});

<p class="lead">Session 2: the same nine drills with an entirely new set of about 160 questions, pitched at B2–C1 with a few C2-level stretch items. Same rules — work fast, read every explanation for the ones you miss, finish with the mistakes review. Your progress lives in this tab only, so don't refresh the page.</p>

<div class="cta-row"><button class="btn primary big" id="startHour">Start the hour ▶</button><span class="muted">Starts the 60-minute clock and opens the first drill.</span></div>

<h3>The hour at a glance</h3>
<table class="plan">
<thead><tr><th>Min</th><th>Module</th><th>What it trains</th></tr></thead>
<tbody>
<tr><td>9</td><td>Prepositions</td><td>Dependent prepositions and fixed phrases — the number-one target of the open gap-fill</td></tr>
<tr><td>9</td><td>Grammar gap-fill</td><td>Inversion, conditionals, relatives, linkers — one word per gap, exam format</td></tr>
<tr><td>7</td><td>Vocabulary &amp; collocations</td><td>Gapped sentences with four options</td></tr>
<tr><td>6</td><td>Multiple-choice gap-fill</td><td>Three texts, five gaps each</td></tr>
<tr><td>6</td><td>Expressions &amp; phrasal verbs</td><td>Phrasal verbs, idioms, and six quick natural-reply warm-ups</td></tr>
<tr><td>4</td><td>Read &amp; select</td><td>Notices, messages and emails — three options</td></tr>
<tr><td>5</td><td>Missing sentences</td><td>Text cohesion: five gaps, eight sentences</td></tr>
<tr><td>5</td><td>Extended reading</td><td>A long text with five questions in text order</td></tr>
<tr><td>8</td><td>Listening</td><td>Browser-voiced recordings: short clips, a talk, sentence completion</td></tr>
<tr><td>1+</td><td>Mistakes review</td><td>Everything you got wrong, in one place, with retries</td></tr>
</tbody></table>

<h3>What the test looks like</h3>
<ul class="tips">
<li><b>Listening first, then Reading.</b> Each module is about 40 minutes (maximum 59). The test is <b>adaptive</b>: when you answer well, the next questions get harder. A hard question is good news, not a sign you are failing.</li>
<li><b>Every recording plays twice</b>, with a pause between plays. You can read the questions before the audio starts: about 10 seconds for short tasks, 45 seconds for extended tasks.</li>
<li><b>No going back.</b> You can change answers on the current screen, but not on a previous one. Decide, then move on.</li>
<li><b>Open gap-fill: ONE word only.</b> No contractions, no two-word answers. If you want to type two words, you have misread the gap.</li>
<li><b>Never leave a blank.</b> Eliminate what you can and choose. There is nothing to gain from an empty answer.</li>
</ul>

<h3>Tactics by task type</h3>
<dl class="tactics">
<dt>Read &amp; select (notice, message, email)</dt><dd>The correct option paraphrases the <i>whole</i> message. Wrong options recycle words from the text with a twist: a changed modal (may → must), a swapped time, the wrong person doing the action. Ask: who does what, when, and under what condition?</dd>
<dt>Gapped sentences &amp; multiple-choice gap-fill</dt><dd>Decide the part of speech first. Then test collocation (which words keep company with the words around the gap?) and the grammar <i>after</i> the gap (preposition? -ing? to-infinitive?). Read the sentence back with your choice in place.</dd>
<dt>Open gap-fill</dt><dd>Nine answers in ten are grammar words: prepositions, articles, auxiliaries (has / had / did / been), pronouns, relatives (which / whose), conjunctions (although / whereas / unless / whether), quantifiers, and the small words so / such / too / enough / as / than / the. Look left for a verb or adjective that demands a preposition, or a negative adverb (hardly, not only, little, only after) that triggers inversion; look right at the subject and verb that follow the gap; check the tense of the whole sentence.</dd>
<dt>Extended reading</dt><dd>Questions follow the text order. Find the paragraph, then check each option against the text word by word. Beware of options that are true but do not answer the question, and of extreme words (always, never, all, only).</dd>
<dt>Missing sentences / paragraphs</dt><dd>Read the whole text once for the argument. Then hunt for referents (this, that, such, the latter, they) and connectors (however, even so, after all, similarly). Check tense and singular/plural agreement. Fill the easy gaps first and eliminate the distractors.</dd>
<dt>Listening</dt><dd>Use the pause to read the questions and predict synonyms (prices up → more expensive; call off → cancel). First play: answer. Second play: verify. In dialogues the real answer often comes after <i>but, actually, to be honest, having said that</i>. For agreement questions listen for <i>absolutely, I'll give you that, fair enough</i> versus <i>I'm not so sure, that's a bit harsh</i>. Write numbers as you hear them.</dd>
<dt>Sentence completion</dt><dd>Use the exact words from the recording, up to three words. Check spelling and singular/plural; the gap is usually a noun phrase, a time or a number.</dd>
<dt>Multiple matching (speakers)</dt><dd>Note each speaker's main point and attitude in a word or two before you choose. The options paraphrase; a speaker who repeats a word from an option is often the distractor.</dd>
</dl>

<h3>Before the test</h3>
<p>Finish this session at least a couple of hours before you sit down for the real thing, and do nothing in the last hour except eat and arrive early. Do the sound check properly and adjust the headphones before the first recording. If a question rattles you, it is probably because the test has decided you are good; answer it and let it go.</p>
`

  const fbWrap = el('div', { class: 'fb-list' });
  wrap.append(pass, el('div', { class: 'row' }, btn), fbWrap);
  function apply(){
    it.gaps.forEach((g, j) => { const rec = ctx.get(j); const sel = sels[j]; sel.value = rec.choice == null ? '' : String(rec.choice); sel.disabled = true; sel.classList.add(rec.ok ? 'ok' : 'bad'); fbWrap.append(fbNode(rec.ok, [g.o[g.a]], g.e, 'Gap ' + (j + 1) + ':')); });
    btn.remove();
  }
  if (ctx.get(0)) apply();
  else btn.addEventListener('click', () => {
    it.gaps.forEach((g, j) => { const v = sels[j].value; const choice = v === '' ? null : parseInt(v, 10); ctx.set(j, { ok: choice === g.a, choice, user: choice == null ? '(blank)' : g.o[choice], answers: [g.o[g.a]], prompt: contextOf(it.text, j + 1), exp: g.e, t: 'gap' }); });
    apply(); ctx.onDone && ctx.onDone();
  });
  return wrap;
}

function rMissing(it, ctx){
  const wrap = el('div', { class: 'item' });
  const pass = el('div', { class: 'passage' });
  if (it.title) pass.append(el('h4', {}, it.title));
  const sels = [];
  const list = el('ul', { class: 'optlist' });
  const lis = it.options.map((o, j) => { const li = el('li', {}, el('b', {}, LET[j]), el('span', {}, o)); list.append(li); return li; });
  function refreshUsed(){ const used = sels.map(s => s.value); lis.forEach((li, j) => li.classList.toggle('used', used.indexOf(String(j)) >= 0)); }
  buildPassage(pass, it.text, n => {
    const sel = el('select', { class: 'gapsel', 'aria-label': 'Gap ' + n }, el('option', { value: '' }, '— ' + n + ' —'));
    it.options.forEach((o, j) => sel.append(el('option', { value: String(j) }, LET[j])));
    sel.addEventListener('change', refreshUsed);
    sels[n - 1] = sel;
    return el('span', { class: 'gapwrap' }, el('span', { class: 'gapnum' }, String(n)), sel);
  });
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all gaps');
  const fbWrap = el('div', { class: 'fb-list' });
  wrap.append(pass, el('h4', { style: 'margin:0 0 8px' }, 'Sentences A–H (three are not used)'), list, el('div', { class: 'row' }, btn), fbWrap);
  function apply(){
    it.a.forEach((ans, j) => { const rec = ctx.get(j); const sel = sels[j]; sel.value = rec.choice == null ? '' : String(rec.choice); sel.disabled = true; sel.classList.add(rec.ok ? 'ok' : 'bad'); fbWrap.append(fbNode(rec.ok, [LET[ans] + ' — ' + it.options[ans]], it.e[j], 'Gap ' + (j + 1) + ':')); });
    refreshUsed(); btn.remove();
  }
  if (ctx.get(0)) apply();
  else btn.addEventListener('click', () => {
    it.a.forEach((ans, j) => { const v = sels[j].value; const choice = v === '' ? null : parseInt(v, 10); ctx.set(j, { ok: choice === ans, choice, user: choice == null ? '(blank)' : LET[choice] + ' — ' + it.options[choice], answers: [LET[ans] + ' — ' + it.options[ans]], prompt: 'Gap ' + (j + 1) + ' of “' + it.title + '”', exp: it.e[j], t: 'gap' }); });
    apply(); ctx.onDone && ctx.onDone();
  });
  return wrap;
}

function questionBlocks(qs, ctx, done){
  // returns {node, read(): choices[], apply()}
  const node = el('div');
  const chosen = qs.map(() => null);
  const groups = qs.map((q, qi) => {
    const block = el('div', { class: 'qblock' });
    block.append(el('p', { class: 'qt' }, (qi + 1) + '. ' + q.q));
    const opts = el('div', { class: 'opts' });
    const btns = q.o.map((o, j) => { const b = el('button', { class: 'opt', type: 'button' }, el('span', { class: 'k' }, LET[j]), el('span', {}, o)); opts.append(b); return b; });
    const fbWrap = el('div');
    block.append(opts, fbWrap);
    if (!done) btns.forEach((b, j) => b.addEventListener('click', () => { chosen[qi] = j; btns.forEach((x, k) => x.classList.toggle('chosen', k === j)); }));
    node.append(block);
    return { btns, fbWrap };
  });
  return {
    node,
    read: () => chosen,
    apply: () => qs.forEach((q, qi) => { const rec = ctx.get(qi); const g = groups[qi]; g.btns.forEach((b, j) => { b.disabled = true; b.classList.remove('chosen'); if (j === q.a) b.classList.add('ok'); else if (j === rec.choice) b.classList.add('bad'); }); g.fbWrap.replaceChildren(fbNode(rec.ok, [q.o[q.a]], q.e)); })
  };
}
function checkQuestions(qs, qb, ctx, promptPrefix){
  const ch = qb.read();
  qs.forEach((q, qi) => { const c = ch[qi]; ctx.set(qi, { ok: c === q.a, choice: c, user: c == null ? '(blank)' : q.o[c], answers: [q.o[q.a]], prompt: (promptPrefix || '') + q.q, exp: q.e, t: 'q' }); });
}

function rReading(it, ctx){
  const wrap = el('div', { class: 'item' });
  const pass = el('div', { class: 'passage' });
  if (it.title) pass.append(el('h4', {}, it.title));
  buildPassage(pass, it.text, () => document.createTextNode(''), true);
  const done = !!ctx.get(0);
  const qb = questionBlocks(it.qs, ctx, done);
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all answers');
  wrap.append(pass, qb.node, el('div', { class: 'row' }, btn));
  if (done){ qb.apply(); btn.remove(); }
  else btn.addEventListener('click', () => { checkQuestions(it.qs, qb, ctx, ''); qb.apply(); btn.remove(); ctx.onDone && ctx.onDone(); });
  return wrap;
}

function rLmcq(it, ctx){
  const r = ctx.get(0);
  const wrap = el('div', { class: 'item' });
  if (it.pre) wrap.append(el('p', { class: 'instructions' }, it.pre));
  const player = makePlayer(it);
  wrap.append(player.node);
  wrap.append(el('p', { class: 'q small' }, it.q));
  const opts = el('div', { class: 'opts' });
  const btns = it.o.map((o, j) => { const b = el('button', { class: 'opt', type: 'button', 'data-opt': j }, el('span', { class: 'k' }, LET[j]), el('span', {}, o)); opts.append(b); return b; });
  const fbWrap = el('div');
  wrap.append(opts, fbWrap);
  function apply(rec){ btns.forEach((b, j) => { b.disabled = true; if (j === it.a) b.classList.add('ok'); else if (j === rec.choice) b.classList.add('bad'); }); fbWrap.replaceChildren(fbNode(rec.ok, [it.o[it.a]], it.e)); player.reveal(); }
  if (r) apply(r);
  else btns.forEach((b, j) => b.addEventListener('click', () => {
    const rec = { ok: j === it.a, choice: j, user: it.o[j], answers: [it.o[it.a]], prompt: '(' + it.label + ') ' + it.q, exp: it.e, t: 'mcq' };
    ctx.set(0, rec); apply(rec); ctx.onDone && ctx.onDone();
  }));
  return wrap;
}

function rLext(it, ctx){
  const wrap = el('div', { class: 'item' });
  if (it.pre) wrap.append(el('p', { class: 'instructions' }, it.pre));
  const player = makePlayer(it);
  const done = !!ctx.get(0);
  const qb = questionBlocks(it.qs, ctx, done);
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all answers');
  wrap.append(player.node, qb.node, el('div', { class: 'row' }, btn));
  if (done){ qb.apply(); btn.remove(); player.reveal(); }
  else btn.addEventListener('click', () => { checkQuestions(it.qs, qb, ctx, '(' + it.label + ') '); qb.apply(); btn.remove(); player.reveal(); ctx.onDone && ctx.onDone(); });
  return wrap;
}

function rLcomp(it, ctx){
  const wrap = el('div', { class: 'item' });
  if (it.pre) wrap.append(el('p', { class: 'instructions' }, it.pre));
  const player = makePlayer(it);
  const list = el('div', { class: 'sentlist' });
  const inputs = it.sentences.map((s, j) => {
    const parts = s.s.split('___');
    const inp = gapInput('wide');
    list.append(el('div', {}, el('span', { class: 'gapnum' }, String(j + 1)), parts[0], inp, parts[1] || ''));
    return inp;
  });
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all answers');
  const fbWrap = el('div', { class: 'fb-list' });
  wrap.append(player.node, list, el('div', { class: 'row' }, btn), fbWrap);
  function apply(){
    it.sentences.forEach((s, j) => { const rec = ctx.get(j); const inp = inputs[j]; setGapValue(inp, rec.user === '(blank)' ? '' : rec.user); inp.disabled = true; inp.classList.add(rec.ok ? 'ok' : 'bad'); fbWrap.append(fbNode(rec.ok, [s.a[0]], s.e, (j + 1) + '.')); });
    btn.remove(); player.reveal();
  }
  if (ctx.get(0)) apply();
  else {
    btn.addEventListener('click', () => {
      it.sentences.forEach((s, j) => { const user = inputs[j].value.trim(); ctx.set(j, { ok: matchAnswer(user, s.a, 'any'), user: user || '(blank)', answers: [s.a[0]], prompt: s.s.replace('___', '_____'), exp: s.e, t: 'gap' }); });
      apply(); ctx.onDone && ctx.onDone();
    });
    inputs.forEach((inp, j) => inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return; e.preventDefault(); e.stopPropagation();
      const next = inputs.find((x, k) => k > j && !x.value.trim()) || inputs.find(x => !x.value.trim());
      if (next) next.focus(); else btn.click();
    }));
  }
  return wrap;
}

const RENDER = { typed: rTyped, mcq: rMcq, ptyped: rPTyped, pmcq: rPMcq, missing: rMissing, reading: rReading, lmcq: rLmcq, lext: rLext, lcomp: rLcomp };

/* ---------- screens ---------- */
const mainEl = () => document.getElementById('main');

function ctxFor(m, i, onDone){
  return {
    get: sub => state.res[keyOf(m.id, i, sub || 0)],
    set: (sub, rec) => record(keyOf(m.id, i, sub), Object.assign({ mid: m.id, i: i, sub: sub }, rec)),
    onDone
  };
}

function renderModule(mid){
  TTS.stop();
  const m = byId(mid);
  state.cur = mid;
  const main = mainEl();
  main.replaceChildren();
  refreshNav();
  if (m.kind === 'info') return renderInfo(m);
  if (m.kind === 'review') return renderReview(m);
  if (m.kind === 'summary') return renderSummary(m);
  renderItems(m);
  window.scrollTo({ top: 0 });
}

function moduleHead(m){
  const st = moduleStats(m);
  const spent = state.modTime[m.id] || 0;
  const meta = el('div', { class: 'meta' });
  meta.append(el('div', {}, 'Suggested ', el('b', {}, m.minutes + ' min'), ' · spent ', el('b', { 'data-role': 'spent' }, fmtTime(spent))));
  if (m.kind === 'items') meta.append(el('div', {}, 'Score ', el('b', {}, st.correct + ' / ' + st.answered), ' answered of ', st.total));
  return el('div', { class: 'mod-head' }, el('h2', {}, m.title), meta);
}

function renderItems(m){
  const main = mainEl();
  const i = state.idx[m.id] || 0;
  const n = m.items.length;
  const card = el('div', { class: 'card' });
  card.append(moduleHead(m));
  if (m.instructions) card.append(el('p', { class: 'instructions' }, m.instructions));
  const st = moduleStats(m);
  card.append(el('div', { class: 'progress' }, el('i', { style: 'width:' + (st.total ? (100 * st.answered / st.total) : 0) + '%' })));
  main.append(card);

  if (i >= n){ renderModuleSummary(m, card); return; }

  const it = m.items[i];
  const counter = el('div', { class: 'counter' });
  counter.append(el('span', {}, 'Screen ' + (i + 1) + ' of ' + n + (itemPoints(it) > 1 ? ' · ' + itemPoints(it) + ' answers' : '')));
  const nextBtn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'next' }, i === n - 1 ? 'Finish module →' : 'Next →');
  const prevBtn = el('button', { class: 'btn ghost', type: 'button' }, '← Previous');
  prevBtn.disabled = i === 0;
  prevBtn.addEventListener('click', () => { state.idx[m.id] = i - 1; renderModule(m.id); });
  nextBtn.addEventListener('click', () => { state.idx[m.id] = i + 1; renderModule(m.id); });
  nextBtn.disabled = !isAnswered(m, i);
  if (!isAnswered(m, i)){
    const skip = el('button', { class: 'skip', type: 'button' }, 'skip for now');
    skip.addEventListener('click', () => { state.idx[m.id] = i + 1; renderModule(m.id); });
    counter.append(skip);
  }
  card.append(counter);
  const ctx = ctxFor(m, i, () => { nextBtn.disabled = false; nextBtn.focus({ preventScroll: true }); const sk = counter.querySelector('.skip'); if (sk) sk.remove(); card.querySelector('.progress i').style.width = (100 * moduleStats(m).answered / moduleTotal(m)) + '%'; card.replaceChild(moduleHead(m), card.querySelector('.mod-head')); });
  const node = RENDER[it.t](it, ctx);
  card.append(node);
  card.append(el('div', { class: 'row', style: 'justify-content:space-between;margin-top:18px' }, prevBtn, nextBtn));
  const KB = { mcq: 'Keys: 1–4 choose · Enter next', lmcq: 'Keys: 1–3 choose · Enter next', typed: 'Keys: Enter check · Enter again next', ptyped: 'Keys: Enter jumps to the next empty gap, then checks · Enter next', lcomp: 'Keys: Enter jumps to the next empty gap, then checks · Enter next' };
  card.append(el('div', { class: 'kbd' }, KB[it.t] || 'Choose every gap or question, then Check · Enter next'));
  if (ctx.focus) setTimeout(ctx.focus, 30);
}

function renderModuleSummary(m, card){
  const st = moduleStats(m);
  const pct = st.answered ? Math.round(100 * st.correct / st.answered) : 0;
  const box = el('div', { class: 'mod-summary' });
  box.append(el('div', { class: 'score' }, st.correct + ' / ' + st.total));
  const unanswered = st.total - st.answered;
  box.append(el('p', {}, (st.answered ? pct + '% of what you answered' : 'Nothing answered yet') + (unanswered ? ' · ' + unanswered + ' unanswered' : '') + ' · time on this module ' + fmtTime(state.modTime[m.id] || 0) + ' (suggested ' + m.minutes + ')'));
  const row = el('div', { class: 'row', style: 'justify-content:center' });
  const back = el('button', { class: 'btn ghost', type: 'button' }, '← Back to the last screen');
  back.addEventListener('click', () => { state.idx[m.id] = m.items.length - 1; renderModule(m.id); });
  const nextM = nextModuleOf(m);
  const go = el('button', { class: 'btn primary', type: 'button', 'data-role': 'next' }, nextM ? 'Next: ' + nextM.title + ' →' : 'Session summary →');
  go.addEventListener('click', () => renderModule(nextM ? nextM.id : 'summary'));
  row.append(back, go);
  box.append(row);
  card.append(box);
  const wrong = wrongRecords().filter(r => r.mid === m.id);
  if (wrong.length){
    const c2 = el('div', { class: 'card' }, el('h3', { style: 'margin-top:0' }, 'What you missed in this module (' + wrong.length + ')'));
    wrong.forEach(r => c2.append(flashcard(r)));
    mainEl().append(c2);
  }
}
function nextModuleOf(m){
  const i = MODULES.indexOf(m);
  for (let j = i + 1; j < MODULES.length; j++) if (MODULES[j].kind === 'items') return MODULES[j];
  return null;
}

function renderInfo(m){
  const card = el('div', { class: 'card' });
  card.append(el('div', { class: 'mod-head' }, el('h2', {}, m.title)));
  const body = el('div', { html: m.html });
  card.append(body);
  mainEl().append(card);
  const start = body.querySelector('#startHour');
  if (start) start.addEventListener('click', () => { startTimer(false); renderModule('prep'); toast('Clock running — 60:00. Go.'); });
  window.scrollTo({ top: 0 });
}

function wrongRecords(){
  const out = [];
  MODULES.forEach(m => { if (m.kind !== 'items') return;
    m.items.forEach((it, i) => { for (let sub = 0; sub < itemPoints(it); sub++){ const r = state.res[keyOf(m.id, i, sub)]; if (r && !r.ok) out.push(r); } });
  });
  return out;
}
function flashcard(r){
  const f = el('div', { class: 'flash' });
  f.append(el('div', { class: 'ctx' }, r.prompt));
  f.append(el('div', {}, el('span', { class: 'u' }, r.user), el('span', { class: 'c' }, r.answers[0])));
  if (r.exp) f.append(el('div', { class: 'e' }, r.exp));
  return f;
}

function renderReview(m){
  const main = mainEl();
  const card = el('div', { class: 'card' });
  card.append(el('div', { class: 'mod-head' }, el('h2', {}, m.title)));
  const wrong = wrongRecords();
  if (!wrong.length){
    card.append(el('p', { class: 'lead' }, 'Nothing here yet. Mistakes from every drill collect on this page, with a retry for each one.'));
    main.append(card); return;
  }
  let retried = 0, fixed = 0;
  for (const k in state.retryRes){ retried++; if (state.retryRes[k].ok) fixed++; }
  card.append(el('p', { class: 'lead' }, wrong.length + ' mistake' + (wrong.length === 1 ? '' : 's') + ' so far. Single-sentence items can be retried below; passage questions are shown as flashcards.' + (retried ? ' Retried ' + retried + ', fixed ' + fixed + '.' : '')));
  const resetBtn = el('button', { class: 'btn ghost', type: 'button' }, 'Clear retries');
  resetBtn.addEventListener('click', () => { state.retryRes = {}; renderModule('review'); });
  if (retried) card.append(el('div', { class: 'row' }, resetBtn));
  main.append(card);
  MODULES.forEach(mod => {
    const items = wrong.filter(r => r.mid === mod.id);
    if (!items.length) return;
    const g = el('div', { class: 'card review-group' });
    g.append(el('h3', { style: 'margin-top:0' }, mod.title, el('span', { class: 'pill bad' }, items.length + ' wrong')));
    items.forEach(r => {
      const it = mod.items[r.i];
      if (r.t === 'typed' || (r.t === 'mcq' && (it.t === 'mcq' || it.t === 'lmcq'))){
        const key = 'r:' + keyOf(mod.id, r.i, r.sub);
        const box = el('div', { class: 'retry' });
        const rr = state.retryRes[key];
        box.append(el('div', { class: 'muted', style: 'font-size:13px;margin-bottom:6px' }, 'Retry — you answered ', el('span', { class: 'u', style: 'color:var(--bad);text-decoration:line-through' }, r.user), rr ? el('span', { class: 'pill ' + (rr.ok ? 'ok' : 'bad') }, rr.ok ? 'fixed' : 'still wrong') : ''));
        const ctx = { get: () => state.retryRes[key], set: (sub, rec) => { record(key, rec, true); }, onDone: () => { const p = box.querySelector('.pill'); if (p) p.remove(); const rr2 = state.retryRes[key]; box.firstChild.append(el('span', { class: 'pill ' + (rr2.ok ? 'ok' : 'bad') }, rr2.ok ? 'fixed' : 'still wrong')); } };
        const renderer = it.t === 'lmcq' ? rMcq : RENDER[it.t];
        const itemForRetry = it.t === 'lmcq' ? Object.assign({}, it, { q: it.q, prompt: null }) : it;
        box.append(renderer(itemForRetry, ctx));
        g.append(box);
      } else g.append(flashcard(r));
    });
    main.append(g);
  });
  window.scrollTo({ top: 0 });
}

function renderSummary(m){
  const main = mainEl();
  const card = el('div', { class: 'card' });
  card.append(el('div', { class: 'mod-head' }, el('h2', {}, m.title)));
  const all = allStats();
  const pct = all.answered ? Math.round(100 * all.correct / all.answered) : 0;
  const used = state.timer.total - state.timer.remaining;
  const stats = el('div', { class: 'bigstat' });
  stats.append(el('div', {}, el('b', {}, pct + '%'), el('span', {}, 'accuracy on answered items')));
  stats.append(el('div', {}, el('b', {}, all.correct + ' / ' + all.answered), el('span', {}, 'correct / answered (of ' + all.total + ')')));
  stats.append(el('div', {}, el('b', {}, fmtTime(used)), el('span', {}, 'of the hour used')));
  card.append(stats);
  const grid = el('div', { class: 'scoregrid' });
  const ranked = [];
  MODULES.forEach(mod => {
    if (mod.kind !== 'items') return;
    const s = moduleStats(mod);
    const p = s.answered ? Math.round(100 * s.correct / s.answered) : 0;
    if (s.answered >= 5) ranked.push({ mod, p });
    const sc = el('div', { class: 'scorecard' });
    sc.append(el('b', {}, mod.title));
    sc.append(el('div', { class: 'bar' }, el('i', { class: p >= 80 ? '' : (p >= 60 ? 'mid' : 'low'), style: 'width:' + (s.answered ? p : 0) + '%' })));
    sc.append(el('small', {}, s.answered ? (s.correct + ' / ' + s.answered + ' answered · ' + p + '%' + (s.answered < s.total ? ' · ' + (s.total - s.answered) + ' left' : '')) : 'not started'));
    grid.append(sc);
  });
  card.append(grid);
  ranked.sort((a, b) => a.p - b.p);
  if (ranked.length){
    const weak = ranked.slice(0, 2).filter(x => x.p < 85);
    if (weak.length) card.append(el('p', {}, el('b', {}, 'Where to spend your last ten minutes: '), weak.map(x => x.mod.title + ' (' + x.p + '%)').join(' and ') + '. Open the mistakes review and read the explanations again, then skim the matching reference sheet.'));
    else card.append(el('p', {}, el('b', {}, 'Strong across the board. '), 'Reread the game plan tactics, skim the reference sheets, and stop early — rest is the best thing you can do now.'));
  }
  const row = el('div', { class: 'row' });
  const b1 = el('button', { class: 'btn primary', type: 'button' }, 'Mistakes review'); b1.addEventListener('click', () => renderModule('review'));
  const b2 = el('button', { class: 'btn', type: 'button' }, 'Reference sheets'); b2.addEventListener('click', () => renderModule('ref'));
  row.append(b1, b2);
  card.append(row);
  main.append(card);
  window.scrollTo({ top: 0 });
}

/* ---------- nav / header ---------- */
function refreshNav(){
  const nav = document.getElementById('nav');
  if (!nav) return;
  nav.replaceChildren();
  let num = 0;
  MODULES.forEach(m => {
    num++;
    const b = el('button', { class: 'navbtn', type: 'button' });
    const st = m.kind === 'items' ? moduleStats(m) : null;
    const done = st && st.answered >= st.total && st.total > 0;
    if (m.id === state.cur) b.classList.add('active');
    if (done) b.classList.add('done');
    let sub = '';
    if (st) sub = (st.answered ? st.correct + '/' + st.answered + ' · ' : '') + (st.answered < st.total ? (st.total - st.answered) + ' left · ' : '') + m.minutes + ' min';
    else if (m.kind === 'review'){ const w = wrongRecords().length; sub = w ? w + ' to review' : 'collects your mistakes'; }
    else if (m.kind === 'summary') sub = 'scores by module';
    else sub = m.id === 'plan' ? 'read first · ' + m.minutes + ' min' : 'tables to skim';
    b.append(el('span', { class: 'num' }, done ? '✓' : String(num)), el('span', { class: 'lbl' }, el('b', {}, m.short || m.title), el('span', {}, sub)));
    b.addEventListener('click', () => renderModule(m.id));
    nav.append(b);
  });
}
function refreshOverall(){
  const o = document.getElementById('overall');
  const s = allStats();
  o.replaceChildren(el('span', {}, 'Answered ', el('b', {}, s.answered + '/' + s.total), s.answered ? ' · ' : ''), s.answered ? el('span', {}, el('b', {}, Math.round(100 * s.correct / s.answered) + '%'), ' correct') : '');
}

/* ---------- timer ---------- */
function startTimer(silent){
  const t = state.timer;
  if (t.done) return;
  t.started = true; t.running = true; t.last = Date.now();
  refreshTimer();
  if (!silent) toast('Clock running — ' + fmtTime(t.remaining));
}
function pauseTimer(){ state.timer.running = false; refreshTimer(); }
function tick(){
  const t = state.timer;
  if (!t.running) return;
  const now = Date.now(); const dt = (now - t.last) / 1000; t.last = now;
  t.remaining = Math.max(0, t.remaining - dt);
  state.modTime[state.cur] = (state.modTime[state.cur] || 0) + dt;
  const spent = document.querySelector('[data-role="spent"]'); if (spent) spent.textContent = fmtTime(state.modTime[state.cur] || 0);
  if (t.remaining <= 0){ t.running = false; t.done = true; toast("Time's up. Finish this screen, then open the summary."); }
  refreshTimer();
}
function refreshTimer(){
  const t = state.timer;
  const box = document.getElementById('timer');
  const d = box.querySelector('.digits'); d.textContent = fmtTime(t.remaining);
  box.classList.toggle('warn', t.remaining <= 600 && t.remaining > 180);
  box.classList.toggle('danger', t.remaining <= 180);
  const b = box.querySelector('[data-role="toggle"]');
  b.textContent = t.done ? 'Done' : (t.running ? 'Pause' : (t.started ? 'Resume' : 'Start'));
  b.disabled = t.done;
}
function resetAll(){
  if (!confirm('Reset the whole session? All answers and the clock will be cleared.')) return;
  state.idx = {}; state.res = {}; state.retryRes = {}; state.modTime = {};
  state.timer = { total: 3600, remaining: 3600, running: false, started: false, last: 0, done: false };
  refreshTimer(); refreshOverall(); renderModule('plan');
}
let toastT = null;
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = el('div', { id: 'toast', class: 'toast' }); document.body.append(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
  const main = mainEl(); if (!main) return;
  if (e.key === 'Enter'){
    const check = main.querySelector('button[data-role="check"]');
    if (check && !check.disabled){ check.click(); e.preventDefault(); return; }
    const next = main.querySelector('button[data-role="next"]');
    if (next && !next.disabled){ next.click(); e.preventDefault(); }
    return;
  }
  if (/^[1-4]$/.test(e.key)){
    const item = main.querySelector('.item');
    if (!item) return;
    const opts = item.querySelectorAll('.opts');
    if (opts.length !== 1) return;
    const btn = opts[0].querySelectorAll('button.opt')[parseInt(e.key, 10) - 1];
    if (btn && !btn.disabled){ btn.click(); e.preventDefault(); }
  }
});

/* ---------- boot ---------- */
function boot(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const timer = el('div', { id: 'timer', class: 'timer' }, el('span', { class: 'digits' }, '60:00'));
  const tBtn = el('button', { type: 'button', 'data-role': 'toggle' }, 'Start');
  tBtn.addEventListener('click', () => { state.timer.running ? pauseTimer() : startTimer(false); });
  const rBtn = el('button', { type: 'button', class: 'secondary', title: 'Reset everything' }, '↺');
  rBtn.addEventListener('click', resetAll);
  timer.append(tBtn, rBtn);
  const top = el('div', { class: 'topbar' }, el('div', { class: 'topbar-inner' },
    el('div', { class: 'brand' }, 'Linguaskill Power Hour', el('small', {}, (typeof SESSION_LABEL !== 'undefined' && SESSION_LABEL ? SESSION_LABEL + ' · ' : '') + 'Reading & Listening · C1 target')),
    el('div', { class: 'spacer' }),
    el('div', { id: 'overall', class: 'overall' }),
    timer));
  const shell = el('div', { class: 'shell' }, el('nav', { id: 'nav', class: 'side', 'aria-label': 'Modules' }), el('main', { id: 'main' }));
  app.append(top, shell);
  refreshOverall(); refreshTimer();
  renderModule('plan');
  setInterval(tick, 250);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
