<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguaskill Power Hour — Reading &amp; Listening (C1)</title>
<meta name="description" content="A one-hour intensive practice session for the Linguaskill General Reading and Listening test: prepositions, grammar gap-fill, collocations, phrasal verbs, notices, text cohesion, extended reading and browser-voiced listening.">
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --panel2:#f0f2f7; --text:#1b1f2a; --muted:#5d6472; --border:#d9dde6;
  --accent:#2a4bd7; --accent-ink:#ffffff; --accent-soft:#e6ebff;
  --ok:#157a3a; --ok-soft:#dff5e6; --bad:#c0262d; --bad-soft:#fde4e5; --warn:#b26b00; --warn-soft:#fff1d6;
  --sign:#fffbe8; --sign-border:#e8d48a;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121419; --panel:#1b1e26; --panel2:#232733; --text:#e8eaf0; --muted:#a0a7b6; --border:#343947;
    --accent:#7c93ff; --accent-ink:#0d1020; --accent-soft:#252c4a;
    --ok:#4ad07a; --ok-soft:#163421; --bad:#ff7b81; --bad-soft:#40191c; --warn:#ffc266; --warn-soft:#3b2d12;
    --sign:#2a2714; --sign-border:#6b5d2a; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select{font:inherit}
a{color:var(--accent)}
.muted{color:var(--muted)}
.hidden{display:none !important}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.timer{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 14px}
.timer .digits{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:66px;letter-spacing:.02em}
.timer.warn .digits{color:var(--warn)} .timer.danger .digits{color:var(--bad)}
.timer button{border:none;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.timer button.secondary{background:transparent;color:var(--muted);padding:6px 8px}
.overall{font-size:13px;color:var(--muted);white-space:nowrap}
.overall b{color:var(--text)}
@media (max-width:600px){
  .topbar-inner{padding:8px 12px;gap:8px}
  .brand{font-size:15px}
  .brand small{display:none}
  .timer{padding:3px 4px 3px 10px}
  .timer .digits{font-size:17px;min-width:54px}
  .timer button{padding:5px 10px;font-size:14px}
  .overall{font-size:12px;order:5;width:100%}
}

.shell{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:250px 1fr;gap:16px}
@media (max-width:860px){.shell{grid-template-columns:1fr;padding:12px}}

nav.side{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){nav.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px;-webkit-overflow-scrolling:touch}}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;transition:background .12s}
.navbtn:hover{background:var(--panel2)}
.navbtn.active{border-color:var(--accent);background:var(--accent-soft)}
.navbtn .num{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.navbtn.done .num{background:var(--ok-soft);color:var(--ok)}
.navbtn .lbl{flex:1;min-width:0}
.navbtn .lbl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn .lbl span{font-size:12px;color:var(--muted)}
@media (max-width:860px){.navbtn{width:auto;flex:none;padding:6px 10px}.navbtn .lbl span{display:none}}

main{min-width:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
@media (max-width:600px){.card{padding:16px 14px}}
.card+.card{margin-top:14px}
.mod-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.mod-head h2{margin:0;font-size:22px;letter-spacing:-.01em}
.mod-head .meta{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);line-height:1.4}
.mod-head .meta b{color:var(--text)}
.instructions{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.progress{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:0 0 16px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.counter{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.counter .skip{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}

h3{font-size:17px;margin:22px 0 8px}
p.lead{font-size:16.5px;margin:0 0 14px}

/* ---------- items ---------- */
.item .q{font-size:19px;line-height:1.7;margin:4px 0 14px}
.item .q.small{font-size:16.5px}
input.gap{display:inline-block;width:7.5ch;min-width:7.5ch;margin:0 3px;padding:2px 8px;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;text-align:center;font-weight:600;font-size:inherit;color:var(--text);outline:none}
input.gap:focus{box-shadow:0 0 0 3px rgba(42,75,215,.18)}
input.gap.wide{width:14ch;min-width:14ch}
input.gap.ok{background:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok)}
input.gap.bad{background:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
input.gap:disabled{opacity:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:transform .05s, background .12s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-size:17px;padding:12px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.cta-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 6px}

.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:16px;line-height:1.45}
.opt:hover:not(:disabled){background:var(--panel2)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt.chosen .k{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.6}

.fb{margin-top:10px;border-radius:10px;padding:10px 14px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .verdict{font-weight:700}
.fb .ans{font-weight:700}
.fb-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fb-list .fb{display:block;margin:0;padding:8px 12px}

.sign{white-space:pre-line;background:var(--sign);border:1px solid var(--sign-border);border-radius:10px;padding:14px 16px;margin:4px 0 14px;font-size:16px;line-height:1.5}
.sign-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.prompt{background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:17px;margin:4px 0 12px}

.passage{font-size:17px;line-height:1.85;background:var(--panel2);border-radius:10px;padding:16px 18px;margin:4px 0 12px}
.passage p{margin:0 0 12px} .passage p:last-child{margin:0}
.passage .pn{display:inline-block;font-size:11px;color:var(--muted);vertical-align:top;margin-right:6px;font-weight:700}
.passage h4{margin:0 0 10px;font-size:18px}
.passage input.gap{font-size:16px}
.gapnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;margin:0 4px 0 0;vertical-align:1px}
select.gapsel{appearance:none;-webkit-appearance:none;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:2px 22px 2px 8px;margin:0 2px;font-weight:600;color:var(--text);cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23777'/></svg>");background-repeat:no-repeat;background-position:right 7px center}
select.gapsel.ok{background-color:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok)}
select.gapsel.bad{background-color:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad)}
select.gapsel:disabled{opacity:1}
.optlist{columns:2;column-gap:20px;margin:0 0 12px;padding:0;list-style:none;font-size:15px}
@media (max-width:700px){.optlist{columns:1}}
.optlist li{break-inside:avoid;margin:0 0 8px;display:flex;gap:8px}
.optlist li b{flex:none;width:22px;height:22px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font-size:12px}
.optlist li.used{opacity:.5}

.qblock{border-top:1px solid var(--border);padding:14px 0 4px}
.qblock .qt{font-weight:600;margin:0 0 8px;font-size:16.5px}
.qblock .opts{gap:6px}
.qblock .opt{padding:8px 10px;font-size:15px}

/* ---------- listening ---------- */
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:12px 14px;margin:4px 0 14px}
.player .play{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.player .play.playing{background:var(--bad)}
.player .state{font-size:13px;color:var(--muted)}
.player .bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:4px}
.player .bars i{width:3px;background:var(--accent);height:4px;border-radius:2px}
.player.playing .bars i{animation:eq .8s infinite ease-in-out}
.player.playing .bars i:nth-child(2){animation-delay:.15s}.player.playing .bars i:nth-child(3){animation-delay:.3s}.player.playing .bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.transcript{background:var(--panel2);border-radius:10px;padding:12px 16px;font-size:15px;line-height:1.7;margin:10px 0}
.transcript .spk{font-weight:700;color:var(--muted);margin-right:6px}
.transcript p{margin:0 0 8px}
.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 12px}
.sentlist{display:flex;flex-direction:column;gap:12px;margin:8px 0 10px;font-size:17px}

/* ---------- summary / review ---------- */
.scoregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.scorecard{background:var(--panel2);border-radius:10px;padding:12px 14px}
.scorecard b{display:block;font-size:14px;margin-bottom:6px}
.scorecard .bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin:6px 0}
.scorecard .bar i{display:block;height:100%;background:var(--ok)}
.scorecard .bar i.mid{background:var(--warn)} .scorecard .bar i.low{background:var(--bad)}
.scorecard small{color:var(--muted)}
.bigstat{display:flex;gap:20px;flex-wrap:wrap;margin:6px 0 14px}
.bigstat div{background:var(--panel2);border-radius:10px;padding:12px 18px;min-width:140px}
.bigstat div b{display:block;font-size:28px;line-height:1.1}
.bigstat div span{font-size:13px;color:var(--muted)}
.mod-summary{text-align:center;padding:10px 0 4px}
.mod-summary .score{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mod-summary p{margin:8px 0 16px;color:var(--muted)}
.review-group h3{margin-top:18px}
.flash{background:var(--panel2);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.flash .ctx{font-size:16px;margin-bottom:6px}
.flash .u{color:var(--bad);text-decoration:line-through;margin-right:8px}
.flash .c{color:var(--ok);font-weight:700}
.flash .e{color:var(--muted);margin-top:4px;font-size:14px}
.retry{border:1px dashed var(--border);border-radius:10px;padding:10px 14px;margin:8px 0}
.retry .item .q{font-size:17px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-left:8px;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- info pages ---------- */
table.plan,table.ref{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 10px}
table.plan th,table.plan td,table.ref th,table.ref td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.plan th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.plan td:first-child{font-weight:700;white-space:nowrap;width:50px}
table.ref th{width:190px;font-weight:700;color:var(--text);background:var(--panel2)}
@media (max-width:600px){table.ref th{width:110px;font-size:13px}table.ref td{font-size:13.5px}}
ul.tips{padding-left:20px} ul.tips li{margin:0 0 8px}
dl.tactics dt{font-weight:700;margin-top:12px} dl.tactics dd{margin:4px 0 0;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips span{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:13.5px;white-space:nowrap}
.chips span b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.kbd{font-size:12px;color:var(--muted);margin-top:10px}
.kbd kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-family:inherit;font-size:11px;background:var(--panel2)}
.fallback{max-width:720px;margin:40px auto;padding:20px;font-family:var(--font)}

</style>
</head>
<body>
<div id="app">
  <div class="fallback">
    <h1>Linguaskill Power Hour</h1>
    <p>This page needs JavaScript. If you are seeing this inside a preview, download the file and open it in Chrome, Edge, Safari or Firefox.</p>
  </div>
</div>
<script>
/* ===== Linguaskill Power Hour — data (part 1: drills) ===== */
const MODULES = [];

MODULES.push({
  id: "prep", kind: "items", title: "Prepositions", short: "Prepositions", minutes: 9,
  instructions: "Type ONE word in each gap. Enter checks your answer; Enter again moves on. Read the explanation every time you miss one — these are the patterns the open gap-fill lives on.",
  items: [
    {t:"typed", q:"The company is on the verge ___ bankruptcy after three disastrous quarters.", a:["of"], e:"on the verge of (+ noun / -ing) = about to. Also: on the brink of, on the point of."},
    {t:"typed", q:"Her promotion came ___ the expense of her health.", a:["at"], e:"at the expense of = with the loss or sacrifice of. Compare: at the cost of, at all costs."},
    {t:"typed", q:"All procedures must be carried out ___ accordance with the safety regulations.", a:["in"], e:"in accordance with = following (a rule, a wish). Also: in line with, in keeping with, in compliance with."},
    {t:"typed", q:"I am writing ___ regard to your letter of 3 March.", a:["with","in"], e:"with regard to / in regard to = concerning. Not 'in regards to'. Also: as regards, regarding, with reference to."},
    {t:"typed", q:"Young children are particularly susceptible ___ this kind of infection.", a:["to"], e:"susceptible to = easily affected by. Same pattern: prone to, vulnerable to, immune to, resistant to."},
    {t:"typed", q:"The findings are completely ___ odds with the earlier study.", a:["at"], e:"at odds with = in disagreement / in conflict with. Also: at variance with."},
    {t:"typed", q:"Thousands lost their jobs ___ the wake of the financial crisis.", a:["in"], e:"in the wake of = following, as a consequence of. Also: in the aftermath of, on the heels of. (Not 'in the light of', which means 'taking into account'.)"},
    {t:"typed", q:"He accepted the award ___ behalf of the whole team.", a:["on"], e:"on behalf of = representing. (American English also has 'in behalf of' — use 'on'.)"},
    {t:"typed", q:"___ no circumstances should the door be left unlocked.", a:["under","in"], e:"Under (or in) no circumstances + inversion (should the door…). Same family: in no way, at no time, on no account."},
    {t:"typed", q:"The results are ___ no means conclusive.", a:["by"], e:"by no means = not at all. Also: by all means (= certainly), by and large, by far, by definition."},
    {t:"typed", q:"A warm, humid climate is highly conducive ___ the growth of mould.", a:["to"], e:"conducive to = making something likely to happen. Also: detrimental to, beneficial to, essential to."},
    {t:"typed", q:"Rising sea levels pose a serious threat ___ low-lying islands.", a:["to"], e:"a threat to / a danger to / a risk to / damage to. The verb 'threaten' takes no preposition."},
    {t:"typed", q:"The project's success is contingent ___ securing additional funding.", a:["on","upon"], e:"contingent on/upon = dependent on. Also: conditional on, reliant on, dependent on."},
    {t:"typed", q:"She was instrumental ___ bringing the two sides together.", a:["in"], e:"instrumental in (+ -ing) = playing a key role in. Also: succeed in, involved in, interested in."},
    {t:"typed", q:"The region is renowned ___ its wine and its cuisine.", a:["for"], e:"renowned / famous / known / noted / celebrated FOR."},
    {t:"typed", q:"The ministry has been accused ___ withholding vital information.", a:["of"], e:"accuse somebody OF something. Compare: blame somebody FOR something, charge somebody WITH a crime."},
    {t:"typed", q:"All suppliers are required to comply ___ the new environmental standards.", a:["with"], e:"comply with = obey. Also: adhere to, abide by, conform to, observe (no preposition)."},
    {t:"typed", q:"Please refrain ___ using mobile phones during the performance.", a:["from"], e:"refrain from (+ -ing) = not do. Also: prevent / stop / discourage / deter somebody FROM."},
    {t:"typed", q:"Local residents strongly object ___ the plan to build a new motorway.", a:["to"], e:"object to (+ noun / -ing). Here 'to' is a preposition: object to BEING treated like this."},
    {t:"typed", q:"The investigation resulted ___ several arrests.", a:["in"], e:"result in = cause / lead to. The other direction: result from = be caused by."},
    {t:"typed", q:"I was completely oblivious ___ what was happening around me.", a:["to","of"], e:"oblivious to (or of) = unaware of. Also: indifferent to, immune to, alert to."},
    {t:"typed", q:"The new policy has been implemented ___ the detriment of small businesses.", a:["to"], e:"to the detriment of = harming. Adjective: detrimental to. Opposite: to the benefit of."},
    {t:"typed", q:"She is a real stickler ___ punctuality.", a:["for"], e:"a stickler for = someone who insists on. Same preposition: a demand for, a need for, a reason for, a cure for."},
    {t:"typed", q:"We had to finish the whole job ___ very short notice.", a:["at","on"], e:"at short notice = with little warning (American English: on short notice). Also: at once, at random, at a loss, at length, at fault."},
    {t:"typed", q:"The new bridge was completed well ahead ___ schedule.", a:["of"], e:"ahead of schedule / behind schedule / on schedule. Also: ahead of time, ahead of the curve."},
    {t:"typed", q:"She prefers listening to live music ___ opposed to recordings.", a:["as"], e:"as opposed to = rather than, in contrast with. Also: contrary to, unlike."},
    {t:"typed", q:"Access ___ the archive is restricted to registered researchers.", a:["to"], e:"access TO (noun). The verb takes no preposition: access the files. Also: entry to, admission to."},
    {t:"typed", q:"There has been a sharp increase ___ the number of complaints.", a:["in"], e:"an increase / rise / fall / drop / decline IN something. The amount is OF: a rise of 5%."},
    {t:"typed", q:"The committee is wary ___ making any firm commitments.", a:["of","about"], e:"wary of (or about) = cautious about. Also: suspicious of, capable of, devoid of, guilty of, ashamed of."},
    {t:"typed", q:"I bumped into an old friend ___ chance last week.", a:["by"], e:"by chance / by accident / by mistake / by heart. But: on purpose."},
    {t:"typed", q:"The flat is ___ walking distance of the station.", a:["within","in"], e:"within walking distance of / within reach of / within earshot / within the law. ('in walking distance' is heard in American English.)"},
    {t:"typed", q:"That is beside the point — what is ___ stake here is the company's reputation.", a:["at"], e:"at stake = at risk, to be won or lost. Also: at risk, at large, at heart, at your discretion."}
  ]
});

MODULES.push({
  id: "gram", kind: "items", title: "Grammar gap-fill", short: "Grammar", minutes: 9,
  instructions: "Exam-style open gap-fill: ONE word per gap. First two screens are short texts with five gaps each (exactly the exam format), then twenty single sentences. Look left for a word that demands a preposition or a negative adverb that triggers inversion, look right for the subject and verb that follow the gap, and check the tense.",
  items: [
    {t:"ptyped", title:"The device in your pocket", text:"Few inventions have changed daily life as profoundly as the smartphone. Hardly {1} a decade passed since the first models appeared, yet it is now difficult to imagine life {2} them. {3} some critics argue that constant connectivity has eroded our attention spans, others point out that we have never had {4} much information at our fingertips. {5} side of the debate one takes, there is little doubt that the device has reshaped how we work, socialise and even sleep.",
      gaps:[
        {a:["has"], e:"Hardly HAS a decade passed… — a negative adverb at the start forces inversion (auxiliary before subject)."},
        {a:["without"], e:"life WITHOUT them."},
        {a:["while","whereas","although","though","whilst","if"], e:"WHILE / WHEREAS / ALTHOUGH some critics argue…, others point out… — a contrast linker that introduces a clause (formal 'If some critics argue…' also works)."},
        {a:["so","this","that","as"], e:"never had SO much information (so + much / many; such + noun). 'this much' / 'that much' / 'as much' also work here."},
        {a:["whichever","whatever"], e:"WHICHEVER side one takes = it does not matter which side."}
      ]},
    {t:"ptyped", title:"Pedestrian zone", text:"The city council has announced plans to pedestrianise the historic centre, {1} has been welcomed by residents but criticised by shop owners. The latter claim that, {2} it not for passing motorists, many of their businesses would struggle to survive. The council, however, insists that {3} than reducing trade, the scheme will attract more visitors, as {4} been the case in several other European cities. No final decision is {5} be taken until a full consultation has been carried out.",
      gaps:[
        {a:["which"], e:"…, WHICH has been welcomed — a relative pronoun referring to the whole previous clause (the plans)."},
        {a:["were"], e:"WERE it not for = if it were not for (formal inverted conditional)."},
        {a:["rather"], e:"RATHER than reducing trade = instead of reducing trade."},
        {a:["has"], e:"as HAS been the case = as has happened. Here 'as' means 'which', referring to the whole previous clause, so the verb is singular present perfect."},
        {a:["to"], e:"is TO be taken = 'be + to-infinitive' for official arrangements and rules (The meeting is to begin at nine)."}
      ]},
    {t:"typed", q:"Not only ___ the hotel overpriced, but the service was also appalling.", a:["was"], e:"Not only + inversion: Not only WAS the hotel… (auxiliary or 'be' moves before the subject)."},
    {t:"typed", q:"I would rather you ___ not mention this to anyone just yet.", a:["did"], e:"would rather + somebody + PAST tense for a present/future wish: I'd rather you didn't."},
    {t:"typed", q:"It is high time the government ___ something about the housing shortage.", a:["did"], e:"It's (high / about) time + past simple: It's time we LEFT. The past form refers to now."},
    {t:"typed", q:"___ you to change your mind, the offer would still stand.", a:["were"], e:"WERE you to change your mind = if you were to change your mind (formal inverted conditional). Same family: Should you need…, Had I known…"},
    {t:"typed", q:"No sooner had we sat down ___ the fire alarm went off.", a:["than"], e:"No sooner … THAN. Compare: Hardly / Scarcely / Barely … WHEN."},
    {t:"typed", q:"The more you practise, ___ easier it becomes.", a:["the"], e:"The more…, THE easier… — the double comparative."},
    {t:"typed", q:"He is one of the few people ___ opinion I genuinely value.", a:["whose"], e:"WHOSE + noun = possessive relative, used for people and things."},
    {t:"typed", q:"I wish I ___ taken your advice — it would have saved me a lot of trouble.", a:["had"], e:"wish + past perfect for a regret about the past. (wish + past simple for the present: I wish I knew.)"},
    {t:"typed", q:"___ the fact that it was raining heavily, the match went ahead.", a:["despite","notwithstanding"], e:"DESPITE / in spite of + noun phrase (the fact that…). Although + full clause."},
    {t:"typed", q:"Little ___ she know that her life was about to change forever.", a:["did"], e:"Little DID she know — inversion after 'little' (literary emphasis). Also: Little did I realise…"},
    {t:"typed", q:"He walked straight past me as ___ he had never seen me before.", a:["if","though"], e:"as IF / as THOUGH + past perfect for an unreal comparison."},
    {t:"typed", q:"Only after the meeting ___ I realise what she had meant.", a:["did"], e:"Only after / Only when / Only then + inversion in the MAIN clause: Only after the meeting DID I realise."},
    {t:"typed", q:"Much ___ I admire her work, I don't think this novel is her best.", a:["as","though"], e:"Much AS I admire = although I admire very much. Same family: Try as I might, Hard though it was."},
    {t:"typed", q:"I'll lend you the money ___ condition that you pay me back by Friday.", a:["on"], e:"ON condition that = provided that, as long as."},
    {t:"typed", q:"Nobody has ever managed to climb the north face in winter, ___ they?", a:["have"], e:"Nobody / No one / Everyone… , HAVE they? — plural tag after an indefinite pronoun; the statement is negative, so the tag is positive."},
    {t:"typed", q:"___ it not been for your help, I would never have finished on time.", a:["had"], e:"HAD it not been for = if it had not been for (inverted third conditional)."},
    {t:"typed", q:"Far ___ being a failure, the campaign exceeded every target.", a:["from"], e:"Far FROM (+ -ing / noun) = not at all; quite the opposite."},
    {t:"typed", q:"He is not so much lazy ___ unmotivated.", a:["as"], e:"not so much X AS Y = it is Y rather than X."},
    {t:"typed", q:"Whether or ___ you agree, the decision has been made.", a:["not"], e:"whether or NOT = regardless of whether."},
    {t:"typed", q:"Hard ___ he tried, he could not open the jar.", a:["as","though"], e:"Hard AS / THOUGH he tried = although he tried hard (adjective or adverb + as/though + subject + verb)."}
  ]
});

MODULES.push({
  id: "vocab", kind: "items", title: "Vocabulary & collocations", short: "Vocabulary", minutes: 7,
  instructions: "Gapped sentences, four options. Press 1–4 or click. Decide the part of speech first, then ask which word actually keeps company with the words around the gap.",
  items: [
    {t:"mcq", q:"You should ___ in mind that the figures are only provisional.", o:["hold","take","bear","carry"], a:2, e:"bear / keep in mind = remember, take into account."},
    {t:"mcq", q:"Managers must ___ a balance between flexibility and control.", o:["hit","beat","strike","make"], a:2, e:"strike a balance. Also: strike a deal, strike a chord, strike a pose."},
    {t:"mcq", q:"The new evidence ___ doubt on his alibi.", o:["places","puts","lays","casts"], a:3, e:"cast doubt on. Also: cast a shadow, cast a vote, cast light on something."},
    {t:"mcq", q:"Despite the ___ evidence, the jury found him not guilty.", o:["pressing","forcing","compelling","persuading"], a:2, e:"compelling evidence / argument / reason = very convincing. ('persuasive' exists; 'persuading' does not work as an adjective here.)"},
    {t:"mcq", q:"It is ___ unlikely that the deal will be signed before the election.", o:["deeply","strongly","heavily","highly"], a:3, e:"highly unlikely / highly likely / highly recommended. 'deeply' goes with feelings: deeply disappointed, deeply moved."},
    {t:"mcq", q:"She was ___ disappointed when her application was rejected.", o:["strongly","highly","bitterly","heavily"], a:2, e:"bitterly disappointed / bitterly cold / bitterly opposed. 'heavily' goes with rain, traffic, debt, armed."},
    {t:"mcq", q:"Sales ___ by 40% in a single week after the product was linked to safety concerns.", o:["dwindled","soared","fluctuated","plummeted"], a:3, e:"plummet / plunge = fall very fast. dwindle = decrease gradually; soar = rise fast; fluctuate = go up and down."},
    {t:"mcq", q:"The difference between the two samples was ___ and could safely be ignored.", o:["negligent","neglected","negligible","negative"], a:2, e:"negligible = too small to matter. negligent = careless (a negligent driver); neglected = not looked after."},
    {t:"mcq", q:"The witness gave a ___ account of what happened that night.", o:["vivid","bright","living","alive"], a:0, e:"a vivid account / memory / description = clear and detailed. Also: a graphic account, a lively account."},
    {t:"mcq", q:"Water is ___ in this part of the desert, so every drop is precious.", o:["rare","sparse","few","scarce"], a:3, e:"scarce = there is not enough of it. rare = not often found or seen; sparse = thinly spread (sparse vegetation)."},
    {t:"mcq", q:"The new regulations are far more ___ than the old ones.", o:["stringent","astringent","strenuous","stern"], a:0, e:"stringent rules / controls / tests = strict. strenuous = needing effort (strenuous exercise); stern = severe (a stern look)."},
    {t:"mcq", q:"She is ___ in her research — every source is double-checked.", o:["minute","careless","delicate","meticulous"], a:3, e:"meticulous = extremely careful about details. Also: painstaking, thorough, rigorous, scrupulous."},
    {t:"mcq", q:"The outcome of the vote was a ___ conclusion; everyone knew who would win.", o:["forward","former","foregone","forgone"], a:2, e:"a foregone conclusion = a result that is certain before it happens. 'forgone' is the past participle of 'forgo' (give up)."},
    {t:"mcq", q:"There was a ___ contrast between the luxury of the hotel and the poverty outside.", o:["steep","stark","blunt","crude"], a:1, e:"a stark contrast / reminder / choice / warning = very clear and uncomfortable. Also: in stark contrast to."},
    {t:"mcq", q:"Smartphones have become ___ — you see them absolutely everywhere.", o:["unanimous","ubiquitous","unambiguous","utmost"], a:1, e:"ubiquitous = present everywhere. unanimous = everyone agrees; unambiguous = clear; utmost = greatest."},
    {t:"mcq", q:"The judge ___ the appeal, saying there was no new evidence.", o:["dispelled","disposed","discarded","dismissed"], a:3, e:"dismiss an appeal / a claim / an idea = reject. dispel doubts or fears = make them disappear; dispose OF = get rid of."},
    {t:"mcq", q:"I have a ___ suspicion that we have been here before.", o:["sneaking","sneaky","crawling","sliding"], a:0, e:"a sneaking suspicion / feeling = a quiet, nagging one. Also: a nagging doubt, a lingering doubt."},
    {t:"mcq", q:"The charity aims to ___ awareness of mental health issues among teenagers.", o:["rise","arise","raise","lift"], a:2, e:"raise awareness / raise money / raise a question — transitive. rise = go up, no object. arise = occur (a problem arose)."},
    {t:"mcq", q:"The hotel was a far ___ from the luxury resort we had been promised.", o:["cry","shout","call","way"], a:0, e:"a far cry from = very different from, and worse."},
    {t:"mcq", q:"He had an ___ motive for offering to help.", o:["interior","exterior","ulterior","anterior"], a:2, e:"an ulterior motive = a hidden reason. Also: a hidden agenda."},
    {t:"mcq", q:"The minister neatly ___ a question about his expenses.", o:["dodged","dived","dipped","dropped"], a:0, e:"dodge / sidestep / evade / duck a question. 'dropped a question' would mean stopped asking it."},
    {t:"mcq", q:"The ___ size of the building took my breath away.", o:["plain","utter","whole","sheer"], a:3, e:"sheer size / scale / volume / luck = emphasises how great. utter goes with nonsense, disbelief, failure; 'plain' = simple, obvious (plain stupid)."},
    {t:"mcq", q:"The decision was ___ criticised by environmental groups.", o:["largely","broadly","highly","widely"], a:3, e:"widely criticised / widely regarded / widely available. largely = mostly; highly = very (highly successful, highly paid)."},
    {t:"mcq", q:"He ___ escaped injury when the scaffolding collapsed.", o:["narrowly","tightly","closely","nearly"], a:0, e:"narrowly escaped = only just escaped. 'nearly escaped' would mean he did NOT escape — a classic trap."}
  ]
});

MODULES.push({
  id: "mcgap", kind: "items", title: "Multiple-choice gap-fill", short: "MC gap-fill", minutes: 6,
  instructions: "Three short texts with five gaps each, exactly as in the exam. Click each gap to choose, then check all five at once. Linkers, collocations and verb patterns are what is being tested.",
  items: [
    {t:"pmcq", title:"Working from home", text:"When companies first {1} staff to work from home in 2020, many managers feared a collapse in productivity. {2} fears proved largely unfounded: output in most sectors held steady or even rose. The real cost, it turned out, lay {3}: employees reported feeling isolated, and informal mentoring all but disappeared. Firms are now trying to {4} a balance, typically by asking people to come in two or three days a week. {5} this hybrid model becomes the norm remains to be seen.",
      gaps:[
        {o:["let","allowed","made","had"], a:1, e:"allow / permit somebody TO do. let / make / have + bare infinitive (let staff work)."},
        {o:["So","Much","That","Such"], a:3, e:"SUCH fears = fears of this kind (such + noun, referring back to what was just said)."},
        {o:["otherwise","anywhere","elsewhere","somewhere"], a:2, e:"lay elsewhere = was in a different place. otherwise = if not, or differently."},
        {o:["make","do","build","strike"], a:3, e:"strike a balance (between X and Y)."},
        {o:["If","Whether","Unless","Although"], a:1, e:"WHETHER … remains to be seen. 'If' cannot introduce a clause that acts as the subject of the sentence."}
      ]},
    {t:"pmcq", title:"Sleep and memory", text:"Scientists have long suspected that sleep plays a {1} role in forming memories, but only recently has the mechanism become clear. During deep sleep, the brain appears to 'replay' the day's experiences, {2} strengthening the connections between neurons. This may explain why students who {3} an all-nighter before an exam often perform worse than those who sleep normally. {4} caffeine can keep you awake, it cannot replace the consolidation that happens overnight. In {5} words, cramming at 3 a.m. is probably a false economy.",
      gaps:[
        {o:["crucial","severe","heavy","grave"], a:0, e:"play a crucial / key / vital / major / pivotal role."},
        {o:["therefore","thereby","moreover","whereby"], a:1, e:"thereby + -ing = by doing that, as a result of that. whereby = by which (a system whereby…)."},
        {o:["make","take","do","pull"], a:3, e:"pull an all-nighter = stay up all night working. Also: pull a face, pull strings, pull your weight."},
        {o:["Despite","Even","However","While"], a:3, e:"WHILE / Although + clause for contrast. Despite + noun; 'However' cannot introduce a subordinate clause like this."},
        {o:["other","another","different","else"], a:0, e:"in other words = to put it differently."}
      ]},
    {t:"pmcq", title:"Venice", text:"Venice has been struggling to {1} with the sheer number of visitors for decades. On peak days, tourists {2} residents by more than ten to one, and locals complain that the city has been {3} into a theme park. In 2024 the authorities introduced a day-tripper fee, {4} to discourage the most casual visitors. Critics, however, dismissed the charge as little {5} than a token gesture.",
      gaps:[
        {o:["handle","cope","manage","afford"], a:1, e:"cope with / deal with. 'handle' and 'manage' take a direct object with no preposition (handle the crowds)."},
        {o:["outnumber","overtake","exceed","surpass"], a:0, e:"outnumber = be more numerous than. overtake = pass; exceed / surpass = go beyond (a limit, expectations)."},
        {o:["done","set","put","turned"], a:3, e:"turn something INTO something = transform. Also: make into, convert into, transform into."},
        {o:["pointed","aimed","directed","intended"], a:3, e:"intended TO do / designed TO do / meant TO do. 'aimed' needs AT + -ing: aimed at discouraging."},
        {o:["less","else","more","much"], a:2, e:"little more than = not much more than, merely. Also: nothing more than, no more than."}
      ]}
  ]
});

MODULES.push({
  id: "expr", kind: "items", title: "Expressions & phrasal verbs", short: "Expressions", minutes: 6,
  instructions: "Phrasal verbs, idioms, and six quick 'choose the natural reply' items (Cambridge's own Linguaskill tips sheet calls these social dialogues). Four options; press 1–4 or click.",
  items: [
    {t:"mcq", q:"The meeting has been ___ until next week because the director is ill.", o:["put out","put down","put off","put up"], a:2, e:"put off = postpone. put up with = tolerate; put down = criticise, or write down; put out = extinguish."},
    {t:"mcq", q:"Nobody could ___ why the system kept crashing.", o:["work off","work over","work up","work out"], a:3, e:"work out = understand, solve. Also: figure out. work off = get rid of (stress, a debt)."},
    {t:"mcq", q:"I don't know how she ___ such behaviour from her flatmates — I would have complained ages ago.", o:["gets away with","gets on with","puts up with","does away with"], a:2, e:"put up with = tolerate. get away with = escape punishment for; get on with = continue, or have a good relationship with; do away with = abolish."},
    {t:"mcq", q:"The concert ___ to be a huge success, despite the rain.", o:["turned up","turned down","turned over","turned out"], a:3, e:"turn out (to be) = prove to be in the end. turn up = arrive, appear; turn down = reject, or reduce the volume."},
    {t:"mcq", q:"Our holiday plans ___ at the last minute when the airline cancelled the flight.", o:["fell out","fell off","fell through","fell behind"], a:2, e:"fall through = fail to happen. fall out (with) = quarrel; fall behind = fail to keep up."},
    {t:"mcq", q:"She ___ the idea of a four-day week at the staff meeting.", o:["brought up","brought about","brought down","brought off"], a:0, e:"bring up = raise (a topic), or raise (a child). bring about = cause; bring off = succeed in doing something difficult; bring down = topple, reduce."},
    {t:"mcq", q:"The film did not ___ my expectations.", o:["look up to","live up to","catch up on","get round to"], a:1, e:"live up to expectations = be as good as hoped. look up to = admire; catch up on = do things you have missed."},
    {t:"mcq", q:"The painkillers started to ___ after a couple of hours.", o:["wear out","wear down","wear away","wear off"], a:3, e:"wear off = stop having an effect. wear out = become unusable, or exhaust; wear down = gradually weaken (resistance)."},
    {t:"mcq", q:"Police have not yet ___ the possibility that the fire was started deliberately.", o:["ruled over","ruled out","ruled off","ruled in"], a:1, e:"rule out = exclude, eliminate. 'It can't be ruled out' = it is still possible."},
    {t:"mcq", q:"I will never ___ to reading all these reports.", o:["get round","get by","get over","get across"], a:0, e:"get round to (+ -ing) = finally find the time to do. get over = recover from; get across = communicate; get by = manage, survive."},
    {t:"mcq", q:"Losing that job was a blessing ___ — it pushed me to start my own business.", o:["in hiding","in secret","in the dark","in disguise"], a:3, e:"a blessing in disguise = something that seems bad but turns out to be good."},
    {t:"mcq", q:"We are all ___ the same boat, so let's stop blaming each other.", o:["on","in","at","by"], a:1, e:"in the same boat = in the same difficult situation."},
    {t:"mcq", q:"I'm still ___ the fence about whether to accept the offer.", o:["over","at","in","on"], a:3, e:"on the fence = undecided. Also: in two minds, torn between."},
    {t:"mcq", q:"You've hit the ___ on the head — that's exactly the problem.", o:["hammer","pin","nail","point"], a:2, e:"hit the nail on the head = describe the situation exactly right."},
    {t:"mcq", q:"Stop beating ___ and tell me what actually happened.", o:["around the bush","through the hedge","behind the bush","round the garden"], a:0, e:"beat around (or about) the bush = avoid saying what you really mean."},
    {t:"mcq", q:"The repair cost me an arm and a ___.", o:["foot","hand","head","leg"], a:3, e:"cost an arm and a leg = be very expensive. Also: cost a fortune, cost the earth."},
    {t:"mcq", q:"It only took her a week to get the ___ of the new software.", o:["hold","hang","grip","touch"], a:1, e:"get the hang of = learn how to do or use. Also: get to grips with, get the knack of, get the feel of."},
    {t:"mcq", q:"His resignation is just the tip of the ___.", o:["iceberg","mountain","glacier","hill"], a:0, e:"the tip of the iceberg = the small visible part of a much bigger problem."},
    {t:"mcq", prompt:"Would you mind if I opened the window?", q:"Choose the most natural reply.", o:["Yes, I would, please.","Not at all — go ahead.","No, I don't mind it opened.","Yes, please open."], a:1, e:"'Would you mind if…?' — you GIVE permission with 'Not at all' or 'No, go ahead'. 'Yes' would mean you DO mind."},
    {t:"mcq", prompt:"I'm afraid I won't be able to make it on Friday.", q:"Choose the most natural reply.", o:["You're welcome.","It doesn't mind.","Yes, you will.","Never mind — some other time, perhaps."], a:3, e:"'make it' = manage to attend. 'Never mind' = don't worry about it. ('It doesn't matter' is correct; 'it doesn't mind' is not English.)"},
    {t:"mcq", prompt:"Thanks so much for covering my shift yesterday.", q:"Choose the most natural reply.", o:["Don't say it.","Never say.","Not to worry it.","Don't mention it."], a:3, e:"Don't mention it / You're welcome / No problem / My pleasure / Any time."},
    {t:"mcq", prompt:"I've been up since five o'clock this morning.", q:"Choose the most natural reply.", o:["You must be exhausted.","You must have exhausted.","You must be exhausting.","You must have been exhausting."], a:0, e:"must be + adjective = a logical deduction about now. 'exhausting' describes the thing that makes you tired, not the person who is tired."},
    {t:"mcq", prompt:"Do you fancy a coffee after the meeting?", q:"Choose the most natural reply.", o:["I'd love to, but I've got a deadline.","Yes, I fancy.","I'd love, but I've got a deadline.","Yes, I'm fancy."], a:0, e:"'I'd love to' — keep the 'to': it stands for the whole verb phrase. 'fancy' needs an object: I fancy one / I'd fancy that."},
    {t:"mcq", prompt:"Sorry, I didn't catch your name.", q:"Choose the most natural reply.", o:["Yes, I did.","It's Omar.","Not at all.","You're welcome."], a:1, e:"'I didn't catch…' = I didn't hear. The natural reply is simply to repeat your name."}
  ]
});

MODULES.push({
  id: "notice", kind: "items", title: "Read & select", short: "Notices", minutes: 4,
  instructions: "A notice, message or email, and one question with three options — the exam's opening reading task. The right option paraphrases the whole message; the wrong ones recycle its words with a twist.",
  items: [
    {t:"mcq", label:"Sign on a shop door", sign:"CLOSED FOR STOCKTAKING\nReopening Thursday 9 a.m.\nOnline orders unaffected.", q:"What does the sign tell customers?", o:["The shop will not reopen until new stock arrives.","You can still buy from the shop's website while it is closed.","The shop is open online only on Thursday."], a:1, e:"'Online orders unaffected' = the website continues as normal. Stocktaking = counting the stock, not waiting for it."},
    {t:"mcq", label:"Text message", sign:"Hi Sam — running 20 min late, signal's terrible in here. Order me whatever you're having. J.", q:"What does J want Sam to do?", o:["Wait before ordering anything.","Phone J to discuss the menu.","Choose the same food for both of them."], a:2, e:"'Order me whatever you're having' = get me the same as you. The bad signal explains why J is texting rather than phoning."},
    {t:"mcq", label:"Email from a landlord", sign:"Please note that the water supply will be switched off between 10 a.m. and 2 p.m. on Tuesday while the boiler is replaced. We apologise for any inconvenience.", q:"What should tenants expect?", o:["To be without water for part of Tuesday.","To have the boiler repaired on Tuesday afternoon.","To switch off the water themselves on Tuesday."], a:0, e:"'switched off between 10 and 2' = no water for four hours. The boiler is being REPLACED, not repaired, and the landlord does the switching off."},
    {t:"mcq", label:"Sign in a museum", sign:"Flash photography is not permitted in the galleries. Photographs may be taken for personal use only.", q:"What does the sign mean?", o:["Visitors may not take photographs in the galleries.","Visitors may photograph exhibits provided they do not use flash or sell the pictures.","Visitors may use flash only for personal photographs."], a:1, e:"Two rules: no flash, and personal use only (= not commercial). Photography itself is allowed."},
    {t:"mcq", label:"Notice in a gym", sign:"Members are reminded that lockers must be emptied daily. Items left overnight will be removed and held at reception for 7 days.", q:"What does the notice say?", o:["Lockers can be rented for up to seven days.","Reception will empty your locker on request.","The gym keeps items left in lockers for a week."], a:2, e:"'held at reception for 7 days' = kept for a week, after which they are presumably disposed of."},
    {t:"mcq", label:"Email to colleagues", sign:"Could everyone who hasn't yet sent me their availability for the away day do so by Wednesday? I need to confirm numbers with the venue. Thanks, Priya", q:"Why has Priya written this email?", o:["To ask colleagues to contact the venue directly.","To get replies from the people who have not answered yet.","To announce that the away day will be on Wednesday."], a:1, e:"'everyone who hasn't yet sent…' = only those who have not replied. Wednesday is the deadline, not the date of the event."},
    {t:"mcq", label:"Sign in a car park", sign:"PERMIT HOLDERS ONLY\nMon–Fri 8 a.m.–6 p.m.\nFree parking at all other times.", q:"What does the sign say?", o:["Anyone can park here on Saturday morning without a permit.","Permit holders must pay to park at weekends.","Nobody may park here without a permit."], a:0, e:"The restriction applies Monday–Friday in the daytime only; 'all other times' (evenings, weekends) are free for everyone."},
    {t:"mcq", label:"Text message", sign:"Mum's flight has been moved to 6.40 — can you still do the airport run, or shall I book her a taxi?", q:"What is the writer asking?", o:["Whether the reader can still collect their mother.","Whether the reader has already booked a taxi.","Whether the reader can change the flight."], a:0, e:"'do the airport run' = drive to the airport to pick someone up. The taxi is the alternative if the reader can't."},
    {t:"mcq", label:"Notice in a library", sign:"Study rooms may be booked for a maximum of 2 hours per day. Rooms left unoccupied for 15 minutes will be released to other users.", q:"What does the notice say?", o:["Rooms can be booked for a maximum of 15 minutes.","If you arrive more than 15 minutes late, you may lose your booking.","You can book a study room for the whole day."], a:1, e:"'released to other users' after 15 minutes unoccupied = your booking is lost if you do not turn up."},
    {t:"mcq", label:"Email from customer services", sign:"Your refund has been processed and should appear on your statement within 5–7 working days, depending on your bank.", q:"What does the email tell the customer?", o:["The customer must contact their bank to receive the refund.","The refund will be paid in weekly instalments.","The money may take more than a week to arrive."], a:2, e:"7 working days = more than a calendar week. 'depending on your bank' explains the variation; it is not an instruction."}
  ]
});

  id: "plan", kind: "info", title: "Game plan", short: "Game plan", minutes: 2,
  html: `
<p class="lead">Nine drills, about 160 questions, pitched at B2–C1 with a few C2-level stretch items. Work fast, read every explanation for the ones you miss, and finish with the mistakes review. Your progress lives in this tab only — don't refresh the page.</p>

<div class="cta-row"><button class="btn primary big" id="startHour">Start the hour ▶</button><span class="muted">Starts the 60-minute clock and opens the first drill.</span></div>

<h3>The hour at a glance</h3>
<table class="plan">
<thead><tr><th>Min</th><th>Module</th><th>What it trains</th></tr></thead>
<tbody>
<tr><td>9</td><td>Prepositions</td><td>Dependent prepositions and fixed phrases — the number-one target of the open gap-fill</td></tr>
<tr><td>9</td><td>Grammar gap-fill</td><td>Inversion, conditionals, relatives, linkers — one word per gap, exam format</td></tr>
<tr><td>7</td><td>Vocabulary &amp; collocations</td><td>Gapped sentences with four options</td></tr>
<tr><td>6</td><td>Multiple-choice gap-fill</td><td>Three texts, five gaps each</td></tr>
<tr><td>6</td><td>Expressions &amp; phrasal verbs</td><td>Phrasal verbs, idioms, and six quick natural-reply warm-ups</td></tr>
<tr><td>4</td><td>Read &amp; select</td><td>Notices, messages and emails — three options</td></tr>
<tr><td>5</td><td>Missing sentences</td><td>Text cohesion: five gaps, eight sentences</td></tr>
<tr><td>5</td><td>Extended reading</td><td>A long text with five questions in text order</td></tr>
<tr><td>8</td><td>Listening</td><td>Browser-voiced recordings: short clips, a talk, sentence completion</td></tr>
<tr><td>1+</td><td>Mistakes review</td><td>Everything you got wrong, in one place, with retries</td></tr>
</tbody></table>

<h3>What tomorrow looks like</h3>
<ul class="tips">
<li><b>Listening first, then Reading.</b> Each module is about 40 minutes (maximum 59). The test is <b>adaptive</b>: when you answer well, the next questions get harder. A hard question is good news, not a sign you are failing.</li>
<li><b>Every recording plays twice</b>, with a pause between plays. You can read the questions before the audio starts: about 10 seconds for short tasks, 45 seconds for extended tasks.</li>
<li><b>No going back.</b> You can change answers on the current screen, but not on a previous one. Decide, then move on.</li>
<li><b>Open gap-fill: ONE word only.</b> No contractions, no two-word answers. If you want to type two words, you have misread the gap.</li>
<li><b>Never leave a blank.</b> Eliminate what you can and choose. There is nothing to gain from an empty answer.</li>
</ul>

<h3>Tactics by task type</h3>
<dl class="tactics">
<dt>Read &amp; select (notice, message, email)</dt><dd>The correct option paraphrases the <i>whole</i> message. Wrong options recycle words from the text with a twist: a changed modal (may → must), a swapped time, the wrong person doing the action. Ask: who does what, when, and under what condition?</dd>
<dt>Gapped sentences &amp; multiple-choice gap-fill</dt><dd>Decide the part of speech first. Then test collocation (which words keep company with the words around the gap?) and the grammar <i>after</i> the gap (preposition? -ing? to-infinitive?). Read the sentence back with your choice in place.</dd>
<dt>Open gap-fill</dt><dd>Nine answers in ten are grammar words: prepositions, articles, auxiliaries (has / had / did / been), pronouns, relatives (which / whose), conjunctions (although / whereas / unless / whether), quantifiers, and the small words so / such / too / enough / as / than / the. Look left for a verb or adjective that demands a preposition, or a negative adverb (hardly, not only, little, only after) that triggers inversion; look right at the subject and verb that follow the gap; check the tense of the whole sentence.</dd>
<dt>Extended reading</dt><dd>Questions follow the text order. Find the paragraph, then check each option against the text word by word. Beware of options that are true but do not answer the question, and of extreme words (always, never, all, only).</dd>
<dt>Missing sentences / paragraphs</dt><dd>Read the whole text once for the argument. Then hunt for referents (this, that, such, the latter, they) and connectors (however, even so, after all, similarly). Check tense and singular/plural agreement. Fill the easy gaps first and eliminate the distractors.</dd>
<dt>Listening</dt><dd>Use the pause to read the questions and predict synonyms (prices up → more expensive; call off → cancel). First play: answer. Second play: verify. In dialogues the real answer often comes after <i>but, actually, to be honest, having said that</i>. For agreement questions listen for <i>absolutely, I'll give you that, fair enough</i> versus <i>I'm not so sure, that's a bit harsh</i>. Write numbers as you hear them.</dd>
<dt>Sentence completion</dt><dd>Use the exact words from the recording, up to three words. Check spelling and singular/plural; the gap is usually a noun phrase, a time or a number.</dd>
<dt>Multiple matching (speakers)</dt><dd>Note each speaker's main point and attitude in a word or two before you choose. The options paraphrase; a speaker who repeats a word from an option is often the distractor.</dd>
</dl>

<h3>Tonight and tomorrow</h3>
<p>Stop by 23:00 and sleep — consolidation happens overnight, not at 3 a.m. Tomorrow: eat, arrive early, do the sound check properly and adjust the headphones before the first recording. If a question rattles you, it is probably because the test has decided you are good; answer it and let it go.</p>
`
});

/* ---------- feedback ---------- */
