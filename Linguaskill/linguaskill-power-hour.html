  wrap.append(pass, el('div', { class: 'row' }, btn), fbWrap);
  function apply(){
    it.gaps.forEach((g, j) => { const rec = ctx.get(j); const sel = sels[j]; sel.value = rec.choice == null ? '' : String(rec.choice); sel.disabled = true; sel.classList.add(rec.ok ? 'ok' : 'bad'); fbWrap.append(fbNode(rec.ok, [g.o[g.a]], g.e, 'Gap ' + (j + 1) + ':')); });
    btn.remove();
  }
  if (ctx.get(0)) apply();
  else btn.addEventListener('click', () => {
    it.gaps.forEach((g, j) => { const v = sels[j].value; const choice = v === '' ? null : parseInt(v, 10); ctx.set(j, { ok: choice === g.a, choice, user: choice == null ? '(blank)' : g.o[choice], answers: [g.o[g.a]], prompt: contextOf(it.text, j + 1), exp: g.e, t: 'gap' }); });
    apply(); ctx.onDone && ctx.onDone();
  });
  return wrap;
}

function rMissing(it, ctx){
  const wrap = el('div', { class: 'item' });
  const pass = el('div', { class: 'passage' });
  if (it.title) pass.append(el('h4', {}, it.title));
  const sels = [];
  const list = el('ul', { class: 'optlist' });
  const lis = it.options.map((o, j) => { const li = el('li', {}, el('b', {}, LET[j]), el('span', {}, o)); list.append(li); return li; });
  function refreshUsed(){ const used = sels.map(s => s.value); lis.forEach((li, j) => li.classList.toggle('used', used.indexOf(String(j)) >= 0)); }
  buildPassage(pass, it.text, n => {
    const sel = el('select', { class: 'gapsel', 'aria-label': 'Gap ' + n }, el('option', { value: '' }, '— ' + n + ' —'));
    it.options.forEach((o, j) => sel.append(el('option', { value: String(j) }, LET[j])));
    sel.addEventListener('change', refreshUsed);
    sels[n - 1] = sel;
    return el('span', { class: 'gapwrap' }, el('span', { class: 'gapnum' }, String(n)), sel);
  });
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all gaps');
  const fbWrap = el('div', { class: 'fb-list' });
  wrap.append(pass, el('h4', { style: 'margin:0 0 8px' }, 'Sentences A–H (three are not used)'), list, el('div', { class: 'row' }, btn), fbWrap);
  function apply(){
    it.a.forEach((ans, j) => { const rec = ctx.get(j); const sel = sels[j]; sel.value = rec.choice == null ? '' : String(rec.choice); sel.disabled = true; sel.classList.add(rec.ok ? 'ok' : 'bad'); fbWrap.append(fbNode(rec.ok, [LET[ans] + ' — ' + it.options[ans]], it.e[j], 'Gap ' + (j + 1) + ':')); });
    refreshUsed(); btn.remove();
  }
  if (ctx.get(0)) apply();
  else btn.addEventListener('click', () => {
    it.a.forEach((ans, j) => { const v = sels[j].value; const choice = v === '' ? null : parseInt(v, 10); ctx.set(j, { ok: choice === ans, choice, user: choice == null ? '(blank)' : LET[choice] + ' — ' + it.options[choice], answers: [LET[ans] + ' — ' + it.options[ans]], prompt: 'Gap ' + (j + 1) + ' of “' + it.title + '”', exp: it.e[j], t: 'gap' }); });
    apply(); ctx.onDone && ctx.onDone();
  });
  return wrap;
}

function questionBlocks(qs, ctx, done){
  // returns {node, read(): choices[], apply()}
  const node = el('div');
  const chosen = qs.map(() => null);
  const groups = qs.map((q, qi) => {
    const block = el('div', { class: 'qblock' });
    block.append(el('p', { class: 'qt' }, (qi + 1) + '. ' + q.q));
    const opts = el('div', { class: 'opts' });
    const btns = q.o.map((o, j) => { const b = el('button', { class: 'opt', type: 'button' }, el('span', { class: 'k' }, LET[j]), el('span', {}, o)); opts.append(b); return b; });
    const fbWrap = el('div');
    block.append(opts, fbWrap);
    if (!done) btns.forEach((b, j) => b.addEventListener('click', () => { chosen[qi] = j; btns.forEach((x, k) => x.classList.toggle('chosen', k === j)); }));
    node.append(block);
    return { btns, fbWrap };
  });
  return {
    node,
    read: () => chosen,
    apply: () => qs.forEach((q, qi) => { const rec = ctx.get(qi); const g = groups[qi]; g.btns.forEach((b, j) => { b.disabled = true; b.classList.remove('chosen'); if (j === q.a) b.classList.add('ok'); else if (j === rec.choice) b.classList.add('bad'); }); g.fbWrap.replaceChildren(fbNode(rec.ok, [q.o[q.a]], q.e)); })
  };
}
function checkQuestions(qs, qb, ctx, promptPrefix){
  const ch = qb.read();
  qs.forEach((q, qi) => { const c = ch[qi]; ctx.set(qi, { ok: c === q.a, choice: c, user: c == null ? '(blank)' : q.o[c], answers: [q.o[q.a]], prompt: (promptPrefix || '') + q.q, exp: q.e, t: 'q' }); });
}

function rReading(it, ctx){
  const wrap = el('div', { class: 'item' });
  const pass = el('div', { class: 'passage' });
  if (it.title) pass.append(el('h4', {}, it.title));
  buildPassage(pass, it.text, () => document.createTextNode(''), true);
  const done = !!ctx.get(0);
  const qb = questionBlocks(it.qs, ctx, done);
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all answers');
  wrap.append(pass, qb.node, el('div', { class: 'row' }, btn));
  if (done){ qb.apply(); btn.remove(); }
  else btn.addEventListener('click', () => { checkQuestions(it.qs, qb, ctx, ''); qb.apply(); btn.remove(); ctx.onDone && ctx.onDone(); });
  return wrap;
}

function rLmcq(it, ctx){
  const r = ctx.get(0);
  const wrap = el('div', { class: 'item' });
  if (it.pre) wrap.append(el('p', { class: 'instructions' }, it.pre));
  const player = makePlayer(it);
  wrap.append(player.node);
  wrap.append(el('p', { class: 'q small' }, it.q));
  const opts = el('div', { class: 'opts' });
  const btns = it.o.map((o, j) => { const b = el('button', { class: 'opt', type: 'button', 'data-opt': j }, el('span', { class: 'k' }, LET[j]), el('span', {}, o)); opts.append(b); return b; });
  const fbWrap = el('div');
  wrap.append(opts, fbWrap);
  function apply(rec){ btns.forEach((b, j) => { b.disabled = true; if (j === it.a) b.classList.add('ok'); else if (j === rec.choice) b.classList.add('bad'); }); fbWrap.replaceChildren(fbNode(rec.ok, [it.o[it.a]], it.e)); player.reveal(); }
  if (r) apply(r);
  else btns.forEach((b, j) => b.addEventListener('click', () => {
    const rec = { ok: j === it.a, choice: j, user: it.o[j], answers: [it.o[it.a]], prompt: '(' + it.label + ') ' + it.q, exp: it.e, t: 'mcq' };
    ctx.set(0, rec); apply(rec); ctx.onDone && ctx.onDone();
  }));
  return wrap;
}

function rLext(it, ctx){
  const wrap = el('div', { class: 'item' });
  if (it.pre) wrap.append(el('p', { class: 'instructions' }, it.pre));
  const player = makePlayer(it);
  const done = !!ctx.get(0);
  const qb = questionBlocks(it.qs, ctx, done);
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all answers');
  wrap.append(player.node, qb.node, el('div', { class: 'row' }, btn));
  if (done){ qb.apply(); btn.remove(); player.reveal(); }
  else btn.addEventListener('click', () => { checkQuestions(it.qs, qb, ctx, '(' + it.label + ') '); qb.apply(); btn.remove(); player.reveal(); ctx.onDone && ctx.onDone(); });
  return wrap;
}

function rLcomp(it, ctx){
  const wrap = el('div', { class: 'item' });
  if (it.pre) wrap.append(el('p', { class: 'instructions' }, it.pre));
  const player = makePlayer(it);
  const list = el('div', { class: 'sentlist' });
  const inputs = it.sentences.map((s, j) => {
    const parts = s.s.split('___');
    const inp = gapInput('wide');
    list.append(el('div', {}, el('span', { class: 'gapnum' }, String(j + 1)), parts[0], inp, parts[1] || ''));
    return inp;
  });
  const btn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'check' }, 'Check all answers');
  const fbWrap = el('div', { class: 'fb-list' });
  wrap.append(player.node, list, el('div', { class: 'row' }, btn), fbWrap);
  function apply(){
    it.sentences.forEach((s, j) => { const rec = ctx.get(j); const inp = inputs[j]; setGapValue(inp, rec.user === '(blank)' ? '' : rec.user); inp.disabled = true; inp.classList.add(rec.ok ? 'ok' : 'bad'); fbWrap.append(fbNode(rec.ok, [s.a[0]], s.e, (j + 1) + '.')); });
    btn.remove(); player.reveal();
  }
  if (ctx.get(0)) apply();
  else {
    btn.addEventListener('click', () => {
      it.sentences.forEach((s, j) => { const user = inputs[j].value.trim(); ctx.set(j, { ok: matchAnswer(user, s.a, 'any'), user: user || '(blank)', answers: [s.a[0]], prompt: s.s.replace('___', '_____'), exp: s.e, t: 'gap' }); });
      apply(); ctx.onDone && ctx.onDone();
    });
    inputs.forEach((inp, j) => inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return; e.preventDefault(); e.stopPropagation();
      const next = inputs.find((x, k) => k > j && !x.value.trim()) || inputs.find(x => !x.value.trim());
      if (next) next.focus(); else btn.click();
    }));
  }
  return wrap;
}

const RENDER = { typed: rTyped, mcq: rMcq, ptyped: rPTyped, pmcq: rPMcq, missing: rMissing, reading: rReading, lmcq: rLmcq, lext: rLext, lcomp: rLcomp };

/* ---------- screens ---------- */
const mainEl = () => document.getElementById('main');

function ctxFor(m, i, onDone){
  return {
    get: sub => state.res[keyOf(m.id, i, sub || 0)],
    set: (sub, rec) => record(keyOf(m.id, i, sub), Object.assign({ mid: m.id, i: i, sub: sub }, rec)),
    onDone
  };
}

function renderModule(mid){
  TTS.stop();
  const m = byId(mid);
  state.cur = mid;
  const main = mainEl();
  main.replaceChildren();
  refreshNav();
  if (m.kind === 'info') return renderInfo(m);
  if (m.kind === 'review') return renderReview(m);
  if (m.kind === 'summary') return renderSummary(m);
  renderItems(m);
  window.scrollTo({ top: 0 });
}

function moduleHead(m){
  const st = moduleStats(m);
  const spent = state.modTime[m.id] || 0;
  const meta = el('div', { class: 'meta' });
  meta.append(el('div', {}, 'Suggested ', el('b', {}, m.minutes + ' min'), ' · spent ', el('b', { 'data-role': 'spent' }, fmtTime(spent))));
  if (m.kind === 'items') meta.append(el('div', {}, 'Score ', el('b', {}, st.correct + ' / ' + st.answered), ' answered of ', st.total));
  return el('div', { class: 'mod-head' }, el('h2', {}, m.title), meta);
}

function renderItems(m){
  const main = mainEl();
  const i = state.idx[m.id] || 0;
  const n = m.items.length;
  const card = el('div', { class: 'card' });
  card.append(moduleHead(m));
  if (m.instructions) card.append(el('p', { class: 'instructions' }, m.instructions));
  const st = moduleStats(m);
  card.append(el('div', { class: 'progress' }, el('i', { style: 'width:' + (st.total ? (100 * st.answered / st.total) : 0) + '%' })));
  main.append(card);

  if (i >= n){ renderModuleSummary(m, card); return; }

  const it = m.items[i];
  const counter = el('div', { class: 'counter' });
  counter.append(el('span', {}, 'Screen ' + (i + 1) + ' of ' + n + (itemPoints(it) > 1 ? ' · ' + itemPoints(it) + ' answers' : '')));
  const nextBtn = el('button', { class: 'btn primary', type: 'button', 'data-role': 'next' }, i === n - 1 ? 'Finish module →' : 'Next →');
  const prevBtn = el('button', { class: 'btn ghost', type: 'button' }, '← Previous');
  prevBtn.disabled = i === 0;
  prevBtn.addEventListener('click', () => { state.idx[m.id] = i - 1; renderModule(m.id); });
  nextBtn.addEventListener('click', () => { state.idx[m.id] = i + 1; renderModule(m.id); });
  nextBtn.disabled = !isAnswered(m, i);
  if (!isAnswered(m, i)){
    const skip = el('button', { class: 'skip', type: 'button' }, 'skip for now');
    skip.addEventListener('click', () => { state.idx[m.id] = i + 1; renderModule(m.id); });
    counter.append(skip);
  }
  card.append(counter);
  const ctx = ctxFor(m, i, () => { nextBtn.disabled = false; nextBtn.focus({ preventScroll: true }); const sk = counter.querySelector('.skip'); if (sk) sk.remove(); card.querySelector('.progress i').style.width = (100 * moduleStats(m).answered / moduleTotal(m)) + '%'; card.replaceChild(moduleHead(m), card.querySelector('.mod-head')); });
  const node = RENDER[it.t](it, ctx);
  card.append(node);
  card.append(el('div', { class: 'row', style: 'justify-content:space-between;margin-top:18px' }, prevBtn, nextBtn));
  const KB = { mcq: 'Keys: 1–4 choose · Enter next', lmcq: 'Keys: 1–3 choose · Enter next', typed: 'Keys: Enter check · Enter again next', ptyped: 'Keys: Enter jumps to the next empty gap, then checks · Enter next', lcomp: 'Keys: Enter jumps to the next empty gap, then checks · Enter next' };
  card.append(el('div', { class: 'kbd' }, KB[it.t] || 'Choose every gap or question, then Check · Enter next'));
  if (ctx.focus) setTimeout(ctx.focus, 30);
}

function renderModuleSummary(m, card){
  const st = moduleStats(m);
  const pct = st.answered ? Math.round(100 * st.correct / st.answered) : 0;
  const box = el('div', { class: 'mod-summary' });
  box.append(el('div', { class: 'score' }, st.correct + ' / ' + st.total));
  const unanswered = st.total - st.answered;
  box.append(el('p', {}, (st.answered ? pct + '% of what you answered' : 'Nothing answered yet') + (unanswered ? ' · ' + unanswered + ' unanswered' : '') + ' · time on this module ' + fmtTime(state.modTime[m.id] || 0) + ' (suggested ' + m.minutes + ')'));
  const row = el('div', { class: 'row', style: 'justify-content:center' });
  const back = el('button', { class: 'btn ghost', type: 'button' }, '← Back to the last screen');
  back.addEventListener('click', () => { state.idx[m.id] = m.items.length - 1; renderModule(m.id); });
  const nextM = nextModuleOf(m);
  const go = el('button', { class: 'btn primary', type: 'button', 'data-role': 'next' }, nextM ? 'Next: ' + nextM.title + ' →' : 'Session summary →');
  go.addEventListener('click', () => renderModule(nextM ? nextM.id : 'summary'));
  row.append(back, go);
  box.append(row);
  card.append(box);
  const wrong = wrongRecords().filter(r => r.mid === m.id);
  if (wrong.length){
    const c2 = el('div', { class: 'card' }, el('h3', { style: 'margin-top:0' }, 'What you missed in this module (' + wrong.length + ')'));
    wrong.forEach(r => c2.append(flashcard(r)));
    mainEl().append(c2);
  }
}
function nextModuleOf(m){
  const i = MODULES.indexOf(m);
  for (let j = i + 1; j < MODULES.length; j++) if (MODULES[j].kind === 'items') return MODULES[j];
  return null;
}

function renderInfo(m){
  const card = el('div', { class: 'card' });
  card.append(el('div', { class: 'mod-head' }, el('h2', {}, m.title)));
  const body = el('div', { html: m.html });
  card.append(body);
  mainEl().append(card);
  const start = body.querySelector('#startHour');
  if (start) start.addEventListener('click', () => { startTimer(false); renderModule('prep'); toast('Clock running — 60:00. Go.'); });
  window.scrollTo({ top: 0 });
}

function wrongRecords(){
  const out = [];
  MODULES.forEach(m => { if (m.kind !== 'items') return;
    m.items.forEach((it, i) => { for (let sub = 0; sub < itemPoints(it); sub++){ const r = state.res[keyOf(m.id, i, sub)]; if (r && !r.ok) out.push(r); } });
  });
  return out;
}
function flashcard(r){
  const f = el('div', { class: 'flash' });
  f.append(el('div', { class: 'ctx' }, r.prompt));
  f.append(el('div', {}, el('span', { class: 'u' }, r.user), el('span', { class: 'c' }, r.answers[0])));
  if (r.exp) f.append(el('div', { class: 'e' }, r.exp));
  return f;
}

function renderReview(m){
  const main = mainEl();
  const card = el('div', { class: 'card' });
  card.append(el('div', { class: 'mod-head' }, el('h2', {}, m.title)));
  const wrong = wrongRecords();
  if (!wrong.length){
    card.append(el('p', { class: 'lead' }, 'Nothing here yet. Mistakes from every drill collect on this page, with a retry for each one.'));
    main.append(card); return;
  }
  let retried = 0, fixed = 0;
  for (const k in state.retryRes){ retried++; if (state.retryRes[k].ok) fixed++; }
  card.append(el('p', { class: 'lead' }, wrong.length + ' mistake' + (wrong.length === 1 ? '' : 's') + ' so far. Single-sentence items can be retried below; passage questions are shown as flashcards.' + (retried ? ' Retried ' + retried + ', fixed ' + fixed + '.' : '')));
  const resetBtn = el('button', { class: 'btn ghost', type: 'button' }, 'Clear retries');
  resetBtn.addEventListener('click', () => { state.retryRes = {}; renderModule('review'); });
  if (retried) card.append(el('div', { class: 'row' }, resetBtn));
  main.append(card);
  MODULES.forEach(mod => {
    const items = wrong.filter(r => r.mid === mod.id);
    if (!items.length) return;
    const g = el('div', { class: 'card review-group' });
    g.append(el('h3', { style: 'margin-top:0' }, mod.title, el('span', { class: 'pill bad' }, items.length + ' wrong')));
    items.forEach(r => {
      const it = mod.items[r.i];
      if (r.t === 'typed' || (r.t === 'mcq' && (it.t === 'mcq' || it.t === 'lmcq'))){
        const key = 'r:' + keyOf(mod.id, r.i, r.sub);
        const box = el('div', { class: 'retry' });
        const rr = state.retryRes[key];
        box.append(el('div', { class: 'muted', style: 'font-size:13px;margin-bottom:6px' }, 'Retry — you answered ', el('span', { class: 'u', style: 'color:var(--bad);text-decoration:line-through' }, r.user), rr ? el('span', { class: 'pill ' + (rr.ok ? 'ok' : 'bad') }, rr.ok ? 'fixed' : 'still wrong') : ''));
        const ctx = { get: () => state.retryRes[key], set: (sub, rec) => { record(key, rec, true); }, onDone: () => { const p = box.querySelector('.pill'); if (p) p.remove(); const rr2 = state.retryRes[key]; box.firstChild.append(el('span', { class: 'pill ' + (rr2.ok ? 'ok' : 'bad') }, rr2.ok ? 'fixed' : 'still wrong')); } };
        const renderer = it.t === 'lmcq' ? rMcq : RENDER[it.t];
        const itemForRetry = it.t === 'lmcq' ? Object.assign({}, it, { q: it.q, prompt: null }) : it;
        box.append(renderer(itemForRetry, ctx));
        g.append(box);
      } else g.append(flashcard(r));
    });
    main.append(g);
  });
  window.scrollTo({ top: 0 });
}

function renderSummary(m){
  const main = mainEl();
  const card = el('div', { class: 'card' });
  card.append(el('div', { class: 'mod-head' }, el('h2', {}, m.title)));
  const all = allStats();
  const pct = all.answered ? Math.round(100 * all.correct / all.answered) : 0;
  const used = state.timer.total - state.timer.remaining;
  const stats = el('div', { class: 'bigstat' });
  stats.append(el('div', {}, el('b', {}, pct + '%'), el('span', {}, 'accuracy on answered items')));
  stats.append(el('div', {}, el('b', {}, all.correct + ' / ' + all.answered), el('span', {}, 'correct / answered (of ' + all.total + ')')));
  stats.append(el('div', {}, el('b', {}, fmtTime(used)), el('span', {}, 'of the hour used')));
  card.append(stats);
  const grid = el('div', { class: 'scoregrid' });
  const ranked = [];
  MODULES.forEach(mod => {
    if (mod.kind !== 'items') return;
    const s = moduleStats(mod);
    const p = s.answered ? Math.round(100 * s.correct / s.answered) : 0;
    if (s.answered >= 5) ranked.push({ mod, p });
    const sc = el('div', { class: 'scorecard' });
    sc.append(el('b', {}, mod.title));
    sc.append(el('div', { class: 'bar' }, el('i', { class: p >= 80 ? '' : (p >= 60 ? 'mid' : 'low'), style: 'width:' + (s.answered ? p : 0) + '%' })));
    sc.append(el('small', {}, s.answered ? (s.correct + ' / ' + s.answered + ' answered · ' + p + '%' + (s.answered < s.total ? ' · ' + (s.total - s.answered) + ' left' : '')) : 'not started'));
    grid.append(sc);
  });
  card.append(grid);
  ranked.sort((a, b) => a.p - b.p);
  if (ranked.length){
    const weak = ranked.slice(0, 2).filter(x => x.p < 85);
    if (weak.length) card.append(el('p', {}, el('b', {}, 'Where to spend your last ten minutes: '), weak.map(x => x.mod.title + ' (' + x.p + '%)').join(' and ') + '. Open the mistakes review and read the explanations again, then skim the matching reference sheet.'));
    else card.append(el('p', {}, el('b', {}, 'Strong across the board. '), 'Reread the game plan tactics, skim the reference sheets, and stop early — rest is the best thing you can do now.'));
  }
  const row = el('div', { class: 'row' });
  const b1 = el('button', { class: 'btn primary', type: 'button' }, 'Mistakes review'); b1.addEventListener('click', () => renderModule('review'));
  const b2 = el('button', { class: 'btn', type: 'button' }, 'Reference sheets'); b2.addEventListener('click', () => renderModule('ref'));
  row.append(b1, b2);
  card.append(row);
  main.append(card);
  window.scrollTo({ top: 0 });
}

/* ---------- nav / header ---------- */
function refreshNav(){
  const nav = document.getElementById('nav');
  if (!nav) return;
  nav.replaceChildren();
  let num = 0;
  MODULES.forEach(m => {
    num++;
    const b = el('button', { class: 'navbtn', type: 'button' });
    const st = m.kind === 'items' ? moduleStats(m) : null;
    const done = st && st.answered >= st.total && st.total > 0;
    if (m.id === state.cur) b.classList.add('active');
    if (done) b.classList.add('done');
    let sub = '';
    if (st) sub = (st.answered ? st.correct + '/' + st.answered + ' · ' : '') + (st.answered < st.total ? (st.total - st.answered) + ' left · ' : '') + m.minutes + ' min';
    else if (m.kind === 'review'){ const w = wrongRecords().length; sub = w ? w + ' to review' : 'collects your mistakes'; }
    else if (m.kind === 'summary') sub = 'scores by module';
    else sub = m.id === 'plan' ? 'read first · ' + m.minutes + ' min' : 'tables to skim';
    b.append(el('span', { class: 'num' }, done ? '✓' : String(num)), el('span', { class: 'lbl' }, el('b', {}, m.short || m.title), el('span', {}, sub)));
    b.addEventListener('click', () => renderModule(m.id));
    nav.append(b);
  });
}
function refreshOverall(){
  const o = document.getElementById('overall');
  const s = allStats();
  o.replaceChildren(el('span', {}, 'Answered ', el('b', {}, s.answered + '/' + s.total), s.answered ? ' · ' : ''), s.answered ? el('span', {}, el('b', {}, Math.round(100 * s.correct / s.answered) + '%'), ' correct') : '');
}

/* ---------- timer ---------- */
function startTimer(silent){
  const t = state.timer;
  if (t.done) return;
  t.started = true; t.running = true; t.last = Date.now();
  refreshTimer();
  if (!silent) toast('Clock running — ' + fmtTime(t.remaining));
}
function pauseTimer(){ state.timer.running = false; refreshTimer(); }
function tick(){
  const t = state.timer;
  if (!t.running) return;
  const now = Date.now(); const dt = (now - t.last) / 1000; t.last = now;
  t.remaining = Math.max(0, t.remaining - dt);
  state.modTime[state.cur] = (state.modTime[state.cur] || 0) + dt;
  const spent = document.querySelector('[data-role="spent"]'); if (spent) spent.textContent = fmtTime(state.modTime[state.cur] || 0);
  if (t.remaining <= 0){ t.running = false; t.done = true; toast("Time's up. Finish this screen, then open the summary."); }
  refreshTimer();
}
function refreshTimer(){
  const t = state.timer;
  const box = document.getElementById('timer');
  const d = box.querySelector('.digits'); d.textContent = fmtTime(t.remaining);
  box.classList.toggle('warn', t.remaining <= 600 && t.remaining > 180);
  box.classList.toggle('danger', t.remaining <= 180);
  const b = box.querySelector('[data-role="toggle"]');
  b.textContent = t.done ? 'Done' : (t.running ? 'Pause' : (t.started ? 'Resume' : 'Start'));
  b.disabled = t.done;
}
function resetAll(){
  if (!confirm('Reset the whole session? All answers and the clock will be cleared.')) return;
  state.idx = {}; state.res = {}; state.retryRes = {}; state.modTime = {};
  state.timer = { total: 3600, remaining: 3600, running: false, started: false, last: 0, done: false };
  refreshTimer(); refreshOverall(); renderModule('plan');
}
let toastT = null;
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = el('div', { id: 'toast', class: 'toast' }); document.body.append(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
  const main = mainEl(); if (!main) return;
  if (e.key === 'Enter'){
    const check = main.querySelector('button[data-role="check"]');
    if (check && !check.disabled){ check.click(); e.preventDefault(); return; }
    const next = main.querySelector('button[data-role="next"]');
    if (next && !next.disabled){ next.click(); e.preventDefault(); }
    return;
  }
  if (/^[1-4]$/.test(e.key)){
    const item = main.querySelector('.item');
    if (!item) return;
    const opts = item.querySelectorAll('.opts');
    if (opts.length !== 1) return;
    const btn = opts[0].querySelectorAll('button.opt')[parseInt(e.key, 10) - 1];
    if (btn && !btn.disabled){ btn.click(); e.preventDefault(); }
  }
});

/* ---------- boot ---------- */
function boot(){
  const app = document.getElementById('app');
  app.replaceChildren();
  const timer = el('div', { id: 'timer', class: 'timer' }, el('span', { class: 'digits' }, '60:00'));
  const tBtn = el('button', { type: 'button', 'data-role': 'toggle' }, 'Start');
  tBtn.addEventListener('click', () => { state.timer.running ? pauseTimer() : startTimer(false); });
  const rBtn = el('button', { type: 'button', class: 'secondary', title: 'Reset everything' }, '↺');
  rBtn.addEventListener('click', resetAll);
  timer.append(tBtn, rBtn);
  const top = el('div', { class: 'topbar' }, el('div', { class: 'topbar-inner' },
    el('div', { class: 'brand' }, 'Linguaskill Power Hour', el('small', {}, 'Reading & Listening · C1 target')),
    el('div', { class: 'spacer' }),
    el('div', { id: 'overall', class: 'overall' }),
    timer));
  const shell = el('div', { class: 'shell' }, el('nav', { id: 'nav', class: 'side', 'aria-label': 'Modules' }), el('main', { id: 'main' }));
  app.append(top, shell);
  refreshOverall(); refreshTimer();
  renderModule('plan');
  setInterval(tick, 250);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
